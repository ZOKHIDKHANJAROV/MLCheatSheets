  state = loadState();
  if (!state.gam) gamSeed();
  closeModal(); render(); refreshChrome();
}
async function openAuth(mode = "login", msg = "", name = "") {
  await detectServer();
  const reg = mode === "register";
  showModal(`<h2>${reg ? "Создать профиль" : "Вход в профиль"}</h2>
    <div class="gx-tabs"><button class="btn ${reg ? "" : "on"}" data-gx="tab" data-mode="login">Вход</button><button class="btn ${reg ? "on" : ""}" data-gx="tab" data-mode="register">Регистрация</button></div>
    <p class="note">${reg ? "Уровень, XP и награды запишутся в профиль, а прогресс из этого браузера перейдёт в него. " : ""}${serverMode
      ? "Профиль хранится на сервере портала — войти можно с любого устройства."
      : "Профиль хранится только в этом браузере (сервера портала нет). Запустите <code>python start.py</code>, чтобы профили были общими."}</p>
    <form class="gx-form" id="authForm" data-mode="${mode}" autocomplete="on">
      <label for="gxName">Имя</label>
      <input id="gxName" name="uname" value="${esc(name)}" autocomplete="username" maxlength="24" required ${name ? "" : "autofocus"}>
      <label for="gxPin">PIN (4–32 символа)</label>
      <input id="gxPin" name="pin" type="password" autocomplete="${reg ? "new-password" : "current-password"}" maxlength="32" required ${name ? "autofocus" : ""}>
      <div class="gx-err" id="authErr" role="alert">${esc(msg)}</div>
      <div class="gx-actions"><button class="cta" type="submit">${reg ? "Создать профиль" : "Войти"}</button><button class="btn" type="button" data-gx="close">Продолжить как гость</button></div>
    </form>
    ${reg ? '<p class="note">PIN восстановить нельзя — запомните его.</p>' : ""}`);
}

function renderLevelChip() {
  const g = gamStats(), cur = g.lv.cur, next = g.lv.next, btn = document.getElementById("lvlBtn");
  btn.innerHTML = `${cur.icon} <b>${cur.n}</b><span class="gx-mini"><i style="width:${g.lv.pct}%"></i></span><span class="gx-xp-txt">${fmtXp(g.xp)} XP</span>`;
  btn.title = `Уровень ${cur.n} · ${cur.name}: ${fmtXp(g.xp)} XP` + (next ? `. До «${next.name}» — ещё ${fmtXp(next.xp - g.xp)} XP` : "");
  const u = document.getElementById("userBtn"), expired = session && !session.token && !session.local;
  u.innerHTML = session ? `👤<span class="gx-uname"> ${esc(session.name)}${expired || syncInfo.s === "err" ? " ⚠" : ""}</span>` : `👤<span class="gx-uname"> Войти</span>`;
  u.title = session ? `Профиль «${session.name}»` + (syncText() ? " — " + syncText() : "") : "Войти или создать профиль: уровень запишется в профиль";
}

function goalList(g) {   // ближайший непройденный этап каждого пути
  return DATA.paths.map((p, pi) => g.stages.find(s => s.pi === pi && !s.done)).filter(Boolean);
}
function levelCard() {
  const g = gamStats(), goals = goalList(g).sort((a, b) => a.left - b.left).slice(0, 1);
  return `<h2>🏅 Ваш уровень</h2>
    <div class="card gx-card">
      <div class="gx-row"><span class="gx-big">${g.lv.cur.icon}</span>
        <div><b>Уровень ${g.lv.cur.n} · ${esc(g.lv.cur.name)}</b><div class="meta">${esc(g.lv.cur.msg)}</div></div></div>
      ${levelBar(g)}
      ${goals.map(s => `<div class="meta">🎯 Ближайшая цель: <a href="${stageHref(s)}">${esc(s.title)}</a> — ${s.left ? `осталось ${s.left} ${plural(s.left, "тема", "темы", "тем")}` : "осталось отметить"} · +${XP.stage} XP</div>`).join("")}
      <div class="gx-actions"><a class="btn" href="#/me">🏅 Профиль и награды</a>
        ${session ? `<span class="meta">👤 ${esc(session.name)}</span>` : `<button class="btn" data-gx="auth" data-mode="register">👤 Войти или создать профиль</button><span class="meta">Без входа уровень виден только вам и только в этом браузере.</span>`}</div>
    </div>`;
}
function viewProfile() {
  const g = gamStats(), lv = g.lv, expired = session && !session.token && !session.local;
  const account = session
    ? `<div class="card"><b>👤 ${esc(session.name)}</b><div class="meta" id="syncInfo">${esc(syncText())}</div>
        <div class="gx-actions">${expired ? `<button class="cta" data-gx="auth" data-mode="login" data-name="${esc(session.name)}">Войти снова</button>` : ""}<button class="btn" data-gx="logout">Выйти</button></div></div>`
    : `<div class="card"><b>👤 Вы не вошли</b>
        <div class="meta">Прогресс и уровень лежат только в этом браузере и пропадут, если очистить данные сайта. Войдите (имя и PIN), и уровень запишется в профиль${serverMode ? " — его увидите с любого устройства" : ""}.</div>
        <div class="gx-actions"><button class="cta" data-gx="auth" data-mode="register">Создать профиль</button><button class="btn" data-gx="auth" data-mode="login">Войти</button></div></div>`;
  const goals = goalList(g);
  const earned = g.badges.filter(b => b.earned).length;
  return `<div class="page">
    <h1>🏅 Профиль</h1>
    ${account}
    <h2>Уровень</h2>
    <div class="card"><div class="gx-row"><span class="gx-big">${lv.cur.icon}</span>
      <div><b style="font-size:19px">Уровень ${lv.cur.n} · ${esc(lv.cur.name)}</b><div class="meta">${esc(lv.cur.msg)}</div></div></div>${levelBar(g)}</div>
    <h2>🎯 Ближайшие цели</h2>
    ${goals.length ? goals.map(s => `<div class="gx-goal"><div><a href="${stageHref(s)}"><b>${esc(s.title)}</b></a>
        <div class="meta">${esc(DATA.paths[s.pi].title)} · ${s.left ? `осталось ${s.left} ${plural(s.left, "тема", "темы", "тем")}` : "осталось отметить"}</div></div><span class="gx-gain">+${XP.stage} XP</span></div>`).join("")
      : `<p class="note">🎓 Все этапы всех путей пройдены!</p>`}
    <h2>🎖 Награды · ${earned} из ${g.badges.length}</h2>
    <div class="gx-badges">${g.badges.map(b => `<div class="gx-badge ${b.earned ? "on" : ""}"><span>${b.icon}</span><b>${esc(b.name)}</b><small>${esc(b.desc)}</small></div>`).join("")}</div>
    <h2>🗺 Этапы по путям</h2>
    <div class="cards">${DATA.paths.map((p, pi) => {
      const st = g.stages.filter(s => s.pi === pi), all = st.length && st.every(s => s.done);
      return `<div class="card"><b>${all ? "🏅 " : ""}${esc(p.title)}</b><div class="meta">Пройдено этапов: ${st.filter(s => s.done).length} из ${st.length} · ⭐ — и все упражнения решены</div>
        <div class="gx-stages">${st.map(s => `<a class="gx-dot ${s.star ? "star" : s.done ? "on" : ""}" href="#/p/${pi}" title="${esc(s.title)}">${s.star ? "⭐" : s.done ? "✔" : "○"}</a>`).join("")}</div></div>`;
    }).join("")}</div>
    <h2>🧮 Откуда берётся XP</h2>
    <table class="gx-table">${g.rows.map(r => `<tr><td>${r.icon} ${esc(r.label)}<div class="meta">${esc(r.per)}</div></td><td>${r.n}</td><td>${fmtXp(r.xp)} XP</td></tr>`).join("")}
      <tr><td><b>Итого</b></td><td></td><td>${fmtXp(g.xp)} XP</td></tr></table>
    <p class="note">XP считается из вашего прогресса: если снять отметку «Изучено», очки за неё вернутся. Награды остаются навсегда.</p>
    <h2>🪜 Уровни</h2>
    <table class="gx-table">${LEVELS.map(l => `<tr class="${l.n === lv.cur.n ? "cur" : ""}"><td>${l.icon} <b>${l.n}. ${esc(l.name)}</b>${l.n === lv.cur.n ? " ← вы здесь" : ""}</td><td>${fmtXp(l.xp)} XP</td></tr>`).join("")}</table>
  </div>`;
}

document.addEventListener("click", e => {
  if (e.target.id === "overlay") { closeModal(); return; }
  const t = e.target.closest("[data-gx]");
  if (!t) return;
  const a = t.dataset.gx;
  if (a === "close") closeModal();                       // ссылки с data-gx="close" ещё и переходят по href
  else if (a === "auth") { e.preventDefault(); openAuth(t.dataset.mode || "login", "", t.dataset.name || ""); }
  else if (a === "tab") { const f = document.getElementById("authForm"); openAuth(t.dataset.mode, "", f ? f.elements.uname.value : ""); }
  else if (a === "logout") logout();
  else if (a === "user") { if (session) location.hash = "#/me"; else openAuth("login"); }
});
document.addEventListener("submit", e => {
  if (e.target.id === "authForm") { e.preventDefault(); authSubmit(e.target); }
});

// ---------- события ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-toggle],[data-ex],[data-copy],[data-action],[data-tab-link],[data-qtoggle],[data-rate],[data-theme-toggle],[data-proj],[data-plan],[data-plan-path],[data-plan-min],[data-exam],[data-exam-src],[data-exam-size],[data-hint],[data-reveal],[data-ex-again],[data-und],[data-und-reset],[data-lec],[data-qopen],#menuBtn");
  if (!t) return;
  if (t.id === "menuBtn") { document.body.classList.toggle("menu-open"); return; }
  if (t.dataset.proj) { const id = t.dataset.proj; if (state.projDone[id]) delete state.projDone[id]; else state.projDone[id] = Date.now(); save(); rerenderKeepScroll(); return; }
  if (t.dataset.planPath) { planSetup.path = +t.dataset.planPath; render(); return; }
  if (t.dataset.planMin) { planSetup.minutes = +t.dataset.planMin; render(); return; }
  if (t.dataset.plan) { planAction(t.dataset.plan); return; }
  if (t.dataset.examSrc) { examSetup.source = t.dataset.examSrc; render(); return; }
  if (t.dataset.examSize) { examSetup.size = +t.dataset.examSize; render(); return; }
  if (t.dataset.exam) { examAction(t.dataset.exam); return; }
  if (t.hasAttribute("data-theme-toggle")) {
    const order = ["auto", "light", "dark"];
    window.mlcsTheme.set(order[(order.indexOf(window.mlcsTheme.get()) + 1) % order.length]);
    renderThemeButton();
    return;
  }
  if (t.dataset.tab) setTab(t.dataset.tab);
  if (t.dataset.tabLink) { e.preventDefault(); setTab(t.dataset.tabLink); document.body.classList.add("menu-open"); }
  if (t.dataset.toggle) { toggleDone(t.dataset.toggle); rerenderKeepScroll(); }
  if (t.hasAttribute("data-qtoggle")) {
    state.qOpen = !state.qOpen; save();
    document.querySelector(".viewer").classList.toggle("qopen", state.qOpen);
  }
  if (t.dataset.rate) {
    rate(t.dataset.topic, t.dataset.rate === "1");
    if (parseHash().parts[0] === "r") render(); else rerenderKeepScroll();
  }
  if (t.dataset.ex) { const id = t.dataset.ex; if (state.exDone[id]) unmarkEx(id); else markExSolved(id, Date.now()); save(); rerenderKeepScroll(); refreshChrome(); }
  if (t.dataset.exAgain) { markExSolved(t.dataset.exAgain, Date.now()); save(); rerenderKeepScroll(); refreshChrome(); }
  if (t.dataset.und) {
    const [i, k] = t.dataset.und.split(":").map(Number), u = UND[i];
    state.und[u.id] = { pick: k, ok: k === u.answer, t: Date.now() }; logActivity(); save(); rerenderKeepScroll(); refreshChrome();
  }
  if (t.dataset.lec) { const f = t.dataset.lec; if (state.lec[f]) delete state.lec[f]; else { state.lec[f] = Date.now(); logActivity(); } save(); rerenderKeepScroll(); refreshChrome(); }
  if (t.hasAttribute("data-qopen")) { state.qOpen = true; save(); }   // ссылка ведёт к шпаргалке с открытыми вопросами
  if (t.dataset.undReset) { delete state.und[UND[+t.dataset.undReset].id]; save(); rerenderKeepScroll(); }
  if (t.dataset.hint) { const id = t.dataset.hint; state.hints[id] = (state.hints[id] || 0) + 1; save(); rerenderKeepScroll(); }
  if (t.dataset.reveal && confirm("Разбор раскрывает решение. Сначала попробуйте ещё раз с подсказками — показать всё равно?")) {
    state.reveal[t.dataset.reveal] = Date.now(); save(); rerenderKeepScroll();
  }
  if (t.dataset.copy) { navigator.clipboard && navigator.clipboard.writeText(t.dataset.copy).then(() => { t.textContent = "Скопировано ✔"; }); }
  if (t.dataset.action) action(t.dataset.action);
});
document.addEventListener("input", e => {
  if (e.target.id === "glossFilter") {
    glossaryQuery = e.target.value; const pos = e.target.selectionStart;
    render(); const inp = document.getElementById("glossFilter"); inp.focus(); inp.setSelectionRange(pos, pos);
    return;
  }
  const f = e.target.dataset && e.target.dataset.note;
  if (!f) return;
  const text = e.target.value;
  if (text.trim()) state.notes[f] = { text, t: Date.now() }; else delete state.notes[f];
  save();
  const mark = document.getElementById("noteMark");
  if (mark) mark.textContent = text.trim() ? " · 📝" : "";
});
document.addEventListener("change", e => {
  if (e.target.id === "planDeadline") { planSetup.deadline = e.target.value || ""; render(); return; }
  if (e.target.dataset.done) { toggleDone(e.target.dataset.done, e.target.checked); rerenderKeepScroll(); }
});

function action(name) {
  if (name === "review") {
    const done = Object.keys(state.done).filter(f => DATA.titles[f]);
    const pool = done.length ? done : allTopics;
    location.hash = "#/t/" + encodeURIComponent(pool[Math.floor(Math.random() * pool.length)]);
  } else if (name === "export") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 1)], { type: "application/json" }));
    a.download = "ml-cheatsheets-progress.json"; a.click();
  } else if (name === "import") {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json";
    inp.onchange = () => inp.files[0].text().then(txt => {
      try { const s = JSON.parse(txt); state = Object.assign(loadState(), s); save(); render(); alert("Прогресс загружен"); }
      catch (err) { alert("Не удалось прочитать файл прогресса"); }
    });
    inp.click();
  } else if (name === "reset" && confirm("Сбросить весь прогресс (заметки сохранятся)? Это нельзя отменить (если не сохранили файл).")) {
    state = Object.assign(emptyState(), { notes: state.notes, tab: state.tab, qOpen: state.qOpen }); save(); render(); refreshChrome();   // заметки не трогаем
  }
}

const search = document.getElementById("search");
let searchTimer;
search.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { location.hash = search.value.trim() ? "#/q/" + encodeURIComponent(search.value.trim()) : "#/"; }, 150);
});

document.addEventListener("keydown", e => {
  if (!document.getElementById("overlay").hidden) { if (e.key === "Escape") closeModal(); return; }   // окно открыто — горячие клавиши молчат
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); search.focus(); search.select(); return; }
  if (typing) { if (e.key === "Escape") search.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (parseHash().parts[0] === "e" && exam && exam.pos < exam.items.length) {
    const map = { " ": "show", "1": "1", "2": "0.5", "3": "0" };
    if (map[e.key] && (e.key === " " ? !exam.shown : exam.shown)) { e.preventDefault(); examAction(map[e.key]); }
    return;
  }
  const view = parseHash().parts[0], inViewer = view === "t" || (view === "l" && parseHash().parts[1]);
  if (!inViewer) return;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    const a = document.querySelector(`[data-nav="${e.key === "ArrowRight" ? "next" : "prev"}"][href]`);
    if (a) location.hash = a.getAttribute("href");
  } else if (e.key === "m" || e.key === "M" || e.key === "ь" || e.key === "Ь") {
    const btn = document.querySelector("[data-toggle],[data-lec]"); if (btn) btn.click();
  } else if (e.key === "q" || e.key === "Q" || e.key === "й" || e.key === "Й") {
    const btn = document.querySelector("[data-qtoggle]"); if (btn) btn.click();
  } else if (e.key === "Escape") {
    location.hash = document.querySelector(".vbar a").getAttribute("href");
  }
});

window.addEventListener("hashchange", () => {
  const { parts } = parseHash();
  if (parts[0] !== "q") search.value = "";
  render();
});
setTab(state.tab || "sections", false);
render();
syncProgress();
window.addEventListener("focus", syncProgress);   // вернулись из терминала после проверки — подхватить результат
gamBoot();
</script>
</body>
</html>

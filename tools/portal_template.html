<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Cheatsheets — учебный портал</title>
<!-- Файл index.html собирается скриптом tools/build_portal.py из этого шаблона. Не редактируйте index.html вручную. -->
<script src="assets/theme.js"></script>
<style>
  :root {
    --bg: #f6f8fb; --panel: #ffffff; --text: #1f2933; --muted: #66768a;
    --border: #dde3ea; --accent: #2f6fde; --accent-soft: #e6effd;
    --done: #1f9d55; --done-soft: #e3f6eb; --warn: #c27c0e;
    --shadow: 0 1px 3px rgba(20, 30, 50, .08);
    --frame-bg: #fafcff;
  }
  /* Тёмная тема: атрибут ставит assets/theme.js (режим «авто» следует настройке системы) */
  :root[data-theme="dark"] {
    --bg: #12161c; --panel: #1b2129; --text: #e4e9ef; --muted: #93a1b3;
    --border: #2c3540; --accent: #6ea2ff; --accent-soft: #1f2d45;
    --done: #4cc884; --done-soft: #183225; --warn: #e2a84b;
    --shadow: none;
    --frame-bg: #12161c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: grid; grid-template-rows: auto 1fr; grid-template-columns: 300px 1fr;
    grid-template-areas: "top top" "side main";
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }

  header {
    grid-area: top; display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; font-size: 17px; white-space: nowrap; color: var(--text); }
  #menuBtn { display: none; }
  .search { flex: 1; max-width: 520px; position: relative; }
  .search input {
    width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit;
  }
  .overall { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--done); }
  .overall .bar { width: 120px; }

  nav {
    grid-area: side; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--border); padding: 10px 0 30px;
  }
  .tabs { display: flex; gap: 4px; padding: 0 10px 8px; }
  .tabs button {
    flex: 1; padding: 6px 4px; border: 1px solid var(--border); border-radius: 6px;
    background: transparent; color: var(--muted); font-size: 13px;
  }
  .tabs button.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .navgroup { padding: 8px 14px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .navitem {
    display: flex; justify-content: space-between; gap: 8px; align-items: center;
    padding: 5px 14px; color: var(--text); font-size: 14px; border-left: 3px solid transparent;
  }
  .navitem:hover { background: var(--bg); text-decoration: none; }
  .navitem.active { background: var(--accent-soft); border-left-color: var(--accent); }
  .navitem small { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .navitem small.full { color: var(--done); }

  main { grid-area: main; overflow-y: auto; min-width: 0; }
  .page { max-width: 980px; margin: 0 auto; padding: 24px 24px 60px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  h2 { font-size: 18px; margin: 26px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; box-shadow: var(--shadow); color: var(--text); display: block;
  }
  a.card:hover { border-color: var(--accent); text-decoration: none; }
  .card .bar { margin-top: 10px; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .cta {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 8px;
    background: var(--accent); color: #fff; border: 0; font-weight: 600;
  }
  .cta:hover { text-decoration: none; filter: brightness(1.08); }
  .btn {
    padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 13px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); text-decoration: none; }
  .btn.on { background: var(--done-soft); border-color: var(--done); color: var(--done); }

  ol.topics { list-style: none; padding: 0; margin: 0; counter-reset: t; }
  ol.topics li {
    counter-increment: t; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 6px;
  }
  ol.topics li::before { content: counter(t); color: var(--muted); font-size: 12px; min-width: 18px; text-align: right; }
  ol.topics li.done { background: var(--done-soft); border-color: transparent; }
  ol.topics li a { flex: 1; color: var(--text); }
  ol.topics li .where { color: var(--muted); font-size: 12px; }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--done); cursor: pointer; }
  .stage { margin-bottom: 18px; }
  .stage h3 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 10px; align-items: center; }
  .lvl { font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 500; }
  .lvl.beginner { background: var(--done-soft); color: var(--done); }
  .lvl.intermediate { background: #fdf3dc; color: var(--warn); }
  .lvl.advanced { background: #fde4e4; color: #c0392b; }
  :root[data-theme="dark"] .lvl.intermediate { background: #3a2f15; }
  :root[data-theme="dark"] .lvl.advanced { background: #3d1d1d; color: #ff8a80; }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 6px; }

  .viewer { display: flex; flex-direction: column; height: 100%; }
  .vbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .vbar .title { flex: 1; min-width: 160px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vbar .ctx { color: var(--muted); font-weight: 400; font-size: 13px; }
  .viewer iframe { flex: 1; border: 0; width: 100%; min-width: 0; background: var(--frame-bg); }
  .vbody { flex: 1; display: flex; min-height: 0; }
  .qpanel { display: none; width: 400px; flex: none; overflow-y: auto; padding: 14px 16px 30px;
    background: var(--bg); border-left: 1px solid var(--border); }
  .viewer.qopen .qpanel { display: block; }
  .qpanel h3 { margin: 0 0 4px; font-size: 16px; }
  details.q { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
  details.q summary { cursor: pointer; padding: 9px 12px; font-weight: 600; list-style: none; }
  details.q summary::-webkit-details-marker { display: none; }
  details.q summary::before { content: "▸ "; color: var(--accent); }
  details.q[open] summary::before { content: "▾ "; }
  details.q .ans { padding: 0 12px 10px; border-top: 1px dashed var(--border); }
  details.q .ans p { margin: 8px 0 0; }
  details.q .ans code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .rate { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .btn.good { border-color: var(--done); color: var(--done); }
  .btn.bad { border-color: #c0392b; color: #c0392b; }
  .badge { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .card.due { border-color: var(--accent); }
  .exam-q { font-size: 18px; font-weight: 600; margin: 6px 0 14px; }
  .exam-ans { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 4px 18px 12px; margin-bottom: 14px; }
  .grade { display: flex; gap: 8px; flex-wrap: wrap; }
  .grade .btn { font-size: 15px; padding: 9px 16px; }
  .src { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 14px; }
  .src .btn.on, .src .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .score { font-size: 42px; font-weight: 700; margin: 4px 0; }
  .gloss-letters { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 14px; }
  .gloss-letters a { padding: 2px 9px; border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
  .gloss-letters a:hover { border-color: var(--accent); text-decoration: none; }
  .gloss-filter { width: 100%; max-width: 420px; font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  .term { padding: 10px 0; border-bottom: 1px solid var(--border); scroll-margin-top: 12px; }
  .term b { font-size: 15.5px; }
  .term .md p { margin: 4px 0; }
  .term .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: 13px; }
  .term.hit { background: var(--accent-soft); border-radius: 6px; padding-left: 8px; }
  .qpanel .term { padding: 6px 0; }
  .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); gap: 3px; margin: 8px 0 4px; overflow-x: auto; }
  .heat i { width: 13px; height: 13px; border-radius: 3px; background: var(--border); }
  .heat i.l1 { background: color-mix(in srgb, var(--done) 35%, var(--border)); }
  .heat i.l2 { background: color-mix(in srgb, var(--done) 65%, var(--border)); }
  .heat i.l3 { background: var(--done); }
  .heat i.today { outline: 2px solid var(--accent); outline-offset: -1px; }
  .heat i.future { visibility: hidden; }
  .plan-status { font-weight: 600; }
  .plan-status.ok { color: var(--done); }
  .plan-status.late { color: var(--warn); }
  input[type="date"] { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  .related { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 6px 12px; font-size: 13px;
    background: var(--panel); border-bottom: 1px solid var(--border); }
  .related .lbl { color: var(--muted); margin-right: 2px; }
  .related .sep { color: var(--border); margin: 0 4px; }
  .chip { padding: 1px 9px; border-radius: 12px; border: 1px solid var(--border); color: var(--text); white-space: nowrap; }
  .chip:hover { border-color: var(--accent); text-decoration: none; }
  .chip.done { border-color: var(--done); color: var(--done); }
  .notes textarea { width: 100%; min-height: 130px; resize: vertical; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); font: 14px/1.5 inherit; font-family: inherit; }
  .note-card pre { white-space: pre-wrap; font: inherit; margin: 6px 0 0; color: var(--text); }

  .md { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 6px 22px 16px; }
  .md pre, .md code { font-family: Consolas, "Courier New", monospace; font-size: 13px; }
  .md pre { background: var(--bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
  .md :not(pre) > code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  .md table { border-collapse: collapse; margin: 8px 0; }
  .md td, .md th { border: 1px solid var(--border); padding: 4px 10px; }
  .files { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 16px; }
  .und-opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; max-width: 720px; }
  .und-opts .btn { text-align: left; white-space: normal; line-height: 1.45; padding: 9px 12px; }
  .und-opts .btn:disabled { opacity: 1; cursor: default; }
  .hint { background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 12px; margin: 8px 0; }
  .hint .md p, .hint p { margin: 2px 0; }
  .cmd { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .cmd code { flex: 1; background: var(--panel); border: 1px solid var(--border); padding: 7px 10px; border-radius: 6px; font-size: 13px; overflow-x: auto; white-space: nowrap; }
  .md blockquote { margin: 12px 0; padding: 8px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 6px; }
  .md blockquote p { margin: 2px 0; }
  .lecture .vbar { position: sticky; top: 0; z-index: 2; }
  .lecture .page { max-width: 820px; }
  .lecture-body { font-size: 15.5px; line-height: 1.65; padding: 10px 28px 22px; }
  .lecture-body h2, .lecture-body h3 { margin: 26px 0 8px; }
  .lecture-body li { margin: 3px 0; }
  .lec-toc { columns: 2; column-gap: 24px; margin: 0 0 14px; padding-left: 20px; color: var(--muted); font-size: 14px; }
  @media (max-width: 700px) { .lec-toc { columns: 1; } .lecture-body { padding: 6px 14px 16px; } }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .kbd { font-size: 12px; color: var(--muted); }
  .kbd b { border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-weight: 500; }

  /* ---- уровни, награды, профиль (префикс gx-) ---- */
  .gx-chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none !important; color: var(--text); }
  .gx-mini { display: inline-block; width: 38px; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .gx-mini i { display: block; height: 100%; background: var(--done); }
  .gx-xp-txt { font-size: 12px; color: var(--muted); }
  #userBtn, #lvlBtn { flex-shrink: 0; }
  #userBtn { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gx-bar { height: 10px; margin: 10px 0 4px; }
  .gx-sub { font-size: 13px; color: var(--muted); }
  .gx-big { font-size: 44px; line-height: 1; }
  .gx-row { display: flex; gap: 14px; align-items: center; }
  .gx-badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .gx-badge { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 10px; text-align: center; opacity: .5; filter: grayscale(1); }
  .gx-badge.on { opacity: 1; filter: none; border-color: var(--done); background: var(--done-soft); }
  .gx-badge span { font-size: 28px; display: block; }
  .gx-badge small { display: block; color: var(--muted); font-size: 12px; }
  .gx-stages { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .gx-dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; text-decoration: none !important; color: var(--muted); }
  .gx-dot.on { border-color: var(--done); background: var(--done-soft); color: var(--done); }
  .gx-dot.star { border-color: var(--warn); background: rgba(226, 168, 75, .2); }
  .gx-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .gx-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .gx-table td:last-child { text-align: right; white-space: nowrap; font-weight: 600; }
  .gx-table tr.cur td { background: var(--accent-soft); }
  .gx-goal { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .gx-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10, 16, 28, .6); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
  .gx-overlay[hidden] { display: none; }
  .gx-modal { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; width: min(500px, 100%); box-shadow: 0 18px 50px rgba(0, 0, 0, .35); animation: gx-pop .25s ease-out; }
  @keyframes gx-pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
  .gx-modal h2 { margin: 0 0 8px; }
  .gx-tabs { display: flex; gap: 6px; margin: 10px 0; }
  .gx-tabs .btn { flex: 1; }
  .gx-form label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  .gx-form input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  .gx-err { color: #d64545; min-height: 20px; font-size: 14px; margin-top: 8px; }
  .gx-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
  .gx-line { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .gx-line small { display: block; color: var(--muted); }
  .gx-gain { color: var(--done); font-weight: 700; white-space: nowrap; }
  .gx-level { display: flex; gap: 14px; align-items: center; margin: 14px 0 4px; padding: 12px; border-radius: 10px; background: var(--accent-soft); }
  .gx-cheer { font-style: italic; color: var(--muted); margin: 12px 0 0; }
  .gx-toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 60; max-width: min(520px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--done); border-radius: 10px; padding: 10px 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
  .gx-toast[hidden] { display: none; }
  .gx-confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: 14px; }
  .gx-confetti span { position: absolute; top: -30px; font-size: 20px; animation: gx-fall 2.6s linear forwards; }
  @keyframes gx-fall { to { transform: translateY(560px) rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .gx-confetti { display: none; } .gx-modal { animation: none; } }
  body.gx-lock { overflow: hidden; }

  @media (max-width: 800px) {
    .gx-xp-txt, .gx-uname { display: none; }
    .gx-modal { padding: 18px 16px; }
    body { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main"; }
    header { gap: 8px; padding: 8px 10px; }
    .search { min-width: 0; }
    .overall { display: none; }
    #menuBtn { display: inline-block; }
    nav { position: fixed; top: 52px; bottom: 0; left: 0; width: 290px; z-index: 5; transform: translateX(-100%); transition: transform .2s; box-shadow: 2px 0 10px rgba(0,0,0,.2); }
    body.menu-open nav { transform: none; }
    .overall .bar, .brand span { display: none; }
    .page { padding: 16px; }
    .kbd { display: none; }
    .qpanel { width: 100%; border-left: 0; }
    .viewer.qopen iframe { display: none; }   /* на телефоне вопросы показываются вместо шпаргалки */
  }
  @media (max-width: 560px) {
    /* кнопок в шапке много: логотип — значком, уровень и профиль — первыми, поиск — в конце, лишнее прокручивается */
    header { overflow-x: auto; scrollbar-width: none; gap: 6px; }
    header::-webkit-scrollbar { display: none; }
    header > * { flex-shrink: 0; }
    .brand { max-width: 1.5em; overflow: hidden; }
    #menuBtn { order: -3; } .brand { order: -2; } #lvlBtn, #userBtn { order: -1; }
    .search { order: 20; flex: 0 0 150px; min-width: 150px; }
    .gx-mini { display: none; }
  }
</style>
</head>
<body>
<header>
  <button id="menuBtn" class="btn" aria-label="Меню">☰</button>
  <a class="brand" href="#/">🎓 ML Cheatsheets <span>· портал</span></a>
  <div class="search"><input id="search" type="search" placeholder="Поиск по 400+ темам…  ( / )" autocomplete="off"></div>
  <a class="btn" href="#/k" title="Глоссарий терминов">📖</a>
  <a class="btn" href="#/g" title="План занятий на сегодня">📅</a>
  <a class="btn" href="#/e" title="Режим экзамена: случайные вопросы с самооценкой">🎓</a>
  <a class="btn" href="#/r" id="reviewBtn" title="Интервальное повторение">🔁 <span id="dueCount"></span></a>
  <a class="btn gx-chip" id="lvlBtn" href="#/me" title="Ваш уровень"></a>
  <button class="btn" id="userBtn" data-gx="user" title="Профиль"></button>
  <button class="btn" id="themeBtn" data-theme-toggle title="Тема оформления"></button>
  <div class="overall" title="Общий прогресс">
    <div class="bar"><span id="overallBar"></span></div><span id="overallText"></span>
  </div>
</header>
<nav>
  <div class="tabs">
    <button data-tab="sections">Разделы</button>
    <button data-tab="paths">Пути</button>
    <button data-tab="exercises">Практика</button>
  </div>
  <div id="navList"></div>
</nav>
<main id="main"></main>
<div id="overlay" class="gx-overlay" hidden></div>
<div id="toast" class="gx-toast" hidden role="status"></div>

<script>
const DATA = /*__DATA__*/null;
const STORE_KEY = "mlcs-progress-v1";
// Профиль: без входа прогресс лежит под STORE_KEY («гость»), после входа — под STORE_KEY:u:<имя>.
// session = { name, token } — профиль на сервере (start.py); { name, local: true } — только в этом браузере.
const SESSION_KEY = "mlcs-session-v1", USERS_KEY = "mlcs-users-v1";
function readSession() {
  try { const s = JSON.parse(localStorage.getItem(SESSION_KEY)); return s && s.name ? s : null; } catch (e) { return null; }
}
let session = readSession();
// таймеры и состояние связи объявлены здесь, чтобы save() можно было вызывать в любой момент загрузки
let gamTimer, pushTimer, toastTimer, serverMode = null, serverPromise = null, syncInfo = { s: "idle", t: 0 };
const storeKey = () => session ? STORE_KEY + ":u:" + session.name.toLowerCase() : STORE_KEY;
// Версия сборки в адресах файлов: после обновления проекта браузер не покажет старые копии из кэша
const V = "?v=" + DATA.build;
// Для страниц во фрейме (интерактивы): открыть шпаргалку в самом портале
window.mlcsPortal = { open: f => { if (!DATA.titles[f]) return false; location.hash = "#/t/" + encodeURIComponent(f); return true; } };

// ---------- состояние и прогресс ----------
function emptyState() {
  return { done: {}, exDone: {}, exAuto: {}, exRev: {}, hints: {}, reveal: {}, und: {}, lec: {}, projDone: {}, review: {}, notes: {}, exams: [], plan: null, activity: {}, last: null, tab: "sections", qOpen: false, gam: null, savedAt: 0 };
}
function loadState() {
  const empty = emptyState();
  try { return Object.assign(empty, JSON.parse(localStorage.getItem(storeKey()))); }
  catch (e) { return empty; }
}
let state = loadState();
// persist — только записать (и отправить на сервер); save — записать и проверить уровни/этапы (см. «Уровни»)
function persist() { state.savedAt = Date.now(); try { localStorage.setItem(storeKey(), JSON.stringify(state)); } catch (e) {} pushSoon(); }
function save() { persist(); gamSoon(); }

const title = f => DATA.titles[f] || f;
const isDone = f => !!state.done[f];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uniq = arr => [...new Set(arr)];
const pathItems = p => uniq(p.stages.flatMap(s => s.items));
const allTopics = uniq(DATA.parts.flatMap(p => p.sections.flatMap(s => s.items)));

// где тема находится в README — для подписи в поиске
const topicHome = {};
DATA.parts.forEach((p, pi) => p.sections.forEach((s, si) => s.items.forEach(f => {
  if (!topicHome[f]) topicHome[f] = { pi, si, label: s.title };
})));

function progress(items) {
  const n = items.filter(isDone).length;
  return { n, total: items.length, pct: items.length ? Math.round(100 * n / items.length) : 0 };
}
function bar(items) { return `<div class="bar"><span style="width:${progress(items).pct}%"></span></div>`; }
function countLabel(items) {
  const p = progress(items);
  return `<small class="${p.n === p.total && p.total ? "full" : ""}">${p.n}/${p.total}</small>`;
}

function toggleDone(f, value) {
  if (value === undefined) value = !isDone(f);
  if (value) {
    if (!state.done[f]) state.done[f] = Date.now();
    if (!state.review[f]) state.review[f] = { step: 0, due: Date.now() + DAY };
  } else { delete state.done[f]; delete state.review[f]; }
  save(); refreshChrome();
}

// ---------- интервальное повторение ----------
// После отметки «Изучено» тема возвращается на повторение через 1, 3, 7, 16, 35, 90 дней.
// «Помню» — следующий интервал, «Есть пробелы» — снова через день.
const DAY = 24 * 3600 * 1000;
const INTERVALS = [1, 3, 7, 16, 35, 90];
const questionsOf = f => DATA.questions[f] || [];
const demosOf = f => DATA.demos.filter(d => d.topics.includes(f));
const prereqsOf = f => (DATA.prereqs || {})[f] || [];
const dependentsOf = (() => {   // обратные связи: какие темы опираются на эту
  const rev = {};
  Object.entries(DATA.prereqs || {}).forEach(([t, before]) => before.forEach(b => (rev[b] = rev[b] || []).push(t)));
  return f => rev[f] || [];
})();
const noteOf = f => (state.notes[f] && state.notes[f].text) || "";

function relatedBar(f) {
  const before = prereqsOf(f), after = dependentsOf(f);
  if (!before.length && !after.length) return "";
  const chip = g => `<a class="chip ${isDone(g) ? "done" : ""}" href="#/t/${encodeURIComponent(g)}" title="${isDone(g) ? "Изучено" : "Ещё не изучено"}">${isDone(g) ? "✔ " : ""}${esc(title(g))}</a>`;
  const left = before.filter(g => !isDone(g)).length;
  return `<div class="related">
    ${before.length ? `<span class="lbl">📚 Сначала${left ? ` (не изучено: ${left})` : " ✔"}:</span>${before.map(chip).join("")}` : ""}
    ${before.length && after.length ? '<span class="sep">|</span>' : ""}
    ${after.length ? `<span class="lbl">➡ Дальше:</span>${after.map(chip).join("")}` : ""}
  </div>`;
}

function reviewOf(f) {
  if (state.review[f]) return state.review[f];        // в т. ч. слабые темы из экзамена, ещё не отмеченные «Изучено»
  if (!isDone(f)) return null;
  return { step: 0, due: state.done[f] + DAY };       // темы, отмеченные до появления повторения
}
const reviewTopics = () => [...new Set([...Object.keys(state.done), ...Object.keys(state.review)])].filter(f => DATA.titles[f]);
function dueTopics() {
  const now = Date.now();
  return reviewTopics().filter(f => reviewOf(f).due <= now).sort((a, b) => reviewOf(a).due - reviewOf(b).due);
}
function rate(f, remembered) {
  const r = reviewOf(f) || { step: -1 };
  const step = remembered ? Math.min(r.step + 1, INTERVALS.length - 1) : 0;
  if (!state.done[f]) state.done[f] = Date.now();
  state.review[f] = { step, due: Date.now() + INTERVALS[step] * DAY };
  logActivity(); save(); refreshChrome();
}
// ---------- практика: автоотметка и повтор упражнений ----------
// tools/check_exercise.py записывает верные решения в my_progress.json; портал читает его, когда открыт через start.py.
// Решённое упражнение возвращается «решить снова без подсказок» через 14, 45 и 120 дней.
const EX_INTERVALS = [14, 45, 120];
const exIndex = id => DATA.exercises.findIndex(e => e.id === id);
function exRevOf(id) {
  return state.exRev[id] || (state.exDone[id] ? { step: 0, due: state.exDone[id] + EX_INTERVALS[0] * DAY } : null);
}
function markExSolved(id, when) {
  const r = exRevOf(id);
  if (!state.exDone[id]) { state.exDone[id] = when; state.exRev[id] = { step: 0, due: when + EX_INTERVALS[0] * DAY }; }
  else if (r && when >= r.due) {                       // решено снова, когда подошёл срок повтора
    const step = Math.min(r.step + 1, EX_INTERVALS.length - 1);
    state.exRev[id] = { step, due: when + EX_INTERVALS[step] * DAY };
  } else return;
  logActivity();
}
function unmarkEx(id) { delete state.exDone[id]; delete state.exRev[id]; delete state.exAuto[id]; }
const dueExercises = () => DATA.exercises.filter(e => { const r = exRevOf(e.id); return r && r.due <= Date.now(); });
async function syncProgress() {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const res = await fetch("my_progress.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const solved = (await res.json()).exercises || {};
    let changed = false;
    for (const [id, info] of Object.entries(solved)) {
      const last = Date.parse(info.last || info.first);
      if (exIndex(id) < 0 || !last || state.exAuto[id] === last) continue;
      markExSolved(id, last); state.exAuto[id] = last; changed = true;
    }
    if (changed) { save(); rerenderKeepScroll(); refreshChrome(); }
  } catch (e) {}
}
function exerciseDueBlock() {
  const ex = dueExercises();
  if (!ex.length) return "";
  return `<h2>🏋 Упражнения на повтор: ${ex.length}</h2>
    <p class="note">Решите снова — без подсказок и не заглядывая в старое решение. Верная проверка продвинет повтор.</p>
    <div class="files">${ex.map(e => `<a class="btn" href="#/x/${exIndex(e.id)}">${esc(e.title)}</a>`).join("")}</div>`;
}

function whenLabel(f) {
  const r = reviewOf(f);
  if (!r) return "";
  const days = Math.ceil((r.due - Date.now()) / DAY);
  return days <= 0 ? "повторить сегодня" : `повторение через ${days} ${plural(days, "день", "дня", "дней")}`;
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? few : many;
}

function questionsBlock(f) {
  const qs = questionsOf(f);
  if (!qs.length) return `<p class="note">Вопросов к этой теме пока нет — перескажите себе главное из шпаргалки.
    Добавить вопросы можно в <code>questions/${esc(f.replace("_cheatsheet.html", ""))}.md</code>.</p>`;
  return qs.map((q, i) => `<details class="q"><summary>${i + 1}. ${esc(q.q)}</summary><div class="ans">${markdown(q.a)}</div></details>`).join("");
}
function rateButtons(f) {
  return `<div class="rate">
    <button class="btn good" data-rate="1" data-topic="${esc(f)}">✔ Помню</button>
    <button class="btn bad" data-rate="0" data-topic="${esc(f)}">✖ Есть пробелы</button>
  </div><p class="note" style="margin-top:8px">${esc(whenLabel(f) || "Оценка отметит тему изученной и запланирует повторение.")}</p>`;
}

// ---------- маршруты ----------
// #/                         главная
// #/s/<part>/<section>       раздел
// #/p/<path>                 учебный путь
// #/x/<exercise>             упражнение
// #/t/<file>?ctx=<контекст>  просмотр шпаргалки
// #/q/<строка>               поиск
// #/r                        повторение
// #/d/<файл>                 интерактивная демонстрация из interactive/
// #/n                        мои заметки
// #/e                        режим экзамена
// #/j/<n>                    мини-проект
// #/g                        план занятий
// #/k/<термин>               глоссарий (термин — подсветить)
// #/u, #/u/<i>                задачи на понимание: «предскажи результат» и «выбери подход»
// #/me                       профиль: уровень, XP, награды, вход
function parseHash() {
  const [route, query] = decodeURIComponent(location.hash.slice(1) || "/").split("?ctx=");
  return { parts: route.split("/").filter(Boolean), ctx: query || "" };
}

function contextList(ctx) {
  const [kind, a, b] = ctx.split(":");
  if (kind === "s") {
    const sec = DATA.parts[+a] && DATA.parts[+a].sections[+b];
    if (sec) return { items: sec.items, label: sec.title, back: `#/s/${a}/${b}` };
  }
  if (kind === "p" && DATA.paths[+a]) return { items: pathItems(DATA.paths[+a]), label: DATA.paths[+a].title, back: `#/p/${a}` };
  return null;
}

function render() {
  const { parts, ctx } = parseHash();
  document.body.classList.remove("menu-open");
  const main = document.getElementById("main");
  const [kind, a, b] = parts;
  if (kind === "t") main.innerHTML = viewTopic(parts.slice(1).join("/"), ctx);
  else if (kind === "s") main.innerHTML = viewSection(+a, +b);
  else if (kind === "p") main.innerHTML = viewPath(+a);
  else if (kind === "x") main.innerHTML = viewExercise(+a);
  else if (kind === "q") main.innerHTML = viewSearch(parts.slice(1).join("/"));
  else if (kind === "r") main.innerHTML = viewReview();
  else if (kind === "d") main.innerHTML = viewDemo(parts.slice(1).join("/"));
  else if (kind === "n") main.innerHTML = viewNotes();
  else if (kind === "e") main.innerHTML = viewExam();
  else if (kind === "j") main.innerHTML = viewProject(+a);
  else if (kind === "g") main.innerHTML = viewPlan();
  else if (kind === "u") main.innerHTML = a === undefined ? viewUnderstandingList() : viewUnderstanding(+a);
  else if (kind === "l") { main.innerHTML = a === undefined ? viewLectureList() : viewLecture(parts.slice(1).join("/"), ctx); if (a !== undefined) loadLecture(parts.slice(1).join("/")); }
  else if (kind === "me") main.innerHTML = viewProfile();
  else if (kind === "k") { if (parts[1]) glossaryQuery = ""; main.innerHTML = viewGlossary(); requestAnimationFrame(() => glossaryJump(parts.slice(1).join("/"))); }   // после сброса прокрутки ниже
  else main.innerHTML = viewHome();
  if (kind === "t" || kind === "d") forwardFrameKeys(main.querySelector("iframe"));
  else main.scrollTop = 0;
  if (kind === "s") setTab("sections", false);
  if (kind === "p" || kind === "l") setTab("paths", false);
  if (kind === "x" || kind === "u") setTab("exercises", false);
  refreshChrome();
}

// Горячие клавиши работают и когда фокус внутри шпаргалки.
// Через file:// браузер может запретить доступ к iframe — тогда помогает python start.py.
function forwardFrameKeys(frame) {
  if (!frame) return;
  frame.addEventListener("load", () => {
    window.mlcsTheme.notifyFrames();   // шпаргалка получает текущую тему портала
    try {
      frame.contentDocument.addEventListener("keydown", ev => {
        if (["ArrowLeft", "ArrowRight", "Escape", "m", "M", "ь", "Ь", "q", "Q", "й", "Й", "/"].includes(ev.key) && !ev.ctrlKey && !ev.altKey) {
          ev.preventDefault();
          document.dispatchEvent(new KeyboardEvent("keydown", { key: ev.key }));
        }
      });
    } catch (err) { /* другой origin — пропускаем */ }
  });
}

function topicRow(f, ctx, showWhere) {
  const where = showWhere && topicHome[f] ? `<span class="where">${esc(topicHome[f].label)}</span>` : "";
  return `<li class="${isDone(f) ? "done" : ""}">
    <input type="checkbox" data-done="${esc(f)}" ${isDone(f) ? "checked" : ""} title="Отметить как изученное">
    <a href="#/t/${encodeURIComponent(f)}${ctx ? "?ctx=" + ctx : ""}">${esc(title(f))}</a>${where}
    ${LECT[f] ? `<a class="badge" href="${lectureLink(f, ctx)}" title="Лекция по теме${state.lec[f] ? " (прочитана)" : ""}">🎓${state.lec[f] ? "✔" : ""}</a>` : ""}
    ${demosOf(f).length ? `<a class="badge" href="#/d/${encodeURIComponent(demosOf(f)[0].file)}" title="Интерактивная демонстрация">🎮</a>` : ""}
    ${noteOf(f) ? `<span class="badge" title="Есть заметка">📝</span>` : ""}
    ${questionsOf(f).length ? `<span class="badge" title="Есть вопросы для самопроверки">❓${questionsOf(f).length}</span>` : ""}</li>`;
}

             : nextInPath ? `<a class="cta" href="#/t/${encodeURIComponent(nextInPath)}?ctx=p:0">▶ Начать с первой темы пути новичка</a>` : ""}</p>

    ${levelCard()}
    ${planCard()}
    ${reviewCard()}
    ${examCard()}
    ${projectCards()}
    <h2>🗺️ Учебные пути</h2>
    <div class="cards">${DATA.paths.map((p, i) => {
      const items = pathItems(p), pr = progress(items);
      return `<a class="card" href="#/p/${i}"><b>${esc(p.title)}</b>
        <div class="meta">${p.stages.length} этапов · изучено ${pr.n} из ${pr.total}</div>${bar(items)}</a>`;
    }).join("")}</div>

    <h2>📊 Ваш прогресс</h2>
    <div class="cards">
      <div class="card"><b>Все шпаргалки</b><div class="meta">${all.n} из ${all.total} (${all.pct}%)</div>${bar(allTopics)}</div>
      <div class="card"><b>Практика</b><div class="meta">решено ${DATA.exercises.filter(e => state.exDone[e.id]).length} из ${DATA.exercises.length} упражнений${dueExercises().length ? ` · на повтор: ${dueExercises().length}` : ""}</div></div>
      ${lectureCard()}
      ${understandingCard()}
      <div class="card"><b>Недавно изучено</b><div class="meta">${recent.length ? recent.map(f => `<a href="#/t/${encodeURIComponent(f)}">${esc(title(f))}</a>`).join("<br>") : "пока ничего — отметьте тему галочкой ✔"}</div></div>
    </div>

    ${Object.keys(state.notes).length ? `<h2>📝 Мои заметки</h2><a class="card" href="#/n"><b>Заметок: ${Object.keys(state.notes).length}</b><div class="meta">Ваши конспекты по темам — удобно перечитывать перед повторением</div></a>` : ""}

    ${demoCards()}

    <h2>💡 Как учиться с порталом</h2>
    <div class="card">

// ---------- лекции ----------
// Текст лекции (lectures/<тема>.md) загружается при открытии — так портал остаётся лёгким.
const LECT = DATA.lectures || {};
const lectureCache = {};
const lectureUrl = f => `lectures/${encodeURIComponent(f.replace(/_cheatsheet\.html$/, ".md"))}${V}`;
const lectureLink = (f, ctx) => `#/l/${encodeURIComponent(f)}${ctx ? "?ctx=" + ctx : ""}`;
function lectureOrder() {                     // порядок учебных путей, затем остальные
  const seen = [];
  DATA.paths.forEach(p => pathItems(p).forEach(f => { if (LECT[f] && !seen.includes(f)) seen.push(f); }));
  Object.keys(LECT).forEach(f => { if (!seen.includes(f)) seen.push(f); });
  return seen;
}
const lecRead = () => Object.keys(LECT).filter(f => state.lec[f]).length;

function lectureCard() {
  const total = Object.keys(LECT).length;
  if (!total) return "";
  const next = lectureOrder().find(f => !state.lec[f]);
  return `<a class="card" href="${next && lecRead() ? lectureLink(next) : "#/l"}"><b>🎓 Лекции</b>
    <div class="meta">${lecRead() ? `прочитано ${lecRead()} из ${total}${next ? ` · дальше: ${esc(LECT[next].title)}` : ""}` : `${total} лекций по темам учебных путей: связный рассказ перед шпаргалкой`}</div></a>`;
}

function viewLectureList() {
  const order = lectureOrder(), next = order.find(f => !state.lec[f]);
  const row = (f, ctx) => `<li class="${state.lec[f] ? "done" : ""}">
    <a href="${lectureLink(f, ctx)}">${state.lec[f] ? "✔ " : ""}${esc(LECT[f].title)}</a><span class="where">${LECT[f].minutes} мин</span>
    <a class="badge" href="#/t/${encodeURIComponent(f)}" title="Шпаргалка">📘</a></li>`;
  return `<div class="page">
    <h1>🎓 Лекции</h1>
    <p class="sub">Связный рассказ по теме: зачем она нужна, интуиция, как это работает, пример кода и подводные камни.

function viewLecture(f, ctx) {
  const L = LECT[f];
  if (!L) return `<div class="page empty">Лекция не найдена: ${esc(f)}</div>`;
  const c = contextList(ctx);
  const seq = (c ? c.items : lectureOrder()).filter(g => LECT[g]);
  const idx = seq.indexOf(f), prev = seq[idx - 1], next = seq[idx + 1];
  const ex = DATA.exercises.findIndex(e => e.cheatsheet === f);
  const topicHref = `#/t/${encodeURIComponent(f)}${ctx ? "?ctx=" + ctx : ""}`;
  const navBtn = (g, dir, label) => g ? `<a class="btn" href="${lectureLink(g, ctx)}" title="${esc(LECT[g].title)} (${dir === "next" ? "→" : "←"})" data-nav="${dir}">${label}</a>`
    : `<a class="btn" style="opacity:.4;pointer-events:none" data-nav="${dir}">${label}</a>`;

      <a class="btn" href="${topicHref}" title="Шпаргалка по теме">📘 Шпаргалка</a>
      ${readBtn}
      ${navBtn(next, "next", "Далее →")}
    </div>
    <div class="page">
      <h1>${esc(L.title)}</h1>
      <p class="sub">≈ ${L.minutes} мин чтения · ${L.heads.length} разделов</p>

      <div class="md lecture-body" id="lectureBody" data-lecture="${esc(f)}">${lectureCache[f] || '<p class="note">Загрузка лекции…</p>'}</div>
      <h2>Что дальше</h2>
      <p class="files">
        <a class="btn" href="${topicHref}">📘 Шпаргалка: ${esc(title(f))}</a>

        ${demosOf(f).map(d => `<a class="btn" href="#/d/${encodeURIComponent(d.file)}">🎮 ${esc(d.title)}</a>`).join("")}

        ${undOf(f).length ? `<a class="btn" href="#/u/${undOf(f)[0][1]}">🧩 Задачи на понимание (${undOf(f).length})</a>` : ""}

      </p>
      <p>${readBtn} ${next ? `<a class="cta" href="${lectureLink(next, ctx)}">▶ Следующая лекция: ${esc(LECT[next].title)}</a>` : ""}</p>
    </div>
  </div>`;
}

async function loadLecture(f) {
  if (!LECT[f] || lectureCache[f]) return;
  let html;
  try {
    const res = await fetch(lectureUrl(f));
    if (!res.ok) throw new Error(res.status);
    html = lectureCache[f] = markdown((await res.text()).replace(/^\s*# .*\n/, "").replace(/<!--[\s\S]*?-->\n?/g, ""));
  } catch (err) {
    html = `<p class="note">Не удалось загрузить лекцию. Откройте портал через <code>python start.py</code>
      или прочитайте файл напрямую: <a href="${lectureUrl(f)}" target="_blank">${esc(f.replace(/_cheatsheet\.html$/, ".md"))}</a>.</p>`;
  }
  const box = document.getElementById("lectureBody");
  if (box && box.dataset.lecture === f) box.innerHTML = html;   // пока грузилось, могли уйти на другую страницу
}

// Случайные вопросы из выбранных тем; ученик сам оценивает ответ: знаю / частично / не знаю.

let exam = null;                       // текущий экзамен живёт в памяти вкладки
let examSetup = { source: "auto", size: 10 };

function examSources() {
  const studied = Object.keys(state.done).filter(f => DATA.titles[f] && questionsOf(f).length);
  const list = [];
  if (studied.length) list.push(["done", `Изученные темы (${studied.length})`, studied]);
  DATA.paths.forEach((p, i) => list.push(["p" + i, p.title.replace(/\s*\(.*\)\s*$/, ""), pathItems(p)]));
  list.push(["all", "Все темы", allTopics]);
  return list.map(([id, label, items]) => ({ id, label, items: items.filter(f => questionsOf(f).length) }));
}

function examCard() {
  const last = (state.exams || []).slice(-1)[0];
  return `<h2>🎓 Экзамен</h2><a class="card" href="#/e"><b>${last ? `Последний результат: ${last.pct}% (${last.n} вопросов)` : "Проверьте себя: 10–30 случайных вопросов"}</b>
    <div class="meta">${last ? `${new Date(last.t).toLocaleDateString("ru-RU")} · ${esc(last.label)}` : "Вопросы из изученных тем, учебного пути или всего курса — со списком слабых тем в конце"}</div></a>`;
}

function startExam(sourceId, size) {
  const src = examSources().find(x => x.id === sourceId) || examSources()[0];
  // Сначала разные темы, затем по второму вопросу из тем — чтобы покрыть как можно больше тем
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pool = shuffle(src.items.slice()), picked = [];
  for (let round = 0; picked.length < size && round < 5; round++)
    for (const f of pool) {
      if (picked.length >= size) break;
      const used = new Set(picked.filter(q => q.f === f).map(q => q.i));
      const free = questionsOf(f).map((_, i) => i).filter(i => !used.has(i));
      if (free.length && picked.filter(q => q.f === f).length === round) picked.push({ f, i: free[Math.floor(Math.random() * free.length)] });
    }
  exam = { label: src.label, items: shuffle(picked), pos: 0, shown: false, grades: [] };
}

function viewExam() {
  if (!exam) {
    const sources = examSources();
    if (!sources.some(x => x.id === examSetup.source)) examSetup.source = sources[0].id;
    const hist = (state.exams || []).slice(-5).reverse();
    return `<div class="page">
      <h1>🎓 Режим экзамена</h1>
      <p class="sub">Случайные вопросы для самопроверки. Ответьте мысленно или вслух, откройте ответ и честно оцените себя.
        Клавиши: <b>Пробел</b> — показать ответ, <b>1</b> / <b>2</b> / <b>3</b> — знаю / частично / не знаю.</p>
      <h2>Откуда вопросы</h2>
      <div class="src">${sources.map(x => `<button class="btn" aria-pressed="${x.id === examSetup.source}" data-exam-src="${x.id}">${esc(x.label)} · ${x.items.length}</button>`).join("")}</div>
      <h2>Сколько вопросов</h2>
      <div class="src">${[10, 20, 30].map(n => `<button class="btn" aria-pressed="${n === examSetup.size}" data-exam-size="${n}">${n}</button>`).join("")}</div>
      <p style="margin-top:18px"><button class="cta" data-exam="start">▶ Начать экзамен</button></p>
      ${hist.length ? `<h2>Прошлые попытки</h2><ol class="topics">${hist.map(h => `<li><span style="flex:1">${esc(h.label)} · ${h.n} вопросов</span><span class="where">${new Date(h.t).toLocaleDateString("ru-RU")}</span><b>${h.pct}%</b></li>`).join("")}</ol>` : ""}
    </div>`;
  }
  if (exam.pos >= exam.items.length) return viewExamResult();
  const q = exam.items[exam.pos], item = questionsOf(q.f)[q.i];
  return `<div class="page">
    <p class="sub" style="margin:0">🎓 ${esc(exam.label)} · вопрос ${exam.pos + 1} из ${exam.items.length}</p>
    <div class="bar" style="margin:8px 0 18px"><span style="width:${100 * exam.pos / exam.items.length}%"></span></div>
    <p class="note" style="margin:0">Тема: <a href="#/t/${encodeURIComponent(q.f)}" target="_blank">${esc(title(q.f))}</a></p>
    <div class="exam-q">${esc(item.q)}</div>
    ${exam.shown ? `<div class="exam-ans">${markdown(item.a)}</div>
      <div class="grade">
        <button class="btn good" data-exam="1">✔ Знаю <span class="kbd">1</span></button>
        <button class="btn" data-exam="0.5">≈ Частично <span class="kbd">2</span></button>
        <button class="btn bad" data-exam="0">✖ Не знаю <span class="kbd">3</span></button>
      </div>` : `<p><button class="cta" data-exam="show">Показать ответ <span class="kbd" style="color:#fff">Пробел</span></button></p>`}
    <p style="margin-top:22px"><button class="btn" data-exam="quit">Прервать экзамен</button></p>
  </div>`;
}

function viewExamResult() {
  const total = exam.grades.reduce((a, b) => a + b, 0), pct = Math.round(100 * total / exam.grades.length);
  const byTopic = {};
  exam.items.forEach((q, k) => { (byTopic[q.f] = byTopic[q.f] || []).push(exam.grades[k]); });
  const weak = Object.entries(byTopic).filter(([, g]) => g.reduce((a, b) => a + b, 0) / g.length < 0.75).map(([f]) => f);
  if (!exam.saved) {
    state.exams = (state.exams || []).concat([{ t: Date.now(), n: exam.grades.length, pct, label: exam.label }]).slice(-50);
    save(); exam.saved = true;
  }
  const verdict = pct >= 85 ? "Отлично! 🎉" : pct >= 60 ? "Хорошо, но есть пробелы" : "Стоит повторить материал";
  return `<div class="page">
    <h1>🎓 Результат</h1>
    <div class="score">${pct}%</div>
    <p class="sub">${verdict} · ${exam.label} · ${exam.grades.length} вопросов: знаю ${exam.grades.filter(g => g === 1).length}, частично ${exam.grades.filter(g => g === 0.5).length}, не знаю ${exam.grades.filter(g => g === 0).length}</p>
    ${weak.length ? `<h2>Слабые темы (${weak.length})</h2>
      <ol class="topics">${weak.map(f => topicRow(f, "")).join("")}</ol>
      <p style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="cta" data-exam="review" ${exam.reviewed ? "disabled" : ""}>${exam.reviewed ? "✔ Добавлены в повторение" : "🔁 Добавить слабые темы в повторение на сегодня"}</button>
      </p>` : `<p>Слабых тем нет — все ответы «знаю» или почти. Попробуйте экзамен по другому пути или по всем темам.</p>`}
    <p style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-exam="again">Ещё раз</button><button class="btn" data-exam="new">Новый экзамен</button></p>
  </div>`;
}

function examAction(a) {
  if (a === "start") startExam(examSetup.source, examSetup.size);
  else if (a === "show") exam.shown = true;
  else if (a === "quit" || a === "new") exam = null;
  else if (a === "again") { const id = examSetup.source; startExam(id, examSetup.size); }
  else if (a === "review") {
    const byTopic = {};
    exam.items.forEach((q, k) => { (byTopic[q.f] = byTopic[q.f] || []).push(exam.grades[k]); });
    Object.entries(byTopic).forEach(([f, g]) => {
      if (g.reduce((x, y) => x + y, 0) / g.length < 0.75) state.review[f] = { step: 0, due: Date.now() - 1000 };   // отметку «Изучено» не трогаем
    });
    exam.reviewed = true; save(); refreshChrome();
  } else if (["1", "0.5", "0"].includes(a) && exam.shown) {
    exam.grades.push(+a); exam.pos++; exam.shown = false;
    logActivity(); save();
  }
  render();
}

// ---------- план занятий ----------
// Цель: учебный путь и минуты в день. Портал переводит их в темы на сегодня, следит, идёте ли вы
// по графику, и считает серию дней подряд с занятиями (изучение, повторение, экзамен, упражнения).
const TOPIC_MIN = 20;                                   // примерно минут на тему: шпаргалка + вопросы
const PLAN_MINUTES = [15, 30, 45, 60, 90, 120];
let planSetup = null;                                   // форма настройки плана (null — показываем сам план)

const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / DAY);
const dateLabel = t => new Date(t).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
const perDayOf = minutes => Math.max(1, Math.round(minutes / TOPIC_MIN));

function logActivity() { const k = dayKey(Date.now()); state.activity[k] = (state.activity[k] || 0) + 1; }
function activityByDay() {
  const days = Object.assign({}, state.activity);
  Object.values(state.done).forEach(t => { const k = dayKey(t); days[k] = (days[k] || 0) + 1; });
  return days;
}
function streak() {
  const days = activityByDay();
  let t = Date.now(), n = 0;
  if (!days[dayKey(t)]) t = addDays(t, -1);             // сегодня ещё не занимались — серия пока не прервана
  while (days[dayKey(t)]) { n++; t = addDays(t, -1); }
  return n;
}

function planStatus() {
  const pl = state.plan, p = pl && DATA.paths[pl.path];
  if (!p) return null;
  const items = pathItems(p), perDay = perDayOf(pl.minutes), today = startOfDay(Date.now());
  const doneToday = items.filter(f => isDone(f) && state.done[f] >= today);
  const left = items.filter(f => !isDone(f));
  const todo = left.slice(0, Math.max(0, perDay - doneToday.length));
  // график: с первого дня плана по perDay тем в день; сегодняшняя норма ещё не просрочена
  const dayNo = daysBetween(pl.start, today) + 1;
  const doneSince = items.filter(f => isDone(f) && state.done[f] >= startOfDay(pl.start)).length;
  const lag = Math.min(pl.leftAtStart, perDay * (dayNo - 1)) - doneSince;
  const ahead = doneSince - Math.min(pl.leftAtStart, perDay * dayNo);
  // сегодня доделываем todo, остальное — по perDay в день; если норма уже выполнена, продолжаем с завтра
  const finish = !left.length ? null : todo.length ? addDays(today, Math.ceil((left.length - todo.length) / perDay)) : addDays(today, Math.ceil(left.length / perDay));
  const deadline = pl.deadline ? new Date(pl.deadline + "T00:00").getTime() : null;
  return { p, items, perDay, doneToday, left, todo, dayNo, lag, ahead, finish, deadline };
}

function planCard() {
  const st = planStatus(), s = streak();
  if (!st) return `<h2>📅 План занятий</h2><a class="card" href="#/g"><b>Поставьте цель</b>
    <div class="meta">Выберите путь и сколько минут в день готовы заниматься — портал каждый день подскажет, что изучить</div></a>`;
  const n = st.doneToday.length, need = n + st.todo.length;
  return `<h2>📅 План на сегодня</h2><a class="card ${st.todo.length ? "due" : ""}" href="#/g">
    <b>${st.left.length ? (st.todo.length ? `Тем на сегодня: ${n} из ${need}` : "Норма на сегодня выполнена ✔") : "🎉 Путь пройден"}${s ? ` · 🔥 ${s} ${plural(s, "день", "дня", "дней")} подряд` : ""}</b>
    <div class="meta">${esc(st.p.title.replace(/\s*\(.*\)\s*$/, ""))}${st.todo.length ? " · дальше: " + esc(title(st.todo[0])) : ""}</div></a>`;
}

function heatmap(weeks = 18) {
  const days = activityByDay(), today = startOfDay(Date.now());
  const shift = (new Date(today).getDay() + 6) % 7;                 // строки — дни недели с понедельника
  const first = addDays(today, -(weeks - 1) * 7 - shift);
  const cells = [];
  for (let k = 0; k < weeks * 7; k++) {
    const t = addDays(first, k), n = days[dayKey(t)] || 0;
    const lvl = n === 0 ? "" : n < 3 ? "l1" : n < 6 ? "l2" : "l3";
    cells.push(`<i class="${lvl} ${t === today ? "today" : ""} ${t > today ? "future" : ""}" title="${new Date(t).toLocaleDateString("ru-RU")}: ${n ? n + " " + plural(n, "действие", "действия", "действий") : "без занятий"}"></i>`);
  }
  return `<div class="heat">${cells.join("")}</div><p class="note" style="margin:0">Последние ${weeks} недель: изученные и повторённые темы, вопросы экзамена, решённые упражнения.</p>`;
}

function viewPlanSetup() {
  const ps = planSetup, p = DATA.paths[ps.path], items = p ? pathItems(p) : [];
  const left = items.filter(f => !isDone(f)).length, perDay = perDayOf(ps.minutes);
  const today = startOfDay(Date.now());
  let hint = `Осталось ${left} ${plural(left, "тема", "темы", "тем")} · ≈${perDay} ${plural(perDay, "тема", "темы", "тем")} в день → путь будет пройден к <b>${dateLabel(addDays(today, Math.max(0, Math.ceil(left / perDay) - 1)))}</b>.`;
  if (ps.deadline) {
    const days = daysBetween(today, new Date(ps.deadline + "T00:00")) + 1;
    if (days < 1) hint += `<br>⚠ Дата цели уже прошла — выберите другую.`;
    else {
      const need = Math.ceil(left / days);
      hint += `<br>Чтобы успеть к ${dateLabel(new Date(ps.deadline + "T00:00"))}, нужно ${need} ${plural(need, "тема", "темы", "тем")} в день (≈${need * TOPIC_MIN} мин)` +
        (need > perDay ? ` — <b>больше выбранного</b>, увеличьте время или сдвиньте дату.` : " — выбранного времени хватает ✔");
    }
  }
  return `<div class="page">
    <h1>📅 План занятий</h1>
    <p class="sub">Выберите путь и сколько времени в день готовы учиться. На одну тему уходит примерно ${TOPIC_MIN} минут: прочитать шпаргалку и ответить на вопросы.</p>
    <h2>Учебный путь</h2>
    <div class="src">${DATA.paths.map((x, i) => `<button class="btn" aria-pressed="${i === ps.path}" data-plan-path="${i}">${esc(x.title.replace(/\s*\(.*\)\s*$/, ""))} · ${pathItems(x).filter(f => !isDone(f)).length}</button>`).join("")}</div>
    <h2>Минут в день</h2>
    <div class="src">${PLAN_MINUTES.map(m => `<button class="btn" aria-pressed="${m === ps.minutes}" data-plan-min="${m}">${m}</button>`).join("")}</div>
    <h2>Цель к дате <span class="note">(необязательно)</span></h2>
    <p><input type="date" id="planDeadline" value="${esc(ps.deadline)}" min="${dayKey(Date.now())}"></p>
    <p class="note">${hint}</p>
    <p style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="cta" data-plan="save">${state.plan ? "✔ Сохранить план" : "▶ Начать план"}</button>
      ${state.plan ? `<button class="btn" data-plan="cancel">Отмена</button>` : ""}
    </p>
  </div>`;
}

function viewPlan() {
  if (!state.plan && !planSetup) planSetup = { path: 0, minutes: 30, deadline: "" };
  if (planSetup) return viewPlanSetup();
  const st = planStatus();
  if (!st) { state.plan = null; save(); return viewPlan(); }
  const pathIdx = state.plan.path, ctx = `p:${pathIdx}`, s = streak(), due = dueTopics();
  // упражнение к ближайшему этапу, где ещё есть нерешённые
  const stage = st.p.stages.find(x => x.items.some(f => !isDone(f))) || st.p.stages[st.p.stages.length - 1];
  const upTo = st.p.stages.slice(0, st.p.stages.indexOf(stage) + 1).flatMap(x => x.exercises);
  const openEx = list => DATA.exercises.findIndex(e => list.includes(e.topic) && !state.exDone[e.id]);
  let exIdx = openEx(upTo), exNote = "упражнение к пройденным этапам";
  if (exIdx < 0 && !upTo.length) { exIdx = openEx(st.p.stages.flatMap(x => x.exercises)); exNote = "упражнение следующего этапа — можно посмотреть заранее"; }
  const status = !st.left.length ? `<span class="plan-status ok">🎉 Путь пройден — можно выбрать следующий</span>`
    : st.lag > 0 ? `<span class="plan-status late">Отставание: ${st.lag} ${plural(st.lag, "тема", "темы", "тем")} — догоните сегодня или пересмотрите план</span>`
    : st.ahead > 0 ? `<span class="plan-status ok">Опережение графика на ${st.ahead} ${plural(st.ahead, "тему", "темы", "тем")} 🚀</span>`
    : `<span class="plan-status ok">Идёте по графику ✔</span>`;
  const late = st.deadline && st.finish && st.finish > st.deadline;
  return `<div class="page">
    <p class="sub" style="margin:0">📅 День ${st.dayNo} · ${esc(st.p.title)} · ${state.plan.minutes} мин в день (≈${st.perDay} ${plural(st.perDay, "тема", "темы", "тем")})</p>
    <h1>План на сегодня</h1>
    <p>${status}</p>
    <div class="cards">
      <div class="card"><b>🔥 Серия: ${s} ${plural(s, "день", "дня", "дней")} подряд</b><div class="meta">${activityByDay()[dayKey(Date.now())] ? "Сегодня вы уже занимались ✔" : "Сделайте хотя бы одно дело сегодня, чтобы серия не прервалась"}</div></div>
      <div class="card"><b>Путь: ${st.items.length - st.left.length} из ${st.items.length}</b>${bar(st.items)}
        <div class="meta">${st.finish ? `Прогноз окончания: ${dateLabel(st.finish)}` : "Все темы изучены"}${st.deadline ? ` · цель: ${dateLabel(st.deadline)}${late ? " ⚠ не успеваете" : " ✔"}` : ""}</div></div>
    </div>

    <h2>1. Новые темы ${countLabel(st.doneToday.concat(st.todo))}</h2>
    ${st.doneToday.length + st.todo.length ? `<ol class="topics">${st.doneToday.concat(st.todo).map(f => topicRow(f, ctx)).join("")}</ol>` : ""}
    ${st.todo.length ? `<p><a class="cta" href="#/t/${encodeURIComponent(st.todo[0])}?ctx=${ctx}">▶ Изучать: ${esc(title(st.todo[0]))}</a></p>`
      : st.left.length ? `<p class="note">Норма выполнена. Можно продолжить — следующая тема: <a href="#/t/${encodeURIComponent(st.left[0])}?ctx=${ctx}">${esc(title(st.left[0]))}</a> (засчитается в опережение).</p>` : ""}

    <h2>2. Повторение</h2>
    <p>${due.length ? `<a class="btn" href="#/r">🔁 Повторить ${due.length} ${plural(due.length, "тему", "темы", "тем")}</a>` : `<span class="note">На сегодня повторять нечего ✔</span>`}</p>

    <h2>3. Практика</h2>
    <p>${exIdx >= 0 ? `<a class="btn" href="#/x/${exIdx}">💪 ${esc(DATA.exercises[exIdx].title)}</a> <span class="note">— ${exNote}</span>`
      : `<span class="note">Упражнения к пройденным этапам решены ✔ ${DATA.projects.some(x => x.path === pathIdx) ? `Попробуйте <a href="#/j/${DATA.projects.findIndex(x => x.path === pathIdx)}">итоговый проект пути</a>.` : ""}</span>`}</p>

    <h2>Активность</h2>
    ${heatmap()}
    <p style="margin-top:22px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" data-plan="edit">✎ Изменить план</button>
      <button class="btn" data-plan="stop">Удалить план</button>
    </p>
  </div>`;
}

function planAction(a) {
  if (a === "save") {
    const p = DATA.paths[planSetup.path];
    const keep = state.plan && state.plan.path === planSetup.path;      // тот же путь — график не начинаем заново
    state.plan = {
      path: planSetup.path, minutes: planSetup.minutes, deadline: planSetup.deadline || "",
      start: keep ? state.plan.start : Date.now(),
      leftAtStart: keep ? state.plan.leftAtStart : pathItems(p).filter(f => !isDone(f)).length,
    };
    planSetup = null; save();
  } else if (a === "edit") planSetup = { path: state.plan.path, minutes: state.plan.minutes, deadline: state.plan.deadline || "" };
  else if (a === "cancel") planSetup = null;
  else if (a === "stop" && confirm("Удалить план занятий? Прогресс и серия дней сохранятся.")) { state.plan = null; planSetup = null; save(); }
  render();
}

function viewNotes() {
  const list = Object.entries(state.notes).filter(([f]) => DATA.titles[f]).sort((a, b) => b[1].t - a[1].t);
  return `<div class="page">
    <h1>📝 Мои заметки</h1>
    <p class="sub">${list.length ? "Сначала — последние изменённые. Править заметку можно в панели «❓ Вопросы» на странице темы." : "Заметок пока нет. Откройте любую тему и нажмите «❓ Вопросы» (клавиша Q) — внизу панели есть поле для заметок."}</p>
    ${list.map(([f, n]) => `<div class="card note-card" style="margin-bottom:10px">
      <a href="#/t/${encodeURIComponent(f)}"><b>${esc(title(f))}</b></a>
      <span class="note"> · ${new Date(n.t).toLocaleDateString("ru-RU")}</span>
      <pre>${esc(n.text)}</pre></div>`).join("")}
  </div>`;
}

// ---------- глоссарий ----------
const termsOf = (() => {                                // термины, которые ссылаются на тему
  const by = {};
  (DATA.glossary || []).forEach(t => t.topics.forEach(f => (by[f] = by[f] || []).push(t)));
  return f => by[f] || [];
})();
const termId = t => "term-" + t.t.toLowerCase().replace(/[^a-z0-9а-яё]+/g, "-").replace(/^-|-$/g, "");
let glossaryQuery = "";

function termHtml(t) {
  return `<div class="term" id="${termId(t)}"><b>${esc(t.t)}</b><div class="md">${markdown(t.d)}</div>
    ${t.topics.length ? `<div class="chips">📘 ${t.topics.map(f => `<a class="chip ${isDone(f) ? "done" : ""}" href="#/t/${encodeURIComponent(f)}">${esc(title(f))}</a>`).join("")}</div>` : ""}</div>`;

function viewGlossary() {
  const q = glossaryQuery.toLowerCase().trim();
  const list = DATA.glossary.filter(t => !q || (t.t + " " + t.d).toLowerCase().includes(q));
  const groups = {};
  list.forEach(t => { const L = t.t[0].toUpperCase(); (groups[L] = groups[L] || []).push(t); });
  return `<div class="page">
    <h1>📖 Глоссарий</h1>
    <p class="sub">${DATA.glossary.length} ${plural(DATA.glossary.length, "термин", "термина", "терминов")} ML и DL с короткими определениями и ссылками на шпаргалки.
      Термины темы также видны в панели «❓ Вопросы» на странице шпаргалки.</p>
    <input class="gloss-filter" id="glossFilter" type="search" placeholder="Фильтр: термин или слово из определения…" value="${esc(glossaryQuery)}" autocomplete="off">
    <div class="gloss-letters">${Object.keys(groups).map(L => `<a href="#/k/${encodeURIComponent(L)}">${esc(L)}</a>`).join("")}</div>
    ${list.length ? Object.entries(groups).map(([L, ts]) => `<h2 id="letter-${esc(L)}">${esc(L)}</h2>${ts.map(termHtml).join("")}`).join("") : `<div class="empty">Ничего не найдено.</div>`}
  </div>`;
}

// #/k/A — к букве, #/k/<термин> — к термину с подсветкой
function glossaryJump(target) {
  if (!target) return;
  const t = DATA.glossary.find(x => x.t.toLowerCase() === target.toLowerCase());
  const el = t ? document.getElementById(termId(t)) : document.getElementById("letter-" + target);
  if (!el) return;
  if (t) el.classList.add("hit");
  el.scrollIntoView({ block: "start" });
}

// ---------- мини-рендер markdown для заданий ----------
function markdown(src) {
  const inline = s => {
    const codes = [];                            // код прячем, чтобы * и ** внутри него не стали разметкой
    return esc(s)
      .replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/(^|[^*\w])\*([^*\s](?:[^*]*[^*\s])?)\*(?![*\w])/g, "$1<i>$2</i>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
      .replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[+i]}</code>`);
  };
  const out = []; let list = null, code = null, table = null, para = null, quote = null;   // para — строки текущего абзаца
  const flush = () => {
    if (list) { out.push(`<${list.tag}>${list.items.map(i => `<li>${i}</li>`).join("")}</${list.tag}>`); list = null; }
    if (table) { out.push(`<table>${table.map((r, k) => `<tr>${r.map(c => k ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("")}</tr>`).join("")}</table>`); table = null; }
    if (para) { out.push(`<p>${para.map(inline).join(" ")}</p>`); para = null; }
    if (quote) { out.push(`<blockquote>${markdown(quote.join("\n"))}</blockquote>`); quote = null; }
  };
  for (const line of src.split(/\r?\n/)) {
    if (code !== null) {
      if (line.startsWith("```")) { out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); code = null; } else code.push(line);
      continue;
    }
    if (line.startsWith("```")) { flush(); code = []; continue; }
    let m;
    if ((m = line.match(/^>\s?(.*)/))) { if (!quote) { flush(); quote = []; } quote.push(m[1]); continue; }
    if (quote) flush();
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { flush(); const l = Math.min(m[1].length + 1, 4); out.push(`<h${l}>${inline(m[2])}</h${l}>`); }
    else if (/^\s*\|.*\|\s*$/.test(line)) {
      if (list || para) flush();
      const cells = line.trim().slice(1, -1).split("|").map(c => c.trim());
      if (!cells.every(c => /^:?-+:?$/.test(c))) (table = table || []).push(cells);
    }
    else if ((m = line.match(/^\s*([-*]|\d+\.)\s+(.*)/))) {
      const tag = /\d/.test(m[1]) ? "ol" : "ul";
      if (/^\s{2,}/.test(line) && list) { list.items[list.items.length - 1] += "<br>• " + inline(m[2]); continue; }
      if (!list || list.tag !== tag) { flush(); list = { tag, items: [] }; }
      list.items.push(inline(m[2]));
    }
    else if (!line.trim()) flush();
    else if (/^\s+\S/.test(line) && list) list.items[list.items.length - 1] += " " + inline(line.trim());
    else { if (list || table) flush(); (para = para || []).push(line.trim()); }   // строки подряд — один абзац
  }
  if (code !== null) out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
  flush();
  return out.join("\n");
}

// ---------- боковая панель ----------
function setTab(tab, rerender = true) {
  state.tab = tab; save();
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  if (rerender) renderNav();
}

function renderNav() {
  const tab = state.tab, hash = location.hash.split("?")[0];
  const item = (href, label, items) =>
    `<a class="navitem ${hash === href ? "active" : ""}" href="${href}"><span>${esc(label)}</span>${items ? countLabel(items) : ""}</a>`;
  let html = "";
  if (tab === "paths") {
    html = (Object.keys(LECT).length ? `<a class="navitem ${hash.startsWith("#/l") ? "active" : ""}" href="#/l"><span>🎓 Лекции</span><small class="full">${lecRead()}/${Object.keys(LECT).length}</small></a>` : "")
      + DATA.paths.map((p, i) => item(`#/p/${i}`, p.title, pathItems(p))).join("");
  } else if (tab === "exercises") {
    html = (UND.length ? `<a class="navitem ${hash.startsWith("#/u") ? "active" : ""}" href="#/u"><span>🧩 Задачи на понимание</span><small class="full">${UND.filter(u => state.und[u.id]).length}/${UND.length}</small></a>` : "")
      + `<div class="navgroup">🏗 мини-проекты</div>` + DATA.projects.map((p, i) =>
      `<a class="navitem ${hash === "#/j/" + i ? "active" : ""}" href="#/j/${i}"><span>${esc(p.title)}</span><small class="full">${state.projDone[p.id] ? "✔" : ""}</small></a>`).join("");
    const groups = {};
    DATA.exercises.forEach((e, i) => { const g = e.kind === "bug" ? "🐞 найди ошибку" : e.topic; (groups[g] = groups[g] || []).push([e, i]); });
    html += Object.entries(groups).map(([g, list]) => `<div class="navgroup">${esc(g.replace(/_/g, " "))}</div>` +
      list.map(([e, i]) => `<a class="navitem ${hash === "#/x/" + i ? "active" : ""}" href="#/x/${i}"><span>${esc(e.title)}</span><small class="full">${state.exDone[e.id] ? "✔" : ""}</small></a>`).join("")).join("");
  } else {
    html = DATA.parts.map((p, pi) => `<div class="navgroup">${esc(p.title)}</div>` +
      p.sections.map((s, si) => item(`#/s/${pi}/${si}`, s.title, s.items)).join("")).join("");
  }
  document.getElementById("navList").innerHTML = html;
  const active = document.querySelector(".navitem.active");
  if (active) active.scrollIntoView({ block: "nearest" });
}

const fmtXp = n => n.toLocaleString("ru-RU");

function streakDays() {

// Этап пройден, когда изучены все его темы; ⭐ — когда решены ещё и все упражнения этапа
function stageList() {

      exLeft: ex.filter(e => !state.exDone[e.id]).length, left: s.items.filter(f => !isDone(f)).length,

    { icon: "🧩", label: "Верные задачи на понимание", n: c.und, xp: c.und * XP.und, per: `${XP.und} за задачу` },
    { icon: "🏗", label: "Мини-проекты", n: c.projects, xp: c.projects * XP.project, per: `${XP.project} за проект` },
    { icon: "📝", label: "Экзамены", n: c.exams, xp: examXp, per: `1 XP за верный ответ, не больше ${XP.examCap}` },

// Проверка после каждого сохранения: новый этап, уровень, награда → поздравление
function gamSoon() { clearTimeout(gamTimer); gamTimer = setTimeout(gamTick, 60); }
function gamSeed() {    // уже набранное не празднуем: фиксируем текущее положение без поздравлений
  const g = gamStats();
  state.gam = { celebrated: {}, lvl: g.lv.cur.n, badges: {} };
  g.stages.forEach(s => { if (s.done) state.gam.celebrated[s.key] = 1; if (s.star) state.gam.celebrated[s.key + "*"] = 1; });

}
function gamTick() {

  const g = gamStats(), G = state.gam, ev = { stages: [], level: null, badges: [], stars: [] };
  g.stages.forEach(s => {
    if (s.done && !G.celebrated[s.key]) { G.celebrated[s.key] = Date.now(); ev.stages.push(s); }
    if (s.star && !G.celebrated[s.key + "*"]) { G.celebrated[s.key + "*"] = Date.now(); if (!ev.stages.includes(s)) ev.stars.push(s); }
  });
  if (g.lv.cur.n > G.lvl) { ev.level = g.lv.cur; G.lvl = g.lv.cur.n; }
  g.badges.forEach(b => { if (b.ok && !G.badges[b.id]) { G.badges[b.id] = Date.now(); ev.badges.push(b); } });
  if (ev.stages.length || ev.stars.length || ev.level || ev.badges.length) persist();
  renderLevelChip();
  if (parseHash().parts[0] === "me") rerenderKeepScroll();
  if (ev.stages.length || ev.level) showCelebration(ev, g);
  else if (ev.stars.length) toast(`⭐ <b>${esc(ev.stars[0].title)}</b>: все упражнения решены — <b>+${XP.star} XP</b>`);
  else if (ev.badges.length) toast(`🎖 Новая награда: ${ev.badges.map(b => `${b.icon} <b>${esc(b.name)}</b>`).join(", ")} — <a href="#/me">к наградам</a>`);
}
function gamBoot() {
  gamTick();
  detectServer().then(async ok => {
    if (ok && session && session.token) {
      const sig = s => JSON.stringify(Object.assign({}, s, { savedAt: 0 })), before = sig(state);
      await pullMerge();
      if (sig(state) !== before) { render(); refreshChrome(); }
    }
    refreshChrome();
  });
}

// ---------- профиль и вход ----------
function detectServer() {          // start.py отвечает на api/ping; GitHub Pages и file:// — нет, профиль тогда остаётся в браузере
  if (!serverPromise) serverPromise = (async () => {
    if (!/^https?:$/.test(location.protocol)) return (serverMode = false);
    try { const r = await fetch("api/ping", { cache: "no-store" }); serverMode = r.ok && (await r.json()).ok === true; }
    catch (e) { serverMode = false; }
    return serverMode;
  })();
  return serverPromise;
}
async function api(method, url, body) {
  const headers = { "Content-Type": "application/json" };
  if (session && session.token) headers.Authorization = "Bearer " + session.token;
  const res = await fetch(url, { method, headers, body: body === undefined ? undefined : JSON.stringify(body), cache: "no-store" });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 401 && session && session.token && url.includes("progress")) sessionExpired();
    throw new Error(data.error || `Ошибка сервера (${res.status})`);
  }
  return data;
}
function setSync(s) {

  if (el) el.textContent = syncText();
  renderLevelChip();
}
function syncText() {
  if (!session) return "";
  if (session.local) return "💾 Профиль хранится только в этом браузере: сервера портала здесь нет.";
  if (!session.token) return "⚠ Сессия истекла — войдите снова, чтобы изменения сохранялись на сервере.";
  if (syncInfo.s === "err") return "⚠ Нет связи с сервером — изменения отправятся при следующем сохранении.";
  if (syncInfo.s === "ok") return `☁ Сохранено на сервере портала в ${new Date(syncInfo.t).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}.`;
  return "☁ Профиль хранится на сервере портала.";
}
function sessionExpired() {
  session = Object.assign({}, session, { token: null });
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) {}
  setSync("err"); refreshChrome();
}
function pushSoon() {
  if (!(session && session.token)) return;
  clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 1200);
}
async function pushNow() {
  if (!(session && session.token)) return;
  clearTimeout(pushTimer);
  const g = gamStats();
  try { await api("PUT", "api/progress", { state, xp: g.xp, level: g.lv.cur.n }); setSync("ok"); }
  catch (e) { setSync("err"); }
}
// Сводим прогресс устройства и сервера: отметки объединяются (берём более раннюю дату), остальное — из более свежей копии
function mergeStates(a, b) {
  const newer = (a.savedAt || 0) >= (b.savedAt || 0) ? a : b, older = newer === a ? b : a;
  const out = Object.assign(emptyState(), older, newer);
  const combine = (key, pick) => {
    const r = Object.assign({}, older[key]);
    for (const [k, v] of Object.entries(newer[key] || {})) r[k] = k in r ? pick(r[k], v) : v;
    out[key] = r;
  };
  const min = (x, y) => Math.min(x, y), max = (x, y) => Math.max(x, y), later = (x, y) => ((y && y.t) || 0) >= ((x && x.t) || 0) ? y : x;
  ["done", "lec", "projDone", "reveal"].forEach(k => combine(k, min));
  ["exDone", "exAuto", "hints", "activity"].forEach(k => combine(k, max));
  ["und", "notes"].forEach(k => combine(k, later));
  ["review", "exRev"].forEach(k => combine(k, (x, y) => y));
  const seen = new Set();
  out.exams = [...(older.exams || []), ...(newer.exams || [])].filter(x => !seen.has(x.t) && seen.add(x.t)).sort((x, y) => x.t - y.t).slice(-50);
  const ga = a.gam, gb = b.gam;
  out.gam = ga && gb ? { celebrated: Object.assign({}, ga.celebrated, gb.celebrated), badges: Object.assign({}, ga.badges, gb.badges), lvl: Math.max(ga.lvl, gb.lvl) } : (ga || gb || null);

async function pullMerge() {
  if (!(session && session.token)) return;
  try {
    const remote = await api("GET", "api/progress");
    state = mergeStates(state, Object.assign(emptyState(), remote.state || {}));
    if (!state.gam) gamSeed();
    persist(); setSync("ok");
  } catch (e) { setSync("err"); }
}
function adoptSession(s, takeGuest) {         // takeGuest: при регистрации прогресс из этого браузера переходит в профиль
  const guest = session ? null : state;
  session = s;
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) {}
  if (takeGuest && guest) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} state = guest; persist(); }

}
const readUsers = () => { try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; } catch (e) { return {}; } };
async function hashPin(pin, salt) {
  const text = salt + "|" + pin;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
  }
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;       // запасной вариант для http вне localhost, где нет crypto.subtle
  for (let i = 0; i < text.length; i++) { const ch = text.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);

async function authServer(mode, name, pin) {
  const g = gamStats();
  const body = mode === "register" ? { name, pin, state: session ? {} : state, xp: session ? 0 : g.xp, level: session ? 1 : g.lv.cur.n } : { name, pin };
  const res = await api("POST", "api/" + mode, body);
  adoptSession({ name: res.name, token: res.token }, mode === "register");
  if (mode === "login") await pullMerge(); else setSync("ok");
}
async function authLocal(mode, name, pin) {
  const users = readUsers(), key = name.toLowerCase();
  if (mode === "register") {
    if (users[key]) throw new Error("Такое имя уже есть в этом браузере");
    const salt = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, "0")).join("");
    users[key] = { name, salt, hash: await hashPin(pin, salt), created: Date.now() };
    try { localStorage.setItem(USERS_KEY, JSON.stringify(users)); } catch (e) { throw new Error("Браузер не даёт сохранить профиль"); }
    adoptSession({ name, local: true }, true);
  } else {
    const u = users[key];
    if (!u || u.hash !== await hashPin(pin, u.salt)) throw new Error("Неверное имя или PIN");
    adoptSession({ name: u.name, local: true }, false);
  }
}
async function authSubmit(form) {
  const mode = form.dataset.mode, name = form.elements.uname.value.trim(), pin = form.elements.pin.value;
  const btn = form.querySelector("[type=submit]"), err = document.getElementById("authErr");
  const fail = msg => { err.textContent = msg; btn.disabled = false; };

  if (pin.length < 4 || pin.length > 32) return fail("PIN — от 4 до 32 символов");
  btn.disabled = true; err.textContent = "";
  try { if (await detectServer()) await authServer(mode, name, pin); else await authLocal(mode, name, pin); }
  catch (e) { return fail(e.message || "Не удалось войти"); }
  closeModal(); render(); refreshChrome();
  const g = gamStats();
  toast(`✔ ${mode === "register" ? "Профиль создан" : "Вы вошли"}, <b>${esc(session.name)}</b>! ${g.lv.cur.icon} Уровень ${g.lv.cur.n} · ${fmtXp(g.xp)} XP`);
}
async function logout() {
  if (session && session.token) await pushNow();

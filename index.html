екодирование** наиболее вероятной последовательности скрытых состояний — алгоритм Витерби; **обучение** параметров по наблюдениям — алгоритм Баума–Велша (частный случай EM)."}, {"q": "Почему вероятность наблюдений не считают перебором всех путей скрытых состояний?", "a": "Путей Nᵀ — экспоненциально много. Forward-алгоритм использует динамическое программирование и марковское свойство, сводя сложность к **O(N²·T)**."}, {"q": "Чем отличается результат алгоритма Витерби от выбора наиболее вероятного состояния в каждый момент отдельно?", "a": "Витерби находит **наиболее вероятную целую последовательность**. Покомпонентный выбор по апостериорным вероятностям (forward-backward) может дать последовательность с нулевой вероятностью, например с запрещённым переходом."}, {"q": "Какие ограничения накладывает марковское предположение HMM?", "a": "Скрытое состояние зависит только от предыдущего, а наблюдение — только от текущего состояния. Поэтому HMM плохо моделирует длинные зависимости; время пребывания в состоянии неявно распределено геометрически."}, {"q": "Почему при реализации HMM работают с логарифмами вероятностей или масштабированием?", "a": "Произведение многих вероятностей < 1 на длинных последовательностях быстро уходит в машинный ноль (underflow). Логарифмы превращают произведения в суммы, а в forward используют масштабирование или log-sum-exp."}], "hoeffding_trees_cheatsheet.html": [{"q": "Почему дерево Хёфдинга может принимать решение о разбиении, не видя все данные?", "a": "Неравенство Хёфдинга гарантирует, что среднее по n примерам отличается от истинного не больше чем на ε = √(R²·ln(1/δ) / 2n) с вероятностью 1 − δ. Если лучший признак опережает второй по критерию больше чем на ε, с высокой вероятностью он лучший и на всём потоке."}, {"q": "Как размер ε зависит от числа примеров и что это значит на практике?", "a": "ε убывает как 1/√n: чтобы уменьшить его вдвое, нужно вчетверо больше примеров. Поэтому узел копит статистики, пока разрыв между признаками не станет больше ε, и при близких признаках может ждать очень долго."}, {"q": "Зачем нужен параметр tie threshold τ?", "a": "Если два лучших признака почти одинаково хороши, разница может никогда не превысить ε, и узел не будет делиться. Когда ε < τ, разбиение делают по лучшему признаку, так как выбор между почти равными признаками уже не важен."}, {"q": "Почему дерево Хёфдинга экономно по памяти?", "a": "Оно не хранит примеры: в каждом листе лежат только достаточные статистики (счётчики значений признаков по классам или оценки распределений для числовых признаков). Каждый пример обрабатывается один раз за время, не зависящее от числа уже виденных примеров."}, {"q": "Чем Hoeffding Adaptive Tree отличается от базового VFDT?", "a": "Базовое дерево предполагает стационарный поток и не умеет забывать. Адаптивная версия ставит в узлы детекторы дрейфа (ADWIN), выращивает альтернативные поддеревья и заменяет старые, если новые стали точнее."}], "hugging_face_transformers_cheatsheet.html": [{"q": "Что делают классы AutoTokenizer и AutoModel и зачем они нужны?", "a": "Методы `from_pretrained` по имени чекпоинта автоматически выбирают нужный класс токенизатора и модели (BERT, GPT-2, T5…) и загружают веса. Это позволяет менять модель одной строкой без правки остального кода."}, {"q": "Почему нельзя использовать токенизатор от одной модели с весами другой?", "a": "У каждой модели свой словарь и правила токенизации: id токенов не совпадут с эмбеддингами, и модель получит бессмысленный вход. Токенизатор и модель всегда загружают из одного чекпоинта."}, {"q": "Чем AutoModel отличается от AutoModelForSequenceClassification?", "a": "`AutoModel` возвращает только базовый трансформер со скрытыми состояниями. Классы `...For<Task>` добавляют голову под задачу; при загрузке голова инициализируется случайно (будет предупреждение) и требует дообучения."}, {"q": "Зачем нужна attention_mask при батчевой обработке?", "a": "Последовательности разной длины дополняются паддингом до одной длины; маска говорит модели игнорировать pad-токены во внимании. Без неё паддинг влияет на представления и результаты зависят от состава батча."}, {"q": "Как дообучить большую модель, если не хватает GPU-памяти?", "a": "Использовать **LoRA/PEFT** (обучать малые адаптеры), смешанную точность (fp16/bf16), gradient accumulation, gradient checkpointing и квантизацию (например, QLoRA). Многие из этих опций включаются через аргументы `TrainingArguments`."}], "hybrid_recommender_systems_cheatsheet.html": [{"q": "Зачем объединять коллаборативный и контентный подходы?", "a": "Они компенсируют слабости друг друга: коллаборативный ловит неочевидные вкусовые связи, но страдает от холодного старта, контентный работает для новых объектов, но склонен к «пузырю» однотипных рекомендаций. Гибрид даёт лучшее качество и покрытие."}, {"q": "Чем взвешенная гибридизация отличается от переключающей (switching)?", "a": "**Взвешенная** смешивает оценки нескольких моделей: score = w₁·s_CF + w₂·s_CB. **Переключающая** выбирает одну модель в зависимости от ситуации — например, контентную для пользователей с менее чем 5 взаимодействиями и коллаборативную для остальных."}, {"q": "Как устроена типичная двухэтапная схема «кандидаты + ранжирование»?", "a": "Несколько быстрых генераторов (ALS, item-to-item, популярное, контентный поиск по эмбеддингам) отбирают сотни кандидатов из миллионов объектов. Затем модель ранжирования (часто градиентный бустинг) с богатыми признаками, включая скоры генераторов, упорядочивает этот короткий список."}, {"q": "Какая ошибка часто возникает при обучении ранжирующей модели поверх генераторов кандидатов?", "a": "Обучение на скорах генераторов, которые сами обучены на тех же данных: скоры получаются переобученными, и ранжировщик слишком им доверяет. Генераторы нужно обучать на более раннем периоде, а ранжировщик — на следующем, по аналогии со стекингом."}, {"q": "Как гибридные модели вроде LightFM решают холодный старт?", "a": "Эмбеддинг пользователя или объекта строится как сумма эмбеддингов его признаков (включая индикатор ID). Для нового объекта без взаимодействий вектор получается из его контентных признаков, а для известных объектов дополнительно уточняется по ID."}], "hypernetworks_cheatsheet.html": [{"q": "Что такое гиперсеть?", "a": "Сеть, которая генерирует веса другой (основной) сети по некоторому входу — эмбеддингу слоя, задачи или условия. Обучается end-to-end: градиент от лосса основной сети проходит в параметры гиперсети."}, {"q": "Зачем генерировать веса, а не обучать их напрямую?", "a": "Можно сжать параметры (малая гиперсеть генерирует много весов), быстро адаптировать модель к новой задаче или условию по эмбеддингу, делить знания между задачами — например, в continual и meta-learning."}, {"q": "Какая основная сложность при генерации весов большой сети?", "a": "Выход гиперсети должен иметь размер, равный числу весов основной сети, — это миллионы чисел. Поэтому генерируют веса по частям (по слоям или блокам с эмбеддингами), используют низкоранговые разложения или генерируют только малые части, например адаптеры."}, {"q": "Почему при обучении гиперсетей важна инициализация?", "a": "Стандартные схемы инициализации гиперсети не дают генерируемым весам нужного масштаба (как у Xavier/He), и основная сеть получает взрывающиеся или затухающие активации. Нужна специальная инициализация с учётом масштаба выхода."}, {"q": "Как гиперсети связаны с LoRA и условными слоями вроде FiLM?", "a": "**FiLM** генерирует по условию коэффициенты масштаба и сдвига активаций — это частный случай гиперсети. Гиперсеть может генерировать и LoRA-адаптеры под новую задачу, вместо обучения адаптера с нуля."}], "hyperparameter_strategies_cheatsheet.html": [{"q": "Почему случайный поиск часто эффективнее сеточного при том же бюджете?", "a": "Обычно лишь несколько гиперпараметров сильно влияют на качество. Сетка 3×3 из 9 точек даёт только 3 разных значения каждого параметра, а 9 случайных точек — 9 разных значений важного параметра, то есть существенные оси исследуются плотнее."}, {"q": "Почему learning rate и коэффициент регуляризации ищут в логарифмической шкале?", "a": "Их влияние зависит от порядка величины: разница между 0.001 и 0.01 так же важна, как между 0.1 и 1. При равномерной выборке на [0.0001, 1] около 90% точек попадут в диапазон 0.1–1, поэтому сэмплируют равномерно по логарифму (`loguniform`)."}, {"q": "Сколько обучений модели выполнит GridSearchCV с сеткой 4×3×5 и cv=5?", "a": "4·3·5 = 60 комбинаций × 5 фолдов = **300 обучений**, плюс одно финальное переобучение лучшей конфигурации на всех данных при `refit=True` — итого 301."}, {"q": "В чём идея Successive Halving и Hyperband?", "a": "Много конфигураций запускаются с малым бюджетом (мало эпох, данных или деревьев), худшие отбрасываются, а оставшимся бюджет увеличивается. Hyperband запускает несколько таких «скобок» с разным соотношением числа конфигураций и начального бюджета, чтобы не отсечь медленно стартующие, но хорошие варианты."}, {"q": "Какая типичная ошибка приводит к завышенной оценке качества после подбора гиперпараметров?", "a": "Сообщать лучший CV-скор поиска как итоговое качество — он оптимистично смещён, потому что гиперпараметры подобраны под эти же фолды. Нужна отдельная отложенная выборка или **nested cross-validation**; препроцессинг при этом должен быть внутри `Pipeline`, иначе возникает утечка между фолдами."}], "hyperparameter_tuning_cheatsheet.html": [{"q": "Чем гиперпараметры отличаются от параметров модели?", "a": "Параметры (веса, коэффициенты) модель находит сама при обучении. Гиперпараметры (глубина дерева, learning rate, α регуляризации) задаются до обучения и подбираются снаружи — по качеству на валидации."}, {"q": "Почему Random Search часто эффективнее Grid Search при том же числе запусков?", "a": "Обычно важны лишь немногие гиперпараметры. Сетка многократно перебирает одни и те же значения важного параметра, а случайный поиск при каждом запуске пробует новое значение каждого параметра и лучше покрывает важные измерения."}, {"q": "Сколько обучений сделает `GridSearchCV` с сеткой 4 × 3 × 5 и `cv=5`?", "a": "4·3·5 = 60 комбинаций × 5 фолдов = 300 обучений, плюс одно финальное обучение лучшей модели на всех данных (`refit=True`)."}, {"q": "Почему для learning rate и α значения перебирают по логарифмической шкале?", "a": "Важен порядок величины: разница между 0.001 и 0.01 так же существенна, как между 0.1 и 1. Равномерная сетка потратила бы почти все попытки на большие значения. В sklearn — `loguniform` или `np.logspace`."}, {"q": "Почему оценка лучшей модели из `GridSearchCV` (best_score_) оптимистична?", "a": "Мы выбрали максимум из многих оценок на тех же фолдах — часть превосходства случайна. Честную оценку даёт отдельная тестовая выборка или вложенная (nested) кросс-валидация."}], "hypothesis_testing_cheatsheet.html": [{"q": "Почему p-value = 0.03 не означает, что H₀ верна с вероятностью 3%?", "a": "p-value — это вероятность получить такие же или более экстремальные данные **при условии, что H₀ верна**: P(данные | H₀), а не P(H₀ | данные). Вероятность самой гипотезы частотный подход не вычисляет — для этого нужен байесовский вывод с априорным распределением."}, {"q": "Чем отличаются ошибки I и II рода и как они связаны с мощностью теста?", "a": "Ошибка I рода — отвергли верную H₀ (вероятность α), ошибка II рода — не отвергли ложную H₀ (вероятность β). **Мощность** = 1 − β; она растёт с размером выборки и величиной эффекта, а при фиксированном n уменьшение α увеличивает β."}, {"q": "Что будет, если проверить 20 независимых гипотез на уровне α = 0.05?", "a": "Вероятность хотя бы одной ложной находки при верных H₀ ≈ 1 − 0.95²⁰ ≈ **64%**. Нужна поправка на множественные сравнения: Бонферрони (α/m, строгая, контролирует FWER) или Бенджамини–Хохберг (контролирует FDR, мощнее)."}, {"q": "Почему статистически значимый результат может быть практически бесполезным?", "a": "При огромной выборке даже ничтожный эффект (например, +0.01% конверсии) даёт маленький p-value. Поэтому вместе с p-value смотрят **размер эффекта** (Cohen's d, разность средних) и доверительный интервал."}, {"q": "Когда вместо t-критерия использовать критерий Манна–Уитни?", "a": "Когда выборки малы и распределение сильно отличается от нормального или есть выбросы. Манна–Уитни — непараметрический ранговый тест, он устойчив к выбросам, но проверяет сдвиг распределений, а не строго равенство средних; при больших n t-тест работает и без нормальности благодаря ЦПТ."}], "image_classification_dl_cheatsheet.html": [{"q": "Почему для классификации изображений используют свёрточные слои, а не полносвязные?", "a": "Свёртка использует **локальность** и **разделение весов**: одно ядро ищет один паттерн по всему изображению. Это на порядки сокращает число параметров и даёт эквивариантность к сдвигу, тогда как полносвязный слой на картинке 224×224×3 потребовал бы огромного числа весов и быстро переобучился."}, {"q": "Когда стоит брать предобученную модель, а не обучать с нуля?", "a": "Почти всегда при небольшом датасете (тысячи–десятки тысяч изображений): признаки, выученные на ImageNet, хорошо переносятся. Обучение с нуля оправдано при очень больших данных или при сильно отличающемся домене (спектрограммы, медицинские снимки), но и там предобучение обычно ускоряет сходимость."}, {"q": "Какая типичная ошибка с аугментацией данных?", "a": "Применять аугментации к **валидационной и тестовой** выборкам или выбирать преобразования, меняющие класс (например, горизонтальный флип для распознавания цифр или текста, поворот для «6» и «9»). Аугментации делают только на train и только сохраняющие метку."}, {"q": "Почему при fine-tuning важно использовать ту же нормализацию входа, что и при предобучении?", "a": "Веса предобученной сети рассчитаны на определённое распределение входов (например, вычитание среднего ImageNet и деление на std, или масштаб [−1, 1]). Другая нормализация сдвигает активации всех слоёв, и качество резко падает даже без ошибок в коде."}, {"q": "Сколько параметров в слое Conv2D с 64 фильтрами 3×3 на входе с 32 каналами?", "a": "Каждый фильтр имеет 3·3·32 = 288 весов и 1 смещение, итого (288 + 1)·64 = **18 496** параметров. Размер входного изображения на число параметров свёртки не влияет."}], "image_segmentation_cheatsheet.html": [{"q": "Чем семантическая сегментация отличается от instance- и panoptic-сегментации?", "a": "Семантическая присваивает класс каждому пикселю, не различая объекты одного класса. Instance выделяет каждый объект отдельно. Panoptic объединяет оба подхода: отдельные экземпляры для «вещей» (люди, машины) и классы для «фона» (небо, дорога)."}, {"q": "Как устроена U-Net и зачем в ней skip-связи?", "a": "Энкодер сжимает изображение и извлекает признаки, декодер восстанавливает разрешение. Skip-связи передают карты признаков энкодера в декодер на том же уровне, возвращая мелкие пространственные детали, потерянные при сжатии."}, {"q": "Какие функции потерь используют для сегментации и почему не только кросс-энтропию?", "a": "Попиксельную кросс-энтропию, а также Dice loss и IoU (Jaccard) loss, которые напрямую оптимизируют перекрытие масок. Они устойчивее к дисбалансу, когда объект занимает малую долю изображения."}, {"q": "Как вычисляется метрика mIoU?", "a": "Для каждого класса считается IoU = |предсказание ∩ разметка| / |предсказание ∪ разметка| по пикселям, затем значения усредняются по классам."}, {"q": "Как Mask R-CNN решает задачу instance-сегментации?", "a": "Расширяет детектор Faster R-CNN: для каждой найденной рамки дополнительная ветка предсказывает бинарную маску объекта. RoIAlign точно выравнивает признаки области без грубого округления координат."}], "image_text_models_cheatsheet.html": [{"q": "Чем отличаются задачи image captioning, VQA и text-to-image?", "a": "**Captioning** — по изображению сгенерировать описание; **VQA** — ответить на вопрос об изображении (вход — картинка и текст, выход — текст); **text-to-image** — сгенерировать изображение по тексту. Первые две решают энкодер изображения + языковой декодер, третью — обычно диффузионные модели с текстовым условием."}, {"q": "Как типичная современная vision-language модель (LLaVA и аналоги) соединяет изображение с LLM?", "a": "Предобученный визуальный энкодер (часто ViT из CLIP) превращает картинку в набор патч-эмбеддингов, а небольшой **проектор** (линейный слой или MLP) отображает их в пространство токенов LLM. Затем визуальные токены подаются в языковую модель вместе с текстом, и её учат на инструкциях."}, {"q": "Зачем при обучении таких моделей часто замораживают энкодер изображения и LLM?", "a": "Обе части уже хорошо предобучены, а парных данных изображение–текст для полного дообучения мало и это очень дорого. Сначала обучают только проектор (выравнивание модальностей), затем при необходимости размораживают LLM или используют LoRA, чтобы не испортить знания модели (**катастрофическое забывание**)."}, {"q": "Что такое «галлюцинации объектов» в vision-language моделях?", "a": "Модель описывает объекты, которых на изображении нет, потому что языковая часть дописывает правдоподобный по статистике текст (за столом — «стулья»). Их оценивают специальными бенчмарками (например, POPE, CHAIR) и уменьшают качественными данными и дообучением на отказ от выдумок."}, {"q": "Почему метрики вроде BLEU плохо оценивают подписи к изображениям?", "a": "Одну картинку можно верно описать многими способами, а BLEU считает совпадение n-грамм с эталонами и штрафует корректные перефразировки. Поэтому используют CIDEr, SPICE, а также метрики на основе эмбеддингов (CLIPScore) и оценку людьми."}], "image_to_image_translation_cheatsheet.html": [{"q": "Чем pix2pix отличается от CycleGAN по требованиям к данным?", "a": "**pix2pix** требует парных данных (вход и соответствующий выход, например карта сегментации и фото). **CycleGAN** работает на непарных наборах двух доменов (лошади и зебры) благодаря циклической согласованности."}, {"q": "Зачем в CycleGAN нужна cycle-consistency loss?", "a": "Без неё генератор может выдавать любое правдоподобное изображение целевого домена, не связанное с входом. Требование F(G(x)) ≈ x заставляет сохранять содержимое исходного изображения."}, {"q": "Почему в pix2pix к adversarial loss добавляют L1 loss?", "a": "L1 заставляет выход быть близким к целевому изображению по низкочастотной структуре, а GAN-лосс отвечает за чёткость и реалистичные детали. Одна L1 даёт размытые картинки, а один GAN-лосс — артефакты и несоответствие входу."}, {"q": "Что такое PatchGAN-дискриминатор и зачем он нужен?", "a": "Дискриминатор оценивает реалистичность каждого локального патча (например, 70×70), а не всего изображения целиком. Это фокусирует его на текстурах и высокочастотных деталях и требует меньше параметров."}, {"q": "Какая типичная ловушка CycleGAN при сильно различающихся доменах?", "a": "Он хорошо меняет цвет и текстуру, но плохо меняет геометрию (например, кошку в собаку). Также генератор может «спрятать» информацию о входе в незаметном шуме, чтобы выполнить cycle-consistency — это форма **стеганографии**."}], "imbalanced_algorithms_cheatsheet.html": [{"q": "Что такое threshold moving и почему это часто первый шаг?", "a": "Модель обучают как обычно, а порог 0.5 заменяют на подобранный по валидации под нужную метрику (F1, recall при заданном precision, стоимость ошибок). Данные не меняются, вероятности остаются честными, а результат часто не хуже пересемплирования."}, {"q": "Как работает EasyEnsemble?", "a": "Строится несколько подвыборок: в каждой весь миноритарный класс и **случайная равная часть** мажоритарного. На каждой обучается модель (в оригинале AdaBoost), прогнозы усредняются. Так undersampling не теряет информацию — разные модели видят разные части мажоритарного класса."}, {"q": "Какая идея лежит в Focal Loss?", "a": "FL = −(1 − p_t)^γ · log(p_t): множитель (1 − p_t)^γ **уменьшает вклад лёгких**, уже уверенно классифицированных примеров (обычно — фон или мажоритарный класс), и обучение фокусируется на трудных. γ = 0 даёт обычную кросс-энтропию."}, {"q": "Когда стоит переходить к one-class классификации или детекции аномалий?", "a": "Когда примеров редкого класса почти нет (единицы) или они разнородны и в будущем могут появиться новые типы (мошенничество, поломки). Модель (Isolation Forest, One-Class SVM) учит только «норму» и отмечает отклонения."}, {"q": "Что такое RUSBoost и BalancedRandomForest?", "a": "**RUSBoost** — бустинг, где перед каждой итерацией делается случайный undersampling мажоритарного класса. **BalancedRandomForest** — случайный лес, где каждое дерево строится на сбалансированной бутстреп-выборке. Оба есть в `imblearn.ensemble`."}], "imbalanced_data_cheatsheet.html": [{"q": "Какие метрики использовать при сильном дисбалансе классов?", "a": "Не accuracy, а precision, recall, F1 для редкого класса, PR-AUC, ROC-AUC (с осторожностью), balanced accuracy. Выбор зависит от цены ошибок в задаче."}, {"q": "Как работает SMOTE?", "a": "Создаёт синтетические объекты редкого класса: берёт объект, одного из его k ближайших соседей того же класса и генерирует точку на отрезке между ними."}, {"q": "Почему oversampling нужно делать только на обучающей части?", "a": "Если увеличить выборку до разбиения, копии или синтетические соседи одного объекта попадут и в train, и в validation — модель «увидит» валидационные данные, и оценка будет завышена. В sklearn используют `Pipeline` из imbalanced-learn внутри кросс-валидации."}, {"q": "Какие есть альтернативы пересэмплированию?", "a": "Веса классов в функции потерь (`class_weight='balanced'`), подбор порога классификации, алгоритмы, устойчивые к дисбалансу (бустинг с `scale_pos_weight`), focal loss, сбор дополнительных данных редкого класса."}, {"q": "Почему после undersampling или oversampling вероятности модели смещены?", "a": "Модель обучалась на искусственном соотношении классов и переоценивает вероятность редкого класса. Если нужны реальные вероятности, их пересчитывают с учётом исходных долей или калибруют."}], "imbalanced_metrics_cheatsheet.html": [{"q": "Почему accuracy вводит в заблуждение при дисбалансе?", "a": "Если редкий класс — 1% объектов, модель, всегда предсказывающая мажоритарный класс, получает **99% accuracy**, но не находит ни одного нужного объекта."}, {"q": "Чем PR-AUC лучше ROC-AUC при сильном дисбалансе?", "a": "FPR делится на огромное число отрицательных, поэтому даже много ложных срабатываний почти не меняет ROC-AUC. Precision напрямую показывает, сколько из найденных объектов действительно положительные. Базовый уровень PR-AUC равен доле положительного класса, а не 0.5."}, {"q": "Когда выбирать F1, а когда F-beta с β ≠ 1?", "a": "F1 — гармоническое среднее precision и recall с равными весами. **F2** (β = 2) сильнее учитывает recall — когда дорого пропустить (болезни, мошенничество), **F0.5** — precision — когда дороги ложные тревоги."}, {"q": "Чем macro-усреднение отличается от weighted и micro в многоклассовой задаче?", "a": "**Macro** — простое среднее метрики по классам, все классы равнозначны, поэтому чувствительно к редким классам. **Weighted** — взвешено по числу объектов и маскирует плохое качество на редких классах. **Micro** считает по суммарным TP/FP/FN (для single-label F1 совпадает с accuracy)."}, {"q": "Что показывают balanced accuracy и MCC?", "a": "**Balanced accuracy** — среднее recall по классам (для случайного классификатора 0.5 в бинарном случае). **MCC** — корреляция между предсказаниями и истиной от −1 до 1, учитывает все 4 ячейки матрицы ошибок и устойчив к дисбалансу."}], "imitation_learning_cheatsheet.html": [{"q": "Что такое behavior cloning и в чём его главная проблема?", "a": "Обучение политики как обычного supervised-предсказания действия эксперта по состоянию. Проблема — **накопление ошибок** (covariate shift): небольшая ошибка выводит агента в состояния, которых не было в демонстрациях, и ошибки растут квадратично с горизонтом."}, {"q": "Как DAgger решает проблему covariate shift?", "a": "Итеративно запускает текущую политику, собирает посещённые ею состояния, просит эксперта разметить правильные действия и дообучается на объединённом датасете. Так обучающее распределение приближается к реальному распределению агента."}, {"q": "В чём идея GAIL?", "a": "Дискриминатор учится отличать пары (s, a) эксперта от агента, а политика обучается RL с наградой от дискриминатора. Это сопоставление распределений состояний-действий без явного восстановления награды."}, {"q": "Когда behavior cloning достаточно?", "a": "Когда демонстраций много, они покрывают разнообразные ситуации, включая восстановление после ошибок, и горизонт короткий. Тогда простой supervised-подход часто работает не хуже сложных методов."}, {"q": "Чем имитационное обучение отличается от inverse RL?", "a": "Imitation learning напрямую получает политику, inverse RL сначала восстанавливает функцию награды, а затем политику по ней. IRL лучше обобщается при изменении динамики среды, но гораздо дороже."}], "inception_efficientnet_cheatsheet.html": [{"q": "В чём основная идея Inception-модуля?", "a": "Параллельно применить свёртки разного размера (1×1, 3×3, 5×5) и пулинг и конкатенировать результаты по каналам. Сеть сама выбирает подходящий масштаб признаков в каждом слое."}, {"q": "Зачем в Inception свёртки 1×1 перед 3×3 и 5×5?", "a": "Как «бутылочное горлышко»: они уменьшают число каналов, резко сокращая вычисления и параметры дорогих свёрток. Плюс добавляют нелинейность."}, {"q": "Что такое compound scaling в EfficientNet?", "a": "Одновременное масштабирование глубины, ширины и разрешения: d = αᵠ, w = βᵠ, r = γᵠ с ограничением α·β²·γ² ≈ 2, так что FLOPs растут примерно в 2ᵠ раз. Сбалансированное масштабирование эффективнее увеличения только одного измерения."}, {"q": "Из каких блоков состоит EfficientNet?", "a": "Базовая сеть B0 найдена NAS и построена из блоков **MBConv** (инвертированный residual-блок MobileNetV2 с depthwise-свёрткой) с **Squeeze-and-Excitation** и активацией Swish/SiLU. B1–B7 получены compound scaling."}, {"q": "Почему EfficientNet с малым числом FLOPs не всегда быстрее на GPU?", "a": "Depthwise-свёртки имеют малую арифметическую интенсивность и упираются в пропускную способность памяти, а высокое разрешение увеличивает расход памяти на активации. Поэтому FLOPs плохо предсказывают реальную латентность; это мотивировало EfficientNetV2 с Fused-MBConv."}], "incremental_learning_cheatsheet.html": [{"q": "Что такое катастрофическое забывание?", "a": "При дообучении нейросети на новых данных или задачах она резко теряет качество на старых, потому что веса перестраиваются под новый материал. Это главная проблема инкрементного и continual learning."}, {"q": "Как методы replay борются с забыванием?", "a": "Хранят небольшой буфер старых примеров (или генерируют их моделью) и подмешивают в обучение на новых данных. Просто и эффективно, но требует памяти и может быть ограничено приватностью данных."}, {"q": "Как работает регуляризационный подход вроде EWC?", "a": "**Elastic Weight Consolidation** добавляет штраф λ/2·∑ Fᵢ(θᵢ − θᵢ*)², где Fᵢ — диагональ информации Фишера: веса, важные для старых задач, «пружинят» к прежним значениям, а неважные могут свободно меняться."}, {"q": "Какие модели sklearn поддерживают инкрементное обучение?", "a": "Модели с методом `partial_fit`: `SGDClassifier`, `SGDRegressor`, `Perceptron`, `PassiveAggressiveClassifier`, `MultinomialNB`, `MiniBatchKMeans` и другие. При первом вызове классификатору нужно передать полный список классов через параметр `classes`."}, {"q": "Чем class-incremental сценарий сложнее task-incremental?", "a": "В task-incremental на тесте известно, к какой задаче относится пример, и можно использовать отдельную «голову». В class-incremental модель должна выбирать среди всех когда-либо виденных классов без подсказки, и сильно смещается в пользу новых классов."}], "inductive_logic_programming_cheatsheet.html": [{"q": "Какие условия должна выполнять гипотеза H в ILP?", "a": "Вместе с фоновыми знаниями B она должна покрывать все положительные примеры (**полнота**, B ∧ H ⊨ E⁺) и не покрывать отрицательные (**непротиворечивость**). На шумных данных требования смягчают до покрытия большинства."}, {"q": "Чем ILP выгодно отличается от нейросетей?", "a": "Результат — читаемые логические правила, можно использовать фоновые знания эксперта, и для обучения часто хватает нескольких примеров. Выученные правила хорошо обобщаются на структуры другого размера."}, {"q": "Почему поиск в ILP вычислительно сложен?", "a": "Пространство возможных клауз растёт комбинаторно с числом предикатов и переменных, а проверка покрытия требует логического вывода. Поэтому вводят языковой bias: mode declarations, ограничение длины клауз, схемы правил."}, {"q": "Чем подходы «сверху вниз» (FOIL) отличаются от «снизу вверх» (Golem)?", "a": "Top-down начинают с самого общего правила и специализируют его, добавляя литералы, пока не исключат негативы. Bottom-up начинают со специфичных клауз, построенных по примерам, и обобщают их (например, через least general generalization)."}, {"q": "Какую проблему решает predicate invention?", "a": "Система сама вводит новые вспомогательные предикаты, которых нет в фоновых знаниях. Это позволяет выучивать более компактные и рекурсивные программы, но сильно расширяет пространство поиска."}], "influence_maximization_cheatsheet.html": [{"q": "Как формулируется задача максимизации влияния?", "a": "Выбрать k начальных вершин (seed set), чтобы ожидаемое число активированных вершин в модели распространения (Independent Cascade или Linear Threshold) было максимальным. Задача NP-трудна."}, {"q": "Почему жадный алгоритм даёт гарантию (1 − 1/e)?", "a": "Функция ожидаемого охвата в моделях IC и LT **монотонна и субмодулярна** (убывающая отдача: добавление вершины к большему множеству приносит не больше прироста). Для таких функций жадный выбор гарантирует не хуже ≈ 63% от оптимума."}, {"q": "Чем Independent Cascade отличается от Linear Threshold?", "a": "В **IC** каждая только что активированная вершина один раз пытается активировать каждого соседа с вероятностью p. В **LT** вершина активируется, когда суммарный вес активных соседей превышает её случайный порог — влияние накапливается."}, {"q": "Почему просто взять k вершин с наибольшей степенью — плохая стратегия?", "a": "Хабы часто находятся в одном плотном районе сети, и их охваты сильно перекрываются. Жадный алгоритм учитывает маргинальный прирост и выбирает вершины, покрывающие разные части сети."}, {"q": "Почему наивный жадный алгоритм медленный и как его ускоряют?", "a": "Для каждого кандидата на каждом шаге нужно оценить охват тысячами симуляций Монте-Карло. Ускоряют через CELF (ленивые пересчёты, опирающиеся на субмодулярность) и методы на reverse reachable sets (RIS, TIM, IMM)."}], "information_bottleneck_theory_cheatsheet.html": [{"q": "Какую задачу формулирует принцип информационного бутылочного горлышка?", "a": "Найти представление T входа X, минимизирующее I(X; T) − β·I(T; Y): сжать как можно больше информации о входе, сохранив информацию о целевой переменной. β управляет балансом сжатия и предсказательности."}, {"q": "Что утверждали Шварц-Зив и Тишби о двух фазах обучения нейросетей?", "a": "Что на информационной плоскости сначала идёт фаза **подгонки** (растёт I(T; Y) и I(X; T)), а затем фаза **сжатия**, где I(X; T) уменьшается, и именно сжатие связано с обобщением."}, {"q": "Почему эти выводы были оспорены?", "a": "Saxe et al. показали, что фаза сжатия появлялась при насыщающихся активациях (tanh), а с ReLU её может не быть, и обобщение возможно без сжатия. Кроме того, результаты сильно зависят от способа оценки взаимной информации (бинирования)."}, {"q": "Почему взаимная информация I(X; T) в детерминированной сети с непрерывными входами — проблемная величина?", "a": "Для детерминированного инъективного отображения непрерывного входа она бесконечна или постоянна, поэтому «сжатие» нельзя измерить без дискретизации или добавления шума. Получаемые значения отражают скорее метод оценки, чем свойства сети."}, {"q": "Где идея информационного бутылочного горлышка нашла практическое применение?", "a": "В **Variational Information Bottleneck**: стохастический энкодер обучается с вариационной оценкой ограничения I(X; Z), что даёт регуляризацию и устойчивость. Связь с β-VAE также основана на этой идее."}], "information_theory_ml_cheatsheet.html": [{"q": "Посчитайте энтропию честной монеты и монеты с P(орёл) = 0.9.", "a": "Честная: H = −2·0.5·log₂0.5 = **1 бит**. Нечестная: H = −(0.9·log₂0.9 + 0.1·log₂0.1) ≈ 0.137 + 0.332 ≈ **0.47 бита**. Чем предсказуемее исход, тем ниже энтропия."}, {"q": "Почему KL-дивергенция не является расстоянием?", "a": "Она **несимметрична**: KL(P ‖ Q) ≠ KL(Q ‖ P), и не выполняет неравенство треугольника. Также она бесконечна, если Q(x) = 0 там, где P(x) > 0. Симметричный вариант — дивергенция Дженсена–Шеннона."}, {"q": "Как связаны кросс-энтропия и KL-дивергенция и почему минимизировать их при обучении — одно и то же?", "a": "H(P, Q) = H(P) + KL(P ‖ Q). Энтропия истинного распределения H(P) от модели Q не зависит, поэтому минимизация кросс-энтропии эквивалентна минимизации KL."}, {"q": "Что такое information gain в деревьях решений?", "a": "Уменьшение энтропии целевой переменной после разбиения: IG = H(Y) − ∑ (nₖ/n)·H(Y | ветка k). Дерево выбирает разбиение с максимальным IG. Это частный случай взаимной информации между признаком-разбиением и таргетом."}, {"q": "Чем взаимная информация лучше корреляции для отбора признаков?", "a": "Взаимная информация I(X; Y) = 0 только при **независимости** и улавливает любые, в том числе нелинейные, зависимости, а корреляция Пирсона — только линейные. Минус — её трудно точно оценить для непрерывных величин (sklearn `mutual_info_classif` использует kNN-оценку)."}], "integrated_gradients_cheatsheet.html": [{"q": "Как вычисляются Integrated Gradients?", "a": "Выбирается **baseline** x′ (например, чёрное изображение), и градиенты интегрируются вдоль прямой от x′ до x: IGᵢ = (xᵢ − x′ᵢ)·∫₀¹ ∂F(x′ + α(x − x′))/∂xᵢ dα. На практике интеграл приближают суммой Римана по 20–300 шагам."}, {"q": "Какую проблему простых градиентов решает IG?", "a": "**Насыщение**: когда признак уже сильно влияет на выход, функция выходит на плато, и градиент в точке x почти нулевой, хотя признак важен. IG накапливает градиенты по всему пути от baseline, где функция ещё не насыщена."}, {"q": "Что такое аксиома полноты (completeness) и как её использовать для проверки?", "a": "Сумма атрибуций равна разности выходов: ∑ᵢ IGᵢ = F(x) − F(x′). Если при вычислении равенство заметно нарушается, значит **шагов интегрирования мало** — нужно увеличить их число."}, {"q": "Почему выбор baseline критичен?", "a": "Атрибуции объясняют разницу относительно baseline. Признаки, совпадающие с baseline, получают **нулевую** атрибуцию: при чёрном baseline тёмные пиксели объекта никогда не будут важны. Используют несколько baseline (размытое изображение, шум, их среднее); для текста — эмбеддинг паддинга или нулевой вектор."}, {"q": "Какую ещё аксиому, кроме полноты, выполняет IG и чем она важна?", "a": "**Implementation invariance**: две сети, вычисляющие одну и ту же функцию, получают одинаковые атрибуции независимо от внутреннего устройства. Методы вроде DeepLIFT и LRP, основанные на правилах обратного распространения по слоям, этой аксиоме в общем случае не удовлетворяют."}], "intrusion_detection_cheatsheet.html": [{"q": "Чем signature-based обнаружение отличается от anomaly-based?", "a": "Сигнатурное ищет известные шаблоны атак: мало ложных срабатываний, но не видит новых атак (zero-day). Аномальное моделирует нормальное поведение и сигналит об отклонениях: ловит новое, но даёт больше false positives."}, {"q": "Почему accuracy — плохая метрика для IDS?", "a": "Атак обычно доли процента, и модель «всё нормально» получит accuracy > 99%. Смотрят recall по атакам, precision, PR-AUC и, главное, абсолютное число ложных тревог в день — аналитики SOC тонут в false positives."}, {"q": "Почему модель, обученная на KDD Cup 99 или NSL-KDD, может плохо работать в реальной сети?", "a": "Эти датасеты устарели, частично синтетические и содержат артефакты, по которым атаку легко отличить. Реальный трафик другой, а атаки и нормальное поведение со временем меняются (concept drift), поэтому нужна валидация на своих данных и регулярное переобучение."}, {"q": "Почему при валидации IDS нельзя случайно перемешивать сетевые записи?", "a": "Записи одной сессии или атаки сильно коррелированы, и случайный сплит даёт утечку и завышенные метрики. Правильно делить по времени (обучение на прошлом, тест на будущем) или по сессиям и хостам, а также проверять на типах атак, которых не было в обучении."}, {"q": "Какие признаки обычно используют для обнаружения сетевых вторжений?", "a": "Агрегаты по потокам (flow): длительность, число пакетов и байт в обе стороны, флаги TCP, порты и протокол, число соединений к хосту или порту за окно времени, доля ошибок соединения. Содержимое пакетов часто зашифровано, поэтому опираются на метаданные."}], "inverse_rl_cheatsheet.html": [{"q": "Чем инверсное RL отличается от обычного RL и от behavior cloning?", "a": "Обычное RL ищет политику по известной награде; IRL восстанавливает **награду** по демонстрациям эксперта. Behavior cloning копирует действия напрямую, а IRL пытается понять цель, что обобщается на новые ситуации и динамику лучше."}, {"q": "Почему задача IRL некорректно поставлена?", "a": "Много наград объясняют одно и то же поведение; например, R ≡ 0 делает любую политику оптимальной. Поэтому нужны доп. принципы: максимизация зазора, максимальная энтропия, байесовский приор."}, {"q": "В чём идея Maximum Entropy IRL?", "a": "Среди распределений траекторий, совпадающих с экспертом по ожидаемым признакам, выбирают распределение максимальной энтропии: P(τ) ∝ exp(R(τ)). Это снимает неоднозначность и учитывает неоптимальность эксперта."}, {"q": "Почему классическое IRL вычислительно дорогое?", "a": "Во внутреннем цикле для каждой кандидатной награды нужно решать задачу RL (или считать функцию разбиения), то есть RL оказывается вложенным в оптимизацию. Методы вроде GAIL и AIRL обходят это, обучая политику и дискриминатор совместно."}, {"q": "Когда IRL имеет смысл применять?", "a": "Когда награду трудно задать вручную (вождение, манипуляции роботом), но есть демонстрации, и нужна обобщаемость: восстановленную награду можно оптимизировать в изменённой среде."}], "isolation_forest_cheatsheet.html": [{"q": "На какой идее основан Isolation Forest?", "a": "Аномалии редки и отличаются от остальных, поэтому их легче **изолировать** случайными разбиениями. В случайном дереве аномальная точка отделяется за меньшее число разбиений, и её средняя глубина пути по всем деревьям меньше, чем у нормальных точек."}, {"q": "Почему Isolation Forest обучают на небольших подвыборках (по умолчанию 256 объектов)?", "a": "Подвыборка уменьшает эффекты **маскировки** (плотная группа аномалий прикрывает друг друга) и **swamping** (нормальные точки рядом с аномалиями ошибочно помечаются). Кроме того, это делает алгоритм очень быстрым, а качество с ростом подвыборки почти не растёт."}, {"q": "На что влияет параметр contamination?", "a": "Он не меняет сами деревья и anomaly score, а только задаёт порог, по которому `predict` помечает долю точек как аномалии. Если contamination неизвестен, лучше смотреть на `score_samples`/`decision_function` и выбирать порог по бизнес-требованиям."}, {"q": "Нужно ли масштабировать признаки для Isolation Forest?", "a": "Обычно нет: разбиения выполняются по одному признаку со случайным порогом в его диапазоне, поэтому результат инвариантен к монотонному масштабированию отдельных признаков. Это отличает его от дистанционных методов вроде LOF и One-Class SVM."}, {"q": "В каких случаях Isolation Forest работает плохо?", "a": "Когда аномалия проявляется не в экстремальных значениях отдельных признаков, а в их необычной комбинации или в локальной плотности (точка между кластерами), а также при большом числе нерелевантных признаков, которые «разбавляют» случайные разбиения. Осепараллельные разрезы также создают артефакты в оценке — это решает Extended Isolation Forest."}], "isomap_cheatsheet.html": [{"q": "Какие шаги выполняет Isomap?", "a": "Строит граф k ближайших соседей (или ε-окрестностей), вычисляет кратчайшие пути в графе как приближение геодезических расстояний (алгоритмы Дейкстры или Флойда–Уоршелла) и применяет к полученной матрице расстояний классическое MDS."}, {"q": "Почему Isomap разворачивает «швейцарский рулет», а PCA — нет?", "a": "PCA сохраняет евклидовы расстояния и проецирует витки рулета друг на друга. Isomap сохраняет расстояния вдоль поверхности (геодезические), поэтому точки соседних витков, далёкие по поверхности, остаются далёкими и в результате рулет «раскатывается» в плоскость."}, {"q": "Что будет при слишком большом числе соседей?", "a": "В графе появятся рёбра, «замыкающие» соседние витки многообразия напрямую. Кратчайшие пути пойдут через эти короткие замыкания, геодезические расстояния исказятся, и Isomap начнёт вести себя как линейный метод."}, {"q": "Что будет при слишком малом числе соседей?", "a": "Граф может распасться на несвязные компоненты, и расстояния между ними будут бесконечными — вложение получится некорректным. Нужно выбирать k так, чтобы граф был связным."}, {"q": "Какие ограничения у Isomap?", "a": "Он предполагает, что многообразие изометрично выпуклой области евклидова пространства, поэтому плохо справляется с «дырами» и невыпуклыми областями. Он чувствителен к шуму и дорог на больших данных: кратчайшие пути между всеми парами и разложение матрицы n×n."}], "jax_flax_cheatsheet.html": [{"q": "Почему JAX требует писать чистые функции без побочных эффектов?", "a": "Преобразования `jit`, `grad`, `vmap` трассируют функцию и компилируют её через **XLA**; побочные эффекты (print, изменение глобальных переменных) выполнятся лишь при трассировке, а не при каждом вызове. Состояние, включая параметры модели, передаётся явно аргументами."}, {"q": "Почему в JAX случайные числа генерируются через явные ключи PRNGKey?", "a": "Глобальный генератор — скрытое состояние, несовместимое с чистыми функциями и параллелизмом. Ключ передаётся явно и разделяется через `jax.random.split`; повторное использование того же ключа даст те же самые «случайные» числа — типичная ошибка."}, {"q": "Что делает vmap и чем он удобен?", "a": "`jax.vmap` автоматически векторизует функцию, написанную для одного примера, по оси батча. Например, можно получить градиенты по каждому примеру отдельно (per-example gradients), не переписывая код и без циклов Python."}, {"q": "Почему функция под jit перекомпилируется и как этого избежать?", "a": "Компиляция специализируется под формы и dtype входов (и статические аргументы); новая форма — новая компиляция. Избегают, фиксируя размеры (паддинг батчей) и не используя Python-условия по значениям тензоров — для них нужны `jax.lax.cond` или пометка `static_argnums`."}, {"q": "Как в Flax устроены модель и её параметры?", "a": "Модуль описывает архитектуру, а параметры хранятся отдельно в дереве (pytree): `params = model.init(key, x)`, затем `model.apply(params, x)`. Это отличается от PyTorch, где веса живут внутри объекта модели; оптимизация обычно делается через **Optax**."}], "kalman_filters_cheatsheet.html": [{"q": "Из каких двух шагов состоит итерация фильтра Калмана?", "a": "**Предсказание (predict)**: по модели динамики прогнозируется состояние и его ковариация, P растёт на Q. **Коррекция (update)**: прогноз уточняется по новому измерению с весом, который задаёт коэффициент Калмана K, а ковариация уменьшается."}, {"q": "Как коэффициент Калмана K зависит от шумов Q и R?", "a": "K = P⁻Hᵀ(HP⁻Hᵀ + R)⁻¹. При большом шуме измерения R фильтр доверяет модели (K → 0), при большой неопределённости прогноза P⁻ (её увеличивает Q) — K растёт, и оценка тянется к измерению. Отношение Q к R по сути задаёт степень сглаживания."}, {"q": "Рассчитайте одномерный шаг коррекции: прогноз 10 с дисперсией 4, измерение 14 с дисперсией 4.", "a": "K = 4 / (4 + 4) = 0.5, оценка = 10 + 0.5·(14 − 10) = **12**, новая дисперсия = (1 − 0.5)·4 = **2**. Объединение двух одинаково точных источников даёт среднее и вдвое меньшую дисперсию."}, {"q": "В каких условиях фильтр Калмана оптимален и что делать, если они нарушены?", "a": "Он даёт оптимальную (минимальную по MSE) оценку для **линейной** системы с **гауссовскими** шумами. Для нелинейной динамики используют расширенный (EKF, линеаризация через якобиан) или unscented (UKF, сигма-точки) фильтр, для сильно негауссовских распределений — particle filter."}, {"q": "Чем фильтрация отличается от сглаживания (Kalman smoother)?", "a": "Фильтр оценивает состояние в момент t только по наблюдениям до t включительно — подходит для онлайн-режима. Сглаживатель (например, RTS) использует и будущие наблюдения, давая более точные оценки, но применим только офлайн; использовать его для признаков в прогнозной модели — утечка."}], "kernel_cca_cheatsheet.html": [{"q": "Зачем нужен Kernel CCA, если есть обычный CCA?", "a": "Обычный CCA находит только линейные связи между представлениями. Kernel CCA отображает каждое представление в пространство признаков ядра (RBF, полиномиальное) и ищет корреляции там, что позволяет находить нелинейные зависимости."}, {"q": "Почему Kernel CCA без регуляризации даёт бессмысленный результат?", "a": "При обратимых матрицах Грама (например, у RBF-ядра) всегда найдутся направления с корреляцией ровно 1 — модель идеально подгоняется под любые данные. Поэтому обязательна регуляризация: Kₓ + κI в знаменателе."}, {"q": "Как растёт вычислительная сложность Kernel CCA с числом объектов?", "a": "Нужно хранить матрицы Грама n×n (O(n²) памяти) и решать обобщённую задачу на собственные значения размера порядка 2n (O(n³) времени). Для больших n используют низкоранговые приближения: неполное разложение Холецкого, метод Нистрёма, случайные признаки Фурье."}, {"q": "Чем Deep CCA отличается от Kernel CCA?", "a": "Deep CCA обучает две нейросети, отображающие представления в пространство, где их выходы максимально коррелированы. Он масштабируется на большие данные лучше ядерного метода, поскольку обучается минибатчами, и выучивает гибкие нелинейные преобразования."}, {"q": "Какие гиперпараметры нужно подбирать в Kernel CCA?", "a": "Тип и параметры ядра для каждого представления (например, ширина RBF), коэффициент регуляризации κ и число компонент. Подбирают по корреляции на отложенных данных: на обучающей выборке корреляция почти всегда завышена."}], "kernel_pca_cheatsheet.html": [{"q": "Чем Kernel PCA отличается от обычного PCA?", "a": "Kernel PCA выполняет PCA в неявном многомерном пространстве признаков, заданном ядром K(x, y) (RBF, полиномиальное и т. д.). Вместо ковариационной матрицы d×d раскладывается центрированная матрица ядра n×n, поэтому метод находит нелинейные главные компоненты."}, {"q": "Зачем центрировать матрицу ядра?", "a": "PCA требует центрированных данных, но отображение φ(x) явно не вычисляется. Центрирование выполняется прямо в матрице ядра: K̃ = K − 1ₙK − K1ₙ + 1ₙK1ₙ, где 1ₙ — матрица со всеми элементами 1/n."}, {"q": "Что будет при неудачном выборе γ в RBF-ядре?", "a": "При очень большом γ матрица ядра близка к единичной: каждая точка похожа только на себя, и компоненты ничего не говорят о структуре данных. При очень малом γ ядро почти линейно, и результат близок к обычному PCA. γ подбирают, например, по качеству последующей модели на кросс-валидации."}, {"q": "Почему восстановить исходный объект из Kernel PCA непросто?", "a": "Точка в пространстве признаков может не иметь точного прообраза в исходном пространстве (проблема pre-image). В sklearn восстановление приближённо реализуется через `fit_inverse_transform=True`, которое обучает отдельную регрессию."}, {"q": "Почему Kernel PCA трудно применять к большим выборкам?", "a": "Нужно хранить матрицу ядра n×n и выполнять её спектральное разложение — O(n²) памяти и до O(n³) времени, а преобразование новой точки требует вычисления ядра со всеми обучающими объектами. Используют подвыборку или приближения ядра (Nyström, random Fourier features)."}], "keypoint_detection_pose_estimation_cheatsheet.html": [{"q": "Почему ключевые точки чаще предсказывают через тепловые карты, а не прямой регрессией координат?", "a": "Heatmap сохраняет пространственную структуру: сеть остаётся полностью свёрточной и для каждой точки выдаёт «гауссиану» вероятности. Это обучается стабильнее и точнее, чем регрессия двух чисел из глобального вектора; координату затем берут как argmax или soft-argmax карты."}, {"q": "Чем отличаются подходы top-down и bottom-up к оценке позы нескольких людей?", "a": "**Top-down**: сначала детектор находит людей, затем для каждого бокса отдельно ищутся точки — точно, но время растёт с числом людей. **Bottom-up** (OpenPose): находятся все точки на кадре сразу, а затем группируются по людям (например, через Part Affinity Fields) — время почти не зависит от числа людей."}, {"q": "Что такое метрика OKS и зачем она нужна?", "a": "Object Keypoint Similarity — аналог IoU для ключевых точек: усреднённое exp(−dᵢ² / (2s²kᵢ²)) по видимым точкам, где d — ошибка, s — масштаб объекта, kᵢ — константа точки. Она нормирует ошибку на размер человека и «сложность» точки, и по порогам OKS считают AP в COCO."}, {"q": "Какая ловушка возникает при горизонтальном отражении изображения как аугментации?", "a": "После флипа нужно не только отразить координаты, но и **поменять местами** парные метки: левое запястье становится правым и наоборот. Иначе модель получит противоречивую разметку и будет путать стороны тела."}, {"q": "Как обрабатывать невидимые (закрытые) ключевые точки при обучении?", "a": "В разметке у точек есть флаг видимости; для неразмеченных точек loss обычно **маскируют**, чтобы не штрафовать модель за случайное положение. Для размеченных, но закрытых точек можно обучать предсказание — это помогает модели выучить структуру тела."}], "kmeans_cheatsheet.html": [{"q": "Какую функцию минимизирует K-means и почему алгоритм сходится?", "a": "Внутрикластерную сумму квадратов расстояний (inertia): ∑ₖ ∑_{x∈Cₖ} ‖x − μₖ‖². Ни шаг назначения точек ближайшему центру, ни шаг пересчёта центров как средних её не увеличивают, а разбиений конечное число — поэтому алгоритм сходится, но только к локальному минимуму."}, {"q": "Зачем нужна инициализация K-means++?", "a": "Случайные начальные центры могут оказаться рядом, и алгоритм застрянет в плохом локальном минимуме. K-means++ выбирает каждый следующий центр с вероятностью ∝ D(x)² — квадрату расстояния до ближайшего уже выбранного центра, разнося центры по данным. Дополнительно делают несколько запусков (`n_init`) и берут лучший по inertia."}, {"q": "На каких данных K-means работает плохо?", "a": "На кластерах невыпуклой формы (кольца, полумесяцы), сильно разного размера или плотности и вытянутых (анизотропных) — алгоритм неявно предполагает сферические кластеры сопоставимого размера. Он также чувствителен к выбросам, так как центр — это среднее."}, {"q": "Почему перед K-means нужно масштабировать признаки?", "a": "Алгоритм использует евклидово расстояние, и признак с большим разбросом значений будет определять разбиение почти единолично. Стандартизация уравнивает вклад признаков."}, {"q": "Почему нельзя выбрать k, просто минимизируя inertia?", "a": "Inertia монотонно убывает с ростом k (при оптимальной кластеризации) и равна 0 при k = n, когда каждая точка — свой кластер. Поэтому k выбирают по «локтю» графика inertia, силуэту, gap statistic или по смыслу задачи."}], "knn_cheatsheet.html": [{"q": "Как k-NN делает прогноз и что происходит на этапе обучения?", "a": "Обучения почти нет: модель запоминает выборку (ленивое обучение). Для нового объекта находятся k ближайших соседей, и прогноз — голосование их классов (классификация) или среднее их значений (регрессия)."}, {"q": "Как выбор k влияет на модель?", "a": "Маленькое k (например, 1) — сложная, «рваная» граница, чувствительность к шуму, переобучение. Большое k — сглаженная граница, недообучение. k подбирают на кросс-валидации; для двух классов удобно нечётное k."}, {"q": "Почему для k-NN обязательно масштабирование признаков?", "a": "Прогноз основан на расстояниях. Признак в больших единицах (доход в рублях) полностью «заглушит» признак в малых (возраст в годах)."}, {"q": "Что такое «проклятие размерности» и как оно влияет на k-NN?", "a": "В пространствах высокой размерности расстояния между всеми точками становятся почти одинаковыми, и понятие «ближайшего соседа» теряет смысл. Помогают отбор признаков и понижение размерности."}, {"q": "Почему k-NN медленно делает прогнозы на больших данных?", "a": "Для каждого нового объекта нужно считать расстояния до всей обучающей выборки. Ускоряют KD-деревья, Ball-деревья и приближённый поиск соседей (ANN)."}], "label_propagation_cheatsheet.html": [{"q": "Как работает label propagation?", "a": "Строится граф сходства по всем точкам; метки размеченных точек итеративно распространяются по рёбрам к соседям пропорционально весам, пока распределения меток не стабилизируются. Близкие в графе точки получают одинаковые метки."}, {"q": "Чем LabelPropagation отличается от LabelSpreading в sklearn?", "a": "`LabelPropagation` жёстко фиксирует исходные метки (hard clamping). `LabelSpreading` использует нормированный лапласиан и параметр `alpha`, позволяя частично менять исходные метки, — это устойчивее к шуму в разметке."}, {"q": "Почему важен выбор ядра и его параметров?", "a": "От них зависит граф. При RBF с очень маленьким gamma всё связано со всем, и метки размываются; при очень большом граф фактически распадается на изолированные точки, до которых метки не доходят. kNN-граф разреженнее и масштабируется лучше."}, {"q": "Почему label propagation с RBF-ядром плохо масштабируется?", "a": "Строится плотная матрица сходства n×n — O(n²) памяти и времени. Для больших n используют kNN-граф с разреженными матрицами или приближённый поиск соседей."}, {"q": "Что будет с точками в компоненте графа, где нет ни одной размеченной точки?", "a": "Метки туда не дойдут, и предсказания будут неопределёнными или произвольными. Нужно проверять связность графа и при необходимости увеличивать число соседей или менять параметры ядра."}], "latent_semantic_analysis_cheatsheet.html": [{"q": "Что делает LSA с матрицей термин-документ?", "a": "Применяет усечённое SVD: X ≈ U_k Σ_k V_kᵀ, оставляя k наибольших сингулярных значений. Документы и слова переводятся в k-мерное пространство латентных тем, где близки слова, встречающиеся в похожих контекстах."}, {"q": "Почему LSA помогает с синонимами?", "a": "Синонимы редко встречаются вместе, но появляются в похожих контекстах. Низкоранговое приближение объединяет такие паттерны совместной встречаемости в одни и те же компоненты, и синонимы получают близкие векторы."}, {"q": "Почему для LSA используют TruncatedSVD, а не PCA?", "a": "PCA центрирует данные, и разреженная матрица TF-IDF становится плотной — огромной по памяти. `TruncatedSVD` работает с разреженной матрицей напрямую, без центрирования."}, {"q": "Чем LSA хуже LDA с точки зрения интерпретации тем?", "a": "Компоненты SVD могут иметь отрицательные веса и не являются распределениями вероятностей, поэтому «темы» трудно интерпретировать. LDA — вероятностная модель, где тема — распределение над словами, а документ — смесь тем."}, {"q": "Как выбрать число компонент k?", "a": "Слишком малое k теряет смысловые различия, слишком большое оставляет шум. Часто берут порядка 100–300 для поиска, а точнее подбирают по качеству целевой задачи (поиск, классификация) или по доле объяснённой дисперсии."}], "lda_cheatsheet.html": [{"q": "Чем LDA отличается от PCA?", "a": "PCA — метод без учителя, ищет направления максимальной общей дисперсии. LDA использует метки классов и ищет направления, максимизирующие отношение межклассового разброса к внутриклассовому (критерий Фишера), то есть наилучшую разделимость классов."}, {"q": "Сколько компонент может дать LDA?", "a": "Не больше min(C − 1, d), где C — число классов, d — число признаков. Например, для бинарной классификации LDA проецирует данные на одну прямую, сколько бы признаков ни было."}, {"q": "Какие предположения лежат в основе LDA как классификатора?", "a": "Классы распределены нормально с общей ковариационной матрицей и разными средними. Тогда граница между классами линейна. Если ковариации разных классов сильно различаются, лучше подходит QDA с квадратичной границей."}, {"q": "Что будет, если признаков больше, чем объектов?", "a": "Внутриклассовая ковариационная матрица станет вырожденной, и её нельзя обратить. Помогает shrinkage-регуляризация ковариации (в sklearn — `solver='lsqr'` или `'eigen'` с `shrinkage='auto'`) или предварительное снижение размерности с помощью PCA."}, {"q": "Как не перепутать LDA из этой темы с LDA в анализе текстов?", "a": "Linear Discriminant Analysis — линейный метод классификации и снижения размерности с учителем. Latent Dirichlet Allocation — вероятностная тематическая модель для текстов, никак не связанная с ним, кроме аббревиатуры."}], "lda_method_cheatsheet.html": [{"q": "Чем LDA отличается от PCA?", "a": "PCA — без учителя, максимизирует дисперсию данных. **LDA** использует метки и ищет проекцию, максимизирующую отношение межклассового разброса к внутриклассовому, то есть лучше всего разделяющую классы."}, {"q": "Сколько компонент максимум даёт LDA?", "a": "Не больше **min(C − 1, d)**, где C — число классов, d — число признаков. Для бинарной задачи — всего одна ось, независимо от числа признаков."}, {"q": "Какие предположения делает LDA как классификатор?", "a": "Признаки в каждом классе распределены нормально с **одинаковой ковариационной матрицей**. Тогда граница между классами линейна. Если ковариации разные, лучше QDA с квадратичной границей."}, {"q": "Что будет с LDA, если признаков больше, чем объектов?", "a": "Внутриклассовая ковариационная матрица вырождена и не обращается. Помогает **shrinkage** (в sklearn `solver='lsqr'` или `'eigen'` с `shrinkage='auto'`) или предварительное снижение размерности."}, {"q": "Почему LDA часто хорошо работает даже при нарушении нормальности?", "a": "Направление Фишера, максимизирующее разделимость средних относительно разброса, разумно и без нормальности. Модель имеет мало параметров, поэтому устойчива на маленьких выборках, хотя граница может быть неоптимальной."}], "learning_curves_cheatsheet.html": [{"q": "Что показывает кривая обучения?", "a": "Зависимость ошибки (или качества) на обучающей и валидационной выборках от размера обучающей выборки. Она помогает понять, поможет ли сбор новых данных и чем страдает модель — высоким смещением или высокой дисперсией."}, {"q": "Как выглядит кривая обучения при высоком смещении (недообучении)?", "a": "Обе кривые быстро сходятся к близкому, но плохому уровню качества, разрыв между ними мал. Добавление данных почти не поможет — нужна более сложная модель, новые признаки или ослабление регуляризации."}, {"q": "Как выглядит кривая обучения при высокой дисперсии (переобучении)?", "a": "Качество на обучении высокое, на валидации заметно хуже, и между кривыми большой разрыв, который сокращается с ростом выборки. Здесь помогают больше данных, регуляризация, упрощение модели или аугментация."}, {"q": "Почему ошибка на обучающей выборке обычно растёт с увеличением размера выборки?", "a": "На маленькой выборке модель может почти идеально подогнаться (запомнить) все объекты. Чем больше объектов, тем труднее подогнать их все, поэтому ошибка на обучении растёт, а на валидации падает, и кривые сближаются."}, {"q": "Как правильно строить кривые обучения?", "a": "Для каждого размера выборки использовать кросс-валидацию и показывать среднее и разброс по фолдам (например, `learning_curve` в sklearn), так как на малых выборках оценки очень шумные. Тестовую выборку для этого не используют, иначе она перестанет быть независимой."}], "learning_rate_scheduling_cheatsheet.html": [{"q": "Зачем менять learning rate во время обучения?", "a": "Большой шаг в начале быстро снижает loss и помогает исследовать ландшафт, малый шаг в конце позволяет «осесть» в минимуме, а не прыгать вокруг него из-за шума SGD."}, {"q": "Зачем нужен warmup?", "a": "В начале веса случайны, градиенты крупные и нестабильные, а оценки моментов в Adam ещё неточны. Линейное повышение lr за первые сотни–тысячи шагов предотвращает расходимость; особенно важно для трансформеров и больших батчей."}, {"q": "Чем cosine annealing отличается от step decay?", "a": "Step decay резко уменьшает lr в заданные эпохи (например, в 10 раз). Cosine плавно уменьшает lr по косинусу от η_max до η_min, что обычно даёт сравнимое или лучшее качество без подбора моментов шагов."}, {"q": "Как работает ReduceLROnPlateau и в чём его ловушка?", "a": "Уменьшает lr в factor раз, если отслеживаемая метрика не улучшается patience эпох. Ловушка — надо передавать в `scheduler.step(val_loss)` метрику и правильно задать mode (min/max), иначе lr будет падать не вовремя."}, {"q": "Где в цикле обучения PyTorch вызывать `scheduler.step()`?", "a": "После `optimizer.step()`; для эпохальных расписаний — раз в эпоху, для OneCycleLR и warmup по шагам — после каждого батча. Вызов не с той частотой меняет расписание до неузнаваемости."}], "learning_validation_curves_cheatsheet.html": [{"q": "Чем кривая обучения отличается от кривой валидации?", "a": "Кривая обучения (learning curve) показывает качество в зависимости от **размера обучающей выборки**. Кривая валидации (validation curve) — в зависимости от **значения одного гиперпараметра** (например, глубины дерева или C) при фиксированных данных."}, {"q": "Как по кривой валидации определить недообучение и переобучение?", "a": "В области простой модели обе кривые низкие и близки — недообучение. В области сложной модели качество на обучении продолжает расти, а на валидации падает — переобучение. Оптимум — значение гиперпараметра с максимальным качеством на валидации."}, {"q": "Что делать, если на кривой обучения валидационное качество ещё растёт при максимальном размере выборки?", "a": "Это признак того, что модель выиграет от дополнительных данных: разрыв между кривыми не закрыт. Если же обе кривые вышли на плато на низком уровне, новые данные не помогут — нужно менять модель или признаки."}, {"q": "Почему гиперпараметр, выбранный по кривой валидации, нельзя оценивать на той же валидации?", "a": "Выбор по максимуму валидационного качества оптимистично смещает оценку — мы подстроились под эти фолды. Итоговое качество нужно мерить на отложенной тестовой выборке или через вложенную кросс-валидацию."}, {"q": "Зачем на кривых показывают разброс по фолдам?", "a": "Отдельные значения шумные, особенно на малых выборках. Полоса ±σ по фолдам показывает, значимы ли различия между точками кривой: если полосы сильно перекрываются, выбор «лучшего» значения во многом случаен."}], "lightgbm_cheatsheet.html": [{"q": "Чем стратегия роста деревьев в LightGBM отличается от XGBoost по умолчанию?", "a": "LightGBM растит деревья **по листьям** (leaf-wise): каждый раз делит лист с наибольшим уменьшением потерь. Классический подход — **по уровням** (level-wise), слой за слоем. Leaf-wise быстрее снижает ошибку, но легче переобучается."}, {"q": "Почему в LightGBM главный параметр сложности — `num_leaves`, а не только `max_depth`?", "a": "При росте по листьям дерево может стать очень глубоким и несимметричным, поэтому сложность ограничивают числом листьев. Ориентир: `num_leaves` меньше 2^max_depth."}, {"q": "За счёт чего LightGBM быстро работает на больших данных?", "a": "Гистограммный алгоритм (значения признаков группируются в корзины), GOSS — выборка объектов с учётом величины градиента, EFB — объединение взаимоисключающих разреженных признаков."}, {"q": "Как LightGBM работает с категориальными признаками?", "a": "Их можно передать напрямую (`categorical_feature`) без one-hot: алгоритм сам ищет оптимальное разбиение категорий на две группы. Для очень редких категорий это может приводить к переобучению — помогают `min_data_per_group` и `cat_smooth`."}, {"q": "Какие параметры помогают, если LightGBM переобучается?", "a": "Уменьшить `num_leaves` и `max_depth`, увеличить `min_child_samples`, использовать `feature_fraction` и `bagging_fraction`, добавить `lambda_l1` и `lambda_l2`, уменьшить `learning_rate` и включить раннюю остановку."}], "lime_cheatsheet.html": [{"q": "Как LIME объясняет один прогноз?", "a": "Генерирует возмущённые версии объекта, получает на них прогнозы чёрного ящика и обучает простую интерпретируемую модель (обычно линейную) с весами по близости к исходному объекту. Коэффициенты этой модели и есть объяснение."}, {"q": "Почему объяснение LIME называют локальным?", "a": "Простая модель хорошо приближает сложную только в окрестности конкретного объекта. Для другого объекта объяснение может быть совсем другим."}, {"q": "Как LIME работает с текстами и изображениями?", "a": "Для текста возмущения — удаление слов, объяснение показывает вклад слов. Для изображений картинку делят на суперпиксели, некоторые «выключают», и объяснение показывает, какие области важны для класса."}, {"q": "Почему объяснения LIME бывают нестабильными?", "a": "Они зависят от случайной выборки возмущений, ширины ядра близости и способа генерации соседей. Два запуска для одного объекта могут дать разные важные признаки."}, {"q": "Чем LIME отличается от SHAP?", "a": "LIME — эвристическая локальная аппроксимация без строгих гарантий. SHAP основан на значениях Шепли с теоретическими свойствами (аддитивность, согласованность) и даёт согласованные локальные и глобальные объяснения, но часто дороже в вычислении."}], "lime_neural_networks_cheatsheet.html": [{"q": "В чём основная идея LIME?", "a": "Объяснить предсказание сложной модели **локально**: сгенерировать возмущённые варианты конкретного примера, получить на них предсказания модели и обучить простую интерпретируемую модель (обычно разреженную линейную), взвешивая примеры по близости к исходному. Её коэффициенты и есть объяснение."}, {"q": "Как LIME возмущает изображения и тексты?", "a": "Изображение делится на **суперпиксели**, и в возмущениях часть из них «выключается» (заменяется серым или средним цветом). Для текста случайно удаляются слова. Интерпретируемые признаки — бинарные индикаторы присутствия суперпикселя или слова."}, {"q": "Почему объяснения LIME могут быть нестабильными?", "a": "Они зависят от **случайной выборки** возмущений, ширины ядра близости и способа сегментации на суперпиксели. Два запуска на одном примере могут дать разные важные области; помогают большее число сэмплов и фиксированный seed, а стабильность объяснения стоит проверять."}, {"q": "Какая ловушка в возмущениях LIME для нейросетей?", "a": "Возмущённые изображения с серыми «дырами» **вне распределения** обучающих данных, и модель на них может вести себя непредсказуемо. Объяснение тогда отражает реакцию на артефакты, а не на настоящие признаки; кроме того, таким поведением можно злонамеренно манипулировать (Slack и др., 2020)."}, {"q": "Чем LIME отличается от градиентных методов вроде Grad-CAM?", "a": "LIME — **model-agnostic**: ему нужен только доступ к предсказаниям, без градиентов и знания архитектуры. Зато он требует сотен или тысяч прогонов модели на один пример и даёт объяснение на уровне суперпикселей, тогда как градиентные методы считаются за один или несколько проходов."}], "linear_algebra_optimization_cheatsheet.html": [{"q": "Почему для решения линейной системы не вычисляют обратную матрицу явно?", "a": "Явное обращение медленнее и численно менее устойчиво. Используют разложения (LU, QR, Холецкого) или `np.linalg.solve` / `lstsq`, которые решают систему напрямую с меньшей ошибкой округления."}, {"q": "Что такое число обусловленности и чем плохо большое его значение?", "a": "κ(A) = σ_max / σ_min — отношение крайних сингулярных чисел. При большом κ малые изменения данных сильно меняют решение, а градиентный спуск медленно сходится по «вытянутому оврагу». Помогают масштабирование признаков и регуляризация."}, {"q": "Почему для выпуклой функции градиентный спуск находит глобальный минимум?", "a": "У выпуклой функции любой локальный минимум глобальный, и нет «ловушек». Для нейросетей функция потерь невыпукла, и гарантий нет, но на практике SGD находит хорошие решения."}, {"q": "Чем методы второго порядка (Ньютон) отличаются от градиентного спуска?", "a": "Ньютон использует гессиан: w ← w − H⁻¹∇L, учитывая кривизну, и сходится квадратично вблизи минимума. Но хранение и обращение гессиана d×d стоит O(d²) памяти и O(d³) времени, поэтому для больших моделей используют квазиньютоновские методы (L-BFGS) или первый порядок."}, {"q": "Что такое положительно определённая матрица и где это важно в ML?", "a": "Матрица A, для которой xᵀAx > 0 для любого x ≠ 0 (все собственные значения > 0). Положительно определённый гессиан означает строгий локальный минимум; ковариационные матрицы и ядра должны быть положительно (полу)определёнными."}], "linear_autoencoders_cheatsheet.html": [{"q": "Как связан линейный автоэнкодер с PCA?", "a": "Линейный автоэнкодер с узким горлышком из k нейронов и MSE-потерей учится проецировать данные на то же подпространство, что и первые k главных компонент PCA. Однако его веса не обязаны быть ортогональными и совпадать с самими компонентами — совпадает лишь подпространство."}, {"q": "Зачем нужно «узкое горлышко» (bottleneck)?", "a": "Если размер скрытого слоя не меньше входного, линейный автоэнкодер может выучить тождественное отображение и ничего полезного не извлечёт. Ограничение размерности заставляет его сжимать данные и сохранять только наиболее важные направления."}, {"q": "Что даёт автоэнкодер по сравнению с PCA, если результат тот же?", "a": "Сам по себе линейный автоэнкодер почти ничего не даёт сверх PCA и обучается медленнее. Ценность появляется при переходе к нелинейным активациям и глубоким архитектурам: тогда автоэнкодер может описывать нелинейные многообразия, недоступные PCA."}, {"q": "Что будет, если использовать нелинейные активации, но один скрытый слой и MSE?", "a": "Даже с нелинейностью неглубокий автоэнкодер с одним скрытым слоем часто ведёт себя близко к PCA и не даёт большого выигрыша. Чтобы реально выйти за пределы линейных методов, нужны несколько нелинейных слоёв в кодировщике и декодере."}, {"q": "Как использовать автоэнкодер для поиска аномалий?", "a": "Обучить его на нормальных данных и считать ошибку реконструкции для новых объектов: аномалии плохо восстанавливаются и дают высокую ошибку. Порог ошибки подбирают по валидационным данным."}], "linear_ensembles_cheatsheet.html": [{"q": "Почему простое усреднение нескольких линейных регрессий на тех же признаках даёт линейную модель?", "a": "Среднее линейных функций — тоже линейная функция с усреднёнными коэффициентами. Поэтому такой ансамбль не увеличивает выразительность модели, а только может немного снизить дисперсию оценок коэффициентов."}, {"q": "Почему бэггинг линейных моделей обычно даёт малый прирост?", "a": "Линейные модели стабильны — бутстреп-выборки дают похожие коэффициенты, и предсказания сильно коррелированы. Заметная польза бывает при малых выборках, мультиколлинеарности или в сочетании со случайными подмножествами признаков."}, {"q": "Как ансамбль линейных моделей может стать нелинейным?", "a": "Если модели обучены на разных преобразованиях признаков (полиномы, сплайны, взаимодействия, разные кодирования) или на разных подмножествах данных с последующим нелинейным объединением. Другой путь — бустинг с линейной базовой моделью вместе с деревьями."}, {"q": "Когда стоит добавить линейную модель в ансамбль с градиентным бустингом?", "a": "Линейная модель экстраполирует тренд, хорошо работает на разреженных признаках (тексты, one-hot) и ошибается иначе, чем деревья. Поэтому её добавление часто снижает корреляцию ошибок и улучшает ансамбль, особенно на данных с монотонными зависимостями."}, {"q": "Что важно сделать перед объединением линейных моделей с разной регуляризацией (L1, L2, ElasticNet)?", "a": "Масштабировать признаки одинаково, иначе регуляризация будет штрафовать признаки неравномерно, и подобрать силу регуляризации для каждой модели по CV. Также стоит проверить корреляцию их предсказаний: Ridge и ElasticNet с малым L1 часто почти идентичны."}], "linreg_cheatsheet.html": [{"q": "Какую функцию потерь минимизирует обычная линейная регрессия (МНК)?", "a": "Сумму (или среднее) квадратов остатков: Σ(yᵢ − ŷᵢ)², где ŷ = Xw + b. Отсюда название — метод наименьших квадратов."}, {"q": "Как найти веса аналитически и почему на практике часто используют градиентный спуск?", "a": "Нормальное уравнение: w = (XᵀX)⁻¹Xᵀy. Обращение матрицы стоит порядка O(d³) по числу признаков и численно неустойчиво при мультиколлинеарности, поэтому для больших данных используют итеративные методы."}, {"q": "Как интерпретировать коэффициент при признаке?", "a": "На сколько в среднем изменится прогноз при увеличении признака на единицу, если остальные признаки зафиксированы. Сравнивать коэффициенты между собой можно только после масштабирования признаков."}, {"q": "Что такое мультиколлинеарность и чем она мешает?", "a": "Сильная корреляция между признаками. Веса становятся неустойчивыми (могут менять знак при небольшом изменении данных) и теряют интерпретируемость, хотя прогнозы могут оставаться хорошими. Помогают регуляризация (Ridge) и удаление дублирующих признаков."}, {"q": "Какие предположения лежат в основе классической линейной регрессии?", "a": "Линейная зависимость, независимость наблюдений, постоянная дисперсия остатков (гомоскедастичность), отсутствие сильной мультиколлинеарности; для доверительных интервалов — нормальность остатков. Проверяют по графику остатков."}], "lle_cheatsheet.html": [{"q": "В чём идея LLE?", "a": "Каждая точка приближается линейной комбинацией своих k ближайших соседей с весами, сумма которых равна 1. Затем ищутся низкоразмерные координаты, в которых каждая точка восстанавливается теми же весами из тех же соседей, — так сохраняется локальная линейная геометрия."}, {"q": "Почему веса реконструкции переносятся в низкоразмерное пространство?", "a": "Веса инвариантны к поворотам, масштабированию и сдвигам окрестности (благодаря условию ∑ wᵢⱼ = 1). Поэтому они описывают внутреннюю локальную геометрию многообразия, а не его конкретное расположение в исходном пространстве."}, {"q": "Чем LLE отличается от Isomap по типу сохраняемой структуры?", "a": "Isomap сохраняет глобальные геодезические расстояния между всеми парами точек. LLE сохраняет только локальные соотношения внутри окрестностей, поэтому не требует вычисления кратчайших путей и использует разреженные матрицы, но хуже передаёт глобальную структуру."}, {"q": "Что будет, если число соседей больше размерности исходных данных?", "a": "Локальная задача поиска весов становится вырожденной (бесконечно много решений). Поэтому вводят регуляризацию (параметр `reg` в sklearn); кроме того, существуют модифицированные варианты — Modified LLE и Hessian LLE, — которые устойчивее."}, {"q": "Какие типичные проблемы у LLE?", "a": "Чувствительность к выбору k и к шуму, склонность «схлопывать» части многообразия и искажать глобальные пропорции. Также стандартный LLE плохо работает при неравномерной плотности точек."}], "local_outlier_factor_cheatsheet.html": [{"q": "Чем LOF отличается от простого критерия «далеко от соседей»?", "a": "LOF сравнивает **локальную плотность** точки с плотностью её k соседей. Поэтому точка рядом с плотным кластером может оказаться аномалией, а точка в разреженном, но однородном кластере — нет; глобальный порог по расстоянию так не умеет."}, {"q": "Как интерпретировать значение LOF?", "a": "LOF ≈ 1 — плотность точки такая же, как у соседей (нормальная точка), LOF меньше 1 — точка в более плотной области, LOF значительно > 1 — плотность заметно ниже, чем у соседей, то есть выброс. Универсального порога нет, он зависит от данных."}, {"q": "Что будет при слишком маленьком или слишком большом n_neighbors?", "a": "При малом k оценки плотности шумные, а небольшая группа аномалий станет «соседями» друг для друга и не будет обнаружена. При слишком большом k теряется локальность, и метод сближается с глобальным критерием; часто рекомендуют k ≈ 20 и больше размера ожидаемой группы аномалий."}, {"q": "Почему для предсказания на новых данных нужно `novelty=True`?", "a": "По умолчанию LOF в sklearn работает в режиме outlier detection: доступен только `fit_predict` на тех же данных. Для оценки новых объектов включают `novelty=True` — тогда появляются `predict` и `decision_function`, но применять их к обучающей выборке нельзя, результат будет некорректным."}, {"q": "Какие ограничения у LOF на практике?", "a": "Требует масштабирования признаков (основан на расстояниях), плохо работает в высокой размерности из-за концентрации расстояний и дорог на больших выборках из-за поиска соседей. Кроме того, его оценки трудно сравнивать между разными наборами данных."}], "logical_inference_learning_cheatsheet.html": [{"q": "Что такое дифференцируемая логика и зачем она нужна?", "a": "Логические связки заменяются гладкими операциями над истинностными значениями из [0, 1] (t-нормы: например, AND как произведение a·b). Тогда степень выполнения правил можно включить в loss и оптимизировать градиентным спуском вместе с нейросетью."}, {"q": "Как работает semantic loss?", "a": "К обычной функции потерь добавляется штраф, равный минус логарифму вероятности того, что выходы сети удовлетворяют логическому ограничению (например, «ровно один класс истинен»). Так знания направляют обучение без жёстких правил на инференсе."}, {"q": "Чем вероятностная логика (ProbLog, Markov Logic Networks) отличается от классической?", "a": "Факты и правила имеют веса или вероятности, поэтому система рассуждает при неопределённости и терпит противоречивые данные. Цена — вероятностный вывод в общем случае вычислительно очень дорог."}, {"q": "Что делает Logic Tensor Network (LTN)?", "a": "Предикаты и функции реализуются нейросетями, а формулы логики первого порядка с кванторами превращаются в дифференцируемую функцию степени истинности (нечёткая логика). Обучение максимизирует выполнимость базы знаний на данных."}, {"q": "Какая ловушка есть при выборе t-нормы для дифференцируемой логики?", "a": "Разные t-нормы ведут себя по-разному при оптимизации: например, логика Лукасевича даёт нулевые градиенты в больших областях, а произведение — сильно затухающие градиенты для длинных конъюнкций. Выбор влияет на обучаемость, а не только на семантику."}], "logreg_cheatsheet.html": [{"q": "Как логистическая регрессия получает вероятность из линейной комбинации признаков?", "a": "Применяет сигмоиду к линейной части: p = σ(z) = 1 / (1 + e⁻ᶻ), где z = wᵀx + b. Сигмоида переводит любое число в интервал (0, 1)."}, {"q": "Какую функцию потерь минимизирует логистическая регрессия?", "a": "Логистическую потерю (log loss, бинарную кросс-энтропию): −[y·log p + (1 − y)·log(1 − p)]. Она сильно штрафует уверенные неверные прогнозы. MSE не используют, потому что с сигмоидой задача становится невыпуклой."}, {"q": "Как интерпретировать коэффициент wⱼ?", "a": "Увеличение признака на единицу меняет логарифм шансов log(p / (1 − p)) на wⱼ, т.е. умножает шансы на e^wⱼ при прочих равных. Положительный вес увеличивает вероятность класса 1."}, {"q": "Почему порог 0.5 не всегда правильный?", "a": "При несбалансированных классах или разной цене ошибок (пропустить болезнь хуже, чем ложная тревога) порог подбирают под задачу — по ROC- или PR-кривой либо по нужному соотношению precision и recall."}, {"q": "Какой формы граница между классами у логистической регрессии?", "a": "Линейная: гиперплоскость wᵀx + b = 0. Для нелинейных границ нужно добавлять признаки (полиномиальные, взаимодействия) или использовать другие модели."}], "loss_functions_cheatsheet.html": [{"q": "Какие функции потерь используют для регрессии и чем они отличаются?", "a": "MSE — сильно штрафует большие ошибки, чувствительна к выбросам. MAE — устойчива к выбросам, но у неё постоянный по величине градиент и излом в нуле. Huber — квадратичная для малых ошибок и линейная для больших, компромисс между ними."}, {"q": "Почему для классификации используют кросс-энтропию, а не MSE?", "a": "Кросс-энтропия −Σ yₖ log pₖ сильно штрафует

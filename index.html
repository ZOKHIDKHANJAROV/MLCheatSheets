тамодель переоценивает самые переобученные модели. Нужны **out-of-fold** предсказания, а гиперпараметры базовых моделей подбирать внутри той же схемы CV."}, {"q": "Когда добавление новой модели в ансамбль не улучшает качество?", "a": "Если её ошибки сильно коррелируют с ошибками уже имеющихся моделей (например, ещё один бустинг с похожими параметрами) или она заметно слабее остальных. Полезно смотреть корреляцию out-of-fold предсказаний и прирост метрики ансамбля, а не только качество модели по отдельности."}], "evolutionary_strategies_cheatsheet.html": [{"q": "Чем эволюционные стратегии отличаются от генетических алгоритмов?", "a": "ES работают с **вещественными векторами** и основным оператором делают гауссову мутацию с адаптируемым шагом σ; кроссовер вторичен. ГА исторически работают с дискретным кодированием (битовые строки) и делают упор на кроссовер."}, {"q": "Чем отличаются схемы (μ, λ) и (μ + λ)?", "a": "В (μ, λ) следующее поколение отбирается только из λ потомков, родители отбрасываются — это помогает уходить из локальных оптимумов и адаптировать σ. В (μ + λ) отбор идёт из объединения родителей и потомков — элитистская схема, лучшее решение не теряется."}, {"q": "Что делает CMA-ES по сравнению с простой ES?", "a": "Адаптирует полную **ковариационную матрицу** распределения мутаций и глобальный шаг, поэтому учится искать вдоль «наклонных» и вытянутых долин функции. Фактически это аппроксимация обратного гессиана без вычисления производных."}, {"q": "Почему ES можно рассматривать как оценку градиента?", "a": "В OpenAI-ES градиент сглаженной функции оценивается как ∇ ≈ (1/(nσ)) ∑ F(θ + σεᵢ)·εᵢ, где εᵢ ~ N(0, I). Это градиентный подъём по ожидаемой награде без backprop, который хорошо параллелится: рабочим нужно обмениваться лишь скалярами F и seed'ами."}, {"q": "Как правило 1/5 успеха регулирует шаг мутации?", "a": "Если доля успешных мутаций (улучшающих решение) больше 1/5, шаг σ увеличивают, если меньше — уменьшают. Так шаг подстраивается под локальную геометрию: крупный далеко от оптимума и мелкий рядом с ним."}], "expectation_maximization_cheatsheet.html": [{"q": "Для каких задач нужен EM-алгоритм?", "a": "Для оценки максимального правдоподобия в моделях со **скрытыми переменными** или пропущенными данными: смеси гауссиан, HMM, тематические модели. Прямая максимизация log ∑_z p(x, z|θ) трудна из-за суммы под логарифмом."}, {"q": "Что делается на E-шаге и на M-шаге?", "a": "**E-шаг**: при текущих θ вычисляется апостериорное распределение скрытых переменных (для GMM — «ответственности» компонент за каждую точку). **M-шаг**: параметры θ обновляются максимизацией ожидаемого полного правдоподобия при этих весах."}, {"q": "Гарантирует ли EM нахождение глобального максимума правдоподобия?", "a": "Нет. EM гарантирует только **неубывание правдоподобия** на каждой итерации и сходимость к локальному максимуму (или седловой точке). Поэтому делают несколько запусков с разной инициализацией, например через k-means."}, {"q": "Чем EM для GMM отличается от k-means?", "a": "k-means — «жёсткий» вариант: каждая точка целиком относится к одному кластеру, кластеры фактически сферические и одинаковые. EM для GMM использует **мягкие вероятности** и оценивает ковариации, поэтому находит эллиптические кластеры разного размера."}, {"q": "Какая проблема может возникнуть с GMM при обучении EM и как её избегают?", "a": "Компонента может «схлопнуться» на одну точку: дисперсия → 0, правдоподобие → ∞. Помогает регуляризация ковариации (в sklearn — `reg_covar`), ограничение минимальной дисперсии или байесовский prior."}], "explainability_accountability_cheatsheet.html": [{"q": "Чем интерпретируемость отличается от объяснимости?", "a": "**Интерпретируемая** модель понятна сама по себе (линейная модель, небольшое дерево). **Объяснимость** часто означает post-hoc объяснения чёрного ящика (SHAP, LIME, контрфактические примеры), которые лишь аппроксимируют его поведение и могут быть неточными."}, {"q": "Почему наличие объяснений ещё не обеспечивает accountability?", "a": "Подотчётность требует, чтобы был **ответственный** за решение, решение можно было **проверить и оспорить**, а ошибки — исправить и компенсировать. Для этого нужны логирование, аудит, документация (model cards, datasheets) и процесс апелляции, а не только график важности признаков."}, {"q": "Чем глобальные объяснения отличаются от локальных и кому какие нужны?", "a": "Глобальные описывают поведение модели в целом (важность признаков, PDP) — нужны разработчикам и регуляторам. Локальные объясняют конкретное решение (SHAP для одного объекта, контрфактика «что изменить, чтобы получить одобрение») — нужны человеку, которого решение касается."}, {"q": "В чём опасность правдоподобных, но неверных объяснений?", "a": "Post-hoc объяснения бывают нестабильны и не отражают реальную логику модели; показаны атаки, при которых дискриминирующая модель выдаёт «чистые» объяснения LIME/SHAP. Это создаёт ложное доверие, поэтому объяснения проверяют на верность (faithfulness) и устойчивость."}, {"q": "Когда стоит выбрать изначально интерпретируемую модель вместо чёрного ящика с объяснениями?", "a": "В решениях с высокими ставками (кредиты, медицина, правосудие) и при требованиях регулятора, особенно на табличных данных, где интерпретируемые модели (GAM, скоринговые карты) часто почти не уступают по качеству."}], "explainable_ai_xai_cheatsheet.html": [{"q": "Зачем нужна объяснимость моделей?", "a": "Чтобы доверять решениям и проверять их, находить ошибки и утечки данных, выполнять требования регуляторов (кредиты, медицина, право на объяснение), объяснять решения пользователям и искать несправедливые зависимости."}, {"q": "Чем интерпретируемые по устройству модели отличаются от post-hoc объяснений?", "a": "Интерпретируемые модели (линейные, небольшие деревья, GAM) понятны сами по себе. Post-hoc методы (SHAP, LIME, PDP, saliency maps) объясняют уже обученную модель-«чёрный ящик» снаружи и сами являются приближением."}, {"q": "Что такое контрфактическое объяснение?", "a": "Минимальное изменение входа, при котором решение модели изменится: «кредит одобрили бы, если бы доход был на 10% выше». Такие объяснения понятны людям и подсказывают, что можно сделать."}, {"q": "Какие методы объяснения используют для нейросетей на изображениях?", "a": "Карты значимости (saliency, градиенты по входу), Grad-CAM (тепловая карта по активациям последних свёрточных слоёв), Integrated Gradients, а также окклюзию — закрытие областей и наблюдение за изменением прогноза."}, {"q": "Почему правдоподобное объяснение может вводить в заблуждение?", "a": "Объяснение может выглядеть убедительно, но неточно отражать, как модель реально принимает решение (низкая «верность», faithfulness). Его стоит проверять: например, удаляя признаки, названные важными, и смотря, действительно ли падает качество."}], "exponential_smoothing_cheatsheet.html": [{"q": "Как работает простое экспоненциальное сглаживание?", "a": "Прогноз — взвешенное среднее всех прошлых наблюдений с экспоненциально убывающими весами: ŷₜ₊₁ = α·yₜ + (1 − α)·ŷₜ. Подходит для рядов без тренда и сезонности."}, {"q": "Как параметр α влияет на прогноз?", "a": "α близко к 1 — модель быстро реагирует на последние значения, но шумна. α близко к 0 — сильное сглаживание и медленная реакция на изменения. Оптимальное α подбирают по ошибке на истории."}, {"q": "Что добавляют методы Хольта и Хольта–Уинтерса?", "a": "Хольт добавляет сглаживаемый тренд (уровень + наклон, параметр β). Хольт–Уинтерс дополнительно добавляет сезонную компоненту (параметр γ) — аддитивную или мультипликативную."}, {"q": "Когда сезонность лучше моделировать мультипликативно, а не аддитивно?", "a": "Когда амплитуда сезонных колебаний растёт вместе с уровнем ряда (например, продажи в декабре всегда на 30% выше, а не на фиксированные 1000 штук). Если амплитуда постоянна — аддитивно."}, {"q": "Что такое затухающий тренд и зачем он нужен?", "a": "Параметр φ < 1 постепенно «выпрямляет» тренд на длинном горизонте. Линейное продление тренда в далёкое будущее часто даёт завышенные прогнозы, а затухающий тренд на практике точнее."}], "fairness_constraints_cheatsheet.html": [{"q": "Почему удаление чувствительного признака (пол, раса) не гарантирует справедливость модели?", "a": "Остальные признаки часто служат **прокси** для защищённого атрибута (почтовый индекс, имя, история покупок), и модель восстанавливает ту же зависимость косвенно. Справедливость нужно измерять и ограничивать явно, а сам атрибут обычно нужен хотя бы для аудита."}, {"q": "Чем отличаются ограничения demographic parity и equalized odds?", "a": "**Demographic parity** требует одинаковой доли положительных прогнозов P(ŷ=1 | A=a) во всех группах, независимо от истинных меток. **Equalized odds** требует равенства TPR и FPR между группами, то есть учитывает истинный класс; **equal opportunity** — ослабленный вариант только с равенством TPR."}, {"q": "Можно ли одновременно выполнить все критерии справедливости?", "a": "В общем случае нет: при разных базовых долях положительного класса в группах калибровка по группам и равенство FPR/FNR несовместимы (теоремы о невозможности Kleinberg и Chouldechova). Поэтому критерий выбирают под задачу и цену ошибок."}, {"q": "На каких этапах пайплайна можно навязать ограничение справедливости?", "a": "**Pre-processing** — перевзвешивание или трансформация данных; **in-processing** — штраф или ограничение в оптимизации (например, `ExponentiatedGradient` в Fairlearn); **post-processing** — разные пороги для групп (`ThresholdOptimizer`). Post-processing не требует переобучения, но использует атрибут группы на инференсе."}, {"q": "Что обычно происходит с точностью модели при добавлении fairness-ограничения и как это контролировать?", "a": "Общая точность, как правило, немного падает — появляется компромисс accuracy–fairness. Его исследуют, варьируя силу ограничения (допустимый разрыв ε) и строя фронт Парето, а метрики считают отдельно по каждой группе на отложенной выборке."}], "fairness_ml_cheatsheet.html": [{"q": "Откуда в моделях берётся несправедливость?", "a": "Из исторических предубеждений в данных, нерепрезентативной выборки, смещённой разметки, признаков-прокси для защищённого атрибута и выбора целевой переменной, которая сама отражает неравенство."}, {"q": "Достаточно ли удалить из данных пол или расу, чтобы модель стала справедливой?", "a": "Нет. Модель восстановит эту информацию через коррелированные признаки-прокси (почтовый индекс, имя, покупки). Без защищённого атрибута к тому же сложнее измерить и исправить неравенство."}, {"q": "Чем demographic parity отличается от equalized odds?", "a": "Demographic parity — доля положительных решений одинакова во всех группах. Equalized odds — одинаковы TPR и FPR в группах, т.е. модель одинаково точна для них с учётом истинных меток."}, {"q": "Можно ли одновременно выполнить все критерии справедливости?", "a": "В общем случае нет: если базовые доли положительного класса в группах различаются, калибровку и равенство ошибок одновременно выполнить нельзя (теоремы о несовместимости). Критерий выбирают исходя из задачи и последствий ошибок."}, {"q": "На каких этапах можно уменьшать несправедливость?", "a": "До обучения — перевзвешивание и пересэмплирование данных; во время — ограничения или штрафы в функции потерь, adversarial debiasing; после — разные пороги для групп или коррекция прогнозов."}], "fairness_ml_deep_learning_cheatsheet.html": [{"q": "Чем demographic parity отличается от equalized odds?", "a": "**Demographic parity**: доля положительных предсказаний одинакова во всех группах, P(ŷ=1|A=a) равна для всех a, независимо от истинных меток. **Equalized odds**: одинаковы TPR и FPR в группах, то есть ошибки сравниваются при одинаковом истинном классе."}, {"q": "Почему нельзя одновременно удовлетворить все критерии справедливости?", "a": "Теоремы невозможности (Kleinberg, Chouldechova) показывают: если базовые доли положительных классов в группах различаются, калибровка и равенство FPR/FNR несовместимы, кроме случая идеального классификатора. Поэтому критерий выбирают по контексту задачи."}, {"q": "Что такое equal opportunity и когда он уместен?", "a": "Это ослабленный equalized odds: требуется только равенство **TPR** между группами. Уместен, когда важнее всего, чтобы достойные кандидаты (например, заёмщики, которые вернут кредит) имели равные шансы получить положительное решение."}, {"q": "Почему соблюдение demographic parity может навредить?", "a": "Если реальные базовые доли различаются, равные доли одобрений достигаются ценой ошибок — например, выдачей кредитов тем, кто не вернёт, что может навредить и самой группе. Кроме того, parity можно выполнить формально, случайно выбирая людей внутри группы."}, {"q": "Как post-processing с разными порогами по группам достигает равенства ошибок и в чём его минус?", "a": "Для каждой группы подбирается свой порог (иногда рандомизированный), чтобы выровнять TPR/FPR (Hardt et al.). Минус — нужен доступ к защищённому атрибуту на инференсе, что в ряде юрисдикций запрещено, и явное разное обращение с группами."}], "fastai_cheatsheet.html": [{"q": "Что такое learning rate finder и как выбирать по нему lr?", "a": "`learn.lr_find()` прогоняет несколько батчей, экспоненциально увеличивая lr, и строит график лосса. Берут значение, где лосс ещё круто падает (обычно примерно на порядок меньше минимума), а не сам минимум, где обучение уже на грани расхождения."}, {"q": "Почему при fine-tuning сначала обучают только голову, а потом размораживают всю сеть?", "a": "Новая голова инициализирована случайно, и её большие градиенты на первых шагах испортили бы предобученные веса. Метод `fine_tune` сначала обучает голову с замороженной основой, затем размораживает всё и обучает с меньшим lr."}, {"q": "Что такое дискриминативные learning rates?", "a": "Разные lr для разных групп слоёв: ранние слои с общими признаками обучаются медленнее, поздние — быстрее. В fastai задаётся срезом `slice(1e-5, 1e-3)`."}, {"q": "Что делает fit_one_cycle?", "a": "Реализует политику **one-cycle**: lr сначала растёт до максимума, затем плавно убывает (с обратной динамикой момента). Это ускоряет сходимость и работает как регуляризация."}, {"q": "Зачем в fastai DataBlock и чем он удобен?", "a": "Это декларативное описание пайплайна данных: типы входов/выходов, как получить объекты, как разбить на train/valid, как получить метку и какие аугментации применить. Один и тот же API подходит для изображений, текста и таблиц, а ошибки удобно отлаживать через `summary`."}], "feature_engineering_cheatsheet.html": [{"q": "Почему feature engineering часто даёт больший прирост, чем смена модели?", "a": "Модель может выучить только то, что выражается через её входы. Признак, явно кодирующий важную закономерность (отношение, разность, агрегат), упрощает задачу, и даже простая модель начинает работать хорошо."}, {"q": "Что такое утечка данных (data leakage) при создании признаков?", "a": "Использование информации, недоступной в момент прогноза: признаки из будущего, статистики, посчитанные по всему датасету включая тест, целевая переменная в кодировании. Модель показывает отличную валидацию и проваливается в продакшене."}, {"q": "Почему преобразования признаков нужно обучать только на train?", "a": "Средние для масштабирования, словари категорий, статистики для импутации, вычисленные на всех данных, переносят информацию из теста в обучение. Их делают через `fit` на train и `transform` на остальном, удобнее всего в `Pipeline`."}, {"q": "Каким моделям нужны масштабирование и логарифмирование признаков, а каким нет?", "a": "Линейные модели, kNN, SVM и нейросети чувствительны к масштабу и форме распределения. **Деревья и бустинг** инвариантны к монотонным преобразованиям одного признака, им это обычно не нужно."}, {"q": "Почему создание признаков-отношений полезно даже для деревьев?", "a": "Дерево делает разбиения по одному признаку за раз, и зависимость вида «x₁/x₂ > c» оно аппроксимирует множеством ступенек. Явный признак x₁/x₂ позволяет выразить её одним разбиением."}], "feature_engineering_detailed_cheatsheet.html": [{"q": "Почему для признаков с сильной правой асимметрией (доход, цены) применяют log1p?", "a": "Логарифм сжимает длинный хвост, уменьшает влияние выбросов и делает зависимость ближе к линейной. **log1p(x) = log(1 + x)** корректно работает при x = 0."}, {"q": "Чем опасны агрегатные признаки по группам (например, среднее значение по клиенту)?", "a": "Если агрегат считается по всем данным, включая текущий объект или будущие записи, возникает утечка. Агрегаты нужно считать только по прошлым данным или по фолдам (out-of-fold)."}, {"q": "Как обработать пропуски, если сам факт пропуска несёт информацию?", "a": "Добавить бинарный признак-индикатор `is_missing`, а значение импутировать (медианой, константой). В sklearn это делает `SimpleImputer(add_indicator=True)`. Бустинги вроде LightGBM и XGBoost умеют обрабатывать NaN сами."}, {"q": "Когда стоит удалять признаки, а не добавлять новые?", "a": "Когда признаки константны или почти константны, дублируют друг друга (сильная корреляция), являются идентификаторами или несут утечку. Лишние шумные признаки увеличивают дисперсию модели и время обучения."}, {"q": "Как проверить, что новый признак действительно полезен?", "a": "Сравнить метрику на **кросс-валидации** с признаком и без него при прочих равных, а также посмотреть permutation importance на валидации. Важность по встроенным оценкам дерева может быть завышена для признаков с большим числом уникальных значений."}], "feature_importance_cheatsheet.html": [{"q": "Как вычисляется permutation importance?", "a": "Значения одного признака случайно перемешиваются на валидационной выборке, и измеряется падение качества модели. Чем сильнее падение, тем важнее признак. Метод подходит для любой модели."}, {"q": "Чем опасна встроенная важность деревьев (по уменьшению impurity)?", "a": "Она считается на обучающих данных и завышает важность признаков с большим числом уникальных значений (ID, непрерывные признаки с шумом), даже если они бесполезны для обобщения."}, {"q": "Как коррелированные признаки искажают важность?", "a": "При перемешивании одного из двух сильно коррелированных признаков модель берёт информацию из второго, и оба выглядят неважными. Во встроенной важности деревьев значимость произвольно делится между ними."}, {"q": "Можно ли сравнивать коэффициенты линейной модели как важность признаков?", "a": "Только после масштабирования признаков к одной шкале, иначе величина коэффициента зависит от единиц измерения. И даже тогда мультиколлинеарность делает коэффициенты неустойчивыми."}, {"q": "Означает ли высокая важность признака, что он причина целевой переменной?", "a": "Нет. Важность показывает, насколько модель опирается на признак для прогноза, а не причинно-следственную связь. Признак может быть следствием цели или коррелировать с настоящей причиной (а иногда — утечкой данных)."}], "feature_interaction_cheatsheet.html": [{"q": "Сколько признаков даст PolynomialFeatures степени 2 для 10 исходных признаков?", "a": "Число мономов степени ≤ 2 от 10 переменных = C(12, 2) = **66** (с константой: 1 + 10 линейных + 10 квадратов + 45 попарных произведений). С `include_bias=False` — 65. Рост комбинаторный, поэтому высокие степени быстро взрывают размерность."}, {"q": "Зачем линейной модели признаки взаимодействия x₁·x₂?", "a": "Линейная модель считает влияние каждого признака независимым и аддитивным. Взаимодействие позволяет учесть, что эффект x₁ **зависит от значения x₂** (например, скидка работает только для постоянных клиентов)."}, {"q": "Почему после полиномиальных признаков почти всегда нужны масштабирование и регуляризация?", "a": "Значения x³, x₁·x₂ имеют сильно разный масштаб и коррелированы с исходными признаками, что ухудшает сходимость и устойчивость весов. Число признаков велико — без Ridge/Lasso модель легко переобучается."}, {"q": "Что делает параметр interaction_only=True в PolynomialFeatures?", "a": "Оставляет только произведения **разных** признаков (x₁·x₂), без степеней одного признака (x₁²). Полезно, когда нужны взаимодействия, а нелинейность по отдельному признаку не ожидается."}, {"q": "Нужны ли явные взаимодействия для градиентного бустинга?", "a": "Обычно меньше: деревья глубины > 1 моделируют взаимодействия последовательными разбиениями. Но явный признак может помочь, если взаимодействие сложно выразить ступеньками (например, произведение или отношение)."}], "feature_selection_cheatsheet.html": [{"q": "Чем отличаются filter-, wrapper- и embedded-методы отбора признаков?", "a": "**Filter** оценивают признаки статистикой независимо от модели (корреляция, χ², mutual information) — быстро, но без учёта взаимодействий. **Wrapper** перебирают подмножества, обучая модель (RFE, последовательный отбор) — точнее, но дорого. **Embedded** отбирают признаки в процессе обучения (L1-регуляризация, важности в деревьях)."}, {"q": "Почему отбор признаков на всём датасете до кросс-валидации — ошибка?", "a": "Отбор «подсматривает» в целевую переменную валидационных фолдов, и оценка качества получается завышенной (утечка данных). Отбор нужно делать внутри каждого фолда, например поместив селектор в `Pipeline`."}, {"q": "Почему признак с нулевой корреляцией с таргетом может быть полезен?", "a": "Корреляция Пирсона ловит только линейную зависимость: например, y = x² при симметричном x даёт корреляцию ≈ 0. Кроме того, признак может быть полезен только во взаимодействии с другими. Mutual information и модельные методы такие связи видят."}, {"q": "Что происходит с L1-регуляризацией при сильно коррелированных признаках?", "a": "Lasso обычно оставляет один признак из группы и обнуляет остальные, причём выбор нестабилен — меняется от небольших изменений данных. Если нужна группа целиком, используют ElasticNet или проверяют стабильность отбора на бутстрэп-выборках."}, {"q": "Чем выбор признаков отличается от снижения размерности (например, PCA)?", "a": "Отбор оставляет подмножество **исходных** признаков и сохраняет их интерпретируемость. PCA строит **новые** признаки как линейные комбинации всех исходных, поэтому все исходные признаки по-прежнему нужно собирать, а смысл компонент труднее объяснить."}], "feature_stores_cheatsheet.html": [{"q": "Что такое feature store и какие задачи он решает?", "a": "Централизованное хранилище признаков с их определениями. Устраняет дублирование расчётов между командами, обеспечивает одинаковые признаки при обучении и в продакшене, хранит историю значений и метаданные."}, {"q": "Чем офлайн-хранилище отличается от онлайн-хранилища?", "a": "Офлайн (хранилище данных, озеро) — полная история признаков для обучения и пакетных прогнозов. Онлайн (key-value: Redis, DynamoDB) — последние значения признаков для быстрой выдачи при онлайн-инференсе с низкой задержкой."}, {"q": "Что такое point-in-time correct join и зачем он нужен?", "a": "При сборке обучающей выборки для каждого события берутся значения признаков ровно на момент события, а не более поздние. Иначе в обучение попадёт информация из будущего — утечка данных, и модель будет выглядеть лучше, чем есть."}, {"q": "Как feature store помогает против training-serving skew?", "a": "Признак описывается один раз, и одно определение используется и для подготовки обучающих данных, и для выдачи в продакшене. Расчёты не расходятся из-за разного кода."}, {"q": "Когда feature store не нужен?", "a": "Для небольшого проекта с одной моделью и пакетными прогнозами это лишняя инфраструктура. Он окупается, когда моделей и команд много, признаки переиспользуются и нужен онлайн-инференс."}], "federated_learning_cheatsheet.html": [{"q": "Как работает алгоритм FedAvg?", "a": "Сервер рассылает модель выбранным клиентам, каждый делает несколько эпох локального SGD на своих данных и возвращает веса. Сервер усредняет их с весами, пропорциональными числу примеров у клиента: w = ∑ (nₖ/n)·wₖ."}, {"q": "Почему non-IID данные — главная проблема федеративного обучения?", "a": "У каждого клиента своё распределение (свой язык клавиатуры, свои пациенты), локальные модели уходят в разные стороны (**client drift**), и усреднение сходится медленнее или к худшему решению. Методы вроде **FedProx** и **SCAFFOLD** добавляют регуляризацию или поправки дрейфа."}, {"q": "Гарантирует ли federated learning приватность сам по себе?", "a": "Нет: данные не покидают устройство, но по обновлениям градиентов можно восстановить примеры (**gradient inversion**) или установить членство. Для защиты добавляют **дифференциальную приватность**, secure aggregation и шифрование."}, {"q": "Зачем клиенту делать несколько локальных эпох вместо одного шага, и чем это грозит?", "a": "Это сокращает число раундов связи, а коммуникация — узкое место. Но слишком много локальных шагов на non-IID данных усиливает дрейф клиентов, и усреднённая модель ухудшается."}, {"q": "Чем cross-device отличается от cross-silo федеративного обучения?", "a": "**Cross-device** — миллионы ненадёжных устройств (телефоны) с малым объёмом данных, в каждом раунде участвует малая доля. **Cross-silo** — несколько надёжных организаций (больницы, банки) с большими данными, участвующих почти всегда."}], "few_shot_learning_cheatsheet.html": [{"q": "Что означает постановка N-way K-shot?", "a": "В каждой задаче (эпизоде) нужно различать **N классов**, имея по **K размеченных примеров** на класс (support set), и классифицировать новые примеры этих классов (query set). Например, 5-way 1-shot — 5 классов по одному примеру."}, {"q": "Почему обычное обучение классификатора на 5 примерах на класс работает плохо и что делают вместо этого?", "a": "Глубокая сеть с миллионами параметров мгновенно переобучается на нескольких примерах. Few-shot методы учат **переносимое знание** на множестве других классов: хорошее метрическое пространство (Siamese, ProtoNets) или хорошую инициализацию для быстрого дообучения (MAML)."}, {"q": "Как Prototypical Networks классифицируют новый пример?", "a": "Для каждого класса вычисляется **прототип** — среднее эмбеддингов его support-примеров. Запрос относится к классу с ближайшим прототипом (обычно по квадрату евклидова расстояния), вероятности — softmax от отрицательных расстояний."}, {"q": "Чем Siamese network отличается от Prototypical Network?", "a": "Siamese сеть учится сравнивать **пары** («тот же класс или нет?»), и запрос сравнивается с каждым примером отдельно. ProtoNet агрегирует support set в прототип класса и обучается эпизодически сразу на задаче N-way классификации, что обычно даёт более высокую точность."}, {"q": "Почему сильный бейзлайн «предобучение + линейный классификатор» часто конкурирует с мета-обучением?", "a": "Исследования (например, «A Closer Look at Few-shot Classification», 2019) показали, что качество в основном определяется **хорошими признаками**. Сеть, просто предобученная на базовых классах, с простым классификатором поверх часто не уступает сложным мета-методам, поэтому его всегда нужно сравнивать."}], "few_shot_learning_traditional_cheatsheet.html": [{"q": "Что означает постановка «5-way 1-shot»?", "a": "В каждом эпизоде 5 новых классов и по 1 размеченному примеру каждого в support set; модель должна классифицировать query-примеры. Случайное угадывание даёт 20% точности."}, {"q": "Почему классы на мета-тесте не должны пересекаться с классами мета-обучения?", "a": "Цель — проверить способность обобщаться на **новые** классы. Если тестовые классы видны при обучении, модель просто их запомнит, и оценка будет завышена."}, {"q": "Почему сильный предобученный эмбеддинг + простой классификатор часто не хуже сложных мета-алгоритмов?", "a": "Основная часть качества в few-shot определяется качеством признаков. Работы вроде «A Closer Look at Few-shot Classification» и RFS показали, что хороший backbone с линейным или ближайшим-центроидным классификатором конкурирует с MAML и ProtoNet."}, {"q": "Почему для few-shot нужно сообщать доверительный интервал точности?", "a": "Точность сильно зависит от того, какие примеры попали в support set, и разброс между эпизодами велик. Поэтому усредняют по сотням/тысячам эпизодов и указывают 95% интервал."}, {"q": "Чем помогает аугментация и генерация данных в few-shot?", "a": "Она искусственно расширяет крошечный support set (аугментации, гибридизация признаков, генеративные модели), снижая переобучение. Но синтетика полезна, только если отражает реальную внутриклассовую изменчивость."}], "fraud_detection_cheatsheet.html": [{"q": "Почему метки мошенничества появляются с задержкой и чем это опасно?", "a": "Чарджбэк или жалоба приходят через дни или недели, поэтому свежие транзакции временно выглядят как «не фрод». Если обучаться на них сразу, модель увидит заниженную долю мошенничества; нужно выдерживать окно созревания меток."}, {"q": "Какую метрику выбрать вместо accuracy и почему?", "a": "Фрод — доли процента, поэтому смотрят PR-AUC, recall при фиксированном precision или числе ручных проверок, а лучше — **денежный эффект**: сумма предотвращённых потерь минус стоимость проверок и потерянных клиентов из-за ложных блокировок."}, {"q": "Какие признаки обычно сильнее всего помогают в fraud detection?", "a": "Поведенческие агрегаты по окнам: число и сумма транзакций за последний час или день, отклонение суммы от обычной для клиента, новое устройство, страна или мерчант, невозможная скорость перемещения между геолокациями. Считать их нужно только по прошлым данным, иначе будет утечка."}, {"q": "Почему модель фрод-детекции быстро деградирует?", "a": "Мошенники адаптируются (adversarial drift): когда схему начинают ловить, они меняют поведение; меняется и поведение честных клиентов. Нужны мониторинг, частое переобучение и комбинация supervised-модели с детекторами аномалий для новых схем."}, {"q": "Зачем в fraud detection используют графы?", "a": "Мошенники часто действуют группами и делят устройства, карты, адреса или IP. Граф связей «клиент — устройство — карта» позволяет находить кольца мошенников и строить признаки вроде числа связанных аккаунтов, которые не видны по одной транзакции."}], "function_approximation_rl_cheatsheet.html": [{"q": "Зачем нужна аппроксимация функции ценности?", "a": "Когда состояний слишком много или они непрерывны, таблицу хранить и заполнять невозможно. Аппроксиматор v̂(s; w) обобщает опыт на похожие, ещё не посещённые состояния."}, {"q": "Как выглядит полуградиентное TD(0)-обновление для линейной аппроксимации?", "a": "w ← w + α[r + γ·wᵀφ(s′) − wᵀφ(s)]·φ(s). «Полу» — потому что цель тоже зависит от w, но по ней градиент не берут; поэтому это не настоящий градиентный спуск по какой-либо функции."}, {"q": "Зачем нужны tile coding и RBF-признаки?", "a": "Это способы построить нелинейные признаки φ(s) для линейной модели. **Tile coding** покрывает пространство несколькими смещёнными сетками и даёт разреженные бинарные признаки; **RBF** даёт гладкие колоколообразные признаки вокруг центров."}, {"q": "Что гарантируется для линейной on-policy TD?", "a": "Сходимость к точке TD-неподвижности, ошибка которой не более 1/(1 − γ) раз хуже лучшей линейной аппроксимации. Для off-policy и нелинейных аппроксиматоров такой гарантии нет."}, {"q": "Чем ядерные методы отличаются от линейных в RL?", "a": "Ядерные методы (например, kernel-based TD, гауссовы процессы) работают в неявно бесконечномерном пространстве признаков через k(s, s′) и гибче линейных. Цена — память и вычисления растут с числом сохранённых точек, поэтому нужно разреживание словаря."}], "future_deep_learning_cheatsheet.html": [{"q": "Что утверждают scaling laws и в чём их ограничение?", "a": "Потери модели убывают примерно по степенному закону при росте параметров, данных и вычислений. Но рост даёт убывающую отдачу, упирается в объём качественных данных и стоимость, а снижение loss не гарантирует появления новых способностей."}, {"q": "Почему проблема данных («data wall») стала важной для дальнейшего масштабирования?", "a": "Качественный текст в интернете конечен, и крупнейшие модели приближаются к его исчерпанию. Отсюда интерес к синтетическим данным, мультимодальности и более эффективному обучению, хотя синтетика несёт риск деградации моделей."}, {"q": "Что такое catastrophic forgetting и почему continual learning важен?", "a": "При дообучении на новой задаче сеть теряет навыки старой, так как веса перезаписываются. Методы непрерывного обучения (регуляризация вроде EWC, replay, отдельные модули) нужны, чтобы модели обновлялись без полного переобучения."}, {"q": "Зачем исследуют world models?", "a": "Модель мира предсказывает, как изменится среда в ответ на действия. Это позволяет планировать «в воображении», эффективнее обучать агентов и роботов и выходить за рамки чисто статистического предсказания текста."}, {"q": "Почему эффективность (дистилляция, квантизация, прунинг) — такой же важный тренд, как масштаб?", "a": "Обучение и инференс огромных моделей дорогие и энергоёмкие. Сжатие позволяет запускать модели на устройствах, снижать задержку и стоимость, часто с небольшой потерей качества."}], "gan_cheatsheet.html": [{"q": "Как устроена GAN?", "a": "Две сети соревнуются: генератор превращает случайный шум в объекты, дискриминатор отличает настоящие объекты от сгенерированных. Генератор учится обманывать дискриминатор, дискриминатор — не обманываться."}, {"q": "Что такое mode collapse?", "a": "Генератор выдаёт лишь несколько похожих вариантов (например, одну и ту же цифру), которые обманывают дискриминатор, вместо всего разнообразия данных."}, {"q": "Почему GAN трудно обучать?", "a": "Это минимаксная игра, а не минимизация одной функции: обучение может осциллировать или расходиться. Если дискриминатор слишком силён, градиенты для генератора исчезают; нужен баланс сил двух сетей."}, {"q": "Какие приёмы стабилизируют обучение GAN?", "a": "Non-saturating loss для генератора, Wasserstein loss со штрафом на градиент (WGAN-GP), spectral normalization, разные learning rate для двух сетей (TTUR), архитектурные правила DCGAN (BatchNorm, LeakyReLU, без пулинга)."}, {"q": "Как оценивают качество GAN?", "a": "Чаще всего метрикой FID — расстоянием между распределениями признаков (из сети Inception) у настоящих и сгенерированных изображений; меньше — лучше. Также используют Inception Score и визуальную оценку людьми."}], "gat_cheatsheet.html": [{"q": "Как вычисляются коэффициенты внимания в GAT?", "a": "Для ребра (i, j): eᵢⱼ = LeakyReLU(aᵀ[W·hᵢ ‖ W·hⱼ]), где ‖ — конкатенация, a — обучаемый вектор. Затем αᵢⱼ = softmax по соседям j вершины i, и новое представление — σ(∑ⱼ αᵢⱼ·W·hⱼ)."}, {"q": "В чём преимущество GAT перед GCN?", "a": "GCN взвешивает соседей **фиксированно** по степеням вершин, а GAT учит, какие соседи важнее для конкретной вершины. Веса зависят от признаков, не требуют знания всей структуры графа заранее, поэтому GAT применим индуктивно."}, {"q": "Зачем в GAT используется multi-head attention и как объединяются головы?", "a": "Несколько независимых голов **стабилизируют** обучение внимания и улавливают разные типы связей. В скрытых слоях выходы голов конкатенируются, а в последнем слое (предсказание) — усредняются."}, {"q": "Что такое «статическое внимание» исходного GAT и как его исправляет GATv2?", "a": "В GAT нелинейность применяется после скалярного произведения с a, поэтому ранжирование соседей по весу оказывается **одинаковым для всех вершин**-запросов — внимание «статическое». GATv2 меняет порядок операций: aᵀ·LeakyReLU(W[hᵢ ‖ hⱼ]), и получает динамическое внимание, зависящее от запроса."}, {"q": "Что можно и нельзя заключать из коэффициентов внимания GAT?", "a": "Они показывают, как модель взвешивала соседей при агрегации, и полезны для **качественного анализа**. Но высокий вес внимания не гарантирует большого влияния на итоговое предсказание, поэтому как строгое объяснение их использовать нельзя."}], "gaussian_processes_cheatsheet.html": [{"q": "Что даёт гауссовский процесс помимо точечного прогноза?", "a": "Для каждой точки — **нормальное апостериорное распределение**: среднее и дисперсию. Дисперсия мала рядом с обучающими точками и растёт вдали от них, что используется, например, в байесовской оптимизации."}, {"q": "Какую роль играет ядро (ковариационная функция) и его длина масштаба?", "a": "Ядро задаёт априорные представления о функции: гладкость, периодичность, масштаб. В RBF-ядре k(x, x′) = σ²·exp(−‖x − x′‖² / 2ℓ²) **малое ℓ** даёт «дёрганые» функции и риск переобучения, **большое ℓ** — очень гладкие и риск недообучения."}, {"q": "Почему GP плохо масштабируется на большие датасеты?", "a": "Нужно обращать (или раскладывать по Холецкому) матрицу ковариаций n×n: время **O(n³)**, память O(n²). На десятках тысяч точек это уже дорого; используют разреженные/индуцирующие точки и приближённые методы."}, {"q": "Как подбирают гиперпараметры ядра в GP?", "a": "Максимизируют **логарифм маргинального правдоподобия** log p(y|X, θ), который сам балансирует качество подгонки и сложность модели. В sklearn `GaussianProcessRegressor` делает это автоматически, с параметром `n_restarts_optimizer` против локальных оптимумов."}, {"q": "Зачем к ядру добавляют шумовую компоненту (WhiteKernel или параметр alpha)?", "a": "Без неё GP интерполирует данные точно, проходя через каждую точку, что при шумных наблюдениях даёт переобучение. Шум на диагонали также улучшает численную устойчивость обращения матрицы."}], "gcn_cheatsheet.html": [{"q": "Как выглядит правило распространения в GCN (Kipf & Welling)?", "a": "H⁽ˡ⁺¹⁾ = σ(D̃^(−1/2) Ã D̃^(−1/2) H⁽ˡ⁾ W⁽ˡ⁾), где Ã = A + I — матрица смежности с петлями, D̃ — её диагональная матрица степеней, W — обучаемые веса слоя. Каждая вершина получает нормированную сумму признаков соседей и свою собственную."}, {"q": "Зачем к матрице смежности добавляют единичную матрицу?", "a": "Без петель вершина при агрегации **теряет собственные признаки** — её новое представление строится только из соседей. Добавление I включает саму вершину в её окрестность."}, {"q": "Зачем нужна симметричная нормализация D^(−1/2) A D^(−1/2)?", "a": "Без нормализации у вершин с большой степенью суммы признаков становятся огромными, а у малых — маленькими, что нарушает масштаб и стабильность обучения при многократном применении. Нормализация учитывает степени **обеих** вершин ребра: вклад соседа j в i делится на √(dᵢ·dⱼ)."}, {"q": "Как связаны число слоёв GCN и рецептивное поле, и почему глубокие GCN работают хуже?", "a": "После k слоёв представление вершины зависит от её **k-хоп окрестности**. При большом k окрестности почти всех вершин покрывают большую часть графа, и происходит over-smoothing — представления сливаются; поэтому обычно используют 2 слоя."}, {"q": "Почему GCN плохо работает на гетерофильных графах?", "a": "GCN усредняет соседей, неявно предполагая **гомофилию** — что соседи похожи и часто одного класса (как в сетях цитирования). В гетерофильных графах, где связаны разные классы (например, мошенники и жертвы), это усреднение смешивает признаки разных классов; там помогают отдельная обработка собственных признаков и соседей, а также учёт далёких соседей (H2GCN, GPR-GNN)."}], "generalization_theory_neural_networks_cheatsheet.html": [{"q": "Почему классические оценки через VC-размерность плохо объясняют обобщение глубоких сетей?", "a": "У современных сетей параметров больше, чем объектов, и VC-оценки дают бессмысленно большие границы ошибки. При этом сети реально хорошо обобщаются, значит, важны не только размер, но и алгоритм обучения и свойства данных."}, {"q": "Что показал эксперимент Zhang et al. со случайными метками?", "a": "Сети могут достичь нулевой ошибки на обучении даже при полностью случайных метках, то есть способны запомнить данные. Значит, ёмкость модели сама по себе не объясняет обобщение — нужно учитывать неявную регуляризацию SGD и структуру данных."}, {"q": "Что такое double descent?", "a": "Тестовая ошибка сначала ведёт себя как U-кривая, достигает пика около **порога интерполяции** (когда модель едва может подогнать обучающие данные), а затем снова падает при дальнейшем росте размера модели. Это противоречит классическому компромиссу bias–variance."}, {"q": "Почему считается, что «плоские» минимумы обобщаются лучше «острых»?", "a": "В плоском минимуме небольшие сдвиги весов почти не меняют лосс, поэтому модель устойчива к различиям между train и test. Это связывают с малым батчем в SGD и методами вроде **SAM**, хотя «плоскость» зависит от параметризации и не является строгим критерием."}, {"q": "Какие подходы дают нетривиальные оценки обобщения для нейросетей?", "a": "**PAC-Bayes** оценки (например, для стохастических сетей), оценки через нормы весов и margin, компрессионные оценки. Они точнее VC, но всё ещё часто далеки от реальной тестовой ошибки."}], "generative_models_classical_cheatsheet.html": [{"q": "Чем генеративная модель отличается от дискриминативной?", "a": "Генеративная моделирует P(x, y) (через P(x | y) и P(y)) и может порождать новые данные; дискриминативная моделирует только P(y | x). Классическая пара: наивный Байес и логистическая регрессия."}, {"q": "Когда генеративный классификатор может оказаться лучше дискриминативного?", "a": "На малых выборках: генеративная модель быстрее выходит на своё асимптотическое качество (результат Ng и Jordan). Кроме того, она естественно работает с пропусками и неразмеченными данными. На больших данных дискриминативные модели обычно точнее."}, {"q": "Как EM-алгоритм обучает GMM?", "a": "**E-шаг**: по текущим параметрам вычислить ответственности γᵢₖ — вероятность, что точка i пришла из компоненты k. **M-шаг**: пересчитать веса πₖ, средние μₖ и ковариации Σₖ как оценки, взвешенные по γ. Правдоподобие не убывает, но сходимость — лишь к локальному максимуму."}, {"q": "Как выбрать число компонент в GMM?", "a": "По информационным критериям **BIC** или AIC (у `GaussianMixture` есть методы `bic(X)` и `aic(X)`): правдоподобие растёт с числом компонент, а штраф за параметры не даёт переобучиться. Можно также использовать `BayesianGaussianMixture`, которая сама гасит лишние компоненты."}, {"q": "Какие три классические задачи решаются для HMM?", "a": "**Оценка** вероятности последовательности — forward-алгоритм; **декодирование** наиболее вероятной последовательности скрытых состояний — алгоритм Витерби; **обучение** параметров — Baum-Welch (EM для HMM)."}], "genetic_algorithms_cheatsheet.html": [{"q": "Какие роли выполняют кроссовер и мутация?", "a": "**Кроссовер** комбинирует удачные фрагменты решений родителей — эксплуатация уже найденного. **Мутация** вносит случайные изменения и поддерживает разнообразие — исследование новых областей и выход из локальных оптимумов."}, {"q": "Что такое преждевременная сходимость и как с ней бороться?", "a": "Популяция быстро становится однородной вокруг локального оптимума, и кроссовер перестаёт давать новое. Помогают увеличение мутации и размера популяции, более мягкая селекция (турнир меньшего размера), ниши/fitness sharing, островные модели."}, {"q": "Чем турнирная селекция удобнее рулеточной?", "a": "Рулетка выбирает пропорционально fitness, поэтому чувствительна к масштабу и знаку функции и даёт «суперособи» доминировать. Турнир сравнивает только порядок особей, а давление отбора легко регулировать размером турнира k."}, {"q": "Зачем нужен элитизм?", "a": "Лучшие особи копируются в следующее поколение без изменений, поэтому лучшее найденное решение не теряется из-за случайного кроссовера или мутации. Слишком большая элита, однако, снижает разнообразие."}, {"q": "Когда генетический алгоритм уместен, а когда лучше градиентный метод?", "a": "ГА уместен для дискретных, комбинаторных, негладких или «чёрных ящиков» без градиента (отбор признаков, расписания, структура сети). Если функция дифференцируема и пространство непрерывное, градиентные методы почти всегда на порядки эффективнее по числу вычислений."}], "geoinformation_systems_ml_cheatsheet.html": [{"q": "Что такое NDVI и почему его считают по красному и ближнему ИК каналам?", "a": "NDVI = (NIR − Red) / (NIR + Red), значения от −1 до 1. Здоровая растительность поглощает красный свет и сильно отражает ближний ИК, поэтому высокий NDVI указывает на густую зелёную растительность."}, {"q": "Почему случайное разбиение пикселей на train и test для спутниковых данных даёт завышенное качество?", "a": "Соседние пиксели и участки сильно коррелированы (**пространственная автокорреляция**), и модель фактически видит тест на обучении. Нужна пространственная кросс-валидация: разбиение по блокам или регионам."}, {"q": "Почему модели для RGB-фото нельзя напрямую применять к мультиспектральным снимкам?", "a": "У снимков больше каналов (например, 13 у Sentinel-2) с другими физическими смыслами и разным разрешением. Нужно адаптировать первый слой, нормализацию по каналам и аккуратно переносить предобученные веса."}, {"q": "Как обычно решают задачу change detection?", "a": "Сравнивают снимки одной территории в разные даты: сиамской сетью или конкатенацией двух изображений с сегментационной моделью. Важно выровнять снимки и учитывать сезонные изменения и облачность, иначе ложные срабатывания неизбежны."}, {"q": "Какую проблему создаёт облачность в оптических данных и как её обходят?", "a": "Облака и тени закрывают поверхность и портят признаки. Применяют маски облаков, композиты по нескольким датам или радарные данные (SAR), которые видят сквозь облака."}], "glm_cheatsheet.html": [{"q": "Из каких компонент состоит обобщённая линейная модель?", "a": "**Распределение** отклика из экспоненциального семейства (нормальное, биномиальное, пуассоновское, гамма), **линейный предиктор** η = Xβ и **функция связи** g, такая что g(E[y]) = η. Обычная линейная регрессия — GLM с нормальным распределением и тождественной связью."}, {"q": "Почему для счётных данных используют пуассоновскую регрессию, а не обычную линейную?", "a": "Счётные данные неотрицательны и их дисперсия растёт со средним. Пуассоновская GLM с log-связью гарантирует положительный прогноз μ = exp(Xβ) и правильно моделирует гетероскедастичность; линейная регрессия может дать отрицательные значения."}, {"q": "Как интерпретировать коэффициент β = 0.3 в пуассоновской регрессии с log-связью?", "a": "Увеличение признака на 1 умножает ожидаемое число событий на e^0.3 ≈ **1.35**, то есть увеличивает его примерно на 35% при прочих равных. Коэффициенты интерпретируются мультипликативно, а не аддитивно."}, {"q": "Что такое overdispersion и как с ней бороться?", "a": "В модели Пуассона дисперсия равна среднему, а в реальных данных она часто больше. Тогда стандартные ошибки занижены, и признаки выглядят ложно значимыми; используют **отрицательную биномиальную** регрессию или квазипуассоновскую модель."}, {"q": "Зачем в GLM нужен offset?", "a": "Когда число событий зависит от экспозиции (время наблюдения, численность населения), моделируется частота: log(μ) = log(exposure) + Xβ. Offset — это log(exposure) с фиксированным коэффициентом 1; без него модель путает «больше событий» с «дольше наблюдали»."}], "gmm_cheatsheet.html": [{"q": "Чем GMM отличается от K-means?", "a": "GMM — вероятностная модель: каждый кластер — гауссиана со своим средним, ковариационной матрицей и весом, а объект получает вероятности принадлежности к кластерам (мягкая кластеризация). K-means можно рассматривать как предельный случай GMM с одинаковыми сферическими ковариациями и жёстким назначением."}, {"q": "Что делают шаги E и M в EM-алгоритме?", "a": "E-шаг при текущих параметрах вычисляет «ответственности» — апостериорные вероятности того, что объект порождён каждой компонентой. M-шаг пересчитывает веса, средние и ковариации как взвешенные по этим ответственностям оценки. Правдоподобие на каждой итерации не убывает, но сходимость — к локальному максимуму."}, {"q": "Как выбрать тип ковариационной матрицы (`covariance_type`)?", "a": "`full` — эллипсы произвольной ориентации, наиболее гибко, но больше всего параметров (порядка d² на компоненту). `diag` — эллипсы, выровненные по осям, `spherical` — круги, `tied` — общая для всех компонент матрица. При малых данных или большом d берут более простые варианты, чтобы избежать переобучения и вырожденных ковариаций."}, {"q": "Как выбрать число компонент?", "a": "По информационным критериям BIC или AIC (методы `bic()` и `aic()`): берут число компонент с минимальным значением. Правдоподобие на обучении само по себе не годится — оно растёт с числом компонент. BIC штрафует сложность сильнее и обычно даёт более компактные модели."}, {"q": "Что может пойти не так при обучении GMM?", "a": "Компонента может «схлопнуться» на одну точку: дисперсия стремится к нулю, а правдоподобие — к бесконечности. От этого защищает регуляризация ковариации (`reg_covar`). Кроме того, результат зависит от инициализации, поэтому делают несколько запусков (`n_init`)."}], "gnn_applications_cheatsheet.html": [{"q": "Почему GNN естественно подходят для молекул?", "a": "Молекула — граф: атомы — вершины с признаками (элемент, заряд), связи — рёбра с типом. GNN предсказывает **свойства всей молекулы** (растворимость, токсичность) через readout по вершинам и инвариантна к нумерации атомов; для 3D-структур используют E(3)-эквивариантные сети."}, {"q": "Как GNN применяют в рекомендательных системах?", "a": "Пользователи и товары образуют **двудольный граф** взаимодействий. Message passing распространяет сигнал коллаборативной фильтрации на несколько шагов («пользователи, купившие то же, что и вы…»); примеры — PinSage в Pinterest и LightGCN, где предсказание — скалярное произведение эмбеддингов пользователя и товара."}, {"q": "Какая ловушка с утечкой данных возникает в задаче предсказания связей?", "a": "Если рёбра тестовой выборки остаются в графе при message passing, модель **видит ответ** через структуру. Тестовые (и валидационные) рёбра нужно удалять из графа, используемого для вычисления эмбеддингов, а негативные пары сэмплировать среди несуществующих рёбер."}, {"q": "Почему GNN полезны для обнаружения мошенничества?", "a": "Мошенники часто связаны между собой: общие устройства, карты, адреса, цепочки транзакций. GNN использует эти **связи**, а не только признаки отдельной операции. Сложность в том, что графы гетерофильны (мошенники маскируются связями с честными пользователями) и классы сильно несбалансированы."}, {"q": "Как обучать GNN на графе из миллиардов вершин?", "a": "Полный граф не помещается в память GPU, поэтому применяют **мини-батчи с сэмплированием** соседей (GraphSAGE, PinSage), сэмплирование подграфов (Cluster-GCN, GraphSAINT) или предвычисление агрегатов признаков (SIGN), что позволяет обучать модель на частях графа."}], "gnn_basics_cheatsheet.html": [{"q": "Почему для графов нельзя просто применить MLP или CNN?", "a": "У графа нет фиксированного порядка вершин и регулярной сетки: число соседей разное, а перенумерация вершин не должна менять результат. GNN строятся **инвариантными / эквивариантными к перестановкам**: агрегируют соседей симметричными функциями (сумма, среднее, максимум)."}, {"q": "Чем отличаются GCN, GAT и GraphSAGE в способе агрегации соседей?", "a": "**GCN** — нормированное по степеням усреднение соседей с фиксированными весами, заданными структурой графа. **GAT** — взвешенная сумма с **обучаемыми коэффициентами внимания**. **GraphSAGE** — сэмплирует фиксированное число соседей и применяет агрегатор (mean, max-pool, LSTM), конкатенируя результат с собственным представлением вершины."}, {"q": "Чем transductive обучение отличается от inductive и какой метод для чего подходит?", "a": "В **transductive** весь граф, включая тестовые вершины, известен при обучении (классический GCN на полном графе). В **inductive** модель должна работать на новых вершинах или графах; GraphSAGE изначально спроектирован для этого, так как учит функцию агрегации, а не эмбеддинги конкретных вершин."}, {"q": "Что такое over-smoothing?", "a": "С ростом числа слоёв представления вершин становятся **почти одинаковыми**, потому что каждый слой усредняет информацию по всё большей окрестности. Поэтому типичные GNN имеют 2–3 слоя; помогают residual-связи, jumping knowledge, нормализации вроде PairNorm и DropEdge."}, {"q": "Какие три уровня задач решают GNN?", "a": "Уровень **вершин** (классификация пользователей, статей), уровень **рёбер** (предсказание связей, рекомендации) и уровень **графа** целиком (свойства молекулы) — для последнего представления вершин агрегируются readout-функцией (сумма, среднее, attention pooling)."}], "gpt_architectures_cheatsheet.html": [{"q": "Какую часть Transformer использует GPT и на какую задачу обучается?", "a": "Только декодер с каузальной маской (без cross-attention). Задача — предсказание следующего токена по всем предыдущим (авторегрессионное языковое моделирование)."}, {"q": "Как GPT генерирует текст?", "a": "Пошагово: предсказывает распределение следующего токена, выбирает токен (жадно или сэмплированием), добавляет его к входу и повторяет, пока не встретит токен конца или не достигнет лимита."}, {"q": "Что регулирует temperature при сэмплировании?", "a": "Логиты делятся на температуру T перед softmax. При T < 1 распределение острее — текст предсказуемее; при T > 1 — более плоское: текст разнообразнее, но больше ошибок. Top-k и top-p (nucleus) дополнительно отсекают маловероятные токены."}, {"q": "Что такое KV-кэш и зачем он нужен?", "a": "При генерации ключи и значения уже обработанных токенов сохраняются, и на каждом новом шаге считаются только для нового токена. Без кэша пришлось бы заново пересчитывать внимание по всему префиксу на каждом шаге."}, {"q": "Как предобученная GPT превращается в ассистента, следующего инструкциям?", "a": "Дообучением на примерах «инструкция — ответ» (supervised fine-tuning) и последующим обучением на предпочтениях людей (RLHF или DPO), чтобы ответы были полезными, честными и безопасными."}], "grad_cam_cheatsheet.html": [{"q": "Как работает Grad-CAM?", "a": "Берётся последний свёрточный слой с картами признаков Aᵏ. Вес каждой карты αₖ — средний по пространству градиент score класса yᶜ по Aᵏ. Карта = ReLU(∑ₖ αₖ·Aᵏ), затем она увеличивается до размера изображения и накладывается как тепловая карта."}, {"q": "Чем Grad-CAM лучше исходного CAM?", "a": "CAM требует архитектуры с **global average pooling** прямо перед выходным слоем и использует его веса, поэтому часто модель приходится менять и переобучать. Grad-CAM вычисляет веса через градиенты и применим к любой CNN без изменения архитектуры: к классификаторам, captioning и VQA."}, {"q": "Зачем в формуле Grad-CAM применяется ReLU?", "a": "Нас интересуют области, которые **увеличивают** score целевого класса. Отрицательные значения обычно относятся к признакам других классов; без ReLU карта хуже локализует объект."}, {"q": "Почему карты Grad-CAM получаются грубыми и как это исправляют?", "a": "Разрешение карты равно разрешению последнего свёрточного слоя — например, 7×7 для ResNet при входе 224×224, и после увеличения границы размыты. **Guided Grad-CAM** перемножает её с guided backpropagation для детализации; можно также брать более ранний слой ценой меньшей семантичности."}, {"q": "Какая ловушка при интерпретации тепловой карты Grad-CAM?", "a": "Выделенная область показывает, **куда смотрела** модель, а не то, что решение правильно обосновано: карта может подсветить объект, хотя модель опирается на текстуру, или подсветить фон, коррелирующий с классом (водяной знак, снег у «волка»). Объяснения нужно проверять sanity-тестами и анализом ошибок."}], "gradient_boosting_hyperparameters_cheatsheet.html": [{"q": "Почему n_estimators не подбирают перебором вместе с остальными параметрами?", "a": "Оптимальное число деревьев сильно зависит от learning rate и сложности деревьев, а качество на валидации можно отслеживать на каждой итерации. Поэтому ставят большое значение и используют **раннюю остановку** (`early_stopping_rounds`) по отложенной выборке."}, {"q": "Как связаны max_depth и num_leaves в LightGBM?", "a": "LightGBM растит деревья по листьям (leaf-wise), и главный ограничитель сложности — `num_leaves`. Дерево глубины d может иметь до 2ᵈ листьев, поэтому `num_leaves` стоит держать меньше 2^max_depth (например, при max_depth = 7 — меньше 128), иначе ограничение глубины теряет смысл и растёт риск переобучения."}, {"q": "Какую роль играют subsample и colsample_bytree?", "a": "Они обучают каждое дерево на случайной доле объектов и признаков (stochastic gradient boosting). Это вносит разнообразие, снижает дисперсию и ускоряет обучение; типичные значения — 0.6–0.9, а слишком маленькие делают каждое дерево слишком шумным."}, {"q": "Как действуют min_child_weight (min_data_in_leaf) и регуляризация lambda/alpha?", "a": "Они ограничивают переобучение на малых группах объектов: запрещают листья с малой суммой гессиана или малым числом объектов и штрафуют большие значения в листьях (L2 — `lambda`, L1 — `alpha`). Их увеличивают, если модель переобучается на шумных или небольших данных."}, {"q": "В каком порядке разумно настраивать гиперпараметры бустинга?", "a": "Зафиксировать умеренный learning rate (0.05–0.1) с ранней остановкой, затем настроить сложность деревьев (глубина, листья, min_child_weight), потом subsample/colsample и регуляризацию. В конце уменьшить learning rate и пропорционально увеличить число деревьев для финальной модели."}], "gradient_boosting_regression_cheatsheet.html": [{"q": "Почему при MSE каждое новое дерево обучается на остатках?", "a": "Антиградиент MSE/2 по предсказанию равен yᵢ − F(xᵢ), то есть остатку. Значит, подгонка дерева к остаткам — частный случай общего правила бустинга: каждое дерево аппроксимирует антиградиент функции потерь."}, {"q": "Зачем нужен learning rate и как он связан с числом деревьев?", "a": "Шаг ν (shrinkage) уменьшает вклад каждого дерева: F_m = F_{m−1} + ν·h_m. Малый ν даёт лучшее обобщение, но требует больше деревьев; поэтому обычно фиксируют небольшой learning rate (0.01–0.1) и подбирают число деревьев ранней остановкой."}, {"q": "Какую функцию потерь выбрать при выбросах в целевой переменной?", "a": "MSE сильно штрафует большие ошибки, и выбросы тянут модель на себя. **Huber** или **MAE** устойчивее: для MAE антиградиент — sign(y − F), и значения в листьях становятся медианами остатков, а не средними."}, {"q": "Как с помощью градиентного бустинга построить интервал прогноза?", "a": "Обучить две модели с **квантильной** функцией потерь (pinball loss), например для α = 0.05 и α = 0.95, — получится 90%-ный интервал. В sklearn это `loss=\"quantile\"` с параметром `alpha`, в LightGBM — `objective=\"quantile\"`."}, {"q": "Почему бустинг на деревьях не экстраполирует, и когда это важно?", "a": "Каждое дерево выдаёт константы в листьях, поэтому прогноз ограничен диапазоном значений, встреченных на обучении. При трендовом таргете (цены, продажи с ростом) модель на новых данных «упрётся в потолок»; помогает предсказание разностей или отношений, либо линейная базовая модель с бустингом остатков."}], "gradient_checkpointing_cheatsheet.html": [{"q": "Какую проблему решает gradient checkpointing?", "a": "При обратном проходе нужны активации всех слоёв, и для глубоких моделей именно они занимают основную **память GPU**. Checkpointing сохраняет только часть активаций (контрольные точки), а остальные **пересчитывает** во время backward-прохода."}, {"q": "Какой компромисс дают контрольные точки и какова классическая оценка?", "a": "Память меняется на вычисления: при n слоях и контрольных точках каждые √n слоёв память под активации снижается с O(n) до **O(√n)**, а цена — примерно один дополнительный прямой проход, то есть обучение замедляется ориентировочно на 20–40%."}, {"q": "Что будет, если модель содержит dropout или другие случайные операции внутри checkpoint-сегмента?", "a": "При пересчёте сгенерировалась бы **другая маска** dropout, и градиенты не соответствовали бы прямому проходу. Поэтому реализации (например, `torch.utils.checkpoint.checkpoint`) по умолчанию сохраняют и восстанавливают состояние генератора случайных чисел."}, {"q": "Где ставить контрольные точки в трансформере?", "a": "Обычно на границах **блоков** трансформера: сохраняется вход каждого блока, а всё внутри (attention, MLP) пересчитывается. В Hugging Face Transformers это включается `model.gradient_checkpointing_enable()`."}, {"q": "Когда gradient checkpointing не нужен?", "a": "Если модель с нужным батчем и так помещается в память — он только замедлит обучение. Перед его включением стоит рассмотреть mixed precision, уменьшение батча с **gradient accumulation** и шардирование оптимизатора (ZeRO), которые экономят память иначе."}], "gradient_descent_cheatsheet.html": [{"q": "Запишите шаг градиентного спуска и объясните каждый символ.", "a": "θ ← θ − η · ∇L(θ). θ — параметры модели, η — скорость обучения (learning rate), ∇L(θ) — градиент функции потерь. Движемся против градиента, т.е. в сторону наискорейшего убывания потерь."}, {"q": "Что будет при слишком большом и слишком маленьком learning rate?", "a": "Слишком большой — шаги «перепрыгивают» минимум, потери скачут или растут (расходимость). Слишком маленький — сходимость очень медленная, можно застрять на плато."}, {"q": "Чем отличаются batch, stochastic и mini-batch градиентный спуск?", "a": "Batch считает градиент по всей выборке (точно, но медленно), stochastic — по одному объекту (быстро, но шумно), mini-batch — по небольшой порции (32–512 объектов): компромисс и стандарт на практике."}, {"q": "Почему перед градиентным спуском полезно масштабировать признаки?", "a": "При разных масштабах признаков линии уровня функции потерь сильно вытянуты, и спуск идёт зигзагами. После масштабирования поверхность «круглее», и сходимость быстрее и стабильнее."}, {"q": "Гарантирует ли градиентный спуск нахождение глобального минимума?", "a": "Только для выпуклых функций потерь (например, у линейной и логистической регрессии). Для невыпуклых (нейросети) он может остановиться в локальном минимуме или седловой точке."}], "grammatical_inference_cheatsheet.html": [{"q": "Почему по одним положительным примерам нельзя выучить в пределе (identification in the limit) класс регулярных языков?", "a": "Это результат Голда (1967): для любого класса, содержащего все конечные языки и хотя бы один бесконечный, положительных примеров недостаточно — обучающийся не может отличить конечный язык от бесконечного. Нужны отрицательные примеры или ограничения на класс."}, {"q": "Как работает алгоритм RPNI?", "a": "Строит prefix tree acceptor по положительным примерам и затем жадно сливает состояния, обобщая автомат. Слияние отменяется, если полученный автомат принимает какой-либо отрицательный пример."}, {"q": "Чем алгоритм L* (Angluin) отличается от RPNI?", "a": "L* — **активное** обучение: он задаёт учителю membership-запросы («принадлежит ли строка языку?») и equivalence-запросы («верна ли гипотеза?»). За полиномиальное число запросов он находит минимальный DFA, тогда как RPNI работает с фиксированной выборкой."}, {"q": "Почему обучение контекстно-свободных грамматик сложнее, чем регулярных?", "a": "Пространство гипотез огромно, грамматики могут быть неоднозначны, а эквивалентность двух КС-грамматик неразрешима. Поэтому используют эвристики, ограниченные подклассы или вероятностные грамматики, обучаемые EM (inside-outside)."}, {"q": "Где на практике применяют grammatical inference?", "a": "При восстановлении протоколов и форматов файлов, в верификации и тестировании ПО (обучение моделей поведения системы), в биоинформатике для моделирования последовательностей и в NLP при индукции синтаксиса."}], "graph_algorithms_cheatsheet.html": [{"q": "Почему Dijkstra не работает с отрицательными весами рёбер?", "a": "Dijkstra окончательно фиксирует вершину, как только достаёт её из очереди, считая, что более короткий путь не появится. Отрицательное ребро может позже уменьшить расстояние до уже зафиксированной вершины. В таких случаях используют Bellman-Ford, который ещё и обнаруживает отрицательные циклы."}, {"q": "Когда для кратчайшего пути достаточно BFS?", "a": "Когда граф невзвешенный (или все веса равны): BFS обходит вершины слоями по числу рёбер и за O(V + E) находит путь с минимальным числом рёбер."}, {"q": "Чем A* отличается от Dijkstra и что требуется от эвристики?", "a": "A* выбирает вершину по g(n) + h(n), где h — оценка оставшегося расстояния, поэтому идёт в сторону цели и раскрывает меньше вершин. Для оптимальности h должна быть **допустимой** — никогда не переоценивать реальное расстояние (например, евклидово расстояние на карте)."}, {"q": "Когда выбрать Floyd-Warshall, а когда — запуск Dijkstra из каждой вершины?", "a": "Floyd-Warshall находит кратчайшие пути для всех пар за O(V³) и прост — хорош для небольших плотных графов. Для больших разреженных графов с неотрицательными весами запуск Dijkstra из каждой вершины, O(V·(V + E)·log V), обычно быстрее."}, {"q": "Как спектральная кластеризация использует граф?", "a": "Строят граф сходства, вычисляют лапласиан L = D − A и берут собственные векторы при наименьших собственных значениях; в этом пространстве точки кластеризуют k-means. Метод находит невыпуклые кластеры, которые обычный k-means в исходном пространстве не разделит."}], "graph_based_ssl_cheatsheet.html": [{"q": "Какое предположение лежит в основе graph-based SSL?", "a": "**Гладкость на графе**: вершины, связанные ребром с большим весом, скорее всего имеют одну метку. Функция меток должна мало меняться вдоль рёбер, и это формализуют через лапласиан графа."}, {"q": "Что минимизирует лапласианная регуляризация?", "a": "Член fᵀLf = ½·∑ wᵢⱼ(fᵢ − fⱼ)², где L = D − W. Он штрафует разные метки у сильно связанных вершин и заставляет предсказания плавно меняться по графу, в том числе через неразмеченные точки."}, {"q": "Как строят граф по табличным данным?", "a": "**kNN-граф** (соединить каждую точку с k ближайшими, обычно с симметризацией), **ε-граф** (соединить точки ближе ε) или полный граф с весами RBF exp(−‖xᵢ − xⱼ‖²/2σ²). kNN устойчивее к неравномерной плотности данных."}, {"q": "Почему качество graph-based SSL сильно зависит от метрики расстояния?", "a": "Граф определяет пути, по которым распространяются метки. Если признаки не масштабированы или расстояние не отражает смысловую близость, рёбра соединят объекты разных классов, и метки распространятся неверно."}, {"q": "Как graph-based SSL связан с графовыми нейросетями?", "a": "GCN (Kipf и Welling, 2017) изначально предложена именно для semi-supervised классификации вершин: свёртка агрегирует признаки соседей, потеря считается только на размеченных вершинах, а граф передаёт информацию к неразмеченным."}], "graph_embeddings_cheatsheet.html": [{"q": "Как DeepWalk превращает граф в задачу, похожую на word2vec?", "a": "Генерирует случайные блуждания из каждой вершины и рассматривает их как «предложения», а вершины — как «слова». Затем обучает Skip-gram: вершины, часто встречающиеся рядом в блужданиях, получают близкие векторы."}, {"q": "Чем Node2Vec отличается от DeepWalk?", "a": "Node2Vec использует **смещённые** блуждания второго порядка с параметрами p (возврат) и q (вход-выход). Малый q уводит обход вглубь, как DFS, и подчёркивает сообщества; большой q держит обход рядом, как BFS, и лучше передаёт структурные роли. DeepWalk — частный случай при p = q = 1."}, {"q": "Почему такие эмбеддинги называют трансдуктивными и чем это неудобно?", "a": "Вектор обучается отдельно для каждой вершины, присутствующей в графе, поэтому для новой вершины эмбеддинга нет — нужно дообучать. Индуктивные методы (например, GraphSAGE) строят эмбеддинг из признаков вершины и её соседей и обобщаются на новые вершины."}, {"q": "Как использовать эмбеддинги вершин для предсказания связей и какую ошибку легко допустить?", "a": "Для пары вершин комбинируют их векторы (поэлементное произведение, среднее, разность) и обучают классификатор «есть ребро / нет ребра». Тестовые рёбра нужно удалить из графа до обучения эмбеддингов, иначе будет утечка."}, {"q": "Почему эмбеддинги из двух запусков на одном графе нельзя сравнивать покоординатно?", "a": "Из-за случайности блужданий и инициализации пространство определено лишь с точностью до поворота: координаты разные, хотя расстояния между вершинами похожи. Сравнивают сходства внутри одного обучения или выравнивают пространства ортогональным преобразованием (Прокруст)."}], "graph_kernels_cheatsheet.html": [{"q": "Зачем нужны графовые ядра?", "a": "Чтобы сравнивать целые графы (молекулы, белки) и применять ядерные методы вроде SVM без ручного построения вектора признаков. Ядро k(G₁, G₂) задаёт сходство как скалярное произведение в неявном пространстве признаков."}, {"q": "Как работает ядро Weisfeiler-Lehman?", "a": "Итеративно обновляет метку каждой вершины, хешируя её текущую метку вместе с мультимножеством меток соседей. После h итераций граф описывается гистограммой всех полученных меток, а ядро — скалярным произведением гистограмм; сложность почти линейна по числу рёбер на итерацию."}, {"q": "Почему ядро, сравнивающее все подграфы, не используют на практике?", "a": "Его точное вычисление NP-трудно, так как требует решать задачи изоморфизма подграфов. Поэтому используют ограниченные структуры: кратчайшие пути, случайные блуждания, графлеты, поддеревья WL."}, {"q": "Что общего у WL-ядра и графовых нейросетей?", "a": "Агрегация сообщений в GNN повторяет идею WL-перекраски, и выразительность стандартных message-passing GNN ограничена тестом 1-WL: если WL не различает два графа, такая GNN тоже их не различит."}, {"q": "В чём главный практический недостаток ядерных методов на большом числе графов?", "a": "Нужна матрица Грама N×N: память и время растут как O(N²), а обучение SVM — ещё быстрее. Для больших коллекций используют явные признаки (WL-гистограммы) с линейными моделями или GNN."}], "graph_theory_ml_cheatsheet.html": [{"q": "Какие типы задач ML решаются на графах?", "a": "**Классификация узлов** (тип пользователя), **предсказание связей** (рекомендации друзей), **классификация графов целиком** (свойства молекулы), а также кластеризация (поиск сообществ)."}, {"q": "Чем матрица смежности отличается от лапласиана графа?", "a": "Матрица смежности A хранит связи между узлами. Лапласиан L = D − A, где D — диагональная матрица степеней. Собственные векторы лапласиана с малыми собственными значениями описывают «гладкие» функции на графе и используются в спектральной кластеризации; число нулевых собственных значений равно числу компонент связности."}, {"q": "Как работает слой GNN в общем виде?", "a": "Каждый узел собирает сообщения от соседей (агрегация: сумма, среднее, attention), объединяет со своим представлением и пропускает через обучаемое преобразование. После k слоёв узел учитывает информацию из своей **k-окрестности**."}, {"q": "Почему GNN не делают очень глубокими?", "a": "Из-за **oversmoothing**: при многих слоях представления узлов усредняются по всё большим окрестностям и становятся почти одинаковыми. Обычно хватает 2–4 слоёв; помогают residual-связи и нормализация."}, {"q": "Как Node2Vec получает эмбеддинги узлов?", "a": "Генерирует случайные блуждания по графу (параметры p и q балансируют между поиском в ширину и в глубину) и обучает на них word2vec skip-gram, как на предложениях. Узлы, часто встречающиеся рядом в блужданиях, получают близкие векторы."}], "graphical_models_cheatsheet.html": [{"q": "Чем байесовские сети отличаются от марковских случайных полей?", "a": "Байесовская сеть — **ориентированный ациклический граф**, совместное распределение раскладывается в произведение условных p(xᵢ | родители). Марковское поле — **неориентированный граф**, распределение задаётся произведением потенциалов по кликам с нормировкой Z."}, {"q": "Зачем вообще нужны графические модели, если можно задать совместное распределение напрямую?", "a": "Совместное распределение n бинарных переменных требует 2ⁿ − 1 параметров. Граф явно кодирует **условные независимости**, и распределение раскладывается на маленькие множители, что сокращает число параметров и ускоряет вывод."}, {"q": "Что такое эффект «объяснения» (explaining away) в байесовской сети?", "a": "При структуре A → C ← B причины A и B независимы, но становятся **зависимыми при наблюдении C**. Например, если трава мокрая и известно, что был дождь, вероятность работы поливалки снижается."}, {"q": "Почему точный вывод в графических моделях бывает трудным?", "a": "В общем случае точный вывод NP-труден: сложность экспоненциальна по ширине дерева (treewidth). На деревьях работает точное распространение сообщений (belief propagation), иначе используют приближённые методы — MCMC, вариационный вывод, loopy BP."}, {"q": "Какие известные ML-модели являются графическими моделями?", "a": "Наивный Байес (байесовская сеть «класс → признаки»), HMM (цепочка скрытых состояний), CRF (условное марковское поле для разметки последовательностей), LDA (тематическая модель)."}], "gru_cheatsheet.html": [{"q": "Какие гейты есть в GRU?", "a": "Update gate — какую долю старого состояния сохранить и какую заменить новым кандидатом. Reset gate — сколько прошлого состояния использовать при вычислении кандидата."}, {"q": "Чем GRU проще LSTM?", "a": "Нет отдельного cell state и output gate: одно скрытое состояние и два гейта вместо трёх. Параметров примерно в 3 раза больше, чем у простой RNN, против 4 раз у LSTM."}, {"q": "Как update gate помогает с длинными зависимостями?", "a": "hₜ = (1 − zₜ)·hₜ₋₁ + zₜ·h̃ₜ. Если zₜ близко к 0, состояние почти без изменений копируется дальше, и градиент проходит через много шагов."}, {"q": "Что выбрать — GRU или LSTM?", "a": "Качество обычно сопоставимо и зависит от задачи. GRU быстрее и меньше склонна к переобучению на небольших данных; LSTM иногда лучше на очень длинных последовательностях. Выбор делают экспериментально."}, {"q": "Что такое двунаправленная (bidirectional) GRU и когда её нельзя использовать?", "a": "Две GRU обрабатывают последовательность слева направо и справа налево, их состояния объединяются — каждый элемент видит и прошлый, и будущий контекст. Нельзя использовать там, где будущее неизвестно: генерация текста, онлайн-прогноз временного ряда."}], "hdbscan_cheatsheet.html": [{"q": "Чем HDBSCAN лучше DBSCAN?", "a": "Не нужно подбирать ε: HDBSCAN фактически рассматривает все уровни плотности сразу (строит иерархию) и выбирает наиболее устойчивые кластеры. Поэтому он находит кластеры разной плотности, с которыми DBSCAN с единым ε не справляется."}, {"q": "Что такое mutual reachability distance и зачем оно нужно?", "a": "d_mreach(a, b) = max(core_k(a), core_k(b), d(a, b)), где core_k — расстояние до k-го соседа. Оно «отодвигает» точки в разреженных областях друг от друга, делая шум менее связанным с кластерами; по этому расстоянию строится минимальное остовное дерево и иерархия кластеров."}, {"q": "Как HDBSCAN выбирает итоговые кластеры из иерархии?", "a": "Иерархию сжимают, отбрасывая отделения меньше `min_cluster_size` (они считаются выпадающими точками). Затем выбирают кластеры с максимальной стабильностью — «временем жизни» при изменении уровня плотности (метод `eom`, excess of mass); альтернатива — брать листья дерева (`leaf`)."}, {"q": "Какой главный параметр у HDBSCAN и как он влияет?", "a": "`min_cluster_size` — минимальный размер кластера: при больших значениях мелкие группы становятся шумом или сливаются, при малых — появляется много мелких кластеров. `min_samples` управляет консервативностью: чем он больше, тем больше точек объявляется шумом."}, {"q": "Что HDBSCAN даёт помимо меток кластеров?", "a": "Для каждой точки — силу принадлежности кластеру (`probabilities_`, от 0 до 1), а в библиотеке `hdbscan` также оценки «выбросовости» (GLOSH). Это позволяет отделять уверенные ядра кластеров от сомнительных точек на границах."}], "hierarchical_clustering_cheatsheet.html": [{"q": "Чем агломеративная кластеризация отличается от дивизивной?", "a": "Агломеративная (снизу вверх) начинает с каждой точки как отдельного кластера и последовательно объединяет ближайшие. Дивизивная (сверху вниз) начинает с одного кластера и делит его. На практике чаще используют агломеративную."}, {"q": "Чем отличаются способы связи single, complete, average и Ward?", "a": "Single linkage берёт минимальное расстояние между кластерами и склонен к «цепочкам», complete — максимальное и даёт компактные кластеры, average — среднее по всем парам. Ward объединяет кластеры с минимальным приростом внутрикластерной дисперсии и даёт кластеры, похожие на результат K-means; он рассчитан на евклидово расстояние."}, {"q": "Как получить конкретное разбиение из дендрограммы?", "a": "Дендрограмму «разрезают» горизонтальной линией на некоторой высоте (порог расстояния) или задают нужное число кластеров. Хороший уровень разреза — там, где высоты объединений резко возрастают (длинные вертикальные отрезки)."}, {"q": "Почему иерархическую кластеризацию трудно применять к большим данным?", "a": "Нужно хранить матрицу попарных расстояний — O(n²) памяти, а наивный алгоритм работает за O(n³) (оптимизированные — около O(n²)). Уже на десятках-сотнях тысяч объектов это становится непрактичным."}, {"q": "Какое преимущество иерархической кластеризации перед K-means?", "a": "Не нужно заранее задавать число кластеров: одна дендрограмма содержит разбиения на любое число кластеров и показывает их вложенность. Кроме того, можно использовать произвольную метрику расстояния, а результат детерминирован."}], "hierarchical_rl_cheatsheet.html": [{"q": "Как устроена двухуровневая иерархия в Feudal Networks / HIRO?", "a": "Менеджер работает на грубой шкале времени и задаёт цель (подцель в пространстве состояний или латентное направление), а работник выполняет примитивные действия и получает внутреннюю награду за приближение к цели."}, {"q": "В чём проблема нестационарности в иерархическом off-policy обучении?", "a": "Поведение нижнего уровня меняется по мере обучения, поэтому старые переходы верхнего уровня из replay buffer уже не отражают, к чему приведёт та же подцель. HIRO решает это **перемаркировкой целей** (off-policy correction) под текущую политику работника."}, {"q": "Как Option-Critic учит опции без ручной разметки?", "a": "Внутренние политики опций и функции завершения β обучаются градиентом политики end-to-end вместе с политикой над опциями. Нужна регуляризация, иначе опции вырождаются в одношаговые."}, {"q": "Какую пользу иерархия даёт при переносе на новые задачи?", "a": "Навыки нижнего уровня (ходьба, захват) часто переиспользуются, и в новой задаче достаточно переобучить только верхний уровень. Это заметно ускоряет обучение по сравнению с обучением с нуля."}, {"q": "Почему иерархическое RL не стало стандартом на практике?", "a": "Сложно и нестабильно обучать несколько уровней одновременно, много гиперпараметров (горизонт менеджера, пространство целей), и на многих бенчмарках хорошо настроенные плоские методы (PPO, SAC) оказываются сопоставимы."}], "hierarchical_rl_detailed_cheatsheet.html": [{"q": "Какую проблему решает иерархическое RL?", "a": "Долгосрочные задачи с редкой наградой: на уровне примитивных действий горизонт слишком длинный для распространения награды и исследования. Иерархия делит задачу на подзадачи и сокращает эффективный горизонт."}, {"q": "Из чего состоит опция в options framework?", "a": "Тройка (I, π, β): множество состояний, где опцию можно начать, внутренняя политика и функция завершения β(s) — вероятность остановиться. Опции превращают MDP в semi-MDP с действиями переменной длительности."}, {"q": "Чем подход MAXQ отличается от опций?", "a": "MAXQ явно декомпозирует функцию ценности по дереву подзадач: Q(i, s, a) = V(a, s) + C(i, s, a), где C — ценность завершения родительской задачи после подзадачи. Это даёт переиспользование подзадач, но требует, чтобы иерархию задал человек."}, {"q": "Какая главная практическая трудность иерархического RL?", "a": "Откуда брать подзадачи: ручная иерархия требует экспертных знаний, автоматическое открытие опций нестабильно и может давать вырожденные опции (длиной в один шаг или одну на все случаи)."}, {"q": "Почему иерархия улучшает исследование?", "a": "Высокоуровневая политика выбирает между «макро»-действиями, каждое из которых делает осмысленное перемещение на много шагов. Случайный выбор опций покрывает пространство состояний гораздо шире, чем случайные примитивные действия."}], "hmm_cheatsheet.html": [{"q": "Какие три классические задачи решаются для HMM и какими алгоритмами?", "a": "**Оценка** вероятности последовательности наблюдений — алгоритм forward (прямой проход); **д

ь недавние ходы, поэтому поиск может пройти через ухудшения и выйти из локального оптимума, не зацикливаясь."}, {"q": "Почему табу-поиск переходит к лучшему соседу, даже если он хуже текущего решения?", "a": "Это и есть механизм выхода из локального минимума: в отличие от hill climbing, алгоритм не останавливается, а выбирает лучший **разрешённый** ход. Лучшее найденное решение хранится отдельно."}, {"q": "Что такое критерий аспирации?", "a": "Правило, разрешающее табу-ход, если он даёт решение лучше всех найденных ранее. Без него список может запретить именно тот ход, который ведёт к новому рекорду."}, {"q": "Как длина табу-списка влияет на поиск?", "a": "Короткий список — риск зацикливания и интенсивный локальный поиск; длинный — сильная диверсификация, но могут блокироваться хорошие ходы. Часто длину выбирают порядка √n или делают случайной/адаптивной."}, {"q": "Почему обычно хранят атрибуты ходов, а не целые решения?", "a": "Хранить и сравнивать полные решения дорого по памяти и времени. Атрибуты (например, «пару городов i, j не переставлять») компактны, но запрещают сразу целый класс решений — поэтому и нужен критерий аспирации."}], "target_encoding_cheatsheet.html": [{"q": "Почему наивное target encoding (среднее таргета по категории на всём train) приводит к переобучению?", "a": "Значение признака для объекта содержит его собственный таргет. Для редких категорий кодировка почти равна ответу, и модель «подглядывает» в метку — отличный train, плохой тест."}, {"q": "Как правильно вычислять target encoding на обучающей выборке?", "a": "**Out-of-fold**: разбить train на K фолдов и кодировать каждый фолд статистиками, посчитанными по остальным. Тест кодируется статистиками по всему train. В sklearn ≥ 1.3 так делает `TargetEncoder` при `fit_transform`."}, {"q": "Зачем нужно сглаживание (smoothing) и как оно работает?", "a": "Среднее по категории с 2–3 объектами очень шумное. Сглаживание смешивает его с глобальным средним: enc = (n·mean_cat + m·mean_global) / (n + m). Чем меньше n, тем ближе кодировка к глобальному среднему."}, {"q": "Когда target encoding лучше one-hot?", "a": "При **высокой кардинальности** (тысячи городов, ID товаров): one-hot даёт огромную разреженную матрицу, а target encoding — один числовой столбец. Для категорий с малым числом значений one-hot проще и безопаснее."}, {"q": "Как применять target encoding в многоклассовой задаче?", "a": "Создают отдельный столбец для каждого класса — долю этого класса в категории (one-vs-rest). Одно среднее по меткам классов бессмысленно, так как номера классов не упорядочены."}], "tcn_cheatsheet.html": [{"q": "Что такое каузальная свёртка и зачем она в TCN?", "a": "Выход в момент t зависит только от входов в моменты ≤ t: паддинг добавляется только слева. Это исключает утечку будущего при прогнозировании."}, {"q": "Зачем нужны dilated свёртки?", "a": "Dilation d вставляет промежутки между элементами ядра, и при удвоении d на каждом слое рецептивное поле растёт экспоненциально с глубиной, а не линейно. Так покрываются длинные истории малым числом слоёв."}, {"q": "Посчитайте рецептивное поле TCN: ядро k = 3, dilation 1, 2, 4, 8, по одной свёртке на уровень.", "a": "R = 1 + (k − 1)·∑d = 1 + 2·(1 + 2 + 4 + 8) = 31 шаг. В оригинальной TCN в каждом residual-блоке две свёртки, тогда R = 1 + 2·2·15 = 61."}, {"q": "Какие преимущества TCN перед LSTM?", "a": "Параллельная обработка всей последовательности при обучении, стабильные градиенты благодаря residual-связям, контролируемый размер памяти. Во многих бенчмарках TCN сравнима с LSTM или лучше её."}, {"q": "В чём ограничения TCN?", "a": "История за пределами рецептивного поля полностью недоступна, а при переносе на задачу с более длинными зависимостями архитектуру надо менять. На инференсе по шагам нужно хранить окно истории, тогда как RNN хранит только скрытое состояние."}], "td_learning_cheatsheet.html": [{"q": "Как выглядит обновление TD(0) и что такое TD-ошибка?", "a": "V(s) ← V(s) + α·δ, где δ = r + γV(s′) − V(s) — **TD-ошибка**, разница между одношаговой целью и текущей оценкой."}, {"q": "Что такое бутстрэппинг и какой у него компромисс?", "a": "Обновление по собственной текущей оценке V(s′) вместо полного возврата. Дисперсия меньше, чем у MC, и учиться можно онлайн, но появляется смещение из-за неточной V(s′)."}, {"q": "Посчитайте TD-ошибку: V(s) = 5, r = 1, γ = 0.9, V(s′) = 6.", "a": "δ = 1 + 0.9·6 − 5 = 1.4. При α = 0.1 новое V(s) = 5 + 0.14 = 5.14."}, {"q": "Как TD(λ) связывает TD(0) и Монте-Карло?", "a": "Цель — λ-возврат, взвешенная смесь n-шаговых возвратов с весами (1 − λ)λⁿ⁻¹. λ = 0 даёт TD(0), λ = 1 — MC; онлайн реализуется через eligibility traces."}, {"q": "В чём «смертельная триада» для TD-методов?", "a": "Сочетание **аппроксимации функций**, **бутстрэппинга** и **off-policy** обучения может приводить к расходимости оценок (пример Бэйрда). Любые два элемента без третьего обычно безопасны."}], "tensorflow_keras_full_guide_cheatsheet.html": [{"q": "Чем отличаются Sequential API, Functional API и наследование от `keras.Model`?", "a": "Sequential — простая цепочка слоёв. Functional — произвольный граф: несколько входов и выходов, ветвления, skip-связи. Наследование от `Model` с методом `call` — полная гибкость для нестандартной логики."}, {"q": "Что делает `model.compile()`?", "a": "Задаёт оптимизатор, функцию потерь и метрики. Только после компиляции можно вызывать `fit`, `evaluate` и `predict` со стандартным циклом обучения."}, {"q": "Что такое callbacks и какие самые полезные?", "a": "Объекты, которые вызываются в определённые моменты обучения. Самые полезные: `EarlyStopping` (с `restore_best_weights=True`), `ModelCheckpoint`, `ReduceLROnPlateau`, `TensorBoard`."}, {"q": "Чем `sparse_categorical_crossentropy` отличается от `categorical_crossentropy`?", "a": "Sparse принимает метки как номера классов (0, 1, 2…), обычная — как one-hot векторы. Математически это одна и та же функция потерь."}, {"q": "Зачем нужен `tf.data`?", "a": "Для эффективного конвейера загрузки данных: `map` для предобработки, `batch`, `shuffle`, `prefetch(tf.data.AUTOTUNE)`, чтобы подготовка следующего батча шла параллельно с обучением на текущем."}], "tensorflow_serving_cheatsheet.html": [{"q": "Какой формат модели использует TensorFlow Serving и как он организован на диске?", "a": "**SavedModel** с сигнатурами входов/выходов. Модели лежат в каталоге вида `models/<имя>/<версия>/`, где версия — целое число; сервер автоматически подхватывает новые версии."}, {"q": "Чем REST API TF Serving отличается от gRPC и что выбрать?", "a": "REST (порт 8501 по умолчанию) удобен и передаёт JSON, gRPC (порт 8500) использует бинарный protobuf и даёт меньшую задержку и накладные расходы на больших тензорах. Для высоконагруженных сервисов обычно выбирают gRPC."}, {"q": "Зачем включать batching на сервере и чем это грозит?", "a": "Серверное батчирование объединяет одиночные запросы в батч и резко повышает пропускную способность на GPU. Цена — дополнительная задержка на ожидание заполнения батча, поэтому настраивают максимальный размер батча и таймаут."}, {"q": "Почему препроцессинг лучше включать внутрь SavedModel?", "a": "Иначе клиенты должны повторить точно ту же предобработку, и любое расхождение даёт training-serving skew. Встроенные в граф слои предобработки (или **TF Transform**) гарантируют одинаковые преобразования."}, {"q": "Как TF Serving позволяет обновлять модель без простоя?", "a": "Он следит за каталогом и загружает новую версию, переключая трафик после её готовности, а старую выгружает по политике версий. Через конфиг можно держать несколько версий одновременно и обращаться к конкретной по номеру или метке."}], "text_to_image_generation_cheatsheet.html": [{"q": "Как текст управляет генерацией в моделях вроде Stable Diffusion?", "a": "Текст кодируется энкодером (например, CLIP text encoder), и эмбеддинги токенов подаются в U-Net денойзера через **cross-attention** на каждом шаге диффузии. Так каждая область изображения «смотрит» на нужные слова."}, {"q": "Что делает classifier-free guidance и что будет при слишком большом guidance scale?", "a": "Модель предсказывает шум с условием и без него, результат экстраполируется: ε = ε_uncond + w·(ε_cond − ε_uncond). Большое w усиливает соответствие тексту, но снижает разнообразие и даёт пересыщенные, неестественные изображения."}, {"q": "Зачем Stable Diffusion работает в латентном пространстве, а не в пикселях?", "a": "**VAE** сжимает изображение (512×512×3 в латент 64×64×4, в 8 раз по каждой стороне), и диффузия идёт в нём — это на порядки дешевле по памяти и вычислениям. Декодер VAE в конце восстанавливает пиксели."}, {"q": "Как оценивают качество text-to-image моделей?", "a": "**FID** — реалистичность и разнообразие по сравнению с реальными изображениями, **CLIP score** — соответствие текста и изображения, а также человеческие оценки. Метрики не всегда совпадают с восприятием, поэтому человеческая оценка остаётся важной."}, {"q": "Почему модели часто ошибаются с подсчётом объектов и пространственными отношениями?", "a": "Текстовый энкодер вроде CLIP плохо кодирует композицию («красный куб на синем шаре» близок к обратному), а данные обучения редко точно описывают количество и расположение. Отсюда перепутанные атрибуты и неверное число объектов."}], "tfidf_cheatsheet.html": [{"q": "Зачем умножать частоту слова на IDF?", "a": "Слова, частые во всём корпусе («и», «в», «это»), встречаются почти везде и не отличают документы друг от друга. IDF = log(N / df) снижает их вес и повышает вес редких, специфичных для документа слов."}, {"q": "Посчитайте IDF слова, встречающегося в 10 документах из 1000 (без сглаживания, натуральный логарифм).", "a": "IDF = ln(1000 / 10) = ln 100 ≈ 4.6. Слово из всех 1000 документов получило бы ln 1 = 0. В `TfidfVectorizer` по умолчанию используется сглаженная формула ln((1 + N)/(1 + df)) + 1, поэтому числа там будут чуть другими."}, {"q": "Почему для сравнения документов используют косинусное сходство, а не евклидово расстояние?", "a": "Косинус смотрит на направление вектора, а не на длину, поэтому длинный и короткий документы на одну тему оказываются близкими. Евклидово расстояние сильно зависит от длины документа."}, {"q": "В чём главное ограничение TF-IDF?", "a": "Это мешок слов: порядок слов теряется, а синонимы («авто» и «машина») — разные ортогональные измерения, поэтому смысловая близость не учитывается. Векторы очень разреженные и высокоразмерные."}, {"q": "Какую ошибку часто допускают при использовании TfidfVectorizer в кросс-валидации?", "a": "Делают `fit` векторизатора на всём датасете до разбиения: словарь и IDF вычисляются с учётом тестовых документов — это утечка. Векторизатор нужно помещать в `Pipeline`, чтобы он обучался только на обучающих фолдах."}], "time_series_cheatsheet.html": [{"q": "Что означают параметры p, d, q в ARIMA(p, d, q)?", "a": "p — порядок авторегрессии (сколько прошлых значений), d — сколько раз ряд дифференцируется для стационарности, q — порядок скользящего среднего (сколько прошлых ошибок прогноза)."}, {"q": "Что такое стационарность и как её проверить?", "a": "Ряд стационарен, если его среднее, дисперсия и автокорреляции не меняются со временем. Проверяют визуально и тестами: ADF (нулевая гипотеза — ряд нестационарен) и KPSS (нулевая гипотеза — стационарен)."}, {"q": "Как ACF и PACF помогают выбрать p и q?", "a": "Для AR(p) PACF резко обрывается после лага p, а ACF затухает постепенно. Для MA(q) ACF обрывается после лага q, а PACF затухает. На практике дополнительно сравнивают модели по AIC/BIC."}, {"q": "Чем SARIMA отличается от ARIMA?", "a": "Добавляет сезонную часть (P, D, Q)ₛ с периодом s (например, 12 для месячных данных с годовой сезонностью): сезонное дифференцирование и сезонные AR/MA-компоненты на лагах, кратных s."}, {"q": "Почему для проверки модели временного ряда нельзя случайно разбивать данные?", "a": "Будущее не должно попадать в обучение. Используют разбиение по времени или скользящую проверку (rolling/expanding window), когда модель обучается на прошлом и прогнозирует следующий отрезок."}], "time_series_anomalies_cheatsheet.html": [{"q": "Чем точечные аномалии отличаются от контекстных и коллективных?", "a": "**Точечная** — отдельное значение, резко выбивающееся из распределения. **Контекстная** — значение нормальное само по себе, но аномальное в данном контексте (жара +30° зимой). **Коллективная** — подпоследовательность, каждый элемент которой обычен, а вместе они ненормальны (например, плоский участок у пульса)."}, {"q": "Почему простое правило «3σ» по всему ряду плохо работает для рядов с трендом и сезонностью?", "a": "Тренд и сезонность раздувают общую дисперсию, и настоящие аномалии прячутся внутри «нормального» разброса, а обычные сезонные пики могут ложно срабатывать. Правильнее сначала убрать тренд и сезонность (например, **STL**-декомпозицией) и искать выбросы в остатках."}, {"q": "Как устроен поиск аномалий через ошибку прогноза?", "a": "Модель прогнозирует следующее значение, и если фактическое отклоняется от прогноза больше порога (например, на k стандартных отклонений остатков), точка помечается как аномалия. Важно, чтобы модель обучалась на чистых данных, иначе она «выучит» аномалии как норму."}, {"q": "Почему для оценки детекторов аномалий accuracy — плохая метрика?", "a": "Аномалии редки: при 0.5% аномалий модель «всё нормально» получает 99.5% accuracy. Смотрят на **precision, recall, F1, PR-AUC**, а для рядов — ещё и на задержку обнаружения и метрики по интервалам (засчитано ли попадание хотя бы в часть аномального отрезка)."}, {"q": "Что будет, если вычислять скользящее среднее и σ для порога с центрированным окном в онлайн-детекторе?", "a": "Центрированное окно использует будущие точки, которых в реальном времени ещё нет, — это утечка: на исторических данных детектор выглядит лучше, чем будет работать в продакшене. В онлайн-режиме окно должно быть только по прошлым значениям."}], "time_series_feature_engineering_cheatsheet.html": [{"q": "Почему лаговые признаки нужно согласовывать с горизонтом прогноза?", "a": "При прогнозе на h шагов вперёд значения за последние h − 1 шагов в момент прогноза ещё неизвестны. Если взять lag 1 для прогноза на 7 дней, модель будет опираться на признак, недоступный в проде; минимальный лаг должен быть ≥ h (либо нужна рекурсивная стратегия прогноза)."}, {"q": "Зачем кодировать день недели или месяц через sin/cos?", "a": "Обычное числовое кодирование разрывает цикл: декабрь (12) и январь (1) оказываются далеко друг от друга. Пара sin(2π·m/12), cos(2π·m/12) размещает значения на окружности, и соседние месяцы становятся близкими; для деревьев часто достаточно и категориального признака."}, {"q": "Как правильно считать скользящие статистики, чтобы не допустить утечки?", "a": "Сначала сдвигать ряд, затем считать окно: `y.shift(1).rolling(7).mean()`. Без `shift` окно включает текущее значение таргета, и качество на валидации получится нереалистично высоким."}, {"q": "Почему деревья решений плохо прогнозируют ряд с трендом и как это исправить?", "a": "Деревья не экстраполируют: прогноз ограничен диапазоном таргета на обучении, и при растущем тренде модель «упирается в потолок». Решение — предсказывать разности (yₜ − yₜ₋₁) или отношения, заранее убрать тренд или комбинировать деревья с линейной моделью тренда."}, {"q": "Какие признаки, кроме лагов, часто дают большой прирост?", "a": "Календарные (праздники, выходные, дни до и после праздника), скользящие среднее, стандартное отклонение, минимум и максимум, экспоненциально взвешенные средние, известные заранее внешние переменные (промо, цены, прогноз погоды) и агрегаты по группам (средние продажи по магазину или категории)."}], "time_series_validation_cheatsheet.html": [{"q": "Почему для временных рядов нельзя использовать обычный KFold с перемешиванием?", "a": "Модель обучается на будущих точках и проверяется на прошлых, а соседние наблюдения сильно коррелированы — получается **утечка из будущего** и завышенная оценка. Валидация должна имитировать продакшен: обучение на прошлом, проверка на последующем периоде."}, {"q": "Чем expanding window отличается от sliding (rolling) window?", "a": "В **expanding** обучающая выборка растёт с каждым фолдом (все данные с начала), в **sliding** окно фиксированной длины сдвигается вперёд. Скользящее окно лучше при смене режимов, когда старые данные неактуальны, расширяющееся — когда данных мало, а зависимость стабильна."}, {"q": "Зачем нужен зазор (gap) между train и test?", "a": "Если признаки строятся по лагам и окнам, последние точки трейна и первые точки теста делят общую информацию, а в проде между последними данными и моментом прогноза бывает задержка. Зазор, равный горизонту или длине окна, исключает эту утечку; в sklearn это параметр `gap` у `TimeSeriesSplit`."}, {"q": "Какие размеры теста получит TimeSeriesSplit(n_splits=4) на 100 точках?", "a": "По умолчанию размер теста = n_samples // (n_splits + 1) = 100 // 5 = **20**. Трейн — первые 20, 40, 60 и 80 точек, тест — следующие 20 точек в каждом из 4 фолдов."}, {"q": "Какую ошибку допускают, масштабируя признаки до разбиения на фолды?", "a": "Скейлер, обученный на всём ряду, использует среднее и дисперсию будущих периодов — это утечка. Препроцессинг нужно обучать только на трейне каждого фолда, например поместив его в `Pipeline`."}], "tokenization_cheatsheet.html": [{"q": "Почему современные модели используют подсловную токенизацию, а не целые слова?", "a": "Словарь целых слов огромен и всё равно не покрывает редкие и новые слова (OOV). Посимвольная токенизация даёт слишком длинные последовательности. Подслова — компромисс: частые слова целиком, редкие — из кусочков."}, {"q": "Как работает BPE (Byte Pair Encoding)?", "a": "Начинают с символов и многократно объединяют самую частую пару соседних токенов в новый токен, пока не достигнут нужного размера словаря. При токенизации применяются выученные слияния."}, {"q": "Чем отличаются WordPiece, Unigram и SentencePiece?", "a": "WordPiece (BERT) выбирает слияния, максимизирующие правдоподобие корпуса. Unigram начинает с большого словаря и удаляет наименее полезные токены. SentencePiece — библиотека, работающая с сырым текстом (пробел — обычный символ), реализует BPE и Unigram без предварительного деления на слова."}, {"q": "Почему один и тот же текст на русском часто занимает больше токенов, чем на английском?", "a": "Если токенизатор обучался в основном на английском, русские слова разбиваются на больше мелких кусочков. Это увеличивает стоимость, уменьшает эффективную длину контекста и может ухудшать качество."}, {"q": "Можно ли использовать модель с чужим токенизатором?", "a": "Нет: эмбеддинги модели соответствуют конкретным id токенов её словаря. Токенизатор и модель всегда загружают в паре из одного чекпойнта (`AutoTokenizer` и `AutoModel` с одним именем)."}], "topic_modeling_lda_nmf_cheatsheet.html": [{"q": "Какую генеративную модель текста предполагает LDA?", "a": "Каждый документ — смесь тем с весами из распределения Дирихле, каждая тема — распределение над словами. Каждое слово документа порождается выбором темы из смеси документа и затем слова из этой темы."}, {"q": "Чем NMF отличается от LDA?", "a": "NMF — матричное разложение: матрица документ×слово (обычно TF-IDF) приближается произведением двух неотрицательных матриц (документ×тема и тема×слово). Это детерминированная оптимизация, без вероятностной модели; часто быстрее и даёт чёткие темы на коротких текстах."}, {"q": "Какая предобработка важна для тематического моделирования?", "a": "Удаление стоп-слов, лемматизация (особенно для русского), удаление очень редких и очень частых слов, при необходимости — биграммы. Иначе темы забиваются служебными словами."}, {"q": "Как выбрать число тем?", "a": "Перебрать несколько значений и сравнить когерентность тем (coherence score — насколько часто топ-слова темы встречаются вместе), смотреть на интерпретируемость тем глазами. Перплексия на отложенных данных плохо согласуется с мнением людей."}, {"q": "Чем BERTopic отличается от классических подходов?", "a": "Использует эмбеддинги документов от трансформера, понижает размерность (UMAP), кластеризует (HDBSCAN) и описывает кластеры словами через c-TF-IDF. Лучше улавливает смысл, работает с короткими текстами, но тяжелее вычислительно."}], "torchserve_cheatsheet.html": [{"q": "Что такое .mar-архив в TorchServe и что в него входит?", "a": "Model Archive, создаваемый `torch-model-archiver`: веса или TorchScript-модель, handler (код пред- и постобработки), дополнительные файлы (словари, конфиги) и метаданные. Сервер загружает модель именно из такого архива."}, {"q": "Зачем в TorchServe нужен handler и какие этапы он реализует?", "a": "Handler задаёт логику обработки запроса: `initialize` (загрузка модели), `preprocess` (разбор входа в тензоры), `inference` и `postprocess` (преобразование выхода в ответ). Есть встроенные handlers для типовых задач, например классификации изображений."}, {"q": "Для чего нужен Management API в дополнение к Inference API?", "a": "Inference API (по умолчанию порт 8080) обслуживает предсказания, а Management API (8081) позволяет регистрировать и удалять модели, менять число воркеров и версии без перезапуска сервера. Метрики отдаются отдельно (8082)."}, {"q": "Как настройки batch_size и max_batch_delay влияют на работу сервиса?", "a": "TorchServe ждёт до `max_batch_delay` миллисекунд, чтобы собрать до `batch_size` запросов в один батч. Большие значения повышают пропускную способность, но увеличивают задержку отдельного запроса."}, {"q": "Какая типичная ошибка возникает при переходе от обучения к TorchServe?", "a": "Расхождение предобработки в handler и при обучении (другая нормализация, ресайз, токенизация) или забытый `model.eval()`, из-за чего dropout и BatchNorm работают в режиме обучения. Результат — тихое падение качества без ошибок в логах."}], "transfer_learning_cheatsheet.html": [{"q": "Когда перенос обучения работает лучше всего?", "a": "Когда исходная и целевая задачи похожи (общие признаки, близкие домены), а размеченных данных в целевой задаче мало. Если домены очень разные, возможен **отрицательный перенос** — качество хуже, чем при обучении с нуля."}, {"q": "Чем отличаются feature extraction и fine-tuning?", "a": "**Feature extraction**: предобученная модель заморожена и используется как генератор признаков, обучается только новая голова — быстро, мало риска переобучения. **Fine-tuning**: дообучаются и веса предобученной модели (часто только верхние слои, с малым learning rate) — лучше при большем объёме данных."}, {"q": "Почему при fine-tuning используют маленький learning rate?", "a": "Большие шаги быстро разрушат полезные предобученные представления (catastrophic forgetting). Малый LR, постепенная разморозка слоёв и разные LR для разных слоёв сохраняют знания, адаптируя их."}, {"q": "Что такое domain adaptation и чем это отличается от обычного fine-tuning?", "a": "Задача та же, но распределение входов отличается (например, обучение на синтетике, применение на реальных данных), а в целевом домене может не быть меток. Используют reweighting объектов (importance weighting), выравнивание распределений признаков, adversarial-обучение."}, {"q": "Как в классическом ML реализуют перенос через взвешивание объектов?", "a": "Объектам исходного домена дают веса w(x) = p_target(x) / p_source(x), часто оценённые классификатором «источник vs цель». Так обучение на исходных данных имитирует целевое распределение (коррекция covariate shift)."}], "transfer_learning_cnn_cheatsheet.html": [{"q": "Почему признаки сети, обученной на ImageNet, полезны для другой задачи?", "a": "Ранние слои учат универсальные признаки — края, текстуры, простые формы, — которые встречаются почти на любых изображениях. Чем глубже слой, тем специфичнее признаки исходной задаче."}, {"q": "Чем feature extraction отличается от fine-tuning?", "a": "Feature extraction: веса предобученной сети замораживаются, обучается только новая «голова» (классификатор). Fine-tuning: часть или все слои размораживаются и дообучаются с небольшим learning rate."}, {"q": "Какую стратегию выбрать при маленьком датасете, похожем на ImageNet?", "a": "Заморозить основу и обучить только голову: данных мало, и полный fine-tuning быстро переобучится. При большом датасете или сильно отличающемся домене (медицинские снимки, спутники) размораживают больше слоёв."}, {"q": "Почему при fine-tuning используют маленький learning rate?", "a": "Предобученные веса уже хорошие; большой шаг может разрушить полезные признаки («катастрофическое забывание»). Часто используют разные lr: меньше для основы, больше для новой головы."}, {"q": "Что обязательно нужно сделать с входными изображениями при использовании предобученной модели?", "a": "Привести их к тому же формату, что при предобучении: размер, порядок каналов и нормализация теми же средними и стандартными отклонениями (для ImageNet — mean = [0.485, 0.456, 0.406], std = [0.229, 0.224, 0.225])."}], "transfer_learning_deep_cheatsheet.html": [{"q": "Почему признаки, выученные на ImageNet, полезны в других задачах?", "a": "Нижние слои CNN учат **общие** признаки — края, текстуры, простые формы, — которые нужны почти в любой задаче зрения. Чем выше слой, тем специфичнее признаки для исходной задачи; поэтому при переносе нижние слои обычно сохраняют, а верхние заменяют или дообучают."}, {"q": "Когда использовать feature extraction, а когда fine-tuning?", "a": "Мало данных и похожий домен — заморозить бэкбон и обучить только новую голову (**feature extraction**). Много данных или сильно отличающийся домен — **fine-tuning** с размораживанием части или всех слоёв. Мало данных и чужой домен — дообучать осторожно, начиная с верхних слоёв."}, {"q": "Почему при fine-tuning используют небольшой learning rate и сначала обучают только голову?", "a": "Новая голова инициализирована случайно, и её большие градиенты на старте могут **разрушить** предобученные веса бэкбона. Поэтому сначала обучают голову при замороженном бэкбоне, затем размораживают с LR в 10–100 раз меньше; часто применяют разные LR для разных слоёв (discriminative LR)."}, {"q": "Что нужно учесть со слоями BatchNorm при дообучении на малом датасете?", "a": "В режиме обучения BatchNorm обновляет running mean и variance по маленьким батчам нового датасета, что может испортить статистики предобученной модели. Часто BN-слои держат в **режиме инференса** (в Keras — вызов базовой модели с `training=False`, в PyTorch — `.eval()` для BN-модулей)."}, {"q": "Что такое негативный перенос?", "a": "Ситуация, когда предобучение на исходной задаче **ухудшает** качество по сравнению с обучением с нуля — обычно при сильном различии доменов или задач. Поэтому стоит сравнивать с бейзлайном без переноса и выбирать предобученную модель из близкого домена."}], "transformer_nlp_cheatsheet.html": [{"q": "Почему в attention скалярное произведение делят на √dₖ?", "a": "При большой размерности dₖ скалярные произведения q·k имеют дисперсию порядка dₖ, и softmax уходит в насыщение — почти one-hot с крошечными градиентами. Деление на √dₖ возвращает дисперсию к ~1 и стабилизирует обучение."}, {"q": "Зачем трансформеру позиционное кодирование?", "a": "Self-attention **инвариантен к перестановке** токенов: без дополнительной информации «собака кусает человека» и «человек кусает собаку» дают одинаковый набор представлений. Позиционные кодирования (синусоидальные, обучаемые, RoPE) добавляют информацию о порядке."}, {"q": "Чем self-attention выигрывает у RNN и в чём его главный недостаток?", "a": "Любые два токена связаны напрямую за один шаг, и вся последовательность обрабатывается **параллельно**, что ускоряет обучение на GPU и помогает с дальними зависимостями. Недостаток — память и время O(n²) по длине последовательности, поэтому длинные контексты дороги."}, {"q": "Чем отличаются encoder-only, decoder-only и encoder-decoder модели?", "a": "Encoder-only (BERT) видит контекст в обе стороны и хорош для классификации и NER. Decoder-only (GPT) использует **каузальную маску** и генерирует текст слева направо. Encoder-decoder (T5, исходный Transformer) подходит для задач «последовательность → последовательность», например перевода и суммаризации."}, {"q": "Зачем нужна multi-head attention вместо одной головы?", "a": "Каждая голова проецирует Q, K, V в своё подпространство и может выучить свой тип связей (синтаксис, кореференция, соседние токены). Одна голова усредняла бы эти паттерны в одно распределение весов; при этом общая вычислительная стоимость почти не растёт, так как размерность головы равна d_model / h."}], "transformers_cheatsheet.html": [{"q": "Из каких подслоёв состоит блок энкодера Transformer?", "a": "Multi-head self-attention и позиционно-независимая полносвязная сеть (FFN, обычно с расширением размерности в 4 раза). Вокруг каждого подслоя — residual-связь и нормализация слоя (LayerNorm)."}, {"q": "Чем блок декодера отличается от блока энкодера?", "a": "В декодере self-attention маскирован (токен не видит будущие токены), и есть дополнительный слой cross-attention: запросы из декодера, ключи и значения — из выхода энкодера."}, {"q": "Зачем нужна каузальная маска?", "a": "При обучении декодер получает всю целевую последовательность сразу; маска запрещает позиции i смотреть на позиции > i, чтобы модель не «подглядывала» в токен, который должна предсказать."}, {"q": "Почему Transformer обучается быстрее RNN?", "a": "Все позиции последовательности обрабатываются параллельно матричными операциями, без последовательной зависимости по времени. Это хорошо ложится на GPU."}, {"q": "Чем Pre-LN отличается от Post-LN и почему Pre-LN популярнее?", "a": "В Post-LN нормализация стоит после сложения с residual, в Pre-LN — перед подслоем внутри residual-ветки. Pre-LN обучается стабильнее, особенно в глубоких моделях, и меньше зависит от warmup."}], "transformers_time_series_cheatsheet.html": [{"q": "Какие трудности возникают при применении трансформеров к временным рядам?", "a": "Квадратичная стоимость внимания по длине истории, слабая встроенная информация о порядке и времени (нужны позиционные и временные признаки), склонность к переобучению на коротких рядах, отдельные точки ряда несут мало информации как токены."}, {"q": "Какую идею использует PatchTST?", "a": "Ряд разбивается на патчи — короткие отрезки, — и каждый патч становится токеном (как в ViT). Это сокращает число токенов, даёт каждому токену локальный контекст и улучшает прогноз; каналы ряда обрабатываются независимо."}, {"q": "Что такое Temporal Fusion Transformer?", "a": "Архитектура для многошагового прогноза, объединяющая LSTM для локальной обработки, внимание для длинных зависимостей и механизмы отбора признаков. Работает со статическими, известными в будущем и наблюдаемыми признаками и даёт интерпретируемые веса."}, {"q": "Что показала статья о том, что простые линейные модели (DLinear) конкурируют с трансформерами?", "a": "На ряде стандартных бенчмарков долгосрочного прогноза простая линейная модель с декомпозицией на тренд и сезонность оказалась не хуже многих трансформерных моделей. Вывод — сложные архитектуры всегда нужно сравнивать с сильными простыми бейзлайнами."}, {"q": "Что такое foundation models для временных рядов?", "a": "Большие модели, предобученные на огромных коллекциях разнородных рядов (Chronos, TimesFM, Moirai), которые делают прогноз нового ряда без дообучения (zero-shot) или после небольшого дообучения."}], "tree_ensembles_cheatsheet.html": [{"q": "Почему одиночное дерево решений — плохая модель, но отличная основа для ансамблей?", "a": "Глубокое дерево имеет низкое смещение, но очень высокую дисперсию: небольшое изменение данных меняет структуру. Именно нестабильность делает деревья разнообразными, а усреднение или последовательное исправление ошибок превращает их в точные ансамбли."}, {"q": "Чем Extra Trees отличаются от случайного леса?", "a": "В **Extra Trees** (Extremely Randomized Trees) пороги разбиений выбираются случайно, а не оптимально, и по умолчанию используется вся выборка без бутстрепа. Это сильнее снижает дисперсию и ускоряет обучение ценой небольшого роста смещения."}, {"q": "Чем случайный лес принципиально отличается от градиентного бустинга?", "a": "Лес строит деревья **параллельно и независимо** и усредняет их, снижая дисперсию; он устойчив к выбору гиперпараметров. Бустинг строит деревья **последовательно**, каждое исправляет ошибки предыдущих, снижая смещение; он обычно точнее, но чувствительнее к настройке и шуму."}, {"q": "Почему impurity-based важность признаков в ансамблях деревьев может вводить в заблуждение?", "a": "Она завышает важность признаков с большим числом уникальных значений (непрерывных, ID-подобных) и считается на обучающей выборке. Надёжнее permutation importance на валидации или SHAP; при коррелированных признаках важность «делится» между ними."}, {"q": "Нужно ли масштабировать признаки и кодировать категории для ансамблей деревьев?", "a": "Масштабирование не нужно — разбиения инвариантны к монотонным преобразованиям признаков. Категории кодировать нужно для sklearn (ordinal или one-hot), а CatBoost и LightGBM умеют работать с категориальными признаками напрямую, причём one-hot для признаков с высокой кардинальностью обычно ухудшает деревья."}], "tree_visualization_cheatsheet.html": [{"q": "Какую информацию показывает узел дерева в plot_tree?", "a": "Условие разбиения (признак и порог), значение критерия (gini, entropy или MSE), число объектов в узле (`samples`), распределение по классам (`value`) и предсказываемый класс. Цвет узла показывает доминирующий класс и уверенность."}, {"q": "Почему визуализировать дерево глубины 20 бессмысленно?", "a": "Количество узлов растёт экспоненциально — картинку невозможно прочитать. Для обзора ограничивают `max_depth` при отрисовке, смотрят текстовое представление `export_text` или важности признаков."}, {"q": "Как визуализировать модель случайного леса или бустинга?", "a": "Целиком — никак: в ней сотни деревьев. Можно нарисовать отдельные деревья (ограниченно полезно), но обычно используют важности признаков, PDP/ICE, SHAP или суррогатное дерево."}, {"q": "Почему важность признака по дереву (impurity-based) может вводить в заблуждение?", "a": "Она считается на train и завышает признаки с большим числом уникальных значений (ID, непрерывные), которые дают много возможных разбиений. Надёжнее permutation importance на валидации."}, {"q": "Что можно понять по визуализации неглубокого дерева решений?", "a": "Какие признаки и пороги дают главное разделение, есть ли подозрительные признаки с утечкой (одно разбиение почти идеально делит классы), как модель обрабатывает разные сегменты данных. Это удобный способ отладки и объяснения бизнесу."}], "tsne_cheatsheet.html": [{"q": "В чём основная идея t-SNE?", "a": "В исходном пространстве сходство точек задаётся гауссовыми вероятностями соседства, в низкоразмерном — распределением Стьюдента с одной степенью свободы. Положения точек в 2D подбираются градиентным спуском так, чтобы минимизировать KL-дивергенцию между этими двумя распределениями."}, {"q": "Зачем в низкоразмерном пространстве используется t-распределение, а не гауссово?", "a": "У t-распределения тяжёлые хвосты, поэтому умеренно далёкие точки можно разнести дальше без большого штрафа. Это решает «проблему скученности» (crowding problem): в 2D не хватает места, чтобы сохранить все средние расстояния из многомерного пространства, и без тяжёлых хвостов кластеры слипались бы в центре."}, {"q": "Как влияет perplexity?", "a": "Perplexity — примерно эффективное число соседей, которое учитывает каждая точка (обычно 5–50). Малые значения подчёркивают локальную структуру и могут дробить данные на ложные мелкие кластеры, большие — передают более глобальную структуру. Полезно смотреть несколько значений."}, {"q": "Какие выводы по картинке t-SNE делать нельзя?", "a": "Размеры кластеров и расстояния между кластерами на картинке почти ничего не значат: t-SNE в основном сохраняет локальное соседство. Также не стоит делать выводы по одному запуску — результат зависит от random seed и гиперпараметров."}, {"q": "Почему перед t-SNE часто применяют PCA?", "a": "t-SNE дорог на высокой размерности: предварительное снижение PCA до ~50 компонент ускоряет вычисления и подавляет шум. Кроме того, инициализация по PCA (`init='pca'`) делает результат стабильнее и лучше сохраняет глобальную структуру."}], "tts_models_cheatsheet.html": [{"q": "Из каких двух этапов обычно состоит нейросетевой TTS?", "a": "**Акустическая модель** (Tacotron 2, FastSpeech) переводит текст или фонемы в мел-спектрограмму, а **вокодер** (WaveNet, HiFi-GAN) восстанавливает из неё звуковую волну. End-to-end модели вроде VITS объединяют оба этапа."}, {"q": "Почему FastSpeech синтезирует быстрее и стабильнее, чем Tacotron?", "a": "Tacotron авторегрессивен и выравнивает текст с аудио через attention, что медленно и иногда приводит к пропуску или повтору слов. FastSpeech генерирует все кадры **параллельно**, а длительность каждой фонемы явно предсказывает duration predictor, поэтому сбои выравнивания исключены."}, {"q": "Почему нельзя просто восстановить звук из мел-спектрограммы обратным преобразованием?", "a": "Мел-спектрограмма теряет **фазу** и часть частотного разрешения. Алгоритм Гриффина–Лима оценивает фазу итеративно, но звучит «металлически»; нейровокодеры учатся генерировать правдоподобную волну и дают гораздо более натуральный звук."}, {"q": "Зачем на вход TTS подают фонемы, а не сырой текст?", "a": "Связь написания и произношения неоднозначна (омографы, ударения, сокращения, числа). Нормализация текста и **G2P** (grapheme-to-phoneme) снимают эту неоднозначность, и акустической модели не нужно учить орфографию языка."}, {"q": "Как оценивают качество синтезированной речи?", "a": "Главная метрика — **MOS** (Mean Opinion Score): слушатели оценивают естественность по шкале 1–5. Дополнительно проверяют разборчивость через WER распознавателя и похожесть голоса через косинусную близость спикерских эмбеддингов."}], "umap_cheatsheet.html": [{"q": "Чем UMAP отличается от t-SNE на практике?", "a": "UMAP обычно быстрее и лучше масштабируется на большие данные, несколько лучше сохраняет глобальную структуру и умеет преобразовывать новые точки (`transform`). Поэтому его можно использовать не только для визуализации, но и как шаг снижения размерности перед моделью."}, {"q": "За что отвечает параметр `n_neighbors`?", "a": "Это размер окрестности, по которой строится граф соседей. Малые значения фокусируют UMAP на локальной структуре (больше мелких деталей и разрывов), большие — на глобальной картине ценой потери мелких деталей."}, {"q": "Что делает параметр `min_dist`?", "a": "Он задаёт, насколько плотно точки могут располагаться в низкоразмерном представлении. Малый `min_dist` даёт сжатые, плотные кластеры (полезно для кластеризации), большой — более равномерное «размазанное» представление, сохраняющее общую топологию."}, {"q": "Можно ли интерпретировать расстояния и размеры кластеров на картинке UMAP?", "a": "Только с осторожностью: UMAP сохраняет глобальную структуру лучше t-SNE, но размеры кластеров и расстояния между ними всё равно искажаются, а плотность в 2D не равна плотности в исходных данных. Выводы стоит проверять на исходных признаках."}, {"q": "Можно ли использовать UMAP с учителем?", "a": "Да: если передать таргет в `fit(X, y)`, UMAP учитывает метки при построении представления (supervised UMAP) и лучше разделяет классы. Но тогда, как и при любой обработке с таргетом, преобразование нужно обучать только на обучающей части, иначе будет утечка данных."}], "universal_approximation_theorem_cheatsheet.html": [{"q": "Что именно утверждает теорема универсальной аппроксимации?", "a": "Сеть с одним скрытым слоем и подходящей нелинейной активацией (например, сигмоидой, а в общем случае — любой неполиномиальной) может сколь угодно точно аппроксимировать любую непрерывную функцию на **компактном** множестве, если нейронов достаточно много."}, {"q": "Почему теорема не означает, что двухслойной сети достаточно на практике?", "a": "Это теорема существования: она не говорит, сколько нейронов нужно (может потребоваться экспоненциально много), как найти веса градиентным спуском и будет ли сеть обобщаться на новые данные."}, {"q": "Зачем тогда нужны глубокие сети, если хватает одного скрытого слоя?", "a": "Есть функции, которые глубокая сеть представляет полиномиальным числом нейронов, а неглубокой нужно экспоненциально много (результаты **depth separation**). Глубина даёт эффективное иерархическое представление."}, {"q": "Почему с линейными активациями теорема не работает?", "a": "Композиция линейных отображений — снова линейное отображение, и многослойная сеть сводится к одному линейному слою. Без нелинейности нельзя аппроксимировать даже простую функцию вроде x²."}, {"q": "Гарантирует ли теорема хорошую аппроксимацию вне области обучения?", "a": "Нет: гарантия только на компактном множестве. За пределами обучающей области сети (например, с ReLU) экстраполируют почти линейно и могут сильно ошибаться."}], "vae_cheatsheet.html": [{"q": "Чем VAE отличается от обычного автоэнкодера?", "a": "Энкодер выдаёт не точку, а параметры распределения в латентном пространстве (среднее μ и дисперсию σ²), и код сэмплируется из него. Латентное пространство получается гладким и непрерывным, поэтому из него можно генерировать новые объекты."}, {"q": "Из каких двух слагаемых состоит функция потерь VAE?", "a": "Ошибка реконструкции и KL-дивергенция между распределением энкодера q(z|x) и априорным N(0, I). Вместе они — отрицательная нижняя граница правдоподобия (ELBO)."}, {"q": "Зачем нужен reparameterization trick?", "a": "Через случайное сэмплирование градиент напрямую не проходит. Трюк записывает z = μ + σ·ε, где ε ~ N(0, I): случайность вынесена в ε, а μ и σ участвуют в дифференцируемых операциях."}, {"q": "Как сгенерировать новый объект обученным VAE?", "a": "Сэмплировать z из априорного распределения N(0, I) и пропустить через декодер. Энкодер для генерации не нужен."}, {"q": "Почему изображения VAE часто получаются размытыми и что делает β-VAE?", "a": "Пиксельная функция потерь (MSE) усредняет возможные варианты, а сильная KL-регуляризация ограничивает информацию в коде — отсюда размытость. β-VAE усиливает вес KL (β > 1), получая более «распутанные» (disentangled) латентные факторы ценой качества реконструкции."}], "vanishing_gradient_cheatsheet.html": [{"q": "Почему градиенты исчезают в глубоких сетях и RNN?", "a": "По цепному правилу градиент — произведение многих якобианов. Если их нормы меньше 1 (насыщение сигмоиды/tanh, малые веса), произведение затухает экспоненциально с глубиной или длиной последовательности."}, {"q": "Посчитайте: производная сигмоиды не больше 0.25. Во сколько раз затухнет градиент через 10 слоёв?", "a": "В худшем случае через одни только активации в 0.25¹⁰ ≈ 9.5·10⁻⁷ раз, то есть почти в миллион. Поэтому глубокие сигмоидные сети без специальных приёмов почти не обучаются."}, {"q": "Как LSTM и GRU решают проблему исчезающего градиента?", "a": "Состояние ячейки обновляется аддитивно, а гейты регулируют поток: при forget gate ≈ 1 градиент проходит через много шагов почти без затухания. Это аналог residual-связи во времени."}, {"q": "Какие ещё приёмы помогают в глубоких сетях прямого распространения?", "a": "ReLU-подобные активации, инициализация He/Xavier, residual-связи, нормализация (BatchNorm, LayerNorm). Все они сохраняют норму сигнала и градиента порядка 1 по глубине."}, {"q": "Чем отличается взрывающийся градиент и как его лечат?", "a": "Это обратная ситуация — нормы якобианов больше 1, градиенты растут экспоненциально, loss становится NaN. Стандартное средство — **gradient clipping** по норме (`clip_grad_norm_`), а также меньший lr и правильная инициализация."}], "variational_inference_cheatsheet.html": [{"q": "В чём основная идея вариационного вывода?", "a": "Заменить точное вычисление сложного posterior p(z|x) **оптимизацией**: выбрать простое семейство q(z) и найти в нём распределение, минимизирующее KL(q ‖ p). Интегрирование превращается в задачу оптимизации."}, {"q": "Почему максимизируют ELBO, а не напрямую минимизируют KL(q ‖ p)?", "a": "KL требует неизвестного p(z|x). Но log p(x) = ELBO + KL(q ‖ p), а log p(x) от q не зависит, поэтому **максимизация ELBO** = E_q[log p(x, z)] − E_q[log q(z)] эквивалентна минимизации KL и вычислима."}, {"q": "Почему вариационный вывод обычно занижает неопределённость?", "a": "Минимизация обратной KL(q ‖ p) сильно штрафует q за массу там, где p мала, поэтому q «прячется» внутри одной моды (mode-seeking) и получается уже истинного posterior. Mean-field предположение о независимости также игнорирует корреляции."}, {"q": "Чем вариационный вывод отличается от MCMC на практике?", "a": "VI быстрее и масштабируется на большие данные (можно стохастическую оптимизацию), но даёт **смещённое приближение**. MCMC асимптотически точен, но медленный и сложнее диагностируется на сходимость."}, {"q": "Что такое mean-field приближение?", "a": "Предположение, что q(z) факторизуется по группам переменных: q(z) = ∏ qᵢ(zᵢ). Это позволяет обновлять факторы по очереди (координатный подъём, CAVI), но теряет зависимости между переменными."}], "video_audio_models_cheatsheet.html": [{"q": "Какой «бесплатный» сигнал для самообучения даёт видео со звуком?", "a": "Звук и изображение в видео **естественно синхронизированы**. Модель можно учить определять, соответствует ли звуковая дорожка видеофрагменту и совпадают ли они по времени (audio-visual correspondence и synchronization), не используя ручной разметки."}, {"q": "Чем отличаются раннее и позднее слияние (fusion) модальностей?", "a": "**Раннее** объединяет признаки на входе или в нижних слоях, позволяя моделировать тонкие взаимодействия, но требует синхронных данных и больше вычислений. **Позднее** объединяет предсказания или эмбеддинги отдельных моделей — проще и устойчивее к отсутствию одной модальности, но хуже ловит взаимосвязи. Промежуточный вариант — cross-attention между модальностями."}, {"q": "Какие практические задачи решают аудио-визуальные модели?", "a": "Локализация источника звука на кадре, разделение голосов по лицам говорящих, распознавание речи по губам (AV-ASR, устойчивее в шуме), детекция дипфейков по рассинхрону, классификация событий в видео."}, {"q": "Почему одна модальность может «доминировать» при обучении, и чем это плохо?", "a": "Если одна модальность (например, видео) проще для оптимизации, сеть быстро начинает полагаться в основном на неё, а вторая недообучается — это называют **modality imbalance**. Помогают отдельные вспомогательные loss-функции для каждой модальности, modality dropout и балансировка градиентов."}, {"q": "Почему видео-модели вычислительно так дороги и как это уменьшают?", "a": "Видео добавляет временную ось: число токенов или вокселей растёт пропорционально числу кадров. Используют разреженную выборку кадров, факторизованное внимание (отдельно по пространству и времени), трубчатые патчи (tubelets) и маскирование большей части токенов при предобучении (VideoMAE)."}], "video_generation_cheatsheet.html": [{"q": "Почему генерация видео сложнее генерации отдельных изображений?", "a": "Нужна **временная согласованность**: объекты должны сохранять форму, цвет и идентичность между кадрами, а движение — быть физически правдоподобным. Плюс объём данных в десятки и сотни раз больше, что резко повышает требования к памяти и вычислениям."}, {"q": "Что будет, если генерировать видео покадрово моделью для изображений?", "a": "Кадры получатся по отдельности красивыми, но будут мерцать: детали, текстуры и даже объекты будут меняться от кадра к кадру. Нужны временные слои — temporal attention или 3D-свёртки, — связывающие кадры."}, {"q": "Как современные видео-диффузионные модели снижают вычислительную стоимость?", "a": "Работают в сжатом **латентном пространстве** (пространственно-временной VAE), разбивают видео на пространственно-временные патчи для трансформера (как в DiT-подходах), генерируют низкое разрешение и частоту кадров с последующим апсемплингом."}, {"q": "Чем факторизованное внимание по пространству и времени отличается от полного?", "a": "Полное внимание по всем токенам видео стоит O((T·H·W)²). Факторизованное сначала применяет внимание внутри кадра, затем по времени для каждой позиции — это дешевле, но слабее моделирует сложные пространственно-временные зависимости."}, {"q": "Почему у генераторов видео часто ломается физика?", "a": "Модель учит статистические закономерности пикселей, а не законы механики: объекты могут проходить сквозь друг друга, исчезать или менять число. Такие нарушения трудно поймать метриками вроде **FVD**, поэтому нужны человеческая оценка и специальные тесты."}], "vision_attention_mechanisms_cheatsheet.html": [{"q": "Как работает Squeeze-and-Excitation блок?", "a": "**Squeeze**: global average pooling сжимает каждый канал в число. **Excitation**: два полносвязных слоя с bottleneck (ratio r, обычно 16) и сигмоида дают веса каналов, на которые затем умножается карта признаков."}, {"q": "Чем CBAM отличается от SENet?", "a": "CBAM последовательно применяет **канальное** внимание (по average и max pooling) и **пространственное** внимание (свёртка 7×7 по картам среднего и максимума вдоль каналов). SENet учитывает только каналы."}, {"q": "Почему в SE используют сигмоиду, а не softmax?", "a": "Каналы не конкурируют друг с другом: несколько каналов могут быть одновременно важными. Сигмоида даёт независимые веса из (0, 1), softmax заставил бы их суммироваться в 1."}, {"q": "Сколько стоит добавление SE-блока?", "a": "Мало: около 2C²/r параметров на блок и пренебрежимо малые FLOPs по сравнению со свёртками; для ResNet-50 общий прирост параметров около 10% при заметном росте точности."}, {"q": "Чем такие механизмы внимания отличаются от self-attention в ViT?", "a": "SE/CBAM перевзвешивают признаки скалярными масками, вычисленными по агрегированным статистикам, и встраиваются в CNN почти бесплатно. Self-attention вычисляет попарные взаимодействия всех позиций с квадратичной сложностью и моделирует дальние зависимости явно."}], "vision_transformers_vit_cheatsheet.html": [{"q": "Как ViT превращает изображение в последовательность токенов?", "a": "Делит изображение на патчи (например, 16×16), каждый патч разворачивается в вектор и линейно проецируется в эмбеддинг. Добавляются позиционные эмбеддинги и обучаемый токен [CLS] для классификации."}, {"q": "Сколько токенов получится из изображения 224×224 с патчами 16×16?", "a": "(224 / 16)² = 14² = 196 патчей, плюс токен [CLS] — 197 токенов."}, {"q": "Почему ViT нужно больше данных, чем CNN?", "a": "У CNN есть встроенные индуктивные предположения — локальность и инвариантность к сдвигу. У ViT их почти нет, и всё это приходится выучивать из данных; поэтому на небольших датасетах без предобучения ViT уступает CNN."}, {"q": "Как DeiT позволил обучать ViT без огромных датасетов?", "a": "Сильной аугментацией и регуляризацией, а также дистилляцией знаний от CNN-учителя через специальный distillation-токен — так ViT удалось хорошо обучить на одном ImageNet-1k."}, {"q": "В чём идея Swin Transformer?", "a": "Внимание считается внутри локальных окон, а между слоями окна сдвигаются, чтобы информация проходила между ними. Получается иерархия признаков разного масштаба (как у CNN) и сложность, линейная по числу патчей, — удобно для детекции и сегментации."}], "voting_stacking_cheatsheet.html": [{"q": "Чем hard voting отличается от soft voting?", "a": "**Hard voting** выбирает класс, за который проголосовало большинство моделей. **Soft voting** усредняет предсказанные вероятности и учитывает уверенность моделей, поэтому обычно работает лучше — но только если вероятности хорошо откалиброваны и модели их умеют выдавать."}, {"q": "Чем стекинг отличается от взвешенного голосования?", "a": "В voting веса фиксированы или заданы вручную, а в стекинге **метамодель обучается** комбинировать предсказания базовых моделей и может выучить, какой модели доверять в каких ситуациях. Ценой этого становятся сложность и риск переобучения."}, {"q": "Почему метамодель обучают на out-of-fold предсказаниях?", "a": "Предсказания базовой модели на её собственных обучающих данных завышены: переобученная модель выглядит идеальной, и метамодель отдаст ей лишний вес. Out-of-fold предсказания (через CV, как в `StackingClassifier(cv=5)`) имитируют поведение на новых данных."}, {"q": "Почему в качестве метамодели часто берут простую модель (логистическую или гребневую регрессию)?", "a": "Признаков у метамодели мало, и они сильно коррелированы, поэтому сложная метамодель легко переобучается. Линейная модель с регуляризацией устойчива и даёт интерпретируемые веса базовых моделей."}, {"q": "Когда стекинг или голосование не дают выигрыша?", "a": "Когда базовые модели похожи и ошибаются одинаково, или одна модель значительно сильнее остальных — тогда ансамбль либо повторяет её, либо ухудшает за счёт слабых. Прирост дают разнообразные модели сопоставимого качества: бустинг, линейные модели, kNN, нейросети."}], "weight_initialization_cheatsheet.html": [{"q": "Почему нельзя инициализировать все веса нулями?", "a": "Все нейроны слоя получат одинаковые выходы и одинаковые градиенты и будут обновляться синхронно — симметрия не нарушится, и слой будет эквивалентен одному нейрону. Смещения (bias) нулями инициализировать можно."}, {"q": "Что будет при слишком большом или слишком маленьком масштабе весов?", "a": "Дисперсия активаций и градиентов будет экспоненциально расти или затухать по глубине, приводя к взрывающимся или исчезающим градиентам; сигмоида/tanh вдобавок уйдут в насыщение."}, {"q": "Чем инициализация Xavier отличается от He?", "a": "**Xavier (Glorot)**: Var(w) = 2/(n_in + n_out), выведена для симметричных активаций вроде tanh. **He (Kaiming)**: Var(w) = 2/n_in — учитывает, что ReLU обнуляет половину входов, поэтому дисперсия вдвое больше."}, {"q": "Посчитайте стандартное отклонение He-инициализации для слоя с 512 входами.", "a": "σ = √(2/512) = √0.0039 ≈ 0.0625."}, {"q": "Почему с BatchNorm и residual-связями инициализация менее критична, но всё ещё важна?", "a": "BatchNorm перенормирует активации, а skip-связи пропускают сигнал в обход, поэтому сеть обучается даже при неидеальном масштабе. Но для очень глубоких сетей используют приёмы вроде нулевой инициализации последнего γ в residual-блоке, чтобы блок изначально был тождественным."}], "word_embeddings_cheatsheet.html": [{"q": "Чем эмбеддинги лучше one-hot кодирования слов?", "a": "One-hot векторы огромны (размер словаря), разрежены и все одинаково далеки друг от друга. Эмбеддинги — плотные векторы небольшой размерности (100–300), в которых похожие по смыслу слова расположены близко."}, {"q": "На какой идее основан Word2Vec?", "a": "Дистрибутивная гипотеза: слова, встречающиеся в похожих контекстах, имеют похожий смысл. Skip-gram предсказывает контекстные слова по центральному, CBOW — центральное слово по контексту."}, {"q": "Что означает пример «король − мужчина + женщина ≈ королева»?", "a": "Векторное пространство эмбеддингов кодирует смысловые отношения как направления: разность векторов «мужчина → женщина» близка к разности «король → королева»."}, {"q": "Как FastText справляется с редкими и незнакомыми словами?", "a": "Представляет слово как сумму векторов его символьных n-грамм. Поэтому вектор можно построить даже для слова, которого не было в обучении, — по его частям, что особенно полезно для языков с богатой морфологией, таких как русский."}, {"q": "Чем статические эмбеддинги (Word2Vec, GloVe) отличаются от контекстных (BERT)?", "a": "У статических одно слово всегда имеет один вектор — «ключ» от замка и «ключ»-родник неразличимы. Контекстные модели строят вектор слова с учётом всего предложения, и у многозначных слов векторы различаются."}], "xgboost_cheatsheet.html": [{"q": "Чем XGBoost отличается от классического градиентного бустинга?", "a": "Использует при построении деревьев разложение функции потерь до второго порядка (градиенты и гессианы), встроенную регуляризацию (штрафы за число листьев и величину весов), эффективную параллельную реализацию и встроенную обработку пропусков."}, {"q": "Какие гиперпараметры XGBoost настраивают в первую очередь?", "a": "`learning_rate` (eta) и `n_estimators` (вместе с early stopping), `max_depth`, `min_child_weight`, `subsample` и `colsample_bytree`, регуляризацию `reg_lambda` и `reg_alpha`."}, {"q": "Как XGBoost обрабатывает пропуски?", "a": "При каждом разбиении он пробует отправить объекты с пропуском в левую и в правую ветку и запоминает направление, которое лучше уменьшает потери. Заполнять пропуски заранее не обязательно."}, {"q": "Как использовать раннюю остановку в XGBoost?", "a": "Передать валидационную выборку в `eval_set` и задать `early_stopping_rounds`: обучение остановится, когда метрика на валидации перестанет улучшаться заданное число итераций, а для прогноза будет использована лучшая итерация."}, {"q": "Что делают `subsample` и `colsample_bytree`?", "a": "Каждое дерево обучается на случайной доле объектов и признаков. Это вносит случайность, делает деревья разнообразнее, уменьшает переобучение и ускоряет обучение."}], "yolo_cheatsheet.html": [{"q": "Чем одностадийные детекторы (YOLO) отличаются от двухстадийных (Faster R-CNN)?", "a": "Двухстадийные сначала предлагают области-кандидаты, затем классифицируют и уточняют каждую. YOLO за один проход сети сразу предсказывает рамки и классы по сетке — быстрее, подходит для реального времени."}, {"q": "Что такое IoU и как его посчитать?", "a": "Intersection over Union — площадь пересечения двух рамок, делённая на площадь их объединения. 1 — рамки совпадают, 0 — не пересекаются. Используется для сопоставления предсказаний с разметкой и в NMS."}, {"q": "Зачем нужен Non-Maximum Suppression (NMS)?", "a": "Детектор выдаёт много перекрывающихся рамок на один объект. NMS оставляет рамку с наибольшей уверенностью и удаляет те, у которых IoU с ней выше порога (например, 0.5)."}, {"q": "Что такое mAP?", "a": "Mean Average Precision: для каждого класса считается площадь под precision-recall кривой (AP) при заданном пороге IoU, затем значения усредняются по классам. mAP@0.5:0.95 дополнительно усредняет по порогам IoU от 0.5 до 0.95."}, {"q": "Что такое якорные рамки (anchors) и почему многие новые версии YOLO от них отказались?", "a": "Заранее заданные шаблоны рамок разных размеров и пропорций, относительно которых сеть предсказывает смещения. Их приходится подбирать под датасет; anchor-free подходы (YOLOv8 и новее) предсказывают центр и размеры объекта напрямую, что проще и обобщается лучше."}], "zero_shot_learning_cheatsheet.html": [{"q": "Как модель может распознать класс, которого не было в обучении?", "a": "Через **вспомогательную семантическую информацию** о классах: атрибуты («полосатый», «четыре ноги»), текстовые описания или эмбеддинги названий. Модель учится отображать изображение в это семантическое пространство и сравнивает его с описаниями новых классов."}, {"q": "Чем классический ZSL отличается от generalized ZSL (GZSL)?", "a": "В классическом ZSL на тесте встречаются **только новые** классы. В GZSL — и старые, и новые вместе, что реалистичнее и намного сложнее: модель сильно смещена к классам, которые видела при обучении."}, {"q": "Почему в GZSL используют гармоническое среднее точностей?", "a": "H = 2·Aₛ·Aᵤ / (Aₛ + Aᵤ), где Aₛ и Aᵤ — точности на seen и unseen классах. Простое среднее скрыло бы провал на новых классах при высокой точности на старых, а гармоническое **штрафует дисбаланс**: при Aₛ = 0.8 и Aᵤ = 0.2 получается H = 0.32."}, {"q": "Как CLIP и большие языковые модели изменили zero-shot learning?", "a": "Вместо вручную заданных атрибутов они используют **естественный язык**, выученный на огромных веб-данных: класс описывается текстовым промптом, а классификация сводится к сравнению эмбеддингов. Так модели решают новые задачи без дообучения, хотя «невиданность» классов здесь условна — подобные понятия почти наверняка были в предобучении."}, {"q": "Какие ловушки при оценке zero-shot моделей?", "a": "**Утечка** новых классов: они могли встретиться в предобучении бэкбона (например, на ImageNet), что завышает результаты. Для классических датасетов (AwA2, CUB, SUN) поэтому предложены специальные разбиения (Proposed Split), где unseen классы не пересекаются с ImageNet-1k."}]}, "demos": [{"file": "activation_functions.html", "title": "Функции активации", "topics": ["activation_functions_cheatsheet.html", "vanishing_gradient_cheatsheet.html"]}, {"file": "attention.html", "title": "Механизм внимания", "topics": ["self_attention_cheatsheet.html", "attention_mechanism_cheatsheet.html", "multi_head_attention_cheatsheet.html", "transformers_cheatsheet.html", "positional_encoding_cheatsheet.html"]}, {"file": "convolution.html", "title": "Свёртка и пулинг", "topics": ["cnn_basics_cheatsheet.html", "pooling_layers_cheatsheet.html", "cnn_visualization_techniques_cheatsheet.html"]}, {"file": "decision_tree.html", "title": "Дерево решений", "topics": ["decision_trees_cheatsheet.html", "decision_trees_regression_cheatsheet.html", "tree_visualization_cheatsheet.html"]}, {"file": "dropout_batchnorm.html", "title": "Dropout и BatchNorm", "topics": ["dropout_regularization_cheatsheet.html", "batch_normalization_cheatsheet.html", "weight_initialization_cheatsheet.html"]}, {"file": "gradient_boosting.html", "title": "Градиентный бустинг", "topics": ["boosting_cheatsheet.html", "gradient_boosting_regression_cheatsheet.html", "gradient_boosting_hyperparameters_cheatsheet.html", "xgboost_cheatsheet.html", "lightgbm_cheatsheet.html", "catboost_cheatsheet.html"]}, {"file": "gradient_descent.html", "title": "Градиентный спуск", "topics": ["gradient_descent_cheatsheet.html", "optimizers_cheatsheet.html"]}, {"file": "kmeans.html", "title": "k-means", "topics": ["kmeans_cheatsheet.html", "choosing_clusters_number_cheatsheet.html", "clustering_metrics_cheatsheet.html"]}, {"file": "knn.html", "title": "k-ближайших соседей", "topics": ["knn_cheatsheet.html"]}, {"file": "linreg.html", "title": "Линейная регрессия", "topics": ["linreg_cheatsheet.html", "regression_metrics_cheatsheet.html", "ridge_lasso_elasticnet_cheatsheet.html"]}, {"file": "mlp_playgro const STORE_KEY = "mlcs-progress-v1";

// ---------- состояние и прогресс ----------
function loadState() {
  const empty = { done: {}, exDone: {}, review: {}, notes: {}, last: null, tab: "sections", qOpen: false };
  try { return Object.assign(empty, JSON.parse(localStorage.getItem(STORE_KEY))); }
  catch (e) { return empty; }
}
let state = loadState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

const title = f => DATA.titles[f] || f;
const isDone = f => !!state.done[f];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uniq = arr => [...new Set(arr)];
const pathItems = p => uniq(p.stages.flatMap(s => s.items));
const allTopics = uniq(DATA.parts.flatMap(p => p.sections.flatMap(s => s.items)));

// где тема находится в README — для подписи в поиске
const topicHome = {};
DATA.parts.forEach((p, pi) => p.sections.forEach((s, si) => s.items.forEach(f => {
  if (!topicHome[f]) topicHome[f] = { pi, si, label: s.title };
})));

function progress(items) {
  const n = items.filter(isDone).length;
  return { n, total: items.length, pct: items.length ? Math.round(100 * n / items.length) : 0 };
}
function bar(items) { return `<div class="bar"><span style="width:${progress(items).pct}%"></span></div>`; }
function countLabel(items) {
  const p = progress(items);
  return `<small class="${p.n === p.total && p.total ? "full" : ""}">${p.n}/${p.total}</small>`;
}

function toggleDone(f, value) {
  if (value === undefined) value = !isDone(f);
  if (value) {
    if (!state.done[f]) state.done[f] = Date.now();
    if (!state.review[f]) state.review[f] = { step: 0, due: Date.now() + DAY };
  } else { delete state.done[f]; delete state.review[f]; }
  save(); refreshChrome();
}

// ---------- интервальное повторение ----------
// После отметки «Изучено» тема возвращается на повторение через 1, 3, 7, 16, 35, 90 дней.
// «Помню» — следующий интервал, «Есть пробелы» — снова через день.
const DAY = 24 * 3600 * 1000;
const INTERVALS = [1, 3, 7, 16, 35, 90];
const questionsOf = f => DATA.questions[f] || [];
const demosOf = f => DATA.demos.filter(d => d.topics.includes(f));
const prereqsOf = f => (DATA.prereqs || {})[f] || [];
const dependentsOf = (() => {   // обратные связи: какие темы опираются на эту
  const rev = {};
  Object.entries(DATA.prereqs || {}).forEach(([t, before]) => before.forEach(b => (rev[b] = rev[b] || []).push(t)));
  return f => rev[f] || [];
})();
const noteOf = f => (state.notes[f] && state.notes[f].text) || "";

function relatedBar(f) {
  const before = prereqsOf(f), after = dependentsOf(f);
  if (!before.length && !after.length) return "";
  const chip = g => `<a class="chip ${isDone(g) ? "done" : ""}" href="#/t/${encodeURIComponent(g)}" title="${isDone(g) ? "Изучено" : "Ещё не изучено"}">${isDone(g) ? "✔ " : ""}${esc(title(g))}</a>`;
  const left = before.filter(g => !isDone(g)).length;
  return `<div class="related">
    ${before.length ? `<span class="lbl">📚 Сначала${left ? ` (не изучено: ${left})` : " ✔"}:</span>${before.map(chip).join("")}` : ""}
    ${before.length && after.length ? '<span class="sep">|</span>' : ""}
    ${after.length ? `<span class="lbl">➡ Дальше:</span>${after.map(chip).join("")}` : ""}
  </div>`;
}

function reviewOf(f) {
  if (!isDone(f)) return null;
  return state.review[f] || { step: 0, due: state.done[f] + DAY };   // темы, отмеченные до появления повторения
}
function dueTopics() {
  const now = Date.now();
  return Object.keys(state.done).filter(f => DATA.titles[f] && reviewOf(f).due <= now)
    .sort((a, b) => reviewOf(a).due - reviewOf(b).due);
}
function rate(f, remembered) {
  const r = reviewOf(f) || { step: -1 };
  const step = remembered ? Math.min(r.step + 1, INTERVALS.length - 1) : 0;
  if (!state.done[f]) state.done[f] = Date.now();
  state.review[f] = { step, due: Date.now() + INTERVALS[step] * DAY };
  save(); refreshChrome();
}
function whenLabel(f) {
  const r = reviewOf(f);
  if (!r) return "";
  const days = Math.ceil((r.due - Date.now()) / DAY);
  return days <= 0 ? "повторить сегодня" : `повторение через ${days} ${plural(days, "день", "дня", "дней")}`;
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? few : many;
}

function questionsBlock(f) {
  const qs = questionsOf(f);
  if (!qs.length) return `<p class="note">Вопросов к этой теме пока нет — перескажите себе главное из шпаргалки.
    Добавить вопросы можно в <code>questions/${esc(f.replace("_cheatsheet.html", ""))}.md</code>.</p>`;
  return qs.map((q, i) => `<details class="q"><summary>${i + 1}. ${esc(q.q)}</summary><div class="ans">${markdown(q.a)}</div></details>`).join("");
}
function rateButtons(f) {
  return `<div class="rate">
    <button class="btn good" data-rate="1" data-topic="${esc(f)}">✔ Помню</button>
    <button class="btn bad" data-rate="0" data-topic="${esc(f)}">✖ Есть пробелы</button>
  </div><p class="note" style="margin-top:8px">${esc(whenLabel(f) || "Оценка отметит тему изученной и запланирует повторение.")}</p>`;
}

// ---------- маршруты ----------
// #/                         главная
// #/s/<part>/<section>       раздел
// #/p/<path>                 учебный путь
// #/x/<exercise>             упражнение
// #/t/<file>?ctx=<контекст>  просмотр шпаргалки
// #/q/<строка>               поиск
// #/r                        повторение
// #/d/<файл>                 интерактивная демонстрация из interactive/
// #/n                        мои заметки
function parseHash() {
  const [route, query] = decodeURIComponent(location.hash.slice(1) || "/").split("?ctx=");
  return { parts: route.split("/").filter(Boolean), ctx: query || "" };
}

function contextList(ctx) {
  const [kind, a, b] = ctx.split(":");
  if (kind === "s") {
    const sec = DATA.parts[+a] && DATA.parts[+a].sections[+b];
    if (sec) return { items: sec.items, label: sec.title, back: `#/s/${a}/${b}` };
  }
  if (kind === "p" && DATA.paths[+a]) return { items: pathItems(DATA.paths[+a]), label: DATA.paths[+a].title, back: `#/p/${a}` };
  return null;
}

function render() {
  const { parts, ctx } = parseHash();
  document.body.classList.remove("menu-open");
  const main = document.getElementById("main");
  const [kind, a, b] = parts;
  if (kind === "t") main.innerHTML = viewTopic(parts.slice(1).join("/"), ctx);
  else if (kind === "s") main.innerHTML = viewSection(+a, +b);
  else if (kind === "p") main.innerHTML = viewPath(+a);
  else if (kind === "x") main.innerHTML = viewExercise(+a);
  else if (kind === "q") main.innerHTML = viewSearch(parts.slice(1).join("/"));
  else if (kind === "r") main.innerHTML = viewReview();
  else if (kind === "d") main.innerHTML = viewDemo(parts.slice(1).join("/"));
  else if (kind === "n") main.innerHTML = viewNotes();
  else main.innerHTML = viewHome();
  if (kind === "t" || kind === "d") forwardFrameKeys(main.querySelector("iframe"));
  else main.scrollTop = 0;
  if (kind === "s") setTab("sections", false);
  if (kind === "p") setTab("paths", false);
  if (kind === "x") setTab("exercises", false);
  refreshChrome();
}

// Горячие клавиши работают и когда фокус внутри шпаргалки.

function forwardFrameKeys(frame) {

// ---------- мини-рендер markdown для заданий ----------
function markdown(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  const out = []; let list = null, code = null, table = null, para = null;   // para — строки текущего абзаца
  const flush = () => {
    if (list) { out.push(`<${list.tag}>${list.items.map(i => `<li>${i}</li>`).join("")}</${list.tag}>`); list = null; }
    if (table) { out.push(`<table>${table.map((r, k) => `<tr>${r.map(c => k ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("")}</tr>`).join("")}</table>`); table = null; }
    if (para) { out.push(`<p>${para.map(inline).join(" ")}</p>`); para = null; }
  };
  for (const line of src.split(/\r?\n/)) {
    if (code !== null) {
      if (line.startsWith("```")) { out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); code = null; } else code.push(line);
      continue;
    }
    if (line.startsWith("```")) { flush(); code = []; continue; }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { flush(); const l = Math.min(m[1].length + 1, 4); out.push(`<h${l}>${inline(m[2])}</h${l}>`); }
    else if (/^\s*\|.*\|\s*$/.test(line)) {
      if (list || para) flush();
      const cells = line.trim().slice(1, -1).split("|").map(c => c.trim());
      if (!cells.every(c => /^:?-+:?$/.test(c))) (table = table || []).push(cells);
    }
    else if ((m = line.match(/^\s*([-*]|\d+\.)\s+(.*)/))) {
      const tag = /\d/.test(m[1]) ? "ol" : "ul";
      if (/^\s{2,}/.test(line) && list) { list.items[list.items.length - 1] += "<br>• " + inline(m[2]); continue; }
      if (!list || list.tag !== tag) { flush(); list = { tag, items: [] }; }
      list.items.push(inline(m[2]));
    }
    else if (!line.trim()) flush();
    else if (/^\s+\S/.test(line) && list) list.items[list.items.length - 1] += " " + inline(line.trim());
    else { if (list || table) flush(); (para = para || []).push(line.trim()); }   // строки подряд — один абзац
  }
  if (code !== null) out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
  flush();
  return out.join("\n");
}

// ---------- боковая панель ----------
function setTab(tab, rerender = true) {
  state.tab = tab; save();
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  if (rerender) renderNav();
}

function renderNav() {
  const tab = state.tab, hash = location.hash.split("?")[0];
  const item = (href, label, items) =>
    `<a class="navitem ${hash === href ? "active" : ""}" href="${href}"><span>${esc(label)}</span>${items ? countLabel(items) : ""}</a>`;
  let html = "";
  if (tab === "paths") {
    html = DATA.paths.map((p, i) => item(`#/p/${i}`, p.title, pathItems(p))).join("");
  } else if (tab === "exercises") {
    const groups = {};
    DATA.exercises.forEach((e, i) => (groups[e.topic] = groups[e.topic] || []).push([e, i]));
    html = Object.entries(groups).map(([g, list]) => `<div class="navgroup">${esc(g.replace(/_/g, " "))}</div>` +
      list.map(([e, i]) => `<a class="navitem ${hash === "#/x/" + i ? "active" : ""}" href="#/x/${i}"><span>${esc(e.title)}</span><small class="full">${state.exDone[e.id] ? "✔" : ""}</small></a>`).join("")).join("");
  } else {
    html = DATA.parts.map((p, pi) => `<div class="navgroup">${esc(p.title)}</div>` +
      p.sections.map((s, si) => item(`#/s/${pi}/${si}`, s.title, s.items)).join("")).join("");
  }
  document.getElementById("navList").innerHTML = html;
  const active = document.querySelector(".navitem.active");
  if (active) active.scrollIntoView({ block: "nearest" });
}

const THEME_LABELS = { auto: ["🌓", "Тема: как в системе"], light: ["☀️", "Тема: светлая"], dark: ["🌙", "Тема: тёмная"] };
function renderThemeButton() {
  const [icon, label] = THEME_LABELS[window.mlcsTheme.get()];
  const btn = document.getElementById("themeBtn");
  btn.textContent = icon;
  btn.title = `${label} (нажмите, чтобы сменить)`;
  btn.setAttribute("aria-label", label);
}

function refreshChrome() {
  renderThemeButton();
  const p = progress(allTopics);
  document.getElementById("overallBar").style.width = p.pct + "%";
  document.getElementById("overallText").textContent = `${p.n} / ${p.total} изучено`;
  const due = dueTopics().length;
  document.getElementById("dueCount").textContent = due ? due : "";
  document.getElementById("reviewBtn").title = due ? `К повторению сегодня: ${due}` : "Интервальное повторение";
  renderNav();
}

function rerenderKeepScroll() {
  const main = document.getElementById("main"), top = main.scrollTop;
  if (parseHash().parts[0] === "t") {           // не перезагружаем iframe — только кнопку
    const btn = document.querySelector("[data-toggle]");
    if (btn) { const on = isDone(btn.dataset.toggle); btn.classList.toggle("on", on); btn.textContent = on ? "✔ Изучено" : "☐ Изучено"; }
    const box = document.getElementById("rateBox");
    if (box && btn) box.innerHTML = rateButtons(btn.dataset.toggle);
    return;
  }
  render(); main.scrollTop = top;
}

// ---------- события ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-toggle],[data-ex],[data-copy],[data-action],[data-tab-link],[data-qtoggle],[data-rate],[data-theme-toggle],#menuBtn");
  if (!t) return;
  if (t.id === "menuBtn") { document.body.classList.toggle("menu-open"); return; }
  if (t.hasAttribute("data-theme-toggle")) {
    const order = ["auto", "light", "dark"];
    window.mlcsTheme.set(order[(order.indexOf(window.mlcsTheme.get()) + 1) % order.length]);
    renderThemeButton();
    return;
  }
  if (t.dataset.tab) setTab(t.dataset.tab);
  if (t.dataset.tabLink) { e.preventDefault(); setTab(t.dataset.tabLink); document.body.classList.add("menu-open"); }
  if (t.dataset.toggle) { toggleDone(t.dataset.toggle); rerenderKeepScroll(); }
  if (t.hasAttribute("data-qtoggle")) {
    state.qOpen = !state.qOpen; save();
    document.querySelector(".viewer").classList.toggle("qopen", state.qOpen);
  }
  if (t.dataset.rate) {
    rate(t.dataset.topic, t.dataset.rate === "1");
    if (parseHash().parts[0] === "r") render(); else rerenderKeepScroll();
  }
  if (t.dataset.ex) { const id = t.dataset.ex; if (state.exDone[id]) delete state.exDone[id]; else state.exDone[id] = Date.now(); save(); rerenderKeepScroll(); }
  if (t.dataset.copy) { navigator.clipboard && navigator.clipboard.writeText(t.dataset.copy).then(() => { t.textContent = "Скопировано ✔"; }); }
  if (t.dataset.action) action(t.dataset.action);
});
document.addEventListener("input", e => {
  const f = e.target.dataset && e.target.dataset.note;
  if (!f) return;
  const text = e.target.value;
  if (text.trim()) state.notes[f] = { text, t: Date.now() }; else delete state.notes[f];
  save();
  const mark = document.getElementById("noteMark");
  if (mark) mark.textContent = text.trim() ? " · 📝" : "";
});
document.addEventListener("change", e => {
  if (e.target.dataset.done) { toggleDone(e.target.dataset.done, e.target.checked); rerenderKeepScroll(); }
});

function action(name) {
  if (name === "review") {
    const done = Object.keys(state.done).filter(f => DATA.titles[f]);
    const pool = done.length ? done : allTopics;
    location.hash = "#/t/" + encodeURIComponent(pool[Math.floor(Math.random() * pool.length)]);
  } else if (name === "export") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 1)], { type: "application/json" }));
    a.download = "ml-cheatsheets-progress.json"; a.click();
  } else if (name === "import") {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json";
    inp.onchange = () => inp.files[0].text().then(txt => {
      try { const s = JSON.parse(txt); state = Object.assign(loadState(), s); save(); render(); alert("Прогресс загружен"); }
      catch (err) { alert("Не удалось прочитать файл прогресса"); }
    });
    inp.click();
  } else if (name === "reset" && confirm("Сбросить весь прогресс (заметки сохранятся)? Это нельзя отменить (если не сохранили файл).")) {
    state = { done: {}, exDone: {}, review: {}, notes: state.notes, last: null, tab: state.tab, qOpen: state.qOpen }; save(); render();   // заметки не трогаем
  }
}

const search = document.getElementById("search");
let searchTimer;
search.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { location.hash = search.value.trim() ? "#/q/" + encodeURIComponent(search.value.trim()) : "#/"; }, 150);
});

document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); search.focus(); search.select(); return; }
  if (typing) { if (e.key === "Escape") search.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const inViewer = parseHash().parts[0] === "t";
  if (!inViewer) return;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    const a = document.querySelector(`[data-nav="${e.key === "ArrowRight" ? "next" : "prev"}"][href]`);
    if (a) location.hash = a.getAttribute("href");
  } else if (e.key === "m" || e.key === "M" || e.key === "ь" || e.key === "Ь") {
    const btn = document.querySelector("[data-toggle]"); if (btn) btn.click();
  } else if (e.key === "q" || e.key === "Q" || e.key === "й" || e.key === "Й") {
    const btn = document.querySelector("[data-qtoggle]"); if (btn) btn.click();
  } else if (e.key === "Escape") {
    location.hash = document.querySelector(".vbar a").getAttribute("href");
  }
});

window.addEventListener("hashchange", () => {
  const { parts } = parseHash();
  if (parts[0] !== "q") search.value = "";
  render();
});
setTab(state.tab || "sections", false);
render();
</script>
</body>

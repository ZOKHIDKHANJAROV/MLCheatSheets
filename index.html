 уверенные неверные прогнозы и в паре с softmax/сигмоидой даёт хорошие градиенты (p − y). MSE с сигмоидой в зоне насыщения даёт почти нулевой градиент, и обучение застревает."}, {"q": "Почему в PyTorch в `nn.CrossEntropyLoss` подают логиты, а не вероятности?", "a": "Функция сама применяет log-softmax численно устойчивым способом. Если заранее применить softmax, он будет применён дважды, и обучение испортится."}, {"q": "Чем binary cross-entropy отличается от categorical cross-entropy?", "a": "Бинарная — для одного выхода с вероятностью класса 1 (а также для multi-label, где каждый класс — отдельная бинарная задача). Категориальная — для одного верного класса из нескольких, с softmax по всем классам."}, {"q": "Как функцией потерь учесть дисбаланс классов?", "a": "Задать веса классов (`weight` в `CrossEntropyLoss`, `pos_weight` в `BCEWithLogitsLoss`) или использовать focal loss, которая уменьшает вклад лёгких, уже хорошо классифицированных примеров."}], "lstm_cheatsheet.html": [{"q": "Какие гейты есть в LSTM и что делает каждый?", "a": "Forget gate решает, что стереть из состояния ячейки; input gate — какую новую информацию записать; output gate — какую часть состояния выдать наружу как скрытое состояние hₜ. Каждый гейт — сигмоида со значениями от 0 до 1."}, {"q": "Чем состояние ячейки (cell state) отличается от скрытого состояния?", "a": "Cell state cₜ — «долговременная память», которая обновляется в основном сложением и поэлементным умножением на гейты. Скрытое состояние hₜ = oₜ · tanh(cₜ) — отфильтрованный выход на текущем шаге."}, {"q": "Почему LSTM лучше простой RNN справляется с длинными зависимостями?", "a": "Cell state обновляется аддитивно: cₜ = fₜ·cₜ₋₁ + iₜ·c̃ₜ. Если forget gate близок к 1, градиент проходит через много шагов почти без затухания."}, {"q": "Зачем forget gate часто инициализируют смещением около 1?", "a": "Чтобы в начале обучения сеть по умолчанию сохраняла информацию, а не стирала её. Это облегчает обучение длинным зависимостям."}, {"q": "Сколько параметров у слоя LSTM по сравнению с простой RNN того же размера?", "a": "Примерно в 4 раза больше: у LSTM четыре набора весов (три гейта и кандидат в состояние), у простой RNN — один."}], "malware_detection_cheatsheet.html": [{"q": "Чем статический анализ вредоносного ПО отличается от динамического?", "a": "Статический изучает файл без запуска: заголовки PE, импортируемые функции, строки, энтропию секций, байтовые n-граммы. Динамический запускает файл в песочнице и смотрит поведение: системные вызовы, изменения реестра, сеть. Статика быстрая, но уязвима к упаковке и обфускации; динамика дороже и обманывается проверкой «я в песочнице?»."}, {"q": "Почему высокая энтропия секции — подозрительный признак?", "a": "Энтропия, близкая к 8 бит/байт, указывает на сжатые или зашифрованные данные — так часто выглядят упакованные вредоносы. Но признак неоднозначен: легитимные установщики и сжатые ресурсы тоже имеют высокую энтропию."}, {"q": "Почему при оценке детектора важно делить данные по времени?", "a": "Семейства малвари эволюционируют, и случайный сплит смешивает старые и новые образцы, завышая качество. Временное разбиение (обучение на старых, тест на новых) показывает реальную деградацию модели из-за дрейфа."}, {"q": "Почему в malware detection особенно важна низкая доля ложных срабатываний?", "a": "Детектор проверяет огромное число легитимных файлов; даже FPR 0.1% означает массу заблокированных нормальных программ и потерю доверия пользователей. Поэтому качество часто фиксируют как TPR при очень малом FPR (10⁻³ или 10⁻⁴)."}, {"q": "Как злоумышленник может обойти ML-детектор и что с этим делать?", "a": "Добавить безвредные секции или строки, упаковать файл, изменить незначащие байты так, чтобы функциональность сохранилась, а score упал (adversarial evasion). Защита — более устойчивые поведенческие признаки, комбинация статики и динамики, adversarial training и регулярное переобучение."}], "maml_meta_learning_cheatsheet.html": [{"q": "Что именно оптимизирует MAML?", "a": "Не веса под одну задачу, а **начальную инициализацию** θ, из которой несколько шагов градиентного спуска на support set дают хорошее качество на query set новой задачи. Мета-цель — ∑ L_τ(θ − α∇L_τ(θ)) по задачам τ."}, {"q": "Чем отличаются внутренний и внешний циклы MAML?", "a": "Внутренний цикл адаптирует копию параметров к конкретной задаче на её support set (шаг α). Внешний цикл обновляет общую инициализацию θ по ошибке адаптированных моделей на query set (шаг β), усредняя по батчу задач."}, {"q": "Почему полный MAML дорог и что такое first-order MAML?", "a": "Мета-градиент проходит через шаги внутреннего цикла и требует производных второго порядка (гессиан-векторных произведений) и хранения графа вычислений. FOMAML отбрасывает вторые производные и использует градиент на адаптированных весах — дешевле и часто почти так же хорошо."}, {"q": "Почему MAML называется model-agnostic?", "a": "Он требует только, чтобы модель обучалась градиентным спуском, и не накладывает ограничений на архитектуру или loss. Его применяют к CNN для классификации, к регрессии и к политикам в обучении с подкреплением."}, {"q": "Когда MAML может работать плохо?", "a": "Если задачи в распределении слишком разные, единая инициализация не подходит всем; если новая задача вне обучающего распределения задач — адаптации за несколько шагов не хватает. Также MAML нестабилен в обучении и чувствителен к гиперпараметрам (MAML++ решает часть проблем)."}], "manifold_learning_cheatsheet.html": [{"q": "В чём состоит гипотеза многообразия?", "a": "Реальные высокоразмерные данные (изображения, сигналы) обычно лежат вблизи многообразия гораздо меньшей размерности, вложенного в исходное пространство. Методы manifold learning пытаются найти координаты на этом многообразии."}, {"q": "Почему евклидово расстояние может вводить в заблуждение на многообразии?", "a": "Две точки на соседних витках «швейцарского рулета» близки по прямой, но далеки вдоль поверхности. Поэтому большинство методов опираются на граф ближайших соседей и сохраняют локальную структуру или геодезические расстояния, а не прямые евклидовы."}, {"q": "Как число соседей влияет на методы вроде Isomap и LLE?", "a": "Слишком мало соседей — граф распадается на несвязные части, и вложение ломается. Слишком много — появляются «короткие замыкания» между удалёнными частями многообразия, и метод вырождается в аналог линейной проекции."}, {"q": "Чем методы, сохраняющие глобальную структуру, отличаются от локальных?", "a": "Isomap и MDS стремятся сохранить все попарные (в том числе дальние) расстояния. LLE, Laplacian Eigenmaps (spectral embedding), t-SNE и UMAP сохраняют прежде всего локальное соседство, поэтому лучше разворачивают сложные многообразия, но хуже передают взаимное расположение далёких частей."}, {"q": "Какие практические ограничения у классических методов manifold learning?", "a": "Они чувствительны к шуму и выбору числа соседей, плохо масштабируются (поиск соседей и разложение матриц n×n) и, кроме Isomap и LLE в sklearn, обычно не умеют преобразовывать новые точки. Кроме того, если многообразие имеет «дыры» или несколько компонент, результаты могут быть искажены."}], "markov_decision_processes_cheatsheet.html": [{"q": "Из чего состоит MDP?", "a": "Кортеж (S, A, P, R, γ): множества состояний и действий, переходные вероятности P(s′|s, a), функция награды R и коэффициент дисконтирования γ. Цель — найти политику π, максимизирующую ожидаемую дисконтированную сумму наград."}, {"q": "Что означает марковское свойство и что делать, если оно нарушено?", "a": "Будущее зависит только от текущего состояния и действия, а не от всей истории. Если наблюдение неполно (POMDP), в состояние добавляют историю: стек последних кадров, рекуррентное скрытое состояние или belief state."}, {"q": "Чем отличаются V(s) и Q(s, a)?", "a": "V^π(s) — ожидаемый возврат из состояния s при следовании π; Q^π(s, a) — возврат, если сначала выполнить a, а затем следовать π. Связь: V^π(s) = ∑ₐ π(a|s)·Q^π(s, a); для выбора действия без модели среды нужна именно Q."}, {"q": "Запишите уравнение оптимальности Беллмана для V*.", "a": "V*(s) = maxₐ ∑ₛ′ P(s′|s, a)[R(s, a, s′) + γV*(s′)]. Оптимальная политика — жадная по V* (с учётом модели) или по Q*."}, {"q": "Посчитайте возврат для наград 1, 1, 1 при γ = 0.9.", "a": "G = 1 + 0.9·1 + 0.81·1 = 2.71. Каждая следующая награда умножается на очередную степень γ."}], "material_design_cheatsheet.html": [{"q": "Почему обратный дизайн (свойства → структура) сложнее прямой задачи?", "a": "Прямое отображение структура → свойство однозначно, а обратное — **многозначно**: заданное свойство могут иметь многие структуры, или ни одна. Кроме того, найденная структура должна быть стабильной и синтезируемой."}, {"q": "Как байесовская оптимизация помогает в дизайне материалов?", "a": "Суррогатная модель (часто гауссовский процесс) прогнозирует свойство и неопределённость, а acquisition function (например, Expected Improvement) выбирает следующий эксперимент. Это находит хорошие материалы за гораздо меньшее число дорогих экспериментов, чем перебор."}, {"q": "Какие ограничения нужно учитывать при генерации материалов генеративными моделями?", "a": "Электронейтральность, термодинамическая стабильность (энергия выше выпуклой оболочки, energy above hull), синтезируемость, стоимость и токсичность элементов. Без них модель генерирует «материалы» с отличными свойствами, но нереальные."}, {"q": "Что такое многокритериальная оптимизация в дизайне материалов?", "a": "Обычно нужно улучшить несколько конфликтующих свойств сразу (например, прочность и пластичность). Ищут **фронт Парето** — набор решений, где нельзя улучшить одно свойство без ухудшения другого."}, {"q": "Почему предсказанный ML-моделью «лучший» материал всё равно требует проверки?", "a": "Модель экстраполирует в неизученную область, где её ошибки максимальны, и оптимизатор как раз ищет точки, где модель ошибочно оптимистична. Поэтому кандидатов проверяют DFT-расчётом и экспериментом."}], "material_informatics_cheatsheet.html": [{"q": "Почему описать кристалл сложнее, чем молекулу?", "a": "Кристалл периодичен и формально бесконечен, а одну структуру можно задать разными элементарными ячейками. Представление должно учитывать периодичность и быть инвариантным к выбору ячейки, поворотам и перестановкам атомов (например, CGCNN строит граф с периодическими связями)."}, {"q": "Чем модели «по составу» отличаются от моделей «по структуре»?", "a": "Модели по составу (например, на основе элементных дескрипторов вроде Magpie) требуют только формулу и подходят для скрининга ещё не синтезированных материалов. Модели по структуре точнее, но нуждаются в атомных координатах, которые для новых соединений часто неизвестны."}, {"q": "Почему случайное разбиение материалов на train/test может завышать качество?", "a": "В базах (Materials Project и др.) много близких соединений и семейств с похожими составами, и модель интерполирует между «соседями». Для оценки открытия новых материалов используют разбиение по химическим системам или leave-cluster-out."}, {"q": "Почему источник данных (DFT против эксперимента) важен для выводов модели?", "a": "Большинство баз построено на DFT, которое систематически ошибается для части свойств (например, занижает ширину запрещённой зоны). Модель унаследует эти ошибки, поэтому для прогноза экспериментальных значений нужна калибровка или transfer learning на экспериментальных данных."}, {"q": "Что такое закрытый цикл (closed-loop) открытия материалов?", "a": "ML-модель предлагает кандидатов, автоматизированная лаборатория синтезирует и измеряет их, результаты возвращаются в модель. Выбор следующих экспериментов обычно делается байесовской оптимизацией с балансом exploration/exploitation."}], "material_properties_ml_cheatsheet.html": [{"q": "Почему данные о механических свойствах особенно трудны для ML?", "a": "Прочность и вязкость разрушения зависят не только от состава, но и от микроструктуры, обработки и условий испытания. Эта информация часто отсутствует в данных, поэтому один состав имеет разброс значений и модель упирается в шум."}, {"q": "Зачем в моделях свойств материалов нужна оценка неопределённости?", "a": "Данных мало, а интерес представляют как раз материалы вне изученной области, где модель экстраполирует. Неопределённость (ансамбли, гауссовские процессы) показывает, каким прогнозам можно доверять, и помогает выбирать эксперименты."}, {"q": "Чем полезен transfer learning для предсказания свойств при малых данных?", "a": "Модель предобучают на большом наборе дешёвого свойства (например, энергии образования из DFT), а затем дообучают на небольшом наборе целевого свойства. Выученные представления химии переносятся, что снижает ошибку."}, {"q": "Почему для свойств вроде модуля упругости важны физические ограничения?", "a": "Модель может предсказать физически невозможные значения, например отрицательный модуль или нарушение условий устойчивости. Ограничения на выход (неотрицательность, логарифмическое преобразование цели) делают прогнозы согласованными."}, {"q": "Почему для свойств, меняющихся на порядки (например, проводимость), регрессию обычно делают по логарифму?", "a": "Значения охватывают много порядков, и MSE в исходной шкале определяется несколькими крупнейшими значениями. Логарифмирование выравнивает вклад объектов и соответствует относительной ошибке."}], "matplotlib_seaborn_ml_cheatsheet.html": [{"q": "Какой график выбрать, чтобы посмотреть распределение одного числового признака?", "a": "Гистограмму (`plt.hist`, `sns.histplot`) или оценку плотности (`sns.kdeplot`). Для сравнения распределений между группами — `sns.boxplot` или `sns.violinplot`."}, {"q": "Как быстро увидеть попарные связи между признаками?", "a": "`sns.pairplot(df, hue='target')` — диаграммы рассеяния для всех пар признаков с раскраской по классу; `sns.heatmap(df.corr(), annot=True)` — тепловая карта корреляций."}, {"q": "Что показывает «ящик с усами» (boxplot)?", "a": "Медиану (линия внутри), квартили Q1 и Q3 (границы ящика), «усы» до самых дальних точек в пределах 1.5·IQR и отдельными точками — потенциальные выбросы."}, {"q": "Чем `fig, ax = plt.subplots()` лучше вызовов `plt.plot()` подряд?", "a": "Объектный интерфейс явно указывает, на какой оси рисовать, поэтому легко строить сетку графиков (`plt.subplots(2, 2)`) и настраивать каждый отдельно. Функции `plt.*` работают с «текущей» осью, и в сложных фигурах это путает."}, {"q": "Какие графики полезны для диагностики уже обученной модели?", "a": "Кривые обучения (ошибка на train и validation от размера выборки или эпохи), график остатков для регрессии, матрица ошибок и ROC-кривая для классификации, важность признаков."}], "matrix_factorization_svd_cheatsheet.html": [{"q": "В чём идея матричной факторизации для рекомендаций?", "a": "Матрица оценок R приближается произведением двух низкоранговых матриц: r̂ᵤᵢ = pᵤ·qᵢ, где pᵤ и qᵢ — эмбеддинги пользователя и объекта размерности k ≪ числа пользователей и объектов. Скрытые факторы выучиваются из данных и часто соответствуют интерпретируемым свойствам (жанр, «серьёзность»)."}, {"q": "Почему классический SVD из линейной алгебры нельзя напрямую применить к матрице оценок?", "a": "Матрица оценок почти пуста, а классический SVD требует полной матрицы; заполнение пропусков нулями означает, что все непросмотренные фильмы оценены на 0. Поэтому «SVD» в рекомендациях (подход Funk SVD) минимизирует ошибку **только по известным оценкам** с регуляризацией через SGD или ALS."}, {"q": "Зачем в модель добавляют смещения пользователя и объекта?", "a": "r̂ᵤᵢ = μ + bᵤ + bᵢ + pᵤ·qᵢ: смещения учитывают, что одни пользователи в среднем ставят оценки выше, а некоторые фильмы в целом популярнее. Без них факторы тратят ёмкость на объяснение этих простых эффектов, и качество падает."}, {"q": "Что будет при слишком большом числе факторов k без регуляризации?", "a": "Модель переобучится: у пользователей с несколькими оценками эмбеддинги подгонятся под шум, и ошибка на тесте вырастет. Регуляризация λ(‖pᵤ‖² + ‖qᵢ‖²) и подбор k по валидации обязательны."}, {"q": "Чем SVD++ отличается от базовой матричной факторизации?", "a": "SVD++ дополнительно учитывает **неявную обратную связь**: профиль пользователя включает сумму векторов всех объектов, с которыми он взаимодействовал, независимо от оценки. Это улучшает предсказания для пользователей с малым числом явных оценок, но обучение медленнее."}], "matrix_factorization_svd_nmf_cheatsheet.html": [{"q": "Чем NMF отличается от SVD?", "a": "**NMF** требует, чтобы оба сомножителя были неотрицательными (W ≥ 0, H ≥ 0), и представляет данные как сумму «частей» без взаимного вычитания. **SVD** допускает любые знаки, даёт ортогональные факторы и оптимальное приближение ранга k по норме Фробениуса."}, {"q": "Почему факторы NMF обычно интерпретируемее факторов SVD?", "a": "Из-за неотрицательности каждый объект — аддитивная смесь компонент, и компоненты получаются разреженными «частями» (темы в текстах, части лица на изображениях). В SVD компоненты с разными знаками компенсируют друг друга, и смысл отдельного фактора неочевиден."}, {"q": "Почему результат NMF зависит от инициализации, а SVD — нет?", "a": "SVD имеет единственное (с точностью до знака при различных сингулярных числах) решение, вычисляемое детерминированно. Задача NMF невыпуклая, итеративные алгоритмы сходятся к локальному минимуму, поэтому фиксируют `random_state` или используют инициализацию `nndsvd`."}, {"q": "Когда NMF неприменима напрямую?", "a": "Когда в данных есть отрицательные значения — например, центрированные оценки или стандартизированные признаки. Тогда используют SVD/PCA или сдвигают данные, хотя сдвиг меняет интерпретацию; для рекомендаций с пропусками также нужна версия, учитывающая только известные элементы."}, {"q": "Как выбрать ранг k для факторизации?", "a": "Смотрят на ошибку реконструкции или ранжирующую метрику на валидации в зависимости от k и выбирают точку «локтя»; для SVD также помогает доля объяснённой энергии (сумма квадратов сингулярных чисел). Слишком большой k ведёт к переобучению и шумным факторам, слишком малый — к потере структуры."}], "mcmc_bayesian_inference_cheatsheet.html": [{"q": "Зачем нужен MCMC в байесовском выводе?", "a": "Posterior обычно известен только с точностью до константы (P(D) не считается). MCMC строит марковскую цепь, **стационарное распределение которой равно posterior**, и позволяет получать из него выборки без вычисления нормировки."}, {"q": "Почему в алгоритме Метрополиса–Гастингса не нужна нормировочная константа?", "a": "Вероятность принятия зависит от **отношения** p(θ′)/p(θ) (с поправкой на предложение), и константа P(D) в нём сокращается."}, {"q": "Что такое burn-in и почему первые выборки отбрасывают?", "a": "Цепь стартует из произвольной точки и некоторое время «добирается» до области высокой вероятности. Первые выборки не соответствуют стационарному распределению и смещают оценки, поэтому их отбрасывают."}, {"q": "Как понять, что цепи MCMC сошлись?", "a": "Запускают несколько цепей из разных стартов и смотрят **R̂ (Gelman–Rubin)** — он должен быть близок к 1 (обычно < 1.01–1.05), а также эффективный размер выборки (ESS) и trace plots, которые должны выглядеть как перемешанный «шум» без трендов."}, {"q": "Почему HMC/NUTS обычно эффективнее случайного блуждания Метрополиса?", "a": "Они используют **градиент** логарифма posterior и делают длинные согласованные шаги, поэтому автокорреляция выборок меньше, особенно в высоких размерностях. Случайное блуждание в высокой размерности либо делает крошечные шаги, либо почти всё отклоняет."}], "mds_cheatsheet.html": [{"q": "Какую задачу решает MDS?", "a": "По матрице попарных расстояний (или несходств) между объектами MDS ищет точки в низкоразмерном пространстве, расстояния между которыми как можно лучше совпадают с заданными. Исходные признаки не нужны — достаточно матрицы расстояний."}, {"q": "Чем классическое MDS отличается от метрического MDS со stress?", "a": "Классическое (Torgerson) MDS двойным центрированием переводит квадраты расстояний в матрицу скалярных произведений и берёт её главные собственные векторы; для евклидовых расстояний оно эквивалентно PCA. Метрическое MDS итеративно минимизирует функцию stress — сумму квадратов отклонений расстояний, например алгоритмом SMACOF (используется в sklearn)."}, {"q": "Что такое неметрическое MDS и когда его использовать?", "a": "Неметрическое MDS сохраняет только порядок расстояний (ранги), а не их величины. Оно подходит, когда несходства имеют лишь порядковый смысл — например, субъективные оценки похожести объектов."}, {"q": "Как интерпретировать значение stress?", "a": "Stress показывает, насколько плохо расстояния во вложении соответствуют исходным: чем ниже, тем лучше. По эмпирическому правилу Краскала для нормированного stress значение около 0.05 считается хорошим, а около 0.2 и выше — плохим."}, {"q": "Почему MDS плохо масштабируется?", "a": "Нужна полная матрица расстояний n×n — O(n²) памяти, а SMACOF требует O(n²) операций на каждой итерации. Кроме того, итеративная оптимизация может застревать в локальных минимумах, поэтому делают несколько запусков (`n_init`)."}], "mean_shift_cheatsheet.html": [{"q": "В чём идея алгоритма mean shift?", "a": "Каждая точка (или «окно») итеративно сдвигается к среднему точек в своей окрестности, то есть поднимается по градиенту ядерной оценки плотности к её локальному максимуму (моде). Точки, сошедшиеся к одной моде, образуют кластер."}, {"q": "Как bandwidth влияет на результат?", "a": "Bandwidth — единственный ключевой параметр, и он неявно задаёт число кластеров. Маленький bandwidth даёт много мелких кластеров (каждый локальный пик плотности), большой — сливает их, вплоть до одного кластера. В sklearn его можно оценить функцией `estimate_bandwidth`."}, {"q": "Какие преимущества у mean shift?", "a": "Не нужно задавать число кластеров, кластеры могут иметь произвольную форму (это области притяжения мод плотности), и алгоритм не зависит от случайной инициализации центров."}, {"q": "Почему mean shift плохо масштабируется?", "a": "На каждой итерации для каждой точки нужно искать соседей в окне, что даёт порядка O(n²) на итерацию. Кроме того, ядерная оценка плотности плохо работает в высокой размерности. Ускоряют с помощью bin seeding (`bin_seeding=True`) и ограничения числа стартовых точек."}, {"q": "Что будет, если кластеры имеют разную плотность и масштаб?", "a": "Единый bandwidth не подходит всем сразу: широкие разреженные кластеры могут распасться на несколько мод или слиться с соседями, а узкие плотные — объединиться. В этом mean shift похож на DBSCAN с фиксированным ε."}], "memory_networks_cheatsheet.html": [{"q": "Какую проблему решают memory networks по сравнению с RNN?", "a": "RNN хранит всё в скрытом векторе фиксированного размера, и информация о дальних фактах теряется. Memory networks имеют явную внешнюю память, к которой модель обращается по содержимому, что помогает в задачах вопрос-ответ по множеству фактов."}, {"q": "Как в end-to-end memory network происходит чтение из памяти?", "a": "Запрос u сравнивается с ключами памяти mᵢ, веса внимания pᵢ = softmax(uᵀmᵢ), а результат — взвешенная сумма значений o = ∑ pᵢcᵢ. Мягкое внимание делает чтение дифференцируемым, и модель обучается без разметки нужных фактов."}, {"q": "Зачем делать несколько «хопов» (hops) обращения к памяти?", "a": "Для вопросов, требующих цепочки рассуждений: первый хоп находит один факт, обновлённый запрос позволяет найти следующий связанный факт. Например, «где мяч?» → «Джон взял мяч» → «Джон пошёл на кухню»."}, {"q": "Чем исходные Memory Networks (Weston et al.) отличались от End-to-End Memory Networks?", "a": "Исходная версия использовала жёсткий выбор памяти (argmax) и требовала разметки поддерживающих фактов. End-to-End версия (Sukhbaatar et al.) заменила это мягким вниманием и обучается только по парам вопрос–ответ."}, {"q": "Как memory networks связаны с современными трансформерами и RAG?", "a": "Внимание по ключам и значениям — та же идея адресации памяти по содержимому, а трансформер можно рассматривать как многократное чтение из памяти токенов. **RAG** расширяет это до внешней базы документов, найденных ретривером."}], "message_passing_networks_cheatsheet.html": [{"q": "Из каких шагов состоит один слой message passing?", "a": "**Message**: для каждого ребра вычисляется сообщение mᵢⱼ = φ(hᵢ, hⱼ, eᵢⱼ). **Aggregate**: сообщения от соседей объединяются перестановочно-инвариантной функцией (сумма, среднее, максимум). **Update**: новое состояние hᵢ' = γ(hᵢ, агрегат). GCN, GAT и GraphSAGE — частные случаи этой схемы."}, {"q": "Почему функция агрегации должна быть инвариантна к перестановкам?", "a": "У соседей вершины нет естественного порядка, и **перенумерация** вершин не должна менять результат. Поэтому используют сумму, среднее или максимум, а не, например, конкатенацию или RNN по произвольному порядку соседей."}, {"q": "Чем агрегация суммой отличается от среднего и максимума по выразительности?", "a": "**Сумма** различает мультимножества соседей разного размера (например, {1, 1} и {1}), а среднее и максимум — нет. Поэтому GIN использует сумму с MLP и достигает выразительности теста Вейсфейлера–Лемана; среднее полезно, когда важно распределение, а не количество соседей."}, {"q": "Какое фундаментальное ограничение выразительности у стандартных MPNN?", "a": "Они не мощнее **1-WL теста** изоморфизма графов: например, не отличают два треугольника от шестиугольника при одинаковых признаках вершин и не умеют считать циклы. Обойти это помогают признаки структуры (позиционные кодировки, подсчёт подграфов) и higher-order GNN."}, {"q": "Что такое over-squashing?", "a": "Информация от экспоненциально растущего числа вершин в далёкой окрестности должна пройти через **узкие места** графа и сжаться в вектор фиксированного размера. В итоге дальние зависимости теряются; помогают перестройка графа (rewiring), виртуальные вершины и графовые трансформеры с глобальным вниманием."}], "meta_features_learning_cheatsheet.html": [{"q": "Зачем вычислять meta-features датасета?", "a": "Они описывают задачу (размер, число признаков, дисбаланс, энтропия, корреляции) и позволяют предсказать, какой алгоритм или гиперпараметры подойдут, по опыту на похожих датасетах. Это ускоряет AutoML за счёт хорошего старта (warm-start)."}, {"q": "Что такое landmarkers?", "a": "Качество быстрых простых моделей (наивный Байес, 1-NN, дерево-пень) на датасете, используемое как признаки. Они дёшево характеризуют сложность задачи и часто информативнее чисто статистических meta-features."}, {"q": "Какая ловушка при сравнении meta-features разных датасетов?", "a": "Многие признаки зависят от масштаба (число строк, признаков) и имеют несопоставимые диапазоны. Их нужно нормировать или логарифмировать, иначе поиск «похожих» датасетов определяется одним крупным признаком."}, {"q": "Как Auto-sklearn использует meta-learning?", "a": "Для нового датасета вычисляются meta-features, находятся ближайшие датасеты из базы, и их лучшие конфигурации используются как стартовые точки байесовской оптимизации. Это даёт хорошие решения уже в первые минуты."}, {"q": "Почему meta-learning по meta-features может ошибаться на новом датасете?", "a": "База прошлых датасетов ограничена, и если новая задача не похожа ни на одну из них, рекомендации неинформативны. Кроме того, meta-features грубо описывают данные и не отражают, например, важность отдельных признаков."}], "meta_learning_maml_cheatsheet.html": [{"q": "В чём идея meta-learning («learning to learn»)?", "a": "Модель обучается на **множестве задач**, чтобы быстро адаптироваться к новой задаче по нескольким примерам. Обучающая единица — не отдельный пример, а эпизод: support set для адаптации и query set для оценки."}, {"q": "Как устроены внутренний и внешний циклы MAML?", "a": "**Внутренний** цикл: для каждой задачи из общих параметров θ делается несколько шагов градиентного спуска на support set, получаются θ'ᵢ. **Внешний** цикл: θ обновляется по loss на query set, посчитанному с адаптированными θ'ᵢ, то есть ищется инициализация, из которой несколько шагов дают хороший результат."}, {"q": "Почему полный MAML дорог и что такое FOMAML?", "a": "Градиент внешнего цикла проходит через шаги внутреннего, что требует **вторых производных** (произведения гессиана на вектор) и хранения всего графа адаптации. First-order MAML игнорирует вторые производные и использует градиент в точке θ'; Reptile упрощает ещё сильнее. Качество при этом часто почти не падает."}, {"q": "Чем optimization-based мета-обучение (MAML) отличается от metric-based (Prototypical Networks)?", "a": "MAML **адаптирует веса** под новую задачу градиентными шагами и не зависит от архитектуры, поэтому подходит и для регрессии, и для RL. ProtoNets не дообучаются на новой задаче — они сравнивают эмбеддинги с прототипами классов, что быстрее и стабильнее, но рассчитано на классификацию."}, {"q": "Какая ошибка в протоколе оценки мета-обучения встречается чаще всего?", "a": "Пересечение **классов** между meta-train и meta-test (например, разные изображения тех же классов). В few-shot тестовые классы должны быть новыми, иначе измеряется обычная классификация. Также результат нужно усреднять по сотням или тысячам эпизодов и приводить доверительный интервал."}], "metric_based_learning_siamese_cheatsheet.html": [{"q": "Почему metric learning позволяет распознавать новые классы без переобучения?", "a": "Модель учит не границы конкретных классов, а функцию сходства в пространстве эмбеддингов. Новый класс достаточно представить несколькими примерами и сравнивать с ними по расстоянию."}, {"q": "Как работает contrastive loss для сиамской сети и зачем нужен margin?", "a": "Для похожей пары штрафуется d², для разной — max(margin − d, 0)². Margin означает, что разные пары нужно отодвинуть лишь на заданное расстояние: дальше отталкивать бессмысленно, и это не даёт эмбеддингам бесконечно разлетаться."}, {"q": "Чем triplet loss отличается от contrastive и в чём главная практическая трудность?", "a": "Triplet loss сравнивает относительно: d(a, p) + margin ≤ d(a, n) для якоря, позитива и негатива. Главная трудность — **майнинг** триплетов: большинство случайных триплетов слишком лёгкие и дают нулевой loss, поэтому подбирают hard или semi-hard негативы."}, {"q": "Как Matching Networks классифицируют query-пример?", "a": "Предсказание — взвешенная сумма меток support-примеров, где веса — softmax от косинусного сходства эмбеддингов (по сути attention-вариант kNN). Используется эпизодическое обучение, совпадающее по формату с тестовыми задачами."}, {"q": "Чем Prototypical Networks проще Matching Networks?", "a": "Каждый класс представляется одним **прототипом** — средним эмбеддингом его support-примеров, а query относится к ближайшему прототипу (обычно по квадрату евклидова расстояния). Это проще и часто работает не хуже."}], "metric_learning_cheatsheet.html": [{"q": "Как устроен triplet loss и что делает margin?", "a": "Для тройки (anchor, positive, negative) минимизируется max(0, d(a, p) − d(a, n) + m). Loss равен нулю, когда негатив дальше позитива **хотя бы на margin m**; без margin модель могла бы просто сжать всё в точку."}, {"q": "Почему важен майнинг триплетов?", "a": "Большинство случайных троек уже удовлетворяют условию с запасом и дают нулевой градиент — обучение стоит на месте. Выбирают **semi-hard** или hard негативы внутри батча; самые трудные негативы на старте могут дестабилизировать обучение или оказаться ошибками разметки."}, {"q": "В чём идея ArcFace?", "a": "Это модификация softmax: эмбеддинги и веса классов нормализуются на гиперсфере, логит — s·cos θ, а для правильного класса к углу добавляется **аддитивный угловой margin**: s·cos(θ + m). Это заставляет классы быть компактными и далеко разнесёнными по углу; типичные значения s ≈ 64, m ≈ 0.5."}, {"q": "Чем подходы на основе классификации (ArcFace) удобнее pair/triplet-based?", "a": "Не нужен майнинг пар и триплетов: каждый пример сравнивается сразу со всеми центрами классов через веса последнего слоя, что даёт стабильное обучение. Но число классов должно быть известно и конечно при обучении, а на инференсе используются только эмбеддинги, и новые классы распознаются по сходству."}, {"q": "Почему для face verification нельзя обучить обычный классификатор и использовать его softmax?", "a": "На инференсе появляются **новые люди**, которых не было при обучении, поэтому фиксированный набор классов не подходит. Нужно пространство эмбеддингов, в котором близость означает «тот же человек», и порог на расстояние для верификации — это и даёт metric learning."}], "metrics_visualization_cheatsheet.html": [{"q": "Почему матрицу ошибок полезно нормировать по строкам?", "a": "При дисбалансе абсолютные числа на редких классах малы и незаметны. Нормировка по строкам (по истинному классу) показывает **recall** каждого класса и какие классы с какими путаются."}, {"q": "Что показывает калибровочная кривая (reliability diagram)?", "a": "Средняя предсказанная вероятность в бине против реальной доли положительных. Идеальная модель лежит на диагонали; кривая ниже диагонали — переуверенность, выше — недоуверенность. Строится через `calibration_curve`."}, {"q": "Когда смотреть на PR-кривую вместо ROC-кривой?", "a": "При сильном дисбалансе и когда важно качество на положительном классе: ROC может выглядеть отлично за счёт огромного числа правильно отвергнутых отрицательных, а PR-кривая показывает реальную точность находок."}, {"q": "Почему для сравнения моделей лучше boxplot метрик по фолдам, чем одно число?", "a": "Одно среднее скрывает разброс. Если распределения метрик двух моделей по фолдам сильно перекрываются, разница может быть случайной. Boxplot показывает и уровень, и стабильность."}, {"q": "Как график precision и recall от порога помогает выбрать порог?", "a": "Он показывает, как обе метрики меняются при сдвиге порога, и позволяет выбрать точку под требование («recall не ниже 0.9») вместо стандартного 0.5. Порог подбирают на валидации, а не на тесте."}], "mixed_precision_training_cheatsheet.html": [{"q": "Что даёт обучение в смешанной точности?", "a": "Большая часть вычислений выполняется в FP16 или BF16, что **ускоряет** матричные операции на Tensor Cores и уменьшает потребление памяти под активации, позволяя увеличить батч. Критичные операции и мастер-копия весов остаются в FP32."}, {"q": "Зачем нужен loss scaling при FP16?", "a": "Минимальное положительное число в FP16 около 6·10⁻⁸ (субнормальное), и маленькие градиенты **обнуляются** (underflow). Loss умножают на масштаб (например, 2¹⁶), градиенты пропорционально вырастают, а перед шагом оптимизатора их делят обратно. Динамический скейлер уменьшает масштаб при появлении inf/NaN и пропускает такой шаг."}, {"q": "Почему BF16 обычно не требует loss scaling?", "a": "BF16 имеет **8 бит экспоненты, как FP32**, и тот же диапазон значений, но всего 7 бит мантиссы. Underflow градиентов практически не возникает, хотя точность представления ниже, чем у FP16; поддерживается на GPU начиная с архитектуры Ampere и на TPU."}, {"q": "Зачем хранить мастер-копию весов в FP32?", "a": "Обновление lr·g часто намного меньше самого веса, и при сложении в FP16 (около 3 значащих десятичных цифр) оно просто **теряется при округлении**. Накопление обновлений в FP32 сохраняет их, а для прямого и обратного прохода используется копия весов в низкой точности."}, {"q": "Какие операции обычно оставляют в FP32 и как это делается в PyTorch?", "a": "Операции, чувствительные к точности и диапазону: softmax, нормализации, функции потерь, большие суммы и редукции. В PyTorch `torch.autocast` автоматически выбирает точность для каждой операции, а `torch.cuda.amp.GradScaler` (в новых версиях `torch.amp.GradScaler`) делает динамический loss scaling."}], "ml_pipelines_cheatsheet.html": [{"q": "Какие проблемы решает `Pipeline` в scikit-learn?", "a": "Объединяет предобработку и модель в один объект: исключает утечки данных при кросс-валидации, гарантирует одинаковую обработку при обучении и прогнозе, упрощает сериализацию и подбор гиперпараметров всех шагов сразу."}, {"q": "Как задать гиперпараметр шага пайплайна в `GridSearchCV`?", "a": "Через имя шага и двойное подчёркивание: `{'model__C': [0.1, 1, 10], 'scaler__with_mean': [True, False]}`."}, {"q": "Как написать свой шаг для пайплайна?", "a": "Создать класс-наследник `BaseEstimator` и `TransformerMixin` с методами `fit(X, y=None)` (возвращает self) и `transform(X)`. Для простых случаев подойдёт `FunctionTransformer`."}, {"q": "Чем пайплайн обучения модели отличается от «пайплайна» в смысле оркестрации (Airflow, Kubeflow)?", "a": "sklearn `Pipeline` — цепочка преобразований внутри одной модели. Оркестраторы управляют всем процессом: загрузка и проверка данных, генерация признаков, обучение, оценка, регистрация и развёртывание модели — по расписанию и с зависимостями между задачами."}, {"q": "Почему шаги пайплайна данных стоит делать идемпотентными?", "a": "Повторный запуск шага с теми же входами должен давать тот же результат без побочных эффектов (дублей, повторных записей). Тогда упавший шаг можно безопасно перезапустить."}], "mlops_best_practices_cheatsheet.html": [{"q": "Что такое MLOps и чем он отличается от обычного DevOps?", "a": "Практики автоматизации и надёжной эксплуатации ML-систем на всём жизненном цикле. Кроме кода, здесь меняются данные и модели: нужны версионирование данных, отслеживание экспериментов, переобучение, мониторинг дрейфа и качества."}, {"q": "Зачем нужен трекинг экспериментов (MLflow, Weights & Biases)?", "a": "Чтобы для каждого запуска сохранять параметры, метрики, версию кода и данных, артефакты модели. Это позволяет сравнивать эксперименты, воспроизводить лучший результат и понимать, что сработало."}, {"q": "Что такое model registry?", "a": "Хранилище версий моделей с метаданными и стадиями жизненного цикла (staging, production, archived). Через него управляют продвижением моделей и откатом."}, {"q": "Когда и как переобучать модель?", "a": "По расписанию, по сигналу мониторинга (дрейф данных, падение метрик) или при появлении новых размеченных данных. Переобучение должно быть автоматизированным пайплайном с проверкой качества новой модели перед заменой старой."}, {"q": "Что такое shadow deployment и canary release?", "a": "Shadow — новая модель получает реальный трафик и делает прогнозы параллельно, но они не используются: сравнивают поведение без риска. Canary — новую модель включают для небольшой доли пользователей и постепенно расширяют, если метрики в порядке."}], "mlp_cheatsheet.html": [{"q": "Из чего состоит MLP?", "a": "Входной слой, один или несколько скрытых полносвязных слоёв с нелинейной активацией и выходной слой. Каждый нейрон слоя связан со всеми нейронами предыдущего слоя."}, {"q": "Почему без нелинейных активаций многослойная сеть бесполезна?", "a": "Композиция линейных преобразований — тоже линейное преобразование: W₂(W₁x) = (W₂W₁)x. Сколько слоёв ни добавляй, сеть останется эквивалентна одному линейному слою."}, {"q": "Что утверждает теорема об универсальной аппроксимации и чего она НЕ обещает?", "a": "MLP с одним достаточно широким скрытым слоем и нелинейной активацией может сколь угодно точно приблизить любую непрерывную функцию на компакте. Но теорема не говорит, сколько нейронов нужно, и не гарантирует, что градиентный спуск найдёт такие веса."}, {"q": "Сколько параметров у полносвязного слоя со 100 входами и 50 выходами?", "a": "100 · 50 весов + 50 смещений = 5050 параметров."}, {"q": "Какую активацию и функцию потерь ставят на выход MLP для разных задач?", "a": "Регрессия — линейный выход и MSE; бинарная классификация — один нейрон с сигмоидой и бинарная кросс-энтропия; многоклассовая — softmax по классам и кросс-энтропия."}], "mlp_tabular_data_cheatsheet.html": [{"q": "Почему MLP на табличных данных особенно чувствителен к масштабированию признаков, а бустинг — нет?", "a": "Градиентный спуск и инициализация весов предполагают признаки сопоставимого масштаба: признак в миллионах доминирует и замедляет обучение. Деревья делят по порогам и инвариантны к монотонным преобразованиям, поэтому для MLP нужны **StandardScaler** или **QuantileTransformer**, а для бустинга — нет."}, {"q": "Как лучше подавать в MLP категориальные признаки с высокой кардинальностью?", "a": "One-hot для тысяч категорий даёт огромные разреженные входы и переобучение. Обычно используют **эмбеддинги**: каждой категории сопоставляется обучаемый вектор небольшой размерности, редкие категории объединяют в «прочее»."}, {"q": "Какие приёмы регуляризации делают MLP конкурентоспособным на таблицах?", "a": "Dropout, weight decay, batch normalization, ранняя остановка по валидации и тщательный подбор гиперпараметров. Исследования показывают, что хорошо отрегулированный MLP (и ResNet-подобный MLP) часто близок к бустингу, хотя по умолчанию обычно уступает."}, {"q": "Почему MLP хуже деревьев справляется с «нерелевантными» и неоднородными признаками?", "a": "Полносвязный слой смешивает все признаки, и шумовые признаки мешают обучению; кроме того, MLP склонен к гладким функциям, а целевые функции на таблицах часто кусочно-постоянные и нерегулярные. Деревья же естественно игнорируют неинформативные признаки и строят ступенчатые зависимости."}, {"q": "Когда стоит выбрать MLP вместо бустинга для табличной задачи?", "a": "Когда данных очень много, нужна совместная обработка таблицы с текстом или изображениями, требуется end-to-end обучение эмбеддингов или онлайн-дообучение. Также MLP полезен как разнородный член ансамбля вместе с бустингом."}], "model_calibration_cheatsheet.html": [{"q": "Что значит, что модель хорошо откалибрована?", "a": "Среди объектов, которым модель дала вероятность около p, доля положительных действительно примерно равна p. Например, из 100 объектов с прогнозом 0.8 примерно 80 должны оказаться положительными."}, {"q": "Почему высокая ROC-AUC не гарантирует хорошую калибровку?", "a": "ROC-AUC зависит только от порядка (ранжирования) прогнозов. Любое монотонное преобразование вероятностей (например, возведение в квадрат) сохраняет AUC, но полностью меняет калибровку."}, {"q": "Чем отличаются Platt scaling и изотоническая регрессия?", "a": "Platt scaling подгоняет сигмоиду к выходам модели — всего 2 параметра, работает на небольших данных, но предполагает сигмоидальную форму искажения. Изотоническая регрессия строит произвольную монотонную ступенчатую функцию — гибче, но склонна к переобучению на малых выборках (обычно нужно хотя бы около тысячи объектов)."}, {"q": "Почему калибровать модель нужно на отдельных данных?", "a": "На обучающих данных прогнозы переоптимистичны, и калибратор выучит неверную поправку. Используют отдельную калибровочную выборку или кросс-валидацию — так делает `CalibratedClassifierCV` в sklearn."}, {"q": "Как проверить калибровку?", "a": "Построить reliability diagram (калибровочную кривую, `calibration_curve`): разбить прогнозы на бины и сравнить среднюю предсказанную вероятность с фактической долей положительных — идеал на диагонали. Численно — Brier score, log loss или ECE (expected calibration error)."}], "model_compression_cheatsheet.html": [{"q": "Во сколько раз уменьшится модель из 100 млн параметров при переходе с FP32 на INT8?", "a": "FP32 занимает 4 байта на вес, INT8 — 1 байт: 100 млн × 4 Б = 400 МБ против 100 МБ, то есть в **4 раза** (без учёта небольших накладных расходов на масштабы квантизации)."}, {"q": "Чем post-training quantization отличается от quantization-aware training?", "a": "**PTQ** квантизует уже обученную модель, используя небольшую калибровочную выборку для подбора масштабов — быстро, но на низкой разрядности возможна заметная потеря точности. **QAT** имитирует квантизацию при обучении (fake quantization со straight-through estimator), и модель адаптируется к ошибкам округления — дороже, но точнее."}, {"q": "Почему неструктурированный прунинг часто не ускоряет инференс?", "a": "Обнуление отдельных весов даёт **разреженные** матрицы, но обычное GPU/CPU-железо оптимизировано под плотные операции, и без специальных ядер и форматов скорость не растёт — экономится только память при сжатом хранении. **Структурированный** прунинг удаляет целые каналы, головы или слои и даёт реальное ускорение."}, {"q": "Почему в knowledge distillation ученика учат на «мягких» вероятностях учителя с температурой?", "a": "Softmax с температурой T > 1 делает распределение учителя более гладким, и ученик видит **«тёмное знание»** — какие неправильные классы учитель считает похожими (кошка ближе к собаке, чем к машине). Это информативнее one-hot меток; loss обычно комбинируют с обычной кросс-энтропией и умножают KL-часть на T²."}, {"q": "Почему после прунинга модель обычно дообучают и почему лучше прунить итеративно?", "a": "Удаление весов сразу ухудшает качество, и дообучение (**fine-tuning**) позволяет оставшимся весам скомпенсировать потерю. Итеративный подход (убрать немного — дообучить — повторить) сохраняет точность при гораздо большей степени разреженности, чем удаление сразу большой доли весов."}], "model_deployment_cheatsheet.html": [{"q": "Когда выбирать batch-инференс, а когда онлайн (real-time)?", "a": "**Batch** — когда прогноз нужен по расписанию для многих объектов (ночной скоринг, рекомендации на день): дешевле и проще. **Онлайн** — когда решение нужно за миллисекунды по свежим данным (антифрод, поиск), но требуются низкая задержка и высокая доступность."}, {"q": "Что такое training-serving skew и как его избежать?", "a": "Расхождение между тем, как признаки считаются при обучении и в продакшене (разный код, разные источники, другая предобработка). Избегают единым пайплайном признаков (**feature store**), сериализацией препроцессинга вместе с моделью и проверкой распределений."}, {"q": "Чем canary-развёртывание отличается от shadow-режима?", "a": "В **shadow** новая модель получает копию трафика, но её ответы не отдаются пользователю — сравнивают без риска. В **canary** новая модель реально обслуживает небольшую долю пользователей, и при проблемах её откатывают."}, {"q": "Почему важно версионировать не только модель, но и данные и код?", "a": "Без этого невозможно воспроизвести модель, понять причину деградации и откатиться к рабочей версии. Используют реестр моделей, версионирование данных (например, **DVC**) и фиксацию зависимостей."}, {"q": "Что будет, если сервис модели держит p50 задержки 20 мс, а p99 — 2 с?", "a": "Средний пользователь доволен, но каждый сотый запрос очень медленный, а при цепочке из многих вызовов хвосты складываются и деградация становится заметной. Поэтому SLA ставят по **перцентилям** (p95/p99), а не по среднему."}], "model_monitoring_cheatsheet.html": [{"q": "Чем data drift отличается от concept drift?", "a": "**Data drift** — меняется распределение входов P(X) (например, пришли новые типы клиентов). **Concept drift** — меняется зависимость P(y|X): те же признаки теперь означают другое (мошенники сменили тактику). Concept drift опаснее и обнаруживается в основном по метрикам на метках."}, {"q": "Как мониторить модель, если истинные метки приходят с задержкой в несколько месяцев?", "a": "Использовать прокси-сигналы: дрейф входных признаков (PSI, KS-тест), дрейф распределения предсказаний, долю пропусков и аномалий, бизнес-метрики. Когда метки приходят, считать реальное качество по когортам."}, {"q": "Как интерпретируют Population Stability Index (PSI)?", "a": "PSI = ∑ (pᵢ − qᵢ)·ln(pᵢ/qᵢ) по бинам признака. По распространённому эмпирическому правилу: меньше 0.1 — изменений нет, 0.1–0.25 — умеренный сдвиг, больше 0.25 — значительный, стоит разбираться."}, {"q": "Почему статистический тест на дрейф на миллионах наблюдений почти всегда показывает «дрейф»?", "a": "При огромной выборке даже ничтожные, практически неважные отличия становятся статистически значимыми (p-value → 0). Поэтому смотрят на **величину эффекта** (PSI, расстояние Вассерштейна) и пороги, привязанные к влиянию на качество."}, {"q": "Обязательно ли дрейф признаков означает, что модель надо переобучать?", "a": "Нет: если сдвинулся неважный признак или модель хорошо экстраполирует, качество может не измениться. Решение о переобучении принимают с учётом важности признака и реального падения метрик, иначе получится много ложных тревог."}], "model_monitoring_ab_testing_cheatsheet.html": [{"q": "Что нужно мониторить у модели в продакшене?", "a": "Технические показатели (задержка, ошибки, нагрузка), качество входных данных (пропуски, диапазоны, схема), дрейф распределений признаков и прогнозов, качество модели, когда приходят истинные метки, и бизнес-метрики."}, {"q": "Как следить за качеством, если истинные метки приходят с большой задержкой?", "a": "Использовать косвенные сигналы: дрейф входных признаков и распределения прогнозов, уверенность модели, сравнение с бейзлайном; размечать небольшую выборку вручную. Когда метки придут — считать реальные метрики задним числом."}, {"q": "Как устроен A/B-тест новой модели?", "a": "Пользователей случайно делят на группы: контроль (старая модель) и тест (новая). Заранее выбирают целевую метрику, минимальный значимый эффект и размер выборки, после окончания проверяют статистическую значимость разницы."}, {"q": "Почему нельзя останавливать A/B-тест, как только разница стала значимой?", "a": "Многократные «подглядывания» сильно повышают вероятность ложного срабатывания. Длительность теста фиксируют заранее или используют методы последовательного тестирования с поправками."}, {"q": "Чем многорукие бандиты отличаются от A/B-теста?", "a": "A/B-тест держит фиксированное разделение трафика до конца и даёт чистую статистическую оценку. Бандиты по ходу направляют больше трафика лучшему варианту — меньше потерь во время эксперимента, но сложнее строгий статистический вывод."}], "model_registries_cheatsheet.html": [{"q": "Зачем нужен реестр моделей, если можно хранить файлы моделей в хранилище?", "a": "Реестр хранит не только артефакт, но и **версию, метрики, параметры, ссылку на код и данные, стадию жизненного цикла** (staging, production, archived) и историю изменений. Это даёт воспроизводимость, аудит и понятный откат."}, {"q": "Чем отличается трекинг экспериментов от реестра моделей?", "a": "Трекинг (например, runs в MLflow) логирует все попытки обучения с параметрами и метриками. Реестр содержит только **отобранные модели**, которые кандидаты на деплой, с версионированием и управлением стадиями."}, {"q": "Как реестр помогает при откате модели в продакшене?", "a": "Все предыдущие версии хранятся с метаданными, и сервис можно переключить на предыдущую версию (например, перенести алиас «production» на старую) без переобучения и поиска нужного файла."}, {"q": "Какие метаданные важно сохранять вместе с моделью?", "a": "Версию данных и кода (хеш коммита), гиперпараметры, метрики на валидации, сигнатуру входов и выходов, зависимости (версии библиотек), автора и дату. Без версий библиотек модель может не загрузиться или вести себя иначе."}, {"q": "Почему переход модели в production стоит делать через проверки, а не вручную?", "a": "Автоматические шлюзы (сравнение метрик с текущей моделью, тесты на схему входов, проверка на fairness и задержку) исключают выкатку случайно худшей модели. Решение и его основание фиксируются в реестре для аудита."}], "model_serialization_cheatsheet.html": [{"q": "Чем опасна загрузка модели из pickle/joblib-файла из недоверенного источника?", "a": "При распаковке pickle может выполнить произвольный код. Загружать такие файлы можно только из доверенных источников; для обмена весами нейросетей безопаснее формат safetensors."}, {"q": "Почему вместе с моделью нужно сохранять предобработку?", "a": "Новые данные должны проходить те же преобразования с теми же параметрами (средние скейлера, словарь кодировщика). Проще всего сериализовать весь sklearn `Pipeline` целиком."}, {"q": "Почему модель, сохранённая через joblib, может не загрузиться после обновления библиотек?", "a": "Pickle хранит ссылки на классы и их внутреннюю структуру конкретной версии библиотеки. При смене версии sklearn или Python структура может измениться. Поэтому фиксируют версии окружения рядом с моделью."}, {"q": "Чем в PyTorch сохранение `state_dict` лучше сохранения всей модели?", "a": "`torch.save(model.state_dict(), path)` хранит только тензоры весов; класс модели создаётся кодом, и веса загружаются в него. Сохранение объекта целиком через pickle жёстко привязано к структуре кода и путям модулей и ломается при рефакторинге."}, {"q": "Зачем нужен ONNX?", "a": "Открытый формат представления моделей, независимый от фреймворка. Позволяет обучить модель в PyTorch или sklearn и запускать её в ONNX Runtime на другом языке или устройстве, часто с ускорением инференса."}], "modern_trends_deep_learning_cheatsheet.html": [{"q": "Чем foundation model отличается от модели под конкретную задачу?", "a": "Её предобучают на огромных разнородных данных (часто self-supervised), а затем адаптируют к множеству downstream-задач через fine-tuning или промптинг. Одна база заменяет много узких моделей."}, {"q": "Что такое in-context learning и чем он отличается от fine-tuning?", "a": "Модель решает новую задачу по примерам **в промпте**, без изменения весов. При fine-tuning веса обновляются градиентным спуском; ICL дешевле и гибче, но ограничен длиной контекста и менее стабилен."}, {"q": "Зачем нужны parameter-efficient методы вроде LoRA?", "a": "Полное дообучение огромной модели дорого по памяти и хранению. LoRA замораживает веса и обучает низкоранговые добавки ΔW = B·A, то есть доли процента параметров, с качеством, близким к полному fine-tuning."}, {"q": "Как CLIP связывает изображения и текст?", "a": "Два энкодера обучаются **контрастивно** на парах «картинка — подпись»: эмбеддинги соответствующих пар сближаются, несоответствующих — расходятся. Это даёт zero-shot классификацию через сравнение с текстовыми описаниями классов."}, {"q": "Что такое Mixture of Experts и почему он популярен в больших моделях?", "a": "Слой содержит много «экспертов», а роутер активирует лишь несколько для каждого токена. Общее число параметров растёт, а вычисления на токен — почти нет; сложности — балансировка нагрузки экспертов и требования к памяти."}], "monotonic_constraints_cheatsheet.html": [{"q": "Зачем накладывать монотонное ограничение, если модель и так хорошо предсказывает?", "a": "Чтобы прогноз соответствовал предметной логике (выше доход — не выше риск дефолта при прочих равных) и не давал абсурдных скачков в зонах с малым числом данных. Это повышает доверие, интерпретируемость и устойчивость при сдвиге данных, а также часто требуется регуляторами."}, {"q": "Как задать монотонность в градиентном бустинге?", "a": "В XGBoost и LightGBM параметром `monotone_constraints` — вектор из 1 (возрастание), −1 (убывание), 0 (без ограничения) по каждому признаку; в sklearn `HistGradientBoostingRegressor` есть аналогичный параметр `monotonic_cst`. При построении дерева отбрасываются разбиения, нарушающие порядок значений в листьях."}, {"q": "Монотонность по признаку означает «при прочих равных» или в данных?", "a": "При прочих равных: f(x₁, …, xⱼ + δ, …) ≥ f(x) для δ > 0 при фиксированных остальных признаках. В сырых данных зависимость может выглядеть немонотонной из-за корреляции с другими признаками — это не противоречие."}, {"q": "Что будет, если навязать монотонность признаку, у которого реальная зависимость U-образная?", "a": "Модель будет вынуждена аппроксимировать её монотонной функцией (обычно «полкой» на одной из ветвей), и качество упадёт. Перед наложением ограничения стоит проверить зависимость через PDP/ICE и доменные знания."}, {"q": "Как проверить, что обученная модель действительно монотонна?", "a": "Построить ICE-кривые для многих объектов, варьируя один признак при фиксированных остальных: все кривые должны быть неубывающими (или невозрастающими). Для бустинга с ограничением это гарантировано конструкцией, для постобработки или нейросетей — нужно проверять."}], "monte_carlo_methods_cheatsheet.html": [{"q": "Чем Монте-Карло отличается от TD в оценке ценности?", "a": "MC обновляет оценку по **полному фактическому возврату** Gₜ после конца эпизода, без бутстрэппинга. TD обновляет сразу после шага, используя текущую оценку следующего состояния."}, {"q": "Почему MC-оценки несмещённые, но с высокой дисперсией?", "a": "Gₜ — честная выборка ожидаемого возврата, поэтому смещения нет. Но он суммирует много случайных наград и переходов за весь эпизод, поэтому сильно колеблется от эпизода к эпизоду."}, {"q": "Чем first-visit MC отличается от every-visit MC?", "a": "First-visit усредняет возвраты только с первого посещения состояния в эпизоде, every-visit — со всех посещений. Оба сходятся к V^π; first-visit даёт независимые выборки, every-visit использует данные плотнее, но слегка смещён на конечной выборке."}, {"q": "Когда MC неприменим?", "a": "В непрерывных задачах без завершения эпизода: возврат нельзя вычислить, пока эпизод не кончился. Также MC медленно учится при очень длинных эпизодах."}, {"q": "Зачем в off-policy MC используется importance sampling и в чём его проблема?", "a": "Чтобы оценивать целевую политику π по данным поведенческой политики b, возвраты взвешивают на ∏ π(a|s)/b(a|s). Произведение отношений по длинной траектории даёт огромную дисперсию; взвешенный importance sampling снижает её ценой смещения."}], "moving_average_methods_cheatsheet.html": [{"q": "Почему простое скользящее среднее (SMA) запаздывает за трендом?", "a": "Оно усредняет последние k точек с равными весами, поэтому «центр тяжести» окна отстаёт на (k − 1)/2 шагов. Чем длиннее окно, тем сильнее сглаживание и тем позже реакция на смену тренда."}, {"q": "Чем экспоненциальное скользящее среднее (EMA) отличается от SMA?", "a": "EMA даёт экспоненциально убывающие веса прошлым наблюдениям: sₜ = α·xₜ + (1 − α)·sₜ₋₁. Она быстрее реагирует на свежие изменения и не требует хранить окно; при α = 2/(k + 1) её среднее запаздывание совпадает с SMA окна k."}, {"q": "Какая утечка данных возможна при расчёте скользящего среднего как признака?", "a": "Использование **центрированного** окна (`center=True`) или окна, включающего текущее значение целевой переменной: признак «видит» будущее или сам таргет. Для прогноза окно сдвигают: `series.shift(1).rolling(k).mean()`."}, {"q": "Как выбрать ширину окна для удаления сезонности?", "a": "Окно должно совпадать с периодом сезонности (7 для дневных данных с недельным циклом, 12 для месячных с годовым), тогда сезонные колебания внутри окна взаимно гасятся. Для чётного периода используют центрированное 2×m-MA, чтобы окно оставалось симметричным."}, {"q": "Чем MA-компонента модели ARIMA отличается от скользящего среднего для сглаживания?", "a": "Это разные вещи. Сглаживающее MA усредняет **наблюдения** ряда, а MA(q) в ARIMA выражает текущее значение через **прошлые ошибки** (шоки): yₜ = μ + εₜ + θ₁εₜ₋₁ + … + θ_q·εₜ₋q."}], "multi_armed_bandits_cheatsheet.html": [{"q": "Чем задача многорукого бандита отличается от полной задачи RL?", "a": "Нет состояний и последствий действий для будущего: на каждом шаге выбирается одна «рука» и сразу получается награда. Остаётся только дилемма exploration vs exploitation."}, {"q": "Что такое regret?", "a": "Разница между суммарной наградой, которую дала бы всегда лучшая рука, и реально полученной. Хорошие алгоритмы обеспечивают регрет, растущий логарифмически по числу шагов."}, {"q": "Как работает алгоритм UCB?", "a": "Выбирает руку с максимальной верхней границей доверия: среднее награды + c·√(ln t / nₐ). Редко пробованные руки получают бонус за неопределённость — это «оптимизм перед лицом неопределённости»."}, {"q": "Как работает Thompson Sampling?", "a": "Для каждой руки поддерживается апостериорное распределение её средней награды (например, Beta для бинарных наград). На каждом шаге из каждого распределения сэмплируется значение и выбирается рука с максимальным сэмплом."}, {"q": "Что такое контекстные бандиты и где их применяют?", "a": "Перед выбором руки наблюдается контекст (признаки пользователя, времени, страницы), и лучшая рука зависит от него. Применяют в персонализированных рекомендациях, рекламе и выборе вариантов интерфейса (LinUCB и подобные)."}], "multi_head_attention_cheatsheet.html": [{"q": "Зачем использовать несколько голов внимания вместо одной?", "a": "Каждая голова работает в своём подпространстве со своими проекциями Q, K, V и может улавливать разные типы связей: синтаксические, позиционные, смысловые. Одна голова усредняла бы их в одно распределение."}, {"q": "Как формируется выход multi-head attention?", "a": "Каждая из h голов считает внимание независимо, их выходы конкатенируются и умножаются на выходную матрицу W_O, возвращающую размерность d_model."}, {"q": "Увеличивает ли переход к 8 головам число параметров по сравнению с одной головой того же d_model?", "a": "Практически нет: размерность каждой головы берут d_model / h, поэтому суммарный размер проекций остаётся тем же. Меняется только способ разбиения пространства."}, {"q": "Если d_model = 512 и голов 8, какая размерность у каждой головы?", "a": "512 / 8 = 64 — это d_k и d_v для каждой головы, как в оригинальном Transformer."}, {"q": "Что такое multi-query и grouped-query attention и зачем они нужны?", "a": "Варианты, в которых головы делят ключи и значения: в MQA одна пара K, V на все головы, в GQA — по одной на группу голов. Это сильно уменьшает KV-кэш и ускоряет генерацию в больших языковых моделях почти без потери качества."}], "multi_output_regression_cheatsheet.html": [{"q": "Чем MultiOutputRegressor отличается от модели с нативной поддержкой нескольких выходов?", "a": "`MultiOutputRegressor` обучает **отдельную модель на каждый выход** и не использует связи между ними. Нативные модели (`LinearRegression`, `RandomForestRegressor`, `KNeighborsRegressor`, нейросеть с несколькими выходами) обучаются совместно; дерево, например, выбирает разбиения по суммарной ошибке всех выходов."}, {"q": "Когда полезен RegressorChain?", "a": "Когда выходы зависят друг от друга: каждая следующая модель получает предсказания предыдущих как признаки. Результат зависит от порядка цепочки, а ошибки первых моделей распространяются дальше."}, {"q": "Почему выходы с разным масштабом нужно нормировать при совместном обучении?", "a": "В суммарной MSE выход в больших единицах (например, цена в рублях) доминирует, и модель почти игнорирует остальные. Нормировка или взвешивание потерь выравнивает вклад выходов."}, {"q": "Как оценивать multi-output модель?", "a": "Метрики по **каждому выходу отдельно** и их агрегат: в sklearn `r2_score` с `multioutput='raw_values'` или `'uniform_average'`. Среднее может скрыть, что один выход предсказывается плохо."}, {"q": "Какие ограничения у градиентного бустинга для нескольких выходов?", "a": "Классический `GradientBoostingRegressor` в sklearn поддерживает только один выход, поэтому его оборачивают в `MultiOutputRegressor` (по модели на выход). Некоторые реализации, например CatBoost с `loss_function='MultiRMSE'`, обучают совместно."}], "multi_task_learning_cheatsheet.html": [{"q": "Чем hard parameter sharing отличается от soft parameter sharing?", "a": "При hard sharing задачи используют общий backbone и имеют свои «головы» — меньше параметров и сильная регуляризация. При soft sharing у каждой задачи своя сеть, а сходство параметров поощряется штрафом или связями (например, cross-stitch), что гибче, но дороже."}, {"q": "Почему обучение нескольких задач может улучшить каждую из них?", "a": "Общее представление должно подходить всем задачам, что работает как регуляризация и снижает переобучение. Связанные задачи дают дополнительный сигнал (неявная аугментация данных), особенно полезный для задачи с малым количеством разметки."}, {"q": "Что такое negative transfer?", "a": "Ситуация, когда совместное обучение ухудшает качество задачи по сравнению с отдельной моделью. Возникает, если задачи слабо связаны или их градиенты конфликтуют; помогают отдельные ветви, гейтинг (MMoE) или методы вроде PCGrad."}, {"q": "Почему простая сумма потерь задач часто работает плохо?", "a": "Потери имеют разный масштаб и скорость убывания, и одна задача доминирует в градиентах. Применяют веса задач, uncertainty weighting (веса по выученной гомоскедастической неопределённости) или GradNorm, выравнивающий нормы градиентов."}, {"q": "Где на практике особенно распространён MTL?", "a": "В рекомендательных системах (одновременно клик, конверсия, время просмотра — например, MMoE), в автопилотах (детекция, сегментация, глубина из одного backbone) и в NLP. Общий backbone также экономит вычисления на инференсе."}], "multi_task_learning_deep_dive_cheatsheet.html": [{"q": "Почему совместное обучение нескольких задач может улучшить качество каждой?", "a": "Общие слои учатся представлениям, полезным для всех задач, что работает как **регуляризация** и снижает переобучение. Задачи с большим числом меток помогают задачам с малым."}, {"q": "Чем hard parameter sharing отличается от soft parameter sharing?", "a": "**Hard**: общий «ствол» сети и отдельные головы для каждой задачи — просто и экономно. **Soft**: у каждой задачи свои параметры, но они связаны штрафом на различие или механизмами обмена (cross-stitch) — гибче, но дороже."}, {"q": "Что такое negative transfer в multi-task learning?", "a": "Когда задачи конфликтуют, и совместное обучение ухудшает качество по сравнению с отдельными моделями. Признак — градиенты разных задач по общим параметрам направлены в противоположные стороны. Помогают отдельные ветви, методы вроде PCGrad, группировка совместимых задач."}, {"q": "Почему простая сумма функций потерь задач часто работает плохо?", "a": "Потери имеют разный масштаб и скорость убывания, и одна задача может доминировать в градиенте. Используют взвешивание: ручное, по неопределённости (uncertainty weighting) или GradNorm, выравнивающий нормы градиентов."}, {"q": "Чем multi-task learning отличается от transfer learning?", "a": "В transfer learning знания переносятся **последовательно**: сначала исходная задача, потом целевая, и важна в основном целевая. В MTL задачи обучаются **одновременно**, и обычно важно качество всех."}], "multi_view_learning_cheatsheet.html": [{"q": "Чем multi-view learning отличается от простой конкатенации всех признаков?", "a": "Он явно использует структуру «несколько представлений одного объекта» — согласие между представлениями и их взаимодополняемость. Конкатенация теряет эту структуру и при разных масштабах и размерностях views может привести к переобучению на одном из них."}, {"q": "Что такое принципы согласия и взаимодополняемости?", "a": "**Согласие (consensus)**: модели на разных views должны давать согласованные прогнозы, и минимизация их расхождения снижает ошибку. **Взаимодополняемость (complementarity)**: каждое представление несёт информацию, которой нет в других."}, {"q": "Какие три основные группы методов multi-view learning?", "a": "Co-training (взаимное обучение классификаторов на разных views), multiple kernel learning (комбинация ядер разных представлений) и методы общего подпространства (CCA, Kernel CCA, Deep CCA), которые проецируют views в общее латентное пространство."}, {"q": "Что делать, если у части объектов какое-то представление отсутствует?", "a": "Это задача incomplete multi-view learning: используют методы общего подпространства, обучающиеся на доступных парах, восстанавливают пропущенное представление по другим или обучают модели, устойчивые к выпадению views."}, {"q": "Почему multi-view подход полезен при малом числе меток?", "a": "Согласие между views — дополнительный сигнал на неразмеченных данных: если представления условно независимы, требование согласованности сужает множество допустимых гипотез и уменьшает потребность в размеченных примерах."}], "multimodal_transformers_cheatsheet.html": [{"q": "Как трансформер может обрабатывать изображения, звук и текст одной архитектурой?", "a": "Каждая модальность превращается в **последовательность токенов**: текст — через токенизатор, изображение — через патчи (как в ViT), звук — через патчи спектрограммы или токены кодека. Добавляются позиционные эмбеддинги и метки модальности, а дальше работает обычный self-attention."}, {"q": "Чем отличаются single-stream и dual-stream архитектуры?", "a": "**Single-stream** (например, VisualBERT) конкатенирует токены всех модальностей и обрабатывает их одним трансформером — взаимодействие с первого слоя. **Dual-stream** (ViLBERT, LXMERT) имеет отдельные энкодеры и обменивается информацией через **cross-attention** — гибче, но больше параметров."}, {"q": "Как работает cross-attention между модальностями?", "a": "Queries берутся из одной модальности (например, текста), а keys и values — из другой (патчей изображения). Так каждый текстовый токен «смотрит» на релевантные области картинки; этот же механизм используется в Flamingo и в диффузионных моделях для текстового условия."}, {"q": "Зачем нужны Perceiver Resampler или Q-Former?", "a": "Визуальный энкодер выдаёт сотни или тысячи токенов, что дорого для LLM. Небольшой набор **обучаемых queries** через cross-attention сжимает их в фиксированное число (например, 32 или 64) информативных токенов, которые затем подаются в языковую модель (Flamingo, BLIP-2)."}, {"q": "Что будет, если на инференсе отсутствует одна из модальностей?", "a": "Модель, которая всегда видела обе модальности, может резко деградировать: она не училась опираться на одну. Чтобы этого избежать, при обучении применяют **modality dropout** (случайно убирают модальность) и обучаемые токены-заглушки для отсутствующего входа."}], "multiple_regression_cheatsheet.html": [{"q": "Как интерпретировать коэффициент при признаке в множественной регрессии?", "a": "Это ожидаемое изменение y при увеличении признака на единицу **при фиксированных остальных признаках**. Поэтому коэффициент может отличаться и даже по знаку от коэффициента парной регрессии, если признак коррелирует с другими."}, {"q": "Чем опасна мультиколлинеарность?", "a": "Сильно коррелированные признаки делают матрицу XᵀX плохо обусловленной: стандартные ошибки коэффициентов растут, коэффициенты становятся нестабильными и могут менять знак. Качество предсказания при этом может не страдать, но интерпретация теряет смысл; диагностика — VIF, решение — удаление признаков, PCA или Ridge."}, {"q": "Посчитайте VIF признака, если R² его регрессии на остальные признаки равен 0.9.", "a": "VIF = 1 / (1 − R²) = 1 / 0.1 = **10**. Дисперсия оценки коэффициента в 10 раз больше, чем при некоррелированных признаках; VIF > 5–10 обычно считают признаком серьёзной мультиколлинеарности."}, {"q": "Почему для сравнения моделей с разным числом признаков используют скорректированный R²?", "a": "Обычный R² не уменьшается при добавлении любого признака, даже случайного. Скорректированный R² = 1 − (1 − R²)(n − 1)/(n − p − 1) штрафует за число признаков p и растёт, только если признак улучшает модель сильнее, чем ожидается случайно."}, {"q": "Что будет, если пропустить в модели важный признак, коррелирующий с включёнными?", "a": "Возникает **смещение из-за пропущенной переменной**: его эффект частично «перетекает» в коэффициенты коррелирующих признаков, и они оказываются смещёнными. Это особенно опасно, если коэффициенты интерпретируются как причинные эффекты."}], "multitask_rl_cheatsheet.html": [{"q": "Что выигрывается от обучения одного агента на многих задачах?", "a": "Общие представления и навыки переиспользуются, что повышает эффективность по данным и обобщение на новые задачи. Также модель одна, а не N отдельных."}, {"q": "Что такое негативный перенос и откуда он берётся?", "a": "Когда совместное обучение ухудшает качество на части задач. Причины — конфликтующие градиенты разных задач и разный масштаб наград, из-за которого одни задачи доминируют."}, {"q": "Какие методы борются с конфликтом градиентов?", "a": "Например, **PCGrad** проецирует градиент задачи на нормальную плоскость к конфликтующему градиенту другой задачи; также используют нормализацию наград (PopArt), раздельные «головы» и динамическое взвешивание задач."}, {"q": "Как агент узнаёт, какую задачу сейчас решает?", "a": "Через условие на задачу: one-hot ID, эмбеддинг задачи или описание цели (goal-conditioned политика π(a|s, g)). Без этого сигнала политика будет усреднять поведение по задачам."}, {"q": "Чем multitask RL отличается от meta-RL?", "a": "Multitask RL стремится хорошо решать фиксированный набор известных задач. Meta-RL учится **быстро адаптироваться** к новой задаче по нескольким эпизодам, оптимизируя именно скорость адаптации."}], "multivariate_time_series_cheatsheet.html": [{"q": "Чем многомерный прогноз отличается от прогноза одного ряда с экзогенными признаками?", "a": "В многомерной постановке (например, **VAR**) все ряды прогнозируются совместно и влияют друг на друга. При экзогенных признаках (ARIMAX) внешние ряды только объясняют целевой, но сами не прогнозируются — поэтому на горизонте прогноза их будущие значения нужно знать или прогнозировать отдельно."}, {"q": "Почему перед построением VAR ряды обычно приводят к стационарности?", "a": "VAR предполагает стационарный процесс: на нестационарных рядах оценки коэффициентов и тесты становятся некорректными, возникает ложная регрессия. Ряды дифференцируют, а если они **коинтегрированы** — используют модель коррекции ошибок **VECM**, чтобы не потерять долгосрочную связь."}, {"q": "Сколько параметров у модели VAR(p) для k рядов и почему это проблема?", "a": "Каждая матрица лагов имеет k² коэффициентов, итого k²·p плюс k свободных членов. Для k = 10 и p = 5 это уже 505 параметров, поэтому при росте числа рядов модель быстро переобучается — помогают регуляризация, отбор лагов по AIC/BIC или снижение размерности."}, {"q": "Что показывает тест причинности по Грейнджеру и чего он не показывает?", "a": "Он проверяет, улучшают ли прошлые значения ряда X прогноз ряда Y сверх собственных лагов Y. Это **предсказательная** связь, а не настоящая причинность: оба ряда могут зависеть от третьего, скрытого фактора."}, {"q": "Какая типичная ошибка при валидации моделей на многомерных рядах?", "a": "Случайное перемешивание при кросс-валидации и масштабирование по всему датасету — это утечка будущего. Нужно использовать временное разбиение (expanding/rolling window), а нормализацию обучать только на тренировочном отрезке; также важно, чтобы признаки других рядов были доступны на момент прогноза."}], "musical_neural_networks_cheatsheet.html": [{"q": "Чем символьное представление музыки отличается от аудио, и как это влияет на модели?", "a": "Символьное (MIDI, ноты) — дискретные события высоты, длительности, громкости: последовательности короткие, их моделируют как язык. Аудио — волна с десятками тысяч отсчётов в секунду: нужны модели вроде WaveNet или кодеки, но так можно передать тембр и голос."}, {"q": "Почему генерация сырого аудио так вычислительно трудна?", "a": "При 44.1 кГц одна секунда — 44 100 отсчётов, а музыкальная структура разворачивается на минутах. Поэтому используют нейронные аудиокодеки (**EnCodec**, SoundStream), сжимающие звук в дискретные токены, и генерируют уже их."}, {"q": "Какую проблему решала Music Transformer?", "a": "Музыка держится на повторах и относительных интервалах. Music Transformer использует **относительное позиционное внимание**, что помогает воспроизводить мотивы и структуру на длинных последовательностях лучше обычного трансформера и RNN."}, {"q": "Почему простое предсказание следующей ноты часто даёт музыку без структуры?", "a": "Модель хорошо учит локальные переходы, но не крупную форму (куплет, припев, развитие). Решают иерархическими моделями, условиями на структуру (аккорды, секции) и длинным контекстом."}, {"q": "Как объективно оценивать сгенерированную музыку?", "a": "Объективные метрики (распределение высот и ритмов, **FAD** — Fréchet Audio Distance) показывают близость к реальным данным, но не музыкальную ценность. Поэтому обязательны слушательские тесты; также важна проверка на запоминание обучающих произведений."}], "naive_bayes_cheatsheet.html": [{"q": "В чём «наивность» наивного Байеса?", "a": "Предполагается, что признаки **условно независимы** при известном классе: P(x₁, …, xₙ | y) = Π P(xᵢ | y). В реальности это почти никогда не так, но классификатор часто всё равно работает хорошо."}, {"q": "Запишите, как наивный Байес выбирает класс.", "a": "ŷ = argmax_y P(y) · Π P(xᵢ | y) — априорная вероятность класса, умноженная на правдоподобие признаков. Знаменатель P(x) одинаков для всех классов, поэтому его не считают. На практике складывают логарифмы, чтобы избежать переполнения снизу."}, {"q": "Зачем нужно сглаживание Лапласа?", "a": "Если слово ни разу не встречалось в документах класса, P(слово | класс) = 0 и всё произведение обнулится. Сглаживание добавляет к каждому счётчику небольшую константу (α = 1), и нулевых вероятностей не остаётся."}, {"q": "Чем отличаются GaussianNB, MultinomialNB и BernoulliNB?", "a": "GaussianNB — непрерывные признаки с нормальным распределением внутри класса. MultinomialNB — счётчики (частоты слов в тексте). BernoulliNB — бинарные признаки (слово есть или нет)."}, {"q": "Почему вероятностям наивного Байеса не стоит слепо доверять?", "a": "Из-за предположения независимости коррелированные признаки «учитываются дважды», и вероятности получаются слишком близкими к 0 или 1. Ранжирование при этом часто хорошее; если нужны точные вероятности, их калибруют."}], "naive_bayes_bayesian_method_cheatsheet.html": [{"q": "В чём состоит «наивное» предположение и почему метод работает, даже если оно нарушается?", "a": "Признаки предполагаются **условно независимыми при известном классе**: P(x|y) = ∏ P(xᵢ|y). Оценки вероятностей получаются неточными, но для классификации важно только, какой класс получит максимальный score, и порядок часто сохраняется."}, {"q": "Зачем нужно сглаживание Лапласа?", "a": "Если какое-то слово ни разу не встретилось в классе, P(xᵢ|y) = 0, и всё произведение обнуляется. Добавление α (обычно 1) к счётчикам исключает нулевые вероятности. С байесовской точки зрения это **Dirichlet prior** на параметры."}, {"q": "Почему вычисления ведут в логарифмах?", "a": "Произведение сотен маленьких вероятностей уходит в машинный ноль. log превращает произведение в сумму: log P(y) + ∑ log P(xᵢ|y), а argmax при этом не меняется."}, {"q": "Чем отличаются GaussianNB, MultinomialNB и BernoulliNB?", "a": "**GaussianNB** — непрерывные признаки с нормальным распределением внутри класса; **MultinomialNB** — счётчики (частоты слов); **BernoulliNB** — бинарные признаки (есть слово или нет), он явно учитывает и отсутствие признака."}, {"q": "Можно ли доверять predict_proba наивного Байеса?", "a": "Обычно нет: из-за нарушенной независимости коррелированные признаки «учитываются дважды», и вероятности смещены к 0 и 1. Если нужны вероятности, модель калибруют, например `CalibratedClassifierCV`."}], "nas_cheatsheet.html": [{"q": "Из каких трёх компонентов состоит любой метод NAS?", "a": "**Пространство поиска** (какие операции и связи допустимы), **стратегия поиска** (случайный поиск, RL, эволюция, градиентный спуск, байесовская оптимизация) и **стратегия оценки** качества кандидата (полное обучение, сокращённое обучение, weight sharing, предсказатели качества)."}, {"q": "Почему ранние методы NAS требовали тысячи GPU-дней?", "a": "Каждую архитектуру-кандидата обучали **с нуля до сходимости**, а контроллеру на RL (Zoph & Le, 2017) нужны были тысячи кандидатов. Последующие методы ускорили поиск через разделение весов (ENAS), one-shot суперсети и дифференцируемый поиск."}, {"q": "Как работает DARTS?", "a": "Дискретный выбор операции на каждом ребре заменяется **непрерывной смесью** всех операций с весами softmax(α). Параметры архитектуры α и веса сети оптимизируются градиентным спуском поочерёдно (на val и train), а в конце на каждом ребре оставляется операция с наибольшим α."}, {"q": "Какие известные проблемы у DARTS?", "a": "Нестабильность и **вырождение**: поиск часто сходится к архитектурам, заполненным skip-connections и операциями без параметров, которые плохо работают после дискретизации. Также есть разрыв между суперсетью при поиске и итоговой сетью; модификации вроде DARTS+, PC-DARTS и SDARTS борются с этим."}, {"q": "Почему важно сравнивать NAS со случайным поиском?", "a": "Исследования показали, что **случайный п

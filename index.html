реть на дрейф прогнозов и уверенности модели как косвенный сигнал."}, {"q": "Что делать при обнаружении дрейфа?", "a": "Проверить, не ошибка ли это в данных (сломанный источник). Если дрейф настоящий — переобучить модель на свежих данных, взвесить новые наблюдения сильнее, пересмотреть признаки; при регулярном дрейфе — настроить автоматическое переобучение."}], "confusion_matrix_cheatsheet.html": [{"q": "Что означают TP, FP, FN, TN?", "a": "TP — положительный объект предсказан положительным; FP — отрицательный ошибочно предсказан положительным (ложная тревога, ошибка I рода); FN — положительный пропущен (ошибка II рода); TN — отрицательный верно предсказан отрицательным."}, {"q": "Как расположены ячейки в `sklearn.metrics.confusion_matrix` для бинарной задачи?", "a": "Строки — истинные классы, столбцы — предсказанные: `[[TN, FP], [FN, TP]]` при метках 0 и 1. Поэтому удобно `tn, fp, fn, tp = confusion_matrix(y, y_pred).ravel()`."}, {"q": "Тест на болезнь нашёл 90 из 100 больных и дал 30 ложных тревог на 900 здоровых. Чему равны recall и precision?", "a": "TP = 90, FN = 10, FP = 30. Recall = 90 / 100 = 0.9; precision = 90 / (90 + 30) = 0.75."}, {"q": "Что такое специфичность (specificity)?", "a": "TN / (TN + FP) — доля верно распознанных отрицательных объектов. Вместе с recall (чувствительностью) она часто используется в медицине."}, {"q": "Зачем нормировать матрицу ошибок?", "a": "При дисбалансе классов абсолютные числа трудно сравнивать. Нормировка по строкам (`normalize='true'`) показывает, какая доля объектов каждого истинного класса куда попала, — сразу видно recall каждого класса."}], "cross_validation_cheatsheet.html": [{"q": "Как работает k-fold кросс-валидация?", "a": "Данные делят на k частей (фолдов). k раз модель обучают на k−1 фолдах и оценивают на оставшемся. Итоговая оценка — среднее (и разброс) k метрик. Каждый объект ровно один раз попадает в валидацию."}, {"q": "Зачем нужен StratifiedKFold?", "a": "Он сохраняет **долю классов** в каждом фолде такой же, как во всей выборке. Это важно при несбалансированных классах: иначе в каком-то фолде редкого класса может почти не оказаться."}, {"q": "Почему для временных рядов нельзя использовать KFold с перемешиванием?", "a": "Модель будет обучаться на «будущем» и проверяться на «прошлом» — это утечка информации. Используют `TimeSeriesSplit`: обучение всегда на более ранних данных, проверка — на более поздних."}, {"q": "Где ошибка: «сначала масштабировали весь датасет, потом сделали кросс-валидацию»?", "a": "Скейлер «видел» валидационные фолды — это утечка данных. Предобработку нужно обучать внутри каждого фолда только на обучающей части; удобнее всего передать `Pipeline` в `cross_val_score`."}, {"q": "Что говорит большой разброс метрики между фолдами?", "a": "Оценка качества неустойчива: модель чувствительна к составу выборки (высокая дисперсия), данных мало или фолды неоднородны. Смотрите не только на среднее, но и на стандартное отклонение."}], "data_augmentation_cheatsheet.html": [{"q": "Зачем нужна аугментация данных?", "a": "Искусственно увеличивает разнообразие обучающей выборки случайными преобразованиями, которые не меняют метку. Модель учится инвариантности к этим преобразованиям и меньше переобучается."}, {"q": "Почему не любую аугментацию можно применять к любой задаче?", "a": "Преобразование не должно менять смысл метки. Горизонтальное отражение подходит для кошек, но не для распознавания цифр 6 и 9 или текста; поворот на 180° испортит задачу определения ориентации."}, {"q": "Применяют ли аугментацию к валидационной и тестовой выборке?", "a": "Случайную аугментацию — нет: оценка должна быть детерминированной и соответствовать реальным данным. Исключение — test-time augmentation (TTA), когда прогнозы по нескольким преобразованным копиям намеренно усредняют."}, {"q": "Что такое Mixup и CutMix?", "a": "Mixup смешивает два изображения и их метки с весом λ: x = λx₁ + (1 − λ)x₂. CutMix вырезает прямоугольник из одного изображения, вставляет в другое и смешивает метки пропорционально площади. Оба метода регуляризуют модель и улучшают калибровку."}, {"q": "Что нужно учитывать при аугментации в задачах детекции и сегментации?", "a": "Геометрические преобразования (поворот, кроп, отражение) нужно применять согласованно и к изображению, и к разметке — рамкам или маскам. Библиотеки вроде Albumentations делают это автоматически."}], "data_preprocessing_missing_encoding_cheatsheet.html": [{"q": "Какие типы пропусков различают и почему это важно?", "a": "MCAR — пропуски полностью случайны; MAR — зависят от других наблюдаемых признаков; MNAR — зависят от самого пропущенного значения (например, люди с высоким доходом его не указывают). От типа зависит, исказит ли простое удаление или заполнение результаты."}, {"q": "Чем заполнять пропуски в числовом признаке с выбросами — средним или медианой?", "a": "Медианой: она устойчива к выбросам, а среднее ими смещается."}, {"q": "Когда стоит добавить бинарный признак «значение было пропущено»?", "a": "Когда сам факт пропуска может нести информацию (MNAR) — например, пустое поле «стаж» у безработных. В sklearn: `SimpleImputer(add_indicator=True)`."}, {"q": "Можно ли просто удалить строки с пропусками?", "a": "Можно, если пропусков мало и они случайны (MCAR). Иначе теряется много данных и выборка становится смещённой."}, {"q": "Чем заполнять пропуски в категориальном признаке?", "a": "Самым частым значением (мода) или отдельной категорией вроде `\"unknown\"` — второй вариант сохраняет информацию о факте пропуска."}], "decision_trees_cheatsheet.html": [{"q": "Как дерево выбирает разбиение в узле?", "a": "Перебирает признаки и пороги и выбирает разбиение, которое сильнее всего уменьшает неоднородность (impurity) дочерних узлов: критерий Джини или энтропию для классификации, MSE для регрессии."}, {"q": "Чем критерий Джини отличается от энтропии?", "a": "Джини: 1 − Σpₖ², энтропия: −Σpₖ·log pₖ. Обе равны нулю для «чистого» узла и максимальны при равномерном распределении классов. На практике дают похожие деревья; Джини чуть быстрее считать."}, {"q": "Почему глубокое дерево переобучается и как это ограничить?", "a": "Без ограничений дерево делит данные, пока в листьях не останутся единичные объекты, — и запоминает шум. Ограничивают `max_depth`, `min_samples_leaf`, `min_samples_split`, `max_leaf_nodes` или используют обрезку (`ccp_alpha`)."}, {"q": "Нужно ли масштабировать признаки для дерева?", "a": "Нет: разбиения вида «признак ≤ порог» не зависят от масштаба и монотонных преобразований признака."}, {"q": "Назовите главные плюсы и минусы деревьев решений.", "a": "Плюсы: интерпретируемость (набор правил), работа с разнотипными признаками без масштабирования, нелинейность. Минусы: высокая дисперсия (неустойчивость к изменению данных), склонность к переобучению, ступенчатые прогнозы в регрессии. Минусы лечат ансамбли — случайный лес и бустинг."}], "diffusion_models_cheatsheet.html": [{"q": "В чём идея прямого и обратного процесса диффузии?", "a": "Прямой процесс за много шагов постепенно добавляет к изображению гауссов шум, пока не останется чистый шум. Модель учится обратному процессу — шаг за шагом убирать шум, восстанавливая изображение."}, {"q": "Что предсказывает нейросеть в DDPM и какая функция потерь?", "a": "Шум ε, добавленный к изображению на случайном шаге t. Потеря — MSE между настоящим и предсказанным шумом: ‖ε − ε_θ(x_t, t)‖²."}, {"q": "Почему генерация диффузионной моделью медленная и как её ускоряют?", "a": "Нужно много последовательных шагов денойзинга (в DDPM — около 1000), каждый — проход сети. Ускоряют детерминированные сэмплеры (DDIM), продвинутые решатели ОДУ (DPM-Solver), дистилляция в модели с малым числом шагов."}, {"q": "Что такое latent diffusion (Stable Diffusion)?", "a": "Диффузия выполняется не в пространстве пикселей, а в сжатом латентном пространстве предобученного автоэнкодера. Это в разы дешевле, а декодер в конце превращает латентный код в изображение."}, {"q": "Как работает classifier-free guidance?", "a": "Модель обучают и с условием (текстом), и без него, случайно отбрасывая условие. При генерации прогнозы экстраполируют: ε = ε_uncond + w·(ε_cond − ε_uncond). Большой w усиливает соответствие тексту ценой разнообразия."}], "dqn_cheatsheet.html": [{"q": "Какую идею Q-learning реализует DQN?", "a": "Q-функция аппроксимируется нейросетью: на вход состояние (например, кадры игры), на выход — Q-значения всех действий. Сеть обучается минимизировать квадрат TD-ошибки."}, {"q": "Зачем нужен experience replay?", "a": "Переходы (s, a, r, s') сохраняются в буфер, а для обучения берутся случайные мини-батчи. Это разрушает корреляцию соседних переходов, стабилизирует обучение и позволяет многократно использовать опыт."}, {"q": "Зачем нужна target network?", "a": "Целевое значение r + γ·max Q(s', a') считается отдельной копией сети, которая обновляется редко (или плавно). Без неё цель «убегает» при каждом обновлении, и обучение становится нестабильным."}, {"q": "Какую проблему решает Double DQN?", "a": "Обычный DQN переоценивает Q-значения из-за максимума по зашумлённым оценкам. Double DQN выбирает лучшее действие онлайн-сетью, а оценивает его target-сетью, разделяя выбор и оценку."}, {"q": "Что такое Dueling DQN?", "a": "Архитектура, где сеть раздельно оценивает ценность состояния V(s) и преимущество действий A(s, a), а затем объединяет их: Q = V + (A − среднее A). Ценность состояния учится быстрее, даже когда выбор действия мало что меняет."}], "explainable_ai_xai_cheatsheet.html": [{"q": "Зачем нужна объяснимость моделей?", "a": "Чтобы доверять решениям и проверять их, находить ошибки и утечки данных, выполнять требования регуляторов (кредиты, медицина, право на объяснение), объяснять решения пользователям и искать несправедливые зависимости."}, {"q": "Чем интерпретируемые по устройству модели отличаются от post-hoc объяснений?", "a": "Интерпретируемые модели (линейные, небольшие деревья, GAM) понятны сами по себе. Post-hoc методы (SHAP, LIME, PDP, saliency maps) объясняют уже обученную модель-«чёрный ящик» снаружи и сами являются приближением."}, {"q": "Что такое контрфактическое объяснение?", "a": "Минимальное изменение входа, при котором решение модели изменится: «кредит одобрили бы, если бы доход был на 10% выше». Такие объяснения понятны людям и подсказывают, что можно сделать."}, {"q": "Какие методы объяснения используют для нейросетей на изображениях?", "a": "Карты значимости (saliency, градиенты по входу), Grad-CAM (тепловая карта по активациям последних свёрточных слоёв), Integrated Gradients, а также окклюзию — закрытие областей и наблюдение за изменением прогноза."}, {"q": "Почему правдоподобное объяснение может вводить в заблуждение?", "a": "Объяснение может выглядеть убедительно, но неточно отражать, как модель реально принимает решение (низкая «верность», faithfulness). Его стоит проверять: например, удаляя признаки, названные важными, и смотря, действительно ли падает качество."}], "exponential_smoothing_cheatsheet.html": [{"q": "Как работает простое экспоненциальное сглаживание?", "a": "Прогноз — взвешенное среднее всех прошлых наблюдений с экспоненциально убывающими весами: ŷₜ₊₁ = α·yₜ + (1 − α)·ŷₜ. Подходит для рядов без тренда и сезонности."}, {"q": "Как параметр α влияет на прогноз?", "a": "α близко к 1 — модель быстро реагирует на последние значения, но шумна. α близко к 0 — сильное сглаживание и медленная реакция на изменения. Оптимальное α подбирают по ошибке на истории."}, {"q": "Что добавляют методы Хольта и Хольта–Уинтерса?", "a": "Хольт добавляет сглаживаемый тренд (уровень + наклон, параметр β). Хольт–Уинтерс дополнительно добавляет сезонную компоненту (параметр γ) — аддитивную или мультипликативную."}, {"q": "Когда сезонность лучше моделировать мультипликативно, а не аддитивно?", "a": "Когда амплитуда сезонных колебаний растёт вместе с уровнем ряда (например, продажи в декабре всегда на 30% выше, а не на фиксированные 1000 штук). Если амплитуда постоянна — аддитивно."}, {"q": "Что такое затухающий тренд и зачем он нужен?", "a": "Параметр φ < 1 постепенно «выпрямляет» тренд на длинном горизонте. Линейное продление тренда в далёкое будущее часто даёт завышенные прогнозы, а затухающий тренд на практике точнее."}], "fairness_ml_cheatsheet.html": [{"q": "Откуда в моделях берётся несправедливость?", "a": "Из исторических предубеждений в данных, нерепрезентативной выборки, смещённой разметки, признаков-прокси для защищённого атрибута и выбора целевой переменной, которая сама отражает неравенство."}, {"q": "Достаточно ли удалить из данных пол или расу, чтобы модель стала справедливой?", "a": "Нет. Модель восстановит эту информацию через коррелированные признаки-прокси (почтовый индекс, имя, покупки). Без защищённого атрибута к тому же сложнее измерить и исправить неравенство."}, {"q": "Чем demographic parity отличается от equalized odds?", "a": "Demographic parity — доля положительных решений одинакова во всех группах. Equalized odds — одинаковы TPR и FPR в группах, т.е. модель одинаково точна для них с учётом истинных меток."}, {"q": "Можно ли одновременно выполнить все критерии справедливости?", "a": "В общем случае нет: если базовые доли положительного класса в группах различаются, калибровку и равенство ошибок одновременно выполнить нельзя (теоремы о несовместимости). Критерий выбирают исходя из задачи и последствий ошибок."}, {"q": "На каких этапах можно уменьшать несправедливость?", "a": "До обучения — перевзвешивание и пересэмплирование данных; во время — ограничения или штрафы в функции потерь, adversarial debiasing; после — разные пороги для групп или коррекция прогнозов."}], "feature_importance_cheatsheet.html": [{"q": "Как вычисляется permutation importance?", "a": "Значения одного признака случайно перемешиваются на валидационной выборке, и измеряется падение качества модели. Чем сильнее падение, тем важнее признак. Метод подходит для любой модели."}, {"q": "Чем опасна встроенная важность деревьев (по уменьшению impurity)?", "a": "Она считается на обучающих данных и завышает важность признаков с большим числом уникальных значений (ID, непрерывные признаки с шумом), даже если они бесполезны для обобщения."}, {"q": "Как коррелированные признаки искажают важность?", "a": "При перемешивании одного из двух сильно коррелированных признаков модель берёт информацию из второго, и оба выглядят неважными. Во встроенной важности деревьев значимость произвольно делится между ними."}, {"q": "Можно ли сравнивать коэффициенты линейной модели как важность признаков?", "a": "Только после масштабирования признаков к одной шкале, иначе величина коэффициента зависит от единиц измерения. И даже тогда мультиколлинеарность делает коэффициенты неустойчивыми."}, {"q": "Означает ли высокая важность признака, что он причина целевой переменной?", "a": "Нет. Важность показывает, насколько модель опирается на признак для прогноза, а не причинно-следственную связь. Признак может быть следствием цели или коррелировать с настоящей причиной (а иногда — утечкой данных)."}], "feature_stores_cheatsheet.html": [{"q": "Что такое feature store и какие задачи он решает?", "a": "Централизованное хранилище признаков с их определениями. Устраняет дублирование расчётов между командами, обеспечивает одинаковые признаки при обучении и в продакшене, хранит историю значений и метаданные."}, {"q": "Чем офлайн-хранилище отличается от онлайн-хранилища?", "a": "Офлайн (хранилище данных, озеро) — полная история признаков для обучения и пакетных прогнозов. Онлайн (key-value: Redis, DynamoDB) — последние значения признаков для быстрой выдачи при онлайн-инференсе с низкой задержкой."}, {"q": "Что такое point-in-time correct join и зачем он нужен?", "a": "При сборке обучающей выборки для каждого события берутся значения признаков ровно на момент события, а не более поздние. Иначе в обучение попадёт информация из будущего — утечка данных, и модель будет выглядеть лучше, чем есть."}, {"q": "Как feature store помогает против training-serving skew?", "a": "Признак описывается один раз, и одно определение используется и для подготовки обучающих данных, и для выдачи в продакшене. Расчёты не расходятся из-за разного кода."}, {"q": "Когда feature store не нужен?", "a": "Для небольшого проекта с одной моделью и пакетными прогнозами это лишняя инфраструктура. Он окупается, когда моделей и команд много, признаки переиспользуются и нужен онлайн-инференс."}], "gan_cheatsheet.html": [{"q": "Как устроена GAN?", "a": "Две сети соревнуются: генератор превращает случайный шум в объекты, дискриминатор отличает настоящие объекты от сгенерированных. Генератор учится обманывать дискриминатор, дискриминатор — не обманываться."}, {"q": "Что такое mode collapse?", "a": "Генератор выдаёт лишь несколько похожих вариантов (например, одну и ту же цифру), которые обманывают дискриминатор, вместо всего разнообразия данных."}, {"q": "Почему GAN трудно обучать?", "a": "Это минимаксная игра, а не минимизация одной функции: обучение может осциллировать или расходиться. Если дискриминатор слишком силён, градиенты для генератора исчезают; нужен баланс сил двух сетей."}, {"q": "Какие приёмы стабилизируют обучение GAN?", "a": "Non-saturating loss для генератора, Wasserstein loss со штрафом на градиент (WGAN-GP), spectral normalization, разные learning rate для двух сетей (TTUR), архитектурные правила DCGAN (BatchNorm, LeakyReLU, без пулинга)."}, {"q": "Как оценивают качество GAN?", "a": "Чаще всего метрикой FID — расстоянием между распределениями признаков (из сети Inception) у настоящих и сгенерированных изображений; меньше — лучше. Также используют Inception Score и визуальную оценку людьми."}], "gpt_architectures_cheatsheet.html": [{"q": "Какую часть Transformer использует GPT и на какую задачу обучается?", "a": "Только декодер с каузальной маской (без cross-attention). Задача — предсказание следующего токена по всем предыдущим (авторегрессионное языковое моделирование)."}, {"q": "Как GPT генерирует текст?", "a": "Пошагово: предсказывает распределение следующего токена, выбирает токен (жадно или сэмплированием), добавляет его к входу и повторяет, пока не встретит токен конца или не достигнет лимита."}, {"q": "Что регулирует temperature при сэмплировании?", "a": "Логиты делятся на температуру T перед softmax. При T < 1 распределение острее — текст предсказуемее; при T > 1 — более плоское: текст разнообразнее, но больше ошибок. Top-k и top-p (nucleus) дополнительно отсекают маловероятные токены."}, {"q": "Что такое KV-кэш и зачем он нужен?", "a": "При генерации ключи и значения уже обработанных токенов сохраняются, и на каждом новом шаге считаются только для нового токена. Без кэша пришлось бы заново пересчитывать внимание по всему префиксу на каждом шаге."}, {"q": "Как предобученная GPT превращается в ассистента, следующего инструкциям?", "a": "Дообучением на примерах «инструкция — ответ» (supervised fine-tuning) и последующим обучением на предпочтениях людей (RLHF или DPO), чтобы ответы были полезными, честными и безопасными."}], "gradient_descent_cheatsheet.html": [{"q": "Запишите шаг градиентного спуска и объясните каждый символ.", "a": "θ ← θ − η · ∇L(θ). θ — параметры модели, η — скорость обучения (learning rate), ∇L(θ) — градиент функции потерь. Движемся против градиента, т.е. в сторону наискорейшего убывания потерь."}, {"q": "Что будет при слишком большом и слишком маленьком learning rate?", "a": "Слишком большой — шаги «перепрыгивают» минимум, потери скачут или растут (расходимость). Слишком маленький — сходимость очень медленная, можно застрять на плато."}, {"q": "Чем отличаются batch, stochastic и mini-batch градиентный спуск?", "a": "Batch считает градиент по всей выборке (точно, но медленно), stochastic — по одному объекту (быстро, но шумно), mini-batch — по небольшой порции (32–512 объектов): компромисс и стандарт на практике."}, {"q": "Почему перед градиентным спуском полезно масштабировать признаки?", "a": "При разных масштабах признаков линии уровня функции потерь сильно вытянуты, и спуск идёт зигзагами. После масштабирования поверхность «круглее», и сходимость быстрее и стабильнее."}, {"q": "Гарантирует ли градиентный спуск нахождение глобального минимума?", "a": "Только для выпуклых функций потерь (например, у линейной и логистической регрессии). Для невыпуклых (нейросети) он может остановиться в локальном минимуме или седловой точке."}], "gru_cheatsheet.html": [{"q": "Какие гейты есть в GRU?", "a": "Update gate — какую долю старого состояния сохранить и какую заменить новым кандидатом. Reset gate — сколько прошлого состояния использовать при вычислении кандидата."}, {"q": "Чем GRU проще LSTM?", "a": "Нет отдельного cell state и output gate: одно скрытое состояние и два гейта вместо трёх. Параметров примерно в 3 раза больше, чем у простой RNN, против 4 раз у LSTM."}, {"q": "Как update gate помогает с длинными зависимостями?", "a": "hₜ = (1 − zₜ)·hₜ₋₁ + zₜ·h̃ₜ. Если zₜ близко к 0, состояние почти без изменений копируется дальше, и градиент проходит через много шагов."}, {"q": "Что выбрать — GRU или LSTM?", "a": "Качество обычно сопоставимо и зависит от задачи. GRU быстрее и меньше склонна к переобучению на небольших данных; LSTM иногда лучше на очень длинных последовательностях. Выбор делают экспериментально."}, {"q": "Что такое двунаправленная (bidirectional) GRU и когда её нельзя использовать?", "a": "Две GRU обрабатывают последовательность слева направо и справа налево, их состояния объединяются — каждый элемент видит и прошлый, и будущий контекст. Нельзя использовать там, где будущее неизвестно: генерация текста, онлайн-прогноз временного ряда."}], "hyperparameter_tuning_cheatsheet.html": [{"q": "Чем гиперпараметры отличаются от параметров модели?", "a": "Параметры (веса, коэффициенты) модель находит сама при обучении. Гиперпараметры (глубина дерева, learning rate, α регуляризации) задаются до обучения и подбираются снаружи — по качеству на валидации."}, {"q": "Почему Random Search часто эффективнее Grid Search при том же числе запусков?", "a": "Обычно важны лишь немногие гиперпараметры. Сетка многократно перебирает одни и те же значения важного параметра, а случайный поиск при каждом запуске пробует новое значение каждого параметра и лучше покрывает важные измерения."}, {"q": "Сколько обучений сделает `GridSearchCV` с сеткой 4 × 3 × 5 и `cv=5`?", "a": "4·3·5 = 60 комбинаций × 5 фолдов = 300 обучений, плюс одно финальное обучение лучшей модели на всех данных (`refit=True`)."}, {"q": "Почему для learning rate и α значения перебирают по логарифмической шкале?", "a": "Важен порядок величины: разница между 0.001 и 0.01 так же существенна, как между 0.1 и 1. Равномерная сетка потратила бы почти все попытки на большие значения. В sklearn — `loguniform` или `np.logspace`."}, {"q": "Почему оценка лучшей модели из `GridSearchCV` (best_score_) оптимистична?", "a": "Мы выбрали максимум из многих оценок на тех же фолдах — часть превосходства случайна. Честную оценку даёт отдельная тестовая выборка или вложенная (nested) кросс-валидация."}], "image_segmentation_cheatsheet.html": [{"q": "Чем семантическая сегментация отличается от instance- и panoptic-сегментации?", "a": "Семантическая присваивает класс каждому пикселю, не различая объекты одного класса. Instance выделяет каждый объект отдельно. Panoptic объединяет оба подхода: отдельные экземпляры для «вещей» (люди, машины) и классы для «фона» (небо, дорога)."}, {"q": "Как устроена U-Net и зачем в ней skip-связи?", "a": "Энкодер сжимает изображение и извлекает признаки, декодер восстанавливает разрешение. Skip-связи передают карты признаков энкодера в декодер на том же уровне, возвращая мелкие пространственные детали, потерянные при сжатии."}, {"q": "Какие функции потерь используют для сегментации и почему не только кросс-энтропию?", "a": "Попиксельную кросс-энтропию, а также Dice loss и IoU (Jaccard) loss, которые напрямую оптимизируют перекрытие масок. Они устойчивее к дисбалансу, когда объект занимает малую долю изображения."}, {"q": "Как вычисляется метрика mIoU?", "a": "Для каждого класса считается IoU = |предсказание ∩ разметка| / |предсказание ∪ разметка| по пикселям, затем значения усредняются по классам."}, {"q": "Как Mask R-CNN решает задачу instance-сегментации?", "a": "Расширяет детектор Faster R-CNN: для каждой найденной рамки дополнительная ветка предсказывает бинарную маску объекта. RoIAlign точно выравнивает признаки области без грубого округления координат."}], "imbalanced_data_cheatsheet.html": [{"q": "Какие метрики использовать при сильном дисбалансе классов?", "a": "Не accuracy, а precision, recall, F1 для редкого класса, PR-AUC, ROC-AUC (с осторожностью), balanced accuracy. Выбор зависит от цены ошибок в задаче."}, {"q": "Как работает SMOTE?", "a": "Создаёт синтетические объекты редкого класса: берёт объект, одного из его k ближайших соседей того же класса и генерирует точку на отрезке между ними."}, {"q": "Почему oversampling нужно делать только на обучающей части?", "a": "Если увеличить выборку до разбиения, копии или синтетические соседи одного объекта попадут и в train, и в validation — модель «увидит» валидационные данные, и оценка будет завышена. В sklearn используют `Pipeline` из imbalanced-learn внутри кросс-валидации."}, {"q": "Какие есть альтернативы пересэмплированию?", "a": "Веса классов в функции потерь (`class_weight='balanced'`), подбор порога классификации, алгоритмы, устойчивые к дисбалансу (бустинг с `scale_pos_weight`), focal loss, сбор дополнительных данных редкого класса."}, {"q": "Почему после undersampling или oversampling вероятности модели смещены?", "a": "Модель обучалась на искусственном соотношении классов и переоценивает вероятность редкого класса. Если нужны реальные вероятности, их пересчитывают с учётом исходных долей или калибруют."}], "knn_cheatsheet.html": [{"q": "Как k-NN делает прогноз и что происходит на этапе обучения?", "a": "Обучения почти нет: модель запоминает выборку (ленивое обучение). Для нового объекта находятся k ближайших соседей, и прогноз — голосование их классов (классификация) или среднее их значений (регрессия)."}, {"q": "Как выбор k влияет на модель?", "a": "Маленькое k (например, 1) — сложная, «рваная» граница, чувствительность к шуму, переобучение. Большое k — сглаженная граница, недообучение. k подбирают на кросс-валидации; для двух классов удобно нечётное k."}, {"q": "Почему для k-NN обязательно масштабирование признаков?", "a": "Прогноз основан на расстояниях. Признак в больших единицах (доход в рублях) полностью «заглушит» признак в малых (возраст в годах)."}, {"q": "Что такое «проклятие размерности» и как оно влияет на k-NN?", "a": "В пространствах высокой размерности расстояния между всеми точками становятся почти одинаковыми, и понятие «ближайшего соседа» теряет смысл. Помогают отбор признаков и понижение размерности."}, {"q": "Почему k-NN медленно делает прогнозы на больших данных?", "a": "Для каждого нового объекта нужно считать расстояния до всей обучающей выборки. Ускоряют KD-деревья, Ball-деревья и приближённый поиск соседей (ANN)."}], "lightgbm_cheatsheet.html": [{"q": "Чем стратегия роста деревьев в LightGBM отличается от XGBoost по умолчанию?", "a": "LightGBM растит деревья **по листьям** (leaf-wise): каждый раз делит лист с наибольшим уменьшением потерь. Классический подход — **по уровням** (level-wise), слой за слоем. Leaf-wise быстрее снижает ошибку, но легче переобучается."}, {"q": "Почему в LightGBM главный параметр сложности — `num_leaves`, а не только `max_depth`?", "a": "При росте по листьям дерево может стать очень глубоким и несимметричным, поэтому сложность ограничивают числом листьев. Ориентир: `num_leaves` меньше 2^max_depth."}, {"q": "За счёт чего LightGBM быстро работает на больших данных?", "a": "Гистограммный алгоритм (значения признаков группируются в корзины), GOSS — выборка объектов с учётом величины градиента, EFB — объединение взаимоисключающих разреженных признаков."}, {"q": "Как LightGBM работает с категориальными признаками?", "a": "Их можно передать напрямую (`categorical_feature`) без one-hot: алгоритм сам ищет оптимальное разбиение категорий на две группы. Для очень редких категорий это может приводить к переобучению — помогают `min_data_per_group` и `cat_smooth`."}, {"q": "Какие параметры помогают, если LightGBM переобучается?", "a": "Уменьшить `num_leaves` и `max_depth`, увеличить `min_child_samples`, использовать `feature_fraction` и `bagging_fraction`, добавить `lambda_l1` и `lambda_l2`, уменьшить `learning_rate` и включить раннюю остановку."}], "lime_cheatsheet.html": [{"q": "Как LIME объясняет один прогноз?", "a": "Генерирует возмущённые версии объекта, получает на них прогнозы чёрного ящика и обучает простую интерпретируемую модель (обычно линейную) с весами по близости к исходному объекту. Коэффициенты этой модели и есть объяснение."}, {"q": "Почему объяснение LIME называют локальным?", "a": "Простая модель хорошо приближает сложную только в окрестности конкретного объекта. Для другого объекта объяснение может быть совсем другим."}, {"q": "Как LIME работает с текстами и изображениями?", "a": "Для текста возмущения — удаление слов, объяснение показывает вклад слов. Для изображений картинку делят на суперпиксели, некоторые «выключают», и объяснение показывает, какие области важны для класса."}, {"q": "Почему объяснения LIME бывают нестабильными?", "a": "Они зависят от случайной выборки возмущений, ширины ядра близости и способа генерации соседей. Два запуска для одного объекта могут дать разные важные признаки."}, {"q": "Чем LIME отличается от SHAP?", "a": "LIME — эвристическая локальная аппроксимация без строгих гарантий. SHAP основан на значениях Шепли с теоретическими свойствами (аддитивность, согласованность) и даёт согласованные локальные и глобальные объяснения, но часто дороже в вычислении."}], "linreg_cheatsheet.html": [{"q": "Какую функцию потерь минимизирует обычная линейная регрессия (МНК)?", "a": "Сумму (или среднее) квадратов остатков: Σ(yᵢ − ŷᵢ)², где ŷ = Xw + b. Отсюда название — метод наименьших квадратов."}, {"q": "Как найти веса аналитически и почему на практике часто используют градиентный спуск?", "a": "Нормальное уравнение: w = (XᵀX)⁻¹Xᵀy. Обращение матрицы стоит порядка O(d³) по числу признаков и численно неустойчиво при мультиколлинеарности, поэтому для больших данных используют итеративные методы."}, {"q": "Как интерпретировать коэффициент при признаке?", "a": "На сколько в среднем изменится прогноз при увеличении признака на единицу, если остальные признаки зафиксированы. Сравнивать коэффициенты между собой можно только после масштабирования признаков."}, {"q": "Что такое мультиколлинеарность и чем она мешает?", "a": "Сильная корреляция между признаками. Веса становятся неустойчивыми (могут менять знак при небольшом изменении данных) и теряют интерпретируемость, хотя прогнозы могут оставаться хорошими. Помогают регуляризация (Ridge) и удаление дублирующих признаков."}, {"q": "Какие предположения лежат в основе классической линейной регрессии?", "a": "Линейная зависимость, независимость наблюдений, постоянная дисперсия остатков (гомоскедастичность), отсутствие сильной мультиколлинеарности; для доверительных интервалов — нормальность остатков. Проверяют по графику остатков."}], "logreg_cheatsheet.html": [{"q": "Как логистическая регрессия получает вероятность из линейной комбинации признаков?", "a": "Применяет сигмоиду к линейной части: p = σ(z) = 1 / (1 + e⁻ᶻ), где z = wᵀx + b. Сигмоида переводит любое число в интервал (0, 1)."}, {"q": "Какую функцию потерь минимизирует логистическая регрессия?", "a": "Логистическую потерю (log loss, бинарную кросс-энтропию): −[y·log p + (1 − y)·log(1 − p)]. Она сильно штрафует уверенные неверные прогнозы. MSE не используют, потому что с сигмоидой задача становится невыпуклой."}, {"q": "Как интерпретировать коэффициент wⱼ?", "a": "Увеличение признака на единицу меняет логарифм шансов log(p / (1 − p)) на wⱼ, т.е. умножает шансы на e^wⱼ при прочих равных. Положительный вес увеличивает вероятность класса 1."}, {"q": "Почему порог 0.5 не всегда правильный?", "a": "При несбалансированных классах или разной цене ошибок (пропустить болезнь хуже, чем ложная тревога) порог подбирают под задачу — по ROC- или PR-кривой либо по нужному соотношению precision и recall."}, {"q": "Какой формы граница между классами у логистической регрессии?", "a": "Линейная: гиперплоскость wᵀx + b = 0. Для нелинейных границ нужно добавлять признаки (полиномиальные, взаимодействия) или использовать другие модели."}], "loss_functions_cheatsheet.html": [{"q": "Какие функции потерь используют для регрессии и чем они отличаются?", "a": "MSE — сильно штрафует большие ошибки, чувствительна к выбросам. MAE — устойчива к выбросам, но у неё постоянный по величине градиент и излом в нуле. Huber — квадратичная для малых ошибок и линейная для больших, компромисс между ними."}, {"q": "Почему для классификации используют кросс-энтропию, а не MSE?", "a": "Кросс-энтропия −Σ yₖ log pₖ сильно штрафует уверенные неверные прогнозы и в паре с softmax/сигмоидой даёт хорошие градиенты (p − y). MSE с сигмоидой в зоне насыщения даёт почти нулевой градиент, и обучение застревает."}, {"q": "Почему в PyTorch в `nn.CrossEntropyLoss` подают логиты, а не вероятности?", "a": "Функция сама применяет log-softmax численно устойчивым способом. Если заранее применить softmax, он будет применён дважды, и обучение испортится."}, {"q": "Чем binary cross-entropy отличается от categorical cross-entropy?", "a": "Бинарная — для одного выхода с вероятностью класса 1 (а также для multi-label, где каждый класс — отдельная бинарная задача). Категориальная — для одного верного класса из нескольких, с softmax по всем классам."}, {"q": "Как функцией потерь учесть дисбаланс классов?", "a": "Задать веса классов (`weight` в `CrossEntropyLoss`, `pos_weight` в `BCEWithLogitsLoss`) или использовать focal loss, которая уменьшает вклад лёгких, уже хорошо классифицированных примеров."}], "lstm_cheatsheet.html": [{"q": "Какие гейты есть в LSTM и что делает каждый?", "a": "Forget gate решает, что стереть из состояния ячейки; input gate — какую новую информацию записать; output gate — какую часть состояния выдать наружу как скрытое состояние hₜ. Каждый гейт — сигмоида со значениями от 0 до 1."}, {"q": "Чем состояние ячейки (cell state) отличается от скрытого состояния?", "a": "Cell state cₜ — «долговременная память», которая обновляется в основном сложением и поэлементным умножением на гейты. Скрытое состояние hₜ = oₜ · tanh(cₜ) — отфильтрованный выход на текущем шаге."}, {"q": "Почему LSTM лучше простой RNN справляется с длинными зависимостями?", "a": "Cell state обновляется аддитивно: cₜ = fₜ·cₜ₋₁ + iₜ·c̃ₜ. Если forget gate близок к 1, градиент проходит через много шагов почти без затухания."}, {"q": "Зачем forget gate часто инициализируют смещением около 1?", "a": "Чтобы в начале обучения сеть по умолчанию сохраняла информацию, а не стирала её. Это облегчает обучение длинным зависимостям."}, {"q": "Сколько параметров у слоя LSTM по сравнению с простой RNN того же размера?", "a": "Примерно в 4 раза больше: у LSTM четыре набора весов (три гейта и кандидат в состояние), у простой RNN — один."}], "matplotlib_seaborn_ml_cheatsheet.html": [{"q": "Какой график выбрать, чтобы посмотреть распределение одного числового признака?", "a": "Гистограмму (`plt.hist`, `sns.histplot`) или оценку плотности (`sns.kdeplot`). Для сравнения распределений между группами — `sns.boxplot` или `sns.violinplot`."}, {"q": "Как быстро увидеть попарные связи между признаками?", "a": "`sns.pairplot(df, hue='target')` — диаграммы рассеяния для всех пар признаков с раскраской по классу; `sns.heatmap(df.corr(), annot=True)` — тепловая карта корреляций."}, {"q": "Что показывает «ящик с усами» (boxplot)?", "a": "Медиану (линия внутри), квартили Q1 и Q3 (границы ящика), «усы» до самых дальних точек в пределах 1.5·IQR и отдельными точками — потенциальные выбросы."}, {"q": "Чем `fig, ax = plt.subplots()` лучше вызовов `plt.plot()` подряд?", "a": "Объектный интерфейс явно указывает, на какой оси рисовать, поэтому легко строить сетку графиков (`plt.subplots(2, 2)`) и настраивать каждый отдельно. Функции `plt.*` работают с «текущей» осью, и в сложных фигурах это путает."}, {"q": "Какие графики полезны для диагностики уже обученной модели?", "a": "Кривые обучения (ошибка на train и validation от размера выборки или эпохи), график остатков для регрессии, матрица ошибок и ROC-кривая для классификации, важность признаков."}], "ml_pipelines_cheatsheet.html": [{"q": "Какие проблемы решает `Pipeline` в scikit-learn?", "a": "Объединяет предобработку и модель в один объект: исключает утечки данных при кросс-валидации, гарантирует одинаковую обработку при обучении и прогнозе, упрощает сериализацию и подбор гиперпараметров всех шагов сразу."}, {"q": "Как задать гиперпараметр шага пайплайна в `GridSearchCV`?", "a": "Через имя шага и двойное подчёркивание: `{'model__C': [0.1, 1, 10], 'scaler__with_mean': [True, False]}`."}, {"q": "Как написать свой шаг для пайплайна?", "a": "Создать класс-наследник `BaseEstimator` и `TransformerMixin` с методами `fit(X, y=None)` (возвращает self) и `transform(X)`. Для простых случаев подойдёт `FunctionTransformer`."}, {"q": "Чем пайплайн обучения модели отличается от «пайплайна» в смысле оркестрации (Airflow, Kubeflow)?", "a": "sklearn `Pipeline` — цепочка преобразований внутри одной модели. Оркестраторы управляют всем процессом: загрузка и проверка данных, генерация признаков, обучение, оценка, регистрация и развёртывание модели — по расписанию и с зависимостями между задачами."}, {"q": "Почему шаги пайплайна данных стоит делать идемпотентными?", "a": "Повторный запуск шага с теми же входами должен давать тот же результат без побочных эффектов (дублей, повторных записей). Тогда упавший шаг можно безопасно перезапустить."}], "mlops_best_practices_cheatsheet.html": [{"q": "Что такое MLOps и чем он отличается от обычного DevOps?", "a": "Практики автоматизации и надёжной эксплуатации ML-систем на всём жизненном цикле. Кроме кода, здесь меняются данные и модели: нужны версионирование данных, отслеживание экспериментов, переобучение, мониторинг дрейфа и качества."}, {"q": "Зачем нужен трекинг экспериментов (MLflow, Weights & Biases)?", "a": "Чтобы для каждого запуска сохранять параметры, метрики, версию кода и данных, артефакты модели. Это позволяет сравнивать эксперименты, воспроизводить лучший результат и понимать, что сработало."}, {"q": "Что такое model registry?", "a": "Хранилище версий моделей с метаданными и стадиями жизненного цикла (staging, production, archived). Через него управляют продвижением моделей и откатом."}, {"q": "Когда и как переобучать модель?", "a": "По расписанию, по сигналу мониторинга (дрейф данных, падение метрик) или при появлении новых размеченных данных. Переобучение должно быть автоматизированным пайплайном с проверкой качества новой модели перед заменой старой."}, {"q": "Что такое shadow deployment и canary release?", "a": "Shadow — новая модель получает реальный трафик и делает прогнозы параллельно, но они не используются: сравнивают поведение без риска. Canary — новую модель включают для небольшой доли пользователей и постепенно расширяют, если метрики в порядке."}], "mlp_cheatsheet.html": [{"q": "Из чего состоит MLP?", "a": "Входной слой, один или несколько скрытых полносвязных слоёв с нелинейной активацией и выходной слой. Каждый нейрон слоя связан со всеми нейронами предыдущего слоя."}, {"q": "Почему без нелинейных активаций многослойная сеть бесполезна?", "a": "Композиция линейных преобразований — тоже линейное преобразование: W₂(W₁x) = (W₂W₁)x. Сколько слоёв ни добавляй, сеть останется эквивалентна одному линейному слою."}, {"q": "Что утверждает теорема об универсальной аппроксимации и чего она НЕ обещает?", "a": "MLP с одним достаточно широким скрытым слоем и нелинейной активацией может сколь угодно точно приблизить любую непрерывную функцию на компакте. Но теорема не говорит, сколько нейронов нужно, и не гарантирует, что градиентный спуск найдёт такие веса."}, {"q": "Сколько параметров у полносвязного слоя со 100 входами и 50 выходами?", "a": "100 · 50 весов + 50 смещений = 5050 параметров."}, {"q": "Какую активацию и функцию потерь ставят на выход MLP для разных задач?", "a": "Регрессия — линейный выход и MSE; бинарная классификация — один нейрон с сигмоидой и бинарная кросс-энтропия; многоклассовая — softmax по классам и кросс-энтропия."}], "model_monitoring_ab_testing_cheatsheet.html": [{"q": "Что нужно мониторить у модели в продакшене?", "a": "Технические показатели (задержка, ошибки, нагрузка), качество входных данных (пропуски, диапазоны, схема), дрейф распределений признаков и прогнозов, качество модели, когда приходят истинные метки, и бизнес-метрики."}, {"q": "Как следить за качеством, если истинные метки приходят с большой задержкой?", "a": "Использовать косвенные сигналы: дрейф входных признаков и распределения прогнозов, уверенность модели, сравнение с бейзлайном; размечать небольшую выборку вручную. Когда метки придут — считать реальные метрики задним числом."}, {"q": "Как устроен A/B-тест новой модели?", "a": "Пользователей случайно делят на группы: контроль (старая модель) и тест (новая). Заранее выбирают целевую метрику, минимальный значимый эффект и размер выборки, после окончания проверяют статистическую значимость разницы."}, {"q": "Почему нельзя останавливать A/B-тест, как только разница стала значимой?", "a": "Многократные «подглядывания» сильно повышают вероятность ложного срабатывания. Длительность теста фиксируют заранее или используют методы последовательного тестирования с поправками."}, {"q": "Чем многорукие бандиты отличаются от A/B-теста?", "a": "A/B-тест держит фиксированное разделение трафика до конца и даёт чистую статистическую оценку. Бандиты по ходу направляют больше трафика лучшему варианту — меньше потерь во время эксперимента, но сложнее строгий статистический вывод."}], "model_serialization_cheatsheet.html": [{"q": "Чем опасна загрузка модели из pickle/joblib-файла из недоверенного источника?", "a": "При распаковке pickle может выполнить произвольный код. Загружать такие файлы можно только из доверенных источников; для обмена весами нейросетей безопаснее формат safetensors."}, {"q": "Почему вместе с моделью нужно сохранять предобработку?", "a": "Новые данные должны проходить те же преобразования с теми же параметрами (средние скейлера, словарь кодировщика). Проще всего сериализовать весь sklearn `Pipeline` целиком."}, {"q": "Почему модель, сохранённая через joblib, может не загрузиться после обновления библиотек?", "a": "Pickle хранит ссылки на классы и их внутреннюю структуру конкретной версии библиотеки. При смене версии sklearn или Python структура может измениться. Поэтому фиксируют версии окружения рядом с моделью."}, {"q": "Чем в PyTorch сохранение `state_dict` лучше сохранения всей модели?", "a": "`torch.save(model.state_dict(), path)` хранит только тензоры весов; класс модели создаётся кодом, и веса загружаются в него. Сохранение объекта целиком через pickle жёстко привязано к структуре кода и путям модулей и ломается при рефакторинге."}, {"q": "Зачем нужен ONNX?", "a": "Открытый формат представления моделей, независимый от фреймворка. Позволяет обучить модель в PyTorch или sklearn и запускать её в ONNX Runtime на другом языке или устройстве, часто с ускорением инференса."}], "multi_armed_bandits_cheatsheet.html": [{"q": "Чем задача многорукого бандита отличается от полной задачи RL?", "a": "Нет состояний и последствий действий для будущего: на каждом шаге выбирается одна «рука» и сразу получается награда. Остаётся только дилемма exploration vs exploitation."}, {"q": "Что такое regret?", "a": "Разница между суммарной наградой, которую дала бы всегда лучшая рука, и реально полученной. Хорошие алгоритмы обеспечивают регрет, растущий логарифмически по числу шагов."}, {"q": "Как работает алгоритм UCB?", "a": "Выбирает руку с максимальной верхней границей доверия: среднее награды + c·√(ln t / nₐ). Редко пробованные руки получают бонус за неопределённость — это «оптимизм перед лицом неопределённости»."}, {"q": "Как работает Thompson Sampling?", "a": "Для каждой руки поддерживается апостериорное распределение её средней награды (например, Beta для бинарных наград). На каждом шаге из каждого распределения сэмплируется значение и выбирается рука с максимальным сэмплом."}, {"q": "Что такое контекстные бандиты и где их применяют?", "a": "Перед выбором руки наблюдается контекст (признаки пользователя, времени, страницы), и лучшая рука зависит от него. Применяют в персонализированных рекомендациях, рекламе и выборе вариантов интерфейса (LinUCB и подобные)."}], "multi_head_attention_cheatsheet.html": [{"q": "Зачем использовать несколько голов внимания вместо одной?", "a": "Каждая голова работает в своём подпространстве со своими проекциями Q, K, V и может улавливать разные типы связей: синтаксические, позиционные, смысловые. Одна голова усредняла бы их в одно распределение."}, {"q": "Как формируется выход multi-head attention?", "a": "Каждая из h голов считает внимание независимо, их выходы конкатенируются и умножаются на выходную матрицу W_O, возвращающую размерность d_model."}, {"q": "Увеличивает ли переход к 8 головам число параметров по сравнению с одной головой того же d_model?", "a": "Практически нет: размерность каждой головы берут d_model / h, поэтому суммарный размер проекций остаётся тем же. Меняется только способ разбиения пространства."}, {"q": "Если d_model = 512 и голов 8, какая размерность у каждой головы?", "a": "512 / 8 = 64 — это d_k и d_v для каждой головы, как в оригинальном Transformer."}, {"q": "Что такое multi-query и grouped-query attention и зачем они нужны?", "a": "Варианты, в которых головы делят ключи и значения: в MQA одна пара K, V на все головы, в GQA — по одной на группу голов. Это сильно уменьшает KV-кэш и ускоряет генерацию в больших языковых моделях почти без потери качества."}], "naive_bayes_cheatsheet.html": [{"q": "В чём «наивность» наивного Байеса?", "a": "Предполагается, что признаки **условно независимы** при известном классе: P(x₁, …, xₙ | y) = Π P(xᵢ | y). В реальности это почти никогда не так, но классификатор часто всё равно работает хорошо."}, {"q": "Запишите, как наивный Байес выбирает класс.", "a": "ŷ = argmax_y P(y) · Π P(xᵢ | y) — априорная вероятность класса, умноженная на правдоподобие признаков. Знаменатель P(x) одинаков для всех классов, поэтому его не считают. На практике складывают логарифмы, чтобы избежать переполнения снизу."}, {"q": "Зачем нужно сглаживание Лапласа?", "a": "Если слово ни разу не встречалось в документах класса, P(слово | класс) = 0 и всё произведение обнулится. Сглаживание добавляет к каждому счётчику небольшую константу (α = 1), и нулевых вероятностей не остаётся."}, {"q": "Чем отличаются GaussianNB, MultinomialNB и BernoulliNB?", "a": "GaussianNB — непрерывные признаки с нормальным распределением внутри класса. MultinomialNB — счётчики (частоты слов в тексте). BernoulliNB — бинарные признаки (слово есть или нет)."}, {"q": "Почему вероятностям наивного Байеса не стоит слепо доверять?", "a": "Из-за предположения независимости коррелированные признаки «учитываются дважды», и вероятности получаются слишком близкими к 0 или 1. Ранжирование при этом часто хорошее; если нужны точные вероятности, их калибруют."}], "neural_style_transfer_cheatsheet.html": [{"q": "В чём идея переноса стиля по Gatys?", "a": "Оптимизируется само изображение (не веса сети): оно должно совпадать с изображением-содержанием по глубоким признакам предобученной CNN (обычно VGG) и с изображением-стилем — по статистикам признаков нескольких слоёв."}, {"q": "Что такое матрица Грама и почему она описывает стиль?", "a": "G = FFᵀ — попарные корреляции между каналами карты признаков, усреднённые по всем позициям. Она отражает, какие текстуры и цвета встречаются вместе, но теряет информацию о том, где именно, — это и есть стиль без содержания."}, {"q": "Почему content loss берут с глубоких слоёв?", "a": "Глубокие слои кодируют объекты и их расположение, но не точные пиксели. Совпадение по ним сохраняет структуру сцены, оставляя свободу для изменения текстуры."}, {"q": "Чем быстрый перенос стиля (Johnson et al.) отличается от исходного метода?", "a": "Вместо долгой оптимизации каждого изображения обучается отдельная сеть-преобразователь, которая переносит один стиль за один прямой проход — в реальном времени. Обучается она с теми же perceptual losses."}, {"q": "Как AdaIN позволяет переносить произвольный стиль одной моделью?", "a": "Adaptive Instance Normalization выравнивает среднее и стандартное отклонение каждого канала признаков содержания под статистики признаков стиля. Стиль задаётся на лету, переобучать модель под каждый стиль не нужно."}], "nlp_tasks_ner_classification_summarization_cheatsheet.html": [{"q": "Как задача NER (распознавание именованных сущностей) формулируется для модели?", "a": "Как разметка последовательности: каждому токену присваивается метка в схеме BIO — B-PER (начало имени), I-PER (продолжение), O (не сущность) и т.д. Модель классифицирует каждый токен."}, {"q": "Почему метрика NER считается по сущностям, а не по токенам?", "a": "Важно найти сущность целиком с правильными границами и типом. Частично найденное имя — ошибка, хотя большинство его токенов размечено верно. Поэтому считают precision, recall и F1 по точным совпадениям сущностей (seqeval)."}, {"q": "Чем экстрактивная суммаризация отличается от абстрактивной?", "a": "Экстрактивная выбирает и склеивает важные предложения исходного текста. Абстрактивная генерирует новый текст своими словами (seq2seq-модели, LLM) — пересказ получается связнее, но есть риск выдуманных фактов."}, {"q": "Как оценивают качество суммаризации и почему ROUGE недостаточно?", "a": "ROUGE считает пересечение n-грамм с эталонными пересказами. Он не учитывает синонимы и перефразирование и не проверяет фактическую верность, поэтому дополняют оценкой людьми, BERTScore и проверками соответствия фактам источника."}, {"q": "Как подойти к классификации текстов, если размеченных примеров очень мало?", "a": "Zero-shot или few-shot классификация с LLM, дообучение небольшой предобученной модели (SetFit), эмбеддинги предложений плюс логистическая регрессия, активная разметка самых информативных примеров."}], "numpy_ml_cheatsheet.html": [{"q": "Чем массив NumPy отличается от списка Python и почему он быстрее?", "a": "Массив хранит элементы **одного типа** в непрерывном блоке памяти, а операции над ним выполняются в скомпилированном C-коде сразу над всем массивом (векторизация). Список хранит ссылки на отдельные объекты Python, и цикл по нему интерпретируется поэлементно."}, {"q": "Что такое broadcasting? Приведите пример.", "a": "Правило, по которому NumPy выполняет операции над массивами разной формы: размерности сравниваются с конца, и измерение длины 1 «растягивается». Пример: `X - X.mean(axis=0)` — из матрицы `(n, d)` вычитается вектор средних `(d,)`, и каждая строка центрируется."}, {"q": "Что означает `axis=0` в `X.sum(axis=0)` для матрицы «объекты × признаки»?", "a": "Суммирование **вдоль** оси 0, т.е. по строкам: результат — по одному числу на каждый столбец (признак), форма `(d,)`. `axis=1` даёт сумму по каждой строке (объекту)."}, {"q": "Чем отличаются `A * B` и `A @ B`?", "a": "`A * B` — поэлементное умножение (с broadcasting). `A @ B` — матричное умножение: число столбцов `A` должно совпадать с числом строк `B`."}, {"q": "Почему изменение среза `b = a[1:3]` может изменить исходный массив `a`?", "a": "Обычный срез возвращает **представление** (view) на те же данные, а не копию. Чтобы получить независимый массив, нужен `a[1:3].copy()`. Индексация списком или маской (`a[[0, 2]]`, `a[a > 0]`) всегда создаёт копию."}], "object_detection_cheatsheet.html": [{"q": "Как устроен Faster R-CNN?", "a": "Общая CNN-основа строит карты признаков, Region Proposal Network предлагает области-кандидаты на основе якорей, RoI pooling (или RoIAlign) вырезает признаки каждой области, а голова классифицирует её и уточняет рамку."}, {"q": "Зачем нужна Feature Pyramid Network (FPN)?", "a": "Объекты бывают разного размера. FPN объединяет глубокие (смысловые, но грубые) и ранние (точные, но простые) карты признаков сверху вниз и детектирует объекты на нескольких масштабах — особенно улучшается поиск маленьких объектов."}, {"q": "Какую проблему решает focal loss в RetinaNet?", "a": "У одностадийных детекторов огромное число лёгких фоновых примеров заглушает обучение. Focal loss уменьшает вес хорошо классифицированных примеров множителем (1 − p)^γ, и обучение фокусируется на трудных."}, {"q": "Чем DETR отличается от классических детекторов?", "a": "DETR — трансформер, который напрямую предсказывает фиксированный набор объектов. Сопоставление с разметкой делается венгерским алгоритмом (bipartite matching), поэтому не нужны якоря и NMS."}, {"q": "Почему маленькие объекты детектировать особенно трудно?", "a": "После нескольких понижений разрешения от них остаётся несколько пикселей на картах признаков, а в датасетах их часто меньше. Помогают FPN, входы большего разрешения, нарезка изображения на тайлы и аугментации с копированием объектов."}], "optimizers_cheatsheet.html": [{"q": "Что добавляет momentum к обычному SGD?", "a": "Экспоненциальное среднее прошлых градиентов («инерцию»): v ← βv + ∇L, θ ← θ − ηv. Это гасит колебания поперёк «оврага» функции потерь и ускоряет движение вдоль него."}, {"q": "В чём идея адаптивных методов (AdaGrad, RMSProp)?", "a": "Делить шаг каждого параметра на корень из накопленных квадратов его градиентов: параметры с большими градиентами получают меньший шаг, редко обновляемые — больший. RMSProp использует скользящее среднее, поэтому шаг не затухает до нуля, как в AdaGrad."}, {"q": "Как устроен Adam?", "a": "Совмещает momentum (первый момент — среднее градиентов) и RMSProp (второй момент — среднее квадратов) с поправкой на смещение в начале обучения. Обычно хорошо работает со стандартными параметрами (lr = 1e-3, β₁ = 0.9, β₂ = 0.999)."}, {"q": "Чем AdamW отличается от Adam с L2-регуляризацией?", "a": "В Adam L2-штраф добавляется в градиент и затем масштабируется адаптивным знаменателем — регуляризация работает неравномерно. AdamW применяет затухание весов (weight decay) напрямую к параметрам, отдельно от адаптивного шага; это стандарт для трансформеров."}, {"q": "Зачем нужны расписания learning rate и warmup?", "a": "Большой шаг в начале ускоряет обучение, малый в конце позволяет точнее сойтись (cosine, step decay). Warmup — плавное увеличение lr в первые шаги, пока статистики адаптивных оптимизаторов не стабилизировались; без него большие модели часто расходятся."}], "optuna_hyperopt_cheatsheet.html": [{"q": "Как выглядит минимальный подбор гиперпараметров в Optuna?", "a": "Пишется функция `objective(trial)`, в которой значения запрашиваются через `trial.suggest_float/int/categorical`, обучается модель и возвращается метрика. Затем `study = optuna.create_study(direction='maximize')` и `study.optimize(objective, n_trials=100)`."}, {"q": "Что такое «define-by-run» в Optuna и чем это удобно?", "a": "Пространство поиска задаётся прямо в коде функции во время выполнения. Поэтому легко делать условные параметры: например, спрашивать `max_depth` только если выбран тип модели «дерево»."}, {"q": "Какой алгоритм по умолчанию используют Optuna и Hyperopt?", "a": "TPE (Tree-structured Parzen Estimator): по результатам прошлых попыток строятся две плотности — для «хороших» и «плохих» значений, — и выбираются точки с наибольшим отношением этих плотностей."}, {"q": "Что такое pruning и зачем он нужен?", "a": "Досрочная остановка неперспективных попыток по промежуточным результатам (например, после нескольких эпох). В Optuna: `trial.report(value, step)` и проверка `trial.should_prune()` с прунером вроде `MedianPruner`. Экономит много вычислений."}, {"q": "Как не переобучиться при долгом подборе гиперпараметров?", "a": "Оценивать каждую попытку кросс-валидацией, а не одним разбиением; держать отдельный тест и проверять на нём только финальную конфигурацию; не делать подбор бесконечно долгим на маленьких данных."}], "outliers_handling_cheatsheet.html": [{"q": "Как найти выбросы методом IQR?", "a": "IQR = Q3 − Q1. Выбросы — значения меньше Q1 − 1.5·IQR или больше Q3 + 1.5·IQR. Метод не требует нормальности распределения."}, {"q": "Как найти выбросы по z-оценке и когда метод плохо работает?", "a": "z = (x − среднее) / стандартное отклонение; выбросом считают |z| > 3. Метод предполагает распределение, близкое к нормальному, а сами выбросы смещают среднее и раздувают отклонение — поэтому на сильно скошенных данных он ненадёжен."}, {"q": "Всегда ли выбросы нужно удалять?", "a": "Нет. Выброс может быть ошибкой измерения (тогда исправить или удалить), а может быть редким, но реальным и важным случаем — например, мошеннической транзакцией. Сначала нужно понять природу выброса."}, {"q": "Какие есть альтернативы удалению выбросов?", "a": "Обрезка значений по перцентилям (winsorizing, `clip`), логарифмирование и другие преобразования скошенных признаков, робастное масштабирование (`RobustScaler`), устойчивые модели и функции потерь (деревья, Huber loss)."}, {"q": "Какие модели чувствительны к выбросам, а какие устойчивы?", "a": "Чувствительны: линейная регрессия с MSE, k-NN, k-means, модели на расстояниях. Относительно устойчивы: деревья решений и ансамбли на их основе, модели с MAE или Huber loss."}], "overfitting_underfitting_cheatsheet.html": [{"q": "Что такое переобучение и как его заметить?", "a": "Модель запоминает обучающие данные вместе с шумом и плохо обобщает. Признак — заметно лучшее качество на train, чем на validation или test."}, {"q": "Что такое недообучение и как с ним бороться?", "a": "Модель слишком проста, чтобы уловить закономерность: ошибка высокая уже на обучающей выборке. Помогают более сложная модель, новые признаки, ослабление регуляризации, более долгое обучение."}, {"q": "Перечислите способы бороться с переобучением.", "a": "Больше данных или аугментация; регуляризация (L1/L2, dropout); упрощение модели (меньше глубина, меньше параметров); ранняя остановка; отбор признаков; ансамбли (бэггинг)."}, {"q": "Почему нельзя подбирать гиперпараметры по тестовой выборке?", "a": "Тест перестаёт быть независимой оценкой: модель неявно подгоняется под него, и итоговое качество окажется оптимистично завышенным. Для подбора используют валидационную выборку или кросс-валидацию, а тест — один раз в конце."}, {"q": "Как ранняя остановка (early stopping) защищает от переобучения?", "a": "Во время обучения следят за ошибкой на валидации и останавливаются, когда она перестаёт улучшаться несколько итераций подряд, — до того как модель начнёт подгоняться под шум."}], "pandas_ml_cheatsheet.html": [{"q": "Чем отличаются `df.loc` и `df.iloc`?", "a": "`loc` выбирает по **меткам** индекса и названиям столбцов (срез `loc[a:b]` включает правую границу), `iloc` — по **целочисленным позициям** (правая граница не включается)."}, {"q": "Как найти и посчитать пропуски в DataFrame?", "a": "`df.isna().sum()` — число пропусков в каждом столбце, `df.isna().mean()` — их доля. Строки с пропусками: `df[df.isna().any(axis=1)]`."}, {"q": "Что делает `groupby` и как посчитать средний чек по городам?", "a": "`groupby` разбивает таблицу на группы по значениям ключа, применяет к каждой агрегирующую функцию и собирает результат: `df.groupby('city')['amount'].mean()`. Несколько метрик сразу: `.agg(['mean', 'count'])`."}, {"q": "Чем `merge` отличается от `concat`?", "a": "`merge` соединяет таблицы **по ключу** (как SQL JOIN: `inner`, `left`, `outer`). `concat` просто склеивает таблицы вдоль оси — друг под другом или рядом — без сопоставления по ключу."}, {"q": "Почему предупреждение `SettingWithCopyWarning` стоит воспринимать всерьёз?", "a": "Присваивание вида `df[df.a > 0]['b'] = 1` может изменить временную копию, а не исходную таблицу, — и изменение молча потеряется. Правильно: `df.loc[df.a > 0, 'b'] = 1`."}], "partial_dependence_cheatsheet.html": [{"q": "Что показывает график частичной зависимости (PDP)?", "a": "Как в среднем меняется прогноз модели при изменении одного (или двух) признаков, когда остальные признаки берутся из данных и усредняются."}, {"q": "Как строится PDP?", "a": "Для каждого значения признака из сетки оно подставляется всем объектам выборки вместо настоящего, считаются прогнозы и усредняются. Получается одна кривая."}, {"q": "Что такое ICE-кривые и что они показывают сверх PDP?", "a": "Individual Conditional Expectation — такие же кривые, но для каждого объекта отдельно, без усреднения. PDP — их среднее. Если ICE-кривые идут в разные стороны, значит, есть взаимодействия признаков, которые усреднение скрывает."}, {"q": "Чем опасен PDP при коррелированных признаках?", "a": "Подстановка значений создаёт нереалистичные объекты (например, рост 2 м при весе 40 кг), и модель экстраполирует. ALE-графики (Accumulated Local Effects) решают эту проблему, используя только локальные изменения в реалистичных областях."}, {"q": "Как построить PDP в scikit-learn?", "a": "`from sklearn.inspection import PartialDependenceDisplay` и `PartialDependenceDisplay.from_estimator(model, X, features=['age'])`; параметр `kind='both'` рисует и PDP, и ICE."}], "perceptron_cheatsheet.html": [{"q": "Как искусственный нейрон вычисляет выход?", "a": "Считает взвешенную сумму входов плюс смещение z = wᵀx + b и применяет к ней функцию активации: y = f(z). У классического перцептрона f — пороговая (ступенчатая) функция."}, {"q": "Как обновляются веса в правиле обучения перцептрона?", "a": "Только на ошибочных примерах: w ← w + η·(y − ŷ)·x, b ← b + η·(y − ŷ). Если пример классифицирован верно, веса не меняются."}, {"q": "Почему один перцептрон не может решить задачу XOR?", "a": "Перцептрон строит линейную границу (гиперплоскость), а классы XOR линейно неразделимы: никакая прямая не отделяет (0,1) и (1,0) от (0,0) и (1,1). Нужен хотя бы один скрытый слой."}, {"q": "Что гарантирует теорема сходимости перцептрона?", "a": "Если классы линейно разделимы, алгоритм за конечное число шагов найдёт разделяющую гиперплоскость. Если неразделимы — веса будут колебаться бесконечно."}, {"q": "Зачем нейрону смещение (bias)?", "a": "Без смещения разделяющая гиперплоскость обязана проходить через начало координат. Смещение позволяет сдвигать порог срабатывания независимо от входов."}], "policy_gradient_cheatsheet.html": [{"q": "Чем методы градиента политики отличаются от value-based методов (DQN)?", "a": "Они напрямую параметризуют политику π(a|s) нейросетью и оптимизируют её градиентным подъёмом по ожидаемой награде. Это естественно работает с непрерывными действиями и стохастическими политиками."}, {"q": "Как выглядит градиент в алгоритме REINFORCE?", "a": "∇J = E[∇ log π(a|s) · Gₜ], где Gₜ — суммарная награда после шага t. Вероятность действий, за которыми последовала большая награда, увеличивается."}, {"q": "Зачем вычитать baseline из возврата и почему это не вносит смещения?", "a": "Оценки REINFORCE очень шумные. Вычитание базовой линии b(s) (обычно V(s)) уменьшает дисперсию. Смещения нет, потому что E[∇ log π(a|s)·b(s)] = 0: baseline не зависит от действия."}, {"q": "Что такое actor-critic?", "a": "Комбинация двух сетей: актор (политика) выбирает действия, критик (функция ценности) оценивает их и даёт актору менее шумный сигнал — преимущество A(s, a) ≈ r + γV(s') − V(s) вместо полного возврата."}, {"q": "Почему policy gradient методы обычно менее эффективны по данным, чем Q-learning?", "a": "Классические варианты on-policy: опыт должен собираться текущей политикой и после обновления устаревает, переиспользовать старые данные напрямую нельзя."}], "polynomial_regression_cheatsheet.html": [{"q": "Почему полиномиальная регрессия всё ещё считается линейной моделью?", "a": "Она линейна по **параметрам**: признаки x, x², x³… создаются заранее (`PolynomialFeatures`), а затем обучается обычная линейная регрессия на расширенном наборе признаков."}, {"q": "Что происходит при слишком большой степени полинома?", "a": "Модель начинает проходить почти через каждую точку обучающей выборки и сильно колеблется между ними — классическое переобучение (высокая дисперсия), особенно на краях диапазона."}, {"q": "Как выбрать степень полинома?", "a": "Перебрать несколько степеней и сравнить ошибку на кросс-валидации; выбрать степень с минимальной ошибкой на валидации, а не на обучении."}, {"q": "Сколько признаков даст `PolynomialFeatures(degree=2)` для 3 исходных признаков?", "a": "10: константа (1), 3 исходных признака, 3 квадрата и 3 попарных произведения. С ростом степени и числа признаков их количество растёт комбинаторно."}, {"q": "Почему перед полиномиальными признаками важно масштабирование?", "a": "Степени больших значений (например, 1000³) дают огромные числа: страдает численная устойчивость, а при регуляризации признаки разных масштабов штрафуются несопоставимо."}], "pooling_layers_cheatsheet.html": [{"q": "Зачем в CNN нужен пулинг?", "a": "Уменьшает пространственный размер карт признаков (меньше вычислений и памяти), увеличивает рецептивное поле следующих слоёв и даёт небольшую устойчивость к сдвигам."}, {"q": "Чем max pooling отличается от average pooling?", "a": "Max берёт максимум в окне — сохраняет самые сильные срабатывания признака. Average усредняет — сглаживает. В промежуточных слоях классических CNN чаще используют max pooling."}, {"q": "Есть ли у пулинг-слоя обучаемые параметры?", "a": "Нет, это фиксированная операция. Обучаемая альтернатива — свёртка со stride 2, которую используют многие современные архитектуры."}, {"q": "Что такое global average pooling и чем он удобен?", "a": "Усреднение каждой карты признаков целиком в одно число: тензор C×H×W превращается в вектор длины C. Он заменяет большие полносвязные слои в конце сети, резко сокращает число параметров и позволяет подавать изображения разного размера."}, {"q": "Как max pooling 2×2 со stride 2 изменит тензор 64×56×56?", "a": "Получится 64×28×28: число каналов не меняется, высота и ширина уменьшаются вдвое."}], "pose_estimation_cheatsheet.html": [{"q": "Что предсказывают модели оценки позы?", "a": "Координаты ключевых точек тела (суставы: плечи, локти, колени и т.д.) в 2D на изображении или в 3D. Соединение точек даёт «скелет» человека."}, {"q": "Чем top-down подход отличается от bottom-up?", "a": "Top-down: сначала детектор находит людей, затем для каждого отдельно ищутся ключевые точки — точно, но время растёт с числом людей. Bottom-up: сначала находятся все ключевые точки на изображении, потом группируются по людям (как в OpenPose) — скорость почти не зависит от числа людей."}, {"q": "Почему ключевые точки часто предсказывают через тепловые карты, а не прямой регрессией координат?", "a": "Сеть выдаёт для каждой точки карту вероятностей её положения. Такое представление сохраняет пространственную структуру и обучается устойчивее, чем регрессия двух чисел, и естественно выражает неопределённость."}, {"q": "Как OpenPose связывает найденные точки в скелеты разных людей?", "a": "С помощью Part Affinity Fields — векторных полей, кодирующих направление конечностей между парами точек. По ним оценивается, какие точки принадлежат одной конечности одного человека."}, {"q": "Какая метрика используется для оценки позы на COCO?", "a": "OKS (Object Keypoint Similarity) — аналог IoU для ключевых точек, учитывающий масштаб человека и разную точность разметки для разных суставов; по ней считается AP."}], "ppo_reinforcement_learning_cheatsheet.html": [{"q": "Какую проблему обычных policy gradient методов решает PPO?", "a": "Слишком большое обновление политики может резко её ухудшить, и обучение «срывается». PPO ограничивает, насколько новая политика может отличаться от старой за одно обновление."}, {"q": "Как устроена clipped-целевая функция PPO?", "a": "rₜ = π_new(a|s) / π_old(a|s); цель — E[min(rₜ·Aₜ, clip(rₜ, 1 − ε, 1 + ε)·Aₜ)], обычно ε = 0.2. Когда отношение выходит за пределы, выгода от дальнейшего изменения обнуляется."}, {"q": "Почему PPO может делать несколько эпох обновлений на одних и тех же данных?", "a": "Благодаря ограничению изменения политики можно несколько раз пройтись мини-батчами по собранной траектории без риска разрушительного обновления. Это повышает эффективность использования данных по сравнению с REINFORCE."}, {"q": "Что такое GAE и зачем он используется в PPO?", "a": "Generalized Advantage Estimation — оценка преимущества как экспоненциально взвешенная сумма TD-ошибок с параметром λ. Позволяет балансировать смещение (λ → 0) и дисперсию (λ → 1) оценки."}, {"q": "Где PPO применяется помимо игр и робототехники?", "a": "В RLHF для языковых моделей: политика — языковая модель, награда — модель предпочтений людей, а штраф по KL-дивергенции к исходной модели не даёт ей слишком отклониться."}], "preprocessing_cheatsheet.html": [{"q": "Из каких основных шагов состоит предобработка табличных данных?", "a": "Анализ данных (типы, распределения, пропуски), обработка пропусков, обработка выбросов, кодирование категориальных признаков, масштабирование числовых, создание и отбор признаков, разбиение на train/validation/test."}, {"q": "Почему предобработку нужно обучать только на обучающей выборке?", "a": "Параметры преобразований (среднее, медиана, словарь категорий) — тоже «знание о данных». Если вычислить их по всей выборке, информация из теста попадёт в обучение (утечка данных), и оценка качества будет завышена."}, {"q": "Зачем нужен `Pipeline` в scikit-learn?", "a": "Он объединяет предобработку и модель в один объект: `fit` обучает все шаги на train, `predict` применяет их к новым данным. Это защищает от утечек при кросс-валидации и упрощает развёртывание."}, {"q": "Как обработать числовые и категориальные столбцы по-разному в одном конвейере?", "a": "Через `ColumnTransformer`: например, `StandardScaler` для числовых столбцов и `OneHotEncoder` для категориальных, затем результат передаётся модели внутри `Pipeline`."}, {"q": "Каким моделям масштабирование признаков нужно, а каким нет?", "a": "Нужно — моделям, основанным на расстояниях и градиентах: k-NN, SVM, линейные модели с регуляризацией, нейросети, PCA. Не нужно — деревьям и ансамблям на деревьях: разбиения по порогу не зависят от масштаба."}], "production_ml_best_practices_cheatsheet.html": [{"q": "Что такое training-serving skew и как его избежать?", "a": "Расхождение между тем, как признаки считаются при обучении и в продакшене (разный код, разные источники данных, разное время). Лечится единым кодом предобработки (сериализуемый пайплайн, feature store) и сравнением распределений признаков в обучении и в продакшене."}, {"q": "Почему перед сложной моделью нужен простой бейзлайн?", "a": "Он показывает, сколько на самом деле даёт сложность, быстро проверяет весь конвейер от данных до прогноза и служит запасным вариантом. Иногда простая эвристика или логистическая регрессия почти так же хороша и намного дешевле в поддержке."}, {"q": "Чем онлайн-инференс отличается от пакетного (batch)?", "a": "Batch — прогнозы считаются заранее по расписанию для многих объектов и сохраняются (рекомендации на завтра). Онлайн — прогноз по запросу в реальном времени с ограничением по задержке (антифрод при оплате)."}, {"q": "Что нужно версионировать в ML-проекте, кроме кода?", "a": "Данные (или их снимки), признаки, модели и их артефакты, гиперпараметры, окружение (версии библиотек), метрики экспериментов. Без этого нельзя воспроизвести модель или откатиться к прошлой версии."}, {"q": "Почему метрика на офлайн-тесте не гарантирует успех в продакшене?", "a": "Тест может не отражать будущие данные (дрейф), офлайн-метрика может плохо связана с бизнес-метрикой, а поведение пользователей меняется в ответ на саму модель. Поэтому модели проверяют A/B-тестом и постоянно мониторят."}], "prompt_engineering_cheatsheet.html": [{"q": "Чем zero-shot отличается от few-shot промптинга?", "a": "Zero-shot — только описание задачи без примеров. Few-shot — в промпт добавляют несколько примеров «вход → выход», и модель продолжает по образцу (in-context learning) без изменения весов."}, {"q": "Что такое chain-of-thought и когда он помогает?", "a": "Просьба рассуждать по шагам перед ответом (или примеры с рассуждениями). Помогает в многошаговых задачах — арифметике, логике, планировании, — потому что промежуточные шаги становятся частью контекста, на который опирается ответ."}, {"q": "Какие элементы делают промпт хорошим?", "a": "Чёткая задача и контекст, роль или аудитория, требования к формату ответа, ограничения, примеры, разделение инструкций и данных (например, тегами или разметкой)."}, {"q": "Что такое prompt injection и почему это проблема?", "a": "Инструкции, спрятанные во входных данных (письме, веб-странице, документе), которые пытаются переопределить исходную задачу модели. Опасно для приложений, где модель обрабатывает недоверенный текст и может выполнять действия."}, {"q": "Что такое RAG и какую проблему он решает?", "a": "Retrieval-Augmented Generation: по запросу находятся релевантные документы (например, векторным поиском) и добавляются в промпт. Модель отвечает с опорой на актуальные и проверяемые данные, а не только на то, что запомнила при обучении, — это снижает число выдуманных фактов."}], "prophet_time_series_cheatsheet.html": [{"q": "Из каких компонент складывается модель Prophet?", "a": "y(t) = g(t) + s(t) + h(t) + ε: тренд (кусочно-линейный или логистический), сезонности (рядами Фурье: годовая, недельная, дневная), эффекты праздников и шум."}, {"q": "Какой формат данных ожидает Prophet?", "a": "DataFrame с колонками `ds` (дата и время) и `y` (значение). Дополнительные регрессоры добавляются через `add_regressor` и должны быть известны и для будущих дат."}, {"q": "Что такое точки изменения тренда (changepoints) и как контролировать их гибкость?", "a": "Моменты, где может измениться наклон тренда. Prophet расставляет кандидатов автоматически; параметр `changepoint_prior_scale` регулирует гибкость: больше — тренд точнее следует данным, но выше риск переобучения."}, {"q": "Как учесть праздники и особые события?", "a": "Передать таблицу праздников с датами (и окнами до/после) в параметр `holidays` или использовать встроенные `add_country_holidays`. Модель оценит отдельный эффект каждого события."}, {"q": "В каких случаях Prophet работает плохо?", "a": "На рядах без выраженной сезонности и тренда, с короткой историей, со сложными зависимостями от внешних факторов и при прогнозе на короткий горизонт по высокочастотным данным. Его стоит сравнивать с простыми бейзлайнами (сезонный наивный прогноз, ETS)."}], "pytorch_full_guide_cheatsheet.html": [{"q": "Из каких шагов состоит одна итерация цикла обучения в PyTorch?", "a": "`optimizer.zero_grad()` → прямой проход `pred = model(x)` → `loss = criterion(pred, y)` → `loss.backward()` → `optimizer.step()`."}, {"q": "Зачем вызывать `model.train()` и `model.eval()`?", "a": "Они переключают поведение слоёв, которые работают по-разному при обучении и инференсе: Dropout отключается в eval, BatchNorm в eval использует накопленные статистики вместо статистик батча."}, {"q": "Что делает `torch.no_grad()` и когда его использовать?", "a": "Отключает построение графа вычислений для автодифференцирования. Используется при валидации и инференсе: экономит память и время, ведь градиенты там не нужны."}, {"q": "Какая ошибка будет, если модель на GPU, а данные на CPU, и как её избежать?", "a": "RuntimeError о тензорах на разных устройствах. Модель и каждый батч нужно перенести на одно устройство: `model.to(device)`, `x, y = x.to(device), y.to(device)`."}, {"q": "Зачем нужны `Dataset` и `DataLoader`?", "a": "`Dataset` описывает, как получить один пример по индексу (`__len__`, `__getitem__`). `DataLoader` собирает примеры в батчи, перемешивает их (`shuffle=True` для обучения) и может загружать данные параллельно (`num_workers`)."}], "pytorch_lightning_cheatsheet.html": [{"q": "Какую проблему решает PyTorch Lightning?", "a": "Убирает шаблонный код обучения: цикл по эпохам, перенос на устройства, логирование, чекпоинты, распределённое обучение. Исследовательская логика остаётся в `LightningModule`, «инженерия» — в `Trainer`."}, {"q": "Какие методы обычно определяют в `LightningModule`?", "a": "`forward` (по желанию), `training_step` (возвращает loss), `validation_step`, `configure_optimizers`; при необходимости `test_step` и `predict_step`."}, {"q": "Нужно ли в Lightning вызывать `loss.backward()`, `optimizer.step()` и `.to(device)` вручную?", "a": "Нет: при автоматической оптимизации `Trainer` делает это сам. Достаточно вернуть loss из `training_step`, а устройство задаётся параметрами `Trainer(accelerator=..., devices=...)`."}, {"q": "Как в Lightning включить раннюю остановку и сохранение лучшей модели?", "a": "Передать в `Trainer(callbacks=[...])` колбэки `EarlyStopping(monitor='val_loss')` и `ModelCheckpoint(monitor='val_loss')`; метрику нужно логировать через `self.log('val_loss', loss)`."}, {"q": "Как в Lightning обучать в смешанной точности и на нескольких GPU?", "a": "Параметрами `Trainer`: `precision='16-mixed'` (или `'bf16-mixed'`), `devices=4`, `strategy='ddp'`. Код модели при этом менять не нужно."}], "q_learning_sarsa_cheatsheet.html": [{"q": "Запишите правило обновления Q-learning.", "a": "Q(s, a) ← Q(s, a) + α·[r + γ·maxₐ' Q(s', a') − Q(s, a)]. Выражение в скобках — TD-ошибка: разница между новой оценкой и текущей."}, {"q": "Чем SARSA отличается от Q-learning?", "a": "SARSA использует Q(s', a') для действия a', которое агент действительно выберет по текущей политике (on-policy). Q-learning использует максимум по действиям в s' независимо от того, что агент сделает (off-policy)."}, {"q": "Какой алгоритм ведёт себя осторожнее в задаче «прогулка по краю обрыва» и почему?", "a": "SARSA: она учитывает, что ε-жадный агент иногда делает случайные шаги и может упасть, поэтому выбирает безопасный путь подальше от края. Q-learning учит оптимальный путь вдоль края, но при обучении чаще падает."}, {"q": "Что значит off-policy и чем это полезно?", "a": "Агент учит ценность одной (целевой, жадной) политики, собирая опыт другой (исследующей) политикой. Это позволяет переиспользовать старый опыт и данные, собранные кем угодно, — основа replay buffer в DQN."}, {"q": "Почему табличный Q-learning не подходит для большинства реальных задач?", "a": "Таблица Q нужна для каждой пары «состояние–действие», а в реальных задачах состояний астрономически много или они непрерывны (изображения, позиции). Нужна аппроксимация функции — например, нейросетью (DQN)."}], "random_forest_cheatsheet.html": [{"q": "Какие два источника случайности делают деревья в лесу разными?", "a": "Каждое дерево обучается на bootstrap-выборке (случайная выборка с возвращением), и в каждом узле выбор разбиения идёт только среди случайного подмножества признаков (`max_features`)."}, {"q": "Почему усреднение многих деревьев уменьшает ошибку?", "a": "Усреднение слабо коррелированных моделей уменьшает дисперсию, почти не меняя смещения. Случайный выбор признаков делает деревья менее похожими и усиливает этот эффект."}, {"q": "Что такое out-of-bag (OOB) оценка?", "a": "Около 37% объектов не попадают в bootstrap-выборку конкретного дерева. Предсказывая каждый объект только деревьями, которые его не видели, получают оценку качества без отдельной валидации (`oob_score=True`)."}, {"q": "Переобучается ли случайный лес при увеличении числа деревьев?", "a": "Нет: с ростом `n_estimators` ошибка выходит на плато, просто растёт время работы. Переобучение возможно из-за слишком глубоких деревьев на зашумлённых данных, но не из-за их количества."}, {"q": "Чем важность признаков по уменьшению impurity хуже permutation importance?", "a": "Важность по impurity считается на обучающих данных и завышает значимость признаков с большим числом уникальных значений (например, ID). Permutation importance измеряет падение качества на валидации при перемешивании признака и надёжнее."}], "regression_metrics_cheatsheet.html": [{"q": "Чем MAE отличается от RMSE и какая сильнее штрафует большие ошибки?", "a": "MAE — среднее модулей ошибок, RMSE — корень из среднего квадратов. RMSE из-за возведения в квадрат сильнее штрафует большие ошибки и чувствительнее к выбр

осам; всегда RMSE ≥ MAE."}, {"q": "Что показывает R² и может ли он быть отрицательным?", "a": "R² = 1 − SS_res / SS_tot — долю дисперсии целевой переменной, объяснённую моделью: 1 — идеально, 0 — не лучше константного прогноза средним. Отрицательный R² означает, что модель хуже предсказания средним."}, {"q": "В чём недостатки MAPE?", "a": "Не определена при y = 0 и взрывается при y, близких к нулю; несимметрична — завышение прогноза штрафуется иначе, чем занижение."}, {"q": "Какую метрику выбрать, если ошибка в 10 тыс. одинаково плоха для квартиры за 50 тыс. и за 5 млн?", "a": "Абсолютную — MAE или RMSE, потому что важен размер ошибки в деньгах. Если же важна ошибка относительно цены — относительную (MAPE, или RMSLE для логарифмов)."}, {"q": "Почему R² на обучающей выборке растёт при добавлении любого признака?", "a": "Модель с бо́льшим числом параметров всегда может подогнаться не хуже. Поэтому R² сравнивают на тесте или используют скорректированный R², штрафующий за число признаков."}], "reinforcement_learning_basics_cheatsheet.html": [{"q": "Из каких элементов состоит задача RL?", "a": "Агент, среда, состояния, действия, награды и политика. Агент наблюдает состояние, выбирает действие, получает награду и новое состояние; цель — максимизировать ожидаемую суммарную (дисконтированную) награду."}, {"q": "Что такое марковский процесс принятия решений (MDP)?", "a": "Формальная модель задачи RL: множество состояний и действий, вероятности переходов P(s'|s, a), функция наград и коэффициент дисконтирования γ. Марковское свойство: будущее зависит только от текущего состояния и действия, а не от всей истории."}, {"q": "Зачем нужен коэффициент дисконтирования γ?", "a": "Он делает сумму наград конечной в бесконечных задачах и задаёт, насколько агент ценит будущие награды по сравнению с ближайшими: γ близко к 0 — «близорукий» агент, близко к 1 — дальновидный."}, {"q": "Чем функция ценности V(s) отличается от Q(s, a)?", "a": "V(s) — ожидаемая суммарная награда из состояния s при следовании политике. Q(s, a) — то же, но при условии, что сначала выполнено действие a. Зная Q, можно выбрать лучшее действие: argmaxₐ Q(s, a)."}, {"q": "Что такое дилемма exploration vs exploitation?", "a": "Агент должен использовать уже известные хорошие действия (exploitation), но и пробовать новые, чтобы найти лучшие (exploration). Простейшее решение — ε-жадная стратегия: с вероятностью ε случайное действие."}], "resnet_cheatsheet.html": [{"q": "Какую проблему обнаружили авторы ResNet у очень глубоких «обычных» сетей?", "a": "Проблему деградации: при увеличении глубины ошибка растёт даже на **обучающей** выборке. Значит, дело не в переобучении, а в том, что глубокую сеть трудно оптимизировать."}, {"q": "Как устроен residual-блок?", "a": "Выход блока — y = F(x) + x: к результату нескольких слоёв F(x) прибавляется исходный вход по «короткой связи» (skip connection). Слои учат только поправку (остаток) к входу."}, {"q": "Почему skip-связи облегчают обучение глубоких сетей?", "a": "Градиент проходит по короткой связи напрямую, не затухая при перемножении через слои. А если блок не нужен, сети достаточно сделать F(x) ≈ 0, чтобы получить тождественное отображение."}, {"q": "Что делать, если размерность F(x) и x не совпадает?", "a": "Применить к x проекцию — свёртку 1×1 с нужным числом каналов и stride, — чтобы формы совпали перед сложением."}, {"q": "Что такое bottleneck-блок в ResNet-50 и глубже?", "a": "Последовательность свёрток 1×1 (сжатие каналов) → 3×3 → 1×1 (восстановление каналов). Дорогая свёртка 3×3 работает на меньшем числе каналов, что позволяет делать сеть глубже при той же стоимости."}], "ridge_lasso_elasticnet_cheatsheet.html": [{"q": "Какие штрафы добавляют Ridge и Lasso к функции потерь?", "a": "Ridge (L2): α·Σwⱼ² — сумма квадратов весов. Lasso (L1): α·Σ|wⱼ| — сумма модулей весов. ElasticNet — взвешенная комбинация обоих."}, {"q": "Какая регуляризация обнуляет веса и почему это полезно?", "a": "Lasso (L1): у штрафа «угол» в нуле, поэтому часть весов становится ровно нулевой. Получается встроенный отбор признаков и более простая, интерпретируемая модель."}, {"q": "Как влияет на модель увеличение α?", "a": "Штраф сильнее — веса меньше, модель проще: смещение растёт, дисперсия падает. При α → 0 получаем обычную линейную регрессию, при очень большом α — почти константный прогноз."}, {"q": "Когда ElasticNet лучше, чем Lasso?", "a": "Когда есть группы сильно коррелированных признаков: Lasso обычно случайно оставляет один из группы, а ElasticNet за счёт L2-части распределяет вес между ними и ведёт себя стабильнее."}, {"q": "Почему перед регуляризацией нужно масштабировать признаки?", "a": "Штраф одинаков для всех весов, а величина веса зависит от масштаба признака. Без масштабирования признаки в «мелких» единицах получают большие веса и штрафуются несправедливо сильнее."}], "rnn_basics_cheatsheet.html": [{"q": "Как RNN обрабатывает последовательность?", "a": "Пошагово, поддерживая скрытое состояние: hₜ = tanh(W·xₜ + U·hₜ₋₁ + b). Одни и те же веса применяются на каждом шаге, а hₜ «помнит» информацию о предыдущих элементах."}, {"q": "Что такое backpropagation through time (BPTT)?", "a": "Обучение RNN обратным распространением по «развёрнутой» во времени сети: каждый шаг — отдельный слой с общими весами. Градиенты по общим весам суммируются по всем шагам."}, {"q": "Почему простая RNN плохо запоминает длинные зависимости?", "a": "При BPTT градиент многократно умножается на одну и ту же матрицу весов и производную tanh, поэтому экспоненциально затухает (или взрывается). Сигнал от далёких шагов почти не доходит до весов."}, {"q": "Какие схемы «вход — выход» бывают у RNN?", "a": "Many-to-one (классификация отзыва), one-to-many (генерация подписи к изображению), many-to-many с одинаковой длиной (разметка частей речи) и с разной длиной — encoder-decoder (машинный перевод)."}, {"q": "Как борются со взрывом градиентов в RNN?", "a": "Gradient clipping — ограничивают норму градиента (например, `clip_grad_norm_` до 1.0). Затухание градиентов лечат архитектурно — ячейками LSTM и GRU."}], "rnn_lstm_time_series_cheatsheet.html": [{"q": "Как подготовить временной ряд для обучения LSTM?", "a": "Нарезать скользящими окнами: вход — последние N значений (и признаки), цель — следующие значения. Получается тензор (число окон, длина окна, число признаков). Масштабирование обучать только на обучающей части."}, {"q": "Чем рекурсивная стратегия многошагового прогноза отличается от прямой?", "a": "Рекурсивная прогнозирует один шаг и подаёт прогноз на вход для следующего — ошибки накапливаются. Прямая (multi-output) сразу выдаёт все H шагов горизонта — ошибки не копятся, но модель сложнее."}, {"q": "Почему важно сравнить LSTM с наивным прогнозом?", "a": "Нейросети на временных рядах часто проигрывают простым бейзлайнам (последнее значение, сезонный наивный прогноз, ETS), особенно на коротких рядах. Если модель не обходит бейзлайн, сложность не оправдана."}, {"q": "Что делать с трендом при обучении LSTM?", "a": "Нейросети плохо экстраполируют значения за пределы обучающего диапазона. Помогают дифференцирование или прогноз относительных изменений, нормализация каждого окна (например, деление на последнее значение) и обратное преобразование прогноза."}, {"q": "Как одновременно прогнозировать много связанных рядов?", "a": "Обучать глобальную модель на всех рядах сразу (как DeepAR), добавив идентификатор ряда и его признаки. Модель переносит закономерности между рядами и работает даже для рядов с короткой историей."}], "roc_auc_cheatsheet.html": [{"q": "Что откладывается по осям ROC-кривой?", "a": "По оси X — FPR = FP / (FP + TN) (доля ложных срабатываний), по оси Y — TPR = TP / (TP + FN) (recall). Каждая точка соответствует одному порогу классификации."}, {"q": "Как интерпретировать значение ROC-AUC?", "a": "Вероятность того, что случайно выбранный положительный объект получит более высокую оценку, чем случайно выбранный отрицательный. 0.5 — случайное угадывание, 1.0 — идеальное ранжирование."}, {"q": "Почему ROC-AUC считают по вероятностям, а не по предсказанным классам?", "a": "ROC-кривая строится перебором порогов, для этого нужна непрерывная оценка (вероятность или score). По меткам 0/1 получится всего одна точка, и AUC будет некорректен."}, {"q": "Почему при сильном дисбалансе классов лучше смотреть на PR-кривую?", "a": "FPR делится на огромное число отрицательных объектов, поэтому даже много ложных срабатываний почти не ухудшает ROC-AUC. PR-кривая (precision-recall) и PR-AUC честнее показывают качество на редком классе."}, {"q": "Что означает ROC-AUC = 0.3?", "a": "Модель ранжирует хуже случайного — чаще всего перепутаны метки классов или знак оценки. Если инвертировать прогноз, получится AUC = 0.7."}], "scaling_normalization_cheatsheet.html": [{"q": "Чем отличаются StandardScaler и MinMaxScaler?", "a": "`StandardScaler`: (x − среднее) / стандартное отклонение → среднее 0, отклонение 1, границы не фиксированы. `MinMaxScaler`: (x − min) / (max − min) → значения в [0, 1]."}, {"q": "Какой скейлер выбрать при наличии выбросов и почему?", "a": "`RobustScaler`: он использует медиану и межквартильный размах, на которые выбросы почти не влияют. У MinMaxScaler один выброс «сжимает» все остальные значения к краю диапазона."}, {"q": "Почему скейлер обучают на train, а к test применяют `transform`?", "a": "Тест имитирует новые, ещё не известные данные. Если обучить скейлер на тесте или на всех данных, его статистики попадут в обучение — это утечка данных."}, {"q": "Меняет ли масштабирование форму распределения признака?", "a": "Линейные скейлеры (Standard, MinMax, Robust, MaxAbs) — нет, они лишь сдвигают и растягивают. Изменить форму (например, убрать скошенность) могут логарифм, `PowerTransformer` (Box-Cox, Yeo-Johnson) или `QuantileTransformer`."}, {"q": "Когда подходит MaxAbsScaler?", "a": "Для разреженных данных (например, TF-IDF): он делит на максимум модуля, не сдвигает данные и поэтому сохраняет нули и разреженность."}], "self_attention_cheatsheet.html": [{"q": "Откуда в self-attention берутся Q, K и V?", "a": "Из одной и той же последовательности: каждый токен умножается на три обучаемые матрицы — Q = XW_Q, K = XW_K, V = XW_V. Так каждый токен формирует «запрос», «ключ» и «значение»."}, {"q": "Запишите формулу scaled dot-product attention.", "a": "Attention(Q, K, V) = softmax(QKᵀ / √d_k) · V. Матрица QKᵀ содержит сходство каждого токена с каждым, softmax по строкам даёт веса, и они смешивают векторы значений."}, {"q": "Зачем делить на √d_k?", "a": "При большой размерности скалярные произведения растут по величине, softmax становится почти one-hot и даёт крошечные градиенты. Деление на √d_k удерживает дисперсию оценок около 1."}, {"q": "Какова вычислительная сложность self-attention по длине последовательности n?", "a": "O(n²·d) по времени и O(n²) по памяти на матрицу внимания: каждый токен сравнивается с каждым. Поэтому длинные контексты дороги, и существуют эффективные варианты (sparse, linear attention, FlashAttention)."}, {"q": "Знает ли self-attention о порядке токенов сам по себе?", "a": "Нет: операция инвариантна к перестановке входов (точнее, эквивариантна). Информацию о позиции добавляют отдельно — позиционными кодированиями (синусоидальными, обучаемыми, RoPE)."}], "shap_cheatsheet.html": [{"q": "На какой идее основаны значения SHAP?", "a": "На значениях Шепли из теории кооперативных игр: вклад признака — его средний маргинальный вклад в прогноз по всем возможным порядкам добавления признаков. Признаки — «игроки», прогноз — «выигрыш»."}, {"q": "Какое свойство аддитивности есть у SHAP?", "a": "Прогноз для объекта равен базовому значению (среднему прогнозу) плюс сумма SHAP-значений всех признаков: f(x) = E[f(X)] + Σφᵢ. Каждый прогноз раскладывается на вклады признаков без остатка."}, {"q": "Чем отличаются локальные и глобальные объяснения SHAP?", "a": "Локальное — разложение прогноза одного объекта (waterfall и force plot). Глобальное — агрегирование по многим объектам: среднее |φᵢ| как важность (bar plot) и распределение вкладов (beeswarm)."}, {"q": "Почему TreeSHAP популярен для бустинга и лесов?", "a": "Точное вычисление значений Шепли экспоненциально по числу признаков. TreeSHAP использует структуру деревьев и считает точные значения за полиномиальное время — быстро даже для больших ансамблей."}, {"q": "Какие ограничения у SHAP стоит помнить?", "a": "При коррелированных признаках результат зависит от того, как моделируется «отсутствие» признака, и может давать нереалистичные комбинации. KernelSHAP медленный. И, как любая важность, SHAP объясняет модель, а не причинность в данных."}], "tensorflow_keras_full_guide_cheatsheet.html": [{"q": "Чем отличаются Sequential API, Functional API и наследование от `keras.Model`?", "a": "Sequential — простая цепочка слоёв. Functional — произвольный граф: несколько входов и выходов, ветвления, skip-связи. Наследование от `Model` с методом `call` — полная гибкость для нестандартной логики."}, {"q": "Что делает `model.compile()`?", "a": "Задаёт оптимизатор, функцию потерь и метрики. Только после компиляции можно вызывать `fit`, `evaluate` и `predict` со стандартным циклом обучения."}, {"q": "Что такое callbacks и какие самые полезные?", "a": "Объекты, которые вызываются в определённые моменты обучения. Самые полезные: `EarlyStopping` (с `restore_best_weights=True`), `ModelCheckpoint`, `ReduceLROnPlateau`, `TensorBoard`."}, {"q": "Чем `sparse_categorical_crossentropy` отличается от `categorical_crossentropy`?", "a": "Sparse принимает метки как номера классов (0, 1, 2…), обычная — как one-hot векторы. Математически это одна и та же функция потерь."}, {"q": "Зачем нужен `tf.data`?", "a": "Для эффективного конвейера загрузки данных: `map` для предобработки, `batch`, `shuffle`, `prefetch(tf.data.AUTOTUNE)`, чтобы подготовка следующего батча шла параллельно с обучением на текущем."}], "time_series_cheatsheet.html": [{"q": "Что означают параметры p, d, q в ARIMA(p, d, q)?", "a": "p — порядок авторегрессии (сколько прошлых значений), d — сколько раз ряд дифференцируется для стационарности, q — порядок скользящего среднего (сколько прошлых ошибок прогноза)."}, {"q": "Что такое стационарность и как её проверить?", "a": "Ряд стационарен, если его среднее, дисперсия и автокорреляции не меняются со временем. Проверяют визуально и тестами: ADF (нулевая гипотеза — ряд нестационарен) и KPSS (нулевая гипотеза — стационарен)."}, {"q": "Как ACF и PACF помогают выбрать p и q?", "a": "Для AR(p) PACF резко обрывается после лага p, а ACF затухает постепенно. Для MA(q) ACF обрывается после лага q, а PACF затухает. На практике дополнительно сравнивают модели по AIC/BIC."}, {"q": "Чем SARIMA отличается от ARIMA?", "a": "Добавляет сезонную часть (P, D, Q)ₛ с периодом s (например, 12 для месячных данных с годовой сезонностью): сезонное дифференцирование и сезонные AR/MA-компоненты на лагах, кратных s."}, {"q": "Почему для проверки модели временного ряда нельзя случайно разбивать данные?", "a": "Будущее не должно попадать в обучение. Используют разбиение по времени или скользящую проверку (rolling/expanding window), когда модель обучается на прошлом и прогнозирует следующий отрезок."}], "tokenization_cheatsheet.html": [{"q": "Почему современные модели используют подсловную токенизацию, а не целые слова?", "a": "Словарь целых слов огромен и всё равно не покрывает редкие и новые слова (OOV). Посимвольная токенизация даёт слишком длинные последовательности. Подслова — компромисс: частые слова целиком, редкие — из кусочков."}, {"q": "Как работает BPE (Byte Pair Encoding)?", "a": "Начинают с символов и многократно объединяют самую частую пару соседних токенов в новый токен, пока не достигнут нужного размера словаря. При токенизации применяются выученные слияния."}, {"q": "Чем отличаются WordPiece, Unigram и SentencePiece?", "a": "WordPiece (BERT) выбирает слияния, максимизирующие правдоподобие корпуса. Unigram начинает с большого словаря и удаляет наименее полезные токены. SentencePiece — библиотека, работающая с сырым текстом (пробел — обычный символ), реализует BPE и Unigram без предварительного деления на слова."}, {"q": "Почему один и тот же текст на русском часто занимает больше токенов, чем на английском?", "a": "Если токенизатор обучался в основном на английском, русские слова разбиваются на больше мелких кусочков. Это увеличивает стоимость, уменьшает эффективную длину контекста и может ухудшать качество."}, {"q": "Можно ли использовать модель с чужим токенизатором?", "a": "Нет: эмбеддинги модели соответствуют конкретным id токенов её словаря. Токенизатор и модель всегда загружают в паре из одного чекпойнта (`AutoTokenizer` и `AutoModel` с одним именем)."}], "topic_modeling_lda_nmf_cheatsheet.html": [{"q": "Какую генеративную модель текста предполагает LDA?", "a": "Каждый документ — смесь тем с весами из распределения Дирихле, каждая тема — распределение над словами. Каждое слово документа порождается выбором темы из смеси документа и затем слова из этой темы."}, {"q": "Чем NMF отличается от LDA?", "a": "NMF — матричное разложение: матрица документ×слово (обычно TF-IDF) приближается произведением двух неотрицательных матриц (документ×тема и тема×слово). Это детерминированная оптимизация, без вероятностной модели; часто быстрее и даёт чёткие темы на коротких текстах."}, {"q": "Какая предобработка важна для тематического моделирования?", "a": "Удаление стоп-слов, лемматизация (особенно для русского), удаление очень редких и очень частых слов, при необходимости — биграммы. Иначе темы забиваются служебными словами."}, {"q": "Как выбрать число тем?", "a": "Перебрать несколько значений и сравнить когерентность тем (coherence score — насколько часто топ-слова темы встречаются вместе), смотреть на интерпретируемость тем глазами. Перплексия на отложенных данных плохо согласуется с мнением людей."}, {"q": "Чем BERTopic отличается от классических подходов?", "a": "Использует эмбеддинги документов от трансформера, понижает размерность (UMAP), кластеризует (HDBSCAN) и описывает кластеры словами через c-TF-IDF. Лучше улавливает смысл, работает с короткими текстами, но тяжелее вычислительно."}], "transfer_learning_cnn_cheatsheet.html": [{"q": "Почему признаки сети, обученной на ImageNet, полезны для другой задачи?", "a": "Ранние слои учат универсальные признаки — края, текстуры, простые формы, — которые встречаются почти на любых изображениях. Чем глубже слой, тем специфичнее признаки исходной задаче."}, {"q": "Чем feature extraction отличается от fine-tuning?", "a": "Feature extraction: веса предобученной сети замораживаются, обучается только новая «голова» (классификатор). Fine-tuning: часть или все слои размораживаются и дообучаются с небольшим learning rate."}, {"q": "Какую стратегию выбрать при маленьком датасете, похожем на ImageNet?", "a": "Заморозить основу и обучить только голову: данных мало, и полный fine-tuning быстро переобучится. При большом датасете или сильно отличающемся домене (медицинские снимки, спутники) размораживают больше слоёв."}, {"q": "Почему при fine-tuning используют маленький learning rate?", "a": "Предобученные веса уже хорошие; большой шаг может разрушить полезные признаки («катастрофическое забывание»). Часто используют разные lr: меньше для основы, больше для новой головы."}, {"q": "Что обязательно нужно сделать с входными изображениями при использовании предобученной модели?", "a": "Привести их к тому же формату, что при предобучении: размер, порядок каналов и нормализация теми же средними и стандартными отклонениями (для ImageNet — mean = [0.485, 0.456, 0.406], std = [0.229, 0.224, 0.225])."}], "transformers_cheatsheet.html": [{"q": "Из каких подслоёв состоит блок энкодера Transformer?", "a": "Multi-head self-attention и позиционно-независимая полносвязная сеть (FFN, обычно с расширением размерности в 4 раза). Вокруг каждого подслоя — residual-связь и нормализация слоя (LayerNorm)."}, {"q": "Чем блок декодера отличается от блока энкодера?", "a": "В декодере self-attention маскирован (токен не видит будущие токены), и есть дополнительный слой cross-attention: запросы из декодера, ключи и значения — из выхода энкодера."}, {"q": "Зачем нужна каузальная маска?", "a": "При обучении декодер получает всю целевую последовательность сразу; маска запрещает позиции i смотреть на позиции > i, чтобы модель не «подглядывала» в токен, который должна предсказать."}, {"q": "Почему Transformer обучается быстрее RNN?", "a": "Все позиции последовательности обрабатываются параллельно матричными операциями, без последовательной зависимости по времени. Это хорошо ложится на GPU."}, {"q": "Чем Pre-LN отличается от Post-LN и почему Pre-LN популярнее?", "a": "В Post-LN нормализация стоит после сложения с residual, в Pre-LN — перед подслоем внутри residual-ветки. Pre-LN обучается стабильнее, особенно в глубоких моделях, и меньше зависит от warmup."}], "transformers_time_series_cheatsheet.html": [{"q": "Какие трудности возникают при применении трансформеров к временным рядам?", "a": "Квадратичная стоимость внимания по длине истории, слабая встроенная информация о порядке и времени (нужны позиционные и временные признаки), склонность к переобучению на коротких рядах, отдельные точки ряда несут мало информации как токены."}, {"q": "Какую идею использует PatchTST?", "a": "Ряд разбивается на патчи — короткие отрезки, — и каждый патч становится токеном (как в ViT). Это сокращает число токенов, даёт каждому токену локальный контекст и улучшает прогноз; каналы ряда обрабатываются независимо."}, {"q": "Что такое Temporal Fusion Transformer?", "a": "Архитектура для многошагового прогноза, объединяющая LSTM для локальной обработки, внимание для длинных зависимостей и механизмы отбора признаков. Работает со статическими, известными в будущем и наблюдаемыми признаками и даёт интерпретируемые веса."}, {"q": "Что показала статья о том, что простые линейные модели (DLinear) конкурируют с трансформерами?", "a": "На ряде стандартных бенчмарков долгосрочного прогноза простая линейная модель с декомпозицией на тренд и сезонность оказалась не хуже многих трансформерных моделей. Вывод — сложные архитектуры всегда нужно сравнивать с сильными простыми бейзлайнами."}, {"q": "Что такое foundation models для временных рядов?", "a": "Большие модели, предобученные на огромных коллекциях разнородных рядов (Chronos, TimesFM, Moirai), которые делают прогноз нового ряда без дообучения (zero-shot) или после небольшого дообучения."}], "vae_cheatsheet.html": [{"q": "Чем VAE отличается от обычного автоэнкодера?", "a": "Энкодер выдаёт не точку, а параметры распределения в латентном пространстве (среднее μ и дисперсию σ²), и код сэмплируется из него. Латентное пространство получается гладким и непрерывным, поэтому из него можно генерировать новые объекты."}, {"q": "Из каких двух слагаемых состоит функция потерь VAE?", "a": "Ошибка реконструкции и KL-дивергенция между распределением энкодера q(z|x) и априорным N(0, I). Вместе они — отрицательная нижняя граница правдоподобия (ELBO)."}, {"q": "Зачем нужен reparameterization trick?", "a": "Через случайное сэмплирование градиент напрямую не проходит. Трюк записывает z = μ + σ·ε, где ε ~ N(0, I): случайность вынесена в ε, а μ и σ участвуют в дифференцируемых операциях."}, {"q": "Как сгенерировать новый объект обученным VAE?", "a": "Сэмплировать z из априорного распределения N(0, I) и пропустить через декодер. Энкодер для генерации не нужен."}, {"q": "Почему изображения VAE часто получаются размытыми и что делает β-VAE?", "a": "Пиксельная функция потерь (MSE) усредняет возможные варианты, а сильная KL-регуляризация ограничивает информацию в коде — отсюда размытость. β-VAE усиливает вес KL (β > 1), получая более «распутанные» (disentangled) латентные факторы ценой качества реконструкции."}], "vision_transformers_vit_cheatsheet.html": [{"q": "Как ViT превращает изображение в последовательность токенов?", "a": "Делит изображение на патчи (например, 16×16), каждый патч разворачивается в вектор и линейно проецируется в эмбеддинг. Добавляются позиционные эмбеддинги и обучаемый токен [CLS] для классификации."}, {"q": "Сколько токенов получится из изображения 224×224 с патчами 16×16?", "a": "(224 / 16)² = 14² = 196 патчей, плюс токен [CLS] — 197 токенов."}, {"q": "Почему ViT нужно больше данных, чем CNN?", "a": "У CNN есть встроенные индуктивные предположения — локальность и инвариантность к сдвигу. У ViT их почти нет, и всё это приходится выучивать из данных; поэтому на небольших датасетах без предобучения ViT уступает CNN."}, {"q": "Как DeiT позволил обучать ViT без огромных датасетов?", "a": "Сильной аугментацией и регуляризацией, а также дистилляцией знаний от CNN-учителя через специальный distillation-токен — так ViT удалось хорошо обучить на одном ImageNet-1k."}, {"q": "В чём идея Swin Transformer?", "a": "Внимание считается внутри локальных окон, а между слоями окна сдвигаются, чтобы информация проходила между ними. Получается иерархия признаков разного масштаба (как у CNN) и сложность, линейная по числу патчей, — удобно для детекции и сегментации."}], "word_embeddings_cheatsheet.html": [{"q": "Чем эмбеддинги лучше one-hot кодирования слов?", "a": "One-hot векторы огромны (размер словаря), разрежены и все одинаково далеки друг от друга. Эмбеддинги — плотные векторы небольшой размерности (100–300), в которых похожие по смыслу слова расположены близко."}, {"q": "На какой идее основан Word2Vec?", "a": "Дистрибутивная гипотеза: слова, встречающиеся в похожих контекстах, имеют похожий смысл. Skip-gram предсказывает контекстные слова по центральному, CBOW — центральное слово по контексту."}, {"q": "Что означает пример «король − мужчина + женщина ≈ королева»?", "a": "Векторное пространство эмбеддингов кодирует смысловые отношения как направления: разность векторов «мужчина → женщина» близка к разности «король → королева»."}, {"q": "Как FastText справляется с редкими и незнакомыми словами?", "a": "Представляет слово как сумму векторов его символьных n-грамм. Поэтому вектор можно построить даже для слова, которого не было в обучении, — по его частям, что особенно полезно для языков с богатой морфологией, таких как русский."}, {"q": "Чем статические эмбеддинги (Word2Vec, GloVe) отличаются от контекстных (BERT)?", "a": "У статических одно слово всегда имеет один вектор — «ключ» от замка и «ключ»-родник неразличимы. Контекстные модели строят вектор слова с учётом всего предложения, и у многозначных слов векторы различаются."}], "xgboost_cheatsheet.html": [{"q": "Чем XGBoost отличается от классического градиентного бустинга?", "a": "Использует при построении деревьев разложение функции потерь до второго порядка (градиенты и гессианы), встроенную регуляризацию (штрафы за число листьев и величину весов), эффективную параллельную реализацию и встроенную обработку пропусков."}, {"q": "Какие гиперпараметры XGBoost настраивают в первую очередь?", "a": "`learning_rate` (eta) и `n_estimators` (вместе с early stopping), `max_depth`, `min_child_weight`, `subsample` и `colsample_bytree`, регуляризацию `reg_lambda` и `reg_alpha`."}, {"q": "Как XGBoost обрабатывает пропуски?", "a": "При каждом разбиении он пробует отправить объекты с пропуском в левую и в правую ветку и запоминает направление, которое лучше уменьшает потери. Заполнять пропуски заранее не обязательно."}, {"q": "Как использовать раннюю остановку в XGBoost?", "a": "Передать валидационную выборку в `eval_set` и задать `early_stopping_rounds`: обучение остановится, когда метрика на валидации перестанет улучшаться заданное число итераций, а для прогноза будет использована лучшая итерация."}, {"q": "Что делают `subsample` и `colsample_bytree`?", "a": "Каждое дерево обучается на случайной доле объектов и признаков. Это вносит случайность, делает деревья разнообразнее, уменьшает переобучение и ускоряет обучение."}], "yolo_cheatsheet.html": [{"q": "Чем одностадийные детекторы (YOLO) отличаются от двухстадийных (Faster R-CNN)?", "a": "Двухстадийные сначала предлагают области-кандидаты, затем классифицируют и уточняют каждую. YOLO за один проход сети сразу предсказывает рамки и классы по сетке — быстрее, подходит для реального времени."}, {"q": "Что такое IoU и как его посчитать?", "a": "Intersection over Union — площадь пересечения двух рамок, делённая на площадь их объединения. 1 — рамки совпадают, 0 — не пересекаются. Используется для сопоставления предсказаний с разметкой и в NMS."}, {"q": "Зачем нужен Non-Maximum Suppression (NMS)?", "a": "Детектор выдаёт много перекрывающихся рамок на один объект. NMS оставляет рамку с наибольшей уверенностью и удаляет те, у которых IoU с ней выше порога (например, 0.5)."}, {"q": "Что такое mAP?", "a": "Mean Average Precision: для каждого класса считается площадь под precision-recall кривой (AP) при заданном пороге IoU, затем значения усредняются по классам. mAP@0.5:0.95 дополнительно усредняет по порогам IoU от 0.5 до 0.95."}, {"q": "Что такое якорные рамки (anchors) и почему многие новые версии YOLO от них отказались?", "a": "Заранее заданные шаблоны рамок разных размеров и пропорций, относительно которых сеть предсказывает смещения. Их приходится подбирать под датасет; anchor-free подходы (YOLOv8 и новее) предсказывают центр и размеры объекта напрямую, что проще и обобщается лучше."}]}, "demos": [{"file": "activation_functions.html", "title": "Функции активации", "topics": ["activation_functions_cheatsheet.html", "vanishing_gradient_cheatsheet.html"]}, {"file": "convolution.html", "title": "Свёртка и пулинг", "topics": ["cnn_basics_cheatsheet.html", "pooling_layers_cheatsheet.html", "cnn_visualization_techniques_cheatsheet.html"]}, {"file": "decision_tree.html", "title": "Дерево решений", "topics": ["decision_trees_cheatsheet.html", "decision_trees_regression_cheatsheet.html", "tree_visualization_cheatsheet.html"]}, {"file": "gradient_boosting.html", "title": "Градиентный бустинг", "topics": ["boosting_cheatsheet.html", "gradient_boosting_regression_cheatsheet.html", "gradient_boosting_hyperparameters_cheatsheet.html", "xgboost_cheatsheet.html", "lightgbm_cheatsheet.html", "catboost_cheatshee const STORE_KEY = "mlcs-progress-v1";

// ---------- состояние и прогресс ----------
function loadState() {
  const empty = { done: {}, exDone: {}, review: {}, last: null, tab: "sections", qOpen: false };
  try { return Object.assign(empty, JSON.parse(localStorage.getItem(STORE_KEY))); }
  catch (e) { return empty; }
}
let state = loadState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

const title = f => DATA.titles[f] || f;
const isDone = f => !!state.done[f];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uniq = arr => [...new Set(arr)];
const pathItems = p => uniq(p.stages.flatMap(s => s.items));
const allTopics = uniq(DATA.parts.flatMap(p => p.sections.flatMap(s => s.items)));

// где тема находится в README — для подписи в поиске
const topicHome = {};
DATA.parts.forEach((p, pi) => p.sections.forEach((s, si) => s.items.forEach(f => {
  if (!topicHome[f]) topicHome[f] = { pi, si, label: s.title };
})));

function progress(items) {
  const n = items.filter(isDone).length;
  return { n, total: items.length, pct: items.length ? Math.round(100 * n / items.length) : 0 };
}
function bar(items) { return `<div class="bar"><span style="width:${progress(items).pct}%"></span></div>`; }
function countLabel(items) {
  const p = progress(items);
  return `<small class="${p.n === p.total && p.total ? "full" : ""}">${p.n}/${p.total}</small>`;
}

function toggleDone(f, value) {
  if (value === undefined) value = !isDone(f);
  if (value) {
    if (!state.done[f]) state.done[f] = Date.now();
    if (!state.review[f]) state.review[f] = { step: 0, due: Date.now() + DAY };
  } else { delete state.done[f]; delete state.review[f]; }
  save(); refreshChrome();
}

// ---------- интервальное повторение ----------
// После отметки «Изучено» тема возвращается на повторение через 1, 3, 7, 16, 35, 90 дней.
// «Помню» — следующий интервал, «Есть пробелы» — снова через день.
const DAY = 24 * 3600 * 1000;
const INTERVALS = [1, 3, 7, 16, 35, 90];
const questionsOf = f => DATA.questions[f] || [];
const demosOf = f => DATA.demos.filter(d => d.topics.includes(f));

function reviewOf(f) {
  if (!isDone(f)) return null;
  return state.review[f] || { step: 0, due: state.done[f] + DAY };   // темы, отмеченные до появления повторения
}
function dueTopics() {
  const now = Date.now();
  return Object.keys(state.done).filter(f => DATA.titles[f] && reviewOf(f).due <= now)
    .sort((a, b) => reviewOf(a).due - reviewOf(b).due);
}
function rate(f, remembered) {
  const r = reviewOf(f) || { step: -1 };
  const step = remembered ? Math.min(r.step + 1, INTERVALS.length - 1) : 0;
  if (!state.done[f]) state.done[f] = Date.now();
  state.review[f] = { step, due: Date.now() + INTERVALS[step] * DAY };
  save(); refreshChrome();
}
function whenLabel(f) {
  const r = reviewOf(f);
  if (!r) return "";
  const days = Math.ceil((r.due - Date.now()) / DAY);
  return days <= 0 ? "повторить сегодня" : `повторение через ${days} ${plural(days, "день", "дня", "дней")}`;
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? few : many;
}

function questionsBlock(f) {
  const qs = questionsOf(f);
  if (!qs.length) return `<p class="note">Вопросов к этой теме пока нет — перескажите себе главное из шпаргалки.
    Добавить вопросы можно в <code>questions/${esc(f.replace("_cheatsheet.html", ""))}.md</code>.</p>`;
  return qs.map((q, i) => `<details class="q"><summary>${i + 1}. ${esc(q.q)}</summary><div class="ans">${markdown(q.a)}</div></details>`).join("");
}
function rateButtons(f) {
  return `<div class="rate">
    <button class="btn good" data-rate="1" data-topic="${esc(f)}">✔ Помню</button>
    <button class="btn bad" data-rate="0" data-topic="${esc(f)}">✖ Есть пробелы</button>
  </div><p class="note" style="margin-top:8px">${esc(whenLabel(f) || "Оценка отметит тему изученной и запланирует повторение.")}</p>`;
}

// ---------- маршруты ----------
// #/                         главная
// #/s/<part>/<section>       раздел
// #/p/<path>                 учебный путь
// #/x/<exercise>             упражнение
// #/t/<file>?ctx=<контекст>  просмотр шпаргалки
// #/q/<строка>               поиск
// #/r                        повторение
// #/d/<файл>                 интерактивная демонстрация из interactive/
function parseHash() {
  const [route, query] = decodeURIComponent(location.hash.slice(1) || "/").split("?ctx=");
  return { parts: route.split("/").filter(Boolean), ctx: query || "" };
}

function contextList(ctx) {
  const [kind, a, b] = ctx.split(":");
  if (kind === "s") {
    const sec = DATA.parts[+a] && DATA.parts[+a].sections[+b];
    if (sec) return { items: sec.items, label: sec.title, back: `#/s/${a}/${b}` };
  }
  if (kind === "p" && DATA.paths[+a]) return { items: pathItems(DATA.paths[+a]), label: DATA.paths[+a].title, back: `#/p/${a}` };
  return null;
}

function render() {
  const { parts, ctx } = parseHash();
  document.body.classList.remove("menu-open");
  const main = document.getElementById("main");
  const [kind, a, b] = parts;
  if (kind === "t") main.innerHTML = viewTopic(parts.slice(1).join("/"), ctx);
  else if (kind === "s") main.innerHTML = viewSection(+a, +b);
  else if (kind === "p") main.innerHTML = viewPath(+a);
  else if (kind === "x") main.innerHTML = viewExercise(+a);
  else if (kind === "q") main.innerHTML = viewSearch(parts.slice(1).join("/"));
  else if (kind === "r") main.innerHTML = viewReview();
  else if (kind === "d") main.innerHTML = viewDemo(parts.slice(1).join("/"));
  else main.innerHTML = viewHome();
  if (kind === "t" || kind === "d") forwardFrameKeys(main.querySelector("iframe"));
  else main.scrollTop = 0;
  if (kind === "s") setTab("sections", false);
  if (kind === "p") setTab("paths", false);
  if (kind === "x") setTab("exercises", false);
  refreshChrome();
}

// Горячие клавиши работают и когда фокус внутри шпаргалки.
// Через file:// браузер может запретить доступ к iframe — тогда помогает python start.py.
function forwardFrameKeys(frame) {
  if (!frame) return;
  frame.addEventListener("load", () => {
    window.mlcsTheme.notifyFrames();   // шпаргалка получает текущую тему портала
    try {
      frame.contentDocument.addEventListener("keydown", ev => {
        if (["ArrowLeft", "ArrowRight", "Escape", "m", "M", "ь", "Ь", "q", "Q", "й", "Й", "/"].includes(ev.key) && !ev.ctrlKey && !ev.altKey) {
          ev.preventDefault();
          document.dispatchEvent(new KeyboardEvent("keydown", { key: ev.key }));
        }
      });
    } catch (err) { /* другой origin — пропускаем */ }
  });
}

// ---------- мини-рендер markdown для заданий ----------
function markdown(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  const out = []; let list = null, code = null, table = null, para = null;   // para — строки текущего абзаца
  const flush = () => {
    if (list) { out.push(`<${list.tag}>${list.items.map(i => `<li>${i}</li>`).join("")}</${list.tag}>`); list = null; }
    if (table) { out.push(`<table>${table.map((r, k) => `<tr>${r.map(c => k ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("")}</tr>`).join("")}</table>`); table = null; }
    if (para) { out.push(`<p>${para.map(inline).join(" ")}</p>`); para = null; }
  };
  for (const line of src.split(/\r?\n/)) {
    if (code !== null) {
      if (line.startsWith("```")) { out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); code = null; } else code.push(line);
      continue;
    }
    if (line.startsWith("```")) { flush(); code = []; continue; }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { flush(); const l = Math.min(m[1].length + 1, 4); out.push(`<h${l}>${inline(m[2])}</h${l}>`); }
    else if (/^\s*\|.*\|\s*$/.test(line)) {
      if (list || para) flush();
      const cells = line.trim().slice(1, -1).split("|").map(c => c.trim());
      if (!cells.every(c => /^:?-+:?$/.test(c))) (table = table || []).push(cells);
    }
    else if ((m = line.match(/^\s*([-*]|\d+\.)\s+(.*)/))) {
      const tag = /\d/.test(m[1]) ? "ol" : "ul";
      if (/^\s{2,}/.test(line) && list) { list.items[list.items.length - 1] += "<br>• " + inline(m[2]); continue; }
      if (!list || list.tag !== tag) { flush(); list = { tag, items: [] }; }
      list.items.push(inline(m[2]));
    }
    else if (!line.trim()) flush();
    else if (/^\s+\S/.test(line) && list) list.items[list.items.length - 1] += " " + inline(line.trim());
    else { if (list || table) flush(); (para = para || []).push(line.trim()); }   // строки подряд — один абзац
  }
  if (code !== null) out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
  flush();
  return out.join("\n");
}

// ---------- боковая панель ----------
function setTab(tab, rerender = true) {
  state.tab = tab; save();
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  if (rerender) renderNav();
}

function renderNav() {
  const tab = state.tab, hash = location.hash.split("?")[0];
  const item = (href, label, items) =>
    `<a class="navitem ${hash === href ? "active" : ""}" href="${href}"><span>${esc(label)}</span>${items ? countLabel(items) : ""}</a>`;
  let html = "";
  if (tab === "paths") {
    html = DATA.paths.map((p, i) => item(`#/p/${i}`, p.title, pathItems(p))).join("");
  } else if (tab === "exercises") {
    const groups = {};
    DATA.exercises.forEach((e, i) => (groups[e.topic] = groups[e.topic] || []).push([e, i]));
    html = Object.entries(groups).map(([g, list]) => `<div class="navgroup">${esc(g.replace(/_/g, " "))}</div>` +
      list.map(([e, i]) => `<a class="navitem ${hash === "#/x/" + i ? "active" : ""}" href="#/x/${i}"><span>${esc(e.title)}</span><small class="full">${state.exDone[e.id] ? "✔" : ""}</small></a>`).join("")).join("");
  } else {
    html = DATA.parts.map((p, pi) => `<div class="navgroup">${esc(p.title)}</div>` +
      p.sections.map((s, si) => item(`#/s/${pi}/${si}`, s.title, s.items)).join("")).join("");
  }
  document.getElementById("navList").innerHTML = html;
  const active = document.querySelector(".navitem.active");
  if (active) active.scrollIntoView({ block: "nearest" });
}

const THEME_LABELS = { auto: ["🌓", "Тема: как в системе"], light: ["☀️", "Тема: светлая"], dark: ["🌙", "Тема: тёмная"] };
function renderThemeButton() {
  const [icon, label] = THEME_LABELS[window.mlcsTheme.get()];
  const btn = document.getElementById("themeBtn");
  btn.textContent = icon;
  btn.title = `${label} (нажмите, чтобы сменить)`;
  btn.setAttribute("aria-label", label);
}

function refreshChrome() {
  renderThemeButton();
  const p = progress(allTopics);
  document.getElementById("overallBar").style.width = p.pct + "%";
  document.getElementById("overallText").textContent = `${p.n} / ${p.total} изучено`;
  const due = dueTopics().length;
  document.getElementById("dueCount").textContent = due ? due : "";
  document.getElementById("reviewBtn").title = due ? `К повторению сегодня: ${due}` : "Интервальное повторение";
  renderNav();
}

function rerenderKeepScroll() {
  const main = document.getElementById("main"), top = main.scrollTop;
  if (parseHash().parts[0] === "t") {           // не перезагружаем iframe — только кнопку
    const btn = document.querySelector("[data-toggle]");
    if (btn) { const on = isDone(btn.dataset.toggle); btn.classList.toggle("on", on); btn.textContent = on ? "✔ Изучено" : "☐ Изучено"; }
    const box = document.getElementById("rateBox");
    if (box && btn) box.innerHTML = rateButtons(btn.dataset.toggle);
    return;
  }
  render(); main.scrollTop = top;
}

// ---------- события ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-toggle],[data-ex],[data-copy],[data-action],[data-tab-link],[data-qtoggle],[data-rate],[data-theme-toggle],#menuBtn");
  if (!t) return;
  if (t.id === "menuBtn") { document.body.classList.toggle("menu-open"); return; }
  if (t.hasAttribute("data-theme-toggle")) {
    const order = ["auto", "light", "dark"];
    window.mlcsTheme.set(order[(order.indexOf(window.mlcsTheme.get()) + 1) % order.length]);
    renderThemeButton();
    return;
  }
  if (t.dataset.tab) setTab(t.dataset.tab);
  if (t.dataset.tabLink) { e.preventDefault(); setTab(t.dataset.tabLink); document.body.classList.add("menu-open"); }
  if (t.dataset.toggle) { toggleDone(t.dataset.toggle); rerenderKeepScroll(); }
  if (t.hasAttribute("data-qtoggle")) {
    state.qOpen = !state.qOpen; save();
    document.querySelector(".viewer").classList.toggle("qopen", state.qOpen);
  }
  if (t.dataset.rate) {
    rate(t.dataset.topic, t.dataset.rate === "1");
    if (parseHash().parts[0] === "r") render(); else rerenderKeepScroll();
  }
  if (t.dataset.ex) { const id = t.dataset.ex; if (state.exDone[id]) delete state.exDone[id]; else state.exDone[id] = Date.now(); save(); rerenderKeepScroll(); }
  if (t.dataset.copy) { navigator.clipboard && navigator.clipboard.writeText(t.dataset.copy).then(() => { t.textContent = "Скопировано ✔"; }); }
  if (t.dataset.action) action(t.dataset.action);
});
document.addEventListener("change", e => {
  if (e.target.dataset.done) { toggleDone(e.target.dataset.done, e.target.checked); rerenderKeepScroll(); }
});

function action(name) {
  if (name === "review") {
    const done = Object.keys(state.done).filter(f => DATA.titles[f]);
    const pool = done.length ? done : allTopics;
    location.hash = "#/t/" + encodeURIComponent(pool[Math.floor(Math.random() * pool.length)]);
  } else if (name === "export") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 1)], { type: "application/json" }));
    a.download = "ml-cheatsheets-progress.json"; a.click();
  } else if (name === "import") {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json";
    inp.onchange = () => inp.files[0].text().then(txt => {
      try { const s = JSON.parse(txt); state = Object.assign(loadState(), s); save(); render(); alert("Прогресс загружен"); }
      catch (err) { alert("Не удалось прочитать файл прогресса"); }
    });
    inp.click();
  } else if (name === "reset" && confirm("Сбросить весь прогресс? Это нельзя отменить (если не сохранили файл).")) {
    state = { done: {}, exDone: {}, review: {}, last: null, tab: state.tab, qOpen: state.qOpen }; save(); render();
  }
}

const search = document.getElementById("search");
let searchTimer;
search.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { location.hash = search.value.trim() ? "#/q/" + encodeURIComponent(search.value.trim()) : "#/"; }, 150);
});

document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); search.focus(); search.select(); return; }
  if (typing) { if (e.key === "Escape") search.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const inViewer = parseHash().parts[0] === "t";
  if (!inViewer) return;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    const a = document.querySelector(`[data-nav="${e.key === "ArrowRight" ? "next" : "prev"}"][href]`);
    if (a) location.hash = a.getAttribute("href");
  } else if (e.key === "m" || e.key === "M" || e.key === "ь" || e.key === "Ь") {
    const btn = document.querySelector("[data-toggle]"); if (btn) btn.click();
  } else if (e.key === "q" || e.key === "Q" || e.key === "й" || e.key === "Й") {
    const btn = document.querySelector("[data-qtoggle]"); if (btn) btn.click();
  } else if (e.key === "Escape") {
    location.hash = document.querySelector(".vbar a").getAttribute("href");
  }
});

window.addEventListener("hashchange", () => {
  const { parts } = parseHash();
  if (parts[0] !== "q") search.value = "";
  render();
});
setTab(state.tab || "sections", false);
render();
</script>
</body>
</html>

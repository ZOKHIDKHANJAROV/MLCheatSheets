много лишних слов."}, {"q": "Почему для потокового (streaming) распознавания часто выбирают RNN-T или CTC, а не encoder-decoder с attention?", "a": "Классический attention-декодер смотрит на всю запись целиком, поэтому начинает выдавать текст только после конца фразы. CTC и RNN-T выдают символы по мере поступления кадров и хорошо работают с каузальным или чанковым энкодером, что даёт низкую задержку."}, {"q": "Какие ошибки характерны для Whisper и подобных seq2seq моделей?", "a": "Они могут **галлюцинировать** текст на тишине или шуме, зацикливаться на повторах и «додумывать» пропущенные слова, потому что декодер — по сути языковая модель. Помогают VAD (отрезание тишины), ограничения на повторы и проверки по уверенности."}], "astrophysics_cosmology_ml_cheatsheet.html": [{"q": "Что такое simulation-based inference (SBI) и когда он нужен?", "a": "Это вывод параметров модели, когда функцию правдоподобия нельзя записать явно, но можно генерировать данные симулятором. Нейросеть учится по парам (параметры, симуляция) аппроксимировать апостериорное распределение (neural posterior estimation) или правдоподобие."}, {"q": "Почему нейросеть на полях материи может извлечь больше информации о космологических параметрах, чем спектр мощности?", "a": "Спектр мощности — статистика второго порядка и полностью описывает лишь гауссово поле. Поздняя крупномасштабная структура сильно негауссова, и CNN по картам (например, weak lensing) использует информацию более высоких порядков."}, {"q": "Какой главный риск при обучении на симуляциях и применении к реальным наблюдениям?", "a": "Симуляции не идеальны: упрощённая барионная физика, отсутствие инструментальных эффектов. Модель может опираться на артефакты симуляций и давать **смещённые** оценки параметров; нужны тесты на устойчивость к разным симуляторам."}, {"q": "Почему для космологии важна не только точечная оценка, но и калиброванная неопределённость?", "a": "Результаты сравниваются с другими экспериментами (например, «напряжение» по H₀), и неверная ширина интервала ведёт к ложным выводам о новой физике. Поэтому проверяют покрытие апостериорных интервалов на тестовых симуляциях."}, {"q": "Как ML помогает в поиске сильных гравитационных линз?", "a": "Сильные линзы редки, а обзоры содержат миллиарды галактик. CNN, обученные на симулированных линзах, отбирают кандидатов для визуальной и спектроскопической проверки, резко сокращая ручную работу."}], "attention_mechanism_cheatsheet.html": [{"q": "Какую проблему seq2seq без внимания решает механизм внимания?", "a": "Классический encoder-decoder сжимает всё входное предложение в один вектор фиксированного размера — для длинных предложений это узкое место. Внимание позволяет декодеру на каждом шаге смотреть на все состояния энкодера и выбирать нужные."}, {"q": "Как в общих чертах вычисляется внимание?", "a": "Для текущего запроса считаются оценки сходства со всеми ключами, через softmax превращаются в веса, и результат — взвешенная сумма значений: context = Σ αᵢ·vᵢ."}, {"q": "Чем аддитивное внимание (Bahdanau) отличается от мультипликативного (Luong)?", "a": "Аддитивное считает оценку маленькой нейросетью: vᵀ·tanh(W₁q + W₂k). Мультипликативное — скалярным произведением qᵀk (или qᵀWk). Скалярное быстрее и легко параллелится матричными операциями."}, {"q": "Что показывают веса внимания и можно ли им полностью доверять как объяснению?", "a": "Они показывают, на какие входные элементы модель «смотрела» при выходе, — например, выравнивание слов при переводе. Но это не строгое объяснение причин решения: разные распределения внимания могут давать одинаковый прогноз."}, {"q": "Почему внимание стало основой трансформеров?", "a": "Оно напрямую связывает любые две позиции последовательности за один шаг (а не через цепочку рекуррентных шагов) и полностью параллелится. Трансформер построен на внимании без рекуррентности."}], "audio_classification_cheatsheet.html": [{"q": "Почему для классификации звуков часто используют CNN на спектрограммах?", "a": "Log-mel спектрограмма — это двумерная «картинка» время × частота, в которой характерные звуки образуют локальные паттерны. CNN хорошо их находит, и можно переиспользовать предобученные архитектуры; специализированные модели вроде PANNs и AST обучены на AudioSet."}, {"q": "Какие аугментации специфичны для аудио?", "a": "**SpecAugment** (маскирование полос частот и отрезков времени), сдвиг по времени, изменение высоты тона и скорости, добавление фонового шума и **mixup** записей. Нужно следить, чтобы аугментация не меняла класс (например, pitch shift для задачи определения ноты)."}, {"q": "Как обрабатывать записи разной длины?", "a": "Обрезать или дополнять до фиксированной длины, либо резать запись на окна, классифицировать каждое и **агрегировать** предсказания (среднее или максимум). Глобальный pooling по времени позволяет CNN принимать вход переменной длины."}, {"q": "Чем multi-label классификация звуков отличается от multi-class и какую функцию потерь использовать?", "a": "В реальной записи одновременно могут звучать несколько источников (речь, музыка, сирена), поэтому классы не взаимоисключающие. Используют **сигмоиду на каждый класс** и бинарную кросс-энтропию вместо softmax; метрики — mAP или F1 по классам."}, {"q": "Какая утечка данных типична для аудио-датасетов?", "a": "Фрагменты одной и той же исходной записи (или одного источника) попадают и в train, и в test — модель запоминает микрофон и фон, а не класс. Разбиение нужно делать **по исходным записям** или по готовым фолдам датасета (как в ESC-50 и UrbanSound8K)."}], "audio_generation_cheatsheet.html": [{"q": "Почему генерировать сырой звук сложно?", "a": "Звук имеет десятки тысяч отсчётов в секунду (16–48 кГц), а смысловые структуры живут на масштабах секунд и минут. Авторегрессия по отсчётам (WaveNet) очень медленная, поэтому современные модели работают в сжатом латентном пространстве или на спектрограммах."}, {"q": "Зачем нужны нейроаудиокодеки вроде EnCodec и SoundStream?", "a": "Они сжимают звук в последовательность **дискретных токенов** с помощью residual vector quantization и умеют восстанавливать звук обратно. На этих токенах можно обучать языковые модели (AudioLM, MusicGen, VALL-E) как на тексте, а длина последовательности на порядки меньше числа отсчётов."}, {"q": "Чем отличаются авторегрессионный и диффузионный подходы к генерации аудио?", "a": "Авторегрессионные модели генерируют токены по одному — хорошо держат структуру, но медленны и копят ошибки. Диффузионные (AudioLDM и аналоги) итеративно очищают шум, обычно в латентном пространстве спектрограммы или кодека, и генерируют весь фрагмент параллельно, но требуют многих шагов денойзинга."}, {"q": "Почему для оценки сгенерированного аудио используют FAD, а не поотсчётное сравнение с эталоном?", "a": "У генерации нет единственного правильного ответа, поэтому MSE с эталоном бессмысленна. **Fréchet Audio Distance** сравнивает распределения эмбеддингов (например, VGGish) сгенерированных и реальных записей, по аналогии с FID для изображений; дополнительно проводят субъективные оценки слушателями."}, {"q": "Какие риски несёт генерация речи и музыки?", "a": "Клонирование голоса позволяет создавать **дипфейки** для мошенничества, а музыкальные модели могут воспроизводить фрагменты обучающих данных, нарушая авторские права. Поэтому применяют водяные знаки, детекторы синтеза и ограничения на клонирование чужого голоса без согласия."}], "audio_processing_spectrograms_mfcc_cheatsheet.html": [{"q": "Почему для анализа звука используют кратковременное преобразование Фурье, а не одно преобразование всего сигнала?", "a": "Звук нестационарен: частотный состав меняется во времени. STFT считает спектр в коротких перекрывающихся окнах (обычно 20–40 мс), и получается **спектрограмма** — зависимость энергии от времени и частоты. Одно FFT всего сигнала потеряло бы информацию о том, когда звучала каждая частота."}, {"q": "Какой компромисс задаёт длина окна STFT?", "a": "Длинное окно даёт хорошее **частотное** разрешение, но плохое временное, короткое — наоборот (принцип неопределённости). Например, при 16 кГц окно 512 отсчётов (32 мс) даёт шаг по частоте 16000 / 512 = 31.25 Гц."}, {"q": "Зачем нужна мел-шкала и логарифм амплитуды?", "a": "Человек различает частоты примерно линейно до ~1 кГц и логарифмически выше; мел-фильтры повторяют это, сжимая высокие частоты. Логарифм (дБ) отражает логарифмическое восприятие громкости и сжимает огромный динамический диапазон, что облегчает обучение моделей."}, {"q": "Чем MFCC отличаются от log-mel спектрограммы и что используют в современных нейросетях?", "a": "MFCC получают применением **DCT** к log-mel спектру: коэффициенты становятся декоррелированными и компактными (обычно 13–40), что было удобно для GMM-HMM. Нейросети (CNN, трансформеры) обычно работают прямо с **log-mel спектрограммой**, так как DCT отбрасывает часть информации, а декорреляция им не нужна."}, {"q": "Какая типичная ошибка при подготовке аудио к модели?", "a": "Подавать аудио с **другой частотой дискретизации**, чем при обучении (например, 44.1 кГц вместо 16 кГц) или не согласовывать параметры STFT и мел-фильтров между train и inference. Признаки получаются сдвинутыми по частоте, и качество падает без явных ошибок."}], "autoencoders_cheatsheet.html": [{"q": "Как устроен автоэнкодер и на что он обучается?", "a": "Энкодер сжимает вход в представление меньшей размерности (латентный код), декодер восстанавливает по нему вход. Обучается минимизировать ошибку реконструкции — разметка не нужна."}, {"q": "Почему узкое горлышко (bottleneck) обязательно?", "a": "Без ограничения сеть может выучить тождественное отображение и просто скопировать вход, ничего не узнав о структуре данных. Узкий код (или другая регуляризация) заставляет сохранять только главное."}, {"q": "Как связан линейный автоэнкодер с PCA?", "a": "Автоэнкодер с линейными слоями и MSE учит то же подпространство, что и PCA по главным компонентам. Нелинейные активации позволяют находить более сложные, нелинейные многообразия."}, {"q": "Что такое denoising autoencoder?", "a": "На вход подаются зашумлённые данные, а восстановить нужно чистые. Модель учится устойчивым признакам и может применяться для удаления шума."}, {"q": "Как использовать автоэнкодер для поиска аномалий?", "a": "Обучить его на нормальных данных. Аномальные объекты он восстанавливает плохо, поэтому большая ошибка реконструкции служит оценкой аномальности; порог подбирают на валидации."}], "automl_cheatsheet.html": [{"q": "Что такое задача CASH в AutoML?", "a": "Combined Algorithm Selection and Hyperparameter optimization — одновременный выбор алгоритма и его гиперпараметров как единая задача оптимизации в иерархическом пространстве. Её решают, например, байесовской оптимизацией (SMAC в Auto-sklearn)."}, {"q": "Почему AutoML может переобучиться на валидации?", "a": "При переборе тысяч конфигураций выбирается та, что случайно лучше на конкретном валидационном наборе. Нужен отдельный тестовый набор, который AutoML не видит, или вложенная кросс-валидация для честной оценки."}, {"q": "Чем байесовская оптимизация гиперпараметров лучше случайного поиска и когда выигрыш мал?", "a": "Она использует результаты прошлых запусков, чтобы выбирать перспективные точки, и экономит дорогие обучения. При очень дешёвых моделях или большом числе слабо значимых параметров случайный поиск сопоставим и проще параллелится."}, {"q": "Зачем в AutoML используют successive halving и Hyperband?", "a": "Многие конфигурации запускаются на малом бюджете (мало эпох или данных), и лишь лучшая доля получает больше ресурсов. Плохие варианты отсекаются рано, что резко ускоряет поиск."}, {"q": "Какие задачи AutoML не снимает с дата-сайентиста?", "a": "Постановку задачи и выбор метрики, сбор и очистку данных, проверку на утечки, доменный feature engineering, интерпретацию и мониторинг модели в продакшене. AutoML оптимизирует то, что ему дали, включая ошибки в данных."}], "automl_neural_networks_cheatsheet.html": [{"q": "Из каких трёх компонент состоит задача Neural Architecture Search?", "a": "**Пространство поиска** (какие архитектуры допустимы), **стратегия поиска** (случайный поиск, RL, эволюция, байесовская оптимизация, градиентные методы) и **оценка качества** кандидатов. Именно оценка обычно самая дорогая часть."}, {"q": "Почему ранние NAS требовали тысяч GPU-дней и как это удешевили?", "a": "Каждую архитектуру обучали с нуля. Удешевили через **weight sharing** (one-shot / суперсеть, ENAS), дифференцируемый поиск (**DARTS**), раннюю остановку, обучение на меньших данных и предсказатели качества."}, {"q": "В чём идея DARTS и какая у неё известная проблема?", "a": "Дискретный выбор операции заменяется взвешенной смесью всех операций с весами через softmax, и архитектурные параметры оптимизируются градиентом вместе с весами. Известная проблема — коллапс в сторону **skip-connection** и нестабильность: найденная архитектура может плохо работать после дискретизации."}, {"q": "Чем Hyperband отличается от обычного случайного поиска гиперпараметров?", "a": "Hyperband запускает много конфигураций с маленьким бюджетом (мало эпох) и по схеме **successive halving** оставляет лучшие, давая им больше ресурсов. Так плохие конфигурации отсекаются рано, и вычисления тратятся на перспективные."}, {"q": "Почему важно сравнивать результат NAS с сильным случайным поиском?", "a": "Исследования показали, что в хорошо спроектированном пространстве поиска случайный поиск часто почти не уступает сложным методам. Значительная часть успеха NAS идёт от удачного пространства поиска и протокола обучения, а не от самого алгоритма."}], "backpropagation_cheatsheet.html": [{"q": "На каком правиле дифференцирования основан backpropagation?", "a": "На цепном правиле: ∂L/∂w = ∂L/∂y · ∂y/∂z · ∂z/∂w. Градиент передаётся от выхода к входу, и каждый слой умножает пришедший градиент на свою локальную производную."}, {"q": "Зачем во время прямого прохода сохраняются промежуточные значения?", "a": "Локальные производные зависят от входов и выходов слоёв (например, производная ReLU — от знака входа). Поэтому активации запоминаются при прямом проходе, и это главный потребитель памяти при обучении."}, {"q": "Почему обратный проход выгоднее, чем считать производную по каждому весу отдельно?", "a": "Backpropagation переиспользует общие части цепочки и вычисляет градиенты по всем параметрам примерно за стоимость одного прямого прохода. Численное дифференцирование потребовало бы отдельного прохода на каждый параметр."}, {"q": "Что такое взрыв и затухание градиентов и как с ними борются?", "a": "При перемножении многих производных по слоям градиент экспоненциально растёт или убывает. Помогают ReLU-подобные активации, правильная инициализация (He, Xavier), нормализация (BatchNorm, LayerNorm), residual-связи, ограничение нормы градиента (gradient clipping)."}, {"q": "Почему в PyTorch перед `loss.backward()` вызывают `optimizer.zero_grad()`?", "a": "PyTorch накапливает (суммирует) градиенты в `.grad` при каждом `backward()`. Без обнуления градиенты прошлых шагов смешаются с текущими."}], "bagging_cheatsheet.html": [{"q": "Почему бэггинг уменьшает дисперсию, но почти не меняет смещение?", "a": "Усреднение B моделей с дисперсией σ² и попарной корреляцией ρ даёт дисперсию ρσ² + (1 − ρ)σ²/B, то есть она падает с ростом B. Смещение среднего равно смещению отдельной модели, поэтому бэггинг полезен для нестабильных моделей с низким смещением."}, {"q": "Какая доля объектов не попадает в бутстреп-выборку?", "a": "Вероятность не выбрать объект за n извлечений — (1 − 1/n)ⁿ → 1/e ≈ **0.368**. Значит, около 63.2% уникальных объектов попадают в выборку, а оставшиеся ~37% (out-of-bag) можно использовать для оценки качества."}, {"q": "Почему бэггинг почти не помогает линейной регрессии или kNN с большим k?", "a": "Это стабильные модели: небольшие изменения обучающей выборки мало меняют их предсказания, модели в ансамбле получаются сильно коррелированными, и усреднять почти нечего. Бэггинг эффективен для нестабильных алгоритмов — глубоких деревьев, нейросетей."}, {"q": "Чем случайный лес отличается от бэггинга деревьев?", "a": "Помимо бутстрепа объектов, случайный лес в каждом **разбиении** рассматривает случайное подмножество признаков (например, √p для классификации). Это снижает корреляцию ρ между деревьями — иначе все они делили бы первыми одни и те же сильные признаки — и сильнее уменьшает дисперсию ансамбля."}, {"q": "Чем pasting, random subspaces и random patches отличаются от бэггинга?", "a": "**Pasting** — подвыборки объектов без возвращения, **random subspaces** — все объекты, но случайные подмножества признаков, **random patches** — подвыборки и объектов, и признаков. В sklearn всё это задаётся параметрами `BaggingClassifier`: `bootstrap`, `max_samples`, `max_features`, `bootstrap_features`."}], "batch_normalization_cheatsheet.html": [{"q": "Что делает BatchNorm на этапе обучения?", "a": "Нормализует каждый признак по статистикам мини-батча: x̂ = (x − μ_B)/√(σ²_B + ε), затем применяет обучаемые масштаб и сдвиг γx̂ + β, чтобы сеть могла восстановить нужное распределение."}, {"q": "Чем BatchNorm на инференсе отличается от обучения?", "a": "На инференсе используются накопленные **скользящие средние** μ и σ², а не статистики батча, поэтому выход не зависит от других объектов. Если забыть `model.eval()`, предсказания будут зависеть от состава батча."}, {"q": "Почему BatchNorm плохо работает с маленьким батчем?", "a": "Оценки μ и σ² по 2–4 объектам очень шумные, и обучение нестабильно, а при батче 1 нормализация вырождается. Альтернативы — GroupNorm, LayerNorm, синхронизированный BN по нескольким GPU."}, {"q": "Почему в трансформерах используют LayerNorm, а не BatchNorm?", "a": "Последовательности имеют разную длину и паддинг, а статистики по батчу в NLP нестабильны. LayerNorm нормализует по признакам внутри одного токена и не зависит от батча, поэтому одинаково работает при обучении и инференсе."}, {"q": "Зачем убирать bias у свёртки перед BatchNorm?", "a": "BN вычитает среднее, поэтому любой константный сдвиг от bias полностью уничтожается, а роль сдвига выполняет β. Bias лишь добавляет бесполезные параметры (`bias=False`)."}], "bayesian_approach_cheatsheet.html": [{"q": "Чем байесовское понимание вероятности отличается от частотного?", "a": "Частотный подход: вероятность — предельная частота события, параметры фиксированы, но неизвестны. Байесовский: вероятность — **степень уверенности**, параметры — случайные величины с распределением, которое обновляется данными."}, {"q": "Чем байесовский достоверный интервал отличается от доверительного?", "a": "95% **достоверный** интервал: параметр лежит в нём с вероятностью 95% при данных и prior. 95% **доверительный**: при многократном повторении эксперимента 95% таких интервалов накроют истинное значение; про конкретный интервал вероятность не говорится."}, {"q": "Что такое MAP-оценка и чем она хуже полного posterior?", "a": "MAP — мода апостериорного распределения, argmax P(θ|D). Это точечная оценка: она теряет информацию о неопределённости и зависит от параметризации; полный posterior позволяет усреднять прогнозы по всем θ."}, {"q": "Как правильно выбирать prior?", "a": "На основе предметных знаний (информативный) или слабоинформативный, который исключает абсурдные значения, но слабо влияет на результат. Стоит проверять чувствительность результата к prior и делать prior predictive check."}, {"q": "Почему байесовские методы полезны при маленьких данных?", "a": "Prior регуляризует оценку и не даёт ей «улетать» при малом n, а posterior честно показывает большую неопределённость. При большом n результаты сближаются с частотными."}], "bayesian_hyperparameter_optimization_cheatsheet.html": [{"q": "Чем байесовская оптимизация принципиально отличается от случайного поиска?", "a": "Она использует результаты прошлых испытаний: строит **суррогатную модель** зависимости «гиперпараметры → качество» и выбирает следующую точку там, где ожидается наибольшая польза. Случайный поиск выбирает каждую точку независимо от истории."}, {"q": "Зачем нужна функция приобретения (acquisition function) и какой баланс она решает?", "a": "По предсказанию суррогата (среднее μ и неопределённость σ) она решает, где оценить функцию дальше, балансируя **exploitation** (точки с хорошим μ) и **exploration** (точки с большой σ). Примеры: Expected Improvement, Probability of Improvement, UCB = μ + κσ."}, {"q": "Чем TPE отличается от подхода на гауссовском процессе?", "a": "ГП моделирует p(y | x) напрямую, плохо масштабируется (O(n³) по числу испытаний) и неудобен для категориальных и условных параметров. **TPE** (Optuna, Hyperopt) моделирует p(x | y) двумя плотностями — для «хороших» и «плохих» испытаний — и выбирает x, максимизирующий их отношение; он легко работает с условными пространствами."}, {"q": "Когда байесовская оптимизация не даёт выигрыша по сравнению со случайным поиском?", "a": "Когда одно обучение дешёвое и можно сделать тысячи случайных проб, когда пространство очень высокоразмерное (десятки параметров) или целевая функция сильно зашумлена. Её преимущество — экономия на дорогих оценках при небольшом числе параметров."}, {"q": "Почему байесовскую оптимизацию трудно эффективно распараллелить?", "a": "Она по природе последовательна: следующая точка выбирается с учётом результата предыдущей. При параллельном запуске приходится предлагать несколько точек без известных результатов (например, подставляя фиктивные значения — стратегия constant liar), что снижает информативность каждой пробы."}], "bayesian_inference_cheatsheet.html": [{"q": "Чем байесовская оценка параметра отличается от оценки максимального правдоподобия (MLE)?", "a": "MLE даёт одну точку θ, максимизирующую P(D|θ). Байесовский вывод даёт **всё апостериорное распределение** P(θ|D) ∝ P(D|θ)·P(θ), учитывая априорные знания и позволяя оценить неопределённость (например, достоверный интервал)."}, {"q": "Почему при большом количестве данных выбор prior перестаёт сильно влиять на результат?", "a": "Правдоподобие — произведение по всем наблюдениям, и с ростом n оно становится всё более острым и доминирует над фиксированным prior. Апостериорное распределение концентрируется около MLE (если prior не обнуляет эту область)."}, {"q": "Что такое сопряжённый prior и зачем он нужен?", "a": "Prior, при котором posterior остаётся в том же семействе распределений: например, **Beta** для биномиального правдоподобия, **Gamma** для пуассоновского, нормальное для среднего нормального распределения. Это даёт аналитический posterior без MCMC."}, {"q": "Посчитайте: prior Beta(2, 2), наблюдали 8 успехов из 10. Какой posterior и его среднее?", "a": "Posterior = Beta(2 + 8, 2 + 2) = **Beta(10, 4)**, среднее = 10 / 14 ≈ 0.71. Для сравнения, MLE = 0.8 — prior слегка «стягивает» оценку к 0.5."}, {"q": "Почему знаменатель P(D) в теореме Байеса часто не вычисляют?", "a": "P(D) = ∫P(D|θ)P(θ)dθ — обычно трудный интеграл, но он не зависит от θ и лишь нормирует posterior. Для MAP-оценки и для MCMC достаточно ненормированного P(D|θ)P(θ); P(D) нужен только для сравнения моделей (байесовский фактор)."}], "bayesian_neural_networks_cheatsheet.html": [{"q": "Чем байесовская нейросеть отличается от обычной?", "a": "Вместо точечной оценки весов она хранит **распределение** p(w | D). Предсказание — усреднение по весам: p(y | x, D) = ∫ p(y | x, w)·p(w | D) dw, что даёт не только прогноз, но и оценку неопределённости."}, {"q": "Чем эпистемическая неопределённость отличается от алеаторной?", "a": "**Эпистемическая** — неопределённость модели из-за нехватки данных; она уменьшается с ростом выборки и велика вне обучающего распределения. **Алеаторная** — шум в самих данных, её нельзя убрать дополнительными данными; распределение весов отражает эпистемическую, а алеаторную моделируют выходом сети (например, предсказанной дисперсией)."}, {"q": "Почему точный байесовский вывод для нейросети невозможен и какие есть приближения?", "a": "Апостериорное распределение по миллионам весов не имеет аналитической формы, а нормирующий интеграл не вычислим. Используют **вариационный вывод** (Bayes by Backprop, максимизация ELBO), MCMC (HMC, SGLD), лапласовскую аппроксимацию и практичные приближения — MC Dropout и глубокие ансамбли."}, {"q": "Как работает MC Dropout и в чём его ловушка?", "a": "Dropout оставляют включённым на инференсе и делают T прогонов: среднее предсказаний — прогноз, разброс — оценка неопределённости. Ловушка: оценка зависит от выбранной вероятности dropout и часто занижена, это грубое приближение, а не точный байесовский вывод."}, {"q": "Что будет с вариационной BNN, если выбрать слишком «узкий» prior?", "a": "KL-член в ELBO будет сильно тянуть веса к нулю, сеть недообучится и покажет плохое качество. На больших данных влияние prior уменьшается, но на малых выбор prior и масштаба KL-члена критичен."}], "bayesian_optimization_cheatsheet.html": [{"q": "В чём идея байесовской оптимизации гиперпараметров?", "a": "Строится вероятностная суррогатная модель зависимости качества от гиперпараметров (например, гауссовский процесс). Следующая точка выбирается по ней так, чтобы с наибольшей пользой проверить дорогую целевую функцию."}, {"q": "Что такое функция приобретения (acquisition function)?", "a": "Правило выбора следующей точки по суррогатной модели. Примеры: Expected Improvement (ожидаемое улучшение над лучшим результатом), Upper Confidence Bound, Probability of Improvement."}, {"q": "Как байесовская оптимизация балансирует exploration и exploitation?", "a": "Функция приобретения учитывает и прогноз качества (exploitation — искать рядом с хорошими точками), и неопределённость (exploration — проверять мало изученные области). Например, UCB = μ + κ·σ."}, {"q": "Когда байесовская оптимизация выгоднее случайного поиска?", "a": "Когда одно обучение очень дорогое (часы и дни) и можно сделать лишь десятки попыток. Если запуски дешёвые и их можно делать тысячами параллельно, простой случайный поиск бывает не хуже."}, {"q": "Почему классический гауссовский процесс плохо масштабируется?", "a": "Его обучение требует обращения матрицы размера n×n по числу наблюдений — O(n³). Кроме того, ему трудно работать с категориальными и условными гиперпараметрами; поэтому применяют TPE и случайные леса в качестве суррогата."}], "bert_finetuning_cheatsheet.html": [{"q": "Как дообучают BERT для классификации текстов?", "a": "Поверх предобученного энкодера добавляют линейный слой, принимающий представление токена [CLS] (или пулинг по токенам), и обучают всю модель целиком на размеченных примерах с небольшим learning rate."}, {"q": "Какие гиперпараметры типичны для fine-tuning BERT?", "a": "Learning rate порядка 2e-5 – 5e-5, 2–4 эпохи, batch size 16–32, AdamW с weight decay, линейный warmup около 10% шагов и затем линейное затухание."}, {"q": "Почему при fine-tuning легко переобучиться и как с этим бороться?", "a": "Модель огромная, а размеченных данных часто мало. Помогают малое число эпох и ранняя остановка, dropout, weight decay, заморозка нижних слоёв, несколько запусков с разными seed (результаты на малых данных нестабильны)."}, {"q": "Что делать с текстами длиннее 512 токенов?", "a": "Обрезать (часто начало и конец содержат главное), разбивать на перекрывающиеся окна и агрегировать прогнозы, или использовать модели для длинного контекста (Longformer, BigBird)."}, {"q": "Что такое параметрически-эффективное дообучение (LoRA, адаптеры)?", "a": "Исходные веса замораживаются, обучается лишь небольшое число дополнительных параметров: низкоранговые добавки к матрицам весов (LoRA) или маленькие модули-адаптеры. Качество близко к полному дообучению, а памяти и места на диске нужно намного меньше."}], "bert_language_models_cheatsheet.html": [{"q": "Какую часть Transformer использует BERT?", "a": "Только энкодер. Модель двунаправленная: каждый токен видит контекст и слева, и справа."}, {"q": "Как устроена задача предобучения Masked Language Modeling?", "a": "Около 15% токенов выбирают для маскирования, и модель предсказывает исходные токены по контексту. Из выбранных: 80% заменяются на [MASK], 10% — на случайный токен, 10% остаются без изменений, чтобы не было расхождения с дообучением, где [MASK] нет."}, {"q": "Для чего нужен токен [CLS]?", "a": "Специальный токен в начале входа; его итоговое представление используется как вектор всей последовательности для задач классификации при дообучении."}, {"q": "Почему BERT плохо подходит для генерации текста?", "a": "Он обучен восстанавливать пропуски с двусторонним контекстом, а не предсказывать следующий токен слева направо. Для генерации используют декодерные модели (GPT) или encoder-decoder (T5)."}, {"q": "Какие улучшения BERT вы знаете?", "a": "RoBERTa — больше данных и шагов, без задачи NSP, динамическое маскирование. DistilBERT — дистилляция в модель меньше и быстрее. ALBERT — разделение параметров между слоями. DeBERTa — раздельное кодирование содержания и позиции."}], "bias_neural_networks_cheatsheet.html": [{"q": "Откуда в нейросетях берётся предвзятость, если алгоритм «нейтральный»?", "a": "В основном из данных: историческая дискриминация в метках, недопредставленность групп, смещённая разметка, прокси-признаки. Плюс из выбора целевой переменной и метрики: оптимизация средней ошибки игнорирует малые группы."}, {"q": "Почему удаление чувствительного признака (пола, расы) не устраняет предвзятость?", "a": "Остальные признаки служат **прокси** — индекс, имя, покупки коррелируют с защищённым атрибутом, и модель восстанавливает его косвенно. Кроме того, без этого признака сложнее измерить и исправить несправедливость."}, {"q": "Как предвзятость проявляется в словесных эмбеддингах?", "a": "Эмбеддинги усваивают стереотипы из корпуса: например, вектор «врач» ближе к «он», а «медсестра» — к «она». Это переносится в downstream-задачи вроде поиска резюме; для измерения используют тесты вроде **WEAT**."}, {"q": "Почему высокая общая accuracy может скрывать проблему?", "a": "Если группа составляет 5% данных, модель может ошибаться на ней в разы чаще, почти не влияя на среднюю метрику. Поэтому метрики нужно считать **по подгруппам** (disaggregated evaluation)."}, {"q": "На каких этапах можно бороться с предвзятостью?", "a": "**Pre-processing** — перевзвешивание и балансировка данных; **in-processing** — штрафы за несправедливость в функции потерь, adversarial debiasing; **post-processing** — отдельные пороги для групп. У каждого подхода свой компромисс с точностью и юридическими ограничениями."}], "bias_variance_cheatsheet.html": [{"q": "Из каких слагаемых складывается ожидаемая ошибка модели на новых данных (для MSE)?", "a": "Ошибка = **смещение²** + **дисперсия** + **неустранимый шум**. Смещение — систематическая ошибка из-за слишком простой модели, дисперсия — чувствительность модели к конкретной обучающей выборке, шум — случайность в самих данных."}, {"q": "Какая модель переобучается — с высоким смещением или с высокой дисперсией?", "a": "С высокой **дисперсией**: она подстраивается под шум обучающей выборки, хорошо работает на train и плохо на test. Высокое смещение — признак недообучения: плохо и на train, и на test."}, {"q": "Как меняются смещение и дисперсия при росте сложности модели?", "a": "Смещение обычно уменьшается, дисперсия растёт. Оптимум — сложность, при которой их сумма минимальна (U-образная кривая ошибки на тесте)."}, {"q": "Назовите способы уменьшить дисперсию, не меняя тип модели.", "a": "Собрать больше данных; добавить регуляризацию (L1/L2, ограничение глубины дерева); усреднить много моделей (бэггинг, случайный лес); уменьшить число признаков."}, {"q": "Как по кривым обучения отличить высокое смещение от высокой дисперсии?", "a": "Высокое смещение: ошибки на train и validation близки, но обе высокие — больше данных не поможет. Высокая дисперсия: большой разрыв между низкой ошибкой на train и высокой на validation — помогут больше данных и регуляризация."}], "bias_variance_decomposition_cheatsheet.html": [{"q": "На какие слагаемые раскладывается ожидаемая квадратичная ошибка?", "a": "E[(y − ŷ)²] = Bias² + Variance + σ², где Bias — отклонение среднего (по обучающим выборкам) прогноза от истинной функции, Variance — разброс прогноза при смене обучающей выборки, σ² — неустранимый шум в данных."}, {"q": "Почему неустранимую ошибку σ² нельзя уменьшить никакой моделью?", "a": "Она вызвана случайностью самого таргета при фиксированных признаках (шум измерений, неучтённые факторы). Даже идеальная модель, знающая истинную функцию, не сможет её предсказать — уменьшить её можно только новыми информативными признаками или более точными данными."}, {"q": "Как сложность модели влияет на смещение и дисперсию?", "a": "С ростом сложности смещение обычно падает (модель может описать более сложные зависимости), а дисперсия растёт (модель сильнее подстраивается под шум конкретной выборки). Оптимальная сложность минимизирует их сумму, отсюда U-образная кривая ошибки на тесте."}, {"q": "Как бэггинг и бустинг воздействуют на эти компоненты?", "a": "Бэггинг (случайный лес) усредняет много моделей с низким смещением и высокой дисперсией и в основном снижает дисперсию. Бустинг последовательно исправляет ошибки слабых моделей с высоким смещением и в основном снижает смещение."}, {"q": "Как оценить смещение и дисперсию на практике?", "a": "Обучить модель на многих бутстрэп-выборках (или разных разбиениях) и для каждого тестового объекта посчитать средний прогноз и разброс прогнозов: квадрат отличия среднего прогноза от таргета даёт оценку bias² (вместе с шумом), а разброс — variance. Для этого есть, например, `bias_variance_decomp` в библиотеке mlxtend."}], "bidirectional_rnn_cheatsheet.html": [{"q": "Как устроена двунаправленная RNN?", "a": "Две независимые RNN читают последовательность слева направо и справа налево, а их скрытые состояния на каждом шаге конкатенируются. Каждое представление учитывает и прошлый, и будущий контекст."}, {"q": "Когда двунаправленную RNN использовать нельзя?", "a": "Когда нужен онлайн-прогноз или авторегрессивная генерация: будущих элементов на момент предсказания ещё нет. Например, при прогнозе временного ряда на следующий шаг или генерации текста слово за словом это утечка будущего."}, {"q": "Для каких задач она особенно полезна?", "a": "Для задач, где вся последовательность доступна сразу: NER, POS-тегирование, классификация текста, распознавание речи офлайн, энкодер в seq2seq. Значение слова часто определяется правым контекстом."}, {"q": "Как меняется размер выхода при `bidirectional` с hidden_size = 128?", "a": "При конкатенации выход на каждом шаге имеет размер 2·128 = 256; следующий слой должен ожидать 256 входов. В PyTorch финальное `h_n` содержит отдельные состояния для каждого направления."}, {"q": "Какая ловушка при использовании финального состояния для классификации?", "a": "Для обратного направления «финальное» состояние соответствует **первому** токену, а не последнему. Если брать выход `output[:, -1]`, то обратная часть видела только последний токен; правильнее брать `h_n` обоих направлений или делать пулинг."}], "binning_discretization_cheatsheet.html": [{"q": "Чем отличаются равноширокие и равночастотные (квантильные) бины?", "a": "**Равноширокие** делят диапазон на интервалы одинаковой длины — при асимметричном распределении многие бины почти пустые. **Квантильные** содержат примерно одинаковое число объектов — устойчивы к выбросам, но границы неравномерные."}, {"q": "Почему биннинг может ухудшить качество модели?", "a": "Внутри бина теряется информация о порядке и точном значении, на границах появляются скачки. Для деревьев и бустинга биннинг вручную обычно бесполезен — они сами подбирают оптимальные пороги."}, {"q": "Когда биннинг полезен?", "a": "Для линейных моделей, чтобы уловить нелинейность (с one-hot кодированием бинов), для устойчивости к выбросам, для интерпретируемости (скоринговые карты в банках с WoE) и когда шкала признака по смыслу ступенчатая (возрастные группы)."}, {"q": "Почему границы бинов нужно определять только на train?", "a": "Квантили, посчитанные по всем данным, переносят информацию о распределении теста в обучение. В sklearn `KBinsDiscretizer` обучают `fit` на train и применяют `transform` к тесту."}, {"q": "Что такое supervised-биннинг и чем он рискован?", "a": "Границы подбираются с учётом целевой переменной (например, по разбиениям дерева решений или максимизации IV). Это повышает информативность бинов, но может переобучиться и давать утечку, если подбирать границы на тех же данных, на которых оценивают модель."}], "bioinformatics_computational_biology_cheatsheet.html": [{"q": "Почему в RNA-seq анализе нужна нормализация счётчиков?", "a": "Число ридов зависит от глубины секвенирования и длины гена, а не только от экспрессии. Без нормализации (CPM/TPM, size factors в DESeq2) сравнение образцов и генов некорректно."}, {"q": "Зачем нужна поправка на множественное тестирование при поиске дифференциально экспрессированных генов?", "a": "Тестируются десятки тысяч генов, и при p < 0.05 ожидаются сотни ложных открытий. Поправка Benjamini–Hochberg контролирует **FDR** — долю ложных среди найденных."}, {"q": "Почему для single-cell данных перед кластеризацией обычно делают PCA, а UMAP используют для визуализации?", "a": "Данные очень разреженные и многомерные; PCA снижает шум и размерность для построения графа соседей. UMAP хорошо показывает локальную структуру, но искажает расстояния между кластерами, поэтому по нему нельзя судить о глобальной близости."}, {"q": "Что такое проблема «p ≫ n» в геномике и как с ней работают?", "a": "Признаков (генов, SNP) гораздо больше, чем образцов, и модели легко переобучаются. Применяют регуляризацию (L1/elastic net), отбор признаков, снижение размерности и строгую кросс-валидацию с отбором признаков внутри фолдов."}, {"q": "Почему отбор признаков вне кросс-валидации — частая ошибка в биоинформатике?", "a": "Если гены выбраны по всем данным, информация о тестовых образцах уже «утекла» в модель, и оценка качества сильно завышается. Отбор должен выполняться заново внутри каждого фолда обучения."}], "biologically_inspired_architectures_cheatsheet.html": [{"q": "Какие идеи CNN заимствованы из зрительной коры?", "a": "**Локальные рецептивные поля**, иерархия простых и сложных клеток (Хьюбел и Визел), а также пулинг как аналог инвариантности сложных клеток. Неокогнитрон Фукусимы был прямым предшественником CNN."}, {"q": "Почему backpropagation считается биологически неправдоподобным?", "a": "Он требует симметричных прямых и обратных весов (проблема **weight transport**), точной передачи ошибки назад по отдельному пути и разделения фаз прямого и обратного прохода. Мозг, по современным данным, так не работает."}, {"q": "Что такое feedback alignment и что он показал?", "a": "Ошибка передаётся назад через **случайные фиксированные** матрицы вместо транспонированных весов. Удивительно, но сеть всё равно обучается: прямые веса подстраиваются так, что обратный сигнал становится полезным."}, {"q": "В чём идея predictive coding?", "a": "Каждый уровень иерархии предсказывает активность нижнего, а вверх передаются лишь ошибки предсказания. Обучение минимизирует ошибки локально; при определённых условиях это приближает backpropagation."}, {"q": "Почему «биологически вдохновлённое» не означает автоматически лучшее для ML?", "a": "Мозг оптимизирован под другие ограничения — энергию, локальность, эволюцию. Многие инженерные решения (backprop, attention, BatchNorm) не биологичны, но эффективны, а биологически точные модели часто уступают по качеству."}], "birch_cheatsheet.html": [{"q": "Что такое Clustering Feature (CF) и почему его удобно хранить?", "a": "CF подкластера — тройка (N, LS, SS): число точек, их сумма и сумма квадратов. По ней можно вычислить центр, радиус и диаметр подкластера, а CF двух подкластеров просто складываются — поэтому точки не нужно хранить, и данные обрабатываются за один проход."}, {"q": "Как устроено CF-дерево и за что отвечают threshold и branching factor?", "a": "CF-дерево — сбалансированное дерево, где узлы хранят CF подкластеров. `threshold` ограничивает радиус подкластера в листе: новая точка поглощается ближайшим подкластером, если радиус не превысит порог, иначе создаётся новый. `branching_factor` ограничивает число потомков узла; при переполнении узел делится."}, {"q": "Почему BIRCH подходит для больших данных?", "a": "Он строит компактное сжатое описание данных за один проход, работает в ограниченной памяти и поддерживает инкрементальное обучение (`partial_fit` в sklearn). Затем подкластеры листьев можно кластеризовать любым алгоритмом (глобальная кластеризация, параметр `n_clusters`)."}, {"q": "Как threshold влияет на результат?", "a": "Малый threshold даёт много мелких подкластеров — точнее, но дерево больше и обработка медленнее. Большой threshold сильнее сжимает данные, но разные группы могут слиться в один подкластер, и качество упадёт."}, {"q": "Какие ограничения у BIRCH?", "a": "Подкластеры описываются центром и радиусом, поэтому метод ориентирован на сферические кластеры и евклидову метрику и плохо находит кластеры сложной формы. Результат зависит от порядка поступления данных, а в высокой размерности работает хуже."}], "blending_cheatsheet.html": [{"q": "Как устроен блендинг?", "a": "Обучающая выборка делится на две части: базовые модели обучаются на первой, затем делают предсказания для второй (holdout), и на этих предсказаниях обучается метамодель или подбираются веса. На тесте базовые модели предсказывают, а метамодель комбинирует их выходы."}, {"q": "Каковы плюсы и минусы блендинга по сравнению со стекингом?", "a": "Плюсы: проще реализовать, нет риска утечки между фолдами, удобно объединять модели разных участников команды. Минусы: метамодель обучается на небольшой holdout-части, базовые модели не видят эти данные, поэтому оценки менее стабильны."}, {"q": "Какой размер holdout-части выбирать?", "a": "Обычно 10–30% обучающих данных. Слишком малая часть даёт шумную метамодель и переобучение весов, слишком большая — ухудшает базовые модели; при малом датасете лучше выбрать стекинг с кросс-валидацией."}, {"q": "Как блендинг применяют к временным рядам?", "a": "Holdout должен быть **последним по времени** участком перед тестом: базовые модели учатся на более раннем периоде, метамодель — на следующем. Случайное разбиение дало бы утечку из будущего и переоценку качества."}, {"q": "Можно ли после подбора весов переобучить базовые модели на всех данных?", "a": "Да, это частая практика: базовые модели переобучают на train + holdout, а найденные веса или метамодель оставляют прежними. Но распределение их предсказаний может немного сдвинуться (модели станут увереннее), поэтому для чувствительной метамодели это стоит проверить."}], "boosting_cheatsheet.html": [{"q": "В чём главное отличие бустинга от бэггинга (случайного леса)?", "a": "Бэггинг обучает модели **параллельно и независимо** и усредняет их — уменьшает дисперсию. Бустинг обучает модели **последовательно**: каждая следующая исправляет ошибки предыдущих — в первую очередь уменьшает смещение."}, {"q": "Что обучает каждое новое дерево в градиентном бустинге?", "a": "Антиградиент функции потерь по текущим прогнозам. Для MSE это просто остатки y − ŷ: новое дерево учится предсказывать, насколько ошибается текущий ансамбль."}, {"q": "Зачем нужен learning rate (shrinkage) и как он связан с числом деревьев?", "a": "Вклад каждого дерева умножается на η < 1, чтобы ансамбль двигался к решению маленькими шагами и меньше переобучался. Чем меньше η, тем больше деревьев нужно; обычно берут небольшой η и подбирают число деревьев через early stopping."}, {"q": "Почему в бустинге используют неглубокие деревья?", "a": "Каждое дерево — «слабая» модель, исправляющая небольшую часть ошибки. Глубина 3–8 позволяет учитывать взаимодействия признаков, но не даёт одному дереву переобучиться."}, {"q": "Может ли бустинг переобучиться при увеличении числа деревьев?", "a": "Да, в отличие от случайного леса: каждое новое дерево всё точнее подгоняется под обучающие данные, включая шум. Поэтому следят за ошибкой на валидации и используют раннюю остановку."}], "bootstrap_methods_cheatsheet.html": [{"q": "В чём основная идея бутстрепа?", "a": "Неизвестное распределение генеральной совокупности заменяется эмпирическим распределением выборки. Многократно извлекая выборки того же размера **с возвращением** и пересчитывая статистику, получают её выборочное распределение — стандартную ошибку и доверительные интервалы без аналитических формул."}, {"q": "Почему выборки извлекаются с возвращением и того же размера n?", "a": "С возвращением — чтобы выборки различались (без возвращения получалась бы та же выборка в другом порядке). Размер n — чтобы разброс статистики соответствовал исходному объёму данных: дисперсия оценки зависит от n."}, {"q": "Чем перцентильный интервал отличается от BCa?", "a": "**Перцентильный** берёт квантили бутстреп-распределения напрямую (например, 2.5% и 97.5%). **BCa** (bias-corrected and accelerated) корректирует их с учётом смещения и асимметрии распределения статистики и точнее при скошенных данных и малых выборках."}, {"q": "В каких случаях обычный бутстреп даёт неверный результат?", "a": "Для зависимых данных (временные ряды) — нужен блочный бутстреп, сохраняющий автокорреляцию. Также для экстремальных статистик (максимум, минимум), при очень малых выборках и для данных с тяжёлыми хвостами, где оценки дисперсии неустойчивы."}, {"q": "Сколько бутстреп-итераций нужно?", "a": "Для стандартной ошибки обычно хватает 200–1000, для доверительных интервалов по перцентилям — 1000–10 000, так как оценка хвостовых квантилей требует больше повторений. Число итераций уменьшает только шум Монте-Карло, но не компенсирует малый размер исходной выборки."}], "box_jenkins_cheatsheet.html": [{"q": "Из каких этапов состоит методология Бокса — Дженкинса?", "a": "**Идентификация** (приведение к стационарности, выбор p, d, q по ACF/PACF), **оценка** параметров (обычно максимальным правдоподобием) и **диагностика** остатков. Если остатки не похожи на белый шум, цикл повторяют с другой спецификацией, и только потом строят прогноз."}, {"q": "Как по ACF и PACF отличить процесс AR(p) от MA(q)?", "a": "У **AR(p)** PACF обрывается после лага p, а ACF затухает постепенно. У **MA(q)** наоборот: ACF обрывается после лага q, а PACF затухает. Если затухают обе функции, это признак смешанной ARMA."}, {"q": "Зачем нужна стационарность и как выбрать порядок дифференцирования d?", "a": "ARMA-модели предполагают постоянные среднее и автоковариацию, иначе оценки и прогнозы ненадёжны. d выбирают минимальным, при котором ряд становится стационарным (тесты ADF, KPSS, вид ACF); обычно d ≤ 2, а лишнее дифференцирование вносит искусственную отрицательную автокорреляцию."}, {"q": "Как проверить адекватность подобранной модели?", "a": "Остатки должны быть некоррелированным белым шумом: смотрят их ACF и тест **Льюнга — Бокса** (большое p-value — значимой автокорреляции нет), а также постоянство дисперсии и близость к нормальному распределению. Среди адекватных моделей выбирают более простую или с меньшим AIC/BIC."}, {"q": "Чем ADF-тест отличается от KPSS по нулевой гипотезе?", "a": "У **ADF** H₀ — ряд нестационарен (есть единичный корень), у **KPSS** H₀ — ряд стационарен. Поэтому их используют вместе: если ADF отвергает H₀, а KPSS — нет, ряд стационарен; противоречивые результаты требуют дополнительного анализа — проверки на тренд-стационарность или дифференцирования."}], "brain_neural_networks_connection_cheatsheet.html": [{"q": "Насколько искусственный нейрон похож на биологический?", "a": "Очень упрощённо: взвешенная сумма и нелинейность. Биологический нейрон имеет сложную дендритную обработку, спайки во времени, нейромедиаторы и разные типы клеток; один корковый нейрон по сложности сравнивают с целой небольшой многослойной сетью."}, {"q": "Что показали сравнения CNN с вентральным зрительным путём?", "a": "Активации слоёв CNN, обученных на классификации изображений, хорошо предсказывают ответы нейронов: ранние слои — V1/V2, поздние — области IT (Yamins, DiCarlo). Это не значит, что механизм обучения совпадает."}, {"q": "Как обучение с подкреплением связано с дофаминовой системой?", "a": "Активность дофаминовых нейронов соответствует **ошибке временной разности** (TD error): реакция на неожиданную награду, перенос на предсказывающий сигнал и спад при отсутствии ожидаемой награды (Schultz)."}, {"q": "Почему мозг не страдает от катастрофического забывания так сильно, как нейросети?", "a": "Предполагают роль консолидации памяти: гиппокамп быстро запоминает и «проигрывает» опыт во сне, медленно обучая кору (**complementary learning systems**), а также стабилизацию важных синапсов. Эти идеи вдохновили experience replay и EWC."}, {"q": "Какие ключевые различия в эффективности между мозгом и современными сетями?", "a": "Мозг потребляет ~20 Вт, учится на малом числе примеров и непрерывно, тогда как большие модели требуют огромных данных и энергии. Причины — разреженная событийная активность, локальное обучение и сильные врождённые априорные структуры."}], "canonical_correlation_analysis_cheatsheet.html": [{"q": "Что ищет CCA?", "a": "Пары направлений wₓ и w_y, при которых проекции двух наборов признаков X и Y максимально коррелированы: max corr(Xwₓ, Yw_y). Следующие пары ищутся с условием некоррелированности с предыдущими."}, {"q": "Чем CCA отличается от PCA?", "a": "PCA ищет направления максимальной дисперсии внутри одного набора данных. CCA работает с двумя наборами и ищет то, что у них общее, — максимальную корреляцию между ними, игнорируя дисперсию, не связанную с другим набором."}, {"q": "Почему CCA легко переобучается и как это исправить?", "a": "Нужно обращать ковариационные матрицы Σₓₓ и Σ_yy; когда признаков много относительно числа объектов, они вырождены, и CCA находит почти идеальные, но случайные корреляции. Помогает регуляризованный CCA: Σₓₓ + λI, а также понижение размерности перед CCA."}, {"q": "Сколько пар канонических компонент можно получить?", "a": "Не больше min(p, q), где p и q — число признаков в X и Y (а также не больше ранга данных). Канонические корреляции упорядочены по убыванию, и обычно берут несколько первых."}, {"q": "Где CCA применяется на практике?", "a": "Для мультимодальных данных — связь изображений и текстов, аудио и видео, генетики и фенотипа; для кросс-модального поиска и для построения общего пространства признаков двух представлений. В sklearn есть класс `CCA` в модуле `sklearn.cross_decomposition`."}], "canonical_correlation_analysis_method_cheatsheet.html": [{"q": "Какую задачу решает CCA?", "a": "Даны два набора переменных X и Y об одних объектах. CCA ищет линейные комбинации u = aᵀX и v = bᵀY с **максимальной корреляцией**, затем следующие пары, некоррелированные с предыдущими."}, {"q": "Чем CCA отличается от PCA и PLS?", "a": "PCA работает с одним набором и максимизирует дисперсию. CCA максимизирует **корреляцию** между проекциями двух наборов, игнорируя масштаб. PLS максимизирует **ковариацию** и поэтому учитывает и дисперсию проекций — он устойчивее, когда признаков много."}, {"q": "Сколько пар канонических переменных можно получить?", "a": "Не больше **min(p, q)**, где p и q — число переменных в X и Y (и не больше ранга данных)."}, {"q": "Почему CCA легко переобучается в высокой размерности?", "a": "Когда признаков много относительно объектов, всегда найдутся комбинации с корреляцией, близкой к 1, даже на случайных данных. Используют регуляризованный CCA, предварительный PCA и проверку корреляций на отложенной выборке."}, {"q": "Где применяют CCA в ML?", "a": "Для поиска общего представления разных модальностей (изображения и тексты, аудио и видео), в мультиомиксных данных, в нейронауке (связь стимула и активности мозга). Нелинейные версии — Kernel CCA и Deep CCA."}], "capsule_networks_cheatsheet.html": [{"q": "Чем выход капсулы отличается от выхода обычного нейрона?", "a": "Капсула выдаёт **вектор**: его длина кодирует вероятность наличия объекта или части, а направление — параметры позы (положение, ориентацию, масштаб). Обычный нейрон выдаёт одно число."}, {"q": "Какую проблему CNN хотели решить капсульные сети?", "a": "Max-pooling теряет информацию о точном пространственном расположении частей, и CNN может «узнать» лицо по набору глаз, носа и рта в неправильных позициях. Капсулы стремятся к **эквивариантности** и учитывают взаимное расположение частей."}, {"q": "Как работает dynamic routing by agreement?", "a": "Каждая нижняя капсула предсказывает выход каждой верхней через матрицу преобразования; коэффициенты связи итеративно увеличиваются для тех верхних капсул, с чьим итоговым выходом предсказание согласуется. Так части «голосуют» за целое."}, {"q": "Зачем в CapsNet нелинейность squash?", "a": "squash(s) = (‖s‖² / (1 + ‖s‖²)) · s/‖s‖ сохраняет направление вектора и сжимает длину в диапазон [0, 1), чтобы её можно было трактовать как вероятность."}, {"q": "Почему капсульные сети не вытеснили CNN?", "a": "Итеративный роутинг вычислительно дорог и плохо масштабируется на большие изображения и датасеты, а на ImageNet-подобных задачах выигрыш над CNN не показан. Успехи были в основном на MNIST и smallNORB."}], "catboost_cheatsheet.html": [{"q": "Какая главная особенность CatBoost?", "a": "Встроенная качественная работа с категориальными признаками: они кодируются через упорядоченные целевые статистики (ordered target statistics) без утечки целевой переменной. Признаки достаточно указать в `cat_features`."}, {"q": "Что такое ordered boosting и какую проблему он решает?", "a": "При обычном target encoding и бустинге значение для объекта вычисляется с использованием его же целевой переменной — возникает утечка и смещение прогноза. CatBoost использует случайную перестановку объектов и для каждого объекта учитывает только «предшествующие» ему."}, {"q": "Что такое симметричные (oblivious) деревья?", "a": "Деревья, в которых на каждом уровне все узлы используют **одно и то же** разбиение. Такие деревья проще, меньше переобучаются и очень быстро применяются при прогнозе."}, {"q": "Почему CatBoost часто хорошо работает «из коробки»?", "a": "Удачные параметры по умолчанию, встроенная обработка категорий и пропусков, устойчивость к переобучению за счёт ordered boosting и симметричных деревьев — поэтому требуется меньше ручного подбора."}, {"q": "Какие параметры CatBoost настраивают в первую очередь?", "a": "`iterations` и `learning_rate` (с ранней остановкой через `eval_set`), `depth`, `l2_leaf_reg`; для категорий — `one_hot_max_size`."}], "categorical_encoding_cheatsheet.html": [{"q": "Чем One-Hot Encoding отличается от Label (Ordinal) Encoding?", "a": "One-Hot создаёт отдельный бинарный столбец для каждой категории. Label/Ordinal заменяет категории числами 0, 1, 2… в одном столбце."}, {"q": "Почему Label Encoding опасен для линейных моделей на неупорядоченных категориях?", "a": "Модель воспримет числа как упорядоченные значения: «Москва=0 < Казань=1 < Омск=2», хотя порядка нет, и будет искать линейную зависимость от этого номера. Для деревьев это обычно не так страшно."}, {"q": "В чём проблема One-Hot Encoding для признака с тысячами категорий?", "a": "Получается тысячи разреженных столбцов: растут память и время обучения, редкие категории почти не дают сигнала. Альтернативы — target encoding, frequency encoding, хэширование, эмбеддинги, группировка редких категорий."}, {"q": "Что такое target encoding и чем он опасен?", "a": "Категория заменяется средним значением целевой переменной для этой категории. Без мер предосторожности это прямая утечка целевой переменной: нужно считать кодировку out-of-fold (по фолдам) и сглаживать для редких категорий."}, {"q": "Что делать с категорией, которая появилась в тесте, но не встречалась в обучении?", "a": "Заранее предусмотреть обработку: в `OneHotEncoder(handle_unknown='ignore')` такой объект получит все нули; при других кодировках — отдельная категория «прочее» или глобальное среднее."}], "choosing_clusters_number_cheatsheet.html": [{"q": "В чём идея метода «локтя» и в чём его слабость?", "a": "Строят график inertia (суммы внутрикластерных квадратов расстояний) от k и ищут точку, после которой убывание резко замедляется. Слабость — «локоть» часто размыт, и выбор становится субъективным."}, {"q": "Как выбрать k по силуэту?", "a": "Считают средний коэффициент силуэта для каждого k (начиная с 2) и берут k с максимальным значением. Полезно также смотреть силуэтные диаграммы по кластерам: кластеры с отрицательными значениями или очень разной шириной указывают на неудачное k."}, {"q": "В чём идея gap statistic?", "a": "Сравнивают log(inertia) на реальных данных с её ожидаемым значением на случайных данных без кластерной структуры (равномерное распределение в той же области). Выбирают k, при котором разрыв (gap) достаточно велик — реальные данные кластеризуются заметно лучше, чем шум."}, {"q": "Как выбирают число компонент для GMM?", "a": "По информационным критериям BIC или AIC: обучают модели с разным числом компонент и берут ту, у которой критерий минимален. Критерий штрафует число параметров, поэтому рост правдоподобия от лишних компонент не приводит к переобучению."}, {"q": "Что делать, если разные методы дают разные k?", "a": "Это нормально: «правильное» число кластеров зависит от масштаба рассмотрения и цели. Учитывают интерпретируемость и бизнес-смысл кластеров, их стабильность (повторяемость на бутстрэп-выборках) и дальнейшее использование результата."}], "cicd_ml_cheatsheet.html": [{"q": "Чем CI/CD для ML отличается от CI/CD обычного приложения?", "a": "Помимо кода, проверяются данные и модели: валидация схемы и распределений данных, проверка качества модели на эталонных метриках, сравнение с текущей продакшен-моделью. Добавляется непрерывное обучение (CT) — автоматическое переобучение."}, {"q": "Какие тесты имеет смысл запускать в CI для ML-проекта?", "a": "Юнит-тесты кода признаков и предобработки, проверки схемы данных, быстрое обучение на маленькой выборке (smoke test), тесты инвариантности и направленности прогнозов, проверку, что метрики не хуже порога."}, {"q": "Что такое «quality gate» для модели?", "a": "Автоматическое условие перед развёртыванием: новая модель должна превзойти текущую (или порог) по ключевым метрикам на фиксированном тесте и пройти проверки на задержку, размер и справедливость. Иначе релиз блокируется."}, {"q": "Почему в CI не стоит полностью обучать большую модель на каждый коммит?", "a": "Это долго и дорого. В CI запускают быстрые проверки на малых данных, а полное обучение — отдельным пайплайном: по расписанию, при изменении данных или по ручному запуску."}, {"q": "Как обеспечить воспроизводимость сборки модели?", "a": "Фиксировать версии зависимостей (lock-файл, Docker-образ), версии данных (DVC или снимки), random seed, конфигурацию эксперимента; логировать всё в трекинге экспериментов."}], "clarans_cheatsheet.html": [{"q": "Какую задачу решает CLARANS и чем медоиды отличаются от центроидов?", "a": "CLARANS решает задачу k-medoids: выбрать k реальных объектов-медоидов, минимизируя суммарное расстояние объектов до ближайшего медоида. В отличие от среднего в K-means, медоид — реальная точка, поэтому метод устойчивее к выбросам и работает с любой метрикой расстояния."}, {"q": "Как устроен поиск в CLARANS?", "a": "Решение (набор из k медоидов) — вершина графа; соседи отличаются заменой одного медоида на одну не-медоидную точку. Алгоритм проверяет случайных соседей и переходит к лучшему; если `maxneighbor` проверенных соседей подряд не улучшили стоимость, найден локальный минимум. Процедура повторяется `numlocal` раз с разных стартов, выбирается лучший результат."}, {"q": "Чем CLARANS отличается от PAM и CLARA?", "a": "PAM на каждом шаге перебирает все k·(n − k) замен — точно, но очень дорого. CLARA запускает PAM на случайных подвыборках и может упустить хорошие медоиды, не попавшие в выборку. CLARANS ищет по всем данным, но проверяет лишь случайную часть соседей — компромисс между качеством и скоростью."}, {"q": "Как параметры `numlocal` и `maxneighbor` влияют на результат?", "a": "Чем они больше, тем тщательнее поиск и выше шанс найти хорошее решение, но тем дольше работа. При малых значениях алгоритм быстро останавливается в плохом локальном минимуме, а результат сильно зависит от случайности."}, {"q": "Какие ограничения у CLARANS?", "a": "Число кластеров k задаётся заранее, кластеры получаются компактными вокруг медоидов (сложные формы не находятся), а результат недетерминирован. На очень больших данных метод всё равно медленный, так как каждая оценка соседа требует пересчёта стоимости по всем объектам."}], "classical_rl_tabular_cheatsheet.html": [{"q": "Когда табличные методы применимы, а когда нет?", "a": "Когда пространства состояний и действий дискретны и малы настолько, что можно хранить Q(s, a) в таблице и посетить каждую пару много раз. Для непрерывных или огромных пространств нужна аппроксимация функций."}, {"q": "Чем on-policy отличается от off-policy на примере SARSA и Q-learning?", "a": "**SARSA** обновляет Q по действию, реально выбранному текущей ε-жадной политикой: Q(s,a) += α[r + γQ(s′,a′) − Q(s,a)]. **Q-learning** использует max по a′, то есть учит оптимальную жадную политику, пока ведёт себя исследовательски."}, {"q": "Почему в задаче «cliff walking» SARSA выбирает более безопасный путь, чем Q-learning?", "a": "SARSA учитывает, что ε-жадная политика иногда делает случайный шаг и может упасть с обрыва, поэтому оценивает путь у края как опасный. Q-learning оценивает жадную политику и выбирает кратчайший путь вдоль обрыва, получая на обучении больше падений."}, {"q": "Зачем нужно исследование и что будет при ε = 0 с самого начала?", "a": "Без исследования агент будет повторять первое найденное «неплохое» действие и никогда не узнает ценность остальных. Сходимость Q-learning требует бесконечного посещения всех пар (s, a); на практике ε постепенно уменьшают."}, {"q": "Какую роль играет коэффициент дисконтирования γ?", "a": "Определяет, насколько ценятся будущие награды: γ близко к 0 — близорукий агент, близко к 1 — дальновидный. При γ < 1 сумма бесконечного ряда наград конечна, а эффективный горизонт порядка 1/(1 − γ)."}], "classification_metrics_cheatsheet.html": [{"q": "Почему accuracy может обманывать?", "a": "При дисбалансе классов: если мошеннических операций 1%, модель «всегда не мошенничество» получит accuracy 99%, не найдя ни одного мошенника."}, {"q": "Запишите precision и recall через TP, FP, FN.", "a": "Precision = TP / (TP + FP) — какая доля найденных положительных действительно положительна. Recall = TP / (TP + FN) — какую долю всех положительных модель нашла."}, {"q": "Когда важнее precision, а когда recall?", "a": "Recall — когда дорого пропустить положительный случай (диагностика болезней, мошенничество). Precision — когда дороги ложные срабатывания (спам-фильтр, удаляющий важные письма)."}, {"q": "Что такое F1 и почему это гармоническое, а не обычное среднее?", "a": "F1 = 2·P·R / (P + R). Гармоническое среднее близко к меньшему из двух значений, поэтому высокий F1 возможен только при одновременно высоких precision и recall."}, {"q": "Чем macro-усреднение отличается от weighted в многоклассовой задаче?", "a": "Macro — простое среднее метрик по классам: все классы равноправны, редкие влияют сильно. Weighted — среднее с весами по числу объектов класса: доминируют частые классы."}], "clip_multimodal_models_cheatsheet.html": [{"q": "Как обучается CLIP?", "a": "Два энкодера (изображений и текста) отображают данные в общее пространство эмбеддингов. На батче из N пар считается матрица косинусных сходств N×N, и **контрастивный loss** (симметричная кросс-энтропия) тянет совпадающие пары на диагонали друг к другу и отталкивает остальные."}, {"q": "Как CLIP выполняет zero-shot классификацию?", "a": "Для каждого класса составляется текстовый промпт («a photo of a {class}»), считаются эмбеддинги этих текстов и эмбеддинг изображения; предсказание — класс с наибольшим **косинусным сходством**. Дообучение на целевых метках не нужно."}, {"q": "Почему качество zero-shot CLIP зависит от формулировки промптов?", "a": "Модель училась на подписях из интернета, а не на голых названиях классов, и одно слово бывает многозначным. Шаблоны вроде «a photo of a …» и **ансамбль промптов** (усреднение эмбеддингов нескольких формулировок) заметно повышают точность."}, {"q": "Зачем CLIP нужен большой размер батча и чем SigLIP отличается в этом плане?", "a": "В контрастивном softmax-loss каждый пример сравнивается со всеми остальными в батче как с негативами, поэтому больший батч даёт больше трудных негативов и лучшее качество — CLIP обучали с батчем 32 768. **SigLIP** заменяет softmax на независимую сигмоиду для каждой пары, что упрощает распределённое обучение и хорошо работает и на меньших батчах."}, {"q": "В каких задачах CLIP работает плохо?", "a": "Счёт объектов, точные пространственные отношения («слева от»), чтение мелкого текста, специализированные домены (медицина, спутниковые снимки) и тонкие различия близких классов. Кроме того, модель наследует **смещения** веб-данных."}], "cluster_visualization_cheatsheet.html": [{"q": "Как визуализировать кластеры в данных с десятками признаков?", "a": "Снизить размерность до 2–3 (PCA, t-SNE, UMAP) и раскрасить точки по меткам кластеров. Важно помнить, что кластеризация была в исходном пространстве, а проекция может создавать ложное перекрытие или разделение."}, {"q": "Что показывает silhouette plot и как его читать?", "a": "Для каждой точки — коэффициент силуэта s = (b − a) / max(a, b), где a — среднее расстояние до своего кластера, b — до ближайшего чужого. Значения около 1 — хорошо, около 0 — на границе, отрицательные — вероятно, в чужом кластере. Узкие или сильно неравные «ножи» указывают на плохое k."}, {"q": "Как работает метод локтя и почему его выводы субъективны?", "a": "Строят инерцию (сумму квадратов расстояний до центров) от k; она всегда убывает, и ищут точку перегиба. Часто «локоть» не выражен, поэтому его дополняют силуэтом или индексом Калински–Харабаша."}, {"q": "Что показывает дендрограмма в иерархической кластеризации?", "a": "Порядок слияния кластеров и расстояние, на котором оно произошло (высота). Горизонтальный разрез на некоторой высоте даёт разбиение; большой вертикальный зазор между слияниями подсказывает естественное число кластеров."}, {"q": "Почему нельзя делать вывод о существовании кластеров только по красивой картинке t-SNE?", "a": "t-SNE может выделять обособленные группы даже в однородных или случайных данных, особенно при малой perplexity. Структуру нужно подтверждать метриками кластеризации, устойчивостью на подвыборках и смыслом признаков."}], "clustering_metrics_cheatsheet.html": [{"q": "Чем внутренние метрики отличаются от внешних?", "a": "Внутренние (силуэт, Calinski–Harabasz, Davies–Bouldin) оценивают кластеризацию только по данным — компактность и разделённость. Внешние (ARI, NMI, homogeneity, completeness) сравнивают результат с известной истинной разметкой и применимы, только когда она есть."}, {"q": "Как считается коэффициент силуэта и как его интерпретировать?", "a": "Для объекта s = (b − a) / max(a, b), где a — среднее расстояние до объектов своего кластера, b — среднее расстояние до объектов ближайшего чужого. Значение близко к 1 — объект хорошо в своём кластере, около 0 — на границе, меньше 0 — скорее всего, отнесён не туда."}, {"q": "Почему для сравнения с истинной разметкой нельзя просто посчитать accuracy?", "a": "Номера кластеров произвольны: разбиение с метками {0, 1} и то же разбиение с переставленными метками {1, 0} одинаково хороши. ARI и NMI инвариантны к перестановке меток и сравнивают сами разбиения."}, {"q": "Почему ARI предпочитают обычному Rand index?", "a": "Rand index для случайного разбиения может быть заметно больше 0 и зависит от числа кластеров. Adjusted Rand Index скорректирован на случайность: ≈ 0 для случайной разметки и 1 для полного совпадения (может быть и отрицательным)."}, {"q": "Какая ловушка есть у силуэта и Calinski–Harabasz при оценке DBSCAN?", "a": "Эти метрики предполагают выпуклые, «шаровидные» кластеры, поэтому кластеры невыпуклой формы (полумесяцы, кольца) могут получить низкую оценку, даже если они найдены правильно. Кроме того, шумовые точки (метка −1) нужно исключать или учитывать отдельно."}], "cnn_architectures_cheatsheet.html": [{"q": "Что показала AlexNet (2012) и почему это был прорыв?", "a": "Глубокая CNN, обученная на GPU, с ReLU, dropout и аугментацией, с большим отрывом выиграла ImageNet. Это показало, что глубокое обучение на больших данных превосходит ручные признаки, и запустило бум deep learning."}, {"q": "В чём главная идея VGG?", "a": "Использовать только маленькие свёртки 3×3, уложенные стопкой. Две свёртки 3×3 дают рецептивное поле 5×5, а три — 7×7, при меньшем числе параметров и большем числе нелинейностей. Минус — очень много параметров в полносвязных слоях."}, {"q": "Что такое Inception-модуль?", "a": "Параллельные ветви со свёртками разного размера (1×1, 3×3, 5×5) и пулингом, выходы которых объединяются по каналам. Свёртки 1×1 перед крупными ядрами снижают число каналов и стоимость вычислений."}, {"q": "Какую идею масштабирования предложила EfficientNet?", "a": "Составное масштабирование: одновременно и согласованно увеличивать глубину, ширину (каналы) и разрешение входа по общему коэффициенту, а не только что-то одно."}, {"q": "Как MobileNet удешевляет свёртки?", "a": "Использует depthwise separable convolution: сначала поканальная свёртка 3×3 (каждый канал отдельно), затем свёртка 1×1 для смешивания каналов. Вычислений примерно в 8–9 раз меньше, чем у обычной свёртки 3×3."}], "cnn_basics_cheatsheet.html": [{"q": "Почему для изображений свёрточный слой лучше полносвязного?", "a": "Свёртка использует локальность (нейрон смотрит на небольшую область) и разделение весов (одно ядро применяется ко всему изображению). Параметров на порядки меньше, а найденный признак распознаётся в любом месте картинки."}, {"q": "Как посчитать размер выхода свёрточного слоя?", "a": "out = ⌊(in + 2·padding − kernel) / stride⌋ + 1. Например, вход 32, ядро 3, padding 1, stride 1 → выход 32 («same»)."}, {"q": "Сколько параметров у слоя Conv2d(in=3, out=16, kernel=3×3)?", "a": "16 фильтров × (3·3·3 весов) + 16 смещений = 432 + 16 = 448 параметров. Число параметров не зависит от размера изображения."}, {"q": "Что такое рецептивное поле и как оно растёт?", "a": "Область исходного изображения, которая влияет на данный нейрон. Оно растёт с каждым свёрточным слоем, а stride, пулинг и dilated-свёртки увеличивают его быстрее — поэтому глубокие слои «видят» крупные объекты."}, {"q": "Что делает свёртка 1×1?", "a": "Смешивает каналы в каждой точке, не затрагивая соседние пиксели, — фактически полносвязный слой по каналам. Используется, чтобы дёшево уменьшить или увеличить число каналов (bottleneck в ResNet и Inception)."}], "cnn_time_series_tcn_cheatsheet.html": [{"q": "Что такое каузальная свёртка?", "a": "Свёртка, в которой выход в момент t зависит только от входов в моменты ≤ t. Реализуется дополнением (padding) только слева. Так модель не «видит» будущее."}, {"q": "Зачем в TCN дилатированные (dilated) свёртки?", "a": "Ядро применяется к элементам с пропусками (dilation 1, 2, 4, 8…). Рецептивное поле растёт экспоненциально с числом слоёв, и сеть охватывает длинную историю без огромного числа параметров."}, {"q": "Как посчитать рецептивное поле TCN с ядром 3 и дилатациями 1, 2, 4, 8 (по одной свёртке на уровень)?", "a": "1 + (k − 1)·Σd = 1 + 2·(1 + 2 + 4 + 8) = 31 шаг."}, {"q": "В чём преимущества TCN перед RNN?", "a": "Параллельные вычисления по всей последовательности (быстрее обучение), стабильные градиенты (residual-блоки, нет рекуррентности), гибко настраиваемая длина памяти через рецептивное поле."}, {"q": "Какое ограничение у TCN по сравнению с RNN?", "a": "Память ограничена рецептивным полем: события старше него модель не видит. RNN в теории может хранить информацию сколько угодно долго (на практике — хуже). При инференсе TCN нужно хранить окно истории размером с рецептивное поле."}], "cnn_visualization_techniques_cheatsheet.html": [{"q": "Как работает Grad-CAM?", "a": "Берёт градиенты score целевого класса по картам последнего свёрточного слоя, усредняет их по пространству — получаются веса каналов, затем ReLU(∑ αₖAᵏ) даёт тепловую карту важных областей, которую масштабируют до размера изображения."}, {"q": "Почему Grad-CAM даёт грубую карту и как получить более детальную?", "a": "Разрешение ограничено размером последней карты признаков (например, 7×7). Guided Grad-CAM умножает её на guided backpropagation, получая пиксельную детализацию с классовой специфичностью."}, {"q": "Что показывают обычные saliency maps и в чём их недостаток?", "a": "Модуль градиента score класса по пикселям входа — какие пиксели сильнее всего влияют на выход локально. Они шумные и чувствительны к насыщению; SmoothGrad усредняет по зашумлённым копиям, Integrated Gradients интегрирует вдоль пути от базового изображения."}, {"q": "Что даёт визуализация фильтров первого и глубоких слоёв?", "a": "Фильтры первого слоя напрямую видны как картинки — обычно это детекторы краёв и цветовых пятен. Для глубоких слоёв веса не интерпретируются напрямую, поэтому используют **feature visualization** — синтез входа, максимизирующего активацию нейрона, с регуляризацией."}, {"q": "Почему красивая тепловая карта ещё не доказывает, что модель «понимает» объект?", "a": "Карта может подсвечивать артефакты (водяной знак, фон), и сами методы бывают нечувствительны к модели: проверки «sanity checks» показали, что некоторые карты почти не меняются при рандомизации весов. Визуализацию нужно проверять."}], "collaborative_filtering_cheatsheet.html": [{"q": "На каком предположении основана коллаборативная фильтрация?", "a": "Пользователи, которые одинаково оценивали объекты в прошлом, будут похоже оценивать их и в будущем. Метод использует только матрицу взаимодействий «пользователь × объект» и не требует описаний объектов или профилей пользователей."}, {"q": "Почему коллаборативная фильтрация плохо справляется с холодным стартом?", "a": "У нового пользователя или нового объекта нет взаимодействий, поэтому невозможно найти похожих или выучить эмбеддинг. Используют популярные объекты, контентные признаки, гибридные модели или явный опрос предпочтений при регистрации."}, {"q": "Чем явная обратная связь (explicit) отличается от неявной (implicit)?", "a": "**Явная** — оценки и лайки: точная, но редкая и содержит отрицательные сигналы. **Неявная** — клики, просмотры, покупки: обильная, но отсутствие взаимодействия не значит «не нравится» (мог просто не видеть). Для неявных данных используют другие функции потерь и веса уверенности (например, implicit ALS, BPR)."}, {"q": "Почему у коллаборативной фильтрации возникает popularity bias?", "a": "Популярные объекты имеют больше взаимодействий, поэтому чаще попадают в соседи и получают более надёжные оценки, а редкие (long tail) почти не рекомендуются. Это усиливается петлёй обратной связи: рекомендованное получает ещё больше кликов."}, {"q": "Почему для оценки рекомендаций мало одной RMSE?", "a": "RMSE меряет точность предсказания оценки, а пользователь видит только топ-K списка. Важнее ранжирующие метрики (Precision@K, Recall@K, NDCG, MAP), а также покрытие, разнообразие и новизна; кроме того, разбиение на train/test лучше делать по времени, чтобы не «подсматривать» в будущее."}], "collaborative_filtering_user_item_based_cheatsheet.html": [{"q": "Чем user-based подход отличается от item-based?", "a": "**User-based** ищет пользователей с похожими вкусами и рекомендует то, что понравилось им. **Item-based** ищет объекты, похожие на те, что пользователь уже оценил, где сходство объектов считается по оценкам всех пользователей."}, {"q": "Почему в промышленных системах чаще используют item-based?", "a": "Объектов обычно меньше, чем пользователей, а их сходства стабильнее во времени, поэтому матрицу сходства объектов можно предрассчитать офлайн и редко обновлять. Вкусы пользователей меняются быстро, и user-based требует постоянного пересчёта; классический пример — item-to-item у Amazon."}, {"q": "Зачем при расчёте сходства центрировать оценки (adjusted cosine, корреляция Пирсона)?", "a": "Пользователи по-разному используют шкалу: один ставит в основном 4–5, другой 2–3. Вычитание среднего пользователя убирает это смещение, и сходство отражает относительные предпочтения, а не щедрость оценок."}, {"q": "Почему сходство по двум-трём общим оценкам ненадёжно и как с этим бороться?", "a": "Совпадение на малом числе общих объектов может дать сходство ≈ 1 случайно. Используют **shrinkage** — уменьшение сходства пропорционально n / (n + λ), где n — число общих оценок, — и порог минимального числа общих объектов."}, {"q": "Как предсказать оценку пользователя для объекта в item-based подходе?", "a": "Берут k наиболее похожих объектов, которые пользователь уже оценил, и считают взвешенное среднее: r̂ᵤᵢ = ∑ sim(i, j)·rᵤⱼ / ∑ |sim(i, j)|. Ограничение k ближайшими соседями снижает шум от слабо похожих объектов."}], "community_detection_cheatsheet.html": [{"q": "Что измеряет модулярность Q?", "a": "Насколько доля рёбер внутри сообществ превышает ожидаемую в случайном графе с теми же степенями вершин: Q = (1/2m)·∑[Aᵢⱼ − kᵢkⱼ/2m]·δ(cᵢ, cⱼ). Значения около 0.3–0.7 обычно указывают на выраженную структуру сообществ."}, {"q": "Что такое resolution limit модулярности?", "a": "Максимизация модулярности не может выделить сообщества меньше некоторого масштаба (зависящего от общего числа рёбер, порядка √m): мелкие, но явные группы сливаются. Помогает параметр разрешения γ (в Louvain и Leiden) или методы на других принципах."}, {"q": "Чем Leiden лучше Louvain?", "a": "Louvain может выдавать плохо связные и даже несвязные сообщества. Leiden добавляет фазу уточнения разбиения, гарантирует связность сообществ и обычно быстрее приходит к лучшему решению."}, {"q": "Почему результаты Louvain могут меняться от запуска к запуску?", "a": "Алгоритм жадный и зависит от порядка обхода вершин, а у модулярности много почти равных локальных максимумов. Поэтому фиксируют seed, запускают несколько раз и сравнивают разбиения (например, по NMI)."}, {"q": "Чем алгоритм Label Propagation для поиска сообществ хорош и чем плох?", "a": "Он почти линеен по числу рёбер и не требует знать число сообществ: каждая вершина принимает самую частую метку соседей. Но результат нестабилен, зависит от порядка обновлений и может свалиться в одно гигантское сообщество."}], "comparison_neural_classical_cheatsheet.html": [{"q": "Почему на табличных данных градиентный бустинг обычно сильнее нейросетей?", "a": "Табличные признаки разнородны, часто содержат неинформативные столбцы и нерегулярные, ступенчатые зависимости — деревья хорошо это моделируют. Нейросети смещены к гладким функциям и не инвариантны к поворотам признакового пространства, что на таблицах скорее мешает."}, {"q": "В каких задачах нейросети однозначно выигрывают у классических методов?", "a": "На неструктурированных данных — изображения, текст, звук, видео, — где важна иерархия признаков и сетки сами учат представления. Также при огромных объёмах данных и мультимодальных задачах."}, {"q": "Почему сравнение «нейросеть против бустинга» часто бывает нечестным?", "a": "Одну модель тщательно настраивают, а другую запускают с параметрами по умолчанию; используют разные разбиения или подбирают гиперпараметры на тесте. Честное сравнение — одинаковый бюджет тюнинга, одинаковые фолды и несколько датасетов."}, {"q": "Что выбрать при 2 000 строках табличных данных и требовании к интерпретируемости?", "a": "Скорее всего, регуляризованную линейную модель или бустинг с SHAP: на малых таблицах нейросети легко переобучаются и сложнее в объяснении. Нейросеть здесь имеет смысл разве что как часть ансамбля."}, {"q": "Какие практические, а не только точностные, факторы влияют на выбор между нейросетью и классической моделью?", "a": "Время обучения и инференса, наличие GPU, объём данных, стоимость поддержки, требования к интерпретации и регуляторике. Бустинг быстро обучается на CPU и почти не требует предобработки, нейросеть даёт гибкость end-to-end и дообучения."}], "computational_chemistry_ml_cheatsheet.html": [{"q": "Зачем нужны машинно-обученные потенциалы (ML p

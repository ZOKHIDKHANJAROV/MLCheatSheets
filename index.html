этой матрице ядра."}, {"q": "Что такое QAOA и для каких задач он предназначен?", "a": "Quantum Approximate Optimization Algorithm — вариационный алгоритм для **комбинаторной оптимизации** (например, MaxCut). Чередует гамильтониан задачи и смешивающий гамильтониан, параметры которых подбирает классический оптимизатор."}, {"q": "Чем VQE отличается от QAOA?", "a": "VQE (Variational Quantum Eigensolver) ищет минимальное собственное значение гамильтониана — основное состояние молекулы, то есть задача из квантовой химии. QAOA — частный вид вариационного подхода со специальной структурой схемы для задач оптимизации."}, {"q": "Почему для гибридных вариационных алгоритмов нельзя гарантировать экспоненциального ускорения?", "a": "Это эвристики: нет доказательств, что они превзойдут лучшие классические методы, а шум, число измерений и сложность оптимизации параметров съедают выигрыш. Заявленное ускорение часто теоретическое и при идеальных условиях."}, {"q": "Как честно сравнивать квантовый и классический алгоритм?", "a": "Сравнивать с **лучшим** классическим методом, а не со слабым бейзлайном; учитывать полное время, включая загрузку данных, число запусков и измерений; проверять на реальных, а не игрушечных размерах задач."}], "quantum_neural_networks_cheatsheet.html": [{"q": "Как устроена вариационная квантовая схема (QNN/VQC)?", "a": "Данные кодируются в состояние кубитов (feature map), затем применяется параметризованная схема из вращений (RY, RZ) и запутывающих гейтов (CNOT), и измеряется ожидаемое значение наблюдаемой. Параметры оптимизирует **классический** оптимизатор — это гибридный цикл."}, {"q": "Что такое barren plateaus?", "a": "Для глубоких или случайно инициализированных схем на многих кубитах градиенты экспоненциально малы по числу кубитов — ландшафт почти плоский, и обучение застревает. Помогают неглубокие схемы, локальные функции стоимости и продуманная инициализация."}, {"q": "Как вычисляют градиенты параметров квантовой схемы?", "a": "Обычно через **parameter-shift rule**: производная по углу вращения равна разности значений схемы при сдвиге параметра на ±π/2 (с множителем ½). Это точная формула, но каждое значение оценивается по конечному числу измерений, поэтому градиент шумный."}, {"q": "Почему на устройствах NISQ сложно получить преимущество QNN над классическими сетями?", "a": "Кубитов мало, гейты шумные, декогеренция ограничивает глубину схемы, а измерения дают статистическую ошибку. Практически доказанного преимущества на реальных задачах ML пока нет."}, {"q": "Почему выбор кодирования данных (feature map) так важен для QNN?", "a": "Кодирование определяет, какие функции схема вообще может выразить, и задаёт неявное ядро сравнения объектов. Слишком простое кодирование ограничивает выразительность, слишком сложное — усиливает barren plateaus и шум."}], "random_forest_cheatsheet.html": [{"q": "Какие два источника случайности делают деревья в лесу разными?", "a": "Каждое дерево обучается на bootstrap-выборке (случайная выборка с возвращением), и в каждом узле выбор разбиения идёт только среди случайного подмножества признаков (`max_features`)."}, {"q": "Почему усреднение многих деревьев уменьшает ошибку?", "a": "Усреднение слабо коррелированных моделей уменьшает дисперсию, почти не меняя смещения. Случайный выбор признаков делает деревья менее похожими и усиливает этот эффект."}, {"q": "Что такое out-of-bag (OOB) оценка?", "a": "Около 37% объектов не попадают в bootstrap-выборку конкретного дерева. Предсказывая каждый объект только деревьями, которые его не видели, получают оценку качества без отдельной валидации (`oob_score=True`)."}, {"q": "Переобучается ли случайный лес при увеличении числа деревьев?", "a": "Нет: с ростом `n_estimators` ошибка выходит на плато, просто растёт время работы. Переобучение возможно из-за слишком глубоких деревьев на зашумлённых данных, но не из-за их количества."}, {"q": "Чем важность признаков по уменьшению impurity хуже permutation importance?", "a": "Важность по impurity считается на обучающих данных и завышает значимость признаков с большим числом уникальных значений (например, ID). Permutation importance измеряет падение качества на валидации при перемешивании признака и надёжнее."}], "random_forest_regression_cheatsheet.html": [{"q": "За счёт чего случайный лес уменьшает ошибку по сравнению с одним деревом?", "a": "Глубокие деревья имеют низкое смещение, но высокую дисперсию. Усреднение многих деревьев, обученных на бутстрэп-выборках со случайным подмножеством признаков в каждом разбиении, снижает дисперсию; случайность признаков дополнительно декоррелирует деревья."}, {"q": "Почему увеличение числа деревьев не приводит к переобучению?", "a": "Добавление деревьев лишь уменьшает дисперсию усреднения, и ошибка выходит на плато. Переобучение леса связано со слишком глубокими деревьями и малым `min_samples_leaf`, а `n_estimators` ограничено только временем и памятью."}, {"q": "Что такое OOB-оценка и зачем она нужна?", "a": "Каждое дерево не видит около 37% объектов (вероятность не попасть в бутстрэп (1 − 1/n)ⁿ ≈ e⁻¹ ≈ 0.37). Предсказывая объект только деревьями, для которых он был out-of-bag, получаем почти бесплатную оценку качества без отдельной валидации (`oob_score=True`)."}, {"q": "Почему случайный лес для регрессии не экстраполирует и плохо предсказывает крайние значения?", "a": "Прогноз — среднее листовых средних, поэтому он не выходит за диапазон обучающего таргета. Кроме того, усреднение «стягивает» прогнозы экстремальных объектов к центру — малые значения завышаются, большие занижаются."}, {"q": "Какой подвох есть у важности признаков на основе уменьшения impurity (MDI)?", "a": "MDI считается на обучающих данных и завышает важность непрерывных признаков и признаков с большим числом уникальных значений. Надёжнее permutation importance на валидационной выборке, хотя и она делит важность между коррелированными признаками."}], "regex_finite_state_cheatsheet.html": [{"q": "Чем жадный квантификатор отличается от ленивого?", "a": "Жадный (`.*`) захватывает максимум символов, ленивый (`.*?`) — минимум. Для строки `<a><b>` шаблон `<.*>` найдёт всю строку, а `<.*?>` — только `<a>`."}, {"q": "Когда правила на regex лучше ML-модели?", "a": "Когда шаблон строгий и стабильный (email, телефоны, даты, ИНН), размеченных данных мало или нужна полная предсказуемость и объяснимость. На свободном тексте с вариативными формулировками правила быстро становятся хрупкими и трудно поддерживаемыми."}, {"q": "Почему классические регулярные выражения не могут проверить правильную вложенность скобок?", "a": "Они эквивалентны конечным автоматам, у которых нет памяти для подсчёта произвольной глубины вложенности. Для этого нужен автомат со стеком (контекстно-свободная грамматика)."}, {"q": "Что такое катастрофический бэктрекинг?", "a": "Шаблоны с вложенными квантификаторами вроде `(a+)+$` на неподходящей строке заставляют движок с бэктрекингом перебирать экспоненциальное число вариантов. Это может повесить сервис (ReDoS); помогают аккуратные шаблоны, атомарные группы или движки без бэктрекинга вроде RE2."}, {"q": "Для чего в NLP используют конечные преобразователи (finite-state transducers)?", "a": "Они отображают одну строку в другую и эффективно реализуют морфологический анализ и генерацию (словоформа ↔ лемма с тегами), нормализацию текста для синтеза речи, транслитерацию. Преобразователи можно композировать и минимизировать."}], "regression_metrics_cheatsheet.html": [{"q": "Чем MAE отличается от RMSE и какая сильнее штрафует большие ошибки?", "a": "MAE — среднее модулей ошибок, RMSE — корень из среднего квадратов. RMSE из-за возведения в квадрат сильнее штрафует большие ошибки и чувствительнее к выбросам; всегда RMSE ≥ MAE."}, {"q": "Что показывает R² и может ли он быть отрицательным?", "a": "R² = 1 − SS_res / SS_tot — долю дисперсии целевой переменной, объяснённую моделью: 1 — идеально, 0 — не лучше константного прогноза средним. Отрицательный R² означает, что модель хуже предсказания средним."}, {"q": "В чём недостатки MAPE?", "a": "Не определена при y = 0 и взрывается при y, близких к нулю; несимметрична — завышение прогноза штрафуется иначе, чем занижение."}, {"q": "Какую метрику выбрать, если ошибка в 10 тыс. одинаково плоха для квартиры за 50 тыс. и за 5 млн?", "a": "Абсолютную — MAE или RMSE, потому что важен размер ошибки в деньгах. Если же важна ошибка относительно цены — относительную (MAPE, или RMSLE для логарифмов)."}, {"q": "Почему R² на обучающей выборке растёт при добавлении любого признака?", "a": "Модель с бо́льшим числом параметров всегда может подогнаться не хуже. Поэтому R² сравнивают на тесте или используют скорректированный R², штрафующий за число признаков."}], "regularization_cheatsheet.html": [{"q": "Почему L1-регуляризация зануляет веса, а L2 только уменьшает?", "a": "Градиент L1-штрафа постоянен по модулю (λ·sign(w)) и «дотягивает» маленькие веса ровно до нуля; геометрически у ромба ограничения есть углы на осях. Градиент L2 (2λw) пропорционален весу и уменьшается вместе с ним, поэтому веса становятся малыми, но не нулевыми."}, {"q": "Что будет, если λ слишком большой?", "a": "Штраф доминирует, веса стремятся к нулю, модель становится слишком простой — **недообучение** (высокое смещение). λ подбирают на кросс-валидации."}, {"q": "Почему перед регуляризованной линейной моделью нужно масштабировать признаки?", "a": "Штраф одинаков для всех весов, а величина веса зависит от единиц признака. Без масштабирования признак в маленьких единицах (большой вес) будет штрафоваться сильнее, чем такой же по важности признак в больших единицах."}, {"q": "Как связаны регуляризация и байесовский подход?", "a": "L2-штраф эквивалентен **MAP-оценке с гауссовским prior** на веса, L1 — с лапласовским prior. Сила регуляризации λ соответствует обратной дисперсии prior."}, {"q": "Какие способы регуляризации, кроме L1/L2, используют в нейросетях и деревьях?", "a": "Нейросети: dropout, early stopping, weight decay, аугментация данных, batch normalization (частично). Деревья и бустинг: ограничение глубины и `min_samples_leaf`, learning rate (shrinkage), subsample по строкам и признакам."}], "regularization_methods_cheatsheet.html": [{"q": "Зачем нужна регуляризация и как она связана с bias-variance?", "a": "Регуляризация штрафует сложность модели (например, большие веса), уменьшая дисперсию ценой небольшого роста смещения. Это помогает при переобучении, мультиколлинеарности и когда признаков много относительно числа объектов."}, {"q": "Почему L1 обнуляет веса, а L2 — только уменьшает?", "a": "Область ограничения L1 (∑|wᵢ| ≤ t) — ромб с углами на осях, и линии уровня функции потерь чаще касаются его именно в углах, где часть весов равна нулю. Шар L2 гладкий, оптимум обычно не лежит на осях, поэтому веса сжимаются, но не зануляются."}, {"q": "Почему перед регуляризацией признаки нужно стандартизировать?", "a": "Штраф одинаково применяется ко всем весам, а величина веса зависит от масштаба признака. Без стандартизации признаки в мелких единицах (с большими весами) штрафуются сильнее, и результат зависит от выбора единиц измерения."}, {"q": "Когда ElasticNet лучше чистого Lasso?", "a": "Когда признаков больше, чем объектов, или есть группы сильно коррелированных признаков. Lasso произвольно оставляет один признак из группы и при p > n выбирает не больше n признаков, а L2-часть ElasticNet стабилизирует решение и позволяет отбирать группы целиком."}, {"q": "Что будет, если выбрать α (силу регуляризации) слишком большим?", "a": "Веса сожмутся почти к нулю (у Lasso — станут нулевыми), модель будет предсказывать почти константу и недообучится. α подбирают по кросс-валидации, например с помощью `RidgeCV` или `LassoCV`."}], "reinforcement_learning_basics_cheatsheet.html": [{"q": "Из каких элементов состоит задача RL?", "a": "Агент, среда, состояния, действия, награды и политика. Агент наблюдает состояние, выбирает действие, получает награду и новое состояние; цель — максимизировать ожидаемую суммарную (дисконтированную) награду."}, {"q": "Что такое марковский процесс принятия решений (MDP)?", "a": "Формальная модель задачи RL: множество состояний и действий, вероятности переходов P(s'|s, a), функция наград и коэффициент дисконтирования γ. Марковское свойство: будущее зависит только от текущего состояния и действия, а не от всей истории."}, {"q": "Зачем нужен коэффициент дисконтирования γ?", "a": "Он делает сумму наград конечной в бесконечных задачах и задаёт, насколько агент ценит будущие награды по сравнению с ближайшими: γ близко к 0 — «близорукий» агент, близко к 1 — дальновидный."}, {"q": "Чем функция ценности V(s) отличается от Q(s, a)?", "a": "V(s) — ожидаемая суммарная награда из состояния s при следовании политике. Q(s, a) — то же, но при условии, что сначала выполнено действие a. Зная Q, можно выбрать лучшее действие: argmaxₐ Q(s, a)."}, {"q": "Что такое дилемма exploration vs exploitation?", "a": "Агент должен использовать уже известные хорошие действия (exploitation), но и пробовать новые, чтобы найти лучшие (exploration). Простейшее решение — ε-жадная стратегия: с вероятностью ε случайное действие."}], "reservoir_sampling_cheatsheet.html": [{"q": "Какую задачу решает reservoir sampling?", "a": "Выбрать равномерную случайную выборку из k элементов из потока неизвестной (и, возможно, огромной) длины за один проход и с памятью O(k)."}, {"q": "Как работает Algorithm R?", "a": "Первые k элементов кладут в резервуар. Для i-го элемента (i > k) генерируют случайное j от 1 до i; если j ≤ k, элемент заменяет j-й элемент резервуара. Так i-й элемент попадает в выборку с вероятностью k/i."}, {"q": "Почему каждый элемент оказывается в итоговой выборке с вероятностью k/n?", "a": "Элемент i попадает с вероятностью k/i, а затем на каждом шаге t > i выживает с вероятностью 1 − 1/t = (t − 1)/t. Произведение телескопируется: k/i · i/(i + 1) · … · (n − 1)/n = k/n."}, {"q": "Какова вероятность, что 100-й элемент окажется в резервуаре размера 10 после 1000 элементов?", "a": "k/n = 10/1000 = 1%, независимо от позиции элемента — в этом и смысл равномерной выборки. При этом сразу после прихода 100-й элемент попадает в резервуар с вероятностью 10/100 = 10%."}, {"q": "Как сделать взвешенный reservoir sampling?", "a": "Алгоритм A-Res (Efraimidis и Spirakis): каждому элементу с весом w присвоить ключ u^(1/w), где u ~ U(0, 1), и хранить k элементов с наибольшими ключами (кучей). Элементы с большим весом попадают в выборку чаще."}], "resnet_cheatsheet.html": [{"q": "Какую проблему обнаружили авторы ResNet у очень глубоких «обычных» сетей?", "a": "Проблему деградации: при увеличении глубины ошибка растёт даже на **обучающей** выборке. Значит, дело не в переобучении, а в том, что глубокую сеть трудно оптимизировать."}, {"q": "Как устроен residual-блок?", "a": "Выход блока — y = F(x) + x: к результату нескольких слоёв F(x) прибавляется исходный вход по «короткой связи» (skip connection). Слои учат только поправку (остаток) к входу."}, {"q": "Почему skip-связи облегчают обучение глубоких сетей?", "a": "Градиент проходит по короткой связи напрямую, не затухая при перемножении через слои. А если блок не нужен, сети достаточно сделать F(x) ≈ 0, чтобы получить тождественное отображение."}, {"q": "Что делать, если размерность F(x) и x не совпадает?", "a": "Применить к x проекцию — свёртку 1×1 с нужным числом каналов и stride, — чтобы формы совпали перед сложением."}, {"q": "Что такое bottleneck-блок в ResNet-50 и глубже?", "a": "Последовательность свёрток 1×1 (сжатие каналов) → 3×3 → 1×1 (восстановление каналов). Дорогая свёртка 3×3 работает на меньшем числе каналов, что позволяет делать сеть глубже при той же стоимости."}], "ridge_lasso_elasticnet_cheatsheet.html": [{"q": "Какие штрафы добавляют Ridge и Lasso к функции потерь?", "a": "Ridge (L2): α·Σwⱼ² — сумма квадратов весов. Lasso (L1): α·Σ|wⱼ| — сумма модулей весов. ElasticNet — взвешенная комбинация обоих."}, {"q": "Какая регуляризация обнуляет веса и почему это полезно?", "a": "Lasso (L1): у штрафа «угол» в нуле, поэтому часть весов становится ровно нулевой. Получается встроенный отбор признаков и более простая, интерпретируемая модель."}, {"q": "Как влияет на модель увеличение α?", "a": "Штраф сильнее — веса меньше, модель проще: смещение растёт, дисперсия падает. При α → 0 получаем обычную линейную регрессию, при очень большом α — почти константный прогноз."}, {"q": "Когда ElasticNet лучше, чем Lasso?", "a": "Когда есть группы сильно коррелированных признаков: Lasso обычно случайно оставляет один из группы, а ElasticNet за счёт L2-части распределяет вес между ними и ведёт себя стабильнее."}, {"q": "Почему перед регуляризацией нужно масштабировать признаки?", "a": "Штраф одинаков для всех весов, а величина веса зависит от масштаба признака. Без масштабирования признаки в «мелких» единицах получают большие веса и штрафуются несправедливо сильнее."}], "risk_management_cheatsheet.html": [{"q": "Как интерпретировать VaR(95%, 1 день) = 1 млн?", "a": "С вероятностью 95% дневной убыток не превысит 1 млн; в 5% дней (примерно раз в месяц торговли) он будет больше. VaR ничего не говорит о том, насколько больше могут быть потери в этих 5% случаев."}, {"q": "Чем Expected Shortfall лучше VaR?", "a": "**ES (CVaR)** — средний убыток при условии, что VaR превышен, то есть он учитывает форму хвоста. Кроме того, ES субаддитивен (когерентная мера риска), а VaR может нарушать принцип диверсификации."}, {"q": "Почему параметрический VaR на нормальном распределении часто недооценивает риск?", "a": "Доходности имеют **тяжёлые хвосты** и кластеризацию волатильности, а нормальное распределение сильно занижает вероятность экстремальных потерь. Помогают исторический VaR, распределение Стьюдента, GARCH-модели волатильности и стресс-тесты."}, {"q": "Посчитайте параметрический однодневный VaR(95%) для позиции 10 млн при дневной σ = 2% и нулевом среднем.", "a": "VaR = z₀.₉₅ · σ · V = 1.645 · 0.02 · 10 млн ≈ 329 тыс. Для 10 дней при независимых доходностях умножают на √10 ≈ 3.16 — около 1.04 млн."}, {"q": "Зачем нужно стресс-тестирование, если есть VaR-модели?", "a": "VaR опирается на исторические данные и «обычные» дни, а кризисы редки и ломают привычные корреляции. Стресс-тесты проверяют портфель на заданных экстремальных сценариях (кризис 2008 года, резкий рост ставок) и выявляют уязвимости, которые статистическая модель не видит."}], "rnn_basics_cheatsheet.html": [{"q": "Как RNN обрабатывает последовательность?", "a": "Пошагово, поддерживая скрытое состояние: hₜ = tanh(W·xₜ + U·hₜ₋₁ + b). Одни и те же веса применяются на каждом шаге, а hₜ «помнит» информацию о предыдущих элементах."}, {"q": "Что такое backpropagation through time (BPTT)?", "a": "Обучение RNN обратным распространением по «развёрнутой» во времени сети: каждый шаг — отдельный слой с общими весами. Градиенты по общим весам суммируются по всем шагам."}, {"q": "Почему простая RNN плохо запоминает длинные зависимости?", "a": "При BPTT градиент многократно умножается на одну и ту же матрицу весов и производную tanh, поэтому экспоненциально затухает (или взрывается). Сигнал от далёких шагов почти не доходит до весов."}, {"q": "Какие схемы «вход — выход» бывают у RNN?", "a": "Many-to-one (классификация отзыва), one-to-many (генерация подписи к изображению), many-to-many с одинаковой длиной (разметка частей речи) и с разной длиной — encoder-decoder (машинный перевод)."}, {"q": "Как борются со взрывом градиентов в RNN?", "a": "Gradient clipping — ограничивают норму градиента (например, `clip_grad_norm_` до 1.0). Затухание градиентов лечат архитектурно — ячейками LSTM и GRU."}], "rnn_lstm_nlp_cheatsheet.html": [{"q": "Почему простая RNN плохо запоминает длинный контекст?", "a": "При обратном распространении во времени градиент многократно умножается на одну и ту же матрицу весов и производные активации, поэтому он экспоненциально **затухает** (или взрывается). В итоге слова в начале длинного предложения почти не влияют на обучение."}, {"q": "Как LSTM решает проблему затухающего градиента?", "a": "В LSTM есть отдельное **состояние ячейки** cₜ, которое обновляется аддитивно: cₜ = fₜ ⊙ cₜ₋₁ + iₜ ⊙ c̃ₜ. Когда forget gate fₜ близок к 1, градиент проходит по этой «магистрали» почти без затухания, а гейты учатся решать, что забыть, что записать и что выдать."}, {"q": "Чем GRU отличается от LSTM и когда его выбрать?", "a": "GRU объединяет forget и input gate в один **update gate** и не имеет отдельного состояния ячейки, поэтому у него меньше параметров и он быстрее обучается. Качество обычно сопоставимо; GRU удобен при малых данных и ограниченных ресурсах, LSTM — когда важна максимальная выразительность."}, {"q": "Зачем нужна двунаправленная RNN и когда её нельзя использовать?", "a": "Bidirectional RNN читает последовательность слева направо и справа налево, поэтому представление каждого слова учитывает и предыдущий, и последующий контекст — это полезно для NER и классификации. Для **генерации текста** и онлайн-предсказания следующего токена её использовать нельзя: будущих слов в момент предсказания ещё нет."}, {"q": "Что будет, если при паддинге коротких последовательностей не использовать маскирование?", "a": "Модель будет обрабатывать нулевые токены паддинга как настоящие слова, и итоговое скрытое состояние (особенно при паддинге в конце) «размоется» шумом. Нужно маскировать паддинг (`mask_zero=True` в Keras Embedding или `pack_padded_sequence` в PyTorch) либо брать скрытое состояние последнего реального токена."}], "rnn_lstm_time_series_cheatsheet.html": [{"q": "Как подготовить временной ряд для обучения LSTM?", "a": "Нарезать скользящими окнами: вход — последние N значений (и признаки), цель — следующие значения. Получается тензор (число окон, длина окна, число признаков). Масштабирование обучать только на обучающей части."}, {"q": "Чем рекурсивная стратегия многошагового прогноза отличается от прямой?", "a": "Рекурсивная прогнозирует один шаг и подаёт прогноз на вход для следующего — ошибки накапливаются. Прямая (multi-output) сразу выдаёт все H шагов горизонта — ошибки не копятся, но модель сложнее."}, {"q": "Почему важно сравнить LSTM с наивным прогнозом?", "a": "Нейросети на временных рядах часто проигрывают простым бейзлайнам (последнее значение, сезонный наивный прогноз, ETS), особенно на коротких рядах. Если модель не обходит бейзлайн, сложность не оправдана."}, {"q": "Что делать с трендом при обучении LSTM?", "a": "Нейросети плохо экстраполируют значения за пределы обучающего диапазона. Помогают дифференцирование или прогноз относительных изменений, нормализация каждого окна (например, деление на последнее значение) и обратное преобразование прогноза."}, {"q": "Как одновременно прогнозировать много связанных рядов?", "a": "Обучать глобальную модель на всех рядах сразу (как DeepAR), добавив идентификатор ряда и его признаки. Модель переносит закономерности между рядами и работает даже для рядов с короткой историей."}], "rnn_regularization_cheatsheet.html": [{"q": "Почему обычный dropout на рекуррентных связях с новой маской на каждом шаге вредит?", "a": "Шум накапливается по времени и разрушает долгосрочную память скрытого состояния. Поэтому классически dropout применяли только к нерекуррентным связям (вход → слой, слой → выход)."}, {"q": "В чём идея variational (recurrent) dropout?", "a": "Одна и та же маска dropout используется на **всех шагах** последовательности для рекуррентных связей (Gal & Ghahramani). Так регуляризуются рекуррентные веса без накопления разного шума на каждом шаге."}, {"q": "Как работает zoneout?", "a": "Вместо обнуления, на каждом шаге случайные элементы скрытого состояния **сохраняют предыдущее значение**: hₜ = hₜ₋₁ с вероятностью p. Информация и градиент лучше проходят по времени, что похоже на стохастическое тождественное отображение."}, {"q": "Почему `recurrent_dropout` в Keras замедляет обучение на GPU?", "a": "При ненулевом `recurrent_dropout` нельзя использовать оптимизированное ядро cuDNN, и LSTM/GRU переходят на общую медленную реализацию. Это компромисс между регуляризацией и скоростью."}, {"q": "Какие ещё способы регуляризации RNN применяют?", "a": "Weight dropout (DropConnect) на рекуррентных матрицах, как в AWD-LSTM, weight decay, раннюю остановку, embedding dropout, а также gradient clipping для стабильности."}], "roc_auc_cheatsheet.html": [{"q": "Что откладывается по осям ROC-кривой?", "a": "По оси X — FPR = FP / (FP + TN) (доля ложных срабатываний), по оси Y — TPR = TP / (TP + FN) (recall). Каждая точка соответствует одному порогу классификации."}, {"q": "Как интерпретировать значение ROC-AUC?", "a": "Вероятность того, что случайно выбранный положительный объект получит более высокую оценку, чем случайно выбранный отрицательный. 0.5 — случайное угадывание, 1.0 — идеальное ранжирование."}, {"q": "Почему ROC-AUC считают по вероятностям, а не по предсказанным классам?", "a": "ROC-кривая строится перебором порогов, для этого нужна непрерывная оценка (вероятность или score). По меткам 0/1 получится всего одна точка, и AUC будет некорректен."}, {"q": "Почему при сильном дисбалансе классов лучше смотреть на PR-кривую?", "a": "FPR делится на огромное число отрицательных объектов, поэтому даже много ложных срабатываний почти не ухудшает ROC-AUC. PR-кривая (precision-recall) и PR-AUC честнее показывают качество на редком классе."}, {"q": "Что означает ROC-AUC = 0.3?", "a": "Модель ранжирует хуже случайного — чаще всего перепутаны метки классов или знак оценки. Если инвертировать прогноз, получится AUC = 0.7."}], "rule_based_ml_systems_cheatsheet.html": [{"q": "Как извлечь правила из обученного дерева решений и в чём ограничение этого подхода?", "a": "Каждый путь от корня к листу — правило IF (условия) THEN (класс); в sklearn их удобно вывести через `export_text`. Ограничение: глубокое дерево даёт сотни громоздких правил, теряя интерпретируемость, поэтому глубину ограничивают."}, {"q": "Зачем комбинировать жёсткие правила с ML-моделью в продакшене?", "a": "Правила кодируют бизнес-ограничения и регуляторные требования (например, «не выдавать кредит несовершеннолетним») и гарантируют их выполнение, а ML ловит сложные статистические закономерности. Правила также служат страховкой при сдвиге данных."}, {"q": "Что такое суррогатная модель для объяснения «чёрного ящика»?", "a": "Простая интерпретируемая модель (дерево, набор правил) обучается предсказывать не истинные метки, а **ответы** сложной модели. Важно проверять fidelity — насколько точно суррогат повторяет исходную модель, иначе объяснение вводит в заблуждение."}, {"q": "Какие проблемы возникают при росте числа правил вручную?", "a": "Правила начинают конфликтовать и перекрываться, их порядок влияет на результат, а поддержка и тестирование становятся дорогими. Нужны приоритеты, разрешение конфликтов и регулярный аудит покрытия."}, {"q": "Когда правила, сгенерированные из данных, могут быть опасны?", "a": "Если данные смещены, правила закрепляют это смещение в «понятной» форме, создавая ложное ощущение обоснованности. Кроме того, правила, найденные на малых подвыборках, часто переобучены — их нужно проверять на отложенных данных."}], "saliency_maps_cheatsheet.html": [{"q": "Как строится простейшая (vanilla gradient) saliency map?", "a": "Считается градиент score целевого класса по **пикселям входа** ∂yᶜ/∂x, берётся его модуль (и максимум по цветовым каналам). Яркие пиксели — те, небольшое изменение которых сильнее всего меняет предсказание."}, {"q": "Почему vanilla gradient карты выглядят шумными и как помогает SmoothGrad?", "a": "Градиент локален и сильно колеблется из-за нелинейностей ReLU: близкие входы дают совсем разные карты. **SmoothGrad** усредняет градиенты по многим копиям входа с добавленным гауссовым шумом, и карта становится заметно чище."}, {"q": "Чем saliency по градиенту отличается от карты Gradient × Input?", "a": "Градиент показывает **чувствительность** выхода к изменению пикселя, но не учитывает его значение. Gradient × Input умножает градиент на сам вход и приближает **вклад** признака в выход; для линейной модели это точный вклад каждого признака."}, {"q": "Что показал эксперимент «Sanity Checks for Saliency Maps» (Adebayo и др., 2018)?", "a": "Некоторые методы (например, guided backpropagation) дают почти одинаковые карты для **обученной сети и сети со случайными весами** — то есть отражают в основном структуру изображения, а не поведение модели. Поэтому метод объяснения нужно проверять рандомизацией весов и меток."}, {"q": "Почему saliency map нельзя считать полным объяснением решения модели?", "a": "Она показывает локальную чувствительность в одной точке, но не говорит, **как** признаки взаимодействуют, и может меняться от незаметных возмущений входа. Карту стоит использовать как подсказку для анализа, дополняя проверками удаления важных областей (deletion/insertion)."}], "scaling_normalization_cheatsheet.html": [{"q": "Чем отличаются StandardScaler и MinMaxScaler?", "a": "`StandardScaler`: (x − среднее) / стандартное отклонение → среднее 0, отклонение 1, границы не фиксированы. `MinMaxScaler`: (x − min) / (max − min) → значения в [0, 1]."}, {"q": "Какой скейлер выбрать при наличии выбросов и почему?", "a": "`RobustScaler`: он использует медиану и межквартильный размах, на которые выбросы почти не влияют. У MinMaxScaler один выброс «сжимает» все остальные значения к краю диапазона."}, {"q": "Почему скейлер обучают на train, а к test применяют `transform`?", "a": "Тест имитирует новые, ещё не известные данные. Если обучить скейлер на тесте или на всех данных, его статистики попадут в обучение — это утечка данных."}, {"q": "Меняет ли масштабирование форму распределения признака?", "a": "Линейные скейлеры (Standard, MinMax, Robust, MaxAbs) — нет, они лишь сдвигают и растягивают. Изменить форму (например, убрать скошенность) могут логарифм, `PowerTransformer` (Box-Cox, Yeo-Johnson) или `QuantileTransformer`."}, {"q": "Когда подходит MaxAbsScaler?", "a": "Для разреженных данных (например, TF-IDF): он делит на максимум модуля, не сдвигает данные и поэтому сохраняет нули и разреженность."}], "seasonal_decomposition_cheatsheet.html": [{"q": "Когда выбирать аддитивную, а когда мультипликативную декомпозицию?", "a": "**Аддитивная** (y = T + S + R) — когда амплитуда сезонных колебаний постоянна, **мультипликативная** (y = T·S·R) — когда она растёт вместе с уровнем ряда. Мультипликативную можно свести к аддитивной логарифмированием, если ряд положителен."}, {"q": "Чем STL лучше классической декомпозиции через скользящие средние?", "a": "STL (на основе LOESS) позволяет сезонности меняться со временем, устойчива к выбросам (опция `robust`), работает с любым периодом и не теряет значения тренда на краях ряда. Классическая декомпозиция предполагает неизменную сезонность и даёт NaN в первых и последних period/2 точках."}, {"q": "Что означает структура в остатках после декомпозиции?", "a": "Остатки должны быть похожи на белый шум. Если в них видны автокорреляция, периодичность или изменение дисперсии, то период выбран неверно, есть несколько сезонностей (например, недельная и годовая) или модель (аддитивная/мультипликативная) не подходит."}, {"q": "Почему декомпозицию всего ряда нельзя напрямую использовать для признаков в прогнозной модели?", "a": "Центрированные скользящие средние и LOESS используют будущие значения, поэтому тренд и сезонность в момент t «знают» о данных после t. Такие признаки дают утечку; декомпозицию нужно выполнять только на прошлом или использовать причинные (односторонние) фильтры."}, {"q": "Как обращаться с рядом, у которого несколько сезонностей?", "a": "Например, у почасового потребления электроэнергии есть суточный (24) и недельный (168) периоды. Используют методы с несколькими периодами — MSTL, TBATS, Prophet или признаки Фурье для каждого периода; обычная одно-периодная декомпозиция оставит вторую сезонность в остатках."}], "self_attention_cheatsheet.html": [{"q": "Откуда в self-attention берутся Q, K и V?", "a": "Из одной и той же последовательности: каждый токен умножается на три обучаемые матрицы — Q = XW_Q, K = XW_K, V = XW_V. Так каждый токен формирует «запрос», «ключ» и «значение»."}, {"q": "Запишите формулу scaled dot-product attention.", "a": "Attention(Q, K, V) = softmax(QKᵀ / √d_k) · V. Матрица QKᵀ содержит сходство каждого токена с каждым, softmax по строкам даёт веса, и они смешивают векторы значений."}, {"q": "Зачем делить на √d_k?", "a": "При большой размерности скалярные произведения растут по величине, softmax становится почти one-hot и даёт крошечные градиенты. Деление на √d_k удерживает дисперсию оценок около 1."}, {"q": "Какова вычислительная сложность self-attention по длине последовательности n?", "a": "O(n²·d) по времени и O(n²) по памяти на матрицу внимания: каждый токен сравнивается с каждым. Поэтому длинные контексты дороги, и существуют эффективные варианты (sparse, linear attention, FlashAttention)."}, {"q": "Знает ли self-attention о порядке токенов сам по себе?", "a": "Нет: операция инвариантна к перестановке входов (точнее, эквивариантна). Информацию о позиции добавляют отдельно — позиционными кодированиями (синусоидальными, обучаемыми, RoPE)."}], "self_supervised_learning_cheatsheet.html": [{"q": "Откуда в self-supervised learning берутся метки?", "a": "Из **самих данных** через вспомогательную (pretext) задачу: предсказать замаскированные токены или патчи, следующий токен, поворот изображения, совпадение двух аугментаций одного объекта. Ручная разметка не нужна, поэтому можно использовать огромные неразмеченные корпуса."}, {"q": "Чем контрастивные методы отличаются от генеративных (masked modeling)?", "a": "**Контрастивные** (SimCLR, MoCo) учат сближать представления разных видов одного объекта и разносить разные объекты. **Генеративные / masked** (BERT, MAE) восстанавливают скрытые части входа. MAE легко масштабируется и не нужны негативы, а контрастивные признаки обычно лучше для linear probing."}, {"q": "Как оценивают качество self-supervised представлений?", "a": "Стандартно — **linear probing**: энкодер замораживают и обучают поверх только линейный классификатор на размеченных данных. Также используют fine-tuning всей сети, kNN-классификацию по эмбеддингам и перенос на downstream-задачи (детекция, сегментация)."}, {"q": "Почему MAE маскирует около 75% патчей изображения, тогда как BERT — лишь 15% токенов?", "a": "Изображения очень **избыточны**: пропавший патч легко восстановить интерполяцией соседей, и при малой доле маскирования задача тривиальна. Высокая доля делает задачу содержательной и заодно ускоряет обучение, так как энкодер обрабатывает только видимые патчи. Текст же плотен по информации."}, {"q": "Что такое коллапс представлений?", "a": "Ситуация, когда энкодер выдаёт **одинаковый вектор** для любого входа: в задаче «сблизить два вида» это тривиальный минимум. Его предотвращают негативные примеры (SimCLR), асимметрия архитектуры со stop-gradient и momentum-энкодером (BYOL, SimSiam), центрирование (DINO) или регуляризация дисперсии и ковариации (VICReg)."}], "self_training_cheatsheet.html": [{"q": "Как работает базовый алгоритм self-training?", "a": "Обучить модель на размеченных данных, предсказать неразмеченные, добавить самые уверенные примеры с предсказанными метками в обучающую выборку, переобучить и повторять, пока есть уверенные примеры или не достигнут лимит итераций."}, {"q": "Что такое confirmation bias в self-training?", "a": "Если модель уверенно ошибается, ошибочные псевдометки попадают в обучение и закрепляют ошибку, а на следующих итерациях она распространяется дальше. Помогают высокий порог уверенности, малое число добавлений за шаг и возможность пересматривать метки."}, {"q": "Почему для self-training важна калибровка вероятностей?", "a": "Отбор идёт по уверенности модели. Если вероятности некалиброваны (у SVM, бустинга, нейросетей уверенность часто искажена), порог 0.95 не означает 95% правильных меток; калибровка делает отбор надёжнее."}, {"q": "Как пометить неразмеченные примеры для SelfTrainingClassifier в sklearn?", "a": "Меткой `-1` в векторе y. Базовый классификатор должен поддерживать `predict_proba`; параметр `threshold` задаёт порог уверенности при `criterion='threshold'`, а `criterion='k_best'` добавляет k лучших примеров за итерацию."}, {"q": "Что будет при несбалансированных классах?", "a": "Модель увереннее предсказывает частый класс, и псевдометки смещаются в его пользу, усиливая дисбаланс. Отбирают примеры отдельно по каждому классу с сохранением пропорций или используют отдельные пороги для классов."}], "semi_supervised_learning_cheatsheet.html": [{"q": "Какие предположения нужны, чтобы неразмеченные данные помогали обучению?", "a": "**Гладкость** (близкие точки имеют одинаковые метки), **кластерность** (граница проходит через области низкой плотности) и **многообразие** (данные лежат на низкоразмерном многообразии). Если они нарушены, неразмеченные данные могут ухудшить модель."}, {"q": "Может ли semi-supervised обучение оказаться хуже обычного supervised?", "a": "Да: если предположения неверны, неразмеченные данные взяты из другого распределения или модель закрепляет собственные ошибки (confirmation bias). Поэтому всегда сравнивают с базовой supervised-моделью на той же размеченной выборке."}, {"q": "Чем трансдуктивное обучение отличается от индуктивного?", "a": "**Трансдуктивное** предсказывает метки только для имеющихся неразмеченных точек (например, label propagation). **Индуктивное** строит функцию, применимую к новым данным (например, self-training с классификатором)."}, {"q": "Какую идею используют методы consistency regularization (Π-model, Mean Teacher, FixMatch)?", "a": "Предсказание модели должно быть устойчивым к шуму и аугментациям входа. На неразмеченных данных штрафуют расхождение предсказаний для разных возмущений, и граница решений смещается в области низкой плотности."}, {"q": "Как правильно валидировать semi-supervised модель?", "a": "Валидационная выборка должна быть размеченной, отложенной заранее и не участвовать ни в обучении, ни в генерации псевдометок. При малом числе меток иначе легко переобучиться на валидацию при подборе порогов и гиперпараметров."}], "sequence_aware_recommendations_cheatsheet.html": [{"q": "Чем sequence-aware рекомендации отличаются от классической матричной факторизации?", "a": "Матричная факторизация видит историю как неупорядоченное множество взаимодействий. Последовательные модели учитывают **порядок и недавность** событий: после покупки телефона логично предложить чехол, а не другой телефон."}, {"q": "Что такое session-based рекомендации и когда они нужны?", "a": "Рекомендации только по действиям в текущей сессии, без долгосрочного профиля. Они нужны для анонимных пользователей и в доменах, где намерение быстро меняется (e-commerce, новости); классические модели — GRU4Rec, а также простые item-to-item по совместным переходам."}, {"q": "Какие нейросетевые архитектуры используют для последовательных рекомендаций?", "a": "RNN (GRU4Rec), свёрточные (Caser) и трансформеры: **SASRec** — однонаправленное self-attention с предсказанием следующего объекта, **BERT4Rec** — двунаправленный, обучаемый маскированием объектов в последовательности. Трансформеры лучше улавливают дальние зависимости."}, {"q": "Почему при оценке последовательных моделей нельзя случайно делить взаимодействия на train и test?", "a": "Модель увидит будущие события пользователя при обучении и будет предсказывать прошлое по будущему. Используют leave-last-out (последнее событие в тест) или глобальное разбиение по времени, которое честнее отражает продакшен."}, {"q": "Какая ловушка есть в оценке с сэмплированными негативами (100 случайных объектов)?", "a": "Метрики вроде HR@10 по 100 случайным негативам могут менять порядок моделей по сравнению с полным ранжированием по всему каталогу, так как случайные негативы слишком лёгкие. Надёжнее считать метрики по полному каталогу или хотя бы с негативами по популярности."}], "shap_cheatsheet.html": [{"q": "На какой идее основаны значения SHAP?", "a": "На значениях Шепли из теории кооперативных игр: вклад признака — его средний маргинальный вклад в прогноз по всем возможным порядкам добавления признаков. Признаки — «игроки», прогноз — «выигрыш»."}, {"q": "Какое свойство аддитивности есть у SHAP?", "a": "Прогноз для объекта равен базовому значению (среднему прогнозу) плюс сумма SHAP-значений всех признаков: f(x) = E[f(X)] + Σφᵢ. Каждый прогноз раскладывается на вклады признаков без остатка."}, {"q": "Чем отличаются локальные и глобальные объяснения SHAP?", "a": "Локальное — разложение прогноза одного объекта (waterfall и force plot). Глобальное — агрегирование по многим объектам: среднее |φᵢ| как важность (bar plot) и распределение вкладов (beeswarm)."}, {"q": "Почему TreeSHAP популярен для бустинга и лесов?", "a": "Точное вычисление значений Шепли экспоненциально по числу признаков. TreeSHAP использует структуру деревьев и считает точные значения за полиномиальное время — быстро даже для больших ансамблей."}, {"q": "Какие ограничения у SHAP стоит помнить?", "a": "При коррелированных признаках результат зависит от того, как моделируется «отсутствие» признака, и может давать нереалистичные комбинации. KernelSHAP медленный. И, как любая важность, SHAP объясняет модель, а не причинность в данных."}], "shap_neural_networks_cheatsheet.html": [{"q": "На чём основаны значения SHAP?", "a": "На **значениях Шепли** из теории кооперативных игр: вклад признака — средний прирост выхода модели при его добавлении к всевозможным коалициям остальных признаков. Сумма SHAP-значений всех признаков равна f(x) − E[f(x)], то есть разности прогноза и базового значения."}, {"q": "Почему точные значения Шепли для нейросети не считают напрямую?", "a": "Нужно перебрать все **2ᵈ** подмножеств признаков — для изображения из тысяч пикселей это невозможно. Используют приближения: KernelSHAP (выборка коалиций), DeepSHAP (на основе DeepLIFT), GradientSHAP (ожидание градиентов, связан с Integrated Gradients)."}, {"q": "Чем DeepExplainer и GradientExplainer в библиотеке shap отличаются от KernelExplainer?", "a": "KernelExplainer — model-agnostic, требует только функции предсказания, но очень медленный. **DeepExplainer** и **GradientExplainer** используют внутреннее устройство сети (обратное распространение) и работают гораздо быстрее, но применимы только к дифференцируемым моделям TensorFlow и PyTorch."}, {"q": "Зачем SHAP для нейросети нужен фоновый набор данных (background)?", "a": "Отсутствие признака моделируется заменой его значения на значения из фона, а базовое значение — это средний прогноз на фоне. Выбор фона (случайная выборка train, нули, размытые изображения) **меняет** объяснения; обычно берут 100–1000 типичных примеров, а слишком маленький фон даёт шумные оценки."}, {"q": "Почему большое SHAP-значение не означает причинное влияние признака?", "a": "SHAP объясняет **модель**, а не реальный мир: он показывает, как признак влияет на прогноз этой модели. При коррелированных признаках вклад делится между ними условно, а замена признака фоном создаёт нереалистичные комбинации, поэтому выводы о причинности по SHAP делать нельзя."}], "shape_constraints_cheatsheet.html": [{"q": "Какие виды ограничений формы бывают, кроме монотонности?", "a": "**Выпуклость/вогнутость** (например, убывающая отдача от рекламы), **унимодальность**, ограниченность значений, гладкость, а также совместные ограничения вроде **субмодулярности** или монотонности по паре признаков. Их используют, когда форма зависимости известна из предметной области."}, {"q": "Почему ограничения формы помогают при малом объёме данных?", "a": "Они сужают пространство гипотез, то есть работают как сильная регуляризация: модель не может подстроиться под шум в виде немонотонных «зубцов». Дисперсия падает, а смещение растёт лишь если ограничение противоречит истинной зависимости."}, {"q": "Какая классическая модель реализует монотонную регрессию без параметрической формы?", "a": "**Изотоническая регрессия** (`sklearn.isotonic.IsotonicRegression`): кусочно-постоянная неубывающая функция, минимизирующая сумму квадратов, находится алгоритмом PAVA. Её же применяют для калибровки вероятностей классификатора."}, {"q": "Как обеспечить выпуклость функции по входу в нейросети?", "a": "Использовать архитектуры вроде **ICNN** (input convex neural networks): неотрицательные веса между скрытыми слоями и выпуклые неубывающие активации (ReLU), что гарантирует выпуклость выхода по входу. Также применяют решёточные модели (lattice) с ограничениями на параметры."}, {"q": "Что лучше: штрафовать нарушение формы или гарантировать её архитектурно?", "a": "Штраф (soft constraint) проще добавить к любой модели, но выполняет ограничение лишь приблизительно и только на тех точках, где штраф вычислялся. Архитектурная гарантия (hard constraint) выполняется везде, что важно для регуляторных требований, но сужает класс моделей."}], "simulated_annealing_cheatsheet.html": [{"q": "С какой вероятностью принимается ухудшающее решение?", "a": "По критерию Метрополиса: P = exp(−ΔE / T), где ΔE > 0 — ухудшение, T — температура. Улучшения принимаются всегда."}, {"q": "Посчитайте: ΔE = 2, T = 1 и T = 10. Как меняется вероятность принять ухудшение?", "a": "При T = 1: exp(−2) ≈ 0.135. При T = 10: exp(−0.2) ≈ 0.82. Высокая температура почти не препятствует ухудшениям, что даёт исследование пространства."}, {"q": "Что будет, если охлаждать слишком быстро?", "a": "Алгоритм превращается в жадный локальный поиск и застревает в первом попавшемся локальном минимуме («закалка» вместо «отжига»). Медленное охлаждение повышает шансы на хорошее решение, но требует больше итераций."}, {"q": "Какие расписания охлаждения используют на практике?", "a": "Чаще всего геометрическое T ← α·T с α ≈ 0.9–0.999; также линейное и логарифмическое T = c / log(1 + k). Логарифмическое теоретически гарантирует сходимость к глобальному оптимуму, но слишком медленное для практики."}, {"q": "Как выбрать начальную температуру?", "a": "Так, чтобы в начале принималась большая доля ухудшающих ходов (например, 80%): оценить типичное ΔE на случайных ходах и решить exp(−ΔE/T₀) ≈ 0.8. Слишком низкая T₀ лишает алгоритм фазы исследования, слишком высокая тратит время на случайное блуждание."}], "sklearn_overview_cheatsheet.html": [{"q": "Чем отличаются методы fit, transform, fit_transform и predict?", "a": "`fit` обучает параметры на данных, `transform` применяет обученное преобразование, `fit_transform` делает оба шага (иногда эффективнее), `predict` возвращает прогноз модели. На тесте вызывают только `transform`/`predict`, иначе статистики «подсмотрят» тест."}, {"q": "Зачем объединять предобработку и модель в Pipeline?", "a": "Чтобы при кросс-валидации и подборе гиперпараметров преобразования обучались **только на обучающих фолдах** (без утечки), а вся цепочка сохранялась и применялась одним объектом. Гиперпараметры шагов задаются как `шаг__параметр`."}, {"q": "Для чего нужен ColumnTransformer?", "a": "Применяет разные преобразования к разным столбцам: например, `StandardScaler` к числовым и `OneHotEncoder(handle_unknown='ignore')` к категориальным, — и объединяет результат. Вместе с Pipeline даёт полный воспроизводимый препроцессинг."}, {"q": "Почему GridSearchCV на большом пространстве параметров стоит заменить RandomizedSearchCV?", "a": "Сетка растёт мультипликативно с числом параметров, и большинство комбинаций тратится на неважные параметры. Случайный поиск при том же бюджете перебирает больше различных значений важных параметров и обычно находит не худшее решение."}, {"q": "Почему лучший score из GridSearchCV — оптимистичная оценка качества?", "a": "Он выбран как максимум по многим конфигурациям на тех же фолдах, поэтому смещён вверх. Для честной оценки нужен отложенный тест или **вложенная кросс-валидация** (nested CV)."}], "smote_imbalanced_cheatsheet.html": [{"q": "Как SMOTE создаёт новые объекты и чем это лучше простого дублирования?", "a": "Для объекта миноритарного класса выбирается один из k ближайших соседей того же класса, и новая точка берётся на отрезке между ними: x_new = x + λ·(x_nn − x), λ ∈ [0, 1]. Дублирование заставляет модель запоминать конкретные точки, а SMOTE расширяет область класса."}, {"q": "Почему oversampling нужно делать только внутри обучающих фолдов?", "a": "Если применить SMOTE до разбиения, синтетические точки, похожие на валидационные, попадут в обучение — оценка завышена. Правильно — `imblearn.pipeline.Pipeline`, который применяет семплер только на `fit`."}, {"q": "Чем рискованен undersampling?", "a": "Удаляются объекты мажоритарного класса, а с ними полезная информация; модель становится менее стабильной. Подходит, когда данных очень много, или в ансамблях, где разные модели видят разные подвыборки."}, {"q": "Какие проблемы есть у SMOTE?", "a": "Он интерполирует и через шум и выбросы, создавая точки в области другого класса; плохо работает в высокой размерности и не умеет напрямую с категориальными признаками (для них есть SMOTENC). Варианты Borderline-SMOTE, ADASYN и комбинации с Tomek links/ENN частично решают это."}, {"q": "Что происходит с вероятностями модели после пересемплирования и что с этим делать?", "a": "Модель видит искусственно завышенную долю редкого класса, поэтому её вероятности **смещены вверх** и не соответствуют реальной частоте. Если нужны честные вероятности, их калибруют на исходном распределении или корректируют порог."}], "social_network_analysis_cheatsheet.html": [{"q": "Чем отличаются degree, betweenness и closeness центральности?", "a": "**Degree** — число связей (популярность). **Betweenness** — доля кратчайших путей, проходящих через вершину (роль «моста», посредника). **Closeness** — величина, обратная средней дистанции до остальных (как быстро вершина достигает всех)."}, {"q": "Почему у вершины может быть малая степень, но высокая betweenness?", "a": "Если она соединяет две плотные группы, почти все пути между ними идут через неё, хотя у неё всего пара связей. Такие вершины критичны для распространения информации, и их удаление может разбить сеть на части."}, {"q": "Чем PageRank отличается от простой степенной центральности?", "a": "PageRank учитывает не только число входящих ссылок, но и важность ссылающихся: ссылка от влиятельной вершины весит больше. Коэффициент затухания (обычно 0.85) моделирует случайные «телепортации» и гарантирует сходимость."}, {"q": "Что такое эффект тесного мира (small world)?", "a": "Социальные сети имеют высокий коэффициент кластеризации (друзья друзей дружат между собой) и при этом малую среднюю длину пути, растущую примерно как логарифм от числа вершин: любые два человека связаны короткой цепочкой знакомств."}, {"q": "Почему важна форма распределения степеней в социальной сети?", "a": "Обычно оно имеет тяжёлый хвост (близко к степенному): немного хабов с огромным числом связей. Такие сети устойчивы к случайному удалению вершин, но уязвимы к целенаправленному удалению хабов, а информация и эпидемии распространяются в них быстрее."}], "source_separation_cheatsheet.html": [{"q": "В чём суть задачи source separation?", "a": "Из смеси сигналов выделить отдельные источники: голос от фона, вокал и инструменты в музыке, отдельных спикеров («cocktail party problem»). Модель получает одну смесь и должна вернуть оценки нескольких исходных сигналов."}, {"q": "Как работает разделение через маски на спектрограмме?", "a": "Сеть предсказывает для каждого источника **маску** (обычно со значениями от 0 до 1) той же формы, что спектрограмма смеси; оценка источника — поэлементное произведение маски на спектр смеси. Затем сигнал восстанавливают обратным STFT, чаще всего с фазой смеси, что ограничивает качество."}, {"q": "Зачем нужны модели во временной области вроде Conv-TasNet или Demucs?", "a": "Они работают прямо с волной и учат обучаемый энкодер вместо STFT, поэтому **не теряют фазу** и не зависят от выбора параметров спектрограммы. На многих бенчмарках такие модели превосходят маскирование спектрограмм."}, {"q": "Что такое проблема перестановок и как её решает PIT?", "a": "При разделении двух спикеров нет фиксированного порядка выходов: неизвестно, какой выход должен соответствовать какому эталону. **Permutation Invariant Training** считает loss для всех перестановок и берёт минимальный, поэтому модель не наказывается за «другой порядок»."}, {"q": "Какими метриками оценивают качество разделения?", "a": "Чаще всего **SI-SDR** (scale-invariant signal-to-distortion ratio) в дБ и его улучшение относительно смеси (SI-SDRi), а для музыки — SDR из пакета BSSEval/museval. Чем выше, тем лучше; итоговую разборчивость речи дополнительно оценивают PESQ, STOI или WER."}], "spectral_clustering_cheatsheet.html": [{"q": "Какие основные шаги спектральной кластеризации?", "a": "Строят граф сходства (матрицу W, например RBF-ядро или kNN-граф), вычисляют лапласиан графа (L = D − W или нормированный), берут собственные векторы, соответствующие k наименьшим собственным значениям, и кластеризуют строки полученной матрицы обычным K-means."}, {"q": "Почему спектральная кластеризация находит невыпуклые кластеры, а K-means — нет?", "a": "Она опирается на связность графа ближайших соседей, а не на расстояние до центра. Два «полумесяца» связаны внутри себя цепочками близких точек и слабо связаны между собой, поэтому в спектральном пространстве они становятся хорошо разделимыми."}, {"q": "Как связано число нулевых собственных значений лапласиана с кластерами?", "a": "Кратность собственного значения 0 у лапласиана равна числу компонент связности графа. Если кластеры почти не связаны, будет несколько собственных значений, близких к нулю, а резкий скачок после k-го значения (eigengap) подсказывает число кластеров."}, {"q": "Как выбор графа сходства влияет на результат?", "a": "Критичен: при слишком большом γ в RBF-ядре или малом числе соседей граф распадается на мелкие куски, при слишком малом γ всё связано со всем и структура теряется. Параметры графа подбирают так же внимательно, как ε в DBSCAN."}, {"q": "Почему спектральную кластеризацию трудно применять к большим данным?", "a": "Нужна матрица сходства n×n и вычисление собственных векторов, что дорого по памяти и времени. Помогают разреженные kNN-графы, приближения (например, метод Нистрёма) или выборка подмножества данных."}], "spectral_embedding_cheatsheet.html": [{"q": "Как устроен spectral embedding (Laplacian Eigenmaps)?", "a": "Строят граф сходства между точками (kNN-граф или RBF-ядро), вычисляют лапласиан графа и в качестве новых координат берут собственные векторы, соответствующие наименьшим ненулевым собственным значениям."}, {"q": "Почему используют наименьшие собственные значения лапласиана и пропускают нулевое?", "a": "Минимизация ∑ wᵢⱼ ‖yᵢ − yⱼ‖² требует, чтобы сильно связанные точки оказались рядом, и её решения — собственные векторы с наименьшими собственными значениями. Собственный вектор для значения 0 постоянен (все точки в одной точке) и не несёт информации, поэтому его отбрасывают."}, {"q": "Как связаны spectral embedding и спектральная кластеризация?", "a": "Спектральная кластеризация — это spectral embedding, после которого полученные координаты кластеризуются K-means. В представлении через собственные векторы слабо связанные группы точек становятся хорошо разделимыми."}, {"q": "Как параметры графа влияют на результат?", "a": "Число соседей или γ ядра определяют, какие точки считаются связанными. Слишком разреженный граф распадается на компоненты (каждая получит своё вырожденное направление), слишком плотный — смешивает удалённые части многообразия."}, {"q": "Какие ограничения у spectral embedding?", "a": "Нет естественного преобразования для новых точек (в sklearn у `SpectralEmbedding` нет `transform`), нужно решать задачу на собственные значения для больших матриц, а результат чувствителен к построению графа. Метод сохраняет в основном локальную структуру, искажая глобальные расстояния."}], "spiking_neural_networks_cheatsheet.html": [{"q": "Чем спайковый нейрон отличается от искусственного нейрона в обычной сети?", "a": "Он передаёт информацию дискретными **спайками** во времени, а не непрерывными значениями. Например, в модели LIF мембранный потенциал накапливает входы с утечкой и при превышении порога испускает спайк и сбрасывается."}, {"q": "Почему SNN нельзя напрямую обучать обычным backpropagation?", "a": "Функция генерации спайка — ступенька, её производная почти везде равна нулю (и не определена в пороге). Используют **surrogate gradients** (гладкую замену производной), конвертацию обученной ANN в SNN или локальные правила вроде STDP."}, {"q": "Что такое STDP?", "a": "Spike-Timing-Dependent Plasticity: если пресинаптический спайк предшествует постсинаптическому, синапс усиливается, если наоборот — ослабляется. Это локальное, биологически правдоподобное правило обучения без учителя."}, {"q": "Почему SNN считаются энергоэффективными и при каком условии это верно?", "a": "Вычисления событийные: работа выполняется только при спайке, а умножения заменяются сложениями. Выигрыш реален на **нейроморфном** железе и при разреженной активности; на GPU симуляция SNN обычно дороже обычной сети."}, {"q": "Чем rate coding отличается от temporal coding?", "a": "При **rate coding** информацию несёт частота спайков за окно — это надёжно, но требует многих шагов. При **temporal coding** значимо точное время спайка (например, время до первого спайка), что быстрее и экономнее, но сложнее в обучении."}], "state_space_models_cheatsheet.html": [{"q": "Из каких двух уравнений состоит модель в пространстве состояний и что они описывают?", "a": "**Уравнение перехода** описывает эволюцию скрытого состояния: xₜ = F·xₜ₋₁ + wₜ, **уравнение наблюдения** — как наблюдение связано с состоянием: yₜ = H·xₜ + vₜ. Шумы wₜ и vₜ отвечают за неопределённость динамики и ошибки измерений."}, {"q": "Почему ARIMA и экспоненциальное сглаживание можно записать как state space модели и что это даёт?", "a": "Любая линейная модель с конечной памятью представима через вектор состояния (например, уровень, тренд, сезонность в ETS). Это даёт единый аппарат: фильтр Калмана для вычисления правдоподобия, оценку параметров методом максимального правдоподобия, естественную обработку пропусков и интервалы прогноза."}, {"q": "Как state space модели справляются с пропусками в данных?", "a": "На шаге с пропуском выполняется только предсказание состояния, а шаг коррекции по наблюдению пропускается. Неопределённость состояния при этом растёт, но ряд не нужно предварительно заполнять, и оценка остаётся корректной."}, {"q": "Чем модель локального уровня (local level) отличается от простого среднего ряда?", "a": "В ней уровень — это случайное блуждание: μₜ = μₜ₋₁ + ηₜ, yₜ = μₜ + εₜ. Отношение дисперсий шумов σ²_η / σ²_ε определяет, насколько быстро уровень следует за данными; при σ²_η → 0 модель вырождается в константное среднее, а прогноз совпадает с простым экспоненциальным сглаживанием."}, {"q": "Что будет, если неверно задать дисперсии шумов процесса и наблюдения?", "a": "При завышенном шуме наблюдения модель будет слишком «инертной» и запаздывать за изменениями, при завышенном шуме процесса — следовать за каждым выбросом. Поэтому дисперсии обычно оценивают по данным методом максимального правдоподобия, а не задают вручную."}], "statistical_anomaly_detection_cheatsheet.html": [{"q": "Почему правило «3 сигм» (z-score) ненадёжно при наличии выбросов?", "a": "Среднее и стандартное отклонение сами чувствительны к выбросам: сильная аномалия раздувает σ, и её z-score оказывается меньше 3 (эффект маскировки). Кроме того, правило предполагает нормальность, а для тяжелохвостых распределений даёт много ложных срабатываний."}, {"q": "Чем модифицированный z-score на основе медианы и MAD лучше обычного?", "a": "Медиана и MAD (медиана абсолютных отклонений) почти не реагируют на выбросы. Модифицированный z-score = 0.6745·(x − медиана) / MAD; порог обычно 3.5. Коэффициент 0.6745 делает MAD сопоставимым с σ для нормального распределения."}, {"q": "Посчитайте границы выбросов по правилу IQR для Q1 = 20 и Q3 = 30.", "a": "IQR = 30 − 20 = 10, границы: Q1 − 1.5·IQR = **5** и Q3 + 1.5·IQR = **45**. Значения вне [5, 45] считаются выбросами; правило не требует нормальности, но для скошенных распределений даёт асимметричные ошибки."}, {"q": "Почему одномерные методы могут пропустить многомерную аномалию?", "a": "Объект может иметь нормальные значения каждого признака по отдельности, но необычную их комбинацию (например, рост 190 см и вес 50 кг). Для таких случаев нужны многомерные методы: расстояние Махаланобиса, Elliptic Envelope, Isolation Forest."}, {"q": "Что учитывать при поиске аномалий во временном ряду статистическими методами?", "a": "Глобальный порог не работает при тренде и сезонности: нормальный пик в праздник окажется «аномалией». Сначала удаляют тренд и сезонность (например, STL) и применяют порог к остаткам, или используют скользящие оценки среднего и разброса только по прошлым данным."}], "statistical_methods_cheatsheet.html": [{"q": "Что на самом деле означает p-value?", "a": "Это вероятность получить результат не менее экстремальный, чем наблюдаемый, **при условии, что верна нулевая гипотеза**. Это не вероятность того, что H₀ верна, и не размер эффекта: при огромной выборке p-value может быть крошечным для практически незначимой разницы."}, {"q": "Почему для сравнения двух моделей на одних и тех же фолдах нужен парный тест?", "a": "Метрики моделей на одном фолде коррелированы, так как зависят от сложности конкретного разбиения. Парный тест (парный t-тест, Уилкоксона, или бутстреп разностей) анализирует разницы по фолдам и гораздо чувствительнее; но фолды CV перекрываются по обучающим данным, поэтому t-тест на них даёт заниженные p-value — существуют поправки (Nadeau — Bengio)."}, {"q": "Что такое проблема множественных сравнений и как её решают?", "a": "При проверке 20 гипотез на уровне α = 0.05 в среднем одна окажется «значимой» случайно. Используют поправку **Бонферрони** (α/m), Холма или контроль FDR методом **Бенджамини — Хохберга**."}, {"q": "Как с помощью бутстрепа построить доверительный интервал для метрики модели на тесте?", "a": "Многократно (например, 1000 раз) сэмплировать тестовые объекты с возвращением, считать метрику на каждой выборке и взять перцентили 2.5% и 97.5% — это 95%-ный перцентильный интервал. Модель при этом не переобучается, оценивается только неопределённость из-за конечного теста."}, {"q": "Когда использовать непараметрические тесты вместо t-теста?", "a": "Когда данные сильно отклоняются от нормальности, есть выбросы, выборки малы или данные порядковые. Например, Манна — Уитни вместо t-теста для независимых выборок и Уилкоксона для парных; при больших выборках t-тест устойчив к ненормальности благодаря ЦПТ."}], "statistical_tests_cheatsheet.html": [{"q": "Зачем нужны статистические тесты, если можно просто сравнить метрики?", "a": "Разница метрик может быть вызвана случайностью разбиения данных и инициализации. Тест оценивает, насколько вероятна наблюдаемая разница при условии, что модели на самом деле одинаково хороши (нулевая гипотеза)."}, {"q": "Почему обычный t-тест по результатам k-fold кросс-валидации даёт слишком много ложных «значимых» различий?", "a": "Обучающие выборки разных фолдов сильно пересекаются, поэтому оценки не независимы, а t-тест это предполагает. Дисперсия недооценивается, и ошибка I рода растёт. Используют поправку Надо–Бенджио (corrected resampled t-test) или тест 5×2cv Дитериха."}, {"q": "Когда использовать тест Макнемара?", "a": "Когда две модели классификации сравниваются на одной и той же тестовой выборке при однократном обучении (например, обучение дорогое). Тест смотрит только на объекты, где модели расходятся: где ошибается только первая и где ошибается только вторая."}, {"q": "Как сравнивать несколько моделей на нескольких датасетах?", "a": "Тестом Фридмана по рангам моделей на каждом датасете, а при значимом результате — пост-хок тестом (например, Немени) с построением диаграммы критических разностей. Попарные t-тесты без поправки на множественные сравнения дают ложные открытия."}, {"q": "Означает ли p-value ниже 0.05, что одна модель практически лучше другой?", "a": "Нет: статистическая значимость говорит лишь о том, что разница вряд ли случайна. При большом объёме данных значимой становится и мизерная разница, поэтому нужно смотреть и на размер эффекта (величину разницы, доверительный интервал) и её практическую ценность."}], "statistical_tests_t_test_mcnemar_cheatsheet.html": [{"q": "Почему для сравнения двух моделей по фолдам используют парный, а не независимый t-тест?", "a": "Обе модели оцениваются на одних и тех же фолдах, и сложность фолда влияет на обе одинаково. Парный тест анализирует разности по фолдам, убирая эту общую вариацию, и поэтому намного чувствительнее."}, {"q": "Какое допущение t-теста нарушается при k-fold кросс-валидации и чем это грозит?", "a": "Допущение независимости наблюдений: обучающие выборки фолдов перекрываются, и результаты коррелированы. Дисперсия недооценивается, p-value получаются заниженными, и тест слишком часто находит несуществующие различия. Решения — поправка Надо–Бенджио или тест 5×2cv."}, {"q": "Какие числа использует тест Макнемара?", "a": "Только объекты, на которых модели расходятся: b — первая права, вторая ошибается; c — наоборот. Статистика χ² = (|b − c| − 1)² / (b + c) с поправкой на непрерывность, 1 степень свободы; при малых b + c используют точный биномиальный тест."}, {"q": "Модели расходятся на 30 объектах: b = 20, c = 10. Значима ли разница по Макнемару при α = 0.05?", "a": "χ² = (|20 − 10| − 1)² / 30 = 81 / 30 = 2.7, что меньше критического значения 3.84 для одной степени свободы. Разница не значима, хотя первая модель вдвое чаще оказывается права в спорных случаях."}, {"q": "Почему тест Макнемара не учитывает объекты, где обе модели правы или обе ошибаются?", "a": "Такие объекты не несут информации о различии моделей: на них модели ведут себя одинаково. Нулевая гипотеза формулируется как равенство вероятностей двух типов расхождений, то есть b и c должны быть примерно равны."}], "stemming_lemmatization_cheatsheet.html": [{"q": "Чем стемминг отличается от лемматизации?", "a": "Стемминг обрезает окончания по эвристическим правилам и может дать не слово («красивый» → «красив»). Лемматизация приводит слово к словарной форме с учётом морфологии и части речи («бежал» → «бежать»), но медленнее и требует словаря или модели."}, {"q": "Почему для русского языка нормализация слов особенно полезна?", "a": "Русский — флективный язык: у одного слова десятки форм по падежам, числам и родам. Без нормализации каждая форма становится отдельным признаком, словарь раздувается, а статистики по слову размываются."}, {"q": "Что такое overstemming и understemming?", "a": "**Overstemming** — разные по смыслу слова сводятся к одной основе («университет» и «универсальный» → «универс»). **Understemming** — формы одного слова получают разные основы. Оба эффекта ухудшают поиск и классификацию."}, {"q": "Когда нормализация слов может навредить?", "a": "В задачах, где важна форма слова: NER, синтаксический разбор, определение авторского стиля, тонкий анализ тональности. Для трансформеров с subword-токенизацией лемматизация обычно не нужна и только теряет информацию."}, {"q": "Почему лемматизатору нужен контекст?", "a": "Из-за омонимии: «стекло» может быть существительным (лемма «стекло») или глаголом (лемма «стечь»). Без учёта контекста и части речи лемматизатор выберет неверную лемму; поэтому pymorphy2 возвращает несколько вариантов разбора с оценками."}], "stylegan_architecture_cheatsheet.html": [{"q": "Зачем в StyleGAN mapping network?", "a": "8-слойный MLP переводит z из гауссова пространства Z в промежуточное пространство W, которое не обязано повторять распределение данных. W получается более распутанным: направления в нём лучше соответствуют отдельным атрибутам."}, {"q": "Как стиль w влияет на синтез?", "a": "Через AdaIN (в StyleGAN2 — модуляцию/демодуляцию весов свёрток): w аффинно преобразуется в масштаб и сдвиг признаков каждого слоя. Ранние слои управляют грубыми атрибутами (поза, форма), поздние — тонкими (цвет, текстура)."}, {"q": "Зачем добавляется шум на каждый слой?", "a": "Для стохастических деталей — расположения волос, пор, веснушек — которые не должны зависеть от глобального стиля. Генератору не нужно тратить ёмкость, чтобы порождать псевдослучайность из w."}, {"q": "Что такое style mixing и truncation trick?", "a": "**Style mixing** — использование разных w для разных слоёв при обучении, что регуляризует и разделяет уровни стилей. **Truncation trick** сжимает w к среднему: w′ = w̄ + ψ(w − w̄), при ψ < 1 повышая качество ценой разнообразия."}, {"q": "Что исправил StyleGAN2 по сравнению с первой версией?", "a": "Капельные артефакты от AdaIN — заменил на демодуляцию весов; progressive growing — заменил на skip/residual-архитектуры; добавил path length regularization для более гладкого латентного пространства."}], "subspace_clustering_cheatsheet.html": [{"q": "Зачем нужна кластеризация в подпространствах?", "a": "В высокой размерности кластеры часто проявляются только в части признаков, а остальные признаки — шум, который «размывает» расстояния. Разные кластеры могут существовать в разных подмножествах признаков, поэтому глобальное снижение размерности (например, PCA) их не обязательно выявит."}, {"q": "Почему нельзя просто сделать отбор признаков перед обычной кластеризацией?", "a": "Отбор признаков выбирает одно подмножество для всех данных, а в subspace clustering у каждого кластера своё подпространство. Признак, важный для одного кластера, может быть шумом для другого."}, {"q": "Как работает CLIQUE?", "a": "Пространство разбивается сеткой на ячейки, плотными считаются ячейки с долей точек выше порога. Плотные области ищутся снизу вверх: от одномерных подпространств к многомерным, с использованием свойства монотонности — если область плотна в k измерениях, то её проекции плотны и в любом подмножестве этих измерений (как в алгоритме Apriori)."}, {"q": "Чем bottom-up методы (CLIQUE) отличаются от top-down (PROCLUS)?", "a": "Bottom-up начинают с низкоразмерных плотных областей и наращивают размерность, находя кластеры в произвольных подпространствах, в том числе пересекающиеся. Top-down начинают с кластеризации в полном пространстве и для каждого кластера итеративно уточняют набор значимых признаков; например, PROCLUS — это k-medoids с отбором измерений для каждого медоида."}, {"q": "Какие трудности у методов subspace clustering?", "a": "Число подпространств растёт экспоненциально с размерностью, поэтому нужны эвристики и обрезка перебора. Результат чувствителен к параметрам (размер ячейки сетки, порог плотности, средняя размерность кластера), а найденные кластеры могут сильно пересекаться и требуют интерпретации."}], "surrogate_models_cheatsheet.html": [{"q": "Что такое глобальная суррогатная модель и на чём её обучают?", "a": "Интерпретируемая модель (неглубокое дерево, линейная модель), обученная предсказывать **ответы чёрного ящика**, а не истинные метки. Она объясняет поведение модели, а не саму задачу."}, {"q": "Что такое fidelity и почему без неё нельзя доверять суррогату?", "a": "Степень совпадения суррогата с исходной моделью: accuracy или R² между предсказаниями суррогата и чёрного ящика (на отложенных данных). При низкой fidelity объяснение описывает другую модель и вводит в заблуждение."}, {"q": "Чем глобальный суррогат отличается от локального (LIME)?", "a": "Глобальный аппроксимирует модель на всём пространстве данных и даёт общие правила. Локальный (LIME) обучается на возмущениях вокруг одного объекта и объясняет только этот прогноз — он точнее локально, но не описывает модель в целом."}, {"q": "Какой компромисс возникает при выборе глубины дерева-суррогата?", "a": "Глубокое дерево точнее копирует чёрный ящик (выше fidelity), но теряет интерпретируемость. Мелкое понятно, но может упрощать поведение модели. Глубину выбирают по графику fidelity от глубины."}, {"q": "Чем суррогатная модель отличается от дистилляции знаний?", "a": "Обе обучаются на выходах учителя, но цели разные. Суррогат нужен для **объяснения** и должен быть интерпретируемым. Дистилляция нужна для **сжатия и ускорения**: ученик (часто нейросеть поменьше) должен максимально сохранить качество, и интерпретируемость не важна."}], "svd_cheatsheet.html": [{"q": "Что представляет собой разложение X = UΣVᵀ?", "a": "U и V — ортогональные матрицы (левые и правые сингулярные векторы), Σ — диагональная матрица неотрицательных сингулярных значений по убыванию. Разложение существует для любой матрицы, в том числе прямоугольной и вырожденной."}, {"q": "Почему усечённое SVD даёт наилучшее приближение матрицы малого ранга?", "a": "По теореме Эккарта–Янга, оставив k наибольших сингулярных значений и соответствующие векторы, получаем матрицу ранга k с минимальной ошибкой по норме Фробениуса (и спектральной норме). Ошибка по Фробениусу равна √(∑ᵢ₌ₖ₊₁ σᵢ²)."}, {"q": "Чем `TruncatedSVD` отличается от PCA в sklearn?", "a": "`PCA` центрирует данные перед разложением, а `TruncatedSVD` — нет. Поэтому `TruncatedSVD` работает с разреженными матрицами (например, TF-IDF), не превращая их в плотные, — это основа латентно-семантического анализа (LSA)."}, {"q": "Как SVD применяется в рекомендательных системах?", "a": "Матрицу «пользователь × объект» приближают произведением матриц малого ранга: строки — латентные векторы пользователей и объектов. Но в реальных данных большинство оценок неизвестно, поэтому классический SVD применяют не напрямую, а используют матричную факторизацию, минимизирующую ошибку только по известным оценкам (ALS, SGD)."}, {"q": "Как связаны сингулярные значения X с собственными значениями XᵀX?", "a": "Собственные значения XᵀX равны σᵢ², а правые сингулярные векторы V — её собственные векторы. Поэтому SVD центрированной матрицы даёт главные компоненты, но численно устойчивее, чем вычисление и разложение XᵀX."}], "svm_cheatsheet.html": [{"q": "Почему SVM максимизирует отступ (margin) и что такое опорные векторы?", "a": "Широкая разделяющая полоса даёт лучшую обобщающую способность: модель устойчивее к шуму около границы. Опорные векторы — объекты на границе полосы или внутри неё; только они определяют решение, остальные точки можно удалить без изменения модели."}, {"q": "Как параметр C влияет на модель?", "a": "C — штраф за нарушение отступа. Большое C почти не допускает ошибок на обучении — узкая полоса и риск переобучения; малое C разрешает больше нарушений — широкая полоса и более сильная регуляризация."}, {"q": "В чём суть kernel trick?", "a": "Двойственная задача SVM зависит от данных только через скалярные произведения ⟨xᵢ, xⱼ⟩. Заменив их ядром K(xᵢ, xⱼ) (например, RBF: exp(−γ‖xᵢ − xⱼ‖²)), получаем линейный классификатор в неявном многомерном пространстве признаков, не вычисляя само отображение."}, {"q": "Что будет при слишком большом γ в RBF-ядре?", "a": "Ядро становится очень «узким»: каждая точка влияет только на ближайшую окрестность, граница огибает отдельные объекты, и модель переобучается. Малое γ, наоборот, даёт почти линейную гладкую границу. C и γ подбирают совместно по сетке."}, {"q": "Почему SVM чувствителен к масштабу признаков и плохо масштабируется на большие выборки?", "a": "И отступ, и RBF-ядро опираются на расстояния, поэтому признак с большим масштабом доминирует — нужна стандартизация. Ядерный SVM работает с матрицей ядра n×n, и обучение растёт примерно как O(n²)–O(n³), поэтому на сотнях тысяч объектов используют `LinearSVC` или `SGDClassifier`."}], "swarm_intelligence_cheatsheet.html": [{"q": "Из каких составляющих складывается обновление скорости частицы в PSO?", "a": "v ← w·v + c₁r₁(pbest − x) + c₂r₂(gbest − x): **инерция**, «когнитивная» тяга к личному лучшему положению и «социальная» тяга к лучшему положению роя; r₁, r₂ — случайные числа из [0, 1]. Затем x ← x + v."}, {"q": "Как вес инерции w влияет на поиск?", "a": "Большой w усиливает исследование — частицы летают далеко и не застревают; малый w усиливает локальное уточнение. Часто w линейно уменьшают, например от 0.9 до 0.4, чтобы перейти от исследования к эксплуатации."}, {"q": "Как работает ant colony optimization?", "a": "Муравьи строят решения вероятностно, выбирая ребро пропорционально τᵅ·ηᵝ (феромон и эвристика, например 1/расстояние). Затем феромон испаряется с коэффициентом ρ и усиливается на рёбрах хороших решений, так что колония «запоминает» удачные пути."}, {"q": "Зачем в ACO нужно испарение феромона?", "a": "Без испарения феромон накапливается на первых найденных путях, и колония быстро сходится к ним, даже если они плохие. Испарение «забывает» старые решения и сохраняет исследование."}, {"q": "Для каких задач лучше подходит PSO, а для каких ACO?", "a": "**PSO** естественен для непрерывной оптимизации (подбор вещественных гиперпараметров, весов). **ACO** — для дискретных задач на графах: коммивояжёр, маршрутизация, расписания, где решение строится пошагово из компонентов."}], "syntactic_parsing_cheatsheet.html": [{"q": "Чем разбор по составляющим отличается от разбора по зависимостям?", "a": "**Constituency** строит иерархию фраз (NP, VP, PP) по грамматике составляющих. **Dependency** связывает слова направленными рёбрами «вершина → зависимое» с типом связи (nsubj, obj). Зависимости компактнее и лучше подходят для языков со свободным порядком слов."}, {"q": "Почему для русского языка чаще используют dependency-разбор?", "a": "В русском свободный порядок слов, и синтаксические роли выражаются окончаниями, а не позицией. Деревья зависимостей естественно описывают такие связи, включая непроективные; для русского есть корпуса Universal Dependencies (например, SynTagRus)."}, {"q": "Чем transition-based парсеры отличаются от graph-based?", "a": "**Transition-based** строят дерево последовательностью действий (SHIFT, LEFT-ARC, RIGHT-ARC) со стеком — быстро, за линейное время, но ранние ошибки накапливаются. **Graph-based** оценивают все возможные рёбра и ищут максимальное остовное дерево (алгоритм Чу–Лю/Эдмондса) — глобально, но дороже."}, {"q": "Как оценивают качество dependency-парсера?", "a": "**UAS** — доля слов с правильно найденной вершиной; **LAS** — доля слов с правильной вершиной и правильным типом связи. LAS всегда ≤ UAS."}, {"q": "Где на практике полезен синтаксический разбор?", "a": "В извлечении отношений (кто — что — кому), information extraction, обработке отрицаний в анализе тональности, упрощении текста, проверке грамматики. Пути в дереве зависимостей между словами часто служат признаками для моделей."}], "tabnet_cheatsheet.html": [{"q": "Какую роль в TabNet играет механизм внимания на каждом шаге?", "a": "На каждом шаге решения **attentive transformer** строит маску, выбирающую подмножество признаков для обработки. Маска разреженная благодаря **sparsemax** (а не softmax), поэтому модель реально «смотрит» лишь на часть признаков — это даёт встроенный отбор и интерпретируемость."}, {"q": "Зачем в TabNet нужен коэффициент релаксации γ (prior scales)?", "a": "Он регулирует, насколько признак, уже использованный на прошлых шагах, может выбираться снова. При γ = 1 каждый признак используется лишь на одном шаге, при большем γ — допускается повторное использование."}, {"q": "Как TabNet даёт интерпретацию и чем она отличается от SHAP?", "a": "Маски внимания агрегируются по шагам и дают важность признаков как для каждого объекта (локально), так и для всего датасета. Это «встроенная» важность из самой архитектуры, а не постфактум-объяснение вроде SHAP; она не всегда совпадает с реальным вкладом признака в предсказание."}, {"q": "Какое предобучение предлагает TabNet и когда оно полезно?", "a": "Самообучение (self-supervised): часть признаков маскируется, и энкодер-декодер учится их восстанавливать. Полезно, когда много неразмеченных данных и мало меток."}, {"q": "Почему TabNet на практике часто проигрывает градиентному бустингу?", "a": "TabNet чувствителен к гиперпараметрам (n_d, n_a, число шагов, batch size, lr), обучается дольше и требует больших батчей. Независимые сравнения показывают, что на типичных средних таблицах XGBoost/LightGBM/CatBoost обычно точнее при меньших затратах на настройку."}], "tabu_search_cheatsheet.html": [{"q": "Зачем нужен табу-список?", "a": "Он запрещает возвращаться к недавно посещённым решениям или повторят

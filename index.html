otentials)?", "a": "Они аппроксимируют энергию и силы, полученные DFT, но вычисляются на порядки быстрее. Это позволяет проводить молекулярную динамику больших систем и долгих времён с почти квантовой точностью."}, {"q": "Почему силы в ML-потенциале обычно получают как градиент энергии?", "a": "F = −∇E гарантирует, что силовое поле **консервативно** и энергия сохраняется в молекулярной динамике. Независимое предсказание сил может нарушать законы сохранения и давать нестабильные траектории."}, {"q": "Каким инвариантностям должно удовлетворять представление молекулы для предсказания энергии?", "a": "Энергия не меняется при сдвигах, поворотах молекулы и перестановке одинаковых атомов. Дескрипторы (SOAP, симметрийные функции) или архитектуры (SchNet, эквивариантные GNN) строят так, чтобы эти симметрии выполнялись автоматически."}, {"q": "Что такое active learning при построении обучающего набора для ML-потенциала?", "a": "Модель запускают в симуляции, отбирают конфигурации, где её неопределённость велика (например, разброс ансамбля), и только для них считают дорогой DFT. Так данные набираются там, где они нужнее всего."}, {"q": "Почему ML-модель не может быть точнее, чем данные, на которых обучена?", "a": "Она воспроизводит уровень теории обучающих расчётов вместе с его систематическими ошибками (например, выбранного DFT-функционала). Чтобы приблизиться к эксперименту, используют данные более высокого уровня или transfer learning на них."}], "computational_social_science_cheatsheet.html": [{"q": "Почему данные социальных сетей нерепрезентативны для всего населения?", "a": "Пользователи платформ отличаются по возрасту, образованию и активности, малая доля пользователей производит большую часть контента, а есть боты. Выводы о «мнении общества» без поправок на выборку смещены."}, {"q": "Чем корреляция в наблюдательных цифровых данных отличается от причинного эффекта?", "a": "Наблюдаемая связь может объясняться конфаундерами и отбором (например, гомофилией в сетях), а не влиянием. Для причинных выводов нужны эксперименты (A/B), естественные эксперименты, instrumental variables или difference-in-differences."}, {"q": "Что такое гомофилия и почему она мешает изучать социальное влияние?", "a": "Люди связываются с похожими на себя. Поэтому сходство поведения друзей может быть следствием выбора друзей, а не заражения поведением — эти эффекты трудно разделить по наблюдательным данным."}, {"q": "Какие этические проблемы специфичны для computational social science?", "a": "Приватность и риск деанонимизации даже «анонимных» данных (например, по мобильным трекам), отсутствие информированного согласия, возможность манипуляции и дискриминации. Нужны этическая экспертиза, минимизация данных и агрегирование."}, {"q": "Почему модель, предсказывающая социальное поведение, может ухудшаться со временем?", "a": "Платформы меняют алгоритмы и интерфейсы, люди адаптируют поведение, в том числе к самому прогнозу (**performative prediction**). Распределение данных дрейфует, и модель нужно регулярно перепроверять."}], "concept_activation_vectors_cheatsheet.html": [{"q": "Что такое Concept Activation Vector (CAV)?", "a": "Направление в пространстве активаций слоя, соответствующее **человеческому понятию** (например, «полосатость»). Его получают, обучая линейный классификатор отличать активации примеров с понятием от случайных примеров; нормаль к разделяющей гиперплоскости и есть CAV."}, {"q": "Как работает TCAV и что означает его score?", "a": "Для каждого примера класса считается **производная по направлению**: скалярное произведение градиента логита класса по активациям слоя на CAV. TCAV score — доля примеров класса, у которых эта производная положительна; например, 0.8 для «зебра» и «полосатость» означает, что понятие повышает вероятность «зебры» у 80% примеров."}, {"q": "Чем TCAV принципиально отличается от saliency maps?", "a": "Saliency maps объясняют через **пиксели** отдельного изображения, а TCAV — через задаваемые человеком **понятия** и на уровне целого класса. Понятия не обязаны быть признаками входа или метками обучающего датасета — достаточно набора примеров понятия."}, {"q": "Зачем в TCAV проводят статистическую проверку со случайными CAV?", "a": "Линейный классификатор найдёт какое-то направление даже для **случайного** набора примеров, и TCAV score может оказаться высоким случайно. Поэтому обучают много CAV на разных случайных выборках и проверяют t-тестом, что score для понятия значимо отличается от распределения score для случайных направлений."}, {"q": "Какие ограничения у метода CAV?", "a": "Нужно вручную собрать **примеры понятия**, и результат зависит от их качества и выбранного слоя. Понятие может быть нелинейно представлено в активациях, а коррелирующие понятия (полосы и саванна) трудно разделить. Методы вроде ACE пытаются находить понятия автоматически."}], "concept_drift_cheatsheet.html": [{"q": "Чем data drift отличается от concept drift?", "a": "Data (covariate) drift — меняется распределение входных признаков P(X), а зависимость остаётся прежней. Concept drift — меняется сама зависимость P(y|X): одни и те же признаки теперь означают другое (например, мошенники сменили тактику)."}, {"q": "Какие виды дрейфа по характеру изменения бывают?", "a": "Внезапный (резкий скачок, например после пандемии), постепенный, инкрементный (медленное смещение), повторяющийся (сезонность)."}, {"q": "Какие статистические инструменты используют для обнаружения дрейфа признаков?", "a": "Тест Колмогорова–Смирнова и Population Stability Index (PSI) для числовых признаков, хи-квадрат для категориальных, расстояния между распределениями (Вассерштейна, Йенсена–Шеннона). Есть и подход «классификатор отличает старые данные от новых»."}, {"q": "Как обнаружить concept drift, если метки приходят с задержкой?", "a": "По мере поступления меток отслеживать качество модели во времени; использовать детекторы на потоке ошибок (DDM, ADWIN, Page-Hinkley). До прихода меток — смотреть на дрейф прогнозов и уверенности модели как косвенный сигнал."}, {"q": "Что делать при обнаружении дрейфа?", "a": "Проверить, не ошибка ли это в данных (сломанный источник). Если дрейф настоящий — переобучить модель на свежих данных, взвесить новые наблюдения сильнее, пересмотреть признаки; при регулярном дрейфе — настроить автоматическое переобучение."}], "confusion_matrix_cheatsheet.html": [{"q": "Что означают TP, FP, FN, TN?", "a": "TP — положительный объект предсказан положительным; FP — отрицательный ошибочно предсказан положительным (ложная тревога, ошибка I рода); FN — положительный пропущен (ошибка II рода); TN — отрицательный верно предсказан отрицательным."}, {"q": "Как расположены ячейки в `sklearn.metrics.confusion_matrix` для бинарной задачи?", "a": "Строки — истинные классы, столбцы — предсказанные: `[[TN, FP], [FN, TP]]` при метках 0 и 1. Поэтому удобно `tn, fp, fn, tp = confusion_matrix(y, y_pred).ravel()`."}, {"q": "Тест на болезнь нашёл 90 из 100 больных и дал 30 ложных тревог на 900 здоровых. Чему равны recall и precision?", "a": "TP = 90, FN = 10, FP = 30. Recall = 90 / 100 = 0.9; precision = 90 / (90 + 30) = 0.75."}, {"q": "Что такое специфичность (specificity)?", "a": "TN / (TN + FP) — доля верно распознанных отрицательных объектов. Вместе с recall (чувствительностью) она часто используется в медицине."}, {"q": "Зачем нормировать матрицу ошибок?", "a": "При дисбалансе классов абсолютные числа трудно сравнивать. Нормировка по строкам (`normalize='true'`) показывает, какая доля объектов каждого истинного класса куда попала, — сразу видно recall каждого класса."}], "constrained_optimization_ml_cheatsheet.html": [{"q": "Зачем в ML нужны ограничения, если можно просто минимизировать ошибку?", "a": "Бизнес-, физические или этические требования не выражаются в loss напрямую: монотонность по признаку, справедливость между группами, неотрицательность весов, бюджет ресурсов. Ограничения гарантируют, что решение допустимо, а не только точно."}, {"q": "Как метод множителей Лагранжа превращает задачу с ограничениями в задачу без них?", "a": "Строится лагранжиан L(x, λ, μ) = f(x) + ∑λᵢgᵢ(x) + ∑μⱼhⱼ(x) с λᵢ ≥ 0 для неравенств gᵢ(x) ≤ 0. Оптимум — седловая точка: минимум по x и максимум по множителям; необходимые условия оптимальности — условия KKT."}, {"q": "Что означает условие дополняющей нежёсткости в KKT?", "a": "λᵢ·gᵢ(x*) = 0: либо ограничение активно (gᵢ = 0), либо его множитель равен нулю. В SVM это значит, что ненулевые множители αᵢ есть только у опорных векторов — точек на границе или нарушающих её."}, {"q": "Чем штрафной метод отличается от барьерного?", "a": "Штрафной метод добавляет ρ·∑max(0, gᵢ(x))² и допускает нарушение ограничений, которое уменьшается с ростом ρ. Барьерный добавляет, например, −μ·∑log(−gᵢ(x)), который уходит в бесконечность у границы, поэтому решение остаётся строго внутри допустимой области."}, {"q": "Как обеспечить простые ограничения на веса при градиентном спуске?", "a": "Проецированным градиентным спуском: после каждого шага проецировать веса на допустимое множество — обрезать до [a, b] для box-ограничений, обнулять отрицательные для неотрицательности, нормировать на шар для ограничения нормы."}], "content_based_filtering_cheatsheet.html": [{"q": "Чем контентная фильтрация отличается от коллаборативной?", "a": "Контентная рекомендует объекты, **похожие по признакам** на те, что нравились пользователю (жанр, текст, теги, эмбеддинги), используя только историю самого пользователя. Коллаборативная опирается на поведение других пользователей и не знает, что внутри объекта."}, {"q": "Почему контентная фильтрация хорошо решает холодный старт объектов, но не пользователей?", "a": "Новый объект сразу имеет признаки, и его можно рекомендовать тем, кому нравились похожие. Новому пользователю без истории не из чего построить профиль, поэтому нужны популярные объекты или опрос предпочтений."}, {"q": "Зачем при построении профиля по текстам использовать TF-IDF, а не просто частоты слов?", "a": "TF-IDF снижает вес слов, встречающихся почти во всех описаниях («фильм», «история»), и повышает вес характерных терминов. Иначе сходство объектов определялось бы общими частыми словами, а не содержанием."}, {"q": "Что такое эффект «пузыря» (overspecialization) в контентных рекомендациях?", "a": "Система рекомендует только очень похожее на уже просмотренное: посмотрел три детектива — получаешь одни детективы. Страдают разнообразие и новизна; помогают MMR-переранжирование, добавление случайности (exploration) и гибридизация с коллаборативными методами."}, {"q": "Почему для сравнения объектов чаще используют косинусное сходство, а не евклидово расстояние?", "a": "Косинус сравнивает направления векторов и не зависит от их длины, а длина TF-IDF-вектора зависит от объёма текста. Два описания одной тематики разной длины будут близки по косинусу, но далеки по евклидову расстоянию."}], "context_aware_recommendations_cheatsheet.html": [{"q": "Что такое контекст в рекомендациях и почему он важен?", "a": "Это условия взаимодействия: время суток, день недели, устройство, местоположение, погода, компания. Предпочтения от них зависят: утром слушают подкасты, вечером музыку, в выходные выбирают другие рестораны, поэтому модель «пользователь × объект» без контекста усредняет разные ситуации."}, {"q": "Чем pre-filtering отличается от post-filtering и контекстного моделирования?", "a": "**Pre-filtering** отбирает только данные, релевантные текущему контексту, и обучает обычную модель. **Post-filtering** строит рекомендации без контекста и затем фильтрует или переранжирует их. **Контекстное моделирование** включает контекст прямо в модель (факторизационные машины, тензорная факторизация, бустинг с признаками контекста)."}, {"q": "Почему факторизационные машины удобны для контекстных рекомендаций?", "a": "FM моделируют попарные взаимодействия всех признаков через скалярные произведения их эмбеддингов: ŷ = w₀ + ∑wᵢxᵢ + ∑∑⟨vᵢ, vⱼ⟩xᵢxⱼ. Контекст добавляется как ещё одна группа признаков, а взаимодействия выучиваются даже для редко встречающихся сочетаний."}, {"q": "Какая проблема возникает при слишком детальном контексте?", "a": "Данные дробятся: на каждое сочетание «пользователь × объект × контекст» приходится мало взаимодействий, разреженность резко растёт. Контекст огрубляют (час → часть суток), используют только значимые факторы и модели, разделяющие параметры между контекстами."}, {"q": "Как проверить, что контекст действительно улучшает рекомендации?", "a": "Сравнить с бесконтекстной базовой моделью на валидации, разбитой по времени, по ранжирующим метрикам, и затем подтвердить A/B-тестом. Важно убедиться, что контекстные признаки доступны в момент запроса — например, итоговая длительность сессии в момент показа неизвестна."}], "contrastive_learning_cheatsheet.html": [{"q": "Как устроен loss InfoNCE (NT-Xent) в SimCLR?", "a": "Для каждого вида объекта позитив — второй вид того же объекта, негативы — все остальные 2(N − 1) видов в батче. Loss — кросс-энтропия softmax по косинусным сходствам, делённым на **температуру** τ: −log(exp(sim(zᵢ, zⱼ)/τ) / ∑ₖ exp(sim(zᵢ, zₖ)/τ))."}, {"q": "Почему для SimCLR критичны аугментации?", "a": "Аугментации определяют, к чему представление станет **инвариантным**. Авторы показали, что особенно важна комбинация random crop и цветовых искажений: без color jitter сеть «читерит», сравнивая цветовые гистограммы двух кропов, вместо изучения смысла."}, {"q": "Какую проблему решает MoCo и как?", "a": "SimCLR нужен огромный батч ради большого числа негативов. MoCo хранит **очередь** эмбеддингов прошлых батчей как негативы, а ключи для неё считает **momentum-энкодер** — экспоненциальное скользящее среднее основного; так негативы остаются согласованными, и можно иметь десятки тысяч негативов при обычном батче."}, {"q": "Как BYOL обходится без негативных примеров и не коллапсирует?", "a": "Online-сеть с дополнительным **predictor** предсказывает представление target-сети, которая является EMA online-сети, а градиент через target не идёт. Эта асимметрия (predictor + stop-gradient + EMA) на практике предотвращает тривиальное решение, хотя строгое объяснение до сих пор обсуждается."}, {"q": "Зачем в SimCLR проекционная голова и почему её отбрасывают после обучения?", "a": "Contrastive loss применяется к выходу небольшой MLP-головы g(h), а не к самому представлению h. Голова «впитывает» инвариантности, нужные только для loss, и теряет полезную информацию (например, о цвете), поэтому для downstream-задач берут **h — представление до головы**, оно заметно лучше."}], "cost_sensitive_learning_cheatsheet.html": [{"q": "Что делает class_weight='balanced' в sklearn?", "a": "Назначает каждому классу вес n_samples / (n_classes · n_samples_класса), то есть обратно пропорционально частоте. Ошибки на редком классе сильнее увеличивают функцию потерь."}, {"q": "Посчитайте веса balanced для 900 объектов класса 0 и 100 объектов класса 1.", "a": "w₀ = 1000 / (2 · 900) ≈ **0.56**, w₁ = 1000 / (2 · 100) = **5**. Суммарный вклад каждого класса становится одинаковым: 900 · 0.56 ≈ 100 · 5 = 500."}, {"q": "Как выбрать оптимальный порог, если известны стоимости ошибок?", "a": "При откалиброванных вероятностях предсказываем класс 1, если p·C_FN > (1 − p)·C_FP, то есть порог **p* = C_FP / (C_FP + C_FN)**. Например, если пропуск в 9 раз дороже ложной тревоги, порог = 1/10."}, {"q": "Чем веса классов отличаются от oversampling?", "a": "Веса масштабируют вклад объектов в функцию потерь без создания новых данных — быстрее и без риска утечки. Для многих моделей эффект близок к дублированию, но синтетические методы вроде SMOTE ещё и меняют геометрию данных."}, {"q": "Как задать учёт дисбаланса в XGBoost/LightGBM?", "a": "Параметром `scale_pos_weight`, который часто ставят ≈ N_neg / N_pos, либо через `sample_weight` в `fit`. Эти веса, как и class_weight, смещают вероятности, поэтому порог или калибровку подбирают отдельно."}], "cotraining_cheatsheet.html": [{"q": "В чём основная идея co-training?", "a": "Данные описаны двумя разными наборами признаков (views). На каждом view обучается свой классификатор, и они учат друг друга: уверенные предсказания одного добавляются как метки в обучающую выборку другого."}, {"q": "Почему co-training обычно меньше страдает от confirmation bias, чем self-training?", "a": "Ошибки двух моделей на разных, условно независимых view слабо коррелированы. Пример, уверенно размеченный одной моделью, для другой — новая информация, а не повторение её собственных ошибок."}, {"q": "Что делать, если у данных нет естественных двух представлений?", "a": "Можно разделить признаки случайно или по типам, либо использовать разные алгоритмы на одних признаках (идея tri-training). Но гарантии ослабевают, если views сильно зависимы."}, {"q": "Что будет, если одно из представлений слабое и само по себе плохо предсказывает класс?", "a": "Нарушается предположение достаточности: слабая модель добавляет много ошибочных меток и портит сильную. В таком случае лучше уменьшить число примеров от слабой модели, поднять её порог уверенности или обойтись одним сильным view."}, {"q": "Какой классический пример задачи для co-training?", "a": "Классификация веб-страниц (Blum и Mitchell, 1998): view 1 — текст самой страницы, view 2 — текст ссылок, ведущих на неё. Каждый view по отдельности достаточен для определения темы страницы."}], "cotraining_semi_supervised_cheatsheet.html": [{"q": "Какие три предположения лежат в основе теоретических гарантий co-training?", "a": "**Достаточность** (каждый view сам по себе позволяет классифицировать), **условная независимость** views при известном классе и **совместимость** (целевые функции на разных views согласуются). При их выполнении Blum и Mitchell доказали обучаемость по малому числу меток."}, {"q": "Почему условная независимость views так важна?", "a": "Если views независимы при классе, то уверенные примеры, отобранные по view 1, для модели на view 2 выглядят как случайная выборка из своего класса, и шум разметки не концентрируется. При сильной зависимости модели ошибаются одинаково и усиливают общие ошибки."}, {"q": "Чем co-training отличается от простого ансамбля двух моделей?", "a": "В ансамбле модели обучаются независимо на одних и тех же размеченных данных и лишь объединяют прогнозы. В co-training модели обмениваются псевдометками на неразмеченных данных и расширяют обучающие выборки друг друга."}, {"q": "Как выбирать число k добавляемых за итерацию примеров?", "a": "Малое k (обычно 1–10 на класс) снижает риск добавить ошибки, но требует больше итераций. Большое k ускоряет процесс, но приносит менее уверенные метки; полезно сохранять пропорции классов при отборе."}, {"q": "Когда co-training вообще не стоит применять?", "a": "Когда нет разумного разделения на два достаточных и слабо зависимых представления, а также когда размеченных данных так мало, что начальные модели почти случайны: тогда они будут уверенно обмениваться ошибками."}], "credit_scoring_cheatsheet.html": [{"q": "Почему в кредитном скоринге часто используют логистическую регрессию с WoE, а не бустинг?", "a": "Регуляторы и бизнес требуют интерпретируемости и объяснения отказа. Логрегрессия на WoE-признаках даёт скоринговую карту с понятными баллами за каждый бин, монотонные зависимости и стабильность; бустинг обычно точнее, но его сложнее обосновать."}, {"q": "Что показывают WoE и IV?", "a": "**WoE** бина = ln(доля «хороших» в бине / доля «плохих» в бине) — монотонно кодирует риск. **IV** = ∑(доля хороших − доля плохих)·WoE по бинам — сила признака: IV < 0.02 — почти бесполезен, > 0.3 — сильный, а подозрительно большой IV — повод проверить утечку."}, {"q": "В чём проблема reject inference?", "a": "Модель обучают только на одобренных заявках, потому что исход по отклонённым неизвестен. Выборка смещена, и модель может плохо работать на тех, кого раньше отклоняли; применяют методы reject inference (парселинг, перевзвешивание) или одобряют небольшую долю заявок для исследования."}, {"q": "Какие метрики используют для оценки и мониторинга скоринговой модели?", "a": "**Gini** = 2·AUC − 1 и KS-статистику (максимальный разрыв накопленных распределений хороших и плохих), а для мониторинга — **PSI** (стабильность распределения скора). PSI > 0.25 обычно сигнал серьёзного сдвига."}, {"q": "Почему важно заранее зафиксировать определение дефолта и окно наблюдения?", "a": "Целевая переменная («просрочка 90+ дней за 12 месяцев») определяет, чему учится модель. Слишком короткое окно не даст дефолтам проявиться, а смена определения делает выборки несопоставимыми, и модель будет применяться к другому понятию риска."}], "crf_conditional_random_fields_cheatsheet.html": [{"q": "Чем CRF лучше независимой классификации каждого токена в NER?", "a": "CRF моделирует условную вероятность всей последовательности меток и учитывает переходы между соседними метками. Поэтому он не выдаст невозможную последовательность вроде `O → I-PER` и согласованно размечает многословные сущности."}, {"q": "Чем CRF отличается от HMM?", "a": "HMM — генеративная модель P(x, y) с предположением, что наблюдение зависит только от текущего состояния. CRF — дискриминативная модель P(y | x), которая может использовать произвольные пересекающиеся признаки всего предложения (суффиксы, регистр, соседние слова)."}, {"q": "Каким алгоритмом ищут лучшую последовательность меток и какова его сложность?", "a": "Алгоритмом **Витерби** (динамическое программирование) за O(n·K²), где n — длина предложения, K — число меток. При обучении нужен прямой-обратный проход (forward-backward) для нормирующей константы и градиентов."}, {"q": "Какие признаки обычно подают в CRF для NER?", "a": "Само слово и его нижний регистр, флаги «с заглавной буквы», «все заглавные», «содержит цифры», префиксы и суффиксы, часть речи, те же признаки соседних слов (±1–2), принадлежность к словарям-газеттирам."}, {"q": "Зачем в нейросетевых моделях NER ставят CRF-слой поверх BiLSTM или BERT?", "a": "Нейросеть даёт хорошие оценки для каждого токена, но не учитывает зависимости между метками. CRF-слой добавляет матрицу переходов и декодирует согласованную последовательность, что часто повышает F1, особенно на границах сущностей."}], "cross_modal_retrieval_cheatsheet.html": [{"q": "В чём суть задачи cross-modal retrieval?", "a": "Найти объекты одной модальности по запросу из другой: изображения по тексту, тексты по изображению, видео по описанию, музыку по описанию. Обычно обе модальности отображают в **общее пространство эмбеддингов**, где близость соответствует смысловому совпадению."}, {"q": "Чем отличаются dual-encoder и cross-encoder для поиска?", "a": "**Dual-encoder** (CLIP) кодирует запрос и документы независимо, поэтому эмбеддинги базы считаются заранее и поиск выполняется быстрым ANN-индексом. **Cross-encoder** обрабатывает пару совместно через attention — точнее, но требует прогона модели для каждой пары. На практике dual-encoder отбирает кандидатов, cross-encoder их **переранжирует**."}, {"q": "Как считается метрика Recall@K в retrieval и чему она равна в примере?", "a": "Доля запросов, для которых правильный ответ попал в top-K выдачи. Если из 200 текстовых запросов для 150 нужное изображение оказалось в первых 5 результатах, то Recall@5 = 150 / 200 = **0.75**."}, {"q": "Зачем нужны hard negatives при обучении поиска?", "a": "Случайные негативы слишком легко отличить, и модель быстро перестаёт получать полезный сигнал. **Трудные негативы** (похожие, но неправильные пары) заставляют учить тонкие различия; но слишком «трудные» могут оказаться ложными негативами — фактически правильными ответами без разметки."}, {"q": "Что такое проблема hubness в пространстве эмбеддингов?", "a": "В высокой размерности некоторые точки («хабы») оказываются ближайшими соседями для непропорционально многих запросов и попадают в выдачу почти всегда. Это портит поиск; помогают нормализация, центрирование эмбеддингов и методы переоценки сходства, например CSLS или inverted softmax."}], "cross_validation_cheatsheet.html": [{"q": "Как работает k-fold кросс-валидация?", "a": "Данные делят на k частей (фолдов). k раз модель обучают на k−1 фолдах и оценивают на оставшемся. Итоговая оценка — среднее (и разброс) k метрик. Каждый объект ровно один раз попадает в валидацию."}, {"q": "Зачем нужен StratifiedKFold?", "a": "Он сохраняет **долю классов** в каждом фолде такой же, как во всей выборке. Это важно при несбалансированных классах: иначе в каком-то фолде редкого класса может почти не оказаться."}, {"q": "Почему для временных рядов нельзя использовать KFold с перемешиванием?", "a": "Модель будет обучаться на «будущем» и проверяться на «прошлом» — это утечка информации. Используют `TimeSeriesSplit`: обучение всегда на более ранних данных, проверка — на более поздних."}, {"q": "Где ошибка: «сначала масштабировали весь датасет, потом сделали кросс-валидацию»?", "a": "Скейлер «видел» валидационные фолды — это утечка данных. Предобработку нужно обучать внутри каждого фолда только на обучающей части; удобнее всего передать `Pipeline` в `cross_val_score`."}, {"q": "Что говорит большой разброс метрики между фолдами?", "a": "Оценка качества неустойчива: модель чувствительна к составу выборки (высокая дисперсия), данных мало или фолды неоднородны. Смотрите не только на среднее, но и на стандартное отклонение."}], "cure_cheatsheet.html": [{"q": "Чем CURE отличается от иерархической кластеризации с одним центром на кластер?", "a": "Каждый кластер представлен не одним центроидом, а несколькими (c) хорошо разнесёнными представительными точками. Расстояние между кластерами — минимальное расстояние между их представителями, поэтому CURE лучше описывает вытянутые и несферические кластеры."}, {"q": "Зачем представительные точки сжимают к центру кластера?", "a": "Представители сдвигаются к центроиду на долю α (shrink factor). Это ослабляет влияние выбросов на краях кластера и не даёт кластерам сливаться через отдельные шумовые точки — компромисс между single linkage (α = 0) и методом центроидов (α = 1)."}, {"q": "Как CURE справляется с большими объёмами данных?", "a": "Кластеризация выполняется на случайной выборке, которая дополнительно может разбиваться на части с предварительной кластеризацией каждой. После этого оставшиеся точки относят к кластеру с ближайшим представителем."}, {"q": "Как CURE борется с выбросами?", "a": "Помимо сжатия представителей, на промежуточных этапах удаляются очень маленькие, медленно растущие кластеры — они, скорее всего, состоят из выбросов. Случайная выборка также снижает долю попавших в обработку аномалий."}, {"q": "Какие у CURE параметры и ограничения?", "a": "Нужно задать число кластеров k, число представителей c и коэффициент сжатия α, а также размер выборки. Метод всё ещё агломеративный и плохо справляется с кластерами сильно разной плотности; в sklearn его нет, реализации есть, например, в библиотеке pyclustering."}], "curriculum_learning_cheatsheet.html": [{"q": "В чём идея curriculum learning?", "a": "Подавать модели примеры **от простых к сложным**, как в обучении людей, вместо случайного порядка. Это может ускорить сходимость и улучшить обобщение, особенно на зашумлённых данных и в сложных задачах."}, {"q": "Как определить «сложность» примера?", "a": "Через эвристики предметной области (длина предложения, редкость слов, уровень шума), через loss или уверенность заранее обученной модели-учителя (transfer teacher), или динамически по текущему loss самой модели (**self-paced learning**: сначала берутся примеры с малым loss)."}, {"q": "Что такое pacing function?", "a": "Функция, которая определяет, **какая доля данных** (от самых простых) доступна модели на шаге t — например, линейно или по корню растёт от 10% до 100%. Слишком медленный темп тратит время на лёгкие примеры, слишком быстрый сводит эффект к нулю."}, {"q": "Чем anti-curriculum и hard example mining противоположны curriculum learning?", "a": "Они наоборот делают упор на **трудные** примеры (например, OHEM в детекции или focal loss), так как лёгкие уже выучены и дают мало градиента. Что работает лучше, зависит от задачи: на зашумлённых метках трудные примеры часто оказываются ошибками разметки, и тогда полезнее curriculum."}, {"q": "Какой риск у curriculum learning на практике?", "a": "Модель долго видит **смещённое распределение** (только простые примеры) и может переобучиться под него, а затем «забывать» при переходе. Плюс появляются дополнительные гиперпараметры; в крупных экспериментах выигрыш от curriculum над случайным порядком часто оказывается небольшим, поэтому эффект нужно проверять."}], "data_augmentation_cheatsheet.html": [{"q": "Зачем нужна аугментация данных?", "a": "Искусственно увеличивает разнообразие обучающей выборки случайными преобразованиями, которые не меняют метку. Модель учится инвариантности к этим преобразованиям и меньше переобучается."}, {"q": "Почему не любую аугментацию можно применять к любой задаче?", "a": "Преобразование не должно менять смысл метки. Горизонтальное отражение подходит для кошек, но не для распознавания цифр 6 и 9 или текста; поворот на 180° испортит задачу определения ориентации."}, {"q": "Применяют ли аугментацию к валидационной и тестовой выборке?", "a": "Случайную аугментацию — нет: оценка должна быть детерминированной и соответствовать реальным данным. Исключение — test-time augmentation (TTA), когда прогнозы по нескольким преобразованным копиям намеренно усредняют."}, {"q": "Что такое Mixup и CutMix?", "a": "Mixup смешивает два изображения и их метки с весом λ: x = λx₁ + (1 − λ)x₂. CutMix вырезает прямоугольник из одного изображения, вставляет в другое и смешивает метки пропорционально площади. Оба метода регуляризуют модель и улучшают калибровку."}, {"q": "Что нужно учитывать при аугментации в задачах детекции и сегментации?", "a": "Геометрические преобразования (поворот, кроп, отражение) нужно применять согласованно и к изображению, и к разметке — рамкам или маскам. Библиотеки вроде Albumentations делают это автоматически."}], "data_preprocessing_missing_encoding_cheatsheet.html": [{"q": "Какие типы пропусков различают и почему это важно?", "a": "MCAR — пропуски полностью случайны; MAR — зависят от других наблюдаемых признаков; MNAR — зависят от самого пропущенного значения (например, люди с высоким доходом его не указывают). От типа зависит, исказит ли простое удаление или заполнение результаты."}, {"q": "Чем заполнять пропуски в числовом признаке с выбросами — средним или медианой?", "a": "Медианой: она устойчива к выбросам, а среднее ими смещается."}, {"q": "Когда стоит добавить бинарный признак «значение было пропущено»?", "a": "Когда сам факт пропуска может нести информацию (MNAR) — например, пустое поле «стаж» у безработных. В sklearn: `SimpleImputer(add_indicator=True)`."}, {"q": "Можно ли просто удалить строки с пропусками?", "a": "Можно, если пропусков мало и они случайны (MCAR). Иначе теряется много данных и выборка становится смещённой."}, {"q": "Чем заполнять пропуски в категориальном признаке?", "a": "Самым частым значением (мода) или отдельной категорией вроде `\"unknown\"` — второй вариант сохраняет информацию о факте пропуска."}], "data_visualization_ml_cheatsheet.html": [{"q": "Почему перед моделированием полезно смотреть на графики, а не только на сводные статистики?", "a": "Одинаковые среднее, дисперсия и корреляция могут иметь совсем разные данные (квартет Анскомба). Графики показывают выбросы, мультимодальность, нелинейность, ошибки в данных, которые не видны в цифрах."}, {"q": "Что показывают кривые обучения и как по ним диагностировать переобучение?", "a": "Метрика на train и validation в зависимости от размера обучающей выборки. **Большой разрыв** при высоком train — переобучение (поможет больше данных или регуляризация). **Обе кривые низкие и сошлись** — недообучение, нужна более сложная модель."}, {"q": "Что должно насторожить на графике остатков регрессии?", "a": "Систематический узор: изогнутость (пропущена нелинейность), «воронка» — рост разброса с прогнозом (гетероскедастичность), кластеры или тренд по времени. Хорошие остатки выглядят как случайное облако вокруг нуля."}, {"q": "Почему расстояния между кластерами на t-SNE нельзя интерпретировать буквально?", "a": "t-SNE сохраняет в основном **локальные соседства**; размеры кластеров и расстояния между ними искажены и сильно зависят от perplexity. Глобальную структуру надёжнее смотреть по PCA."}, {"q": "Какие ошибки оформления графиков чаще всего искажают выводы?", "a": "Обрезанная ось Y, преувеличивающая различия; разные масштабы на сравниваемых графиках; палитры, неразличимые для дальтоников; overplotting на больших данных (помогают прозрачность, hexbin, плотность); отсутствие подписей осей и единиц."}], "date_time_features_cheatsheet.html": [{"q": "Почему месяц или час лучше кодировать через sin и cos, а не числом?", "a": "Числа 12 и 1 (декабрь и январь) или 23 и 0 часов далеки друг от друга, хотя на деле это соседние значения. Пара sin(2π·m/12), cos(2π·m/12) размещает значения на окружности, где соседние периоды близки. Нужны оба: один sin неоднозначен."}, {"q": "Почему при создании лагов и скользящих средних обязательно сортировать по времени и делать shift?", "a": "Без сортировки лаг возьмёт случайную строку. Скользящее среднее без `shift(1)` включает текущее значение таргета — это утечка: в момент прогноза его ещё нет."}, {"q": "Почему для временных данных нельзя использовать обычный KFold со случайным перемешиванием?", "a": "Модель будет обучаться на будущем и проверяться на прошлом, а лаговые признаки соседних дней почти совпадают — оценка завышена. Нужна валидация по времени: `TimeSeriesSplit` или отложенный последний период."}, {"q": "Какие признаки можно извлечь из одной метки времени?", "a": "Год, месяц, день недели, час, номер недели, флаг выходного, праздника, начала или конца месяца, сезон, время с важного события (`days_since_last_purchase`), рабочие часы. Для ряда — лаги, скользящие статистики, разности."}, {"q": "Почему полезен признак «дней с последнего события», а не просто дата события?", "a": "Абсолютная дата не обобщается на будущее — в тесте будут даты, которых не было в обучении. Относительный интервал (давность) сохраняет смысл со временем и обычно сильнее связан с поведением."}], "dbscan_cheatsheet.html": [{"q": "Чем отличаются основные (core), граничные (border) и шумовые точки?", "a": "Core-точка имеет в своей ε-окрестности не меньше `min_samples` точек (включая саму себя). Граничная точка не является core, но лежит в окрестности какой-то core-точки. Все остальные — шум, они получают метку −1."}, {"q": "Какие преимущества DBSCAN перед K-means?", "a": "Не нужно задавать число кластеров, находятся кластеры произвольной (невыпуклой) формы, а выбросы явно помечаются как шум, а не «притягиваются» к ближайшему кластеру."}, {"q": "Как подобрать ε?", "a": "Строят k-distance график: для каждой точки расстояние до k-го ближайшего соседа (k ≈ `min_samples`), отсортированное по возрастанию. ε берут в районе «локтя», где расстояния начинают резко расти. `min_samples` часто берут не меньше размерности + 1, а на шумных данных — больше."}, {"q": "Почему DBSCAN плохо работает с кластерами разной плотности?", "a": "ε и `min_samples` задают единый порог плотности: при маленьком ε разреженный кластер распадается на шум, при большом — плотные соседние кластеры сливаются. Для таких данных подходят OPTICS и HDBSCAN."}, {"q": "Детерминирован ли результат DBSCAN?", "a": "Core-точки и шум определяются однозначно, но граничная точка, достижимая из двух разных кластеров, достаётся тому, который был обработан первым, — это зависит от порядка данных. На практике таких точек мало."}], "dcgan_conditional_gan_cheatsheet.html": [{"q": "Какие архитектурные принципы предложил DCGAN?", "a": "Заменить пулинг на strided-свёртки (в генераторе — транспонированные), использовать BatchNorm, убрать полносвязные скрытые слои, ReLU в генераторе с tanh на выходе и LeakyReLU в дискриминаторе. Это сделало обучение GAN на изображениях заметно стабильнее."}, {"q": "Как в Conditional GAN передаётся условие?", "a": "Метка класса (или другой признак) подаётся и в генератор, и в дискриминатор: обычно эмбеддинг метки конкатенируется с шумом z и с входом/признаками дискриминатора. Дискриминатор проверяет и реалистичность, и соответствие условию."}, {"q": "Что будет, если условие подать только в генератор?", "a": "Дискриминатор не сможет штрафовать несоответствие метке, и генератор может игнорировать условие, генерируя любые реалистичные изображения. Условие должно влиять на оба игрока."}, {"q": "Что такое mode collapse и как его распознать?", "a": "Генератор производит малое разнообразие выходов, найдя несколько образцов, которые обманывают дискриминатор. Видно по почти одинаковым картинкам при разных z; помогают minibatch discrimination, WGAN-GP, spectral normalization."}, {"q": "Зачем в генераторе DCGAN tanh на выходе и как нормировать данные?", "a": "Tanh даёт значения в [−1, 1], поэтому реальные изображения нужно нормировать в тот же диапазон. Если оставить пиксели в [0, 255] или [0, 1], дискриминатор отличит фейки просто по диапазону."}], "decision_theory_cheatsheet.html": [{"q": "В чём суть байесовского правила принятия решений?", "a": "Выбрать действие, минимизирующее **ожидаемые потери** по апостериорному распределению: a* = argmin_a ∑ L(a, y)·P(y|x). При потерях 0–1 это выбор самого вероятного класса."}, {"q": "Почему порог 0.5 не всегда оптимален?", "a": "Порог 0.5 минимизирует ожидаемые потери только при равной стоимости ошибок и откалиброванных вероятностях. Если ложный отказ стоит C_FN, а ложная тревога C_FP, оптимальный порог p* = C_FP / (C_FP + C_FN)."}, {"q": "Почему для оптимального решения важна калибровка вероятностей?", "a": "Байесовское правило подставляет вероятности в формулу ожидаемых потерь. Если модель переуверена, ожидаемые потери считаются неверно, и решение с подобранным по стоимостям порогом будет неоптимальным."}, {"q": "Чем минимаксный критерий отличается от байесовского?", "a": "Минимакс выбирает действие с наименьшими потерями в **худшем случае** и не требует вероятностей состояний — подходит при полной неопределённости или противнике. Байесовский критерий оптимизирует среднее и требует распределения, но менее консервативен."}, {"q": "Какое отношение функция потерь имеет к выбору точечного прогноза в регрессии?", "a": "При квадратичных потерях оптимальный прогноз — **среднее** условного распределения, при абсолютных — **медиана**, при пинбол-потерях — соответствующий **квантиль**. Поэтому метрику нужно выбирать под реальную цену ошибки."}], "decision_trees_cheatsheet.html": [{"q": "Как дерево выбирает разбиение в узле?", "a": "Перебирает признаки и пороги и выбирает разбиение, которое сильнее всего уменьшает неоднородность (impurity) дочерних узлов: критерий Джини или энтропию для классификации, MSE для регрессии."}, {"q": "Чем критерий Джини отличается от энтропии?", "a": "Джини: 1 − Σpₖ², энтропия: −Σpₖ·log pₖ. Обе равны нулю для «чистого» узла и максимальны при равномерном распределении классов. На практике дают похожие деревья; Джини чуть быстрее считать."}, {"q": "Почему глубокое дерево переобучается и как это ограничить?", "a": "Без ограничений дерево делит данные, пока в листьях не останутся единичные объекты, — и запоминает шум. Ограничивают `max_depth`, `min_samples_leaf`, `min_samples_split`, `max_leaf_nodes` или используют обрезку (`ccp_alpha`)."}, {"q": "Нужно ли масштабировать признаки для дерева?", "a": "Нет: разбиения вида «признак ≤ порог» не зависят от масштаба и монотонных преобразований признака."}, {"q": "Назовите главные плюсы и минусы деревьев решений.", "a": "Плюсы: интерпретируемость (набор правил), работа с разнотипными признаками без масштабирования, нелинейность. Минусы: высокая дисперсия (неустойчивость к изменению данных), склонность к переобучению, ступенчатые прогнозы в регрессии. Минусы лечат ансамбли — случайный лес и бустинг."}], "decision_trees_regression_cheatsheet.html": [{"q": "Что предсказывает лист регрессионного дерева и по какому критерию выбирается разбиение?", "a": "Лист предсказывает среднее значение таргета попавших в него объектов (для критерия MAE — медиану). Разбиение выбирается так, чтобы максимально уменьшить взвешенную сумму MSE (дисперсии) в дочерних узлах."}, {"q": "Почему регрессионное дерево не умеет экстраполировать?", "a": "Предсказание — среднее по обучающим объектам листа, поэтому оно всегда лежит в диапазоне таргета обучающей выборки. При x за пределами обучающих данных дерево вернёт значение крайнего листа — константу, даже если тренд явно растёт."}, {"q": "Как выглядит функция предсказания дерева и чем это плохо?", "a": "Это кусочно-постоянная «ступенчатая» функция с разрывами. Гладкие зависимости приближаются грубо, а для точности нужно много листьев, что ведёт к переобучению."}, {"q": "Какие гиперпараметры помогают бороться с переобучением дерева?", "a": "`max_depth`, `min_samples_leaf`, `min_samples_split`, `max_leaf_nodes` ограничивают рост, а `ccp_alpha` включает cost-complexity pruning (обрезку). Без ограничений дерево растёт до одного объекта в листе и запоминает шум."}, {"q": "Нужно ли масштабировать признаки для дерева решений?", "a": "Нет: разбиения вида xⱼ ≤ t инвариантны к монотонным преобразованиям признака, поэтому стандартизация и логарифмирование признаков не меняют структуру дерева. А вот преобразование **таргета** (например, log y) на результат влияет."}], "deep_learning_key_breakthroughs_cheatsheet.html": [{"q": "Почему ReLU помогла обучать глубокие сети лучше, чем сигмоида?", "a": "Производная сигмоиды ≤ 0.25 и почти нулевая при насыщении, поэтому при перемножении по слоям градиент затухает. У ReLU производная равна 1 для положительных входов, и сигнал проходит через много слоёв; к тому же она дешевле вычисляется."}, {"q": "Какую проблему решили residual-связи в ResNet (2015)?", "a": "**Деградацию** — ухудшение качества даже на обучении при росте глубины. Блок учит остаток F(x), а выход равен F(x) + x, поэтому тождественное отображение легко представить, а градиент идёт по «короткому пути». Это позволило обучать сети в 100+ слоёв."}, {"q": "Зачем нужен механизм внимания в seq2seq-моделях?", "a": "Без него вся входная фраза сжимается в один вектор фиксированного размера, и длинные последовательности теряют информацию. Attention даёт декодеру на каждом шаге взвешенно смотреть на все состояния энкодера."}, {"q": "В чём идея GAN и почему их сложно обучать?", "a": "Генератор и дискриминатор играют минимаксную игру: один подделывает данные, другой отличает подделку. Обучение нестабильно: возможен **mode collapse** (генератор выдаёт однообразные примеры) и осцилляции вместо сходимости."}, {"q": "Почему диффузионные модели во многом вытеснили GAN в генерации изображений?", "a": "Они обучаются простой и стабильной задачей предсказания шума, хорошо покрывают распределение данных (нет mode collapse) и дают высокое качество. Цена — медленная генерация из-за многих шагов денойзинга."}], "deep_learning_timeline_cheatsheet.html": [{"q": "Почему книга Минского и Пейперта «Perceptrons» (1969) затормозила развитие нейросетей?", "a": "Они показали, что однослойный перцептрон не решает линейно неразделимые задачи вроде **XOR**. Эффективного способа обучать многослойные сети тогда не было, интерес и финансирование упали — началась «зима ИИ»."}, {"q": "Что изменила работа Rumelhart, Hinton, Williams (1986)?", "a": "Она популяризировала **backpropagation** — вычисление градиентов по всем слоям через правило цепочки. Это сделало обучение многослойных сетей практичным, хотя сам метод описывался раньше (например, Werbos, 1974)."}, {"q": "Почему AlexNet (2012) считают началом бума глубокого обучения?", "a": "Она с большим отрывом выиграла ImageNet (top-5 ошибка ~15% против ~26%). Сработала комбинация: большой размеченный датасет, обучение на **GPU**, ReLU и dropout."}, {"q": "Какую проблему решала LSTM (1997)?", "a": "Затухание градиента в обычных RNN, из-за которого они не запоминали длинные зависимости. Ячейка памяти с гейтами позволяет градиенту проходить через много шагов почти без затухания."}, {"q": "Почему трансформер (2017) вытеснил RNN в NLP?", "a": "Self-attention связывает любые позиции напрямую и обрабатывает последовательность **параллельно**, а не шаг за шагом. Это ускоряет обучение на GPU и позволяет масштабироваться на огромные корпуса (BERT, GPT)."}], "defensive_distillation_cheatsheet.html": [{"q": "В чём основная идея defensive distillation?", "a": "Учительская сеть обучается с softmax при высокой температуре T, затем ученик обучается на её «мягких» вероятностях при той же T. На инференсе T = 1, из-за чего логиты становятся очень большими, softmax насыщается и градиенты по входу почти исчезают."}, {"q": "Почему defensive distillation считается «маскировкой градиентов», а не настоящей защитой?", "a": "Модель не становится устойчивее — просто градиенты на выходе softmax становятся численно нулевыми, и градиентные атаки не находят направление. Атака **Carlini–Wagner**, работающая с логитами, а не с вероятностями, успешно её обходит."}, {"q": "Как температура T влияет на softmax?", "a": "softmax(zᵢ/T): при большом T распределение становится более равномерным и несёт информацию о сходстве классов, при T → 0 стремится к one-hot. Именно мягкие метки при высоком T используются в дистилляции."}, {"q": "Что будет, если атакующий просто разделит логиты дистиллированной модели на T перед вычислением градиента?", "a": "Насыщение softmax исчезнет, градиенты снова станут информативными, и обычные атаки вроде FGSM/PGD начнут работать. Это показывает, что защита держится на численном эффекте, а не на изменении границы решений."}, {"q": "Как правильно проверять, работает ли защита наподобие defensive distillation?", "a": "Использовать адаптивные атаки, знающие о защите, атаки на логиты, black-box и transfer-атаки, увеличивать число итераций PGD. Подозрительный признак — black-box атака успешнее white-box: это указывает на **маскировку градиентов**."}], "demand_traffic_forecasting_cheatsheet.html": [{"q": "Почему продажи — это не то же самое, что спрос?", "a": "Продажи ограничены наличием товара: при out-of-stock продажи равны нулю, хотя спрос был. Обучение на «сырых» продажах занижает прогноз; такие периоды нужно помечать, исключать или восстанавливать спрос (**censored demand**)."}, {"q": "Какие проблемы создаёт прерывистый спрос с большим количеством нулей и как с ним работают?", "a": "Классические модели и MAPE ломаются: MAPE не определена при факте 0, а сглаживание даёт «размазанный» прогноз. Применяют метод **Кростона** и его варианты (SBA, TSB), Tweedie/Poisson-лоссы в бустинге и метрики вроде MAE, RMSSE или WAPE."}, {"q": "Почему при прогнозе спроса часто важнее квантильный прогноз, чем точечный?", "a": "Решение о запасе зависит от асимметрии затрат: нехватка обычно дороже излишка. Прогноз квантиля (например, 0.9 через **pinball loss**) напрямую задаёт уровень сервиса, а среднее не говорит, сколько держать на складе."}, {"q": "Что такое иерархическое согласование прогнозов и зачем оно нужно?", "a": "Прогнозы на уровнях SKU, магазина, региона, построенные независимо, не складываются друг в друга. Методы согласования (bottom-up, top-down, **MinT**) делают прогнозы когерентными, чтобы сумма по магазинам равнялась прогнозу по региону."}, {"q": "Как учитывать промо-акции и праздники в модели трафика или спроса и в чём ловушка?", "a": "Их добавляют как признаки-флаги, окна до/после события и календарь праздников, известные заранее. Ловушка — использовать признаки, недоступные в момент прогноза (фактический трафик в день акции), и забыть про эффект **каннибализации** и провала спроса после промо."}], "differentiable_programming_cheatsheet.html": [{"q": "Чем дифференцируемое программирование шире, чем обучение нейросетей?", "a": "Градиенты берутся через произвольные программы — физические симуляторы, рендеринг, решатели оптимизации, сортировку, — а не только через слои сети. Параметры любой такой программы можно подбирать градиентным спуском."}, {"q": "Чем reverse-mode автодифференцирование отличается от forward-mode и когда что выгоднее?", "a": "**Forward-mode** протягивает производные вместе с вычислением, стоимость пропорциональна числу входов. **Reverse-mode** (backprop) — один обратный проход на каждый выход. Для функции «много параметров → один лосс» выгоден reverse-mode, для «мало входов → много выходов» — forward."}, {"q": "Почему автодифференцирование — это не символьное и не численное дифференцирование?", "a": "Численное (конечные разности) неточное и дорогое при многих параметрах, символьное даёт громоздкие выражения. AD применяет правило цепочки к элементарным операциям программы и даёт точные (до машинной точности) производные за небольшое число вычислений функции."}, {"q": "Как получить градиент через дискретные операции вроде argmax или сортировки?", "a": "Использовать гладкие релаксации: softmax с температурой вместо argmax, **Gumbel-softmax**, дифференцируемую сортировку, либо **straight-through estimator**, где в прямом проходе дискретная операция, а в обратном — производная гладкой замены."}, {"q": "В чём ловушка дифференцирования через итеративный процесс (например, длинную симуляцию)?", "a": "Градиенты через много шагов могут взрываться или затухать, как в RNN, а хранение всех промежуточных состояний требует много памяти. Применяют checkpointing, неявное дифференцирование (через точку равновесия) и усечение горизонта."}], "differential_privacy_cheatsheet.html": [{"q": "Что гарантирует ε-дифференциальная приватность?", "a": "Для любых двух датасетов, отличающихся одной записью, вероятность любого результата алгоритма различается не более чем в e^ε раз. Значит, по выходу почти нельзя понять, был ли конкретный человек в данных; меньший ε — сильнее приватность."}, {"q": "Как рассчитать шум для механизма Лапласа и от чего он зависит?", "a": "Добавляют шум Laplace(0, Δf/ε), где **Δf** — чувствительность (максимальное изменение ответа при изменении одной записи). Для счётчика Δf = 1, и при ε = 0.5 масштаб шума b = 2. Шум не зависит от размера датасета, поэтому на больших выборках относительная ошибка мала."}, {"q": "Почему нельзя бесконечно задавать запросы к DP-системе?", "a": "Приватность **композируется**: k запросов с ε каждый в худшем случае дают суммарно k·ε (продвинутая композиция даёт рост примерно как √k). Поэтому вводят бюджет приватности, иначе усреднение многих ответов снимет шум."}, {"q": "Как работает DP-SGD и какие у него два ключевых шага?", "a": "На каждом шаге градиент **каждого примера обрезают** по норме C (ограничивая чувствительность), затем к сумме градиентов добавляют **гауссов шум** со стандартным отклонением σ·C. Итоговый ε считают accountant'ом (например, RDP) с учётом subsampling и числа шагов."}, {"q": "Чем (ε, δ)-DP отличается от чистой ε-DP и каким должен быть δ?", "a": "δ — вероятность того, что гарантия e^ε не выполнится. Это ослабление позволяет использовать гауссов механизм и даёт лучшую композицию. δ должен быть много меньше 1/n (n — число записей), иначе допустима утечка целой записи."}], "diffusion_models_cheatsheet.html": [{"q": "В чём идея прямого и обратного процесса диффузии?", "a": "Прямой процесс за много шагов постепенно добавляет к изображению гауссов шум, пока не останется чистый шум. Модель учится обратному процессу — шаг за шагом убирать шум, восстанавливая изображение."}, {"q": "Что предсказывает нейросеть в DDPM и какая функция потерь?", "a": "Шум ε, добавленный к изображению на случайном шаге t. Потеря — MSE между настоящим и предсказанным шумом: ‖ε − ε_θ(x_t, t)‖²."}, {"q": "Почему генерация диффузионной моделью медленная и как её ускоряют?", "a": "Нужно много последовательных шагов денойзинга (в DDPM — около 1000), каждый — проход сети. Ускоряют детерминированные сэмплеры (DDIM), продвинутые решатели ОДУ (DPM-Solver), дистилляция в модели с малым числом шагов."}, {"q": "Что такое latent diffusion (Stable Diffusion)?", "a": "Диффузия выполняется не в пространстве пикселей, а в сжатом латентном пространстве предобученного автоэнкодера. Это в разы дешевле, а декодер в конце превращает латентный код в изображение."}, {"q": "Как работает classifier-free guidance?", "a": "Модель обучают и с условием (текстом), и без него, случайно отбрасывая условие. При генерации прогнозы экстраполируют: ε = ε_uncond + w·(ε_cond − ε_uncond). Большой w усиливает соответствие тексту ценой разнообразия."}], "digital_humanities_cheatsheet.html": [{"q": "Чем stylometry полезна для атрибуции авторства и на какие признаки она опирается?", "a": "Она сравнивает «стилистический отпечаток» текстов. Самые надёжные признаки — частоты **служебных слов** и n-грамм символов: автор использует их бессознательно, и они меньше зависят от темы (классика — Burrows' Delta)."}, {"q": "Почему темы, найденные LDA, нельзя принимать как готовый результат?", "a": "LDA выдаёт распределения слов, а смысл темы интерпретирует человек; результат зависит от числа тем, предобработки и случайной инициализации. Нужно проверять устойчивость и читать документы, а не только списки слов."}, {"q": "Какие сложности возникают с OCR исторических текстов?", "a": "Старые шрифты, дореформенная орфография, повреждённые страницы дают много ошибок распознавания. Они искажают частоты слов и NER, поэтому нужна постобработка или модели, обученные на исторических документах (HTR)."}, {"q": "Почему модели, обученные на современных текстах, плохо работают на исторических?", "a": "Меняются лексика, значения слов, орфография и синтаксис (**диахронический сдвиг**). Модели нужно дообучать на текстах эпохи, а сдвиги значений можно изучать сравнением эмбеддингов по периодам."}, {"q": "Какой риск несут оцифрованные архивы как источник данных?", "a": "Оцифровано не всё, а то, что сохранилось и сочтено ценным, — коллекция смещена в пользу определённых авторов, языков и социальных групп. Выводы о «культуре в целом» могут отражать лишь этот отбор."}], "dimensionality_reduction_cheatsheet.html": [{"q": "Зачем снижать размерность, если модель может работать со всеми признаками?", "a": "Из-за «проклятия размерности» в многомерном пространстве данные разрежены, расстояния становятся малоинформативными, растут риск переобучения и вычислительная стоимость. Снижение размерности также убирает шум и избыточность и позволяет визуализировать данные в 2D/3D."}, {"q": "Чем линейные методы (PCA) отличаются от нелинейных (t-SNE, UMAP, Isomap)?", "a": "Линейные ищут проекцию на подпространство и хорошо работают, когда данные лежат близко к гиперплоскости. Нелинейные стремятся сохранить структуру искривлённого многообразия (например, «швейцарского рулета»), которую линейная проекция смешала бы."}, {"q": "Почему t-SNE обычно не используют как шаг предобработки перед моделью?", "a": "В sklearn у `TSNE` нет метода `transform` для новых точек, результат зависит от случайности и гиперпараметров, а расстояния между кластерами на картинке не имеют смысла. Это инструмент визуализации; для предобработки берут PCA, UMAP или автоэнкодер."}, {"q": "Почему перед PCA признаки обычно стандартизируют?", "a": "PCA ищет направления максимальной дисперсии, поэтому признак в больших единицах (например, доход в рублях) доминирует просто из-за масштаба. После стандартизации все признаки вносят сопоставимый вклад."}, {"q": "Как выбрать число компонент для PCA?", "a": "Обычно по доле объяснённой дисперсии — берут столько компонент, чтобы накопленная доля достигла 90–95% (в sklearn можно передать `n_components=0.95`). Также используют «локоть» на графике собственных значений или подбирают число по качеству итоговой модели на кросс-валидации."}], "distributed_training_cheatsheet.html": [{"q": "Чем data parallelism отличается от model parallelism?", "a": "**Data parallelism**: на каждом устройстве полная копия модели, батч делится между устройствами, градиенты усредняются (all-reduce). **Model parallelism**: сама модель разбивается между устройствами — по слоям (pipeline) или внутри слоёв (tensor parallelism); нужен, когда модель не помещается в память одного GPU."}, {"q": "Почему в PyTorch DistributedDataParallel предпочтительнее DataParallel?", "a": "`DataParallel` работает в одном процессе с несколькими потоками, упирается в GIL и собирает выходы и градиенты на одном главном GPU, перегружая его. `DistributedDataParallel` запускает **процесс на каждый GPU**, синхронизирует градиенты через all-reduce с перекрытием вычислений и связи и работает на нескольких машинах."}, {"q": "Что нужно делать с learning rate при увеличении числа GPU в data parallelism?", "a": "Глобальный батч растёт пропорционально числу устройств, поэтому часто применяют **линейное масштабирование LR** (в k раз больший батч — в k раз больший LR) вместе с warmup. При очень больших батчах линейное правило ломается, и используют LARS/LAMB или более консервативное масштабирование."}, {"q": "Как ZeRO / FSDP экономят память при data parallelism?", "a": "В обычном DDP каждый GPU хранит полную копию весов, градиентов и **состояний оптимизатора** (для Adam это ещё два тензора размером с модель). ZeRO и FSDP **шардируют** эти состояния между устройствами и собирают нужные веса по требованию, что позволяет обучать модели, в разы превышающие память одного GPU."}, {"q": "Какая типичная ошибка с данными при распределённом обучении?", "a": "Не использовать `DistributedSampler` (или не вызывать `set_epoch` каждую эпоху) — тогда все процессы видят **одни и те же** примеры или один и тот же порядок перемешивания. Также частые ошибки: логировать и сохранять чекпоинты из всех процессов вместо rank 0 и считать метрики только по части данных одного процесса."}], "domain_adaptation_cheatsheet.html": [{"q": "Что такое domain shift и почему модель на нём деградирует?", "a": "Распределение данных в применении (target) отличается от обучающего (source): другая камера, освещение, синтетические против реальных изображений, другая больница. Модель полагается на признаки, характерные для source, и на target её **ошибка растёт**, хотя задача та же."}, {"q": "Чем unsupervised domain adaptation отличается от обычного fine-tuning?", "a": "При fine-tuning есть **размеченные** данные целевого домена. В unsupervised DA есть только неразмеченные target-данные и размеченные source, и модель учится на source, одновременно выравнивая представления двух доменов."}, {"q": "Как работает DANN и gradient reversal layer?", "a": "К извлекателю признаков добавляется **классификатор домена**, который пытается отличить source от target. Слой обращения градиента умножает градиент от этого классификатора на −λ, поэтому извлекатель признаков учится делать домены **неразличимыми**, а основная голова — решать задачу на source."}, {"q": "Какие ещё подходы к выравниванию доменов существуют помимо адверсариального?", "a": "Минимизация расстояния между распределениями признаков (**MMD**, CORAL — выравнивание ковариаций), перенос стиля изображений (CycleGAN), self-training с псевдометками на target, адаптация статистик BatchNorm под target-домен (AdaBN)."}, {"q": "Почему выравнивание маргинальных распределений признаков может навредить?", "a": "Если в доменах разное **соотношение классов** (label shift), принудительное совмещение распределений признаков сопоставит объекты разных классов. Теория (Ben-David и др.) показывает: ошибка на target ограничена ошибкой на source, расхождением доменов и ошибкой идеального совместного классификатора — малого расхождения недостаточно."}], "dqn_cheatsheet.html": [{"q": "Какую идею Q-learning реализует DQN?", "a": "Q-функция аппроксимируется нейросетью: на вход состояние (например, кадры игры), на выход — Q-значения всех действий. Сеть обучается минимизировать квадрат TD-ошибки."}, {"q": "Зачем нужен experience replay?", "a": "Переходы (s, a, r, s') сохраняются в буфер, а для обучения берутся случайные мини-батчи. Это разрушает корреляцию соседних переходов, стабилизирует обучение и позволяет многократно использовать опыт."}, {"q": "Зачем нужна target network?", "a": "Целевое значение r + γ·max Q(s', a') считается отдельной копией сети, которая обновляется редко (или плавно). Без неё цель «убегает» при каждом обновлении, и обучение становится нестабильным."}, {"q": "Какую проблему решает Double DQN?", "a": "Обычный DQN переоценивает Q-значения из-за максимума по зашумлённым оценкам. Double DQN выбирает лучшее действие онлайн-сетью, а оценивает его target-сетью, разделяя выбор и оценку."}, {"q": "Что такое Dueling DQN?", "a": "Архитектура, где сеть раздельно оценивает ценность состояния V(s) и преимущество действий A(s, a), а затем объединяет их: Q = V + (A − среднее A). Ценность состояния учится быстрее, даже когда выбор действия мало что меняет."}], "dropout_regularization_cheatsheet.html": [{"q": "Почему dropout уменьшает переобучение?", "a": "Случайное выключение нейронов не даёт им коадаптироваться — каждый вынужден быть полезным сам по себе. Также это неявное усреднение ансамбля экспоненциально многих подсетей с общими весами."}, {"q": "Что такое inverted dropout и что происходит на инференсе?", "a": "При обучении оставшиеся активации делятся на (1 − p), где p — вероятность выключения, чтобы матожидание не менялось. На инференсе dropout выключается и масштабирование не нужно; в PyTorch за это отвечает `model.eval()`."}, {"q": "Какая типичная ошибка с dropout при оценке модели?", "a": "Забыть переключить модель в режим eval: тогда предсказания случайны и качество занижено. Исключение — сознательный MC Dropout, где несколько стохастических прогонов дают оценку неопределённости."}, {"q": "Почему dropout плохо сочетается с BatchNorm?", "a": "Dropout меняет дисперсию активаций между обучением и инференсом, а BatchNorm на инференсе использует накопленную при обучении статистику — возникает сдвиг дисперсии. Обычно dropout ставят после последнего BN или вовсе обходятся без него в свёрточной части."}, {"q": "Какие ещё методы регуляризации нейросетей используют кроме dropout?", "a": "Weight decay (L2), аугментация данных, ранняя остановка, label smoothing, DropConnect, stochastic depth, mixup/cutmix. Выбор зависит от архитектуры: для CNN основной инструмент — аугментации и weight decay."}], "dynamic_programming_rl_cheatsheet.html": [{"q": "Что нужно знать о среде, чтобы применять DP-методы?", "a": "Полную модель: переходные вероятности P(s′|s, a) и награды R. Именно поэтому DP относится к planning, а не к обучению из опыта, и неприменимо напрямую, когда модель неизвестна."}, {"q": "Чем policy iteration отличается от value iteration?", "a": "**Policy iteration** чередует полную оценку политики (до сходимости V^π) и жадное улучшение; итераций мало, но каждая дорогая. **Value iteration** делает один шаг Беллмана с max на каждой итерации — фактически усечённая оценка, итерации дешёвые, но их больше."}, {"q": "Почему итерационная оценка политики сходится?", "a": "Оператор Беллмана при γ < 1 является **сжимающим** отображением в sup-норме с коэффициентом γ, поэтому по теореме Банаха у него единственная неподвижная точка и итерации к ней сходятся."}, {"q": "Что такое «проклятие размерности» для DP?", "a": "Каждая итерация перебирает все состояния и действия, а число состояний растёт экспоненциально с числом переменных состояния. Поэтому точное DP применимо только для небольших MDP."}, {"q": "Что такое generalized policy iteration?", "a": "Общая схема, в которой оценка политики и её улучшение взаимодействуют с любой степенью полноты и в любом порядке. Почти все методы RL (MC, TD, actor-critic) — разновидности GPI."}], "early_late_fusion_cheatsheet.html": [{"q": "Чем early fusion отличается от late fusion?", "a": "**Early fusion** объединяет признаки модальностей (например, конкатенацией) до обучения одной общей модели. **Late fusion** обучает отдельную модель на каждой модальности и объединяет их прогнозы (усреднением, голосованием, стекингом)."}, {"q": "Когда early fusion выигрывает?", "a": "Когда важны взаимодействия между модальностями на уровне признаков (например, синхронные движение губ и звук) и данных достаточно, чтобы выучить совместное представление. Модель видит все признаки сразу и может найти межмодальные зависимости."}, {"q": "Почему late fusion удобнее, когда одна из модальностей может отсутствовать?", "a": "Модели модальностей независимы, и при отсутствии одной из них можно объединить прогнозы оставшихся. В early fusion пропуск целого блока признаков ломает вход единой модели, и нужна импутация или специальное обучение с выпадением модальностей."}, {"q": "Какие проблемы возникают при простой конкатенации признаков разных модальностей?", "a": "Разные масштабы и размерности: например, 2048-мерный вектор изображения «задавит» 10 табличных признаков. Модальности могут быть рассинхронизированы по времени. Помогают нормализация, понижение размерности каждой модальности и проекции в общее пространство."}, {"q": "Что такое промежуточное (hybrid) слияние?", "a": "Модальности сначала обрабатываются отдельными энкодерами, а объединяются на уровне скрытых представлений (конкатенация эмбеддингов, cross-attention) с последующим совместным обучением. Это компромисс между учётом взаимодействий и гибкостью."}], "early_stopping_cheatsheet.html": [{"q": "Почему ранняя остановка работает как регуляризация?", "a": "Она ограничивает число шагов оптимизации, а значит и то, насколько далеко веса уходят от инициализации; для линейных моделей это примерно эквивалентно L2-регуляризации. Модель останавливается до того, как начнёт подгоняться под шум."}, {"q": "Что такое patience и зачем восстанавливать лучшие веса?", "a": "**Patience** — сколько эпох ждать улучшения валидационной метрики, прежде чем остановиться; это защищает от шумных колебаний. К моменту остановки модель уже хуже лучшей на patience эпох, поэтому нужно вернуть сохранённые лучшие веса (в Keras `restore_best_weights=True`)."}, {"q": "Что показывают кривые обучения, если train loss падает, а val loss растёт?", "a": "Переобучение: модель запоминает обучающую выборку. Помогают остановка в точке минимума val loss, регуляризация, аугментация или больше данных."}, {"q": "Как по кривым распознать недообучение?", "a": "Train и val loss оба высокие и близки друг к другу, часто ещё продолжают снижаться. Нужно учить дольше, увеличить ёмкость модели или learning rate."}, {"q": "Почему нельзя делать early stopping по тестовой выборке?", "a": "Выбор момента остановки — это подбор гиперпараметра, и оценка на этой выборке становится оптимистично смещённой. Для остановки нужна отдельная валидационная выборка, а тест используется один раз в конце."}], "efficient_transformers_cheatsheet.html": [{"q": "Почему стандартное внимание дорого для длинных последовательностей?", "a": "Матрица QKᵀ имеет размер n×n, поэтому время и память растут как O(n²). При удвоении контекста стоимость внимания растёт в 4 раза."}, {"q": "Как FlashAttention ускоряет внимание, не меняя результат?", "a": "Он считает внимание блоками (tiling) в быстрой SRAM GPU с онлайн-softmax и не материализует матрицу n×n в медленной HBM. Это точное внимание: FLOPs те же, но память O(n) и намного меньше обращений к памяти."}, {"q": "Чем разреженное внимание отличается от линейного?", "a": "**Разреженное** (Longformer, BigBird) считает внимание только для части пар: локальное окно, глобальные токены, случайные связи. **Линейное** (Performer, Linear Transformer) аппроксимирует softmax ядром, чтобы считать φ(Q)(φ(K)ᵀV) за O(n). Оба — приближения полного внимания."}, {"q": "Что такое KV-cache и почему он ограничивает инференс?", "a": "При авторегрессивной генерации ключи и значения прошлых токенов кэшируются, чтобы не пересчитывать их. Его объём растёт линейно с длиной контекста, числом слоёв и голов и часто становится главным потребителем памяти; MQA/GQA уменьшают его, разделяя K и V между головами."}, {"q": "Почему приближённые методы внимания не вытеснили полное?", "a": "Они часто проигрывают в качестве, особенно на задачах, требующих точного извлечения из далёкого контекста, а реальное ускорение заметно лишь при очень больших n. FlashAttention сделал точное внимание достаточно быстрым для большинства практических длин."}], "elliptic_envelope_cheatsheet.html": [{"q": "Какое предположение о данных делает Elliptic Envelope?", "a": "Что нормальные данные распределены приблизительно по **многомерному гауссовскому** закону. Модель оценивает центр и ковариационную матрицу и считает аномальными точки с большим расстоянием Махаланобиса — граница нормы имеет форму эллипсоида."}, {"q": "Почему используется робастная оценка ковариации (MCD), а не обычная?", "a": "Выбросы сильно искажают выборочные среднее и ковариацию, «растягивая» эллипс в свою сторону, и сами перестают выделяться (маскировка). **Minimum Covariance Determinant** оценивает параметры по подмножеству точек с минимальным определителем ковариации, игнорируя выбросы."}, {"q": "Чем расстояние Махаланобиса лучше евклидова для поиска аномалий?", "a": "Оно учитывает масштаб признаков и корреляции между ними: d² = (x − μ)ᵀΣ⁻¹(x − μ). Точка может быть близка к центру по евклидову расстоянию, но лежать поперёк направления корреляции — Махаланобис покажет её как выброс."}, {"q": "Когда Elliptic Envelope работает плохо?", "a": "При многомодальных данных (несколько кластеров), сильно скошенных или нелинейно связанных признаках — один эллипс не описывает такую форму. Также при высокой размерности (особенно когда признаков сравнимо с объектами) оценка ковариации становится неустойчивой."}, {"q": "Как можно задать порог аномальности статистически?", "a": "Для гауссовских данных квадрат расстояния Махаланобиса распределён по **χ²** с p степенями свободы (p — число признаков). Например, точки с d² выше 97.5-го перцентиля χ²(p) можно считать выбросами; в sklearn порог задаётся через `contamination`."}], "em_algorithm_cheatsheet.html": [{"q": "Почему EM удобнее прямой максимизации правдоподобия в моделях со скрытыми переменными?", "a": "log p(x|θ) = log ∑_z p(x, z|θ) содержит сумму под логарифмом, и производные не дают замкнутых формул. Если бы z были известны, полное правдоподобие разделилось бы на простые слагаемые. EM подставляет вместо неизвестных z их **ожидание** при текущих параметрах."}, {"q": "Почему правдоподобие на итерациях EM не убывает?", "a": "E-шаг строит нижнюю оценку (ELBO), которая касается log p(x|θ) в текущей точке; M-шаг максимизирует эту оценку по θ. Новое значение правдоподобия ≥ оценки ≥ старого значения."}, {"q": "Как выбрать число компонент в смеси гауссиан, если EM этого не делает?", "a": "Правдоподобие растёт с числом компонент, поэтому сравнивают модели по **BIC** или AIC, которые штрафуют за число параметров (в sklearn `gm.bic(X)`), или используют `BayesianGaussianMixture`, который «выключает» лишние компоненты."}, {"q": "Когда останавливать EM?", "a": "Когда прирост log-правдоподобия меньше порога (`tol`) или достигнуто максимальное число итераций. Сходимость может быть медленной, особенно когда компоненты сильно перекрываются."}, {"q": "Почему результат EM зависит от инициализации и что с этим делать?", "a": "Функция правдоподобия многоэкстремальна, и EM сходится к ближайшему локальному максимуму. Делают несколько запусков (`n_init`) с разными стартами, часто инициализируют через k-means, и выбирают результат с наибольшим правдоподобием."}], "encoder_decoder_cheatsheet.html": [{"q": "Зачем нужна архитектура encoder-decoder?", "a": "Для задач, где вход и выход — последовательности разной длины (перевод, суммаризация, распознавание речи). Энкодер строит представление входа, декодер генерирует выход по нему шаг за шагом."}, {"q": "В чём проблема «бутылочного горлышка» классического seq2seq?", "a": "Вся входная последовательность сжимается в один вектор фиксированного размера, и для длинных входов информация теряется — качество падает с длиной. Решение — механизм внимания, который даёт декодеру доступ ко всем состояниям энкодера."}, {"q": "Что такое teacher forcing и какую проблему он создаёт?", "a": "При обучении декодер получает на вход истинный предыдущий токен, а не свой прогноз, что ускоряет и стабилизирует обучение. Но на инференсе он видит свои ошибки, которых не видел при обучении (**exposure bias**); помогает scheduled sampling."}, {"q": "Чем beam search лучше жадного декодирования?", "a": "Жадное декодирование берёт на каждом шаге самый вероятный токен и может пропустить последовательность с большей общей вероятностью. Beam search держит k лучших гипотез, находя более вероятные выходы ценой k-кратных вычислений."}, {"q": "Как encoder-decoder реализован в трансформерах?", "a": "Энкодер — стек слоёв self-attention, декодер — masked self-attention плюс **cross-attention**, где запросы из декодера, а ключи и значения из выхода энкодера. Примеры — оригинальный Transformer, T5, BART."}], "ensemble_diversification_cheatsheet.html": [{"q": "Почему разнообразие моделей важнее, чем их количество?", "a": "Дисперсия среднего B моделей равна ρσ² + (1 − ρ)σ²/B: при росте B второе слагаемое исчезает, а первое, зависящее от корреляции ошибок ρ, остаётся. Добавление ещё одной похожей модели почти ничего не даёт, а слабо коррелированной — снижает ошибку."}, {"q": "Какими способами можно сделать модели ансамбля разнообразными?", "a": "Разными подвыборками данных (бутстреп, подвыборка), подмножествами признаков (random subspaces), разными алгоритмами (деревья, линейные, kNN, нейросети), гиперпараметрами и random seed, разными предобработками и целевыми функциями."}, {"q": "Как измерить разнообразие моделей на практике?", "a": "Посчитать корреляцию их out-of-fold предсказаний или ошибок, долю расхождений в предсказанных классах (disagreement), Q-статистику Юла. Высокая корреляция (например, > 0.95) говорит, что модель почти ничего не добавит в ансамбль."}, {"q": "В чём компромисс между разнообразием и точностью?", "a": "Сильно отличающуюся модель легко получить, сделав её плохой — например, случайной. Ошибка ансамбля = средняя ошибка моделей − их разнообразие (ambiguity decomposition для регрессии), поэтому нужны модели, которые точны по отдельности и при этом ошибаются по-разному."}, {"q": "Почему разные random seed одной нейросети дают полезное разнообразие, а одного случайного леса — почти нет?", "a": "Нейросети сходятся к разным локальным минимумам, и их ошибки заметно различаются — отсюда эффективность глубоких ансамблей. Случайный лес с большим числом деревьев уже усредняет случайность, и леса с разными seed дают почти одинаковые предсказания."}], "ensemble_methods_cheatsheet.html": [{"q": "Почему ансамбль может быть лучше каждой входящей в него модели?", "a": "Если модели ошибаются по-разному (их ошибки слабо коррелированы), при объединении ошибки частично компенсируются. Ансамбль из одинаковых или сильно коррелированных моделей почти ничего не даёт — важно разнообразие."}, {"q": "Чем hard voting отличается от soft voting?", "a": "Hard voting выбирает класс большинством голосов, soft voting усредняет предсказанные вероятности. Soft voting обычно точнее, потому что учитывает уверенность моделей, но требует адекватных `predict_proba`."}, {"q": "Чем stacking отличается от voting?", "a": "В voting способ объединения фиксирован (равные или заданные вручную веса), а в stacking мета-модель **обучается** комбинировать предсказания базовых моделей и может учесть, какая модель где сильнее."}, {"q": "Почему мета-модель в stacking обучают на out-of-fold предсказаниях?", "a": "Предсказания базовых моделей на их же обучающих данных переоптимистичны, и мета-модель научится слепо доверять самой переобученной. Out-of-fold предсказания (через кросс-валидацию) имитируют поведение на новых данных; `StackingClassifier` в sklearn делает это автоматически."}, {"q": "Почему в качестве мета-модели часто берут простую модель, например логистическую регрессию?", "a": "Мета-признаков мало, и они сильно коррелированы, поэтому сложная мета-модель легко переобучается. Простой линейной модели с регуляризацией обычно достаточно, чтобы подобрать веса базовых моделей."}], "ensemble_methods_streaming_cheatsheet.html": [{"q": "Как online bagging имитирует bootstrap без хранения данных?", "a": "В bootstrap число копий примера в выборке при большом n приближённо распределено по Poisson(1). Online bagging (Oza и Russell) для каждой модели и каждого примера сэмплирует k ~ Poisson(1) и обучает модель на примере k раз (или с весом k)."}, {"q": "Чем Leveraging Bagging отличается от обычного online bagging?", "a": "Использует Poisson(λ) с λ > 1 (обычно 6), что увеличивает разнообразие моделей и вес примеров, а также добавляет детектор дрейфа ADWIN для замены худших моделей."}, {"q": "Как Adaptive Random Forest реагирует на concept drift?", "a": "Для каждого дерева работают детекторы: при «предупреждении» начинает обучаться фоновое дерево, при подтверждённом дрейфе оно заменяет старое. Разнообразие обеспечивают случайные подмножества признаков в узлах и Poisson-перевзвешивание примеров."}, {"q": "Почему ансамбли особенно полезны в потоковых данных с дрейфом?", "a": "Модели разного «возраста» помнят разные периоды, и можно быстро переключать веса или заменять отдельные модели, не перестраивая весь ансамбль. Это сглаживает переходы и даёт устойчивость к шуму."}, {"q": "Как в ансамблях для потоков обычно взвешивают модели?", "a": "По недавней точности: например, Dynamic Weighted Majority уменьшает вес модели при ошибке (умножением на β < 1), удаляет модели с малым весом и добавляет новые при ошибке всего ансамбля. Так старые неактуальные модели быстро теряют влияние."}], "ensemble_methods_voting_stacking_cheatsheet.html": [{"q": "Чем hard voting отличается от soft voting?", "a": "Hard voting выбирает класс большинством голосов моделей, soft voting усредняет предсказанные вероятности и берёт argmax. Soft обычно лучше, так как учитывает уверенность, но требует калиброванных вероятностей (`predict_proba`)."}, {"q": "Почему ансамбль из сильно коррелированных моделей почти не улучшает качество?", "a": "Ансамбль выигрывает, когда ошибки моделей **различаются** и взаимно компенсируются. Если модели ошибаются на одних и тех же объектах, голосование повторяет эти ошибки, поэтому комбинируют разные алгоритмы или признаки."}, {"q": "Как правильно обучать мета-модель в stacking и почему?", "a": "Мета-модель учится на **out-of-fold** предсказаниях базовых моделей, полученных кросс-валидацией. Если использовать предсказания на тех же данных, на которых базовые модели обучались, они будут переобученно точными, и мета-модель научится им слепо доверять."}, {"q": "Почему мета-модель в stacking обычно выбирают простой?", "a": "Её входы — небольшое число сильно коррелированных предсказаний, и сложная мета-модель легко переобучается. Часто достаточно логистической или линейной регрессии с регуляризацией."}, {"q": "Три независимых классификатора имеют точность 0.7 каждый. Какова точность hard voting большинством?", "a": "Ансамбль прав, если правы хотя бы двое: 3·0.7²·0.3 + 0.7³ = 0.441 + 0.343 = **0.784**. На практике выигрыш меньше, потому что ошибки моделей не независимы."}], "ensemble_tuning_cheatsheet.html": [{"q": "Почему для бэггинга и бустинга нужны разные базовые модели?", "a": "Бэггинг снижает **дисперсию**, поэтому ему подходят глубокие, переобученные деревья с низким смещением. Бустинг снижает **смещение**, поэтому ему нужны неглубокие «слабые» деревья, а мощные базовые модели быстро приводят к переобучению."}, {"q": "Почему увеличение числа деревьев в случайном лесе не приводит к переобучению, а в бустинге — приводит?", "a": "В лесе деревья независимы и усредняются: с ростом их числа ошибка выходит на плато. В бустинге каждое следующее дерево подгоняется под остатки, и после некоторого момента модель начинает учить шум, поэтому нужна ранняя остановка."}, {"q": "Как использовать OOB-оценку при настройке случайного леса?", "a": "Каждое дерево не видит около 37% объектов, и предсказания по ним дают оценку качества без отдельной валидации (`oob_score=True`). Это быстро и экономит данные, но для финального сравнения моделей и при наличии групп или времени в данных лучше использовать честную CV."}, {"q": "Какая ошибка утечки типична при настройке стекинга?", "a": "Обучать метамодель на предсказаниях базовых моделей по тем же данным, на которых они обучены: эти предсказания слишком оптимистичны, и ме

оиск** в хорошо спроектированном пространстве часто даёт результаты, сравнимые со сложными методами: значительная часть успеха объясняется самим пространством поиска и протоколом обучения, а не стратегией. Поэтому без такого бейзлайна и одинаковых условий обучения сравнения некорректны."}], "neural_architecture_patterns_cheatsheet.html": [{"q": "Зачем нужны residual-связи?", "a": "Блок учит поправку F(x), а выход x + F(x) пропускает градиент напрямую через тождественный путь. Это решает проблему деградации очень глубоких сетей и облегчает оптимизацию."}, {"q": "Что такое bottleneck-блок и зачем он нужен?", "a": "Последовательность 1×1 (сжатие каналов) → 3×3 → 1×1 (расширение). Дорогая свёртка 3×3 работает на малом числе каналов, что позволяет строить глубокие сети при умеренных вычислениях."}, {"q": "Чем inverted residual отличается от обычного bottleneck?", "a": "В MobileNetV2 сначала **расширяют** каналы, применяют depthwise 3×3, затем сжимают линейной проекцией без активации; skip-связь соединяет узкие представления. Это экономно для мобильных устройств."}, {"q": "Почему для downsampling часто используют stride-свёртку вместо пулинга?", "a": "Свёртка со stride 2 обучаема и сама решает, какую информацию сохранить при уменьшении разрешения, а max pooling выбрасывает всё, кроме максимума. Обычно при уменьшении разрешения увеличивают число каналов."}, {"q": "Чем pre-activation порядок (BN → ReLU → Conv) лучше post-activation?", "a": "В pre-activation ResNet тождественный путь остаётся «чистым», без нелинейностей после сложения, поэтому сигнал и градиент проходят по нему без искажений. Это улучшает обучение очень глубоких сетей."}], "neural_network_serialization_cheatsheet.html": [{"q": "Чем в PyTorch сохранение state_dict отличается от сохранения всей модели через torch.save(model)?", "a": "`state_dict` — это словарь тензоров весов; для загрузки нужен код класса модели, но формат устойчив к рефакторингу. Сохранение всей модели использует pickle и привязано к путям классов и модулей: при переименовании или переносе кода загрузка ломается."}, {"q": "Почему загрузка pickle-файлов модели из непроверенных источников опасна?", "a": "Pickle при десериализации может выполнить произвольный код. Поэтому появился формат **safetensors**, хранящий только тензоры, а в новых версиях PyTorch `torch.load` по умолчанию использует `weights_only=True`."}, {"q": "Что нужно сохранять в чекпоинте, чтобы продолжить обучение, а не только сделать инференс?", "a": "Кроме весов — состояние оптимизатора (моменты Adam), scheduler, номер эпохи/шага, состояние GradScaler при AMP и генераторов случайных чисел. Без состояния оптимизатора обучение продолжится с «холодного» старта и может скакнуть по лоссу."}, {"q": "Зачем экспортировать модель в TorchScript, ONNX или SavedModel, если есть state_dict?", "a": "Эти форматы сохраняют **граф вычислений** вместе с весами, поэтому модель можно запустить без исходного Python-кода — в C++, на мобильных устройствах или в inference-серверах, с оптимизациями."}, {"q": "Какая типичная ошибка возникает при загрузке state_dict после обучения через DataParallel?", "a": "Ключи получают префикс `module.`, и загрузка в обычную модель падает с ошибкой несовпадения ключей. Решение — сохранять `model.module.state_dict()` или удалить префикс из ключей перед загрузкой."}], "neural_network_training_dynamics_cheatsheet.html": [{"q": "Почему градиенты затухают или взрываются в глубоких сетях?", "a": "Градиент — произведение якобианов по слоям: если их нормы систематически меньше 1, градиент экспоненциально затухает, если больше 1 — взрывается. Помогают правильная инициализация (**Xavier**, **He**), нормализация, residual-связи и gradient clipping."}, {"q": "Почему важен learning rate warmup, особенно для трансформеров и Adam?", "a": "В начале обучения оценки моментов Adam неточны, а веса и статистики далеки от разумных, и большой lr вызывает нестабильность. Плавное увеличение lr первые шаги стабилизирует обучение."}, {"q": "Что такое «edge of stability»?", "a": "Наблюдение, что при полном градиентном спуске наибольшее собственное значение гессиана (резкость) растёт до 2/η и колеблется около этого уровня, а лосс при этом всё равно убывает немонотонно. Это противоречит классической теории, требующей резкость меньше 2/η."}, {"q": "Как размер батча влияет на динамику обучения?", "a": "Маленький батч даёт шумные градиенты, которые работают как регуляризация и помогают найти более плоские минимумы. Большой батч ускоряет эпоху, но требует увеличения lr (правило линейного масштабирования, warmup), иначе качество может падать."}, {"q": "Что такое grokking?", "a": "Явление, когда модель долго переобучена (train-лосс ~0, test-лосс высокий), а затем, при продолжении обучения с регуляризацией вроде weight decay, внезапно начинает обобщать. Показывает, что ранняя остановка по валидации может отрезать такое обобщение."}], "neural_networks_astronomy_cheatsheet.html": [{"q": "Почему ML стал необходим в современной астрономии?", "a": "Обзоры (например, Rubin Observatory/LSST) дают терабайты данных за ночь и миллионы транзиентных событий — вручную их не обработать. Нейросети классифицируют объекты, отбирают кандидатов и оценивают параметры в реальном времени."}, {"q": "Как получают размеченные данные для классификации галактик и в чём их слабость?", "a": "Часто — через гражданскую науку (**Galaxy Zoo**), где морфологию размечают добровольцы, либо через симуляции. Метки шумные и субъективные, а симуляции отличаются от реальных снимков (**sim-to-real gap**)."}, {"q": "Почему при поиске экзопланет транзитным методом опасно ориентироваться на accuracy?", "a": "Настоящих транзитов очень мало по сравнению с ложными сигналами (затменные двойные, шум прибора). Нужны precision/recall и проверка кандидатов, иначе модель либо пропускает планеты, либо выдаёт массу ложных срабатываний."}, {"q": "Какие аугментации естественны для астрономических изображений и почему?", "a": "Повороты и отражения: у галактики на небе нет выделенной ориентации, поэтому метка не меняется. А вот изменение цвета нужно делать осторожно — цвет несёт физическую информацию (звёздное население, красное смещение)."}, {"q": "Что такое оценка фотометрического красного смещения (photo-z) с помощью ML?", "a": "Это регрессия красного смещения по яркостям в нескольких фильтрах вместо дорогой спектроскопии. Модель обучают на объектах со спектральным z; важно выдавать распределение, а не одну точку, так как ошибки бывают катастрофическими."}], "neural_networks_biology_cheatsheet.html": [{"q": "Что предсказывает AlphaFold2 и на какую информацию он опирается?", "a": "Он предсказывает 3D-структуру белка по аминокислотной последовательности, используя **множественное выравнивание (MSA)** гомологов и шаблоны. Блок Evoformer извлекает коэволюционные связи между остатками, structure module строит координаты атомов."}, {"q": "Почему уверенное предсказание структуры не равно пониманию функции белка?", "a": "AlphaFold выдаёт статичную структуру и оценку уверенности (pLDDT), но не динамику, взаимодействия с лигандами и эффекты мутаций в полной мере. Неупорядоченные участки предсказываются с низкой уверенностью, а функцию нужно проверять экспериментально."}, {"q": "Как DeepVariant превращает variant calling в задачу компьютерного зрения?", "a": "Выровненные риды вокруг кандидатного варианта кодируются как многоканальное **изображение** (основания, качество, цепь и т.п.), а CNN классифицирует генотип: гомозигота по референсу, гетерозигота или гомозигота по альтернативному аллелю."}, {"q": "Какая типичная утечка данных возникает при оценке моделей на белковых последовательностях?", "a": "Гомологичные белки с высокой идентичностью последовательностей попадают в train и test. Нужно кластеризовать по идентичности (например, порог 30%) и разбивать **по кластерам**, иначе качество сильно завышено."}, {"q": "Зачем в single-cell данных нужна коррекция batch-эффектов?", "a": "Технические различия между партиями (протокол, день, прибор) могут быть сильнее биологических, и клетки кластеризуются «по партии». Методы интеграции (например, scVI, Harmony) убирают этот сдвиг, сохраняя биологический сигнал."}], "neural_networks_chemistry_cheatsheet.html": [{"q": "Чем различаются представления молекулы SMILES, граф и fingerprint?", "a": "**SMILES** — строка, удобна для языковых моделей, но одна молекула имеет много записей. **Граф** (атомы — узлы, связи — рёбра) естественен для GNN. **Fingerprint** (например, ECFP) — фиксированный бинарный вектор подструктур для классических моделей вроде RF."}, {"q": "Почему для молекул часто используют GNN с 3D-координатами (SchNet, DimeNet)?", "a": "Многие свойства (энергия, силы) зависят от геометрии, а не только от топологии связей. Такие сети используют расстояния и углы и инвариантны к поворотам и сдвигам молекулы, поэтому предсказания физически согласованы."}, {"q": "Почему случайное разбиение train/test для молекулярных данных даёт завышенную оценку качества?", "a": "Похожие молекулы (с общим каркасом) попадают и в train, и в test, и модель фактически «узнаёт» их. Честнее **scaffold split** — разбиение по молекулярному каркасу, имитирующее предсказание для новых химических классов."}, {"q": "Чем forward reaction prediction отличается от retrosynthesis?", "a": "Forward prediction: реагенты → продукт, обычно один правильный ответ. Retrosynthesis: продукт → возможные реагенты, задача **многозначна** и требует поиска по дереву шагов, поэтому её оценивают top-k точностью и выполнимостью маршрута."}, {"q": "Что такое ADMET и почему его предсказывают на ранних этапах drug discovery?", "a": "ADMET — всасывание, распределение, метаболизм, выведение и токсичность. Многие кандидаты отсеиваются именно из-за этих свойств, поэтому ранний **in silico** фильтр экономит дорогие синтезы и испытания."}], "neural_networks_medicine_cheatsheet.html": [{"q": "Почему для медицинской диагностики accuracy — плохая главная метрика?", "a": "Болезни редки, и модель, всегда говорящая «здоров», получит высокую accuracy. Важнее **sensitivity** (не пропустить больного), specificity, PR-AUC и калибровка вероятностей, а порог выбирается исходя из клинической цены ошибок."}, {"q": "Что такое shortcut learning в медицинских изображениях?", "a": "Модель учится на побочных признаках: маркировке аппарата, метках на снимке, типе больницы, а не на патологии. На внутреннем тесте качество высокое, а при переносе в другую клинику резко падает."}, {"q": "Почему разбивать медицинские данные нужно по пациентам, а не по снимкам?", "a": "У одного пациента бывает много похожих снимков. Если они попадут и в train, и в test, модель запомнит пациента, и оценка будет завышена — это **утечка данных**."}, {"q": "Зачем нужна внешняя валидация модели?", "a": "Данные другой больницы отличаются оборудованием, протоколами и популяцией (**distribution shift**). Только проверка на независимом внешнем наборе показывает, насколько модель обобщается в реальной практике."}, {"q": "Почему в медицине важна калибровка вероятностей, а не только ранжирование?", "a": "Врач принимает решение по величине риска: «риск 30%» должно означать, что примерно у 30% таких пациентов событие происходит. Модель с высоким AUC может быть плохо калибрована, и её вероятности вводят в заблуждение."}], "neural_networks_physics_cheatsheet.html": [{"q": "Как устроена функция потерь в PINN (Physics-Informed Neural Network)?", "a": "Loss = **data loss** (ошибка на измеренных точках) + **physics loss** (невязка дифференциального уравнения, посчитанная автодифференцированием в коллокационных точках) + слагаемые для граничных и начальных условий. Так сеть обучается решению PDE даже при малом числе наблюдений."}, {"q": "Почему PINN могут плохо обучаться, хотя уравнение задано точно?", "a": "Слагаемые потерь имеют разный масштаб и конкурируют, градиенты physics loss плохо обусловлены, а сети склонны к **spectral bias** — плохо выучивают высокочастотные и жёсткие (stiff) решения. Помогают взвешивание слагаемых, адаптивный выбор точек и обезразмеривание уравнений."}, {"q": "Чем symbolic regression отличается от обычной нейросетевой регрессии?", "a": "Symbolic regression ищет **явную формулу** из элементарных операций (например, через генетическое программирование или PySR), а не набор весов. Результат интерпретируем, проверяем на размерность и часто лучше экстраполирует — поэтому его используют для «открытия» физических законов."}, {"q": "Зачем встраивать в модель физические симметрии (инвариантность, эквивариантность)?", "a": "Если ответ не должен меняться при сдвиге, повороте или перестановке частиц, архитектура с этой симметрией (например, E(3)-эквивариантные GNN) не тратит данные на её выучивание. Это повышает **data efficiency** и даёт физически согласованные предсказания вне обучающего диапазона."}, {"q": "Какой главный риск при использовании нейросетевого суррогата вместо численного симулятора?", "a": "Суррогат быстр, но надёжен только в области обучающих данных: при **экстраполяции** он может давать правдоподобные, но физически неверные ответы (нарушать законы сохранения). Поэтому нужны оценка неопределённости и выборочная проверка точным солвером."}], "neural_odes_cheatsheet.html": [{"q": "Как связаны ResNet и Neural ODE?", "a": "Residual-блок h_{t+1} = h_t + f(h_t) — это шаг метода Эйлера для ОДУ dh/dt = f(h, t). Neural ODE переходит к непрерывному пределу: скрытое состояние эволюционирует по ОДУ, правая часть которого — нейросеть, а выход получают решателем ОДУ."}, {"q": "Зачем нужен adjoint-метод при обучении Neural ODE?", "a": "Он вычисляет градиенты решением сопряжённого ОДУ назад по времени, не храня промежуточные состояния, — память O(1) по числу шагов решателя. Цена — дополнительные вычисления и возможные численные ошибки при обратном интегрировании."}, {"q": "Почему Neural ODE удобны для нерегулярных временных рядов?", "a": "Состояние определено в любой момент непрерывного времени, поэтому можно получить его в произвольные моменты наблюдений без ресемплинга на равномерную сетку. На этом основаны **Latent ODE** и ODE-RNN."}, {"q": "Какое ограничение выразительности есть у Neural ODE?", "a": "Траектории ОДУ не пересекаются, поэтому отображение — гомеоморфизм, и некоторые функции (например, разделить вложенные кольца в той же размерности) представить нельзя. **Augmented Neural ODE** добавляет дополнительные измерения состояния."}, {"q": "Почему обучение Neural ODE может становиться всё медленнее?", "a": "При адаптивном решателе число вычислений правой части (NFE) растёт, если динамика становится жёсткой и сложной. Помогают регуляризация гладкости траекторий и ограничение допусков решателя."}], "neural_style_transfer_cheatsheet.html": [{"q": "В чём идея переноса стиля по Gatys?", "a": "Оптимизируется само изображение (не веса сети): оно должно совпадать с изображением-содержанием по глубоким признакам предобученной CNN (обычно VGG) и с изображением-стилем — по статистикам признаков нескольких слоёв."}, {"q": "Что такое матрица Грама и почему она описывает стиль?", "a": "G = FFᵀ — попарные корреляции между каналами карты признаков, усреднённые по всем позициям. Она отражает, какие текстуры и цвета встречаются вместе, но теряет информацию о том, где именно, — это и есть стиль без содержания."}, {"q": "Почему content loss берут с глубоких слоёв?", "a": "Глубокие слои кодируют объекты и их расположение, но не точные пиксели. Совпадение по ним сохраняет структуру сцены, оставляя свободу для изменения текстуры."}, {"q": "Чем быстрый перенос стиля (Johnson et al.) отличается от исходного метода?", "a": "Вместо долгой оптимизации каждого изображения обучается отдельная сеть-преобразователь, которая переносит один стиль за один прямой проход — в реальном времени. Обучается она с теми же perceptual losses."}, {"q": "Как AdaIN позволяет переносить произвольный стиль одной моделью?", "a": "Adaptive Instance Normalization выравнивает среднее и стандартное отклонение каждого канала признаков содержания под статистики признаков стиля. Стиль задаётся на лету, переобучать модель под каждый стиль не нужно."}], "neural_tangent_kernel_cheatsheet.html": [{"q": "Что такое Neural Tangent Kernel?", "a": "Ядро Θ(x, x') = ⟨∇_θ f(x), ∇_θ f(x')⟩ — скалярное произведение градиентов выхода сети по параметрам для двух входов. Оно описывает, как шаг градиентного спуска по одному примеру меняет предсказание на другом."}, {"q": "Что происходит с NTK при ширине сети → ∞?", "a": "При подходящей параметризации ядро становится детерминированным при инициализации и почти не меняется во время обучения. Тогда обучение сети градиентным спуском эквивалентно **ядерной регрессии** с этим ядром, а динамика линейна."}, {"q": "Что означает «lazy training» и почему это ограничение теории NTK?", "a": "В режиме NTK веса почти не отходят от инициализации, сеть ведёт себя как линеаризованная модель и не учит новых признаков. Реальные конечные сети в **feature learning**-режиме меняют представления и часто работают лучше, чем соответствующее NTK."}, {"q": "Почему NTK помогает объяснить, что сильно переопределённые сети достигают нулевой ошибки на обучении?", "a": "Если ядро на обучающей выборке положительно определено (минимальное собственное значение > 0), градиентный спуск линейно сходится к глобальному минимуму квадратичной потери. Это дало доказательства сходимости для широких сетей."}, {"q": "Как спектр NTK связан со «спектральным смещением» сетей?", "a": "Направления, соответствующие большим собственным значениям ядра (обычно низкочастотные функции), обучаются быстрее. Поэтому сети сначала выучивают гладкие, низкочастотные компоненты, а высокочастотные детали — позже."}], "neuro_symbolic_ai_systems_cheatsheet.html": [{"q": "Какие слабости нейросетей и символьного ИИ компенсирует нейро-символьный подход?", "a": "Нейросети хорошо учатся на сырых шумных данных, но плохо интерпретируемы и слабы в строгой логике. Символьные системы точны, объяснимы и работают с малым числом данных, но хрупки к шуму и требуют ручных правил. Гибрид пытается взять сильные стороны обоих."}, {"q": "Как может выглядеть типичная архитектура «восприятие — рассуждение»?", "a": "Нейросеть переводит сырые данные (изображение, текст) в символы — объекты, атрибуты, отношения, а символьный модуль выполняет над ними логический вывод или программу. Так устроены, например, системы визуального вопросно-ответного рассуждения вроде NS-VQA."}, {"q": "Почему сложно обучать такую систему end-to-end?", "a": "Символьные операции дискретны и недифференцируемы, поэтому градиент не проходит через модуль рассуждения. Решения: дифференцируемые релаксации логики, обучение с подкреплением, или раздельное обучение компонентов."}, {"q": "Чем знания в виде правил помогают при малых данных?", "a": "Правила задают сильный **inductive bias** — модели не нужно выучивать уже известные закономерности из примеров. Это улучшает обобщение и позволяет гарантировать соблюдение ограничений (например, в медицине или праве)."}, {"q": "Что такое «symbol grounding problem»?", "a": "Вопрос, как связать абстрактные символы с реальными данными: откуда системе знать, что символ «кошка» соответствует определённым пикселям. В нейро-символьных системах эту связь обеспечивает нейросетевой модуль восприятия."}], "neuromorphic_computing_cheatsheet.html": [{"q": "Чем нейроморфные чипы отличаются от архитектуры фон Неймана?", "a": "В фон Неймановской архитектуре память и вычисления разделены, и много энергии уходит на пересылку данных. В нейроморфных чипах (Intel Loihi, IBM TrueNorth) память и вычисления распределены по ядрам-нейронам, а обработка событийная и асинхронная."}, {"q": "Почему нейроморфное железо особенно экономно на разреженных данных?", "a": "Вычисления происходят только при спайках, а в покое ядра почти не потребляют энергию. Если активность редкая, энергопотребление на порядки ниже, чем у GPU, считающего все умножения подряд."}, {"q": "Что такое event-based (DVS) камера и почему она хорошо сочетается с нейроморфными вычислениями?", "a": "Каждый пиксель асинхронно сообщает только об изменении яркости, а не передаёт кадры целиком. Поток событий естественно подаётся на спайковые сети, давая микросекундную задержку и малое энергопотребление."}, {"q": "Какие основные препятствия для широкого применения нейроморфных систем?", "a": "Нет зрелого инструментария и алгоритмов обучения уровня backprop, SNN обычно уступают обычным сетям по точности на стандартных задачах, а железо экспериментальное и не массовое."}, {"q": "Как мемристоры используются в нейроморфных вычислениях?", "a": "Проводимость мемристора хранит вес, и в кроссбар-массиве умножение матрицы на вектор выполняется физически, по законам Ома и Кирхгофа (**in-memory computing**). Проблемы — шум, разброс параметров устройств и ограниченная точность."}], "nlp_tasks_ner_classification_summarization_cheatsheet.html": [{"q": "Как задача NER (распознавание именованных сущностей) формулируется для модели?", "a": "Как разметка последовательности: каждому токену присваивается метка в схеме BIO — B-PER (начало имени), I-PER (продолжение), O (не сущность) и т.д. Модель классифицирует каждый токен."}, {"q": "Почему метрика NER считается по сущностям, а не по токенам?", "a": "Важно найти сущность целиком с правильными границами и типом. Частично найденное имя — ошибка, хотя большинство его токенов размечено верно. Поэтому считают precision, recall и F1 по точным совпадениям сущностей (seqeval)."}, {"q": "Чем экстрактивная суммаризация отличается от абстрактивной?", "a": "Экстрактивная выбирает и склеивает важные предложения исходного текста. Абстрактивная генерирует новый текст своими словами (seq2seq-модели, LLM) — пересказ получается связнее, но есть риск выдуманных фактов."}, {"q": "Как оценивают качество суммаризации и почему ROUGE недостаточно?", "a": "ROUGE считает пересечение n-грамм с эталонными пересказами. Он не учитывает синонимы и перефразирование и не проверяет фактическую верность, поэтому дополняют оценкой людьми, BERTScore и проверками соответствия фактам источника."}, {"q": "Как подойти к классификации текстов, если размеченных примеров очень мало?", "a": "Zero-shot или few-shot классификация с LLM, дообучение небольшой предобученной модели (SetFit), эмбеддинги предложений плюс логистическая регрессия, активная разметка самых информативных примеров."}], "node_ensemble_cheatsheet.html": [{"q": "Что такое «забывчивое» (oblivious) дерево и почему NODE использует именно его?", "a": "В oblivious-дереве на каждом уровне все узлы используют одно и то же условие (признак и порог), поэтому дерево глубины d — это просто таблица из 2^d листьев, индексируемая d бинарными решениями. Такая структура легко векторизуется и делается дифференцируемой; та же идея лежит в основе **CatBoost**."}, {"q": "Как NODE делает выбор признака и порога дифференцируемым?", "a": "Выбор признака делается через **entmax** по обучаемым весам, а жёсткое сравнение с порогом заменяется гладкой функцией (two-class entmax / сигмоида). Это позволяет обучать все деревья градиентным спуском end-to-end."}, {"q": "Чем ансамбль в NODE отличается от бустинга?", "a": "В бустинге деревья строятся последовательно и жадно, каждое исправляет ошибки предыдущих. В NODE все деревья обучаются **одновременно** общим градиентом, а слои могут складываться по типу DenseNet, где следующие слои получают выходы предыдущих."}, {"q": "Какие практические недостатки у NODE?", "a": "Большие требования к памяти и времени обучения на GPU, много гиперпараметров (число деревьев, глубина, слои) и чувствительность к предобработке (рекомендуется **квантильное** преобразование признаков). Выигрыш над хорошо настроенным бустингом наблюдается не на всех датасетах."}, {"q": "Что будет, если увеличить глубину oblivious-деревьев в NODE с 6 до 10?", "a": "Число листьев на дерево вырастет с 2⁶ = 64 до 2¹⁰ = 1024, то есть в 16 раз; соответственно растут память и вычисления, а модель становится склоннее к переобучению."}], "non_metric_criteria_cheatsheet.html": [{"q": "Почему модель с лучшей метрикой на валидации не всегда стоит выбирать для продакшена?", "a": "Кроме качества важны **латентность**, потребление памяти, стоимость обучения и инференса, интерпретируемость и простота поддержки. Прирост ROC-AUC на 0.002 редко окупает модель, которая в 50 раз медленнее или не проходит требования регулятора."}, {"q": "Чем время обучения отличается по значимости от времени предсказания?", "a": "Обучение обычно выполняется офлайн и редко, а предсказание — на каждый запрос, часто с жёстким SLA (например, p99 ≤ 50 мс). Поэтому для онлайн-сервиса критичнее **latency и throughput инференса**, а время обучения важно при частом переобучении."}, {"q": "Почему латентность лучше оценивать по перцентилям (p95, p99), а не по среднему?", "a": "Распределение времени ответа обычно имеет тяжёлый хвост: среднее может быть 10 мс, а каждый сотый запрос — 300 мс. Пользователи и SLA страдают именно от хвоста, поэтому смотрят p95/p99 и меряют после «прогрева» модели."}, {"q": "Чем глобальная интерпретируемость отличается от локальной?", "a": "**Глобальная** объясняет поведение модели в целом (коэффициенты линейной модели, общая важность признаков, PDP), **локальная** — конкретное предсказание (SHAP для одного объекта, LIME). Для «чёрного ящика» доступны только post-hoc объяснения, которые аппроксимируют модель, а не раскрывают её логику точно."}, {"q": "Как можно ускорить инференс, почти не потеряв в качестве?", "a": "Дистиллировать сложную модель в маленькую, уменьшить число деревьев или глубину, применить квантизацию и прунинг для нейросетей, отобрать признаки (их вычисление тоже стоит времени), использовать батчинг и оптимизированные рантаймы (например, ONNX Runtime)."}], "nonparametric_regression_cheatsheet.html": [{"q": "Чем непараметрическая регрессия отличается от параметрической?", "a": "Параметрическая модель задаёт форму зависимости заранее (например, линейную) с фиксированным числом параметров. Непараметрическая форму не фиксирует: сложность модели растёт с объёмом данных, а прогноз строится по соседним наблюдениям (kNN, ядерная регрессия Надарая–Ватсона, LOESS, сплайны)."}, {"q": "Как ширина окна (bandwidth) влияет на ядерную регрессию?", "a": "Малая ширина — прогноз опирается на немногие точки: кривая шумная, низкое смещение и высокая дисперсия. Большая ширина — сильное сглаживание, кривая стремится к константе, высокое смещение. Ширину подбирают кросс-валидацией; выбор формы ядра обычно влияет гораздо меньше."}, {"q": "Почему непараметрические методы плохо работают в высокой размерности?", "a": "Из-за проклятия размерности: чтобы в окрестности точки было достаточно соседей, окно приходится расширять, и «локальность» теряется. Необходимый объём данных растёт экспоненциально с числом признаков."}, {"q": "В чём проблема регрессии Надарая–Ватсона на краях области данных?", "a": "У края соседи есть только с одной стороны, поэтому взвешенное среднее смещено к внутренним значениям (boundary bias). Локальная линейная регрессия (LOESS) подгоняет в окрестности прямую, а не константу, и в значительной мере устраняет это смещение."}, {"q": "Почему kNN-регрессию относят к непараметрическим методам и чем она дорога на прогнозе?", "a": "kNN не обучает параметров — модель и есть вся обучающая выборка, а прогноз — среднее таргетов k ближайших соседей. Поэтому нужно хранить все данные и для каждого запроса искать соседей; ускоряют это KD-деревья, Ball tree или приближённый поиск."}], "normalizing_flows_cheatsheet.html": [{"q": "На чём основан нормализующий поток?", "a": "На цепочке обратимых дифференцируемых преобразований x = f(z), z ~ N(0, I), и формуле замены переменных: log p(x) = log p(z) + log|det ∂f⁻¹/∂x|. Это даёт **точное** правдоподобие в отличие от VAE и GAN."}, {"q": "Почему важна быстрая вычислимость якобиана?", "a": "Для произвольной матрицы d×d детерминант стоит O(d³), что неприемлемо для изображений. Потоки строят из слоёв с треугольным якобианом, у которого det — произведение диагонали за O(d)."}, {"q": "Как устроен coupling layer (RealNVP)?", "a": "Вход делится на две части: x₁ проходит без изменений, а x₂ преобразуется аффинно: y₂ = x₂·exp(s(x₁)) + t(x₁), где s и t — произвольные нейросети. Обращение тривиально, а log det = ∑ s(x₁)."}, {"q": "Чем потоки отличаются от VAE и GAN по свойствам?", "a": "Потоки дают точное правдоподобие, точный энкодер и обратимость, но размерность латента равна размерности данных, и модели тяжёлые. VAE оптимизирует только нижнюю оценку (ELBO), GAN не даёт правдоподобия вовсе, но часто генерирует резче."}, {"q": "Чем autoregressive flows MAF и IAF отличаются по скорости?", "a": "**MAF** быстро вычисляет плотность (параллельно), но медленно сэмплирует (последовательно по измерениям). **IAF** — наоборот: быстрая генерация, медленная оценка плотности чужих данных."}], "numpy_ml_cheatsheet.html": [{"q": "Чем массив NumPy отличается от списка Python и почему он быстрее?", "a": "Массив хранит элементы **одного типа** в непрерывном блоке памяти, а операции над ним выполняются в скомпилированном C-коде сразу над всем массивом (векторизация). Список хранит ссылки на отдельные объекты Python, и цикл по нему интерпретируется поэлементно."}, {"q": "Что такое broadcasting? Приведите пример.", "a": "Правило, по которому NumPy выполняет операции над массивами разной формы: размерности сравниваются с конца, и измерение длины 1 «растягивается». Пример: `X - X.mean(axis=0)` — из матрицы `(n, d)` вычитается вектор средних `(d,)`, и каждая строка центрируется."}, {"q": "Что означает `axis=0` в `X.sum(axis=0)` для матрицы «объекты × признаки»?", "a": "Суммирование **вдоль** оси 0, т.е. по строкам: результат — по одному числу на каждый столбец (признак), форма `(d,)`. `axis=1` даёт сумму по каждой строке (объекту)."}, {"q": "Чем отличаются `A * B` и `A @ B`?", "a": "`A * B` — поэлементное умножение (с broadcasting). `A @ B` — матричное умножение: число столбцов `A` должно совпадать с числом строк `B`."}, {"q": "Почему изменение среза `b = a[1:3]` может изменить исходный массив `a`?", "a": "Обычный срез возвращает **представление** (view) на те же данные, а не копию. Чтобы получить независимый массив, нужен `a[1:3].copy()`. Индексация списком или маской (`a[[0, 2]]`, `a[a > 0]`) всегда создаёт копию."}], "object_detection_cheatsheet.html": [{"q": "Как устроен Faster R-CNN?", "a": "Общая CNN-основа строит карты признаков, Region Proposal Network предлагает области-кандидаты на основе якорей, RoI pooling (или RoIAlign) вырезает признаки каждой области, а голова классифицирует её и уточняет рамку."}, {"q": "Зачем нужна Feature Pyramid Network (FPN)?", "a": "Объекты бывают разного размера. FPN объединяет глубокие (смысловые, но грубые) и ранние (точные, но простые) карты признаков сверху вниз и детектирует объекты на нескольких масштабах — особенно улучшается поиск маленьких объектов."}, {"q": "Какую проблему решает focal loss в RetinaNet?", "a": "У одностадийных детекторов огромное число лёгких фоновых примеров заглушает обучение. Focal loss уменьшает вес хорошо классифицированных примеров множителем (1 − p)^γ, и обучение фокусируется на трудных."}, {"q": "Чем DETR отличается от классических детекторов?", "a": "DETR — трансформер, который напрямую предсказывает фиксированный набор объектов. Сопоставление с разметкой делается венгерским алгоритмом (bipartite matching), поэтому не нужны якоря и NMS."}, {"q": "Почему маленькие объекты детектировать особенно трудно?", "a": "После нескольких понижений разрешения от них остаётся несколько пикселей на картах признаков, а в датасетах их часто меньше. Помогают FPN, входы большего разрешения, нарезка изображения на тайлы и аугментации с копированием объектов."}], "object_tracking_video_cheatsheet.html": [{"q": "В чём идея парадигмы tracking-by-detection?", "a": "На каждом кадре детектор независимо находит объекты, а трекер **ассоциирует** новые детекции с существующими треками (по IoU, движению, внешнему виду) и присваивает им ID. Качество трекинга сильно зависит от качества детектора."}, {"q": "Зачем в SORT используется фильтр Калмана, а в DeepSORT добавлен ещё и appearance-эмбеддинг?", "a": "Фильтр Калмана предсказывает положение бокса на следующем кадре по модели движения, что помогает сопоставлению и сглаживает шум. Но при перекрытиях и долгом исчезновении одного движения мало, и ID путаются; DeepSORT добавляет признаки внешнего вида из re-ID сети, что заметно уменьшает число **ID switches**."}, {"q": "Как решается задача сопоставления детекций и треков?", "a": "Строится матрица стоимостей (например, 1 − IoU или расстояние эмбеддингов) между треками и детекциями, и находится оптимальное однозначное назначение **венгерским алгоритмом**. Пары со стоимостью выше порога отбрасываются: из них рождаются новые треки или помечаются потерянные."}, {"q": "Чем отличаются метрики MOTA и IDF1?", "a": "MOTA суммирует пропуски, ложные срабатывания и смены ID относительно числа объектов и в основном отражает **качество детекции**. IDF1 измеряет, насколько долго объекту сохраняется правильный ID, то есть качество **ассоциации**; HOTA пытается сбалансировать оба аспекта."}, {"q": "Что будет, если удалять трек сразу, как только объект не нашёлся на кадре?", "a": "При кратковременном перекрытии или пропуске детекции объект получит **новый ID** после возвращения — вырастет число ID switches и фрагментация. Поэтому трек держат «потерянным» несколько кадров (параметр вроде `max_age`) и пытаются переассоциировать его."}], "one_class_svm_cheatsheet.html": [{"q": "Какую задачу решает One-Class SVM?", "a": "Он учится по (почти) только нормальным данным строить границу области, где сосредоточены объекты: в пространстве ядра ищется гиперплоскость, отделяющая данные от начала координат с максимальным отступом. Точки по другую сторону границы считаются аномалиями."}, {"q": "Какой смысл у параметра ν (nu)?", "a": "ν ∈ (0, 1] — верхняя граница доли обучающих объектов, оказывающихся вне границы (выбросов), и нижняя граница доли опорных векторов. Например, ν = 0.05 допускает примерно 5% обучающих точек за пределами области."}, {"q": "Что будет, если выбрать слишком большое значение gamma в RBF-ядре?", "a": "Граница станет очень извилистой и будет «обтягивать» каждую обучающую точку — модель переобучится и будет считать аномалией почти любой новый объект. Слишком маленькая gamma даёт чрезмерно гладкую границу, пропускающую аномалии."}, {"q": "Почему для One-Class SVM обязательно масштабирование признаков?", "a": "RBF-ядро основано на евклидовом расстоянии, поэтому признак с большим масштабом будет доминировать в расстояниях и форме границы. Перед обучением используют `StandardScaler` (или робастное масштабирование при выбросах), обычно внутри `Pipeline`."}, {"q": "Когда One-Class SVM — неудачный выбор?", "a": "На больших выборках: обучение масштабируется примерно как O(n²)–O(n³), и уже сотни тысяч объектов становятся проблемой. Также он чувствителен к загрязнённости обучающих данных аномалиями и к подбору gamma и ν без размеченной валидации; на больших данных используют `SGDOneClassSVM` с аппроксимацией ядра или Isolation Forest."}], "online_learning_cheatsheet.html": [{"q": "Чем онлайн-обучение отличается от батчевого?", "a": "Модель обновляется после каждого примера (или маленькой порции) и не хранит весь датасет. Это нужно, когда данные приходят потоком, не помещаются в память или их распределение меняется со временем."}, {"q": "Почему порядок примеров в онлайн-обучении важен и как правильно его оценивать?", "a": "Модель видит данные один раз и в определённом порядке, поэтому отсортированный поток (например, сначала все примеры одного класса) сильно её смещает. Оценивают методом **prequential** (test-then-train): каждый пример сначала используют для прогноза, затем для обучения."}, {"q": "Как ведёт себя персептрон на линейно неразделимых данных?", "a": "Не сходится: веса продолжают меняться на каждой ошибке. Для разделимых данных число ошибок ограничено (теорема Новикова: не больше (R/γ)²). На практике используют усреднённый персептрон или ограничивают число эпох."}, {"q": "Почему в онлайн-SGD нельзя бездумно уменьшать learning rate до нуля?", "a": "Убывающий шаг (например, ∝ 1/t) нужен для сходимости на стационарных данных, но при concept drift модель перестанет адаптироваться к новому распределению. В нестационарных потоках держат шаг постоянным или перезапускают его после обнаружения дрейфа."}, {"q": "Что такое concept drift и как на него реагируют?", "a": "Изменение зависимости P(y | x) или распределения входов со временем (внезапное, постепенное, повторяющееся). Реагируют детекторами дрейфа (DDM, ADWIN, Page-Hinkley), забыванием старых данных через окна или веса, сбросом и переобучением модели."}], "onnx_format_cheatsheet.html": [{"q": "Какую проблему решает ONNX?", "a": "Это открытый формат описания графа вычислений и весов, позволяющий обучить модель в одном фреймворке (PyTorch, TensorFlow, scikit-learn) и запускать в другом рантайме — **ONNX Runtime**, TensorRT, OpenVINO — без исходного кода обучения."}, {"q": "Почему при экспорте из PyTorch важно указывать dynamic_axes?", "a": "Экспорт трассирует модель на примере входа, и все размерности фиксируются. Без `dynamic_axes` модель будет принимать только тот же размер батча или длину последовательности, что и при экспорте."}, {"q": "Что такое opset и почему он важен?", "a": "Opset — версия набора операторов ONNX. Новые операторы появляются в новых opset, а рантайм поддерживает определённый диапазон версий; несовпадение приводит к ошибкам «оператор не поддерживается» при экспорте или загрузке."}, {"q": "Почему модель с условиями if и циклами, зависящими от данных, может экспортироваться неправильно?", "a": "Трассировка записывает только тот путь выполнения, который был на примере входа, и ветвление «замораживается». Нужно использовать скриптинг (TorchScript/новый экспортёр на `torch.export`) или переписать логику тензорными операциями."}, {"q": "Как убедиться, что экспорт в ONNX прошёл корректно?", "a": "Проверить модель `onnx.checker`, прогнать одинаковые входы через исходную модель и через ONNX Runtime и сравнить выходы с допуском (например, `np.testing.assert_allclose` с rtol ~1e-3). Не забыть перевести модель в `eval()` перед экспортом, чтобы dropout и BatchNorm работали в режиме инференса."}], "optics_cheatsheet.html": [{"q": "Какую проблему DBSCAN решает OPTICS?", "a": "DBSCAN использует один порог плотности ε и плохо находит кластеры разной плотности. OPTICS не фиксирует ε, а строит упорядочение точек, из которого можно извлечь кластеры для разных уровней плотности."}, {"q": "Что такое core distance и reachability distance?", "a": "Core distance точки p — расстояние до её `min_samples`-го ближайшего соседа (наименьший радиус, при котором p — core-точка). Reachability distance точки o от p — max(core_dist(p), d(p, o)), то есть не меньше «плотностного радиуса» p."}, {"q": "Как читать reachability plot?", "a": "По оси X — точки в порядке обхода OPTICS, по оси Y — их reachability distance. Кластеры выглядят как «долины» (низкая достижимость), границы между ними — как пики. Чем глубже долина, тем плотнее кластер."}, {"q": "Как из OPTICS получить конкретные кластеры?", "a": "Либо горизонтальным «срезом» reachability plot на уровне ε — это даёт результат, близкий к DBSCAN с этим ε (`cluster_method='dbscan'` в sklearn), либо методом ξ (`cluster_method='xi'`), который выделяет долины по относительной крутизне спадов и подъёмов и находит кластеры разной плотности."}, {"q": "Чем OPTICS уступает DBSCAN на практике?", "a": "Он обычно медленнее и требует настройки параметра извлечения (`xi` или порога среза), а интерпретация reachability plot требует опыта. Если плотность кластеров примерно одинакова, DBSCAN проще и быстрее."}], "optimization_based_meta_learning_cheatsheet.html": [{"q": "В чём общая идея optimization-based meta-learning?", "a": "Мета-обучение настраивает сам процесс оптимизации — инициализацию, шаги обучения или даже правило обновления — так, чтобы на новой задаче несколько шагов градиентного спуска давали хорошую модель."}, {"q": "Чем Reptile отличается от MAML?", "a": "Reptile делает несколько шагов SGD на задаче и просто сдвигает θ в сторону полученных весов: θ ← θ + ε(θ' − θ). Не нужны вторые производные и разделение на support/query внутри шага, поэтому он проще и дешевле, при сравнимом качестве."}, {"q": "Что добавляет Meta-SGD по сравнению с MAML?", "a": "Помимо инициализации мета-обучается **вектор шагов обучения** α той же размерности, что и параметры (покомпонентно задаются и величина, и направление обновления). Это повышает гибкость адаптации ценой удвоения мета-параметров."}, {"q": "Что такое learned optimizer (например, LSTM-оптимизатор)?", "a": "Отдельная сеть принимает градиенты и выдаёт обновления параметров вместо фиксированного правила вроде Adam. Она обучается на распределении задач; сложность — обобщение на более длинные траектории и другие архитектуры."}, {"q": "Почему для optimization-based методов критично эпизодическое обучение?", "a": "Модель должна тренироваться в тех же условиях, что и при тесте: мало примеров, несколько шагов адаптации, разделение support/query. Иначе выученная инициализация не готова к few-shot-режиму."}], "optimizers_cheatsheet.html": [{"q": "Что добавляет momentum к обычному SGD?", "a": "Экспоненциальное среднее прошлых градиентов («инерцию»): v ← βv + ∇L, θ ← θ − ηv. Это гасит колебания поперёк «оврага» функции потерь и ускоряет движение вдоль него."}, {"q": "В чём идея адаптивных методов (AdaGrad, RMSProp)?", "a": "Делить шаг каждого параметра на корень из накопленных квадратов его градиентов: параметры с большими градиентами получают меньший шаг, редко обновляемые — больший. RMSProp использует скользящее среднее, поэтому шаг не затухает до нуля, как в AdaGrad."}, {"q": "Как устроен Adam?", "a": "Совмещает momentum (первый момент — среднее градиентов) и RMSProp (второй момент — среднее квадратов) с поправкой на смещение в начале обучения. Обычно хорошо работает со стандартными параметрами (lr = 1e-3, β₁ = 0.9, β₂ = 0.999)."}, {"q": "Чем AdamW отличается от Adam с L2-регуляризацией?", "a": "В Adam L2-штраф добавляется в градиент и затем масштабируется адаптивным знаменателем — регуляризация работает неравномерно. AdamW применяет затухание весов (weight decay) напрямую к параметрам, отдельно от адаптивного шага; это стандарт для трансформеров."}, {"q": "Зачем нужны расписания learning rate и warmup?", "a": "Большой шаг в начале ускоряет обучение, малый в конце позволяет точнее сойтись (cosine, step decay). Warmup — плавное увеличение lr в первые шаги, пока статистики адаптивных оптимизаторов не стабилизировались; без него большие модели часто расходятся."}], "optimizers_advanced_cheatsheet.html": [{"q": "Почему у AdaGrad со временем «умирает» шаг обучения?", "a": "Он делит шаг на √(∑g²), сумма квадратов градиентов только растёт, поэтому эффективный learning rate монотонно стремится к нулю. Это удобно для разреженных признаков, но плохо для долгого обучения глубоких сетей."}, {"q": "Как RMSProp исправляет проблему AdaGrad?", "a": "Вместо суммы использует экспоненциальное скользящее среднее: v ← βv + (1 − β)g², обычно β ≈ 0.9. Старые градиенты забываются, и шаг не затухает."}, {"q": "Чем AdamW отличается от Adam с L2-регуляризацией?", "a": "В Adam L2-штраф добавляется в градиент и затем делится на √v, поэтому параметры с большими градиентами регуляризуются слабее. AdamW применяет weight decay **отдельно** от адаптивного шага: w ← w − η·λ·w, что даёт честное затухание весов и обычно лучшее обобщение."}, {"q": "Зачем в Adam коррекция смещения?", "a": "Моменты m и v инициализируются нулями, поэтому на первых шагах они смещены к нулю. Деление на (1 − β₁ᵗ) и (1 − β₂ᵗ) компенсирует это; без коррекции первые шаги были бы искажены."}, {"q": "Что добавляет Nadam?", "a": "Это Adam с **моментом Нестерова**: в обновлении используется «заглядывающий вперёд» момент — комбинация β₁m и текущего градиента. Часто сходится немного быстрее Adam на ранних этапах."}], "optuna_hyperopt_cheatsheet.html": [{"q": "Как выглядит минимальный подбор гиперпараметров в Optuna?", "a": "Пишется функция `objective(trial)`, в которой значения запрашиваются через `trial.suggest_float/int/categorical`, обучается модель и возвращается метрика. Затем `study = optuna.create_study(direction='maximize')` и `study.optimize(objective, n_trials=100)`."}, {"q": "Что такое «define-by-run» в Optuna и чем это удобно?", "a": "Пространство поиска задаётся прямо в коде функции во время выполнения. Поэтому легко делать условные параметры: например, спрашивать `max_depth` только если выбран тип модели «дерево»."}, {"q": "Какой алгоритм по умолчанию используют Optuna и Hyperopt?", "a": "TPE (Tree-structured Parzen Estimator): по результатам прошлых попыток строятся две плотности — для «хороших» и «плохих» значений, — и выбираются точки с наибольшим отношением этих плотностей."}, {"q": "Что такое pruning и зачем он нужен?", "a": "Досрочная остановка неперспективных попыток по промежуточным результатам (например, после нескольких эпох). В Optuna: `trial.report(value, step)` и проверка `trial.should_prune()` с прунером вроде `MedianPruner`. Экономит много вычислений."}, {"q": "Как не переобучиться при долгом подборе гиперпараметров?", "a": "Оценивать каждую попытку кросс-валидацией, а не одним разбиением; держать отдельный тест и проверять на нём только финальную конфигурацию; не делать подбор бесконечно долгим на маленьких данных."}], "outliers_handling_cheatsheet.html": [{"q": "Как найти выбросы методом IQR?", "a": "IQR = Q3 − Q1. Выбросы — значения меньше Q1 − 1.5·IQR или больше Q3 + 1.5·IQR. Метод не требует нормальности распределения."}, {"q": "Как найти выбросы по z-оценке и когда метод плохо работает?", "a": "z = (x − среднее) / стандартное отклонение; выбросом считают |z| > 3. Метод предполагает распределение, близкое к нормальному, а сами выбросы смещают среднее и раздувают отклонение — поэтому на сильно скошенных данных он ненадёжен."}, {"q": "Всегда ли выбросы нужно удалять?", "a": "Нет. Выброс может быть ошибкой измерения (тогда исправить или удалить), а может быть редким, но реальным и важным случаем — например, мошеннической транзакцией. Сначала нужно понять природу выброса."}, {"q": "Какие есть альтернативы удалению выбросов?", "a": "Обрезка значений по перцентилям (winsorizing, `clip`), логарифмирование и другие преобразования скошенных признаков, робастное масштабирование (`RobustScaler`), устойчивые модели и функции потерь (деревья, Huber loss)."}, {"q": "Какие модели чувствительны к выбросам, а какие устойчивы?", "a": "Чувствительны: линейная регрессия с MSE, k-NN, k-means, модели на расстояниях. Относительно устойчивы: деревья решений и ансамбли на их основе, модели с MAE или Huber loss."}], "overfitting_underfitting_cheatsheet.html": [{"q": "Что такое переобучение и как его заметить?", "a": "Модель запоминает обучающие данные вместе с шумом и плохо обобщает. Признак — заметно лучшее качество на train, чем на validation или test."}, {"q": "Что такое недообучение и как с ним бороться?", "a": "Модель слишком проста, чтобы уловить закономерность: ошибка высокая уже на обучающей выборке. Помогают более сложная модель, новые признаки, ослабление регуляризации, более долгое обучение."}, {"q": "Перечислите способы бороться с переобучением.", "a": "Больше данных или аугментация; регуляризация (L1/L2, dropout); упрощение модели (меньше глубина, меньше параметров); ранняя остановка; отбор признаков; ансамбли (бэггинг)."}, {"q": "Почему нельзя подбирать гиперпараметры по тестовой выборке?", "a": "Тест перестаёт быть независимой оценкой: модель неявно подгоняется под него, и итоговое качество окажется оптимистично завышенным. Для подбора используют валидационную выборку или кросс-валидацию, а тест — один раз в конце."}, {"q": "Как ранняя остановка (early stopping) защищает от переобучения?", "a": "Во время обучения следят за ошибкой на валидации и останавливаются, когда она перестаёт улучшаться несколько итераций подряд, — до того как модель начнёт подгоняться под шум."}], "pandas_ml_cheatsheet.html": [{"q": "Чем отличаются `df.loc` и `df.iloc`?", "a": "`loc` выбирает по **меткам** индекса и названиям столбцов (срез `loc[a:b]` включает правую границу), `iloc` — по **целочисленным позициям** (правая граница не включается)."}, {"q": "Как найти и посчитать пропуски в DataFrame?", "a": "`df.isna().sum()` — число пропусков в каждом столбце, `df.isna().mean()` — их доля. Строки с пропусками: `df[df.isna().any(axis=1)]`."}, {"q": "Что делает `groupby` и как посчитать средний чек по городам?", "a": "`groupby` разбивает таблицу на группы по значениям ключа, применяет к каждой агрегирующую функцию и собирает результат: `df.groupby('city')['amount'].mean()`. Несколько метрик сразу: `.agg(['mean', 'count'])`."}, {"q": "Чем `merge` отличается от `concat`?", "a": "`merge` соединяет таблицы **по ключу** (как SQL JOIN: `inner`, `left`, `outer`). `concat` просто склеивает таблицы вдоль оси — друг под другом или рядом — без сопоставления по ключу."}, {"q": "Почему предупреждение `SettingWithCopyWarning` стоит воспринимать всерьёз?", "a": "Присваивание вида `df[df.a > 0]['b'] = 1` может изменить временную копию, а не исходную таблицу, — и изменение молча потеряется. Правильно: `df.loc[df.a > 0, 'b'] = 1`."}], "partial_dependence_cheatsheet.html": [{"q": "Что показывает график частичной зависимости (PDP)?", "a": "Как в среднем меняется прогноз модели при изменении одного (или двух) признаков, когда остальные признаки берутся из данных и усредняются."}, {"q": "Как строится PDP?", "a": "Для каждого значения признака из сетки оно подставляется всем объектам выборки вместо настоящего, считаются прогнозы и усредняются. Получается одна кривая."}, {"q": "Что такое ICE-кривые и что они показывают сверх PDP?", "a": "Individual Conditional Expectation — такие же кривые, но для каждого объекта отдельно, без усреднения. PDP — их среднее. Если ICE-кривые идут в разные стороны, значит, есть взаимодействия признаков, которые усреднение скрывает."}, {"q": "Чем опасен PDP при коррелированных признаках?", "a": "Подстановка значений создаёт нереалистичные объекты (например, рост 2 м при весе 40 кг), и модель экстраполирует. ALE-графики (Accumulated Local Effects) решают эту проблему, используя только локальные изменения в реалистичных областях."}, {"q": "Как построить PDP в scikit-learn?", "a": "`from sklearn.inspection import PartialDependenceDisplay` и `PartialDependenceDisplay.from_estimator(model, X, features=['age'])`; параметр `kind='both'` рисует и PDP, и ICE."}], "pca_cheatsheet.html": [{"q": "Какие направления находит PCA?", "a": "Ортогональные направления максимальной дисперсии данных: первая компонента — направление наибольшей дисперсии, каждая следующая — максимальной дисперсии среди ортогональных предыдущим. Это собственные векторы ковариационной матрицы, а собственные значения равны дисперсиям вдоль них."}, {"q": "Почему перед PCA данные центрируют и обычно стандартизируют?", "a": "Без центрирования первая компонента будет указывать на среднее данных, а не на направление разброса. Без стандартизации признаки с большим масштабом доминируют в дисперсии и захватывают первые компоненты просто из-за единиц измерения."}, {"q": "Собственные значения ковариационной матрицы равны 6, 3 и 1. Какую долю дисперсии объясняют две первые компоненты?", "a": "(6 + 3) / (6 + 3 + 1) = 0.9, то есть 90%. Доля дисперсии компоненты равна её собственному значению, делённому на сумму всех собственных значений."}, {"q": "Как связаны PCA и SVD?", "a": "Для центрированной матрицы X = UΣVᵀ столбцы V — главные направления, а собственные значения ковариации равны σᵢ² / (n − 1). На практике PCA считают через SVD, не формируя матрицу XᵀX явно: это численно устойчивее."}, {"q": "Когда PCA не помогает или вредит?", "a": "Когда структура данных нелинейна (данные на искривлённом многообразии) или когда информативные для задачи направления имеют маленькую дисперсию — PCA не учитывает таргет и может выбросить именно их. Кроме того, компоненты — смеси всех признаков, и их трудно интерпретировать."}], "pca_method_cheatsheet.html": [{"q": "Почему перед PCA признаки обычно стандартизируют?", "a": "PCA ищет направления максимальной дисперсии. Признак в больших единицах (зарплата в рублях) имеет огромную дисперсию и «захватывает» первую компоненту независимо от важности. После стандартизации все признаки вносят сопоставимый вклад."}, {"q": "Как выбрать число компонент?", "a": "По накопленной доле объяснённой дисперсии (`explained_variance_ratio_`), например 90–95%, по «локтю» на графике собственных значений или по качеству итоговой модели на кросс-валидации. В sklearn можно задать `n_components=0.95`."}, {"q": "Почему PCA может ухудшить качество классификации?", "a": "PCA не использует целевую переменную: направления с малой дисперсией, отбрасываемые им, могут быть именно теми, что разделяют классы. Для учёта меток есть LDA."}, {"q": "Как PCA связан с SVD?", "a": "Главные компоненты — правые сингулярные векторы центрированной матрицы X = UΣVᵀ, а собственные значения ковариации равны σᵢ²/(n − 1). Через SVD считать численно устойчивее, чем через явную матрицу ковариации."}, {"q": "Что будет, если применить PCA к данным с нелинейной структурой (например, «швейцарский рулет»)?", "a": "PCA — линейный метод, он лишь поворачивает и проецирует данные, поэтому развернуть нелинейное многообразие не сможет. Нужны Kernel PCA, t-SNE, UMAP, Isomap."}], "perceptron_cheatsheet.html": [{"q": "Как искусственный нейрон вычисляет выход?", "a": "Считает взвешенную сумму входов плюс смещение z = wᵀx + b и применяет к ней функцию активации: y = f(z). У классического перцептрона f — пороговая (ступенчатая) функция."}, {"q": "Как обновляются веса в правиле обучения перцептрона?", "a": "Только на ошибочных примерах: w ← w + η·(y − ŷ)·x, b ← b + η·(y − ŷ). Если пример классифицирован верно, веса не меняются."}, {"q": "Почему один перцептрон не может решить задачу XOR?", "a": "Перцептрон строит линейную границу (гиперплоскость), а классы XOR линейно неразделимы: никакая прямая не отделяет (0,1) и (1,0) от (0,0) и (1,1). Нужен хотя бы один скрытый слой."}, {"q": "Что гарантирует теорема сходимости перцептрона?", "a": "Если классы линейно разделимы, алгоритм за конечное число шагов найдёт разделяющую гиперплоскость. Если неразделимы — веса будут колебаться бесконечно."}, {"q": "Зачем нейрону смещение (bias)?", "a": "Без смещения разделяющая гиперплоскость обязана проходить через начало координат. Смещение позволяет сдвигать порог срабатывания независимо от входов."}], "policy_gradient_cheatsheet.html": [{"q": "Чем методы градиента политики отличаются от value-based методов (DQN)?", "a": "Они напрямую параметризуют политику π(a|s) нейросетью и оптимизируют её градиентным подъёмом по ожидаемой награде. Это естественно работает с непрерывными действиями и стохастическими политиками."}, {"q": "Как выглядит градиент в алгоритме REINFORCE?", "a": "∇J = E[∇ log π(a|s) · Gₜ], где Gₜ — суммарная награда после шага t. Вероятность действий, за которыми последовала большая награда, увеличивается."}, {"q": "Зачем вычитать baseline из возврата и почему это не вносит смещения?", "a": "Оценки REINFORCE очень шумные. Вычитание базовой линии b(s) (обычно V(s)) уменьшает дисперсию. Смещения нет, потому что E[∇ log π(a|s)·b(s)] = 0: baseline не зависит от действия."}, {"q": "Что такое actor-critic?", "a": "Комбинация двух сетей: актор (политика) выбирает действия, критик (функция ценности) оценивает их и даёт актору менее шумный сигнал — преимущество A(s, a) ≈ r + γV(s') − V(s) вместо полного возврата."}, {"q": "Почему policy gradient методы обычно менее эффективны по данным, чем Q-learning?", "a": "Классические варианты on-policy: опыт должен собираться текущей политикой и после обновления устаревает, переиспользовать старые данные напрямую нельзя."}], "polynomial_regression_cheatsheet.html": [{"q": "Почему полиномиальная регрессия всё ещё считается линейной моделью?", "a": "Она линейна по **параметрам**: признаки x, x², x³… создаются заранее (`PolynomialFeatures`), а затем обучается обычная линейная регрессия на расширенном наборе признаков."}, {"q": "Что происходит при слишком большой степени полинома?", "a": "Модель начинает проходить почти через каждую точку обучающей выборки и сильно колеблется между ними — классическое переобучение (высокая дисперсия), особенно на краях диапазона."}, {"q": "Как выбрать степень полинома?", "a": "Перебрать несколько степеней и сравнить ошибку на кросс-валидации; выбрать степень с минимальной ошибкой на валидации, а не на обучении."}, {"q": "Сколько признаков даст `PolynomialFeatures(degree=2)` для 3 исходных признаков?", "a": "10: константа (1), 3 исходных признака, 3 квадрата и 3 попарных произведения. С ростом степени и числа признаков их количество растёт комбинаторно."}, {"q": "Почему перед полиномиальными признаками важно масштабирование?", "a": "Степени больших значений (например, 1000³) дают огромные числа: страдает численная устойчивость, а при регуляризации признаки разных масштабов штрафуются несопоставимо."}], "pooling_layers_cheatsheet.html": [{"q": "Зачем в CNN нужен пулинг?", "a": "Уменьшает пространственный размер карт признаков (меньше вычислений и памяти), увеличивает рецептивное поле следующих слоёв и даёт небольшую устойчивость к сдвигам."}, {"q": "Чем max pooling отличается от average pooling?", "a": "Max берёт максимум в окне — сохраняет самые сильные срабатывания признака. Average усредняет — сглаживает. В промежуточных слоях классических CNN чаще используют max pooling."}, {"q": "Есть ли у пулинг-слоя обучаемые параметры?", "a": "Нет, это фиксированная операция. Обучаемая альтернатива — свёртка со stride 2, которую используют многие современные архитектуры."}, {"q": "Что такое global average pooling и чем он удобен?", "a": "Усреднение каждой карты признаков целиком в одно число: тензор C×H×W превращается в вектор длины C. Он заменяет большие полносвязные слои в конце сети, резко сокращает число параметров и позволяет подавать изображения разного размера."}, {"q": "Как max pooling 2×2 со stride 2 изменит тензор 64×56×56?", "a": "Получится 64×28×28: число каналов не меняется, высота и ширина уменьшаются вдвое."}], "pose_estimation_cheatsheet.html": [{"q": "Что предсказывают модели оценки позы?", "a": "Координаты ключевых точек тела (суставы: плечи, локти, колени и т.д.) в 2D на изображении или в 3D. Соединение точек даёт «скелет» человека."}, {"q": "Чем top-down подход отличается от bottom-up?", "a": "Top-down: сначала детектор находит людей, затем для каждого отдельно ищутся ключевые точки — точно, но время растёт с числом людей. Bottom-up: сначала находятся все ключевые точки на изображении, потом группируются по людям (как в OpenPose) — скорость почти не зависит от числа людей."}, {"q": "Почему ключевые точки часто предсказывают через тепловые карты, а не прямой регрессией координат?", "a": "Сеть выдаёт для каждой точки карту вероятностей её положения. Такое представление сохраняет пространственную структуру и обучается устойчивее, чем регрессия двух чисел, и естественно выражает неопределённость."}, {"q": "Как OpenPose связывает найденные точки в скелеты разных людей?", "a": "С помощью Part Affinity Fields — векторных полей, кодирующих направление конечностей между парами точек. По ним оценивается, какие точки принадлежат одной конечности одного человека."}, {"q": "Какая метрика используется для оценки позы на COCO?", "a": "OKS (Object Keypoint Similarity) — аналог IoU для ключевых точек, учитывающий масштаб человека и разную точность разметки для разных суставов; по ней считается AP."}], "positional_encoding_cheatsheet.html": [{"q": "Зачем трансформеру позиционное кодирование?", "a": "Self-attention инвариантен к перестановке токенов: без информации о позиции «кот съел мышь» и «мышь съела кота» неразличимы. Позиционная информация добавляется к эмбеддингам или в механизм внимания."}, {"q": "Как устроено синусоидальное кодирование?", "a": "PE(pos, 2i) = sin(pos / 10000^(2i/d)), PE(pos, 2i+1) = cos(pos / 10000^(2i/d)). Разные измерения имеют разные частоты, а сдвиг на k — линейное преобразование, что помогает учить относительные позиции."}, {"q": "Чем обучаемые позиционные эмбеддинги отличаются от синусоидальных?", "a": "Обучаемые (BERT, GPT-2) — отдельный вектор для каждой позиции, гибкие, но не определены для позиций длиннее максимальной из обучения. Синусоидальные вычисляются для любой позиции, хотя экстраполяция на практике тоже ограничена."}, {"q": "В чём идея RoPE?", "a": "Rotary Position Embedding поворачивает пары координат запросов и ключей на угол, пропорциональный позиции. Тогда скалярное произведение qᵀk зависит только от относительного смещения позиций; используется в LLaMA и многих современных LLM."}, {"q": "Почему важна экстраполяция на длинные контексты и как её улучшают?", "a": "Модель, обученная на 2–4 тыс. токенов, часто деградирует на более длинных входах из-за непривычных позиций. Помогают ALiBi (линейный штраф за расстояние в attention) и методы интерполяции/масштабирования RoPE (position interpolation, NTK-scaling, YaRN)."}], "ppo_reinforcement_learning_cheatsheet.html": [{"q": "Какую проблему обычных policy gradient методов решает PPO?", "a": "Слишком большое обновление политики может резко её ухудшить, и обучение «срывается». PPO ограничивает, насколько новая политика может отличаться от старой за одно обновление."}, {"q": "Как устроена clipped-целевая функция PPO?", "a": "rₜ = π_new(a|s) / π_old(a|s); цель — E[min(rₜ·Aₜ, clip(rₜ, 1 − ε, 1 + ε)·Aₜ)], обычно ε = 0.2. Когда отношение выходит за пределы, выгода от дальнейшего изменения обнуляется."}, {"q": "Почему PPO может делать несколько эпох обновлений на одних и тех же данных?", "a": "Благодаря ограничению изменения политики можно несколько раз пройтись мини-батчами по собранной траектории без риска разрушительного обновления. Это повышает эффективность использования данных по сравнению с REINFORCE."}, {"q": "Что такое GAE и зачем он используется в PPO?", "a": "Generalized Advantage Estimation — оценка преимущества как экспоненциально взвешенная сумма TD-ошибок с параметром λ. Позволяет балансировать смещение (λ → 0) и дисперсию (λ → 1) оценки."}, {"q": "Где PPO применяется помимо игр и робототехники?", "a": "В RLHF для языковых моделей: политика — языковая модель, награда — модель предпочтений людей, а штраф по KL-дивергенции к исходной модели не даёт ей слишком отклониться."}], "preprocessing_cheatsheet.html": [{"q": "Из каких основных шагов состоит предобработка табличных данных?", "a": "Анализ данных (типы, распределения, пропуски), обработка пропусков, обработка выбросов, кодирование категориальных признаков, масштабирование числовых, создание и отбор признаков, разбиение на train/validation/test."}, {"q": "Почему предобработку нужно обучать только на обучающей выборке?", "a": "Параметры преобразований (среднее, медиана, словарь категорий) — тоже «знание о данных». Если вычислить их по всей выборке, информация из теста попадёт в обучение (утечка данных), и оценка качества будет завышена."}, {"q": "Зачем нужен `Pipeline` в scikit-learn?", "a": "Он объединяет предобработку и модель в один объект: `fit` обучает все шаги на train, `predict` применяет их к новым данным. Это защищает от утечек при кросс-валидации и упрощает развёртывание."}, {"q": "Как обработать числовые и категориальные столбцы по-разному в одном конвейере?", "a": "Через `ColumnTransformer`: например, `StandardScaler` для числовых столбцов и `OneHotEncoder` для категориальных, затем результат передаётся модели внутри `Pipeline`."}, {"q": "Каким моделям масштабирование признаков нужно, а каким нет?", "a": "Нужно — моделям, основанным на расстояниях и градиентах: k-NN, SVM, линейные модели с регуляризацией, нейросети, PCA. Не нужно — деревьям и ансамблям на деревьях: разбиения по порогу не зависят от масштаба."}], "probability_theory_cheatsheet.html": [{"q": "Тест на болезнь с чувствительностью 99% и специфичностью 95%, распространённость 1%. Какова вероятность болезни при положительном тесте?", "a": "По Байесу: 0.99·0.01 / (0.99·0.01 + 0.05·0.99) = 0.0099 / 0.0594 ≈ **17%**. Большинство положительных результатов — ложные из-за редкости болезни (игнорирование базовой частоты)."}, {"q": "Чем независимость отличается от некоррелированности?", "a": "Нулевая корреляция означает отсутствие только **линейной** связи. Например, X ~ N(0, 1) и Y = X² некоррелированы, но полностью зависимы. Из независимости следует некоррелированность, но не наоборот (исключение — совместно нормальные величины)."}, {"q": "Почему центральная предельная теорема так важна в ML и статистике?", "a": "Сумма или среднее многих независимых величин с конечной дисперсией приближённо нормальны, независимо от исходного распределения. Поэтому работают доверительные интервалы для средних, t-тесты при больших n, и ошибка оценки метрики уменьшается как 1/√n."}, {"q": "Чем правдоподобие отличается от вероятности?", "a": "P(x|θ) как функция от **x** при фиксированном θ — распределение вероятностей. Та же формула как функция от **θ** при фиксированных данных — правдоподобие L(θ); в общем случае она не интегрируется в 1 по θ."}, {"q": "Почему минимизация MSE эквивалентна максимизации правдоподобия при гауссовском шуме?", "a": "Если y = f(x) + ε, ε ~ N(0, σ²), то −log L = ∑(y − f(x))² / 2σ² + const. Аналогично лог-лосс соответствует распределению Бернулли, а MAE — лапласовскому шуму."}], "production_ml_best_practices_cheatsheet.html": [{"q": "Что такое training-serving skew и как его избежать?", "a": "Расхождение между тем, как признаки считаются при обучении и в продакшене (разный код, разные источники данных, разное время). Лечится единым кодом предобработки (сериализуемый пайплайн, feature store) и сравнением распределений признаков в обучении и в продакшене."}, {"q": "Почему перед сложной моделью нужен простой бейзлайн?", "a": "Он показывает, сколько на самом деле даёт сложность, быстро проверяет весь конвейер от данных до прогноза и служит запасным вариантом. Иногда простая эвристика или логистическая регрессия почти так же хороша и намного дешевле в поддержке."}, {"q": "Чем онлайн-инференс отличается от пакетного (batch)?", "a": "Batch — прогнозы считаются заранее по расписанию для многих объектов и сохраняются (рекомендации на завтра). Онлайн — прогноз по запросу в реальном времени с ограничением по задержке (антифрод при оплате)."}, {"q": "Что нужно версионировать в ML-проекте, кроме кода?", "a": "Данные (или их снимки), признаки, модели и их артефакты, гиперпараметры, окружение (версии библиотек), метрики экспериментов. Без этого нельзя воспроизвести модель или откатиться к прошлой версии."}, {"q": "Почему метрика на офлайн-тесте не гарантирует успех в продакшене?", "a": "Тест может не отражать будущие данные (дрейф), офлайн-метрика может плохо связана с бизнес-метрикой, а поведение пользователей меняется в ответ на саму модель. Поэтому модели проверяют A/B-тестом и постоянно мониторят."}], "program_synthesis_ml_cheatsheet.html": [{"q": "Почему programming by example — неоднозначная задача?", "a": "Конечному набору пар вход-выход удовлетворяет множество программ, в том числе тривиальные «запоминающие» примеры. Нужен **ранжир** гипотез — предпочтение коротких или вероятных программ (как в FlashFill)."}, {"q": "В чём преимущество синтеза с проверкой исполнением перед генерацией кода «на глаз»?", "a": "Сгенерированную программу можно запустить на примерах или тестах и отбросить неверные. Комбинация «нейросеть предлагает — интерпретатор проверяет» резко повышает точность."}, {"q": "Что означает метрика pass@k?", "a": "Вероятность того, что хотя бы одна из k сгенерированных программ проходит все тесты. Её оценивают по n ≥ k сэмплам несмещённой формулой, а не по первым k попыткам, чтобы уменьшить дисперсию."}, {"q": "Как нейросети помогают перечисляющему (enumerative) поиску программ?", "a": "Модель предсказывает, какие операции DSL вероятно нужны (как в DeepCoder), и перебор начинается с них. Пространство поиска то же, но нужная программа находится намного быстрее."}, {"q": "Чем SMT-based синтез отличается от нейросетевого?", "a": "SMT-синтез (например, sketch-подход с решателем Z3) даёт программы, **гарантированно** удовлетворяющие формальной спецификации, но плохо масштабируется. Нейросетевой работает с нечёткими спецификациями на естественном языке, но без гарантий корректности."}], "prompt_engineering_cheatsheet.html": [{"q": "Чем zero-shot отличается от few-shot промптинга?", "a": "Zero-shot — только описание задачи без примеров. Few-shot — в промпт добавляют несколько примеров «вход → выход», и модель продолжает по образцу (in-context learning) без изменения весов."}, {"q": "Что такое chain-of-thought и когда он помогает?", "a": "Просьба рассуждать по шагам перед ответом (или примеры с рассуждениями). Помогает в многошаговых задачах — арифметике, логике, планировании, — потому что промежуточные шаги становятся частью контекста, на который опирается ответ."}, {"q": "Какие элементы делают промпт хорошим?", "a": "Чёткая задача и контекст, роль или аудитория, требования к формату ответа, ограничения, примеры, разделение инструкций и данных (например, тегами или разметкой)."}, {"q": "Что такое prompt injection и почему это проблема?", "a": "Инструкции, спрятанные во входных данных (письме, веб-странице, документе), которые пытаются переопределить исходную задачу модели. Опасно для приложений, где модель обрабатывает недоверенный текст и может выполнять действия."}, {"q": "Что такое RAG и какую проблему он решает?", "a": "Retrieval-Augmented Generation: по запросу находятся релевантные документы (например, векторным поиском) и добавляются в промпт. Модель отвечает с опорой на актуальные и проверяемые данные, а не только на то, что запомнила при обучении, — это снижает число выдуманных фактов."}], "prophet_time_series_cheatsheet.html": [{"q": "Из каких компонент складывается модель Prophet?", "a": "y(t) = g(t) + s(t) + h(t) + ε: тренд (кусочно-линейный или логистический), сезонности (рядами Фурье: годовая, недельная, дневная), эффекты праздников и шум."}, {"q": "Какой формат данных ожидает Prophet?", "a": "DataFrame с колонками `ds` (дата и время) и `y` (значение). Дополнительные регрессоры добавляются через `add_regressor` и должны быть известны и для будущих дат."}, {"q": "Что такое точки изменения тренда (changepoints) и как контролировать их гибкость?", "a": "Моменты, где может измениться наклон тренда. Prophet расставляет кандидатов автоматически; параметр `changepoint_prior_scale` регулирует гибкость: больше — тренд точнее следует данным, но выше риск переобучения."}, {"q": "Как учесть праздники и особые события?", "a": "Передать таблицу праздников с датами (и окнами до/после) в параметр `holidays` или использовать встроенные `add_country_holidays`. Модель оценит отдельный эффект каждого события."}, {"q": "В каких случаях Prophet работает плохо?", "a": "На рядах без выраженной сезонности и тренда, с короткой историей, со сложными зависимостями от внешних факторов и при прогнозе на короткий горизонт по высокочастотным данным. Его стоит сравнивать с простыми бейзлайнами (сезонный наивный прогноз, ETS)."}], "pseudo_labeling_cheatsheet.html": [{"q": "Чем жёсткие псевдометки отличаются от мягких?", "a": "Жёсткие — argmax предсказания (один класс), мягкие — весь вектор вероятностей. Мягкие сохраняют неуверенность модели и меньше закрепляют ошибки; жёсткие при высоком пороге дают эффект минимизации энтропии."}, {"q": "Почему псевдоразметка работает как минимизация энтропии?", "a": "Обучение на собственных уверенных предсказаниях заставляет модель выдавать более уверенные ответы на неразмеченных данных, а это сдвигает границу решений в области низкой плотности, между кластерами."}, {"q": "Как FixMatch сочетает псевдометки и аугментации?", "a": "Псевдометку получают по слабо аугментированному примеру и используют, только если уверенность выше порога (например, 0.95); модель учат предсказывать эту метку на сильно аугментированной версии того же примера."}, {"q": "Какие типичные ошибки при pseudo-labeling в соревнованиях?", "a": "Включение псевдоразмеченных тестовых объектов в валидационные фолды или генерация псевдометок моделью, которая видела валидацию, — это утечка и завышенная оценка. Ещё одна ошибка — слишком низкий порог уверенности."}, {"q": "Почему вес потерь на псевдометках обычно наращивают постепенно?", "a": "В начале обучения модель плохая, и её псевдометки шумные. Постепенный рост веса (ramp-up) позволяет сначала выучиться на размеченных данных и лишь потом опираться на псевдометки."}], "pytorch_full_guide_cheatsheet.html": [{"q": "Из каких шагов состоит одна итерация цикла обучения в PyTorch?", "a": "`optimizer.zero_grad()` → прямой проход `pred = model(x)` → `loss = criterion(pred, y)` → `loss.backward()` → `optimizer.step()`."}, {"q": "Зачем вызывать `model.train()` и `model.eval()`?", "a": "Они переключают поведение слоёв, которые работают по-разному при обучении и инференсе: Dropout отключается в eval, BatchNorm в eval использует накопленные статистики вместо статистик батча."}, {"q": "Что делает `torch.no_grad()` и когда его использовать?", "a": "Отключает построение графа вычислений для автодифференцирования. Используется при валидации и инференсе: экономит память и время, ведь градиенты там не нужны."}, {"q": "Какая ошибка будет, если модель на GPU, а данные на CPU, и как её избежать?", "a": "RuntimeError о тензорах на разных устройствах. Модель и каждый батч нужно перенести на одно устройство: `model.to(device)`, `x, y = x.to(device), y.to(device)`."}, {"q": "Зачем нужны `Dataset` и `DataLoader`?", "a": "`Dataset` описывает, как получить один пример по индексу (`__len__`, `__getitem__`). `DataLoader` собирает примеры в батчи, перемешивает их (`shuffle=True` для обучения) и может загружать данные параллельно (`num_workers`)."}], "pytorch_lightning_cheatsheet.html": [{"q": "Какую проблему решает PyTorch Lightning?", "a": "Убирает шаблонный код обучения: цикл по эпохам, перенос на устройства, логирование, чекпоинты, распределённое обучение. Исследовательская логика остаётся в `LightningModule`, «инженерия» — в `Trainer`."}, {"q": "Какие методы обычно определяют в `LightningModule`?", "a": "`forward` (по желанию), `training_step` (возвращает loss), `validation_step`, `configure_optimizers`; при необходимости `test_step` и `predict_step`."}, {"q": "Нужно ли в Lightning вызывать `loss.backward()`, `optimizer.step()` и `.to(device)` вручную?", "a": "Нет: при автоматической оптимизации `Trainer` делает это сам. Достаточно вернуть loss из `training_step`, а устройство задаётся параметрами `Trainer(accelerator=..., devices=...)`."}, {"q": "Как в Lightning включить раннюю остановку и сохранение лучшей модели?", "a": "Передать в `Trainer(callbacks=[...])` колбэки `EarlyStopping(monitor='val_loss')` и `ModelCheckpoint(monitor='val_loss')`; метрику нужно логировать через `self.log('val_loss', loss)`."}, {"q": "Как в Lightning обучать в смешанной точности и на нескольких GPU?", "a": "Параметрами `Trainer`: `precision='16-mixed'` (или `'bf16-mixed'`), `devices=4`, `strategy='ddp'`. Код модели при этом менять не нужно."}], "q_learning_sarsa_cheatsheet.html": [{"q": "Запишите правило обновления Q-learning.", "a": "Q(s, a) ← Q(s, a) + α·[r + γ·maxₐ' Q(s', a') − Q(s, a)]. Выражение в скобках — TD-ошибка: разница между новой оценкой и текущей."}, {"q": "Чем SARSA отличается от Q-learning?", "a": "SARSA использует Q(s', a') для действия a', которое агент действительно выберет по текущей политике (on-policy). Q-learning использует максимум по действиям в s' независимо от того, что агент сделает (off-policy)."}, {"q": "Какой алгоритм ведёт себя осторожнее в задаче «прогулка по краю обрыва» и почему?", "a": "SARSA: она учитывает, что ε-жадный агент иногда делает случайные шаги и может упасть, поэтому выбирает безопасный путь подальше от края. Q-learning учит оптимальный путь вдоль края, но при обучении чаще падает."}, {"q": "Что значит off-policy и чем это полезно?", "a": "Агент учит ценность одной (целевой, жадной) политики, собирая опыт другой (исследующей) политикой. Это позволяет переиспользовать старый опыт и данные, собранные кем угодно, — основа replay buffer в DQN."}, {"q": "Почему табличный Q-learning не подходит для большинства реальных задач?", "a": "Таблица Q нужна для каждой пары «состояние–действие», а в реальных задачах состояний астрономически много или они непрерывны (изображения, позиции). Нужна аппроксимация функции — например, нейросетью (DQN)."}], "quantile_regression_cheatsheet.html": [{"q": "Какую функцию потерь минимизирует квантильная регрессия и почему она даёт именно квантиль?", "a": "**Pinball loss**: L_τ(y, ŷ) = τ·(y − ŷ), если y ≥ ŷ, и (1 − τ)·(ŷ − y), если y < ŷ. Недооценка штрафуется с весом τ, переоценка — с весом 1 − τ, и минимум ожидаемой потери достигается, когда доля наблюдений ниже прогноза равна τ — это и есть τ-квантиль."}, {"q": "Чем медианная регрессия (τ = 0.5) отличается от обычной МНК-регрессии?", "a": "При τ = 0.5 pinball loss пропорциональна MAE, и модель оценивает условную **медиану**, а МНК — условное **среднее**. Медианная регрессия устойчива к выбросам в y: огромный остаток штрафуется линейно, а не квадратично."}, {"q": "Зачем строить сразу несколько квантилей, например 0.1, 0.5 и 0.9?", "a": "Это даёт **интервал прогноза** (здесь 80%) без предположения о нормальности остатков и показывает гетероскедастичность: при растущем разбросе y интервал расширяется. Обычная регрессия даёт только точечный прогноз среднего."}, {"q": "Что такое пересечение квантилей (quantile crossing) и как с ним бороться?", "a": "Когда модели для разных τ обучаются независимо, прогноз 0.9-квантиля может оказаться ниже 0.5-квантиля для некоторых x — это логически невозможно. Помогают сортировка прогнозов после обучения (rearrangement) или совместное обучение всех квантилей с ограничением монотонности."}, {"q": "Как проверить, что прогноз 0.9-квантиля откалиброван?", "a": "Посчитать на отложенной выборке **покрытие** — долю y ≤ ŷ₀.₉; она должна быть близка к 0.9. Для интервала [q₀.₁, q₀.₉] доля попаданий должна быть около 80%; дополнительно смотрят среднюю pinball loss и ширину интервала."}], "quantum_algorithms_ml_cheatsheet.html": [{"q": "Почему утверждение «n кубитов обрабатывают 2ⁿ состояний одновременно» не означает экспоненциального ускорения для любой задачи?", "a": "Измерение даёт лишь один случайный результат, и извлечь все 2ⁿ амплитуд нельзя. Ускорение возможно только там, где интерференция усиливает нужный ответ — в специально устроенных алгоритмах (Гровер, Шор, некоторые задачи линейной алгебры)."}, {"q": "Кубит в состоянии |ψ⟩ = 0.6|0⟩ + 0.8|1⟩. С какой вероятностью измерение даст 1?", "a": "Вероятность равна |β|² = 0.8² = **0.64**, а для 0 — 0.6² = 0.36; в сумме 1, как и требует нормировка |α|² + |β|² = 1."}, {"q": "Какое ускорение даёт алгоритм Гровера и для чего он полезен в ML?", "a": "**Квадратичное**: поиск в неструктурированном пространстве из N элементов за O(√N) обращений вместо O(N). В ML его рассматривают для ускорения поиска и оптимизации, но экспоненциального выигрыша он не даёт."}, {"q": "Что такое «узкое место загрузки данных» (data loading problem) в квантовом ML?", "a": "Многие алгоритмы с экспоненциальным ускорением (например, HHL, quantum PCA) предполагают, что классические данные уже эффективно закодированы в амплитуды (QRAM). Само кодирование может стоить O(N) и съесть всё ускорение."}, {"q": "Что такое «деквантизация» квантовых алгоритмов?", "a": "Это построение классических алгоритмов с похожей асимптотикой при аналогичных предположениях о доступе к данным (работы Ewin Tang для рекомендательных систем). Она показала, что часть заявленных экспоненциальных ускорений для ML не уникальна для квантовых компьютеров."}], "quantum_classical_enhancement_cheatsheet.html": [{"q": "В чём идея quantum kernel (квантового SVM)?", "a": "Объекты отображаются квантовой схемой в состояния |φ(x)⟩, а ядро K(x, x') = |⟨φ(x)|φ(x')⟩|² оценивается на квантовом устройстве. Дальше обычный классический SVM обучается на

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Cheatsheets — учебный портал</title>
<!-- Файл index.html собирается скриптом tools/build_portal.py из этого шаблона. Не редактируйте index.html вручную. -->
<script src="assets/theme.js"></script>
<style>
  :root {
    --bg: #f6f8fb; --panel: #ffffff; --text: #1f2933; --muted: #66768a;
    --border: #dde3ea; --accent: #2f6fde; --accent-soft: #e6effd;
    --done: #1f9d55; --done-soft: #e3f6eb; --warn: #c27c0e;
    --shadow: 0 1px 3px rgba(20, 30, 50, .08);
    --frame-bg: #fafcff;
  }
  /* Тёмная тема: атрибут ставит assets/theme.js (режим «авто» следует настройке системы) */
  :root[data-theme="dark"] {
    --bg: #12161c; --panel: #1b2129; --text: #e4e9ef; --muted: #93a1b3;
    --border: #2c3540; --accent: #6ea2ff; --accent-soft: #1f2d45;
    --done: #4cc884; --done-soft: #183225; --warn: #e2a84b;
    --shadow: none;
    --frame-bg: #12161c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: grid; grid-template-rows: auto 1fr; grid-template-columns: 300px 1fr;
    grid-template-areas: "top top" "side main";
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }

  header {
    grid-area: top; display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; font-size: 17px; white-space: nowrap; color: var(--text); }
  #menuBtn { display: none; }
  .search { flex: 1; max-width: 520px; position: relative; }
  .search input {
    width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit;
  }
  .overall { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--done); }
  .overall .bar { width: 120px; }

  nav {
    grid-area: side; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--border); padding: 10px 0 30px;
  }
  .tabs { display: flex; gap: 4px; padding: 0 10px 8px; }
  .tabs button {
    flex: 1; padding: 6px 4px; border: 1px solid var(--border); border-radius: 6px;
    background: transparent; color: var(--muted); font-size: 13px;
  }
  .tabs button.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .navgroup { padding: 8px 14px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .navitem {
    display: flex; justify-content: space-between; gap: 8px; align-items: center;
    padding: 5px 14px; color: var(--text); font-size: 14px; border-left: 3px solid transparent;
  }
  .navitem:hover { background: var(--bg); text-decoration: none; }
  .navitem.active { background: var(--accent-soft); border-left-color: var(--accent); }
  .navitem small { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .navitem small.full { color: var(--done); }

  main { grid-area: main; overflow-y: auto; min-width: 0; }
  .page { max-width: 980px; margin: 0 auto; padding: 24px 24px 60px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  h2 { font-size: 18px; margin: 26px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; box-shadow: var(--shadow); color: var(--text); display: block;
  }
  a.card:hover { border-color: var(--accent); text-decoration: none; }
  .card .bar { margin-top: 10px; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .cta {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 8px;
    background: var(--accent); color: #fff; border: 0; font-weight: 600;
  }
  .cta:hover { text-decoration: none; filter: brightness(1.08); }
  .btn {
    padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 13px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); text-decoration: none; }
  .btn.on { background: var(--done-soft); border-color: var(--done); color: var(--done); }

  ol.topics { list-style: none; padding: 0; margin: 0; counter-reset: t; }
  ol.topics li {
    counter-increment: t; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 6px;
  }
  ol.topics li::before { content: counter(t); color: var(--muted); font-size: 12px; min-width: 18px; text-align: right; }
  ol.topics li.done { background: var(--done-soft); border-color: transparent; }
  ol.topics li a { flex: 1; color: var(--text); }
  ol.topics li .where { color: var(--muted); font-size: 12px; }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--done); cursor: pointer; }
  .stage { margin-bottom: 18px; }
  .stage h3 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 10px; align-items: center; }
  .lvl { font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 500; }
  .lvl.beginner { background: var(--done-soft); color: var(--done); }
  .lvl.intermediate { background: #fdf3dc; color: var(--warn); }
  .lvl.advanced { background: #fde4e4; color: #c0392b; }
  :root[data-theme="dark"] .lvl.intermediate { background: #3a2f15; }
  :root[data-theme="dark"] .lvl.advanced { background: #3d1d1d; color: #ff8a80; }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 6px; }

  .viewer { display: flex; flex-direction: column; height: 100%; }
  .vbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .vbar .title { flex: 1; min-width: 160px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vbar .ctx { color: var(--muted); font-weight: 400; font-size: 13px; }
  .viewer iframe { flex: 1; border: 0; width: 100%; min-width: 0; background: var(--frame-bg); }
  .vbody { flex: 1; display: flex; min-height: 0; }
  .qpanel { display: none; width: 400px; flex: none; overflow-y: auto; padding: 14px 16px 30px;
    background: var(--bg); border-left: 1px solid var(--border); }
  .viewer.qopen .qpanel { display: block; }
  .qpanel h3 { margin: 0 0 4px; font-size: 16px; }
  details.q { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
  details.q summary { cursor: pointer; padding: 9px 12px; font-weight: 600; list-style: none; }
  details.q summary::-webkit-details-marker { display: none; }
  details.q summary::before { content: "▸ "; color: var(--accent); }
  details.q[open] summary::before { content: "▾ "; }
  details.q .ans { padding: 0 12px 10px; border-top: 1px dashed var(--border); }
  details.q .ans p { margin: 8px 0 0; }
  details.q .ans code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .rate { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .btn.good { border-color: var(--done); color: var(--done); }
  .btn.bad { border-color: #c0392b; color: #c0392b; }
  .badge { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .card.due { border-color: var(--accent); }
  .related { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 6px 12px; font-size: 13px;
    background: var(--panel); border-bottom: 1px solid var(--border); }
  .related .lbl { color: var(--muted); margin-right: 2px; }
  .related .sep { color: var(--border); margin: 0 4px; }
  .chip { padding: 1px 9px; border-radius: 12px; border: 1px solid var(--border); color: var(--text); white-space: nowrap; }
  .chip:hover { border-color: var(--accent); text-decoration: none; }
  .chip.done { border-color: var(--done); color: var(--done); }
  .notes textarea { width: 100%; min-height: 130px; resize: vertical; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); font: 14px/1.5 inherit; font-family: inherit; }
  .note-card pre { white-space: pre-wrap; font: inherit; margin: 6px 0 0; color: var(--text); }

  .md { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 6px 22px 16px; }
  .md pre, .md code { font-family: Consolas, "Courier New", monospace; font-size: 13px; }
  .md pre { background: var(--bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
  .md :not(pre) > code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  .md table { border-collapse: collapse; margin: 8px 0; }
  .md td, .md th { border: 1px solid var(--border); padding: 4px 10px; }
  .files { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 16px; }
  .cmd { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .cmd code { flex: 1; background: var(--panel); border: 1px solid var(--border); padding: 7px 10px; border-radius: 6px; font-size: 13px; overflow-x: auto; white-space: nowrap; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .kbd { font-size: 12px; color: var(--muted); }
  .kbd b { border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-weight: 500; }

  @media (max-width: 800px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main"; }
    header { gap: 8px; padding: 8px 10px; }
    .search { min-width: 0; }
    .overall { display: none; }
    #menuBtn { display: inline-block; }
    nav { position: fixed; top: 52px; bottom: 0; left: 0; width: 290px; z-index: 5; transform: translateX(-100%); transition: transform .2s; box-shadow: 2px 0 10px rgba(0,0,0,.2); }
    body.menu-open nav { transform: none; }
    .overall .bar, .brand span { display: none; }
    .page { padding: 16px; }
    .kbd { display: none; }
    .qpanel { width: 100%; border-left: 0; }
    .viewer.qopen iframe { display: none; }   /* на телефоне вопросы показываются вместо шпаргалки */
  }
</style>
</head>
<body>

  <button id="menuBtn" class="btn" aria-label="Меню">☰</button>

  <button class="btn" id="themeBtn" data-theme-toggle title="Тема оформления"></button>
  <div class="overall" title="Общий прогресс">
    <div class="bar"><span id="overallBar"></span></div><span id="overallText"></span>
  </div>
</header>
<nav>
  <div class="tabs">
    <button data-tab="sections">Разделы</button>
    <button data-tab="paths">Пути</button>
    <button data-tab="exercises">Практика</button>
  </div>
  <div id="navList"></div>
</nav>
<main id="main"></main>

", "exponential_smoothing_cheatsheet.html", "prophet_time_series_cheatsheet.html", "rnn_lstm_time_series_cheatsheet.html", "cnn_time_series_tcn_cheatsheet.html", "transformers_time_series_cheatsheet.html"], "notes": [], "exercises": []}, {"title": "Reinforcement Learning специалист", "level": "advanced", "items": ["reinforcement_learning_basics_cheatsheet.html", "q_learning_sarsa_cheatsheet.html", "multi_armed_bandits_cheatsheet.html", "dqn_cheatsheet.html", "policy_gradient_cheatsheet.html", "ppo_reinforcement_learning_cheatsheet.html"], "notes": [], "exercises": []}]}], "exercises": [{"id": "exercises/activation_functions", "title": "Функции активации и их производные", "topic": "activation_functions", "cheatsheet": "activation_functions_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Функции активации и их производные\n\n## Задание\n\nДан файл `input.csv` со значениями `x`. Для каждого x вычислите функции активации и их производные:\n\n1. **sigmoid**: σ(x) = 1 / (1 + e⁻ˣ), производная σ′(x) = σ(x)·(1 − σ(x))\n2. **tanh**: tanh(x), производная 1 − tanh²(x)\n3. **ReLU**: max(0, x), производная 1 при x > 0, иначе 0 (в точке 0 принимаем 0)\n\n## Подсказки\n\n- Используйте NumPy и векторные операции — без циклов.\n- Выразите производные через уже посчитанные значения функций — так делают и во фреймворках.\n- Посмотрите на максимум σ′(x): почему сигмоида приводит к затуханию градиента в глубоких сетях?\n\n## Ожидаемый формат выходного файла\n\nCSV с колонками `x, sigmoid, d_sigmoid, tanh, d_tanh, relu, d_relu` в исходном порядке строк,\nзначения округлить до 4 знаков.\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/activation_functions\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}, {"id": "exercises/backpropagation", "title": "Обратное распространение для одного нейрона", "topic": "backpropagation", "cheatsheet": "backpropagation_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Обратное распространение для одного нейрона\n\n## Задание\n\nНейрон с сигмоидой: a = σ(z), z = w₁·x₁ + w₂·x₂ + b, где **w₁ = 0.5, w₂ = −0.3, b = 0.1**.\nФункция потерь — бинарная кросс-энтропия: L = −[y·log a + (1 − y)·log(1 − a)].\n\nДля каждой строки `input.csv` (признаки `x1, x2`, метка `y`) вычислите:\n\n1. **Прямой проход**: z, a, L\n2. **Обратный проход** по цепному правилу:\n   - ∂L/∂z — для сигмоиды с кросс-энтропией это упрощается до a − y (выведите это сами!)\n   - ∂L/∂w₁ = ∂L/∂z · x₁, ∂L/∂w₂ = ∂L/∂z · x₂, ∂L/∂b = ∂L/∂z\n\n## Подсказки\n\n- ∂L/∂a = −y/a + (1 − y)/(1 − a), ∂a/∂z = a(1 − a). Перемножьте и упростите.\n- Проверьте градиент численно: (L(w₁ + ε) − L(w₁ − ε)) / 2ε при ε = 1e−5 должно совпасть с ∂L/∂w₁.\n- Средний градиент по всем строкам — это то, что использует градиентный спуск на батче.\n\n## Ожидаемый формат выходного файла\n\nCSV с колонками `id, z, a, loss, dz, dw1, dw2, db`, значения округлить до 4 знаков.\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/backpropagation\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}, {"id": "exercises/categorical_encoding", "title": "Кодирование категориальных признаков", "topic": "categorical_encoding", "cheatsheet": "categorical_encoding_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "task.md"], "task": "# Упражнение: Кодирование категориальных признаков\n\n## Задание\n\nДан файл `input.csv` с данными о продуктах. Необходимо применить различные методы кодирования:\n\n1. **Label Encoding** для признака 'size':\n   - Преобразовать размеры в числа: S=0, M=1, L=2 (алфавитный порядок)\n\n2. **One-Hot Encoding** для признака 'category':\n   - Создать бинарные колонки для каждой категории\n   - Порядок: Clothing, Electronics, Furniture (алфавитный порядок)\n\n3. **Target Encoding** для признака 'color':\n   - Заменить каждый цвет средним значением price для этого цвета\n   - Округлить до 2 знаков после запятой\n\n4. Сохранить результат с колонками: size_encoded, category_Clothing, category_Electronics, category_Furniture, color_target_encoded, price\n\n## Формулы\n\n**Label Encoding:** Алфавитный порядок S=0, M=1, L=2\n\n**One-Hot Encoding:** 1 если категория совпадает, иначе 0\n\n**Target Encoding:** Для каждого цвета = mean(price) для всех строк с этим цветом\n\n## Ожидаемый формат выходного файла\n\nCSV файл с колонками: size_encoded, category_Clothing, category_Electronics, category_Furniture, color_target_encoded, price\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/classification_metrics", "title": "Метрики классификации", "topic": "classification_metrics", "cheatsheet": "classification_metrics_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Метрики классификации\n\n## Задание\n\nДан файл `input.csv` с результатами бинарного классификатора (40 объектов):\n\n- `y_true` — истинный класс (0 или 1)\n- `y_pred` — предсказанный класс (порог 0.5)\n- `y_score` — предсказанная вероятность класса 1\n\nВычислите:\n\n1. **accuracy** — доля верных ответов\n2. **precision** — точность для класса 1\n3. **recall** — полнота для класса 1\n4. **f1** — F1-мера\n5. **roc_auc** — площадь под ROC-кривой (по `y_score`, а не по `y_pred`!)\n\n## Подсказки\n\n- Сначала постройте матрицу ошибок (TP, FP, FN, TN) и посчитайте метрики по формулам.\n- precision = TP / (TP + FP), recall = TP / (TP + FN), F1 = 2·P·R / (P + R).\n- Для ROC-AUC нужны вероятности, а не метки классов.\n\n## Ожидаемый формат выходного файла\n\nCSV с одной строкой и колонками: `accuracy, precision, recall, f1, roc_auc` (округлить до 4 знаков).\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/classification_metrics\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}, {"id": "exercises/cnn_basics", "title": "Свёртка, ReLU и max pooling вручную", "topic": "cnn_basics", "cheatsheet": "cnn_basics_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Свёртка, ReLU и max pooling вручную\n\n## Задание\n\nФайл `input.csv` — изображение 7×7 (строки — ряды пикселей, колонки `c0…c6`).\nСлева светлая часть, справа тёмная — вертикальная граница.\n\n1. Примените свёртку с ядром — детектором вертикальных границ:\n\n   ```\n   [[1, 0, -1],\n    [1, 0, -1],\n    [1, 0, -1]]\n   ```\n\n   без дополнения нулями (padding = 0) и с шагом 1. Как во всех DL-фреймворках, ядро **не переворачивается**\n   (это кросс-корреляция): out[i, j] = Σₘ Σₙ img[i + m, j + n] · K[m, n]. Размер выхода: 5×5.\n2. Примените **ReLU** к результату.\n3. Примените **max pooling** 2×2 с шагом 2 к карте после ReLU. Неполные окна (последняя строка и столбец)\n   отбрасываются, как в `nn.MaxPool2d` по умолчанию, — получится 2×2.\n\n## Подсказки\n\n- Размер выхода свёртки: (7 − 3) / 1 + 1 = 5.\n- Где отклик сильнее всего и какого он знака? Ядро вычитает правый столбец окна из левого:\n  слева светлее — положительный отклик, слева темнее — отрицательный (и его обнулит ReLU).\n- Сделайте сначала через два цикла, потом — через `numpy.lib.stride_tricks.sliding_window_view`.\n\n## Ожидаемый формат выходного файла\n\nCSV в «длинном» формате с колонками `stage, i, j, value`:\nсначала все 25 значений `conv` (по строкам: i — строка, j — столбец), затем 25 значений `relu`,\nзатем 4 значения `pool`. Значения — целые числа.\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/cnn_basics\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}, {"id": "exercises/cross_validation", "title": "Кросс-валидация", "topic": "cross_validation", "cheatsheet": "cross_validation_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Кросс-валидация\n\n## Задание\n\nДан файл `input.csv` с признаками `x1, x2, x3, x4` и целевой переменной `y` (100 объектов).\n\n1. Разбейте данные с помощью `KFold(n_splits=5, shuffle=True, random_state=42)`\n2. На каждом фолде обучите `Ridge(alpha=1.0)` и посчитайте **R²** на валидационной части\n3. Сохраните R² каждого фолда\n\n## Подсказки\n\n- Можно написать цикл по `kf.split(X)` вручную, а можно использовать `cross_val_score` с `cv=kf`.\n  Результаты должны совпасть — проверьте!\n- Посчитайте среднее и стандартное отклонение R² по фолдам. Что говорит большой разброс?\n\n## Ожидаемый формат выходного файла\n\nCSV с колонками `fold, r2` — 5 строк, `fold` от 1 до 5, `r2` округлить до 4 знаков.\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/cross_validation\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}, {"id": "exercises/data_preprocessing_missing_encoding", "title": "Обработка пропущенных значений и кодирование", "topic": "data_preprocessing_missing_encoding", "cheatsheet": "data_preprocessing_missing_encoding_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "task.md"], "task": "# Упражнение: Обработка пропущенных значений и кодирование\n\n## Задание\n\nДан файл `input.csv` с данными о сотрудниках, содержащий пропущенные значения. Необходимо:\n\n1. Удалить колонку 'name' (она не используется для анализа)\n\n2. Заполнить пропущенные значения:\n   - Для числовых колонок (age, salary, experience) использовать **среднее значение** (mean) существующих значений\n   - Для категориальной колонки (city) использовать **моду** (наиболее частое значение)\n\n3. Применить One-Hot Encoding к колонке 'city'\n   - Создать бинарные колонки для каждого уникального города\n   - Порядок колонок: Moscow, SPB (алфавитный порядок)\n\n4. Сохранить результат с колонками: age, salary, experience, city_Moscow, city_SPB\n\n## Правила заполнения пропусков\n\n- Mean округляется до целых для age и experience, до 2 знаков после запятой для salary\n- Мода для city: выбирается наиболее частое значение\n\n## Правила One-Hot Encoding\n\n- city_Moscow: 1 если город Moscow, иначе 0\n- city_SPB: 1 если город SPB, иначе 0\n\n## Ожидаемый формат выходного файла\n\nCSV файл с колонками: age, salary, experience, city_Moscow, city_SPB\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/decision_trees", "title": "Дерево решений: одобрение кредита", "topic": "decision_trees", "cheatsheet": "decision_trees_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Дерево решений: одобрение кредита\n\n## Задание\n\nДан файл `input.csv` с заявками на кредит:\n\n- `income` — доход, тыс., `debt` — текущий долг, тыс., `credit_years` — кредитная история, лет, `age` — возраст\n- `approved` — одобрен ли кредит (целевая переменная)\n- `split` — `train` или `test`\n\n1. Обучите `DecisionTreeClassifier(max_depth=3, random_state=42)` на train,\n   признаки: `income, debt, credit_years, age`\n2. Предскажите класс для test\n3. Посчитайте важность признаков (`feature_importances_`)\n\n## Подсказки\n\n- Деревьям не нужно масштабирование признаков — почему?\n- Нарисуйте дерево: `sklearn.tree.plot_tree` или `export_text` — правила легко прочитать.\n- Сравните accuracy на train и test при `max_depth=3` и без ограничения глубины: где переобучение?\n\n## Ожидаемый формат выходного файла\n\nCSV с колонками `id, approved_pred` для тестовых строк в исходном порядке.\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/decision_trees\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}, {"id": "exercises/dimensionality_reduction", "title": "Снижение размерности (Dimensionality Reduction)", "topic": "dimensionality_reduction", "cheatsheet": "dimensionality_reduction_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "task.md"], "task": "# Упражнение: Снижение размерности (Dimensionality Reduction)\n\n## Задание\n\nДан файл `input.csv` с 4-мерными данными. Необходимо:\n\n1. Применить **PCA (Principal Component Analysis)** для снижения размерности до 2 компонент\n\n2. Использовать StandardScaler перед применением PCA (центрирование и масштабирование)\n\n3. Сохранить результат: id и две главные компоненты (PC1, PC2)\n\n## Алгоритм PCA\n\n1. Стандартизировать данные: z = (x - μ) / σ\n2. Вычислить ковариационную матрицу\n3. Найти собственные векторы и собственные значения\n4. Выбрать топ-2 собственных вектора (с наибольшими собственными значениями)\n5. Спроецировать данные на эти векторы\n\n## Примечание\n\nИспользуйте библиотеку sklearn для реализации:\n- StandardScaler для стандартизации\n- PCA(n_components=2) для снижения размерности\n\nОкруглите результаты до 4 знаков после запятой.\n\n## Ожидаемый формат выходного файла\n\nCSV файл с колонками: id, PC1, PC2\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/feature_selection/exercise1_variance_threshold", "title": "Упражнение 1: Удаление низкодисперсных признаков (Variance Threshold)", "topic": "feature_selection", "cheatsheet": "feature_selection_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "task.md"], "task": "# Упражнение 1: Удаление низкодисперсных признаков (Variance Threshold)\n\n## Задание\n\nДан файл `input.csv` с набором признаков. Необходимо:\n\n1. Вычислить **дисперсию** для каждого признака (feature1-feature6)\n\n2. Удалить признаки с дисперсией **меньше 0.5**\n\n3. Сохранить результат в виде названий оставшихся признаков в алфавитном порядке\n\n## Формула дисперсии\n\nσ² = Σ(x - x̄)² / n\n\nгде:\n- x - значения признака\n- x̄ - среднее значение\n- n - количество наблюдений\n\n## Алгоритм\n\n1. Вычислить дисперсию каждого признака\n2. Отобрать признаки с дисперсией >= 0.5\n3. Отсортировать названия признаков в алфавитном порядке\n\n## Ожидаемый формат выходного файла\n\nCSV файл с одной колонкой 'feature', содержащей названия оставшихся признаков:\n```\nfeature\nfeature1\nfeature3\nfeature5\n```\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/feature_selection/exercise2_mutual_information", "title": "Упражнение 2: Выбор признаков с помощью Mutual Information", "topic": "feature_selection", "cheatsheet": "feature_selection_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "task.md"], "task": "# Упражнение 2: Выбор признаков с помощью Mutual Information\n\n## Задание\n\nДан файл `input.csv` с признаками и целевой переменной для задачи классификации. Необходимо:\n\n1. Вычислить **Mutual Information** между каждым признаком (feature1-feature5) и целевой переменной (target)\n\n2. Выбрать **топ-3 признака** с наибольшими значениями MI\n\n3. Сохранить результат в виде названий выбранных признаков в порядке убывания MI\n\n## Что такое Mutual Information?\n\nMutual Information (взаимная информация) измеряет, насколько знание одной переменной уменьшает неопределенность другой. \nЗначения MI всегда неотрицательные: MI = 0 означает независимость переменных.\n\n## Алгоритм\n\n1. Использовать `sklearn.feature_selection.mutual_info_classif` с параметром `random_state=42`\n2. Отобрать топ-3 признака с максимальными значениями MI\n3. Отсортировать по убыванию MI\n\n## Ожидаемый формат выходного файла\n\nCSV файл с одной колонкой 'feature', содержащей названия выбранных признаков:\n```\nfeature\nfeature3\nfeature1\nfeature5\n```\n\n## Примечание\n\nДля получения однозначного результата используйте `random_state=42` при вычислении mutual information.\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/feature_selection/exercise3_rfe", "title": "Упражнение 3: Рекурсивное удаление признаков (RFE)", "topic": "feature_selection", "cheatsheet": "feature_selection_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "task.md"], "task": "# Упражнение 3: Рекурсивное удаление признаков (RFE)\n\n## Задание\n\nДан файл `input.csv` с признаками и целевой переменной для задачи классификации. Необходимо:\n\n1. Применить **RFE (Recursive Feature Elimination)** с Random Forest для выбора **топ-3 признаков**\n\n2. Сохранить результат в виде названий выбранных признаков в алфавитном порядке\n\n## Что такое RFE?\n\nRFE (Recursive Feature Elimination) - это метод выбора признаков, который:\n1. Обучает модель на всех признаках\n2. Удаляет наименее важный признак (по важности модели)\n3. Повторяет процесс, пока не останется нужное количество признаков\n\n## Алгоритм\n\n1. Использовать `sklearn.feature_selection.RFE` с оценщиком `RandomForestClassifier`\n2. Параметры:\n   - `n_features_to_select=3` - выбрать 3 признака\n   - `random_state=42` для RandomForestClassifier\n   - `n_estimators=100` для RandomForestClassifier\n3. Отсортировать выбранные признаки в алфавитном порядке\n\n## Ожидаемый формат выходного файла\n\nCSV файл с одной колонкой 'feature', содержащей названия выбранных признаков:\n```\nfeature\nfeature1\nfeature2\nfeature5\n```\n\n## Примечание\n\nДля получения однозначного результата используйте указанные параметры.\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/feature_selection/exercise4_lasso", "title": "Упражнение 4: Выбор признаков с помощью Lasso (L1 регуляризация)", "topic": "feature_selection", "cheatsheet": "feature_selection_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "task.md"], "task": "# Упражнение 4: Выбор признаков с помощью Lasso (L1 регуляризация)\n\n## Задание\n\nДан файл `input.csv` с признаками и целевой переменной для задачи регрессии. Необходимо:\n\n1. Применить **Lasso регрессию** (L1 регуляризация) для выбора признаков\n\n2. Выбрать признаки с **ненулевыми коэффициентами**\n\n3. Сохранить результат в виде названий выбранных признаков в алфавитном порядке\n\n## Что такое Lasso?\n\nLasso (Least Absolute Shrinkage and Selection Operator) - это метод регрессии с L1 регуляризацией, который:\n- Автоматически выполняет выбор признаков\n- Устанавливает коэффициенты незначимых признаков точно в 0\n- Помогает создавать разреженные модели\n\n## Алгоритм\n\n1. Стандартизировать все признаки с помощью `StandardScaler` (fit_transform на всех данных)\n2. Использовать `sklearn.linear_model.Lasso` с параметрами:\n   - `alpha=0.1` - коэффициент регуляризации\n   - `random_state=42`\n3. Обучить Lasso на стандартизированных данных\n4. Отобрать признаки, у которых коэффициенты точно не равны 0 (использовать `!= 0`)\n5. Отсортировать в алфавитном порядке\n\n## Ожидаемый формат выходного файла\n\nCSV файл с одной колонкой 'feature', содержащей названия выбранных признаков:\n```\nfeature\nfeature1\nfeature3\nfeature4\n```\n\n## Примечание\n\nОбязательно стандартизируйте данные перед применением Lasso!\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/feature_selection/exercise5_tree_importance", "title": "Упражнение 5: Выбор признаков по важности дерева (Tree-based Importance)", "topic": "feature_selection", "cheatsheet": "feature_selection_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "task.md"], "task": "# Упражнение 5: Выбор признаков по важности дерева (Tree-based Importance)\n\n## Задание\n\nДан файл `input.csv` с признаками и целевой переменной для задачи классификации. Необходимо:\n\n1. Обучить **Random Forest** и получить важность признаков (feature importance)\n\n2. Выбрать **топ-4 признака** с наибольшей важностью\n\n3. Сохранить результат в виде названий выбранных признаков в порядке убывания важности\n\n## Что такое Feature Importance?\n\nFeature Importance (важность признаков) в древовидных моделях показывает, насколько каждый признак полезен для построения дерева решений. Вычисляется на основе среднего уменьшения Gini impurity.\n\n## Алгоритм\n\n1. Использовать `sklearn.ensemble.RandomForestClassifier` с параметрами:\n   - `n_estimators=100`\n   - `random_state=42`\n2. Обучить модель и получить `feature_importances_`\n3. Выбрать топ-4 признака с максимальной важностью\n4. Отсортировать по убыванию важности\n\n## Ожидаемый формат выходного файла\n\nCSV файл с одной колонкой 'feature', содержащей названия выбранных признаков:\n```\nfeature\nfeature3\nfeature1\nfeature5\nfeature2\n```\n\n## Примечание\n\nДля получения однозначного результата используйте `random_state=42`.\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/feature_selection/exercise6_remove_correlated", "title": "Упражнение 6: Удаление коррелирующих признаков", "topic": "feature_selection", "cheatsheet": "feature_selection_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "task.md"], "task": "# Упражнение 6: Удаление коррелирующих признаков\n\n## Задание\n\nДан файл `input.csv` с признаками. Необходимо:\n\n1. Вычислить **корреляционную матрицу** признаков (feature1-feature6)\n\n2. Удалить признаки, которые имеют **корреляцию > 0.8** с другими признаками\n\n3. Сохранить результат в виде названий оставшихся признаков в алфавитном порядке\n\n## Зачем удалять коррелирующие признаки?\n\nВысококоррелирующие признаки:\n- Содержат избыточную информацию\n- Могут вызывать мультиколлинеарность\n- Замедляют обучение модели\n- Усложняют интерпретацию\n\n## Алгоритм\n\n1. Вычислить матрицу корреляции Пирсона между всеми признаками\n2. Рассмотреть только верхний треугольник матрицы (без диагонали)\n3. Для каждой пары признаков с |корреляцией| > 0.8:\n   - Удалить признак, который идет позже по алфавиту (второй в паре)\n   - Например: если feature1 коррелирует с feature3, удаляем feature3\n4. Отсортировать оставшиеся признаки в алфавитном порядке\n\n## Пример\n\nЕсли feature1 и feature3 имеют корреляцию 0.85:\n- Удаляем feature3 (т.к. она позже по алфавиту)\n\n## Ожидаемый формат выходного файла\n\nCSV файл с одной колонкой 'feature', содержащей названия оставшихся признаков:\n```\nfeature\nfeature1\nfeature2\nfeature5\n```\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/feature_selection/exercise7_correlation_target", "title": "Выбор признаков (Feature Selection)", "topic": "feature_selection", "cheatsheet": "feature_selection_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "task.md"], "task": "# Упражнение: Выбор признаков (Feature Selection)\n\n## Задание\n\nДан файл `input.csv` с данными для бинарной классификации. Необходимо:\n\n1. Вычислить **корреляцию Пирсона** между каждым признаком (feature1-feature5) и целевой переменной (target)\n\n2. Выбрать **топ-3 признака** с наибольшей абсолютной корреляцией с target\n\n3. Сохранить результат в виде названий выбранных признаков в порядке убывания абсолютной корреляции\n\n## Формула корреляции Пирсона\n\nr = Σ((x - x̄)(y - ȳ)) / √(Σ(x - x̄)² × Σ(y - ȳ)²)\n\nгде:\n- x - значения признака\n- y - значения target\n- x̄, ȳ - средние значения\n\n## Алгоритм\n\n1. Вычислить корреляцию каждого признака с target\n2. Взять абсолютное значение корреляций\n3. Выбрать топ-3 признака с максимальной абсолютной корреляцией\n4. Отсортировать по убыванию абсолютной корреляции\n\n## Ожидаемый формат выходного файла\n\nCSV файл с одной колонкой 'feature', содержащей названия выбранных признаков:\n```\nfeature\nfeature2\nfeature1\nfeature4\n```\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/gradient_boosting_regression", "title": "Градиентный бустинг: прокат велосипедов", "topic": "gradient_boosting_regression", "cheatsheet": "gradient_boosting_regression_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Градиентный бустинг: прокат велосипедов\n\n## Задание\n\nДан файл `input.csv` с данными о прокате велосипедов по часам:\n\n- `temperature` — температура, °C, `hour` — час дня (0–23), `weekend` — выходной (1) или будний (0),\n  `humidity` — влажность, %\n- `rides` — число поездок (целевая переменная)\n- `split` — `train` или `test`\n\nЗависимость нелинейная: утренний и вечерний пик в будни, комфортная температура около 22 °C.\n\n1. Обучите `GradientBoostingRegressor(n_estimators=100, learning_rate=0.1, max_depth=3, random_state=42)`\n   на train, признаки: `temperature, hour, weekend, humidity`\n2. Предскажите `rides` для test\n\n## Подсказки\n\n- Сравните RMSE бустинга и `LinearRegression` на тесте — насколько выигрывает нелинейная модель?\n- Поэкспериментируйте с `learning_rate` и `n_estimators`: как они связаны?\n\n## Ожидаемый формат выходного файла\n\nCSV с колонками `id, rides_pred` для тестовых строк в исходном порядке; `rides_pred` округлить до 2 знаков.\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/gradient_boosting_regression\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}, {"id": "exercises/imbalanced_data", "title": "Балансировка классов (Imbalanced Data)", "topic": "imbalanced_data", "cheatsheet": "imbalanced_data_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "task.md"], "task": "# Упражнение: Балансировка классов (Imbalanced Data)\n\n## Задание\n\nДан файл `input.csv` с несбалансированными данными для бинарной классификации. Необходимо:\n\n1. Определить количество образцов в каждом классе (class 0 и class 1)\n\n2. Применить **Random Oversampling** для меньшинства класса (class 1):\n   - Случайно дублировать образцы из класса 1 до достижения баланса\n   - Использовать random_state=42 для воспроизводимости\n\n3. После балансировки класс 1 должен иметь столько же образцов, сколько класс 0\n\n4. Сохранить результат: отсортировать по id, затем по всем признакам\n\n## Метод Random Oversampling\n\n1. Посчитать количество образцов в большинстве классе (class 0)\n2. Случайным образом выбрать образцы из меньшинства класса (class 1) с повторением\n3. Добавить дублированные образцы к исходным данным\n4. Использовать random_state=42 для np.random.seed()\n\n## Ожидаемый формат выходного файла\n\nCSV файл с колонками: id, feature1, feature2, feature3, class\n\nНовые дублированные строки должны иметь новые id, начиная с максимального id + 1.\nРезультат должен быть отсортирован по id.\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/linreg", "title": "Линейная регрессия: цена квартиры", "topic": "linreg", "cheatsheet": "linreg_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Линейная регрессия: цена квартиры\n\n## Задание\n\nДан файл `input.csv` с данными о квартирах:\n\n- `area` — площадь, м², `rooms` — число комнат, `age` — возраст дома, лет,\n  `distance` — расстояние до центра, км\n- `price` — цена, тыс. у.е. (целевая переменная)\n- `split` — `train` (обучающая выборка) или `test` (тестовая)\n\n1. Обучите `LinearRegression` (параметры по умолчанию) на строках `train`,\n   признаки: `area, rooms, age, distance`\n2. Сделайте предсказания для строк `test`\n\n## Подсказки\n\n- Не используйте тестовые строки при обучении — это утечка данных.\n- Посмотрите на коэффициенты модели (`model.coef_`): какой признак сильнее всего влияет на цену и с каким знаком?\n- Посчитайте RMSE на тесте — пригодится упражнение `regression_metrics`.\n\n## Ожидаемый формат выходного файла\n\nCSV с колонками `id, price_pred` для тестовых строк в исходном порядке; `price_pred` округлить до 2 знаков.\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/linreg\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}, {"id": "exercises/logreg", "title": "Логистическая регрессия: отток клиентов", "topic": "logreg", "cheatsheet": "logreg_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Логистическая регрессия: отток клиентов\n\n## Задание\n\nДан файл `input.csv` с данными о клиентах телеком-оператора:\n\n- `tenure` — сколько месяцев клиент с компанией, `monthly_charge` — ежемесячный платёж,\n  `support_calls` — число обращений в поддержку, `age` — возраст\n- `churn` — ушёл ли клиент (1) или остался (0) — целевая переменная\n- `split` — `train` или `test`\n\n1. Масштабируйте признаки `tenure, monthly_charge, support_calls, age` с помощью `StandardScaler`,\n   **обучив его только на train**\n2. Обучите `LogisticRegression(C=1.0, max_iter=1000)` на train\n3. Для test посчитайте вероятность оттока и предсказанный класс (порог 0.5)\n\n## Подсказки\n\n- `scaler.fit_transform(train)`, но `scaler.transform(test)` — почему так?\n- Вероятность класса 1: `model.predict_proba(X)[:, 1]`.\n- Посмотрите на знаки коэффициентов: что увеличивает вероятность ухода?\n\n## Ожидаемый формат выходного файла\n\nCSV с колонками `id, churn_proba, churn_pred` для тестовых строк в исходном порядке;\n`churn_proba` округлить до 4 знаков.\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/logreg\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}, {"id": "exercises/loss_functions", "title": "Softmax и кросс-энтропия (численно устойчиво)", "topic": "loss_functions", "cheatsheet": "loss_functions_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Softmax и кросс-энтропия (численно устойчиво)\n\n## Задание\n\nДан файл `input.csv` с логитами модели для трёх классов (`z0, z1, z2`) и истинным классом `y`.\n\n1. Вычислите вероятности классов **softmax**: pₖ = e^zₖ / Σⱼ e^zⱼ\n2. Вычислите **кросс-энтропию** для каждого объекта: loss = −log p_y\n3. Определите предсказанный класс `pred` — argmax вероятностей\n\nВнимание: в строках 4 и 8 логиты очень большие по модулю (±1000). Наивная формула даст переполнение\n(`inf`, `nan`). Используйте устойчивые приёмы:\n\n- softmax: вычтите максимум логита в строке перед экспонентой — результат не изменится;\n- loss: −log p_y = logsumexp(z) − z_y, где logsumexp(z) = max(z) + log Σ e^(z − max(z)).\n\n## Подсказки\n\n- Попробуйте сначала наивную формулу на строке 4 и посмотрите, что получится.\n- В PyTorch именно поэтому `nn.CrossEntropyLoss` принимает логиты, а не вероятности.\n\n## Ожидаемый формат выходного файла\n\nCSV с колонками `id, p0, p1, p2, loss, pred`; вероятности и loss округлить до 4 знаков.\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/loss_functions\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}, {"id": "exercises/mlp", "title": "Прямой проход многослойного перцептрона", "topic": "mlp", "cheatsheet": "mlp_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md", "weights.json"], "task": "# Упражнение: Прямой проход многослойного перцептрона\n\n## Задание\n\nДана обученная сеть 2 → 3 → 1. Веса лежат в `weights.json`:\n\n- `W1` — матрица 3×2 (строка = нейрон скрытого слоя), `b1` — 3 смещения, активация **tanh**;\n- `W2` — матрица 1×3, `b2` — 1 смещение, выход — **sigmoid**.\n\nДля каждой строки `input.csv` (`x1, x2`) вычислите:\n\n1. Скрытый слой: h = tanh(W1·x + b1) → `h1, h2, h3`\n2. Выход: p = σ(W2·h + b2) → вероятность класса 1\n3. Предсказание `pred` = 1, если p ≥ 0.5, иначе 0\n\n## Подсказки\n\n- Обработайте все строки разом матрично: H = tanh(X·W1ᵀ + b1), где X — матрица n×2.\n- `json.load(open('weights.json'))` → словарь со списками; превратите их в `np.array`.\n- Сколько параметров у этой сети? (Ответ: 3·2 + 3 + 1·3 + 1 = 13.)\n\n## Ожидаемый формат выходного файла\n\nCSV с колонками `id, h1, h2, h3, p, pred`; значения округлить до 4 знаков.\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/mlp\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}, {"id": "exercises/optimizers", "title": "SGD, Momentum и Adam на «овраге»", "topic": "optimizers", "cheatsheet": "optimizers_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: SGD, Momentum и Adam на «овраге»\n\n## Задание\n\nМинимизируйте функцию f(x, y) = x² + 10·y² (вытянутый «овраг», минимум в (0, 0))\nтремя оптимизаторами с параметрами из `input.csv`. Старт — точка **(−2, 1.5)**, ровно **50 шагов**.\nГрадиент: ∇f = (2x, 20y).\n\nФормулы (θ — вектор (x, y), g — градиент в текущей точке, t — номер шага с 1):\n\n- **sgd**: θ ← θ − lr·g\n- **momentum**: v ← β₁·v + g, θ ← θ − lr·v (v₀ = 0)\n- **adam**: m ← β₁·m + (1 − β₁)·g, s ← β₂·s + (1 − β₂)·g²,\n  m̂ = m / (1 − β₁ᵗ), ŝ = s / (1 − β₂ᵗ), θ ← θ − lr·m̂ / (√ŝ + eps) (m₀ = s₀ = 0)\n\n## Подсказки\n\n- Сохраняйте траекторию и нарисуйте её поверх линий уровня f — сравните пути оптимизаторов.\n- Почему SGD с lr = 0.11 расходится? (Подсказка: устойчивость по y требует lr < 2/20.)\n- То же самое можно увидеть в интерактиве «Градиентный спуск» в портале.\n- Не удивляйтесь, если SGD окажется ближе к минимуму: на гладкой квадратичной функции с хорошо подобранным lr\n  он очень эффективен. Momentum «проскакивает» минимум по инерции, а Adam делает шаги ~lr по каждой оси\n  и колеблется вблизи минимума. Преимущества Adam видны на шумных градиентах и плохо масштабированных параметрах.\n\n## Ожидаемый формат выходного файла\n\nCSV с колонками `optimizer, x, y, loss` — по строке на оптимизатор в порядке input.csv;\nx, y, loss после 50 шагов, округлить до 4 знаков.\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/optimizers\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}, {"id": "exercises/outliers_handling", "title": "Обработка выбросов (Outliers Handling)", "topic": "outliers_handling", "cheatsheet": "outliers_handling_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "task.md"], "task": "# Упражнение: Обработка выбросов (Outliers Handling)\n\n## Задание\n\nДан файл `input.csv` с данными, содержащими выбросы. Необходимо:\n\n1. Для каждого признака (feature1, feature2, feature3) определить выбросы методом **IQR (Interquartile Range)**\n\n2. Удалить строки, содержащие выбросы хотя бы в одном из признаков\n\n3. Сохранить только колонку 'id' оставшихся строк\n\n## Метод IQR для определения выбросов\n\n1. Вычислить Q1 (25-й перцентиль) и Q3 (75-й перцентиль)\n2. Вычислить IQR = Q3 - Q1\n3. Определить границы:\n   - Нижняя граница = Q1 - 1.5 × IQR\n   - Верхняя граница = Q3 + 1.5 × IQR\n4. Значения вне этих границ считаются выбросами\n\n## Ожидаемый формат выходного файла\n\nCSV файл с одной колонкой: id\n\nТолько те id, где все признаки находятся в допустимых пределах (без выбросов)\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/preprocessing", "title": "Предобработка данных (Preprocessing)", "topic": "preprocessing", "cheatsheet": "preprocessing_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Предобработка данных (Preprocessing)\n\n## Задание\n\nДан файл `input.csv` с данными о клиентах. Необходимо выполнить следующие шаги предобработки:\n\n1. Разделить данные на признаки (X) и целевую переменную (y)\n   - Признаки: age, income, education\n   - Целевая переменная: purchased\n\n2. Применить StandardScaler к числовым признакам (age, income)\n\n3. Применить LabelEncoder к категориальному признаку (education)\n\n4. Сохранить преобразованные данные в формате: age_scaled, income_scaled, education_encoded\n\n## Формула StandardScaler\n\nz = (x - μ) / σ\n\nгде:\n- μ = среднее значение\n- σ = стандартное отклонение\n\n## Формула LabelEncoder\n\nДля education: Bachelor=0, Master=1, PhD=2 (в алфавитном порядке)\n\n## Ожидаемый формат выходного файла\n\nCSV файл с колонками: age_scaled, income_scaled, education_encoded (округление до 4 знаков после запятой)\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/regression_metrics", "title": "Метрики регрессии", "topic": "regression_metrics", "cheatsheet": "regression_metrics_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Метрики регрессии\n\n## Задание\n\nДан файл `input.csv` с истинными значениями `y_true` и предсказаниями модели `y_pred` (30 объектов).\n\nВычислите метрики качества регрессии:\n\n1. **MAE** — средняя абсолютная ошибка\n2. **MSE** — средняя квадратичная ошибка\n3. **RMSE** — корень из MSE\n4. **R²** — коэффициент детерминации\n5. **MAPE** — средняя абсолютная процентная ошибка **в процентах** (т.е. умноженная на 100)\n\n## Формулы\n\n- MAE = mean(|y − ŷ|)\n- MSE = mean((y − ŷ)²)\n- RMSE = √MSE\n- R² = 1 − Σ(y − ŷ)² / Σ(y − ȳ)²\n- MAPE = 100 · mean(|y − ŷ| / |y|)\n\n## Подсказки\n\n- Попробуйте сначала посчитать метрики вручную через NumPy, а потом сверить с `sklearn.metrics`.\n- Подумайте: почему RMSE всегда ≥ MAE? Когда они равны?\n\n## Ожидаемый формат выходного файла\n\nCSV с одной строкой и колонками: `mae, mse, rmse, r2, mape` (округлить до 4 знаков).\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/regression_metrics\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}, {"id": "exercises/scaling_normalization", "title": "Масштабирование и нормализация", "topic": "scaling_normalization", "cheatsheet": "scaling_normalization_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Масштабирование и нормализация\n\n## Задание\n\nДан файл `input.csv` с данными о людях. Необходимо применить различные методы масштабирования:\n\n1. **MinMaxScaler** для признака 'height':\n   - Масштабировать значения в диапазон [0, 1]\n\n2. **StandardScaler** для признака 'weight':\n   - Стандартизировать с использованием среднего и стандартного отклонения\n\n3. **RobustScaler** для признака 'age':\n   - Использовать медиану и IQR для масштабирования\n\n4. **MaxAbsScaler** для признака 'income':\n   - Масштабировать делением на максимальное абсолютное значение\n\n5. Сохранить результат с колонками: height_minmax, weight_standard, age_robust, income_maxabs\n\nВсе значения округлить до 4 знаков после запятой.\n\n## Формулы\n\n**MinMaxScaler:** x_scaled = (x - min) / (max - min)\n\n**StandardScaler:** x_scaled = (x - mean) / std\n\n**RobustScaler:** x_scaled = (x - median) / IQR, где IQR = Q3 - Q1\n\n**MaxAbsScaler:** x_scaled = x / max(abs(x))\n\n## Ожидаемый формат выходного файла\n\nCSV файл с колонками: height_minmax, weight_standard, age_robust, income_maxabs (округлено до 4 знаков)\n\n## Ответ\n\nРезультат должен находиться в файле `answer.csv`\n"}, {"id": "exercises/self_attention", "title": "Scaled dot-product attention", "topic": "self_attention", "cheatsheet": "self_attention_cheatsheet.html", "files": ["answer.csv", "exercise.ipynb", "input.csv", "solution.py", "task.md"], "task": "# Упражнение: Scaled dot-product attention\n\n## Задание\n\nВ файле `input.csv` — 4 токена и уже посчитанные для них векторы запроса, ключа и значения\n(размерность d = 3): колонки `q0..q2`, `k0..k2`, `v0..v2`.\n\nВычислите self-attention:\n\n1. Оценки сходства: S = Q·Kᵀ / √d (матрица 4×4)\n2. Веса внимания: A = softmax(S) **по строкам** (каждая строка — распределение по всем токенам)\n3. Выход: O = A·V (матрица 4×3)\n\n## Подсказки\n\n- Не забудьте деление на √d и устойчивый softmax (вычитание максимума строки).\n- Сумма каждой строки A должна быть равна 1 — проверьте.\n- Бонус: примените каузальную маску (токен i видит только токены ≤ i): до softmax поставьте −∞\n  в верхний треугольник S. Так работает декодер GPT. В ответ это не входит.\n\n## Ожидаемый формат выходного файла\n\nCSV с колонками `token, w0, w1, w2, w3, o0, o1, o2`: веса внимания токена ко всем четырём токенам\nи его выходной вектор. Значения округлить до 4 знаков.\n\n## Проверка\n\nСохраните свой результат в `my_answer.csv` (в папке упражнения) и выполните из корня репозитория:\n\n```bash\npython tools/check_exercise.py exercises/self_attention\n```\n\nЭталонное решение с пояснениями — `solution.py` (загляните в него только после своей попытки).\n"}], "titles": {"preprocessing_cheatsheet.html": "Предобработка данных (Preprocessing)", "data_preprocessing_missing_encoding_cheatsheet.html": "Data Preprocessing (missing values, encoding)", "outliers_handling_cheatsheet.html": "Обработка выбросов", "categorical_encodi ": "Inductive logic programming", "program_synthesis_ml_cheatsheet.html": "Program synthesis", "material_informatics_cheatsheet.html": "Материальные информатики", "material_properties_ml_cheatsheet.html": "Свойства материалов и ML", "material_design_cheatsheet.html": "Дизайн материалов", "automl_cheatsheet.html": "AutoML: Полный обзор", "ensemble_methods_voting_stacking_cheatsheet.html": "Ensemble Methods: Voting & Stacking", "multi_task_learning_cheatsheet.html": "Multi-task Learning"}, "quizzes": {"feature_selection_cheatsheet.html": "feature_selection_test.html"}, "questions": {"1d_3d_cnn_cheatsheet.html": [{"q": "Для каких данных используют 1D-CNN?", "a": "Для последовательностей: временные ряды, сигналы датчиков, аудио, текст (по эмбеддингам). Ядро скользит только вдоль времени, а все каналы (признаки) обрабатываются вместе."}, {"q": "Чем 1D-CNN лучше и хуже RNN для временных рядов?", "a": "Лучше: параллельные вычисления, стабильное обучение, хорошее выделение локальных паттернов. Хуже: рецептивное поле ограничено и растёт лишь с глубиной, ядром и dilation, поэтому длинные зависимости требуют специальной архитектуры (TCN)."}, {"q": "Для чего нужны 3D-свёртки?", "a": "Для объёмных данных и видео: ядро k×k×k скользит по трём измерениям (время/глубина и пространство), что позволяет учить пространственно-временные признаки, например движение в видео или структуры в КТ/МРТ."}, {"q": "Посчитайте число параметров свёртки 3×3×3 с 16 входными и 32 выходными каналами.", "a": "3·3·3·16·32 + 32 (bias) = 13824 + 32 = 13856. Ядро 3D втрое «толще» 2D-ядра 3×3, поэтому параметров втрое больше."}, {"q": "Почему 3D-CNN дорогие и как это облегчают?", "a": "Вычисления и память растут с дополнительным измерением, а видео-данных для обучения мало. Используют факторизацию (2+1)D — пространственная 2D-свёртка плюс временная 1D, а также инициализацию из 2D-сетей (I3D, «inflating»)."}], "3d_computer_vision_cheatsheet.html": [{"q": "Какие основные представления 3D-данных используют в нейросетях?", "a": "Воксели (3D-сетка), облака точек, полигональные сетки (mesh), карты глубины и многоракурсные изображения, а также неявные представления — функции расстояния (SDF) и нейронные поля (NeRF)."}, {"q": "Почему для облаков точек нельзя просто применить обычную свёртку?", "a": "Облако точек — неупорядоченное и нерегулярное множество: нет сетки, а порядок точек произволен. Сеть должна быть инвариантна к перестановке точек; PointNet добивается этого общим MLP для каждой точки и симметричной агрегацией (max pooling)."}, {"q": "Как получить глубину по двум изображениям (стерео)?", "a": "Найти соответствующие точки на левом и правом изображении и измерить их смещение — диспаратность d. Глубина Z = f·B / d, где f — фокусное расстояние, B — расстояние между камерами. Чем больше диспаратность, тем ближе объект."}, {"q": "Что такое NeRF?", "a": "Нейросеть, которая по 3D-координате и направлению взгляда предсказывает цвет и плотность. Изображение с нового ракурса получается объёмным рендерингом вдоль лучей; сеть обучается по набору фотографий сцены с известными положениями камер."}, {"q": "Зачем нужна калибровка камеры?", "a": "Чтобы знать внутренние параметры (фокусное расстояние, главная точка, дисторсия) и внешние (положение и ориентация камеры). Без них нельзя корректно связать пиксели с 3D-координатами и измерять реальные расстояния."}], "activation_functions_cheatsheet.html": [{"q": "Почему сигмоида и tanh в глубоких сетях приводят к затуханию градиента?", "a": "Их производные малы: у сигмоиды не больше 0.25, а в зонах насыщения почти ноль. При обратном распространении градиенты перемножаются по слоям и для ранних слоёв становятся исчезающе малыми."}, {"q": "Чем ReLU лучше сигмоиды и какая у неё проблема?", "a": "ReLU(x) = max(0, x) быстро считается и не насыщается при x > 0 (производная равна 1), поэтому глубокие сети учатся быстрее. Проблема — «мёртвые нейроны»: если вход всегда отрицательный, градиент нулевой и нейрон больше не обучается."}, {"q": "Как Leaky ReLU и GELU решают проблемы ReLU?", "a": "Leaky ReLU даёт небольшой наклон при x < 0 (например, 0.01·x), и градиент не обнуляется. GELU — гладкая функция x·Φ(x), стандарт в трансформерах; она пропускает небольшие отрицательные значения."}, {"q": "Зачем нужен softmax и где его применяют?", "a": "Превращает вектор логитов в распределение вероятностей: softmax(zᵢ) = e^zᵢ / Σe^zⱼ — все значения положительны и в сумме дают 1. Применяют на выходе многоклассового классификатора и в механизме внимания."}, {"q": "Почему tanh часто предпочитали сигмоиде в скрытых слоях?", "a": "Tanh центрирована вокруг нуля (выходы от −1 до 1), а у сигмоиды выходы всегда положительны. Центрированные активации делают обновления весов следующего слоя менее смещёнными и ускоряют обучение."}], "active_learning_cheatsheet.html": [{"q": "В какой ситуации активное обучение особенно полезно?", "a": "Когда неразмеченных данных много, а разметка дорогая (медицинские снимки, юридические тексты). Модель сама выбирает, какие объекты отдать на разметку, чтобы достичь нужного качества меньшим числом меток."}, {"q": "Чем отличаются стратегии uncertainty sampling: least confidence, margin и entropy?", "a": "**Least confidence** берёт объекты с наименьшей максимальной вероятностью, **margin** — с наименьшей разницей между двумя лучшими классами, **entropy** — с максимальной энтропией по всем классам. В бинарной задаче все три выбирают одни и те же объекты."}, {"q": "Какая проблема возникает, если брать на разметку только самые неопределённые объекты?", "a": "Выбранные объекты часто похожи друг на друга (батч избыточен) и могут оказаться выбросами или шумом. Поэтому комбинируют неопределённость с **разнообразием** и репрезентативностью (кластеризация, core-set)."}, {"q": "Что такое query-by-committee?", "a": "Обучается несколько моделей (комитет, например на бутстреп-выборках), и на разметку отправляются объекты, на которых они **сильнее всего расходятся** (vote entropy, KL-разногласие)."}, {"q": "Почему размеченная активным обучением выборка не подходит как тестовая?", "a": "Её объекты отобраны не случайно, а смещены к трудным и пограничным случаям, поэтому метрика на ней не отражает качество на реальном распределении. Для оценки нужна отдельная случайно размеченная выборка."}], "actor_critic_cheatsheet.html": [{"q": "Какие роли у актора и критика?", "a": "**Актор** — политика π(a|s; θ), выбирающая действия. **Критик** — оценка V(s) или Q(s, a), которая говорит актору, насколько действие было лучше ожидаемого, и снижает дисперсию градиента политики."}, {"q": "Почему actor-critic обучается стабильнее, чем REINFORCE?", "a": "REINFORCE использует полный возврат Gₜ с огромной дисперсией. Actor-critic заменяет его на advantage A = r + γV(s′) − V(s), оценённый критиком: дисперсия меньше, хотя появляется смещение из-за неточного критика."}, {"q": "Зачем вычитать baseline и почему это не вносит смещения?", "a": "Вычитание b(s) не меняет ожидание градиента, потому что Eₐ[∇log π(a|s)·b(s)] = b(s)·∇∑π(a|s) = 0. При этом дисперсия падает, если b близко к V(s)."}, {"q": "Что такое GAE?", "a": "Generalized Advantage Estimation — экспоненциально взвешенная сумма TD-ошибок: Âₜ = ∑(γλ)ˡ δₜ₊ₗ. Параметр λ регулирует компромисс смещения и дисперсии: λ = 0 — одношаговый TD, λ = 1 — MC-оценка."}, {"q": "Чем A2C отличается от A3C?", "a": "A3C использует асинхронных параллельных рабочих, которые независимо обновляют общие параметры. A2C — синхронный вариант: ждёт всех рабочих и делает одно обновление по батчу; он проще, детерминированнее и лучше использует GPU, давая сравнимое качество."}], "adaboost_cheatsheet.html": [{"q": "Как AdaBoost меняет веса объектов между итерациями?", "a": "После обучения очередного слабого классификатора веса неверно классифицированных объектов увеличиваются, а верно классифицированных — уменьшаются (затем нормируются). Следующая модель сосредотачивается на «трудных» примерах."}, {"q": "Как вычисляется вес слабого классификатора и что будет при ошибке 0.5?", "a": "αₘ = ½·ln((1 − εₘ)/εₘ), где εₘ — взвешенная ошибка. При εₘ = 0.5 (случайное угадывание) α = 0, и модель ничего не вносит; при εₘ меньше 0.5 вес положителен и тем больше, чем точнее модель."}, {"q": "Посчитайте вес классификатора с взвешенной ошибкой 0.2.", "a": "α = ½·ln(0.8 / 0.2) = ½·ln 4 ≈ **0.693**. Веса ошибочных объектов умножатся на e^α = 2, а верных — на e^(−α) = 0.5 перед нормировкой."}, {"q": "Почему AdaBoost чувствителен к шуму в метках и выбросам?", "a": "Он минимизирует **экспоненциальную** функцию потерь exp(−y·F(x)), которая растёт очень быстро для объектов с большим отрицательным отступом. Неверно размеченные объекты получают экспоненциально растущие веса, и последующие модели тратятся на подгонку под шум."}, {"q": "Как AdaBoost связан с градиентным бустингом?", "a": "AdaBoost — частный случай градиентного бустинга (forward stagewise additive modeling) с экспоненциальной функцией потерь. Градиентный бустинг обобщает идею на любые дифференцируемые потери, например логистическую, менее чувствительную к выбросам."}], "adaptive_windowing_cheatsheet.html": [{"q": "В чём недостаток окна фиксированного размера?", "a": "Маленькое окно быстро реагирует на дрейф, но даёт шумные оценки в стабильные периоды; большое — стабильно, но долго «помнит» устаревшие данные после изменения. Подходящий размер заранее неизвестен и меняется со временем."}, {"q": "Как работает ADWIN?", "a": "Хранит окно последних значений (например, ошибок модели) и проверяет все разбиения окна на «старую» и «новую» части. Если средние частей различаются больше порога, полученного из неравенства Хёфдинга, старая часть отбрасывается — окно сжимается; в стабильный период оно растёт."}, {"q": "За что отвечает параметр delta в ADWIN?", "a": "Это уровень доверия теста: меньшее delta (например, 0.002 по умолчанию в river) — меньше ложных срабатываний, но медленнее обнаружение дрейфа; большее — чувствительнее, но с большим числом ложных тревог."}, {"q": "Почему ADWIN не хранит все элементы окна явно?", "a": "Он использует вариант экспоненциальной гистограммы: элементы сжимаются в корзины размеров степеней двойки, поэтому память и время на элемент — O(log W), где W — длина окна."}, {"q": "Чем экспоненциальное забывание (EWMA) отличается от адаптивного окна?", "a": "EWMA = α·xₜ + (1 − α)·EWMAₜ₋₁ плавно уменьшает вес старых данных с фиксированной скоростью α — это эквивалент окна постоянной эффективной длины. Адаптивное окно меняет длину в зависимости от обнаруженных изменений."}], "advanced_ensembling_cheatsheet.html": [{"q": "Чем стекинг отличается от блендинга по использованию данных?", "a": "**Стекинг** обучает метамодель на out-of-fold предсказаниях по всей обучающей выборке через кросс-валидацию. **Блендинг** откладывает отдельную holdout-часть: базовые модели учатся на остальном, метамодель — на их предсказаниях для holdout. Блендинг проще и защищён от утечек, но тратит данные."}, {"q": "Почему при подборе весов усреднения на той же валидации, где оценивается ансамбль, оценка завышена?", "a": "Веса подгоняются под конкретную выборку, и итоговая метрика оптимистично смещена — особенно при многих моделях и малой валидации. Веса нужно подбирать на одной части (или по OOF-предсказаниям), а качество проверять на отдельной."}, {"q": "Зачем усреднять ранги вместо вероятностей для метрики ROC-AUC?", "a": "ROC-AUC зависит только от порядка объектов, а модели могут выдавать скоры в разных масштабах и с разной калибровкой. Усреднение рангов (rank averaging) уравнивает вклад моделей и не даёт модели с «растянутыми» скорами доминировать."}, {"q": "Что такое многоуровневый стекинг и в чём его риск?", "a": "Предсказания метамоделей первого уровня становятся признаками для модели следующего уровня. Каждый уровень требует отдельной честной схемы out-of-fold, иначе утечки накапливаются; прирост обычно мал, а сложность и время инференса растут многократно."}, {"q": "Что такое hill climbing (жадный отбор моделей) для построения ансамбля?", "a": "Начинают с лучшей модели и итеративно добавляют (возможно, повторно) ту модель из библиотеки, которая сильнее всего улучшает метрику ансамбля на валидации (метод Caruana). Повторное добавление задаёт веса, а ограничение числа шагов снижает переобучение под валидацию."}], "adversarial_attacks_cheatsheet.html": [{"q": "Почему крошечное, незаметное глазу возмущение может сменить предсказание нейросети?", "a": "В высокой размерности малые изменения каждого пикселя по знаку градиента складываются в большое изменение логита: для линейной части wᵀ(x + ε·sign(w)) прирост равен ε·‖w‖₁ и растёт с числом признаков. К тому же модели опираются на неустойчивые, неочевидные человеку признаки."}, {"q": "Чем FGSM отличается от PGD?", "a": "**FGSM** делает один шаг: x' = x + ε·sign(∇ₓL). **PGD** — итеративная версия: много маленьких шагов с проекцией обратно в ε-шар после каждого, часто со случайным стартом. PGD — заметно более сильная атака и стандарт для оценки устойчивости и adversarial training."}, {"q": "Чем white-box атака отличается от black-box и почему black-box атаки вообще работают?", "a": "В white-box атакующий знает архитектуру и веса и считает градиенты напрямую; в black-box — видит только ответы модели. Black-box атаки работают за счёт **переносимости** (примеры, построенные на суррогатной модели, часто обманывают и целевую) и оценки градиента по запросам."}, {"q": "Чем evasion-атаки отличаются от poisoning-атак?", "a": "**Evasion** — изменение входа на этапе инференса, модель не меняется. **Poisoning** — внедрение вредных примеров в обучающие данные (включая backdoor с триггером), чтобы испортить модель или заложить в неё нужное атакующему поведение."}, {"q": "Почему защита через маскировку градиентов (gradient masking) считается ненадёжной?", "a": "Она лишь мешает вычислить полезный градиент (недифференцируемые преобразования, рандомизация), но не убирает сами adversarial-примеры. Адаптивные атаки (BPDA, EOT, transfer-атаки) такие защиты обходят; надёжнее adversarial training и сертифицированные методы вроде randomized smoothing."}], "adversarial_attacks_deep_learning_cheatsheet.html": [{"q": "Почему маленькое, незаметное для человека возмущение может изменить предсказание сети?", "a": "В высокой размерности малое изменение каждого пикселя в направлении градиента суммируется в большое изменение логита: при ε на признак и n признаках сдвиг скалярного произведения ~ ε·‖w‖₁. Гипотеза **линейности** (Goodfellow) объясняет это тем, что сети ведут себя почти линейно локально."}, {"q": "Как работает FGSM и чем от него отличается PGD?", "a": "**FGSM**: x' = x + ε · sign(∇ₓL(x, y)) — один шаг по знаку градиента. **PGD** делает много маленьких шагов с проекцией обратно в ε-шар (часто со случайным стартом) и является гораздо более сильной атакой."}, {"q": "Чем white-box атака отличается от black-box и почему black-box атаки вообще возможны?", "a": "В white-box атакующий знает архитектуру и веса и использует градиенты; в black-box — только запросы к модели. Black-box атаки работают за счёт **переносимости** (transferability) примеров, созданных на суррогатной модели, или оценки градиента по запросам."}, {"q": "Чем targeted атака отличается от untargeted?", "a": "Untargeted атака добивается любого неверного класса (максимизирует потерю на истинном). Targeted — заставляет модель выдать конкретный выбранный класс (минимизирует потерю на целевом классе), это задача сложнее."}, {"q": "Почему важно, в какой норме ограничено возмущение (L∞, L2, L0)?", "a": "От нормы зависит тип атаки: **L∞** ограничивает максимальное изменение каждого пикселя, **L2** — общую энергию возмущения, **L0** — число изменённых пикселей. Защита, устойчивая в одной норме, может быть уязвима в другой, поэтому робастность всегда указывают с нормой и ε."}], "adversarial_robustness_cheatsheet.html": [{"q": "Что такое adversarial-пример?", "a": "Вход с малым, часто незаметным для человека изменением, специально подобранным так, чтобы модель ошиблась — например, панда с почти невидимым шумом классифицируется как гиббон с высокой уверенностью."}, {"q": "Как работает атака FGSM?", "a": "Делает один шаг в направлении знака градиента функции потерь по входу: x' = x + ε·sign(∇ₓL(x, y)). Это максимально увеличивает потерю при ограничении на величину изменения каждого пикселя."}, {"q": "Чем атаки white-box отличаются от black-box?", "a": "White-box — атакующий знает модель и может считать градиенты. Black-box — доступны только ответы модели; используют запросы для оценки градиента или атакуют суррогатную модель и переносят примеры (transferability)."}, {"q": "Что такое adversarial training?", "a": "Обучение на adversarial-примерах, сгенерированных на лету (например, PGD-атакой), вместе с обычными. Это самый надёжный практический способ защиты, но он дорогой и обычно немного снижает точность на чистых данных."}, {"q": "Почему защита через маскирование градиентов ненадёжна?", "a": "Она мешает конкретным градиентным атакам, но не делает модель устойчивой: адаптивные атаки (обход недифференцируемых слоёв, black-box, перенос с другой модели) её обходят. Защиту нужно проверять адаптивными атаками."}], "adversarial_training_cheatsheet.html": [{"q": "Как формулируется adversarial training в виде задачи min-max?", "a": "min_θ E₍ₓ,ᵧ₎ [ max_{‖δ‖≤ε} L(f_θ(x+δ), y) ]: внутренняя максимизация ищет худшее возмущение (обычно через **PGD**), внешняя минимизация обучает веса на этих примерах. Это формулировка Madry et al."}, {"q": "Почему adversarial training обычно снижает точность на чистых данных?", "a": "Модель вынуждена быть устойчивой в ε-окрестности каждой точки и не может использовать хрупкие, но полезные для точности признаки. Наблюдается компромисс **robustness–accuracy**; методы вроде **TRADES** позволяют явно управлять этим балансом."}, {"q": "Почему обучение на FGSM-примерах может дать ложное чувство защищённости?", "a": "Одношаговое обучение склонно к **catastrophic overfitting**: модель учится противостоять именно FGSM, а робастность к PGD внезапно падает почти до нуля. Помогают случайная инициализация, малый шаг и проверка на многошаговой атаке."}, {"q": "Во сколько раз дороже adversarial training с PGD-10 по сравнению с обычным обучением?", "a": "Примерно в 11 раз: на каждый батч нужно 10 проходов вперёд-назад для построения атаки и ещё один для обновления весов. Для ускорения есть «free» и «fast» adversarial training, переиспользующие градиенты."}, {"q": "Даёт ли adversarial training с ε = 8/255 в L∞ защиту от любых атак?", "a": "Нет: только эмпирическую устойчивость к атакам в пределах этой нормы и этого ε. Против больших ε, других норм (L2, повороты, патчи) и распределительных сдвигов модель может быть уязвима; гарантий даёт только **сертифицированная** робастность."}], "affinity_propagation_cheatsheet.html": [{"q": "Как работает affinity propagation?", "a": "Точки обмениваются двумя типами сообщений: responsibility r(i, k) — насколько точка k подходит быть «образцом» (exemplar) для i, и availability a(i, k) — насколько уместно i выбрать k образцом с учётом других точек. Итерации продолжаются до стабилизации, затем каждая точка относится к своему образцу."}, {"q": "Чем центр кластера в affinity propagation отличается от центра в K-means?", "a": "Центр — это реальный объект выборки (exemplar), а не среднее. Это удобно, когда среднее не имеет смысла (тексты, последовательности) или нужен «типичный представитель» кластера."}, {"q": "Как задаётся число кластеров?", "a": "Явно не задаётся. Оно определяется параметром `preference` — диагональю матрицы сходства, «склонностью» точки становиться образцом. Чем выше preference (по умолчанию — медиана сходств), тем больше кластеров; меньшее значение даёт меньше кластеров."}, {"q": "Почему алгоритм иногда не сходится и как с этим бороться?", "a": "Сообщения могут осциллировать. Для этого используется демпфирование (`damping`, от 0.5 до 1): новые сообщения смешиваются со старыми. Если сходимости нет, увеличивают damping и `max_iter`."}, {"q": "Почему affinity propagation не подходит для больших выборок?", "a": "Алгоритм хранит и обновляет матрицы сходства, responsibility и availability размера n×n, то есть O(n²) памяти и времени на итерацию. На десятках тысяч объектов это уже слишком дорого."}], "algorithmic_trading_cheatsheet.html": [{"q": "Что такое look-ahead bias и как он проникает в бэктест?", "a": "Использование информации, недоступной на момент решения: цена закрытия дня для сделки внутри этого дня, нормировка по статистикам всего ряда, пересмотренные позже фундаментальные данные. Бэктест выглядит отлично, а в реальной торговле стратегия не работает."}, {"q": "Почему для торговых моделей нельзя использовать обычную k-fold кросс-валидацию?", "a": "Финансовые ряды автокоррелированы, а метки часто строятся по будущему окну, поэтому перемешивание даёт утечку. Используют walk-forward валидацию или purged k-fold с embargo — удаление из обучения наблюдений, пересекающихся по времени с тестом."}, {"q": "Чем стратегия mean reversion отличается от trend following?", "a": "Mean reversion ставит на возврат цены к среднему (покупка после падения, продажа после роста), trend following — на продолжение движения. Они выигрывают в разных режимах рынка: первая — во флэте, вторая — в устойчивых трендах."}, {"q": "Почему стратегия с отличным бэктестом может терять деньги в реальности?", "a": "Не учтены издержки (комиссии, спред, проскальзывание, влияние на рынок), есть переобучение из-за перебора множества стратегий (data snooping), survivorship bias в данных и смена рыночного режима."}, {"q": "Как рассчитать коэффициент Шарпа по дневным данным?", "a": "Sharpe = (средняя доходность − безрисковая ставка) / σ доходности, для годового значения дневной умножают на √252. Например, средняя дневная избыточная доходность 0.05% при σ = 1% даёт ≈ 0.05 · √252 ≈ 0.79 — доходность на единицу волатильности."}], "als_recommender_cheatsheet.html": [{"q": "Почему метод называется «чередующиеся наименьшие квадраты»?", "a": "Задача поиска P и Q одновременно невыпуклая, но если зафиксировать Q, оптимальные P находятся аналитически как решение гребневой регрессии, и наоборот. ALS чередует эти шаги, и на каждом шаге функция потерь не возрастает."}, {"q": "Чем ALS удобнее SGD для больших данных?", "a": "Векторы всех пользователей при фиксированных объектах вычисляются **независимо**, поэтому шаг хорошо распараллеливается (реализация в Spark MLlib). ALS не требует подбора learning rate и обычно сходится за 10–20 итераций."}, {"q": "Как устроен implicit ALS (Hu, Koren, Volinsky)?", "a": "Взаимодействия переводятся в бинарное предпочтение pᵤᵢ ∈ {0, 1} и уверенность cᵤᵢ = 1 + α·rᵤᵢ (r — число просмотров или покупок). Потери считаются по **всем** парам, включая нулевые, но с малым весом, а вычислительный трюк с YᵀY делает это эффективным."}, {"q": "Что будет при слишком большом α в implicit ALS?", "a": "Модель станет почти полностью полагаться на частые взаимодействия: пользователи с большим числом событий и популярные объекты будут доминировать, а вклад «нулевых» пар станет незначимым. Обычно α подбирают по ранжирующей метрике на валидации; типичные значения — от единиц до десятков."}, {"q": "Как ALS решает холодный старт нового пользователя без переобучения всей модели?", "a": "Если у пользователя появились первые взаимодействия, его вектор можно вычислить за один шаг ALS при фиксированных векторах объектов — это быстрая задача гребневой регрессии. Без взаимодействий вообще ALS бессилен, нужны популярные объекты или контентные признаки."}], "anova_cheatsheet.html": [{"q": "Почему для сравнения нескольких групп используют ANOVA, а не серию попарных t-тестов?", "a": "При k группах нужно k(k − 1)/2 t-тестов, и вероятность хотя бы одной ложной значимости быстро растёт: для 5 групп это 10 тестов и примерно 40% при α = 0.05. ANOVA проверяет одну общую гипотезу о равенстве всех средних, контролируя ошибку первого рода."}, {"q": "На чём основана F-статистика?", "a": "F = (межгрупповая дисперсия) / (внутригрупповая дисперсия) = MS_between / MS_within. Если средние групп равны, обе оценивают одну и ту же дисперсию шума и F ≈ 1; большие значения F говорят о том, что различия между группами больше случайного разброса."}, {"q": "Что значит значимый результат ANOVA и что делать дальше?", "a": "Он говорит лишь о том, что **хотя бы одно** среднее отличается, но не какое. Для выяснения проводят post-hoc тесты с поправкой на множественные сравнения, например критерий Тьюки (Tukey HSD)."}, {"q": "Какие предположения у однофакторной ANOVA и что делать при их нарушении?", "a": "Независимость наблюдений, примерная нормальность остатков в группах и равенство дисперсий (проверяется тестом Левена). При неравных дисперсиях используют ANOVA Уэлча, при сильной ненормальности — непараметрический критерий Краскела — Уоллиса."}, {"q": "Что показывает эффект взаимодействия в двухфакторной ANOVA?", "a": "Что влияние одного фактора зависит от уровня другого: например, удобрение повышает урожай только при поливе. При значимом взаимодействии главные эффекты по отдельности трудно интерпретировать, и анализируют простые эффекты на каждом уровне второго фактора."}], "asr_models_cheatsheet.html": [{"q": "Какую проблему решает функция потерь CTC?", "a": "В ASR длина аудио намного больше длины текста, и неизвестно, какой кадр соответствует какой букве. CTC добавляет символ **blank**, суммирует вероятности всех допустимых выравниваний и позволяет обучаться без покадровой разметки; при декодировании повторы схлопываются и blank удаляется."}, {"q": "Какое ограничение CTC и как его обходят?", "a": "CTC предполагает **условную независимость** выходов на разных кадрах, поэтому модель слабо учитывает языковой контекст. Помогают внешняя языковая модель в beam search, RNN-Transducer или attention-based encoder-decoder (как в Whisper)."}, {"q": "Как считается WER и может ли он быть больше 100%?", "a": "WER = (S + D + I) / N, где S — замены, D — удаления, I — вставки, N — число слов в эталоне. Из-за вставок WER **может превышать 100%**, если модель «нагаллюцинировала»
